<!DOCTYPE html>
<title>Test: chat.js</title>
<style>
body{font:16px system-ui;padding:20px}
#box{width:400px;border:1px solid #ddd;border-radius:8px;overflow:hidden}
.msgs{height:200px;overflow-y:auto;padding:10px;background:#fafafa}
.msg{margin:6px 0;padding:6px 10px;background:#fff;border-radius:6px;display:inline-block}
.msg.sys{color:#888;font-style:italic;background:transparent}
.input-row{display:flex;border-top:1px solid #ddd}
.input-row input{flex:1;border:none;padding:12px}
.input-row button{background:#0077b5;color:#fff;border:none;padding:12px 20px;cursor:pointer}
</style>
<h1>Chat Component Test</h1>
<div id="box"></div>
<script type="module">
import {chat} from '../chat.js'

const c = chat(document.getElementById('box'), text => {
  console.log('Send:', text)
  c.add('You', text)
})

c.add('', 'Welcome to the chat!', true)
c.add('Alice', 'Hello everyone!')
c.add('Bob', 'Hey Alice!')

console.log('chat test: PASS')
</script>
