<!DOCTYPE html>
<title>Test: laser.js</title>
<style>
body{font:16px system-ui;padding:20px;margin:0}
#area{width:100%;height:400px;background:#222;position:relative;border-radius:8px}
canvas{position:absolute;inset:0}
p{color:#fff;position:absolute;top:10px;left:10px;margin:0}
</style>
<h1>Laser Component Test</h1>
<p>Move mouse over the dark area</p>
<div id="area">
  <canvas id="c"></canvas>
  <p>Move your mouse here</p>
</div>
<script type="module">
import {laser} from '../laser.js'

const canvas = document.getElementById('c')
const area = document.getElementById('area')
const l = laser(canvas)

// Resize canvas
const resize = () => {
  canvas.width = area.offsetWidth
  canvas.height = area.offsetHeight
}
resize()
window.onresize = resize

// Track mouse
const color = `hsl(${Math.random()*360},80%,50%)`
area.onmousemove = e => {
  const r = area.getBoundingClientRect()
  l.set('me', e.clientX - r.left, e.clientY - r.top, color)
}
area.onmouseleave = () => l.remove('me')

// Simulate other pointers
l.set('p1', 100, 100, '#f00')
l.set('p2', 200, 150, '#0f0')
l.set('p3', 150, 200, '#00f')

console.log('laser test: PASS')
</script>
