<!DOCTYPE html>
<title>Test: status.js</title>
<style>
body{font:16px system-ui;padding:20px}
.status{padding:10px 20px;border-radius:20px;display:inline-block;margin:10px}
.status.open{background:#dfd;color:#060}
.status.connecting{background:#ffd;color:#860}
.status.error{background:#fdd;color:#600}
button{padding:10px 20px;margin:5px}
</style>
<h1>Status Component Test</h1>
<div id="s1" class="status">...</div>
<div id="s2" class="status">...</div>
<br>
<button onclick="s1.set('connecting')">Connecting</button>
<button onclick="s1.set('open')">Open</button>
<button onclick="s1.set('error')">Error</button>
<script type="module">
import {status} from '../status.js'

// Status with custom labels
window.s1 = status(document.getElementById('s1'), {
  connecting: 'Connecting...',
  open: 'Connected!',
  error: 'Error!'
})

// Status with default labels
window.s2 = status(document.getElementById('s2'))

s1.set('connecting')
s2.set('open')

console.log('status test: PASS')
</script>
