<!DOCTYPE html>
<title>Test: users.js</title>
<style>
body{font:16px system-ui;padding:20px}
.user{display:flex;align-items:center;gap:8px;padding:8px;background:#f5f5f5;margin:4px;border-radius:8px}
.dot{width:12px;height:12px;border-radius:50%}
.name{font-weight:500}
button{padding:8px 16px;margin:4px}
</style>
<h1>Users Component Test</h1>
<div id="list"></div>
<br>
<button onclick="addUser()">Add User</button>
<button onclick="u.clear()">Clear All</button>
<script type="module">
import {users} from '../users.js'

window.u = users(document.getElementById('list'))

let n = 0
window.addUser = () => {
  n++
  u.add('user-' + n, {
    name: 'User ' + n,
    color: `hsl(${Math.random()*360},70%,50%)`
  })
}

// Add initial users
addUser()
addUser()
addUser()

console.log('users test: PASS - count:', u.count())
</script>
