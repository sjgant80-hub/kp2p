<!DOCTYPE html>
<title>Test: reactions.js</title>
<style>
body{font:16px system-ui;padding:20px}
#bar{display:flex;gap:8px;flex-wrap:wrap}
.react{padding:8px 16px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:18px}
.react:hover{background:#f5f5f5}
#log{margin-top:20px;padding:10px;background:#f5f5f5;border-radius:8px}
</style>
<h1>Reactions Component Test</h1>
<div id="bar"></div>
<div id="log">Click reactions above...</div>
<script type="module">
import {reactions} from '../reactions.js'

const log = document.getElementById('log')

const r = reactions(document.getElementById('bar'), emoji => {
  log.textContent = 'You reacted: ' + emoji
  r.add(emoji)
})

// Simulate some existing reactions
r.set('👍', 5)
r.set('❤️', 3)

console.log('reactions test: PASS')
</script>
