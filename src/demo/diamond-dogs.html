<!DOCTYPE html>
<!--
DIAMOND DOGS - Elite P2P Command Center
Global WebRTC P2P with password protection.
Only those with the secret can join the pack.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Diamond Dogs HQ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --gold: #ffd700;
      --gold-dark: #b8860b;
      --diamond: #b9f2ff;
      --bg: #0a0a0f;
      --bg2: #12121a;
      --bg3: #1a1a25;
      --red: #ff3333;
      --green: #00ff88;
      --border: #2a2a3a;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--bg2) 0%, #1a1520 100%);
      border-bottom: 2px solid var(--gold-dark);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 32px;
      filter: drop-shadow(0 0 10px var(--gold));
    }

    .logo-text h1 {
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--diamond) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo-text p {
      font-size: 9px;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 20px;
      padding-left: 20px;
      border-left: 1px solid var(--border);
    }

    .controls label {
      font-size: 11px;
      color: #666;
    }

    .controls input {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--gold);
      font-size: 12px;
      width: 120px;
    }

    .controls input:focus {
      outline: none;
      border-color: var(--gold-dark);
    }

    .controls input.secret {
      font-family: monospace;
      letter-spacing: 2px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #000;
    }

    .btn-gold:hover {
      filter: brightness(1.1);
    }

    .btn-gold:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
      font-size: 12px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.connected {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .status-dot.connecting {
      background: var(--gold);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.5; }
    }

    /* Main Layout */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .sidebar-header .count {
      margin-left: auto;
      background: var(--gold-dark);
      color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }

    .pack-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .member:hover {
      background: var(--bg3);
    }

    .member.self {
      background: rgba(255,215,0,0.1);
      border: 1px solid var(--gold-dark);
    }

    .member-avatar {
      font-size: 24px;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-id {
      font-size: 10px;
      color: #555;
      font-family: monospace;
    }

    /* Log Panel */
    .log-panel {
      border-top: 1px solid var(--border);
      max-height: 120px;
      overflow-y: auto;
      padding: 8px 12px;
      font-size: 10px;
      font-family: monospace;
      color: #555;
      background: #0a0a0a;
    }

    .log-panel .log { margin: 2px 0; }
    .log-panel .log.info { color: var(--gold); }
    .log-panel .log.error { color: var(--red); }
    .log-panel .log.success { color: var(--green); }

    /* Chat Area */
    .chat-area {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 70%;
      display: flex;
      gap: 10px;
    }

    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      font-size: 28px;
      flex-shrink: 0;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.self .message-content {
      align-items: flex-end;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .message-name {
      color: var(--gold);
      font-weight: 600;
    }

    .message-time {
      color: #444;
    }

    .message-bubble {
      padding: 10px 14px;
      background: var(--bg2);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.self .message-bubble {
      background: linear-gradient(135deg, var(--gold-dark) 0%, #8b6914 100%);
      color: #000;
      border-radius: 14px;
      border-bottom-right-radius: 4px;
    }

    .system-msg {
      text-align: center;
      font-size: 11px;
      color: #444;
      padding: 6px;
    }

    .system-msg span {
      padding: 4px 12px;
      background: var(--bg2);
      border-radius: 10px;
    }

    /* Input Area */
    .input-area {
      padding: 14px 16px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-area input:focus {
      border-color: var(--gold-dark);
    }

    .input-area input:disabled {
      opacity: 0.5;
    }

    .input-area button {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border: none;
      border-radius: 20px;
      color: #000;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #333;
    }

    .empty-state .icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .empty-state h3 {
      color: var(--gold);
      font-size: 1rem;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .controls { margin-left: 0; padding-left: 0; border-left: none; flex-wrap: wrap; }
      .status { width: 100%; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-icon">💎🐕</span>
      <div class="logo-text">
        <h1>DIAMOND DOGS</h1>
        <p>Global P2P • Encrypted</p>
      </div>
    </div>

    <div class="controls">
      <label>Den:</label>
      <input type="text" id="roomInput" value="diamond-hq" placeholder="Den name">
      <label>Secret:</label>
      <input type="password" id="secretInput" class="secret" placeholder="Pack secret" value="">
      <button class="btn btn-gold" id="joinBtn">Join Pack</button>
    </div>

    <div class="status">
      <div class="status-item">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Offline</span>
      </div>
      <div class="status-item">
        <span>🐺</span>
        <span id="packCount">0</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>🐺</span>
        <span>Pack</span>
        <span class="count" id="memberCount">0</span>
      </div>
      <div class="pack-list" id="packList">
        <div class="empty-state" style="padding:30px 15px;">
          <div style="font-size:28px;opacity:0.4">🐕</div>
          <div style="font-size:11px;color:#444">No dogs yet</div>
        </div>
      </div>
      <div class="log-panel" id="logPanel"></div>
    </div>

    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="icon">💎🐕</div>
          <h3>Welcome to the Den</h3>
          <p style="font-size:12px">Enter the secret and join the pack</p>
        </div>
      </div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="Speak to the pack..." disabled>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
  </div>

  <script type="module">
    // =========================================================================
    // DIAMOND DOGS - Global P2P via WebTorrent Tracker
    // Password-protected rooms using hash-based access control
    // =========================================================================

    const TRACKER = 'wss://tracker.openwebtorrent.com';
    const ICE = { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]};
    const NUM_OFFERS = 5;
    const DOG_AVATARS = ['🐕','🦮','🐕‍🦺','🐶','🐺','🦊','🐾','💎','🌟','⚡'];

    // DOM
    const $ = id => document.getElementById(id);
    const roomInput = $('roomInput');
    const secretInput = $('secretInput');
    const joinBtn = $('joinBtn');
    const statusDot = $('statusDot');
    const statusText = $('statusText');
    const packCount = $('packCount');
    const memberCount = $('memberCount');
    const packList = $('packList');
    const logPanel = $('logPanel');
    const messagesEl = $('messages');
    const emptyState = $('emptyState');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');

    // Identity
    const myId = 'DD' + Array.from(crypto.getRandomValues(new Uint8Array(6)))
      .map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
    const myAvatar = DOG_AVATARS[Math.floor(Math.random() * DOG_AVATARS.length)];
    const myName = 'Dog-' + myId.slice(2, 6);

    // State
    let ws = null;
    let infoHash = null;
    let peers = new Map();          // peerId -> { pc, dc, info }
    let dataChannels = new Map();   // peerId -> dc
    let pendingOffers = new Map();  // offerId -> { pc, dc }
    let currentRoom = '';
    let currentSecret = '';

    // =========================================================================
    // Logging
    // =========================================================================

    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = 'log ' + type;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logPanel.appendChild(div);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    // =========================================================================
    // Room Hash - includes secret for access control
    // =========================================================================

    async function roomToHash(room, secret) {
      // Combine room + secret so only those with secret can join
      const data = new TextEncoder().encode(`diamond-dogs:${room}:${secret}`);
      const hash = await crypto.subtle.digest('SHA-1', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // =========================================================================
    // WebRTC Peer Connection
    // =========================================================================

    async function generateOffers(count) {
      const offers = [];
      for (let i = 0; i < count; i++) {
        const pc = new RTCPeerConnection(ICE);
        const dc = pc.createDataChannel('diamond-dogs');
        const offerId = crypto.randomUUID();

        await new Promise(resolve => {
          pc.onicecandidate = e => { if (!e.candidate) resolve(); };
          pc.createOffer().then(o => pc.setLocalDescription(o));
        });

        offers.push({
          offer_id: offerId,
          offer: { type: 'offer', sdp: pc.localDescription.sdp }
        });

        pendingOffers.set(offerId, { pc, dc });
        setupPeerConnection(pc, dc, offerId);
      }
      return offers;
    }

    function setupPeerConnection(pc, dc, peerId) {
      dc.onopen = () => {
        log(`Peer connected: ${peerId.slice(0,8)}`, 'success');
        dataChannels.set(peerId, dc);

        // Send our identity
        dc.send(JSON.stringify({
          type: 'identity',
          id: myId,
          name: myName,
          avatar: myAvatar
        }));

        updateUI();
      };

      dc.onclose = () => {
        log(`Peer left: ${peerId.slice(0,8)}`, 'info');
        dataChannels.delete(peerId);
        peers.delete(peerId);
        updateUI();
        addSystemMessage(`A dog left the pack`);
      };

      dc.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          handlePeerMessage(msg, peerId);
        } catch (err) {
          console.error('Message parse error:', err);
        }
      };

      dc.onerror = err => {
        log(`Peer error: ${err.message}`, 'error');
      };
    }

    function handlePeerMessage(msg, peerId) {
      switch (msg.type) {
        case 'identity':
          peers.set(peerId, {
            id: msg.id,
            name: msg.name,
            avatar: msg.avatar
          });
          updateUI();
          addSystemMessage(`${msg.avatar} ${msg.name} joined the pack`);
          break;

        case 'chat':
          addChatMessage(msg);
          break;
      }
    }

    // =========================================================================
    // Tracker Connection
    // =========================================================================

    async function joinRoom(room, secret) {
      // Cleanup
      if (ws) ws.close();
      peers.clear();
      dataChannels.clear();
      pendingOffers.clear();

      currentRoom = room;
      currentSecret = secret;

      statusDot.className = 'status-dot connecting';
      statusText.textContent = 'Connecting...';
      log(`Joining den: ${room}`, 'info');

      // Generate hash with secret
      infoHash = await roomToHash(room, secret);
      log(`Hash: ${infoHash.slice(0,12)}...`);

      // Generate offers
      log('Generating offers...');
      const offers = await generateOffers(NUM_OFFERS);
      log(`Created ${offers.length} offers`);

      // Connect to tracker
      ws = new WebSocket(TRACKER);

      ws.onopen = () => {
        log('Connected to tracker', 'success');
        statusDot.className = 'status-dot connecting';
        statusText.textContent = 'Searching...';

        ws.send(JSON.stringify({
          action: 'announce',
          info_hash: infoHash,
          peer_id: myId,
          numwant: 10,
          uploaded: 0,
          downloaded: 0,
          left: 1,
          offers: offers
        }));
      };

      ws.onmessage = async (e) => {
        try {
          const msg = JSON.parse(e.data);

          if (msg.offer && msg.peer_id !== myId) {
            log(`Offer from ${msg.peer_id.slice(0,8)}`);
            await handleOffer(msg);
          }

          if (msg.answer && msg.offer_id) {
            log(`Answer received`);
            await handleAnswer(msg);
          }

          if (msg.interval) {
            setTimeout(() => reannounce(), msg.interval * 1000);
          }
        } catch (err) {
          console.error('Tracker message error:', err);
        }
      };

      ws.onerror = () => {
        log('Tracker error', 'error');
        statusDot.className = 'status-dot';
        statusText.textContent = 'Error';
      };

      ws.onclose = () => {
        log('Disconnected from tracker', 'info');
        if (dataChannels.size === 0) {
          statusDot.className = 'status-dot';
          statusText.textContent = 'Disconnected';
        }
      };

      // Add self to UI
      updateUI();
    }

    async function reannounce() {
      if (ws?.readyState !== 1) return;
      const offers = await generateOffers(NUM_OFFERS);
      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: myId,
        numwant: 10,
        offers: offers
      }));
    }

    async function handleOffer(msg) {
      const pc = new RTCPeerConnection(ICE);
      const peerId = msg.peer_id;

      pc.ondatachannel = e => {
        const dc = e.channel;
        setupPeerConnection(pc, dc, peerId);
      };

      await pc.setRemoteDescription(msg.offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') resolve();
        else pc.onicecandidate = e => { if (!e.candidate) resolve(); };
      });

      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: myId,
        to_peer_id: peerId,
        answer: { type: 'answer', sdp: pc.localDescription.sdp },
        offer_id: msg.offer_id
      }));
    }

    async function handleAnswer(msg) {
      const pending = pendingOffers.get(msg.offer_id);
      if (!pending) return;
      await pending.pc.setRemoteDescription(msg.answer);
    }

    // =========================================================================
    // Chat
    // =========================================================================

    function broadcast(data) {
      const msg = JSON.stringify(data);
      for (const dc of dataChannels.values()) {
        if (dc.readyState === 'open') {
          dc.send(msg);
        }
      }
    }

    function sendMessage(text) {
      if (!text.trim()) return;

      const msg = {
        type: 'chat',
        id: crypto.randomUUID(),
        userId: myId,
        name: myName,
        avatar: myAvatar,
        text: text.trim(),
        timestamp: Date.now()
      };

      broadcast(msg);
      addChatMessage(msg, true);
      messageInput.value = '';
    }

    function addChatMessage(msg, isSelf = false) {
      if (msg.userId === myId && !isSelf) return; // Skip duplicates

      if (emptyState) {
        emptyState.style.display = 'none';
      }

      const div = document.createElement('div');
      div.className = `message${isSelf || msg.userId === myId ? ' self' : ''}`;
      div.innerHTML = `
        <span class="message-avatar">${msg.avatar}</span>
        <div class="message-content">
          <div class="message-header">
            <span class="message-name">${isSelf ? 'You' : msg.name}</span>
            <span class="message-time">${formatTime(msg.timestamp)}</span>
          </div>
          <div class="message-bubble">${escapeHtml(msg.text)}</div>
        </div>
      `;

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.innerHTML = `<span>${text}</span>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =========================================================================
    // UI Updates
    // =========================================================================

    function updateUI() {
      const count = dataChannels.size;
      packCount.textContent = count;
      memberCount.textContent = count + 1; // Include self

      // Update status
      if (count > 0) {
        statusDot.className = 'status-dot connected';
        statusText.textContent = `${count} connected`;
        messageInput.disabled = false;
        sendBtn.disabled = false;
      } else if (ws?.readyState === 1) {
        statusDot.className = 'status-dot connecting';
        statusText.textContent = 'Waiting for pack...';
        messageInput.disabled = true;
        sendBtn.disabled = true;
      }

      // Update member list
      packList.innerHTML = '';

      // Add self first
      const selfDiv = document.createElement('div');
      selfDiv.className = 'member self';
      selfDiv.innerHTML = `
        <span class="member-avatar">${myAvatar}</span>
        <div class="member-info">
          <div class="member-name">${myName} (you)</div>
          <div class="member-id">${myId}</div>
        </div>
      `;
      packList.appendChild(selfDiv);

      // Add peers
      peers.forEach((peer, peerId) => {
        const div = document.createElement('div');
        div.className = 'member';
        div.innerHTML = `
          <span class="member-avatar">${peer.avatar || '🐕'}</span>
          <div class="member-info">
            <div class="member-name">${peer.name || peerId.slice(0,8)}</div>
            <div class="member-id">${peer.id || peerId.slice(0,12)}</div>
          </div>
        `;
        packList.appendChild(div);
      });
    }

    // =========================================================================
    // Event Handlers
    // =========================================================================

    joinBtn.addEventListener('click', () => {
      const room = roomInput.value.trim() || 'diamond-hq';
      const secret = secretInput.value.trim();

      if (!secret) {
        alert('Enter the pack secret to join!');
        secretInput.focus();
        return;
      }

      joinRoom(room, secret);
    });

    roomInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') joinBtn.click();
    });

    secretInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') joinBtn.click();
    });

    sendBtn.addEventListener('click', () => sendMessage(messageInput.value));

    messageInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage(messageInput.value);
    });

    // =========================================================================
    // Init
    // =========================================================================

    // Check URL params
    const params = new URLSearchParams(location.search);
    if (params.get('room')) roomInput.value = params.get('room');
    if (params.get('secret')) {
      secretInput.value = params.get('secret');
      // Auto-join if both provided
      setTimeout(() => joinBtn.click(), 500);
    }

    log(`Your ID: ${myId}`, 'info');
    log(`Your name: ${myName}`, 'info');
    log('Enter den name and secret to join', 'info');

    console.log(`

    ║      Global P2P • Password Protected     ║
    ╠══════════════════════════════════════════╣
    ║  ID: ${myId.padEnd(32)}  ║
    ║  Name: ${myName.padEnd(30)}  ║
    ╚══════════════════════════════════════════╝
    `);
  </script>
