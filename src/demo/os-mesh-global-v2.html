<!DOCTYPE html>
<!--
@file src/demo/os-mesh-global-v2.html
@desc P2P OS Mesh v2 - Auto-connect with global chat
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P OS Mesh v2</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --green: #3fb950;
      --purple: #a371f7;
      --orange: #d29922;
      --border: #30363d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 12px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header h1 { font-size: 1.2rem; color: var(--accent); }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.green { background: #23883433; color: var(--green); }
    .badge.purple { background: #a371f733; color: var(--purple); }

    .stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 12px;
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-val { color: var(--accent); font-weight: bold; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .dot.on { background: var(--green); }
    .dot.pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    /* Main layout */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }

    .panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .panel-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Terminal */
    .terminal {
      flex: 1;
      background: #000;
      padding: 12px;
      overflow-y: auto;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .terminal .line { margin-bottom: 2px; }
    .terminal .prompt { color: var(--green); }
    .terminal .output { color: #8b949e; }
    .terminal .error { color: #f85149; }
    .terminal .info { color: var(--accent); }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .input-row input, .input-row textarea {
      flex: 1;
      padding: 8px 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .input-row input:focus, .input-row textarea:focus {
      border-color: var(--accent);
    }
    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--bg3); color: var(--fg); }
    .btn:hover { opacity: 0.9; }

    /* Chat */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .chat-msg {
      margin-bottom: 12px;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }
    .chat-msg.self .chat-bubble {
      background: var(--accent);
      color: #000;
      margin-left: auto;
    }
    .chat-meta {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    .chat-msg.self .chat-meta {
      text-align: right;
    }
    .chat-bubble {
      display: inline-block;
      max-width: 80%;
      padding: 8px 12px;
      background: var(--bg2);
      border-radius: 12px;
      font-size: 13px;
      word-break: break-word;
    }
    .chat-bubble.system {
      background: transparent;
      color: #666;
      font-style: italic;
      font-size: 12px;
    }

    /* Peers */
    .peer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      padding: 12px;
      overflow-y: auto;
    }
    .peer-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .peer-card.self {
      border-color: var(--green);
    }
    .peer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg3);
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .peer-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .peer-status {
      font-size: 10px;
      color: var(--green);
    }

    /* Files */
    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg2);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .file-item:hover {
      background: var(--bg3);
    }
    .file-icon { font-size: 16px; }
    .file-name { flex: 1; }
    .file-size { color: #666; font-size: 11px; }
    .file-owner { color: var(--purple); font-size: 10px; }

    .empty-state {
      color: #666;
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 800px) {
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌐 P2P OS Mesh</h1>
    <span class="badge green">v2</span>
    <span class="badge purple">Global Chat</span>
    <div class="stats">
      <div class="stat">
        <span class="dot" id="connDot"></span>
        <span id="connStatus">Connecting...</span>
      </div>
      <div class="stat">
        <span>👥</span>
        <span class="stat-val" id="peerCount">1</span>
      </div>
      <div class="stat">
        <span>💬</span>
        <span class="stat-val" id="msgCount">0</span>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- Terminal -->
    <div class="panel">
      <div class="panel-header">
        <span>💻</span>
        <span>Terminal</span>
        <span style="margin-left:auto;color:#666;font-size:11px" id="vmId"></span>
      </div>
      <div class="panel-body">
        <div class="terminal" id="terminal"></div>
        <div class="input-row">
          <input type="text" id="cmdInput" placeholder="Type command...">
          <button class="btn btn-primary" id="runBtn">Run</button>
        </div>
      </div>
    </div>

    <!-- Global Chat -->
    <div class="panel">
      <div class="panel-header">
        <span>💬</span>
        <span>Global Chat</span>
        <button class="btn btn-secondary" style="margin-left:auto;font-size:10px;padding:4px 8px" id="clearChatBtn">Clear</button>
      </div>
      <div class="panel-body">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="input-row">
          <input type="text" id="chatInput" placeholder="Type message...">
          <button class="btn btn-primary" id="sendChatBtn">Send</button>
        </div>
      </div>
    </div>

    <!-- Peers -->
    <div class="panel">
      <div class="panel-header">
        <span>👥</span>
        <span>Connected Peers</span>
      </div>
      <div class="panel-body">
        <div class="peer-grid" id="peerGrid"></div>
      </div>
    </div>

    <!-- Shared Files -->
    <div class="panel">
      <div class="panel-header">
        <span>📁</span>
        <span>Shared Files</span>
        <button class="btn btn-secondary" style="margin-left:auto;font-size:10px;padding:4px 8px" id="newFileBtn">+ New</button>
      </div>
      <div class="panel-body">
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);

    // Generate identity
    const myId = 'user-' + Math.random().toString(36).slice(2, 6);
    const myName = myId;
    const myEmoji = ['😀','😎','🤖','👾','🦊','🐱','🐶','🦁','🐼','🐨','🦋','🌟'][Math.floor(Math.random() * 12)];
    $('vmId').textContent = myId;

    // State
    const peers = new Map();
    const sharedFiles = new Map();
    const chatHistory = [];
    let channel = null;
    let msgCount = 0;

    // Initialize self
    peers.set(myId, { name: myName, emoji: myEmoji, self: true, online: true });

    // Terminal output
    function termPrint(text, type = 'output') {
      const line = document.createElement('div');
      line.className = `line ${type}`;
      line.textContent = text;
      $('terminal').appendChild(line);
      $('terminal').scrollTop = $('terminal').scrollHeight;
    }

    // Chat message
    function addChatMsg(senderId, text, isSystem = false) {
      const peer = peers.get(senderId);
      const isSelf = senderId === myId;

      const div = document.createElement('div');
      div.className = `chat-msg ${isSelf ? 'self' : ''}`;

      if (isSystem) {
        div.innerHTML = `<div class="chat-bubble system">${escapeHtml(text)}</div>`;
      } else {
        div.innerHTML = `
          <div class="chat-meta">${escapeHtml(peer?.emoji || '👤')} ${escapeHtml(peer?.name || senderId)}</div>
          <div class="chat-bubble">${escapeHtml(text)}</div>
        `;
      }

      $('chatMessages').appendChild(div);
      $('chatMessages').scrollTop = $('chatMessages').scrollHeight;

      msgCount++;
      $('msgCount').textContent = msgCount;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Update peer grid
    function updatePeers() {
      const grid = $('peerGrid');
      $('peerCount').textContent = peers.size;

      if (peers.size === 0) {
        grid.innerHTML = '<div class="empty-state">No peers connected</div>';
        return;
      }

      grid.innerHTML = '';
      for (const [id, peer] of peers) {
        const card = document.createElement('div');
        card.className = `peer-card ${peer.self ? 'self' : ''}`;
        card.innerHTML = `
          <div class="peer-avatar">${escapeHtml(peer.emoji || '👤')}</div>
          <div class="peer-name">${escapeHtml(peer.name || id)}</div>
          <div class="peer-status">${peer.self ? '(you)' : 'online'}</div>
        `;
        grid.appendChild(card);
      }
    }

    // Update file list
    function updateFiles() {
      const list = $('fileList');

      if (sharedFiles.size === 0) {
        list.innerHTML = '<div class="empty-state">No shared files yet.<br>Create one or share via terminal.</div>';
        return;
      }

      list.innerHTML = '';
      for (const [path, file] of sharedFiles) {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span class="file-icon">📄</span>
          <span class="file-name">${escapeHtml(path)}</span>
          <span class="file-owner">${escapeHtml(file.owner || 'unknown')}</span>
          <span class="file-size">${file.content.length}b</span>
        `;
        div.onclick = () => {
          termPrint(`$ cat ${path}`, 'prompt');
          termPrint(file.content);
        };
        list.appendChild(div);
      }
    }

    // BroadcastChannel for communication
    function initChannel() {
      try {
        channel = new BroadcastChannel('konomi-os-mesh-v2');

        channel.onmessage = (e) => {
          const msg = e.data;
          if (msg.senderId === myId) return;

          switch (msg.type) {
            case 'join':
              if (!peers.has(msg.senderId)) {
                peers.set(msg.senderId, {
                  name: msg.name,
                  emoji: msg.emoji,
                  online: true
                });
                updatePeers();
                addChatMsg(null, `${msg.emoji} ${msg.name} joined`, true);

                // Send welcome back
                channel.postMessage({
                  type: 'welcome',
                  senderId: myId,
                  name: myName,
                  emoji: myEmoji,
                  files: [...sharedFiles].map(([k, v]) => [k, v]),
                });
              }
              break;

            case 'welcome':
              if (!peers.has(msg.senderId)) {
                peers.set(msg.senderId, {
                  name: msg.name,
                  emoji: msg.emoji,
                  online: true
                });
                updatePeers();

                // Sync files
                if (msg.files) {
                  for (const [path, file] of msg.files) {
                    if (!sharedFiles.has(path)) {
                      sharedFiles.set(path, file);
                    }
                  }
                  updateFiles();
                }
              }
              break;

            case 'leave':
              if (peers.has(msg.senderId)) {
                const peer = peers.get(msg.senderId);
                addChatMsg(null, `${peer.emoji} ${peer.name} left`, true);
                peers.delete(msg.senderId);
                updatePeers();
              }
              break;

            case 'chat':
              addChatMsg(msg.senderId, msg.text);
              break;

            case 'file':
              sharedFiles.set(msg.path, {
                content: msg.content,
                owner: msg.owner
              });
              updateFiles();
              break;
          }
        };

        // Announce join
        channel.postMessage({
          type: 'join',
          senderId: myId,
          name: myName,
          emoji: myEmoji,
        });

        // Heartbeat to detect stale peers
        setInterval(() => {
          channel.postMessage({
            type: 'join',
            senderId: myId,
            name: myName,
            emoji: myEmoji,
          });
        }, 10000);

        // Leave on close
        window.addEventListener('beforeunload', () => {
          channel.postMessage({ type: 'leave', senderId: myId });
        });

        $('connDot').className = 'dot on';
        $('connStatus').textContent = 'Connected';

      } catch (e) {
        $('connDot').className = 'dot';
        $('connStatus').textContent = 'Error';
        termPrint('Connection error: ' + e.message, 'error');
      }
    }

    // Terminal commands
    const commands = {
      help: () => `Commands:
  help          Show this help
  whoami        Show your ID
  peers         List connected peers
  ls            List shared files
  cat <file>    View file contents
  write <file> <content>  Create/update file
  broadcast <msg>  Send to all peers
  clear         Clear terminal`,
      whoami: () => `${myEmoji} ${myName} (${myId})`,
      peers: () => [...peers.values()].map(p => `${p.emoji} ${p.name}${p.self ? ' (you)' : ''}`).join('\n'),
      ls: () => sharedFiles.size ? [...sharedFiles.keys()].join('\n') : '(no files)',
      cat: (args) => {
        const path = args[0];
        if (!path) return 'Usage: cat <filename>';
        const file = sharedFiles.get(path) || sharedFiles.get('/' + path);
        return file ? file.content : 'File not found: ' + path;
      },
      write: (args) => {
        const path = args[0];
        const content = args.slice(1).join(' ');
        if (!path) return 'Usage: write <filename> <content>';
        const fullPath = path.startsWith('/') ? path : '/' + path;
        const file = { content, owner: myId };
        sharedFiles.set(fullPath, file);
        updateFiles();
        channel?.postMessage({ type: 'file', senderId: myId, path: fullPath, content, owner: myId });
        return `Created ${fullPath}`;
      },
      broadcast: (args) => {
        const text = args.join(' ');
        if (!text) return 'Usage: broadcast <message>';
        channel?.postMessage({ type: 'chat', senderId: myId, text });
        addChatMsg(myId, text);
        return '';
      },
      clear: () => { $('terminal').innerHTML = ''; return ''; },
    };

    function runCommand() {
      const input = $('cmdInput').value.trim();
      if (!input) return;
      $('cmdInput').value = '';

      termPrint(`$ ${input}`, 'prompt');
      const [cmd, ...args] = input.split(' ');

      if (commands[cmd]) {
        const result = commands[cmd](args);
        if (result) termPrint(result);
      } else {
        termPrint(`Command not found: ${cmd}. Type 'help' for commands.`, 'error');
      }
    }

    $('runBtn').onclick = runCommand;
    $('cmdInput').onkeydown = (e) => { if (e.key === 'Enter') runCommand(); };

    // Chat
    function sendChat() {
      const text = $('chatInput').value.trim();
      if (!text) return;
      $('chatInput').value = '';

      channel?.postMessage({ type: 'chat', senderId: myId, text });
      addChatMsg(myId, text);
    }

    $('sendChatBtn').onclick = sendChat;
    $('chatInput').onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };
    $('clearChatBtn').onclick = () => { $('chatMessages').innerHTML = ''; msgCount = 0; $('msgCount').textContent = '0'; };

    // New file
    $('newFileBtn').onclick = () => {
      const name = prompt('File name:');
      if (!name) return;
      const content = prompt('Content:') || '';
      const path = '/' + name.replace(/^\//, '');
      const file = { content, owner: myId };
      sharedFiles.set(path, file);
      updateFiles();
      channel?.postMessage({ type: 'file', senderId: myId, path, content, owner: myId });
      termPrint(`Created ${path}`, 'info');
    };

    // Load saved data
    try {
      const saved = localStorage.getItem('os-mesh-v2-files');
      if (saved) {
        for (const [k, v] of JSON.parse(saved)) {
          sharedFiles.set(k, v);
        }
        updateFiles();
      }
    } catch (e) {}

    // Auto-save
    setInterval(() => {
      try {
        localStorage.setItem('os-mesh-v2-files', JSON.stringify([...sharedFiles]));
      } catch (e) {}
    }, 5000);

    // Initialize
    termPrint('Welcome to P2P OS Mesh v2!', 'info');
    termPrint('Open this page in another tab to connect.', 'info');
    termPrint("Type 'help' for commands.", 'info');
    termPrint('', 'output');

    updatePeers();
    updateFiles();
    initChannel();

    addChatMsg(null, 'Welcome! You are connected to the global mesh.', true);
  </script>
</body>
</html>
