<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn P2P Workspace</title>
<style>
:root{--li:#0077b5;--bg:#f3f2ef;--card:#fff;--text:#333;--muted:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px -apple-system,sans-serif;background:var(--bg);color:var(--text)}

.app{display:grid;grid-template-columns:240px 1fr 260px;height:100vh}
.sidebar{background:var(--card);border-right:1px solid #ddd;padding:16px;display:flex;flex-direction:column;gap:12px}
.main{position:relative;display:flex;flex-direction:column}
.panel{background:var(--card);border-left:1px solid #ddd;display:flex;flex-direction:column}

.logo{font-size:22px;font-weight:700;color:var(--li)}
.status{padding:6px 12px;border-radius:16px;font-size:12px;text-align:center}
.status.open{background:#dfd;color:#060}
.status.connecting{background:#ffd;color:#860}

.user{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px}
.user:hover{background:#f5f5f5}
.user .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.user .name{font-size:13px}

.toolbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid #eee;flex-wrap:wrap}
.toolbar button{padding:6px 14px;border:1px solid #ddd;border-radius:16px;background:#fff;cursor:pointer;font-size:12px}
.toolbar button:hover{background:#f5f5f5}
.toolbar button.active{background:var(--li);color:#fff;border-color:var(--li)}

.canvas-wrap{flex:1;position:relative;background:#fff}
#laser{position:absolute;inset:0;pointer-events:none}

.msgs{flex:1;overflow-y:auto;padding:10px;min-height:0}
.msg{margin:6px 0;font-size:13px}
.msg.sys{color:var(--muted);font-style:italic}
.input-row{display:flex;border-top:1px solid #eee}
.input-row input{flex:1;border:none;padding:10px;font-size:13px}
.input-row button{background:var(--li);color:#fff;border:none;padding:10px 16px;cursor:pointer}

.reactions{padding:10px;border-top:1px solid #eee;display:flex;gap:4px;flex-wrap:wrap}
.react{padding:4px 10px;border:1px solid #ddd;border-radius:14px;background:#fff;cursor:pointer}
.react:hover{background:#f5f5f5}

.chat-header{padding:10px;border-bottom:1px solid #eee;font-weight:600;color:var(--li);font-size:13px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#fff;padding:24px;border-radius:12px;width:300px}
.modal-box h3{margin-bottom:16px;color:var(--li)}
.modal-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:16px}
.modal-box input:focus{outline:none;border-color:var(--li)}
.modal-box button{width:100%;padding:12px;background:var(--li);color:#fff;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo">in Workspace</div>
    <div id="status" class="status connecting">Connecting...</div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">PARTICIPANTS</div>
    <div id="users"></div>
  </div>

  <div class="main">
    <div class="toolbar">
      <button id="t-pointer" class="active">👆 Pointer</button>
      <button id="t-laser">🔴 Laser</button>
      <button id="t-note">📝 Note</button>
    </div>
    <div class="canvas-wrap" id="area">
      <canvas id="laser"></canvas>
    </div>
  </div>

  <div class="panel">
    <div class="chat-header">💬 Chat</div>
    <div id="chat" style="flex:1;display:flex;flex-direction:column"></div>
    <div id="reactions" class="reactions"></div>
  </div>
</div>

<div id="modal" class="modal show">
  <div class="modal-box">
    <h3>Join Workspace</h3>
    <input type="text" id="inp-name" placeholder="Your name" autofocus>
    <input type="text" id="inp-room" placeholder="Room (optional)">
    <button id="btn-join">Join</button>
  </div>
</div>

<script type="module">
import {$} from '../../p2p/dom.js'
import {mesh} from '../../p2p/mesh.js'
import {status} from '../../p2p/status.js'
import {users} from '../../p2p/users.js'
import {chat} from '../../p2p/chat.js'
import {laser} from '../../p2p/laser.js'
import {reactions} from '../../p2p/reactions.js'

let name = '', color = `hsl(${Math.random()*360},70%,50%)`, tool = 'pointer', net

// Init components
const st = status($('status'), {open:'Connected', connecting:'Connecting...'})
const ul = users($('users'))
const lz = laser($('laser'))
let ch, rx

// Resize laser
const resize = () => { $('laser').width = $('area').offsetWidth; $('laser').height = $('area').offsetHeight }
resize()
window.onresize = resize

// Join
$('btn-join').onclick = () => {
  name = $('inp-name').value.trim() || 'User-' + Math.random().toString(36).slice(2,6)
  const room = $('inp-room').value.trim() || 'linkedin-workspace'
  $('modal').classList.remove('show')
  start(room)
}
$('inp-name').onkeydown = e => e.key === 'Enter' && $('btn-join').click()
$('inp-room').onkeydown = e => e.key === 'Enter' && $('btn-join').click()

function start(room) {
  // Chat
  ch = chat($('chat'), text => {
    ch.add(name, text)
    net.send({t:'chat', name, text})
  })
  ch.add('', 'Welcome!', true)

  // Reactions
  rx = reactions($('reactions'), e => {
    rx.add(e)
    net.send({t:'react', e})
  })

  // P2P
  net = mesh(room, {
    open: () => {
      st.set('open')
      net.send({t:'join', name, color})
    },
    peer: pid => {
      net.send({t:'join', name, color})
      ch.add('', 'Someone joined', true)
    },
    left: pid => {
      ul.remove(pid)
      lz.remove(pid)
      ch.add('', 'Someone left', true)
    },
    msg: (m, pid) => {
      if (m.t === 'join') ul.add(pid, {name:m.name, color:m.color})
      if (m.t === 'chat') ch.add(m.name, m.text)
      if (m.t === 'laser') lz.set(pid, m.x, m.y, m.c)
      if (m.t === 'laser-off') lz.remove(pid)
      if (m.t === 'react') rx.add(m.e)
    }
  })
  net.connect()
  ul.add('me', {name: name + ' (you)', color})
}

// Tools
const tools = ['pointer', 'laser', 'note']
tools.forEach(t => {
  $('t-'+t).onclick = () => {
    tool = t
    tools.forEach(x => $('t-'+x).classList.toggle('active', x===t))
    if (t === 'note') {
      const text = prompt('Note:')
      if (text) ch.add(name, '📝 ' + text)
    }
  }
})

// Laser
$('area').onmousemove = e => {
  if (tool !== 'laser' || !net) return
  const r = $('area').getBoundingClientRect()
  const x = e.clientX - r.left, y = e.clientY - r.top
  lz.set('me', x, y, color)
  net.send({t:'laser', x, y, c:color})
}
$('area').onmouseleave = () => {
  lz.remove('me')
  if (net) net.send({t:'laser-off'})
}
</script>
</body>
</html>
