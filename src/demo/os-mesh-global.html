<!DOCTYPE html>
<!--
@file src/demo/os-mesh-global.html
@desc P2P OS Mesh - Auto-connects all VMs globally (no invite links)
      Uses BroadcastChannel for same-browser, WebRTC for cross-browser
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P OS Mesh - Global</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --green: #3fb950;
      --border: #30363d;
    }
    body {
      font-family: 'SF Mono', Monaco, monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 1.3rem; color: var(--accent); }
    .badge { padding: 4px 10px; background: #1f6feb33; color: var(--accent); border-radius: 12px; font-size: 11px; }
    .badge.green { background: #23883433; color: var(--green); }

    .stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 12px;
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-val { color: var(--accent); font-weight: bold; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.on { background: var(--green); }
    .dot.off { background: #666; }
    .dot.pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: #21262d;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-body { padding: 16px; }

    /* Terminal */
    .terminal {
      background: #000;
      border-radius: 6px;
      padding: 12px;
      height: 300px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .terminal .line { margin-bottom: 2px; }
    .terminal .prompt { color: var(--green); }
    .terminal .output { color: #8b949e; }
    .terminal .error { color: #f85149; }
    .terminal .info { color: var(--accent); }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
    }
    .input-row input:focus { outline: none; border-color: var(--accent); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #21262d; color: var(--fg); border: 1px solid var(--border); }

    /* Peer list */
    .peer-list { max-height: 200px; overflow-y: auto; }
    .peer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .peer:last-child { border-bottom: none; }
    .peer-id { color: #8b949e; font-size: 11px; }
    .peer-name { color: var(--accent); }
    .peer.self { color: var(--green); }

    /* File list */
    .file-list { font-size: 12px; max-height: 200px; overflow-y: auto; }
    .file-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
    .file-item:hover { color: var(--accent); }

    /* Log */
    .log { font-size: 11px; max-height: 150px; overflow-y: auto; color: #8b949e; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #21262d; }
    .log-time { color: #484f58; margin-right: 8px; }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌐 P2P OS Mesh</h1>
    <span class="badge green">Global Auto-Connect</span>
    <div class="stats">
      <div class="stat">
        <span class="dot" id="connDot"></span>
        <span id="connStatus">Initializing...</span>
      </div>
      <div class="stat">
        <span>Peers:</span>
        <span class="stat-val" id="peerCount">0</span>
      </div>
      <div class="stat">
        <span>Files:</span>
        <span class="stat-val" id="fileCount">0</span>
      </div>
    </div>
  </div>

  <div class="grid">
    <!-- Local Terminal -->
    <div class="panel">
      <div class="panel-header">
        <span>💻</span>
        <span>Terminal</span>
        <span id="vmId" style="margin-left:auto;color:#8b949e;font-size:11px"></span>
      </div>
      <div class="panel-body">
        <div class="terminal" id="terminal"></div>
        <div class="input-row">
          <input type="text" id="cmdInput" placeholder="Enter command...">
          <button class="btn btn-primary" id="runBtn">Run</button>
        </div>
      </div>
    </div>

    <!-- Connected Peers -->
    <div class="panel">
      <div class="panel-header">
        <span>👥</span>
        <span>Connected Peers</span>
      </div>
      <div class="panel-body">
        <div class="peer-list" id="peerList">
          <div style="color:#8b949e;font-size:12px">Looking for peers...</div>
        </div>
      </div>
    </div>

    <!-- Shared Files -->
    <div class="panel">
      <div class="panel-header">
        <span>📁</span>
        <span>Shared Files</span>
        <button class="btn btn-secondary" style="margin-left:auto;padding:6px 12px;font-size:11px" id="newFileBtn">+ New</button>
      </div>
      <div class="panel-body">
        <div class="file-list" id="fileList">
          <div style="color:#8b949e;font-size:12px">No files yet</div>
        </div>
      </div>
    </div>

    <!-- Activity Log -->
    <div class="panel">
      <div class="panel-header">
        <span>📋</span>
        <span>Activity Log</span>
        <button class="btn btn-secondary" style="margin-left:auto;padding:6px 12px;font-size:11px" id="clearLogBtn">Clear</button>
      </div>
      <div class="panel-body">
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);

    // WebTorrent tracker for REAL global P2P
    const TRACKER = 'wss://tracker.openwebtorrent.com';
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    const ROOM = 'konomi-os-mesh-global';
    const NUM_OFFERS = 5;

    // XSS protection
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Generate VM ID - must be 20 bytes for WebTorrent
    const vmId = '-KM0001-' + Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => b.toString(16).padStart(2,'0')).join('');
    $('vmId').textContent = vmId;

    // State
    const peers = new Map();
    const sharedFiles = new Map();
    let channel = null;
    let ws = null;
    let infoHash = null;
    let dataChannels = new Map();
    let pendingOffers = new Map();

    // Convert room name to 20-byte info_hash (hex)
    async function roomToHash(name) {
      const data = new TextEncoder().encode('konomi:' + name);
      const hash = await crypto.subtle.digest('SHA-1', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Generate WebRTC offers upfront
    async function generateOffers(count) {
      const offers = [];
      for (let i = 0; i < count; i++) {
        const pc = new RTCPeerConnection(ICE);
        const dc = pc.createDataChannel('mesh');
        const offerId = crypto.randomUUID();

        await new Promise(resolve => {
          pc.onicecandidate = e => { if (!e.candidate) resolve(); };
          pc.createOffer().then(o => pc.setLocalDescription(o));
        });

        offers.push({
          offer_id: offerId,
          offer: { type: 'offer', sdp: pc.localDescription.sdp }
        });
        pendingOffers.set(offerId, { pc, dc });
        setupPeerConnection(pc, dc, offerId);
      }
      return offers;
    }

    function setupPeerConnection(pc, dc, id) {
      dc.onopen = () => {
        log(`WebRTC peer connected: ${id.slice(0,8)}`);
        dataChannels.set(id, dc);
        peers.set(id, { joined: Date.now(), webrtc: true });
        updatePeers();
        // Send our files to new peer
        for (const [path, content] of sharedFiles) {
          dc.send(JSON.stringify({ type: 'file', vmId, path, content }));
        }
      };
      dc.onclose = () => {
        dataChannels.delete(id);
        peers.delete(id);
        updatePeers();
        log(`WebRTC peer disconnected: ${id.slice(0,8)}`);
      };
      dc.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'file' && msg.vmId !== vmId) {
            sharedFiles.set(msg.path, msg.content);
            updateFiles();
            log(`File synced from ${msg.vmId.slice(0,8)}: ${msg.path}`);
          }
          if (msg.type === 'announce' && msg.vmId !== vmId) {
            peers.set(msg.vmId, { joined: Date.now(), webrtc: true });
            updatePeers();
          }
        } catch (err) {
          console.error('WebRTC message error:', err);
        }
      };
    }

    async function handleOffer(msg) {
      const pc = new RTCPeerConnection(ICE);
      const peerId = msg.peer_id;

      pc.ondatachannel = e => {
        const dc = e.channel;
        peers.set(peerId, { joined: Date.now(), webrtc: true });
        setupPeerConnection(pc, dc, peerId);
      };

      await pc.setRemoteDescription(msg.offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      // Wait for ICE gathering
      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') resolve();
        else pc.onicecandidate = e => { if (!e.candidate) resolve(); };
      });

      // Send answer back via tracker
      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: vmId,
        to_peer_id: peerId,
        answer: { type: 'answer', sdp: pc.localDescription.sdp },
        offer_id: msg.offer_id
      }));
    }

    async function handleAnswer(msg) {
      const pending = pendingOffers.get(msg.offer_id);
      if (!pending) return;
      const { pc, dc } = pending;
      await pc.setRemoteDescription(msg.answer);
    }

    async function reannounce() {
      if (ws?.readyState !== 1) return;
      const offers = await generateOffers(NUM_OFFERS);
      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: vmId,
        numwant: 10,
        offers: offers
      }));
    }

    // Broadcast file to all WebRTC peers
    function broadcastFile(path, content) {
      const msg = JSON.stringify({ type: 'file', vmId, path, content });
      for (const dc of dataChannels.values()) {
        if (dc.readyState === 'open') dc.send(msg);
      }
    }

    // Join global mesh via WebTorrent tracker
    async function joinMesh() {
      infoHash = await roomToHash(ROOM);
      log(`Joining global mesh: ${ROOM}`);
      log(`Hash: ${infoHash.slice(0,16)}...`);
      $('connDot').className = 'dot pulse';
      $('connStatus').textContent = 'Connecting...';

      // Generate offers before connecting
      const offers = await generateOffers(NUM_OFFERS);

      // Connect to tracker
      ws = new WebSocket(TRACKER);

      ws.onopen = () => {
        log('Connected to WebTorrent tracker');
        $('connDot').className = 'dot on';
        $('connStatus').textContent = 'Connected (Global)';
        // Announce with offers
        ws.send(JSON.stringify({
          action: 'announce',
          info_hash: infoHash,
          peer_id: vmId,
          numwant: 10,
          uploaded: 0,
          downloaded: 0,
          left: 1,
          offers: offers
        }));
      };

      ws.onmessage = async (e) => {
        try {
          const msg = JSON.parse(e.data);

          if (msg.offer && msg.peer_id !== vmId) {
            log(`Offer from ${msg.peer_id.slice(0,8)}`);
            await handleOffer(msg);
          }

          if (msg.answer && msg.offer_id) {
            log(`Answer received`);
            await handleAnswer(msg);
          }

          if (msg.interval) {
            setTimeout(() => reannounce(), msg.interval * 1000);
          }
        } catch (err) {
          console.error('Tracker message error:', err);
        }
      };

      ws.onerror = () => {
        log('Tracker connection error');
        $('connDot').className = 'dot off';
        $('connStatus').textContent = 'Error';
      };

      ws.onclose = () => {
        log('Tracker disconnected - will reconnect');
        $('connDot').className = 'dot off';
        $('connStatus').textContent = 'Disconnected';
        // Auto-reconnect after 5 seconds
        setTimeout(() => joinMesh(), 5000);
      };
    }

    // Logging
    function log(msg) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">${new Date().toLocaleTimeString()}</span>${escapeHtml(msg)}`;
      $('log').appendChild(entry);
      $('log').scrollTop = $('log').scrollHeight;
    }

    // Terminal
    function termPrint(text, type = 'output') {
      const line = document.createElement('div');
      line.className = `line ${type}`;
      line.textContent = text;
      $('terminal').appendChild(line);
      $('terminal').scrollTop = $('terminal').scrollHeight;
    }

    // Update peer list
    function updatePeers() {
      const list = $('peerList');
      $('peerCount').textContent = peers.size;

      if (peers.size === 0) {
        list.innerHTML = '<div style="color:#8b949e;font-size:12px">No peers connected (open in another tab!)</div>';
        return;
      }

      list.innerHTML = '';
      for (const [id, info] of peers) {
        const div = document.createElement('div');
        div.className = 'peer' + (id === vmId ? ' self' : '');
        div.innerHTML = `
          <span class="dot on"></span>
          <span class="peer-name">${escapeHtml(id)}</span>
          ${id === vmId ? '<span style="color:#666">(you)</span>' : ''}
        `;
        list.appendChild(div);
      }
    }

    // Update file list
    function updateFiles() {
      const list = $('fileList');
      $('fileCount').textContent = sharedFiles.size;

      if (sharedFiles.size === 0) {
        list.innerHTML = '<div style="color:#8b949e;font-size:12px">No files yet</div>';
        return;
      }

      list.innerHTML = '';
      for (const [path, content] of sharedFiles) {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span>📄</span> ${escapeHtml(path)} <span style="color:#666;margin-left:auto">${content.length}b</span>`;
        div.onclick = () => {
          termPrint(`$ cat ${path}`, 'prompt');
          termPrint(content);
        };
        list.appendChild(div);
      }
    }

    // BroadcastChannel for same-browser communication
    function initChannel() {
      try {
        channel = new BroadcastChannel('konomi-os-mesh-global');

        channel.onmessage = (e) => {
          const msg = e.data;

          if (msg.type === 'announce' && msg.vmId !== vmId) {
            peers.set(msg.vmId, { joined: Date.now() });
            updatePeers();
            log(`Peer joined: ${msg.vmId}`);

            // Send our info back
            channel.postMessage({ type: 'hello', vmId, files: [...sharedFiles] });
          }

          if (msg.type === 'hello' && msg.vmId !== vmId) {
            peers.set(msg.vmId, { joined: Date.now() });
            // Sync their files
            if (msg.files) {
              for (const [path, content] of msg.files) {
                if (!sharedFiles.has(path)) {
                  sharedFiles.set(path, content);
                }
              }
              updateFiles();
            }
            updatePeers();
          }

          if (msg.type === 'file' && msg.vmId !== vmId) {
            sharedFiles.set(msg.path, msg.content);
            updateFiles();
            log(`File synced: ${msg.path}`);
          }

          if (msg.type === 'leave' && msg.vmId !== vmId) {
            peers.delete(msg.vmId);
            updatePeers();
            log(`Peer left: ${msg.vmId}`);
          }
        };

        // Announce ourselves
        channel.postMessage({ type: 'announce', vmId });

        // Heartbeat
        setInterval(() => {
          channel.postMessage({ type: 'announce', vmId });
        }, 5000);

        // Cleanup on exit
        window.addEventListener('beforeunload', () => {
          channel.postMessage({ type: 'leave', vmId });
        });

        $('connDot').className = 'dot on';
        $('connStatus').textContent = 'Connected';
        log('Mesh connected (BroadcastChannel)');

      } catch (e) {
        $('connDot').className = 'dot off';
        $('connStatus').textContent = 'Error';
        log('BroadcastChannel not supported: ' + e.message);
      }
    }

    // Simple terminal commands
    const commands = {
      help: () => 'Commands: help, ls, cat <file>, echo <text>, write <file> <content>, clear, peers, whoami',
      clear: () => { $('terminal').innerHTML = ''; return ''; },
      ls: () => sharedFiles.size ? [...sharedFiles.keys()].join('\n') : '(no files)',
      cat: (args) => {
        const path = args[0];
        if (!path) return 'Usage: cat <filename>';
        return sharedFiles.get(path) || sharedFiles.get('/' + path) || 'File not found: ' + path;
      },
      echo: (args) => args.join(' '),
      write: (args) => {
        const path = args[0];
        const content = args.slice(1).join(' ');
        if (!path) return 'Usage: write <filename> <content>';
        const fullPath = path.startsWith('/') ? path : '/' + path;
        sharedFiles.set(fullPath, content);
        updateFiles();
        // Broadcast to local peers (BroadcastChannel)
        if (channel) {
          channel.postMessage({ type: 'file', vmId, path: fullPath, content });
        }
        // Broadcast to global peers (WebRTC)
        broadcastFile(fullPath, content);
        return `Wrote ${content.length} bytes to ${fullPath}`;
      },
      peers: () => peers.size ? [...peers.keys()].join('\n') : 'No peers connected',
      whoami: () => vmId,
    };

    function runCommand() {
      const input = $('cmdInput').value.trim();
      if (!input) return;

      $('cmdInput').value = '';
      termPrint(`$ ${input}`, 'prompt');

      const [cmd, ...args] = input.split(' ');
      const handler = commands[cmd];

      if (handler) {
        const result = handler(args);
        if (result) termPrint(result);
      } else {
        termPrint(`Unknown command: ${cmd}. Type 'help' for commands.`, 'error');
      }
    }

    $('runBtn').onclick = runCommand;
    $('cmdInput').onkeydown = (e) => { if (e.key === 'Enter') runCommand(); };
    $('clearLogBtn').onclick = () => { $('log').innerHTML = ''; };

    $('newFileBtn').onclick = () => {
      const name = prompt('File name:');
      if (!name) return;
      const content = prompt('Content:') || '';
      const path = '/' + name.replace(/^\//, '');
      sharedFiles.set(path, content);
      updateFiles();
      if (channel) {
        channel.postMessage({ type: 'file', vmId, path, content });
      }
      // Broadcast to global peers (WebRTC)
      broadcastFile(path, content);
      log(`Created: ${path}`);
    };

    // Load saved files
    try {
      const saved = localStorage.getItem('os-mesh-files');
      if (saved) {
        for (const [k, v] of JSON.parse(saved)) {
          sharedFiles.set(k, v);
        }
        updateFiles();
      }
    } catch (e) {}

    // Save files periodically
    setInterval(() => {
      try {
        localStorage.setItem('os-mesh-files', JSON.stringify([...sharedFiles]));
      } catch (e) {}
    }, 5000);

    // Initialize
    termPrint('Welcome to P2P OS Mesh - Global Edition!', 'info');
    termPrint('Connecting to worldwide mesh via WebTorrent tracker...', 'info');
    termPrint("Type 'help' for commands.", 'info');
    termPrint('', 'output');

    // Add self as peer
    peers.set(vmId, { joined: Date.now() });
    updatePeers();

    // Connect to local mesh (BroadcastChannel for same-browser)
    initChannel();

    // Connect to global mesh (WebTorrent tracker for worldwide P2P)
    joinMesh();
  </script>
</body>
</html>
