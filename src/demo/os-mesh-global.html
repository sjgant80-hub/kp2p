<!DOCTYPE html>
<!--
@file src/demo/os-mesh-global.html
@desc P2P OS Mesh - Auto-connects all VMs globally (no invite links)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P OS Mesh - Global</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --green: #3fb950;
      --border: #30363d;
    }
    body {
      font-family: 'SF Mono', Monaco, monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 1.3rem; color: var(--accent); }
    .badge { padding: 4px 10px; background: #1f6feb33; color: var(--accent); border-radius: 12px; font-size: 11px; }
    .badge.green { background: #23883433; color: var(--green); }

    .stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 12px;
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-val { color: var(--accent); font-weight: bold; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.on { background: var(--green); }
    .dot.off { background: #666; }
    .dot.pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: #21262d;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-body { padding: 16px; }

    /* Terminal */
    .terminal {
      background: #000;
      border-radius: 6px;
      padding: 12px;
      height: 300px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .terminal .line { margin-bottom: 2px; }
    .terminal .prompt { color: var(--green); }
    .terminal .output { color: #8b949e; }
    .terminal .error { color: #f85149; }
    .terminal .info { color: var(--accent); }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
    }
    .input-row input:focus { outline: none; border-color: var(--accent); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #21262d; color: var(--fg); border: 1px solid var(--border); }

    /* Peer list */
    .peer-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .peer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .peer:last-child { border-bottom: none; }
    .peer-id { color: #8b949e; font-size: 11px; }
    .peer-name { color: var(--accent); }
    .peer.self { color: var(--green); }

    /* File list */
    .file-list {
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .file-icon { font-size: 14px; }

    /* Log */
    .log {
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      color: #8b949e;
    }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #21262d; }
    .log-time { color: #484f58; margin-right: 8px; }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌐 P2P OS Mesh</h1>
    <span class="badge green">Global Auto-Connect</span>
    <div class="stats">
      <div class="stat">
        <span class="dot" id="connDot"></span>
        <span id="connStatus">Connecting...</span>
      </div>
      <div class="stat">
        <span>Peers:</span>
        <span class="stat-val" id="peerCount">0</span>
      </div>
      <div class="stat">
        <span>Files:</span>
        <span class="stat-val" id="fileCount">0</span>
      </div>
    </div>
  </div>

  <div class="grid">
    <!-- Local VM Terminal -->
    <div class="panel">
      <div class="panel-header">
        <span>💻</span>
        <span>Local VM</span>
        <span id="vmId" style="margin-left:auto;color:#8b949e;font-size:11px"></span>
      </div>
      <div class="panel-body">
        <div class="terminal" id="terminal"></div>
        <div class="input-row">
          <input type="text" id="cmdInput" placeholder="Enter command..." disabled>
          <button class="btn btn-primary" id="runBtn" disabled>Run</button>
        </div>
      </div>
    </div>

    <!-- Connected Peers -->
    <div class="panel">
      <div class="panel-header">
        <span>👥</span>
        <span>Connected Peers</span>
      </div>
      <div class="panel-body">
        <div class="peer-list" id="peerList">
          <div style="color:#8b949e;font-size:12px">Waiting for peers...</div>
        </div>
      </div>
    </div>

    <!-- Shared Files -->
    <div class="panel">
      <div class="panel-header">
        <span>📁</span>
        <span>Shared Files</span>
        <button class="btn btn-secondary" style="margin-left:auto;padding:6px 12px;font-size:11px" id="newFileBtn">+ New File</button>
      </div>
      <div class="panel-body">
        <div class="file-list" id="fileList">
          <div style="color:#8b949e;font-size:12px">No files yet</div>
        </div>
      </div>
    </div>

    <!-- Activity Log -->
    <div class="panel">
      <div class="panel-header">
        <span>📋</span>
        <span>Activity Log</span>
        <button class="btn btn-secondary" style="margin-left:auto;padding:6px 12px;font-size:11px" id="clearLogBtn">Clear</button>
      </div>
      <div class="panel-body">
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createMesh } from '../p2p/mesh.js';
    import { createVM } from '../os/vm.js';
    import * as Y from 'https://esm.sh/yjs@13';

    const $ = id => document.getElementById(id);

    // Global mesh topic - all VMs connect to this
    const GLOBAL_TOPIC = 'konomi-os-mesh-global-v1';

    // State
    let mesh = null;
    let vm = null;
    let peers = new Map();
    let sharedDoc = null;
    let sharedFiles = null;

    // Generate short VM ID
    const vmId = 'vm-' + Math.random().toString(36).slice(2, 8);
    $('vmId').textContent = vmId;

    // Logging
    function log(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString();
      entry.innerHTML = `<span class="log-time">${time}</span>${msg}`;
      $('log').appendChild(entry);
      $('log').scrollTop = $('log').scrollHeight;
    }

    // Terminal output
    function termPrint(text, type = 'output') {
      const line = document.createElement('div');
      line.className = `line ${type}`;
      line.textContent = text;
      $('terminal').appendChild(line);
      $('terminal').scrollTop = $('terminal').scrollHeight;
    }

    // Update peer list
    function updatePeers() {
      const list = $('peerList');
      if (peers.size === 0) {
        list.innerHTML = '<div style="color:#8b949e;font-size:12px">No peers connected</div>';
        $('peerCount').textContent = '0';
        return;
      }

      list.innerHTML = '';
      for (const [id, info] of peers) {
        const div = document.createElement('div');
        div.className = 'peer' + (id === vmId ? ' self' : '');
        div.innerHTML = `
          <span class="dot on"></span>
          <span class="peer-name">${info.name || id}</span>
          <span class="peer-id">${id}</span>
        `;
        list.appendChild(div);
      }
      $('peerCount').textContent = peers.size;
    }

    // Update file list
    function updateFiles() {
      const list = $('fileList');
      if (!sharedFiles || sharedFiles.size === 0) {
        list.innerHTML = '<div style="color:#8b949e;font-size:12px">No files yet</div>';
        $('fileCount').textContent = '0';
        return;
      }

      list.innerHTML = '';
      const files = Array.from(sharedFiles.entries());
      files.sort((a, b) => a[0].localeCompare(b[0]));

      for (const [path, content] of files) {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span class="file-icon">📄</span>
          <span>${path}</span>
          <span style="color:#8b949e;margin-left:auto">${content.length} bytes</span>
        `;
        div.onclick = () => {
          termPrint(`$ cat ${path}`, 'prompt');
          termPrint(content.slice(0, 500) + (content.length > 500 ? '...' : ''));
        };
        div.style.cursor = 'pointer';
        list.appendChild(div);
      }
      $('fileCount').textContent = files.length;
    }

    // Initialize mesh
    async function initMesh() {
      log('Initializing P2P mesh...');
      $('connDot').className = 'dot pulse';

      try {
        mesh = await createMesh({
          topic: GLOBAL_TOPIC,
          onPeerJoin: (peerId) => {
            log(`Peer joined: ${peerId.slice(0, 12)}...`);
            peers.set(peerId, { name: peerId.slice(0, 8), joined: Date.now() });
            updatePeers();

            // Announce ourselves
            mesh.broadcast({
              type: 'announce',
              vmId,
              files: sharedFiles ? Array.from(sharedFiles.keys()) : [],
            });
          },
          onPeerLeave: (peerId) => {
            log(`Peer left: ${peerId.slice(0, 12)}...`);
            peers.delete(peerId);
            updatePeers();
          },
          onMessage: (msg, from) => {
            handleMessage(msg, from);
          },
        });

        log('Mesh connected!', 'success');
        $('connDot').className = 'dot on';
        $('connStatus').textContent = 'Connected';

        // Add self to peers
        peers.set(vmId, { name: vmId + ' (you)', joined: Date.now() });
        updatePeers();

      } catch (e) {
        log('Mesh error: ' + e.message, 'error');
        $('connDot').className = 'dot off';
        $('connStatus').textContent = 'Error';
        throw e;
      }
    }

    // Handle incoming messages
    function handleMessage(msg, from) {
      if (msg.type === 'announce') {
        peers.set(from, { name: msg.vmId || from.slice(0, 8), joined: Date.now() });
        updatePeers();

        // Sync files back
        if (sharedFiles && sharedFiles.size > 0) {
          mesh.send(from, {
            type: 'files-sync',
            files: Array.from(sharedFiles.entries()),
          });
        }
      }

      if (msg.type === 'files-sync' && msg.files) {
        for (const [path, content] of msg.files) {
          if (!sharedFiles.has(path)) {
            sharedFiles.set(path, content);
            log(`Synced file: ${path}`);
          }
        }
        updateFiles();
        syncToVFS();
      }

      if (msg.type === 'file-create') {
        sharedFiles.set(msg.path, msg.content);
        log(`File created by peer: ${msg.path}`);
        updateFiles();
        syncToVFS();
      }
    }

    // Sync shared files to VM VFS
    function syncToVFS() {
      if (!vm) return;
      for (const [path, content] of sharedFiles) {
        try {
          vm.exec('write', [`/shared${path}`, content]);
        } catch (e) {}
      }
    }

    // Initialize VM
    async function initVM() {
      log('Starting VM...');
      termPrint('Booting VM...', 'info');

      try {
        vm = await createVM({ id: vmId });
        vm.on('stdout', (data) => termPrint(data));
        vm.on('stderr', (data) => termPrint(data, 'error'));

        termPrint('VM ready. Type "help" for commands.', 'info');
        termPrint('Files in /shared are synced across all peers.', 'info');

        // Create shared directory
        try {
          vm.exec('mkdir', ['/shared']);
        } catch (e) {}

        // Enable input
        $('cmdInput').disabled = false;
        $('runBtn').disabled = false;
        $('cmdInput').focus();

        log('VM started');
      } catch (e) {
        termPrint('VM error: ' + e.message, 'error');
        log('VM error: ' + e.message, 'error');
      }
    }

    // Execute command
    function runCommand() {
      const cmd = $('cmdInput').value.trim();
      if (!cmd) return;

      $('cmdInput').value = '';
      termPrint(`$ ${cmd}`, 'prompt');

      try {
        const [command, ...args] = cmd.split(' ');

        // Check if writing to /shared
        if (command === 'write' && args[0]?.startsWith('/shared')) {
          const path = args[0].replace('/shared', '') || '/untitled';
          const content = args.slice(1).join(' ');
          sharedFiles.set(path, content);
          updateFiles();

          // Broadcast to peers
          mesh?.broadcast({
            type: 'file-create',
            path,
            content,
          });

          termPrint(`Created shared file: ${path}`);
          return;
        }

        const result = vm.exec(command, args);
        if (result !== undefined) {
          termPrint(typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result));
        }
      } catch (e) {
        termPrint(e.message, 'error');
      }
    }

    $('runBtn').onclick = runCommand;
    $('cmdInput').onkeydown = (e) => { if (e.key === 'Enter') runCommand(); };
    $('clearLogBtn').onclick = () => { $('log').innerHTML = ''; };

    // New file dialog
    $('newFileBtn').onclick = () => {
      const name = prompt('File name (e.g., notes.txt):');
      if (!name) return;
      const content = prompt('Content:') || '';
      const path = '/' + name.replace(/^\//, '');

      sharedFiles.set(path, content);
      updateFiles();
      syncToVFS();

      mesh?.broadcast({
        type: 'file-create',
        path,
        content,
      });

      log(`Created file: ${path}`);
    };

    // Initialize
    async function init() {
      // Initialize shared files storage
      sharedFiles = new Map();

      // Load from localStorage
      try {
        const saved = localStorage.getItem('os-mesh-files');
        if (saved) {
          const files = JSON.parse(saved);
          for (const [k, v] of files) sharedFiles.set(k, v);
          updateFiles();
        }
      } catch (e) {}

      // Auto-save files
      setInterval(() => {
        try {
          localStorage.setItem('os-mesh-files', JSON.stringify([...sharedFiles]));
        } catch (e) {}
      }, 5000);

      // Start mesh and VM in parallel
      await Promise.all([
        initMesh().catch(e => console.error('Mesh error:', e)),
        initVM().catch(e => console.error('VM error:', e)),
      ]);

      log('Ready! All instances auto-connect to the global mesh.');
    }

    init();
  </script>
</body>
</html>
