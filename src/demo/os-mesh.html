<!DOCTYPE html>
<!--
@file src/demo/os-mesh.html
@desc P2P OS Mesh - Connect VM instances across the network
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P OS Mesh</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
      background: #0a0a1a;
      color: #00ff88;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { color: #4facfe; font-size: 1.2rem; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 12px; margin-bottom: 20px; }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) {
      .panels { grid-template-columns: 1fr; }
    }

    .panel {
      background: #12122a;
      border-radius: 8px;
      border: 1px solid #333;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: #1a1a2e;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .panel-header h2 { font-size: 14px; color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.off { background: #666; }
    .dot.on { background: #00ff88; animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .panel-body { padding: 16px; }

    .terminal {
      background: #0a0a0a;
      border-radius: 6px;
      height: 250px;
      overflow-y: auto;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .terminal .line { margin-bottom: 2px; }
    .terminal .system { color: #888; }
    .terminal .success { color: #00ff88; }
    .terminal .error { color: #ff4444; }
    .terminal .prompt { color: #4facfe; }

    .input-row {
      display: flex;
      gap: 8px;
    }
    .input-row input {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #0a0a1a;
      color: #00ff88;
      font-family: inherit;
      font-size: 12px;
    }
    .input-row button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .btn { background: #333; color: #fff; }
    .btn:hover { background: #444; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4facfe; color: #000; }
    .btn-success { background: #00ff88; color: #000; }

    .connect-section {
      background: #12122a;
      border-radius: 8px;
      border: 1px solid #333;
      padding: 16px;
      margin-bottom: 20px;
    }
    .connect-section h3 {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .connect-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .connect-row button { min-width: 140px; }

    textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0a0a0a;
      color: #00ff88;
      font-family: inherit;
      font-size: 11px;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 12px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .info-item {
      background: #0a0a1a;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .info-item .label { color: #888; }
    .info-item .value { color: #fff; margin-top: 2px; }

    .peer-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #1a3a1a;
      border-radius: 4px;
      font-size: 11px;
      margin: 2px;
    }
  </style>
</head>
<body>
  <h1>🌐 P2P OS Mesh</h1>
  <p class="subtitle">Connect VM instances across the network via WebRTC</p>

  <!-- Connection Section -->
  <div class="connect-section">
    <h3>Network Connection</h3>
    <div class="connect-row">
      <button class="btn btn-primary" id="createOfferBtn">Create Invite Link</button>
      <button class="btn" id="joinBtn">Join via Link</button>
      <span id="connStatus" style="color:#888;font-size:12px;line-height:32px;margin-left:12px">Not connected</span>
    </div>
    <textarea id="signalBox" placeholder="Invite link will appear here, or paste an invite to join..."></textarea>
    <div class="connect-row">
      <button class="btn" id="copyBtn">Copy Link</button>
      <button class="btn btn-success" id="acceptBtn" style="display:none">Accept & Connect</button>
    </div>
  </div>

  <!-- VM Panels -->
  <div class="panels">
    <!-- Local VM -->
    <div class="panel">
      <div class="panel-header">
        <span class="dot off" id="localDot"></span>
        <h2>Local VM</h2>
        <button class="btn btn-primary" id="bootLocalBtn" style="margin-left:auto;font-size:11px;padding:6px 12px">Boot</button>
      </div>
      <div class="panel-body">
        <div class="info-grid">
          <div class="info-item"><div class="label">ID</div><div class="value" id="localId">-</div></div>
          <div class="info-item"><div class="label">State</div><div class="value" id="localState">off</div></div>
          <div class="info-item"><div class="label">Processes</div><div class="value" id="localProcs">0</div></div>
          <div class="info-item"><div class="label">Files</div><div class="value" id="localFiles">0</div></div>
        </div>
        <div>
          <span style="color:#888;font-size:11px">Peers: </span>
          <span id="localPeers"><span style="color:#666">none</span></span>
        </div>
        <div class="terminal" id="localTerminal">
          <div class="line system">Local VM terminal</div>
        </div>
        <div class="input-row">
          <input type="text" id="localInput" placeholder="Enter command..." disabled />
          <button class="btn" id="localSendBtn" disabled>Run</button>
        </div>
      </div>
    </div>

    <!-- Remote VM (when connected) -->
    <div class="panel">
      <div class="panel-header">
        <span class="dot off" id="remoteDot"></span>
        <h2>Remote VM</h2>
        <span id="remoteLabel" style="margin-left:auto;color:#888;font-size:11px">Waiting for connection...</span>
      </div>
      <div class="panel-body">
        <div class="info-grid">
          <div class="info-item"><div class="label">ID</div><div class="value" id="remoteId">-</div></div>
          <div class="info-item"><div class="label">State</div><div class="value" id="remoteState">-</div></div>
          <div class="info-item"><div class="label">Processes</div><div class="value" id="remoteProcs">-</div></div>
          <div class="info-item"><div class="label">Files</div><div class="value" id="remoteFiles">-</div></div>
        </div>
        <div class="terminal" id="remoteTerminal">
          <div class="line system">Remote VM will appear here when connected</div>
        </div>
        <div class="input-row">
          <input type="text" id="remoteInput" placeholder="Send command to remote..." disabled />
          <button class="btn" id="remoteSendBtn" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { VM, VMCluster, VM_STATE } from '../os/vm.js';

    const $ = id => document.getElementById(id);

    let localVM = null;
    let cluster = null;
    let pc = null;  // RTCPeerConnection
    let dc = null;  // DataChannel
    let isCreator = false;

    // === TERMINAL LOGGING ===
    function log(terminalId, text, type = 'output') {
      const terminal = $(terminalId);
      const line = document.createElement('div');
      line.className = 'line ' + type;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    // === LOCAL VM MANAGEMENT ===
    $('bootLocalBtn').onclick = async () => {
      $('bootLocalBtn').disabled = true;
      log('localTerminal', 'Booting VM...', 'system');

      try {
        cluster = new VMCluster({ id: 'mesh-cluster' });
        localVM = await cluster.createVM({ name: 'local-vm' });

        log('localTerminal', 'VM ready.', 'success');
        $('localDot').className = 'dot on';
        $('localInput').disabled = false;
        $('localSendBtn').disabled = false;
        $('bootLocalBtn').textContent = 'Running';
        updateLocalInfo();
      } catch (e) {
        log('localTerminal', `Boot failed: ${e.message}`, 'error');
        $('bootLocalBtn').disabled = false;
      }
    };

    function updateLocalInfo() {
      if (!localVM) return;
      const info = localVM.info();
      $('localId').textContent = info.id;
      $('localState').textContent = info.state;
      $('localProcs').textContent = localVM.ps().length;
      $('localFiles').textContent = info.stats?.files || 0;

      const peers = Array.from(localVM.peers.keys());
      $('localPeers').innerHTML = peers.length
        ? peers.map(p => `<span class="peer-badge">${p}</span>`).join('')
        : '<span style="color:#666">none</span>';
    }

    // === COMMAND EXECUTION ===
    async function executeLocal(cmd) {
      if (!localVM) return;
      log('localTerminal', `$ ${cmd}`, 'prompt');

      try {
        const parts = cmd.trim().split(/\s+/);
        const op = parts[0];
        const args = parts.slice(1);

        switch (op) {
          case 'ls':
            const items = localVM.vfs.readdir(args[0] || localVM.vfs.getcwd());
            items.forEach(i => log('localTerminal', i));
            break;
          case 'ps':
            localVM.ps().forEach(p => log('localTerminal', `${p.pid}\t${p.state}\t${p.name}`));
            break;
          case 'cat':
            log('localTerminal', localVM.vfs.readFile(args[0]) || '(empty)');
            break;
          case 'echo':
            const text = args.join(' ');
            const redir = args.indexOf('>');
            if (redir >= 0) {
              localVM.vfs.writeFile(args[redir + 1], args.slice(0, redir).join(' '));
              log('localTerminal', 'Written', 'success');
              syncToRemote();  // Sync file changes
            } else {
              log('localTerminal', text);
            }
            break;
          case 'touch':
            localVM.vfs.writeFile(args[0], '');
            log('localTerminal', `Created ${args[0]}`, 'success');
            syncToRemote();
            break;
          case 'mkdir':
            localVM.vfs.mkdir(args[0]);
            log('localTerminal', `Created ${args[0]}`, 'success');
            syncToRemote();
            break;
          case 'sync':
            syncToRemote();
            log('localTerminal', 'Synced to peer', 'success');
            break;
          case 'peers':
            const peerList = Array.from(localVM.peers.keys());
            log('localTerminal', peerList.length ? peerList.join(', ') : '(no peers)');
            break;
          case 'shm':
            if (args[0] === 'set') {
              localVM.shmSet(args[1], args.slice(2).join(' '));
              log('localTerminal', `Set ${args[1]}`, 'success');
            } else if (args[0] === 'get') {
              log('localTerminal', JSON.stringify(localVM.shmGet(args[1])));
            } else {
              log('localTerminal', 'Usage: shm set <key> <value> | shm get <key>', 'error');
            }
            break;
          default:
            log('localTerminal', `Commands: ls, ps, cat, echo, touch, mkdir, sync, peers, shm`, 'system');
        }
      } catch (e) {
        log('localTerminal', e.message, 'error');
      }
      updateLocalInfo();
    }

    $('localSendBtn').onclick = () => {
      const cmd = $('localInput').value.trim();
      if (cmd) {
        executeLocal(cmd);
        $('localInput').value = '';
      }
    };
    $('localInput').onkeydown = e => { if (e.key === 'Enter') $('localSendBtn').click(); };

    // === P2P CONNECTION ===
    const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

    function createPeerConnection() {
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      pc.onicecandidate = e => {
        if (!e.candidate) {
          // ICE gathering complete
          const data = JSON.stringify(pc.localDescription);
          $('signalBox').value = btoa(data);
          $('copyBtn').style.display = 'inline-block';
        }
      };

      pc.onconnectionstatechange = () => {
        $('connStatus').textContent = `Connection: ${pc.connectionState}`;
        if (pc.connectionState === 'connected') {
          $('connStatus').style.color = '#00ff88';
          $('remoteDot').className = 'dot on';
          $('remoteLabel').textContent = 'Connected';
        }
      };

      pc.ondatachannel = e => {
        dc = e.channel;
        setupDataChannel();
      };
    }

    function setupDataChannel() {
      dc.onopen = () => {
        log('remoteTerminal', 'Data channel open', 'success');
        $('remoteInput').disabled = false;
        $('remoteSendBtn').disabled = false;

        // Connect VMs
        if (localVM) {
          localVM.connectPeer('remote-vm', dc);
          updateLocalInfo();
        }

        // Send initial sync
        setTimeout(syncToRemote, 500);
      };

      dc.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          handleRemoteMessage(msg);
        } catch (err) {
          log('remoteTerminal', e.data);
        }
      };

      dc.onclose = () => {
        log('remoteTerminal', 'Disconnected', 'error');
        $('remoteDot').className = 'dot off';
      };
    }

    function handleRemoteMessage(msg) {
      switch (msg.type) {
        case 'info':
          $('remoteId').textContent = msg.id || '-';
          $('remoteState').textContent = msg.state || '-';
          $('remoteProcs').textContent = msg.procs || '-';
          $('remoteFiles').textContent = msg.files || '-';
          break;
        case 'log':
          log('remoteTerminal', msg.text, msg.level || 'output');
          break;
        case 'sync':
          // Apply VFS changes from remote
          if (localVM && msg.vfs) {
            try {
              localVM.vfs.import(msg.vfs);
              log('localTerminal', 'Received sync from peer', 'success');
            } catch (e) {}
          }
          break;
        case 'cmd':
          // Remote is executing a command
          log('remoteTerminal', `$ ${msg.cmd}`, 'prompt');
          break;
        case 'result':
          log('remoteTerminal', msg.text, msg.error ? 'error' : 'output');
          break;
      }
    }

    function syncToRemote() {
      if (!dc || dc.readyState !== 'open' || !localVM) return;
      dc.send(JSON.stringify({
        type: 'sync',
        vfs: localVM.vfs.export()
      }));
      dc.send(JSON.stringify({
        type: 'info',
        id: localVM.id,
        state: localVM.state,
        procs: localVM.ps().length,
        files: localVM.vfs.inodes.size
      }));
    }

    // === SIGNALING ===
    $('createOfferBtn').onclick = async () => {
      isCreator = true;
      createPeerConnection();

      dc = pc.createDataChannel('vm-mesh');
      setupDataChannel();

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      $('createOfferBtn').disabled = true;
      $('joinBtn').disabled = true;
      log('localTerminal', 'Created invite. Share the link with peer.', 'system');
    };

    $('joinBtn').onclick = async () => {
      const data = $('signalBox').value.trim();
      if (!data) {
        log('localTerminal', 'Paste an invite link first', 'error');
        return;
      }

      try {
        const desc = JSON.parse(atob(data));

        if (desc.type === 'offer') {
          isCreator = false;
          createPeerConnection();

          await pc.setRemoteDescription(desc);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          $('createOfferBtn').disabled = true;
          $('joinBtn').disabled = true;
          log('localTerminal', 'Created answer. Share with peer.', 'system');
        } else if (desc.type === 'answer') {
          await pc.setRemoteDescription(desc);
          log('localTerminal', 'Answer accepted. Connecting...', 'system');
          $('acceptBtn').style.display = 'none';
        }
      } catch (e) {
        log('localTerminal', `Invalid link: ${e.message}`, 'error');
      }
    };

    $('acceptBtn').onclick = () => $('joinBtn').click();

    $('copyBtn').onclick = () => {
      navigator.clipboard.writeText($('signalBox').value);
      $('copyBtn').textContent = 'Copied!';
      setTimeout(() => $('copyBtn').textContent = 'Copy Link', 1500);
    };

    // Show accept button when pasting
    $('signalBox').oninput = () => {
      const v = $('signalBox').value.trim();
      $('acceptBtn').style.display = v && !isCreator ? 'inline-block' : 'none';
    };

    // === REMOTE COMMANDS ===
    $('remoteSendBtn').onclick = () => {
      const cmd = $('remoteInput').value.trim();
      if (cmd && dc?.readyState === 'open') {
        dc.send(JSON.stringify({ type: 'cmd', cmd }));
        $('remoteInput').value = '';
      }
    };
    $('remoteInput').onkeydown = e => { if (e.key === 'Enter') $('remoteSendBtn').click(); };

    // Update UI periodically
    setInterval(() => {
      updateLocalInfo();
      if (dc?.readyState === 'open') {
        syncToRemote();
      }
    }, 2000);
  </script>
</body>
</html>
