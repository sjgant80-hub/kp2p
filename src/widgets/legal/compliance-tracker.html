<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compliance Tracker - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"compliance-tracker","name":"Compliance Tracker","icon":"📋","desc":"Track regulatory compliance and audits","category":"legal","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.score-card{background:linear-gradient(135deg,#1a1a1a,#252525);border-radius:12px;padding:25px;margin-bottom:20px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px}
.score{text-align:center}
.score-value{font-size:3rem;font-weight:bold}
.score-value.good{color:#10b981}
.score-value.warning{color:#f59e0b}
.score-value.danger{color:#ef4444}
.score-label{color:#888;font-size:.875rem;margin-top:5px}
.score-bar{width:200px;height:8px;background:#333;border-radius:4px;margin-top:10px}
.score-fill{height:100%;border-radius:4px}
.frameworks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px}
.framework-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.framework-header{padding:15px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.framework-name{font-weight:600;display:flex;align-items:center;gap:8px}
.framework-score{font-size:1.25rem;font-weight:bold}
.framework-body{padding:15px}
.control-group{margin-bottom:15px}
.control-group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.control-group-name{font-size:.875rem;font-weight:500}
.control-group-progress{font-size:.75rem;color:#888}
.progress-bar{height:6px;background:#333;border-radius:3px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.progress-fill.good{background:#10b981}
.progress-fill.warning{background:#f59e0b}
.progress-fill.danger{background:#ef4444}
.tasks-section{background:#1a1a1a;border-radius:12px;padding:20px;border:1px solid #333}
.tasks-section h3{margin-bottom:15px;display:flex;align-items:center;gap:8px}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-item{display:flex;align-items:center;gap:15px;padding:15px;background:#252525;border-radius:8px}
.task-priority{width:4px;height:40px;border-radius:2px}
.task-priority.high{background:#ef4444}
.task-priority.medium{background:#f59e0b}
.task-priority.low{background:#10b981}
.task-info{flex:1}
.task-title{font-weight:500;margin-bottom:3px}
.task-meta{font-size:.75rem;color:#888;display:flex;gap:15px}
.task-due{font-size:.875rem}
.task-due.overdue{color:#ef4444}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem}
.btn-primary{background:#10b981;color:#fff}
.btn-secondary{background:#333;color:#e0e0e0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;z-index:1000}
.modal.active{display:flex}
.modal-content{background:#1a1a1a;padding:25px;border-radius:12px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;color:#888;font-size:.875rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:1px solid #333;border-radius:6px;background:#252525;color:#e0e0e0}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>
<div class="header">
<h1>📋 Compliance Tracker</h1>
<button class="btn btn-primary" onclick="showModal()">+ Add Task</button>
</div>

<div class="score-card">
<div class="score">
<div class="score-value good" id="overallScore">94%</div>
<div class="score-label">Overall Compliance</div>
<div class="score-bar"><div class="progress-fill good" style="width:94%"></div></div>
</div>
<div class="score">
<div class="score-value" id="controlsCompliant">47/50</div>
<div class="score-label">Controls Compliant</div>
</div>
<div class="score">
<div class="score-value warning" id="tasksPending">8</div>
<div class="score-label">Tasks Pending</div>
</div>
<div class="score">
<div class="score-value" id="nextAudit">45d</div>
<div class="score-label">Until Next Audit</div>
</div>
</div>

<div class="frameworks" id="frameworkGrid"></div>

<div class="tasks-section">
<h3>⚡ Priority Tasks</h3>
<div class="task-list" id="taskList"></div>
</div>

<div class="modal" id="taskModal">
<div class="modal-content">
<h2>Add Compliance Task</h2>
<form id="taskForm">
<div class="form-group">
<label>Task Title</label>
<input type="text" id="taskTitle" required>
</div>
<div class="form-group">
<label>Framework</label>
<select id="taskFramework">
<option value="soc2">SOC 2</option>
<option value="gdpr">GDPR</option>
<option value="hipaa">HIPAA</option>
<option value="iso27001">ISO 27001</option>
<option value="pci">PCI DSS</option>
</select>
</div>
<div class="form-group">
<label>Control Category</label>
<select id="taskCategory">
<option>Access Control</option>
<option>Data Protection</option>
<option>Security Operations</option>
<option>Risk Management</option>
<option>Incident Response</option>
<option>Vendor Management</option>
</select>
</div>
<div class="form-group">
<label>Priority</label>
<select id="taskPriority">
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option>
</select>
</div>
<div class="form-group">
<label>Due Date</label>
<input type="date" id="taskDue" required>
</div>
<div class="form-group">
<label>Description</label>
<textarea id="taskDesc" rows="2"></textarea>
</div>
<div class="btn-row">
<button type="button" class="btn btn-secondary" onclick="hideModal()">Cancel</button>
<button type="submit" class="btn btn-primary">Add Task</button>
</div>
</form>
</div>
</div>

<script>
const STORAGE_KEY = 'kiss_compliance';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
  frameworks: {
    soc2: {
      name: 'SOC 2',
      icon: '🔐',
      controls: [
        { name: 'Access Control', total: 12, compliant: 11 },
        { name: 'Data Protection', total: 8, compliant: 8 },
        { name: 'Security Operations', total: 10, compliant: 9 },
        { name: 'Availability', total: 6, compliant: 6 }
      ]
    },
    gdpr: {
      name: 'GDPR',
      icon: '🇪🇺',
      controls: [
        { name: 'Data Subject Rights', total: 8, compliant: 8 },
        { name: 'Consent Management', total: 5, compliant: 4 },
        { name: 'Data Processing', total: 6, compliant: 6 },
        { name: 'Breach Notification', total: 4, compliant: 4 }
      ]
    },
    hipaa: {
      name: 'HIPAA',
      icon: '🏥',
      controls: [
        { name: 'Privacy Rule', total: 10, compliant: 9 },
        { name: 'Security Rule', total: 12, compliant: 11 },
        { name: 'Breach Notification', total: 4, compliant: 4 }
      ]
    }
  },
  tasks: [
    { id: '1', title: 'Complete annual security training', framework: 'soc2', category: 'Security Operations', priority: 'high', due: '2024-12-30', status: 'pending' },
    { id: '2', title: 'Review access permissions quarterly', framework: 'soc2', category: 'Access Control', priority: 'high', due: '2024-12-28', status: 'pending' },
    { id: '3', title: 'Update privacy policy', framework: 'gdpr', category: 'Consent Management', priority: 'medium', due: '2025-01-15', status: 'pending' },
    { id: '4', title: 'Conduct penetration test', framework: 'soc2', category: 'Security Operations', priority: 'high', due: '2025-01-30', status: 'pending' },
    { id: '5', title: 'Vendor security assessment', framework: 'iso27001', category: 'Vendor Management', priority: 'medium', due: '2025-02-01', status: 'pending' }
  ],
  nextAudit: '2025-02-10'
};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getScoreClass(pct) {
  if (pct >= 90) return 'good';
  if (pct >= 70) return 'warning';
  return 'danger';
}

function updateStats() {
  let totalControls = 0, compliantControls = 0;

  Object.values(data.frameworks).forEach(fw => {
    fw.controls.forEach(c => {
      totalControls += c.total;
      compliantControls += c.compliant;
    });
  });

  const overallPct = Math.round((compliantControls / totalControls) * 100);
  const pendingTasks = data.tasks.filter(t => t.status === 'pending').length;
  const daysUntilAudit = Math.ceil((new Date(data.nextAudit) - new Date()) / (1000 * 60 * 60 * 24));

  document.getElementById('overallScore').textContent = overallPct + '%';
  document.getElementById('overallScore').className = 'score-value ' + getScoreClass(overallPct);
  document.getElementById('controlsCompliant').textContent = `${compliantControls}/${totalControls}`;
  document.getElementById('tasksPending').textContent = pendingTasks;
  document.getElementById('nextAudit').textContent = daysUntilAudit + 'd';
}

function renderFrameworks() {
  const grid = document.getElementById('frameworkGrid');

  grid.innerHTML = Object.entries(data.frameworks).map(([key, fw]) => {
    const total = fw.controls.reduce((s, c) => s + c.total, 0);
    const compliant = fw.controls.reduce((s, c) => s + c.compliant, 0);
    const pct = Math.round((compliant / total) * 100);

    return `
      <div class="framework-card">
        <div class="framework-header">
          <div class="framework-name">${fw.icon} ${fw.name}</div>
          <div class="framework-score ${getScoreClass(pct)}">${pct}%</div>
        </div>
        <div class="framework-body">
          ${fw.controls.map(c => {
            const cPct = Math.round((c.compliant / c.total) * 100);
            return `
              <div class="control-group">
                <div class="control-group-header">
                  <span class="control-group-name">${c.name}</span>
                  <span class="control-group-progress">${c.compliant}/${c.total}</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill ${getScoreClass(cPct)}" style="width:${cPct}%"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const pending = data.tasks
    .filter(t => t.status === 'pending')
    .sort((a, b) => {
      const priorityOrder = { high: 0, medium: 1, low: 2 };
      return priorityOrder[a.priority] - priorityOrder[b.priority] || new Date(a.due) - new Date(b.due);
    });

  if (pending.length === 0) {
    list.innerHTML = '<div style="color:#666;text-align:center;padding:20px">All tasks completed!</div>';
    return;
  }

  list.innerHTML = pending.map(task => {
    const dueDate = new Date(task.due);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const isOverdue = dueDate < today;
    const daysUntil = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));

    return `
      <div class="task-item">
        <div class="task-priority ${task.priority}"></div>
        <div class="task-info">
          <div class="task-title">${task.title}</div>
          <div class="task-meta">
            <span>${data.frameworks[task.framework]?.name || task.framework}</span>
            <span>${task.category}</span>
          </div>
        </div>
        <div class="task-due${isOverdue ? ' overdue' : ''}">
          ${isOverdue ? 'Overdue' : daysUntil === 0 ? 'Today' : `${daysUntil}d`}
        </div>
        <button class="btn btn-primary" onclick="completeTask('${task.id}')">✓</button>
      </div>
    `;
  }).join('');
}

function showModal() {
  document.getElementById('taskDue').value = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
  document.getElementById('taskModal').classList.add('active');
}

function hideModal() {
  document.getElementById('taskModal').classList.remove('active');
}

document.getElementById('taskForm').addEventListener('submit', e => {
  e.preventDefault();

  data.tasks.push({
    id: Date.now().toString(),
    title: document.getElementById('taskTitle').value,
    framework: document.getElementById('taskFramework').value,
    category: document.getElementById('taskCategory').value,
    priority: document.getElementById('taskPriority').value,
    due: document.getElementById('taskDue').value,
    desc: document.getElementById('taskDesc').value,
    status: 'pending'
  });

  save();
  renderTasks();
  updateStats();
  hideModal();
  e.target.reset();
});

function completeTask(id) {
  const task = data.tasks.find(t => t.id === id);
  if (task) {
    task.status = 'completed';
    task.completedAt = new Date().toISOString();
    save();
    renderTasks();
    updateStats();
  }
}

renderFrameworks();
renderTasks();
updateStats();
</script>
</body>
</html>
