<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance Log - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"maintenance-log","name":"Maintenance Log","icon":"🏊","desc":"Track pool maintenance","category":"pool","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#06b6d4}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.logs-list{display:flex;flex-direction:column;gap:12px}
.log-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.log-header{display:flex;justify-content:space-between;margin-bottom:15px}
.log-date{font-weight:600}
.readings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.reading{padding:10px;background:#252525;border-radius:6px;text-align:center}
.reading-value{font-size:1.25rem;font-weight:bold;color:#22c55e}
.reading-value.warn{color:#f59e0b}
.reading-label{font-size:.7rem;color:#888}
.tasks{display:flex;flex-wrap:wrap;gap:6px}
.task{padding:4px 10px;background:#06b6d422;border-radius:4px;font-size:.75rem;color:#06b6d4}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#06b6d4;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>🏊 Maintenance Log</h1><button class="btn" onclick="alert('Add entry')">+ Add Entry</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">12</div><div class="stat-label">Total Visits</div></div>
<div class="stat"><div class="stat-value">7.4</div><div class="stat-label">Avg pH</div></div>
<div class="stat"><div class="stat-value">92%</div><div class="stat-label">Chlorine OK</div></div>
<div class="stat"><div class="stat-value">3d</div><div class="stat-label">Next Service</div></div>
</div>
<div class="logs-list" id="logs"></div>
<script>
const logs=[
{date:'Dec 27',tech:'Mike S.',ph:7.4,chlorine:2.5,alk:95,temp:82,tasks:['Vacuumed','Skimmed','Added Chlorine']},
{date:'Dec 20',tech:'Tom B.',ph:7.6,chlorine:1.8,alk:88,temp:80,tasks:['Skimmed','Brushed Walls','Tested Water']},
{date:'Dec 13',tech:'Mike S.',ph:7.2,chlorine:3.2,alk:105,temp:81,tasks:['Vacuumed','Backwashed','Checked Equipment']}
];
document.getElementById('logs').innerHTML=logs.map(l=>`
<div class="log-card">
<div class="log-header"><span class="log-date">📅 ${l.date}</span><span style="color:#888">Tech: ${l.tech}</span></div>
<div class="readings">
<div class="reading"><div class="reading-value">${l.ph}</div><div class="reading-label">pH Level</div></div>
<div class="reading"><div class="reading-value">${l.chlorine}</div><div class="reading-label">Chlorine</div></div>
<div class="reading"><div class="reading-value">${l.alk}</div><div class="reading-label">Alkalinity</div></div>
<div class="reading"><div class="reading-value">${l.temp}°</div><div class="reading-label">Temp</div></div>
</div>
<div class="tasks">${l.tasks.map(t=>`<span class="task">✓ ${t}</span>`).join('')}</div>
</div>`).join('');
</script>
</body>
</html>
