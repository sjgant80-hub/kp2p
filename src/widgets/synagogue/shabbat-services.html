<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shabbat Services - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"shabbat-services","name":"Shabbat Services","icon":"✡️","desc":"Weekly Shabbat schedule","category":"synagogue","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.shabbat-times{background:linear-gradient(135deg,#1d4ed8 0%,#1e40af 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.times-header{font-size:1.25rem;font-weight:bold;margin-bottom:15px}
.times-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.time-item{background:rgba(255,255,255,0.1);padding:15px;border-radius:8px;text-align:center}
.time-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.time-value{font-size:1.25rem;font-weight:bold}
.services{display:flex;flex-direction:column;gap:15px}
.service{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.service-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.service-name{font-size:1.125rem;font-weight:bold}
.service-hebrew{font-size:.875rem;color:#1d4ed8}
.service-day{font-size:.875rem;color:#888;margin-top:3px}
.service-type{padding:4px 10px;border-radius:4px;font-size:.7rem;background:#1d4ed833;color:#1d4ed8}
.service-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.detail{background:#252525;padding:12px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:3px}
.detail-value{font-size:.875rem}
</style>
</head>
<body>
<div class="header"><h1>✡️ Shabbat</h1><button class="btn">This Week's Parsha</button></div>
<div class="shabbat-times">
<div class="times-header">🕯️ This Shabbat (January 24-25)</div>
<div class="times-grid">
<div class="time-item"><div class="time-label">CANDLE LIGHTING</div><div class="time-value">4:45 PM</div></div>
<div class="time-item"><div class="time-label">HAVDALAH</div><div class="time-value">5:52 PM</div></div>
<div class="time-item"><div class="time-label">PARSHA</div><div class="time-value">Yitro</div></div>
</div>
</div>
<div class="services" id="services"></div>
<script>
const services=[
{name:'Kabbalat Shabbat',hebrew:'קבלת שבת',day:'Friday',time:'5:00 PM',type:'EREV SHABBAT',rabbi:'Rabbi Sarah',location:'Main Sanctuary',style:'Musical'},
{name:'Shabbat Morning Service',hebrew:'שחרית',day:'Saturday',time:'9:30 AM',type:'SHACHARIT',rabbi:'Rabbi David',location:'Main Sanctuary',style:'Traditional'},
{name:'Torah Service & D\'var Torah',hebrew:'קריאת התורה',day:'Saturday',time:'10:30 AM',type:'TORAH',rabbi:'Rabbi David',location:'Main Sanctuary',style:'Traditional'},
{name:'Junior Congregation',hebrew:'',day:'Saturday',time:'10:30 AM',type:'YOUTH',rabbi:'Youth Director',location:'Youth Lounge',style:'Family-friendly'},
{name:'Mincha/Maariv',hebrew:'מנחה/מעריב',day:'Saturday',time:'4:30 PM',type:'AFTERNOON',rabbi:'Rabbi Sarah',location:'Chapel',style:'Traditional'}
];
document.getElementById('services').innerHTML=services.map(s=>`
<div class="service">
<div class="service-header">
<div>
<div class="service-name">${s.name}</div>
${s.hebrew?`<div class="service-hebrew">${s.hebrew}</div>`:''}
<div class="service-day">📅 ${s.day} at ${s.time}</div>
</div>
<span class="service-type">${s.type}</span>
</div>
<div class="service-details">
<div class="detail"><div class="detail-label">LED BY</div><div class="detail-value">${s.rabbi}</div></div>
<div class="detail"><div class="detail-label">LOCATION</div><div class="detail-value">${s.location}</div></div>
<div class="detail"><div class="detail-label">STYLE</div><div class="detail-value">${s.style}</div></div>
</div>
</div>`).join('');
</script>
</body>
</html>
