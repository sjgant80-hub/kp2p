<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hebrew School - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"hebrew-school","name":"Hebrew School","icon":"📚","desc":"Religious education","category":"synagogue","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#1d4ed8}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.grades{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.grade{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.grade.active{background:#1d4ed8;border-color:#1d4ed8}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.class{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.class-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.class-name{font-size:1.125rem;font-weight:bold}
.class-grade{font-size:.75rem;color:#1d4ed8}
.class-enrolled{padding:4px 10px;border-radius:4px;font-size:.7rem;background:#1d4ed833;color:#1d4ed8}
.class-schedule{font-size:.875rem;color:#888;margin-bottom:15px}
.class-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:10px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:2px}
.detail-value{font-size:.875rem}
.class-topics{font-size:.75rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>📚 Hebrew School</h1><button class="btn">Enroll Student</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">145</div><div class="stat-label">STUDENTS</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">CLASSES</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">TEACHERS</div></div>
<div class="stat"><div class="stat-value">15</div><div class="stat-label">B'NAI MITZVAH</div></div>
</div>
<div class="grades">
<button class="grade active">All Grades</button>
<button class="grade">Kindergarten</button>
<button class="grade">Grades 1-2</button>
<button class="grade">Grades 3-4</button>
<button class="grade">Grades 5-6</button>
<button class="grade">B'nai Mitzvah</button>
</div>
<div class="classes" id="classes"></div>
<script>
const classes=[
{name:'Aleph Class',grade:'Kindergarten',schedule:'Sundays 9:30-11:30 AM',teacher:'Morah Rachel',room:'Room 101',enrolled:12,max:15,topics:'Hebrew letters, holidays, songs'},
{name:'Bet Class',grade:'Grades 1-2',schedule:'Sundays 9:30-11:30 AM',teacher:'Morah Lisa',room:'Room 102',enrolled:18,max:20,topics:'Basic Hebrew reading, Torah stories'},
{name:'Gimel Class',grade:'Grades 3-4',schedule:'Sundays 9:30-11:30 AM',teacher:'Moreh David',room:'Room 103',enrolled:16,max:18,topics:'Hebrew reading, Jewish history'},
{name:'Dalet Class',grade:'Grades 5-6',schedule:'Sundays 9:30-11:30 AM',teacher:'Morah Sarah',room:'Room 104',enrolled:14,max:16,topics:'Advanced Hebrew, Israel studies'},
{name:'Bar/Bat Mitzvah Prep',grade:'6th-7th Grade',schedule:'Tuesdays 4:30-6:00 PM',teacher:'Cantor Michael',room:'Chapel',enrolled:15,max:15,topics:'Torah reading, d\'var Torah, service leading'},
{name:'Confirmation Class',grade:'9th-10th Grade',schedule:'Sundays 12:00-1:30 PM',teacher:'Rabbi Sarah',room:'Youth Lounge',enrolled:8,max:12,topics:'Jewish identity, ethics, community service'}
];
document.getElementById('classes').innerHTML=classes.map(c=>`
<div class="class">
<div class="class-header">
<div>
<div class="class-name">${c.name}</div>
<div class="class-grade">${c.grade}</div>
</div>
<span class="class-enrolled">${c.enrolled}/${c.max}</span>
</div>
<div class="class-schedule">📅 ${c.schedule}</div>
<div class="class-details">
<div class="detail"><div class="detail-label">TEACHER</div><div class="detail-value">${c.teacher}</div></div>
<div class="detail"><div class="detail-label">ROOM</div><div class="detail-value">${c.room}</div></div>
</div>
<div class="class-topics">📖 ${c.topics}</div>
</div>`).join('');
</script>
</body>
</html>
