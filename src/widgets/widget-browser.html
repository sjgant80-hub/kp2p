<!DOCTYPE html>
<!--
Widget Browser - KISS MySaaS Widget Index
Browse, search, and preview all 500+ widgets
Compass Layout: Categories on edges, Widgets in center
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Widget Browser - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">
  {
    "id": "widget-browser",
    "name": "Widget Browser",
    "category": "utility",
    "version": "2.0.0",
    "icon": "🗂️",
    "desc": "Browse and search all KISS MySaaS widgets",
    "body": "Compass layout with categories on edges, widgets in center. Search and filter 500+ widgets.",
    "kills": ["Manual widget lists", "Outdated indexes"],
    "price": 0
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden; }

    /* Compass Layout */
    .compass { display: grid; grid-template: auto 1fr auto / auto 1fr auto; height: 100vh; gap: 1px; background: #222; }

    /* North - Header & Search */
    .north { grid-column: 1 / -1; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .logo { font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
    .logo span { color: #e94560; }
    .search-box { flex: 1; min-width: 200px; max-width: 400px; position: relative; }
    .search-box input { width: 100%; padding: 10px 14px 10px 36px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 13px; }
    .search-box input:focus { outline: none; border-color: #e94560; }
    .search-box::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    .stats { display: flex; gap: 16px; font-size: 12px; color: #888; }
    .stats strong { color: #e94560; }

    /* Category Rails (West & East) */
    .west, .east { background: #111; width: 140px; overflow-y: auto; overflow-x: hidden; }
    .west::-webkit-scrollbar, .east::-webkit-scrollbar, .north-cats::-webkit-scrollbar, .south-cats::-webkit-scrollbar { width: 4px; height: 4px; }
    .west::-webkit-scrollbar-thumb, .east::-webkit-scrollbar-thumb, .north-cats::-webkit-scrollbar-thumb, .south-cats::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .rail-title { font-size: 9px; text-transform: uppercase; color: #555; padding: 8px 10px 4px; letter-spacing: 1px; position: sticky; top: 0; background: #111; z-index: 1; }
    .cat-btn { display: block; width: 100%; padding: 6px 10px; background: none; border: none; color: #888; font-size: 11px; text-align: left; cursor: pointer; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cat-btn:hover { background: #1a1a1a; color: #fff; }
    .cat-btn.active { background: #e94560; color: #fff; }
    .cat-btn .icon { margin-right: 4px; }

    /* North & South Category Strips */
    .north-cats, .south-cats { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; flex-shrink: 0; }
    .north-strip, .south-strip { grid-column: 1 / -1; background: #0d0d0d; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
    .strip-label { font-size: 9px; text-transform: uppercase; color: #444; white-space: nowrap; }
    .chip { padding: 5px 10px; background: #1a1a1a; border: 1px solid #282828; border-radius: 4px; font-size: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; color: #999; }
    .chip:hover { border-color: #e94560; color: #fff; }
    .chip.active { background: #e94560; border-color: #e94560; color: #fff; }

    /* Center - Widget Grid */
    .center { background: #0a0a0a; overflow-y: auto; padding: 16px; }
    .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

    /* Widget Card */
    .card { background: #111; border: 1px solid #1a1a1a; border-radius: 10px; padding: 14px; cursor: pointer; transition: all 0.2s; }
    .card:hover { border-color: #e94560; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233,69,96,0.15); }
    .card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .card-icon { font-size: 28px; line-height: 1; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .card-desc { font-size: 11px; color: #666; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
    .tag { font-size: 9px; padding: 2px 6px; background: #1a1a1a; border-radius: 3px; color: #666; }
    .tag.cat { background: #16213e; color: #64b5f6; }
    .badge { font-size: 8px; padding: 2px 5px; border-radius: 3px; font-weight: 700; }
    .badge.ent { background: #7c3aed; color: #fff; }
    .badge.new { background: #22c55e; color: #000; }
    .badge.ai { background: #0ea5e9; color: #fff; }
    .badge.p2p { background: #f59e0b; color: #000; }

    /* South - Footer */
    .south { grid-column: 1 / -1; background: #0a0a0a; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #444; border-top: 1px solid #1a1a1a; }
    .south a { color: #e94560; text-decoration: none; }

    /* Loading & Empty */
    .loading, .empty { text-align: center; padding: 48px; color: #444; }
    .loading-spin { animation: spin 1s linear infinite; display: inline-block; font-size: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px; }
    .modal.open { display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #111; border-radius: 12px; max-width: 1100px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
    .modal-head { padding: 16px 20px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
    .modal-head h2 { flex: 1; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; }
    .modal-close:hover { color: #fff; }
    .modal-body { flex: 1; }
    .modal-frame { width: 100%; height: 500px; border: none; background: #fff; border-radius: 0 0 12px 12px; }
    .modal-foot { padding: 12px 20px; border-top: 1px solid #222; display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: none; }
    .btn-primary { background: #e94560; color: #fff; text-decoration: none; }
    .btn-secondary { background: #222; color: #fff; }
  </style>
</head>
<body>
  <div class="compass">
    <!-- NORTH: Header, Search, Stats -->
    <header class="north">
      <div class="logo">🗂️ <span>Widgets</span></div>
      <div class="search-box">
        <input type="text" id="search" placeholder="Search 500+ widgets...">
      </div>
      <div class="stats">
        <span><strong id="totalCount">0</strong> widgets</span>
        <span><strong id="catCount">0</strong> categories</span>
        <span>showing <strong id="visibleCount">0</strong></span>
      </div>
      <button class="chip" id="resetBtn" style="display:none">✕ Reset</button>
    </header>

    <!-- NORTH STRIP: Core Categories -->
    <div class="north-strip">
      <span class="strip-label">Core:</span>
      <div class="north-cats" id="northCats"></div>
    </div>

    <!-- WEST: Enterprise A-L -->
    <aside class="west" id="westRail">
      <div class="rail-title">Enterprise A-L</div>
    </aside>

    <!-- CENTER: Widget Grid -->
    <main class="center" id="center">
      <div class="loading" id="loading"><span class="loading-spin">⟳</span><p>Loading widgets...</p></div>
      <div class="widget-grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">🔍 No widgets match</div>
    </main>

    <!-- EAST: Enterprise M-Z -->
    <aside class="east" id="eastRail">
      <div class="rail-title">Enterprise M-Z</div>
    </aside>

    <!-- SOUTH STRIP: Recreation -->
    <div class="south-strip">
      <span class="strip-label">Recreation:</span>
      <div class="south-cats" id="southCats"></div>
    </div>

    <!-- SOUTH: Footer -->
    <footer class="south">
      <span>KISS MySaaS • <a href="index.html">Home</a></span>
      <span>Open Source • Forever Free</span>
    </footer>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2><span id="modalIcon"></span> <span id="modalName"></span></h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <iframe class="modal-frame" id="modalFrame"></iframe>
      </div>
      <div class="modal-foot">
        <a id="modalOpen" href="#" target="_blank" class="btn btn-primary">Open Full</a>
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // Widget Browser v2 - Compass Layout
    // =========================================================================

    let allWidgets = [];
    let activeCategory = 'all';
    let searchQuery = '';

    // Category organization for compass layout
    const coreCategories = ['ai', 'dev', 'productivity', 'business', 'comm', 'utility', 'data', 'industrial', 'p2p', 'games', 'lifestyle'];
    const recreationCategories = ['golf', 'tennis', 'skiing', 'swimming', 'bowling', 'archery', 'climbing', 'diving', 'sailing', 'kayak', 'surf', 'fishing', 'camping', 'hunting', 'rafting', 'skydiving', 'bingo', 'trampoline', 'minigolf', 'gokart', 'paintball', 'lasertag', 'zipline', 'segway', 'paragliding', 'bungee', 'waterpark', 'cinema', 'casino', 'aquarium', 'zoo', 'museum', 'concert', 'planetarium', 'library', 'theater', 'fairground', 'aquatic', 'racetrack', 'amusement', 'arcade', 'escape', 'skating', 'equestrian', 'martial', 'yoga', 'gym', 'fitness'];

    // Icons for categories
    const catIcons = {
      ai: '🤖', dev: '💻', productivity: '📋', business: '💼', comm: '💬', utility: '🔧',
      data: '🗄️', industrial: '🏭', p2p: '🔗', games: '🎮', lifestyle: '🌟',
      hr: '👥', finance: '💰', service: '🎧', marketing: '📣', legal: '⚖️',
      retail: '🛒', healthcare: '🏥', education: '📚', events: '🎪', realestate: '🏠',
      hospitality: '🏨', transport: '🚌', government: '🏛️', nonprofit: '❤️', construction: '🏗️',
      energy: '⚡', agriculture: '🌾', media: '📺', sports: '⚽', science: '🔬',
      insurance: '🛡️', logistics: '📦', manufacturing: '�icing', automotive: '🚗', telecom: '📡',
      aviation: '✈️', mining: '⛏️', pharma: '💊', banking: '🏦', security: '🔒',
      food: '🍽️', chemical: '🧪', textile: '🧵', furniture: '🪑', printing: '🖨️',
      gaming: '🎰', beauty: '💅', pet: '🐾', jewelry: '💎', wine: '🍷',
      music: '🎵', photography: '📷', dental: '🦷', veterinary: '🐕', catering: '🍴',
      landscaping: '🌳', plumbing: '🔧', hvac: '❄️', cleaning: '🧹', electrical: '⚡',
      roofing: '🏠', flooring: '🪵', painting: '🎨', moving: '📦', pool: '🏊',
      pest: '🐜', appliance: '🔌', window: '🪟', locksmith: '🔑', taxi: '🚕',
      daycare: '👶', bakery: '🥐', florist: '💐', tutoring: '📖', spa: '💆',
      brewery: '🍺', carwash: '🚿', laundry: '👕', coffee: '☕', tattoo: '💉',
      notary: '📝', driving: '🚗', marina: '⚓', storage: '📦', vending: '🎰',
      rental: '🔄', courier: '🚚', optometry: '👓', chiro: '🦴', photobooth: '📸',
      acupuncture: '📍', dj: '🎧', tailor: '✂️', accounting: '📊', nursery: '🌱',
      massage: '💆', golf: '⛳', tennis: '🎾', skiing: '⛷️', bowling: '🎳',
      archery: '🏹', climbing: '🧗', diving: '🤿', sailing: '⛵', kayak: '🛶',
      surf: '🏄', fishing: '🎣', camping: '🏕️', hunting: '🦌', rafting: '🚣',
      skydiving: '🪂', bingo: '🎱', trampoline: '🤸', minigolf: '⛳', gokart: '🏎️',
      paintball: '🎯', lasertag: '🔫', zipline: '🎢', paragliding: '🪂', bungee: '🪢',
      waterpark: '🌊', cinema: '🎬', casino: '🎰', aquarium: '🐠', zoo: '🦁',
      museum: '🏛️', concert: '🎤', planetarium: '🌟', theater: '🎭', fairground: '🎡',
      observatory: '🔭', botanic: '🌺', racetrack: '🏇', amusement: '🎢', cruise: '🚢',
      resort: '🏖️', stadium: '🏟️', convention: '🎪', memorial: '🪦', winery: '🍇',
      stable: '🐴', kennel: '🐕', coworking: '🏢', datacenter: '🖥️', incubator: '🚀',
      makerspace: '🛠️', hangar: '✈️', shelter: '🏠', church: '⛪', mosque: '🕌',
      synagogue: '🕍', temple: '🛕', monastery: '⛩️', farm: '🚜', greenhouse: '🌿',
      mechanic: '🔧', atv: '🏍️', snowmobile: '🛷', boat: '🚤', rv: '🚐',
      motorcycle: '🏍️', bicycle: '🚲', scooter: '🛴', helicopter: '🚁', drone: '🛸',
      jetski: '🚤', hovercraft: '🛥️', submarine: '🚢', trolley: '🚃', gondola: '🚡',
      funicular: '🚞', monorail: '🚝', ferry: '⛴️', tram: '🚊', shuttle: '🚐',
      limousine: '🚗', pedicab: '🚲', rickshaw: '🛺', cablecar: '🚡'
    };

    // Load manifest and widgets
    async function loadWidgets() {
      try {
        const res = await fetch('manifest.json');
        const manifest = await res.json();
        const files = [];

        // Build file list from directories
        if (manifest.directories) {
          for (const [dir, widgets] of Object.entries(manifest.directories)) {
            for (const widget of widgets) {
              files.push({ path: `${dir}/${widget}`, dir });
            }
          }
        }

        // Load widget metadata
        const loadPromises = files.map(async ({ path, dir }) => {
          try {
            const res = await fetch(path);
            const html = await res.text();
            const metaMatch = html.match(/<script[^>]*id="widget-meta"[^>]*>([\s\S]*?)<\/script>/i);
            if (metaMatch) {
              const meta = JSON.parse(metaMatch[1]);
              meta.file = path;
              meta.directory = dir;
              return meta;
            }
            const titleMatch = html.match(/<title>([^<]+)<\/title>/i);
            return {
              id: path.split('/').pop().replace('.html', ''),
              name: titleMatch ? titleMatch[1].split('-')[0].trim() : path.split('/').pop().replace('.html', ''),
              icon: catIcons[dir] || '📦',
              desc: '',
              directory: dir,
              file: path
            };
          } catch (e) {
            return null;
          }
        });

        allWidgets = (await Promise.all(loadPromises)).filter(w => w && w.id !== 'widget-browser' && w.id !== 'widget-directory');

        document.getElementById('loading').style.display = 'none';
        buildCategoryRails();
        renderWidgets();
        updateStats();

      } catch (e) {
        document.getElementById('loading').innerHTML = '<p>Failed to load widgets</p>';
      }
    }

    // Build category navigation rails
    function buildCategoryRails() {
      const allDirs = [...new Set(allWidgets.map(w => w.directory))].sort();

      // Core categories - North strip
      const northCats = document.getElementById('northCats');
      northCats.innerHTML = '<span class="chip active" data-cat="all">All</span>' +
        coreCategories.filter(c => allDirs.includes(c) || c === 'comm').map(c =>
          `<span class="chip" data-cat="${c}">${catIcons[c] || '📦'} ${c}</span>`
        ).join('');

      // Enterprise A-L - West rail
      const westRail = document.getElementById('westRail');
      const westCats = allDirs.filter(d => !coreCategories.includes(d) && !recreationCategories.includes(d) && d.toLowerCase() < 'm');
      westCats.forEach(c => {
        westRail.innerHTML += `<button class="cat-btn" data-cat="${c}"><span class="icon">${catIcons[c] || '📦'}</span>${c}</button>`;
      });

      // Enterprise M-Z - East rail
      const eastRail = document.getElementById('eastRail');
      const eastCats = allDirs.filter(d => !coreCategories.includes(d) && !recreationCategories.includes(d) && d.toLowerCase() >= 'm');
      eastCats.forEach(c => {
        eastRail.innerHTML += `<button class="cat-btn" data-cat="${c}"><span class="icon">${catIcons[c] || '📦'}</span>${c}</button>`;
      });

      // Recreation - South strip
      const southCats = document.getElementById('southCats');
      const recCats = allDirs.filter(d => recreationCategories.includes(d));
      southCats.innerHTML = recCats.map(c =>
        `<span class="chip" data-cat="${c}">${catIcons[c] || '🎮'} ${c}</span>`
      ).join('');

      // Event delegation for all category buttons
      document.addEventListener('click', (e) => {
        if (e.target.matches('.chip, .cat-btn')) {
          document.querySelectorAll('.chip, .cat-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          activeCategory = e.target.dataset.cat;
          document.getElementById('resetBtn').style.display = activeCategory === 'all' ? 'none' : 'inline-block';
          renderWidgets();
        }
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        activeCategory = 'all';
        searchQuery = '';
        document.getElementById('search').value = '';
        document.querySelectorAll('.chip, .cat-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-cat="all"]').classList.add('active');
        document.getElementById('resetBtn').style.display = 'none';
        renderWidgets();
      });

      document.getElementById('catCount').textContent = allDirs.length;
    }

    // Render widget grid
    function renderWidgets() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');

      let filtered = allWidgets.filter(w => {
        if (activeCategory !== 'all' && w.directory !== activeCategory) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const searchable = `${w.name} ${w.desc} ${w.directory} ${w.id}`.toLowerCase();
          if (!searchable.includes(q)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => a.name.localeCompare(b.name));
      document.getElementById('visibleCount').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = filtered.map(w => {
        const badge = getBadge(w);
        return `
          <div class="card" onclick="openPreview('${w.file}', '${w.icon || catIcons[w.directory] || '📦'}', '${esc(w.name)}')">
            <div class="card-head">
              <span class="card-icon">${w.icon || catIcons[w.directory] || '📦'}</span>
              <div class="card-info">
                <div class="card-name">${w.name} ${badge}</div>
                <div class="card-desc">${w.desc || ''}</div>
              </div>
            </div>
            <div class="card-meta">
              <span class="tag cat">${w.directory}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function getBadge(w) {
      const b = w.badge || '';
      if (b === 'ENT') return '<span class="badge ent">ENT</span>';
      if (b === 'AI') return '<span class="badge ai">AI</span>';
      if (b === 'P2P') return '<span class="badge p2p">P2P</span>';
      if (b === 'NEW') return '<span class="badge new">NEW</span>';
      return '';
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = allWidgets.length;
    }

    function openPreview(file, icon, name) {
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalName').textContent = name;
      document.getElementById('modalFrame').src = file;
      document.getElementById('modalOpen').href = file;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.getElementById('modalFrame').src = '';
    }

    function esc(s) {
      return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      document.getElementById('resetBtn').style.display = searchQuery || activeCategory !== 'all' ? 'inline-block' : 'none';
      renderWidgets();
    });

    // Modal close
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

    // Init
    loadWidgets();
  </script>
</body>
</html>
