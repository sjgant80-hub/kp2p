<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memorial Services - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"memorial-services","name":"Memorial Services","icon":"🕯️","desc":"Schedule services","category":"memorial","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#6b7280;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.upcoming{background:linear-gradient(135deg,#4b5563 0%,#374151 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.upcoming-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.upcoming-title{font-size:1.25rem;font-weight:bold;margin-bottom:10px}
.upcoming-info{display:flex;gap:20px;font-size:.875rem;opacity:.9}
.services{display:flex;flex-direction:column;gap:15px}
.service{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.service-header{padding:20px;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}
.service-info h4{margin-bottom:5px}
.service-type{font-size:.75rem;color:#888;margin-bottom:8px}
.service-meta{font-size:.875rem;color:#888}
.service-status{padding:6px 12px;border-radius:6px;font-size:.75rem;height:fit-content}
.status-scheduled{background:#22c55e33;color:#22c55e}
.status-pending{background:#f59e0b33;color:#f59e0b}
.status-complete{background:#6366f133;color:#6366f1}
.service-details{padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.detail{background:#252525;padding:12px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:5px}
.detail-value{font-size:.875rem}
</style>
</head>
<body>
<div class="header"><h1>🕯️ Memorial Services</h1><button class="btn">Schedule Service</button></div>
<div class="upcoming">
<div class="upcoming-label">NEXT SERVICE</div>
<div class="upcoming-title">Celebration of Life - Margaret Wilson</div>
<div class="upcoming-info">
<span>📅 Today, 2:00 PM</span>
<span>📍 Chapel of Peace</span>
<span>👥 Expected: 75 guests</span>
</div>
</div>
<div class="services" id="services"></div>
<script>
const services=[
{name:'Margaret Wilson',type:'Celebration of Life',date:'Today',time:'2:00 PM',venue:'Chapel of Peace',officiant:'Rev. Thomas',guests:75,flowers:'Rose Arrangements',status:'scheduled'},
{name:'James Patterson',type:'Graveside Service',date:'Tomorrow',time:'10:00 AM',venue:'Garden of Serenity',officiant:'Pastor Sarah',guests:30,flowers:'White Lilies',status:'scheduled'},
{name:'Dorothy Chen',type:'Memorial Service',date:'Jan 22',time:'11:00 AM',venue:'Main Chapel',officiant:'Rev. Michael',guests:120,flowers:'Mixed Bouquets',status:'pending'},
{name:'Richard Thompson',type:'Interment',date:'Jan 18',time:'3:00 PM',venue:'Veterans Section',officiant:'Military Chaplain',guests:45,flowers:'Flag & Roses',status:'complete'}
];
document.getElementById('services').innerHTML=services.map(s=>`
<div class="service">
<div class="service-header">
<div class="service-info">
<h4>${s.name}</h4>
<div class="service-type">${s.type.toUpperCase()}</div>
<div class="service-meta">📅 ${s.date} at ${s.time}</div>
</div>
<span class="service-status status-${s.status}">${s.status.toUpperCase()}</span>
</div>
<div class="service-details">
<div class="detail"><div class="detail-label">VENUE</div><div class="detail-value">${s.venue}</div></div>
<div class="detail"><div class="detail-label">OFFICIANT</div><div class="detail-value">${s.officiant}</div></div>
<div class="detail"><div class="detail-label">EXPECTED GUESTS</div><div class="detail-value">${s.guests}</div></div>
<div class="detail"><div class="detail-label">FLOWERS</div><div class="detail-value">${s.flowers}</div></div>
</div>
</div>`).join('');
</script>
</body>
</html>
