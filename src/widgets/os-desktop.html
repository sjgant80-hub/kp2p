<!DOCTYPE html>
<!--
@file os-desktop.html
@desc KonomiOS Desktop Widget - Embeddable P2P operating system
@api  window.KonomiOS - desktop controller
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KonomiOS Desktop</title>
  <style>
    :root{--b:#0a0a12;--b2:#12121e;--f:#e4e4e7;--a:#00d9ff;--a2:#7c3aed;--g:#10b981;--r:#ef4444;--o:#f97316;--gl:rgba(12,12,20,.92)}
    *{margin:0;padding:0;box-sizing:border-box}
    body,html{height:100%;overflow:hidden}
    body{font:12px/1.4 system-ui,sans-serif;background:var(--b);color:var(--f);user-select:none}
    .gpu{will-change:transform;transform:translateZ(0)}

    /* Desktop */
    .desktop{position:absolute;inset:0 0 40px 0;background:linear-gradient(135deg,#0a0a12,#12121e 50%,#0a1628);overflow:hidden}
    .icons{position:absolute;top:12px;left:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;z-index:5}
    .icon{width:64px;text-align:center;cursor:pointer;padding:6px;border-radius:8px;transition:background .15s}
    .icon:hover{background:rgba(255,255,255,.06)}
    .icon i{font-size:28px;display:block;margin-bottom:2px;font-style:normal}
    .icon span{font-size:9px;opacity:.7}

    /* Windows */
    .win{position:absolute;background:var(--gl);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:10px;box-shadow:0 6px 32px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden;min-width:200px;min-height:120px;resize:both;z-index:10;contain:layout}
    .win.open{display:flex}
    .win.active{z-index:100}
    .win.max{inset:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
    .win-header{padding:8px 10px;background:rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;cursor:move}
    .win-btns{display:flex;gap:5px}
    .win-btns b{width:11px;height:11px;border-radius:50%;cursor:pointer}
    .win-btns .close{background:var(--r)}
    .win-btns .min{background:var(--o)}
    .win-btns .max{background:var(--g)}
    .win-title{flex:1;font-size:10px;font-weight:500;opacity:.8}
    .win-body{flex:1;overflow:hidden;display:flex;flex-direction:column;contain:content}

    /* Taskbar */
    .taskbar{position:absolute;bottom:0;left:0;right:0;height:40px;background:rgba(0,0,0,.85);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 8px;gap:6px;z-index:200}
    .start-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--a),var(--a2));border-radius:6px;font-size:14px;cursor:pointer}
    .task-apps{display:flex;gap:3px;flex:1;overflow-x:auto}
    .task-apps::-webkit-scrollbar{display:none}
    .task-app{padding:5px 10px;background:rgba(255,255,255,.04);border-radius:5px;font-size:9px;cursor:pointer;white-space:nowrap}
    .task-app.active{background:rgba(0,217,255,.12);color:var(--a)}
    .tray{display:flex;align-items:center;gap:8px;font-size:9px;opacity:.8}
    .tray .dot{width:6px;height:6px;border-radius:50%;background:#64748b}
    .tray .dot.on{background:var(--g);box-shadow:0 0 6px var(--g)}

    /* Start Menu */
    .start-menu{position:absolute;bottom:46px;left:8px;width:200px;background:var(--gl);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:10px;box-shadow:0 6px 32px rgba(0,0,0,.4);display:none;overflow:hidden;z-index:300}
    .start-menu.open{display:block}
    .start-menu header{display:block;padding:10px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:11px;font-weight:600}
    .start-menu header small{display:block;font-size:8px;opacity:.7;font-weight:400}
    .start-item{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;font-size:10px}
    .start-item:hover{background:rgba(255,255,255,.06)}
    .start-item i{font-size:14px;font-style:normal}

    /* App content styles */
    .app-panel{flex:1;overflow-y:auto;padding:10px}
    .app-input{display:flex;padding:6px;gap:4px;background:rgba(0,0,0,.25)}
    .app-input input{flex:1;padding:7px 10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:8px;color:var(--f);font-size:10px;outline:0}
    .app-input button{padding:7px 14px;background:var(--a);border:0;border-radius:8px;color:#000;font-weight:600;font-size:9px;cursor:pointer}
    .msg{margin-bottom:6px;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;font-size:10px}
    .msg.self{background:linear-gradient(135deg,var(--a),var(--a2));margin-left:20%}
    .msg .meta{font-size:8px;color:#64748b;margin-bottom:2px}
    .msg.self .meta{color:rgba(255,255,255,.6)}
    .term{flex:1;background:rgba(0,0,0,.5);padding:8px;overflow-y:auto;font:10px/1.4 'SF Mono',monospace}
    .term .line{margin-bottom:1px}.term .p{color:var(--g)}.term .o{color:#94a3b8}.term .e{color:var(--r)}.term .i{color:var(--a)}
    .term-input{display:flex;padding:5px 8px;background:rgba(0,0,0,.35);gap:4px}
    .term-input input{flex:1;background:0;border:0;color:var(--f);font:inherit;outline:0}
    .empty{text-align:center;padding:20px;color:#64748b;font-size:10px}
  </style>
</head>
<body>
  <div class="desktop" id="desktop"></div>
  <div class="start-menu" id="startMenu">
    <header>KonomiOS<small>Desktop Widget</small></header>
    <div id="startItems"></div>
  </div>
  <div class="taskbar">
    <div class="start-btn" id="startBtn">🌍</div>
    <div class="task-apps" id="taskApps"></div>
    <div class="tray">
      <span class="dot" id="netDot"></span>
      <span id="netStatus">Offline</span>
      <span id="clock">--:--</span>
    </div>
  </div>

  <script type="module">
    /**
     * KonomiOS Desktop Widget
     * Embeddable P2P operating system with windowed apps
     *
     * @usage
     *   const os = window.KonomiOS;
     *   os.openApp('chat');
     *   os.registerApp('myapp', { name: 'My App', icon: '🎮', render: (el) => { ... } });
     *   os.on('app:open', (appId) => console.log('Opened:', appId));
     */

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const h = (t, c, html) => { const e = document.createElement(t); if(c) e.className = c; if(html) e.innerHTML = html; return e; };

    class KonomiOS {
      constructor() {
        this.apps = new Map();
        this.windows = new Map();
        this.openApps = new Set();
        this.activeApp = null;
        this.zIndex = 10;
        this.drag = null;

        this.handlers = {
          'app:open': [],
          'app:close': [],
          'app:focus': [],
          ready: []
        };

        // Register built-in apps
        this.registerBuiltinApps();
        this.init();
      }

      // Event system
      on(event, handler) {
        if (this.handlers[event]) this.handlers[event].push(handler);
        return () => this.off(event, handler);
      }

      off(event, handler) {
        if (this.handlers[event]) {
          this.handlers[event] = this.handlers[event].filter(h => h !== handler);
        }
      }

      emit(event, ...args) {
        if (this.handlers[event]) {
          this.handlers[event].forEach(h => h(...args));
        }
      }

      registerBuiltinApps() {
        // Chat app
        this.registerApp('chat', {
          name: 'Chat',
          icon: '💬',
          width: 320,
          height: 300,
          render: (body) => {
            body.innerHTML = `
              <div class="app-panel" id="chatMsgs"><div class="empty">No messages yet</div></div>
              <div class="app-input">
                <input id="chatIn" placeholder="Type a message...">
                <button id="chatSend">Send</button>
              </div>
            `;
            const msgs = $('chatMsgs');
            const input = $('chatIn');
            const send = () => {
              const text = input.value.trim();
              if (!text) return;
              if (msgs.querySelector('.empty')) msgs.innerHTML = '';
              const m = h('div', 'msg self', `<div class="meta">You</div>${esc(text)}`);
              msgs.appendChild(m);
              msgs.scrollTop = msgs.scrollHeight;
              input.value = '';
              this.emit('chat:send', text);
            };
            $('chatSend').onclick = send;
            input.onkeydown = e => e.key === 'Enter' && send();
          }
        });

        // Terminal app
        this.registerApp('terminal', {
          name: 'Terminal',
          icon: '💻',
          width: 400,
          height: 260,
          render: (body) => {
            body.innerHTML = `
              <div class="term" id="termOut"></div>
              <div class="term-input"><span style="color:var(--g)">❯</span><input id="termIn" placeholder="command..."></div>
            `;
            const out = $('termOut');
            const input = $('termIn');
            const print = (text, cls = 'o') => {
              out.appendChild(h('div', 'line ' + cls, esc(text)));
              out.scrollTop = out.scrollHeight;
            };
            print('KonomiOS Terminal', 'i');
            print('Type "help" for commands', 'i');

            const cmds = {
              help: () => 'Commands: help, clear, echo, date, apps',
              clear: () => { out.innerHTML = ''; return ''; },
              echo: (args) => args.join(' '),
              date: () => new Date().toLocaleString(),
              apps: () => [...this.apps.keys()].join(', ')
            };

            const run = () => {
              const val = input.value.trim();
              if (!val) return;
              input.value = '';
              print('$ ' + val, 'p');
              const [cmd, ...args] = val.split(' ');
              if (cmds[cmd]) {
                const result = cmds[cmd](args);
                if (result) print(result);
              } else {
                print('Unknown: ' + cmd, 'e');
              }
            };
            input.onkeydown = e => e.key === 'Enter' && run();
          }
        });

        // Files app
        this.registerApp('files', {
          name: 'Files',
          icon: '📁',
          width: 280,
          height: 240,
          render: (body) => {
            const files = JSON.parse(localStorage.getItem('kos-files') || '[]');
            body.innerHTML = `
              <div class="app-panel" id="fileList">
                ${files.length ? files.map(f => `<div class="msg" style="cursor:pointer">📄 ${esc(f.name)}</div>`).join('') : '<div class="empty">No files</div>'}
              </div>
              <div class="app-input">
                <input id="fileName" placeholder="filename.txt">
                <button id="fileNew">+ New</button>
              </div>
            `;
            $('fileNew').onclick = () => {
              const name = $('fileName').value.trim();
              if (!name) return;
              files.push({ name, content: '' });
              localStorage.setItem('kos-files', JSON.stringify(files));
              this.openApp('files'); // Refresh
            };
          }
        });

        // Settings app
        this.registerApp('settings', {
          name: 'Settings',
          icon: '⚙️',
          width: 280,
          height: 220,
          render: (body) => {
            body.innerHTML = `
              <div class="app-panel">
                <div class="msg"><strong>Theme</strong><br>Dark (default)</div>
                <div class="msg"><strong>Room</strong><br><input value="konomi-global" style="width:100%;padding:4px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:4px;color:#fff;font-size:10px;margin-top:4px"></div>
                <div class="msg"><strong>Version</strong><br>KonomiOS Widget v1.0</div>
              </div>
            `;
          }
        });

        // Notes app
        this.registerApp('notes', {
          name: 'Notes',
          icon: '📝',
          width: 300,
          height: 280,
          render: (body) => {
            const saved = localStorage.getItem('kos-notes') || '';
            body.innerHTML = `<textarea id="notesArea" style="flex:1;width:100%;padding:10px;background:rgba(0,0,0,.3);border:0;color:#fff;font-size:11px;resize:none;outline:0" placeholder="Type your notes...">${esc(saved)}</textarea>`;
            $('notesArea').oninput = (e) => localStorage.setItem('kos-notes', e.target.value);
          }
        });
      }

      registerApp(id, config) {
        this.apps.set(id, {
          id,
          name: config.name || id,
          icon: config.icon || '📦',
          width: config.width || 300,
          height: config.height || 200,
          x: config.x || 50 + Math.random() * 100,
          y: config.y || 50 + Math.random() * 80,
          render: config.render || (() => {})
        });
      }

      openApp(id) {
        const app = this.apps.get(id);
        if (!app) return;

        // If already open, just focus
        if (this.openApps.has(id)) {
          this.focusApp(id);
          return;
        }

        // Create window
        const win = h('div', 'win gpu');
        win.id = 'win-' + id;
        win.style.cssText = `width:${app.width}px;height:${app.height}px;left:${app.x}px;top:${app.y}px`;
        win.innerHTML = `
          <div class="win-header" data-app="${id}">
            <div class="win-btns">
              <b class="close" data-action="close"></b>
              <b class="min" data-action="min"></b>
              <b class="max" data-action="max"></b>
            </div>
            <span class="win-title">${app.icon} ${app.name}</span>
          </div>
          <div class="win-body" id="body-${id}"></div>
        `;

        $('desktop').appendChild(win);
        this.windows.set(id, win);
        this.openApps.add(id);

        // Render app content
        app.render($('body-' + id));

        // Show and focus
        requestAnimationFrame(() => {
          win.classList.add('open');
          this.focusApp(id);
        });

        this.updateTaskbar();
        this.emit('app:open', id);
      }

      closeApp(id) {
        const win = this.windows.get(id);
        if (!win) return;

        win.classList.remove('open');
        setTimeout(() => win.remove(), 150);

        this.windows.delete(id);
        this.openApps.delete(id);
        if (this.activeApp === id) this.activeApp = null;

        this.updateTaskbar();
        this.emit('app:close', id);
      }

      focusApp(id) {
        // Remove active from all
        for (const [, win] of this.windows) {
          win.classList.remove('active');
        }

        const win = this.windows.get(id);
        if (win) {
          win.classList.add('active');
          win.style.zIndex = ++this.zIndex;
        }

        this.activeApp = id;
        this.updateTaskbar();
        this.emit('app:focus', id);
      }

      toggleMax(id) {
        const win = this.windows.get(id);
        if (win) win.classList.toggle('max');
      }

      updateTaskbar() {
        const container = $('taskApps');
        container.innerHTML = [...this.openApps].map(id => {
          const app = this.apps.get(id);
          return `<div class="task-app${this.activeApp === id ? ' active' : ''}" data-app="${id}">${app.icon} ${app.name}</div>`;
        }).join('');
      }

      updateStartMenu() {
        const container = $('startItems');
        container.innerHTML = [...this.apps.values()].map(app =>
          `<div class="start-item" data-app="${app.id}"><i>${app.icon}</i>${app.name}</div>`
        ).join('');
      }

      init() {
        // Create desktop icons
        const icons = $('desktop');
        let iconHtml = '<div class="icons">';
        for (const app of this.apps.values()) {
          iconHtml += `<div class="icon" data-app="${app.id}"><i>${app.icon}</i><span>${app.name}</span></div>`;
        }
        iconHtml += '</div>';
        icons.insertAdjacentHTML('afterbegin', iconHtml);

        // Update start menu
        this.updateStartMenu();

        // Event delegation
        document.addEventListener('click', (e) => {
          const target = e.target;

          // Desktop icon
          if (target.closest('.icon[data-app]')) {
            this.openApp(target.closest('.icon').dataset.app);
          }

          // Start menu item
          if (target.closest('.start-item[data-app]')) {
            this.openApp(target.closest('.start-item').dataset.app);
            $('startMenu').classList.remove('open');
          }

          // Taskbar app
          if (target.closest('.task-app[data-app]')) {
            this.focusApp(target.closest('.task-app').dataset.app);
          }

          // Window controls
          if (target.dataset.action) {
            const appId = target.closest('.win-header')?.dataset.app;
            if (appId) {
              if (target.dataset.action === 'close') this.closeApp(appId);
              if (target.dataset.action === 'max') this.toggleMax(appId);
            }
          }

          // Start button
          if (target.closest('#startBtn')) {
            $('startMenu').classList.toggle('open');
          }

          // Click outside start menu
          if (!target.closest('.start-menu') && !target.closest('#startBtn')) {
            $('startMenu').classList.remove('open');
          }

          // Focus window on click
          if (target.closest('.win')) {
            const winEl = target.closest('.win');
            const appId = winEl.id.replace('win-', '');
            this.focusApp(appId);
          }
        });

        // Window dragging
        document.addEventListener('mousedown', (e) => {
          const header = e.target.closest('.win-header');
          if (!header || e.target.tagName === 'B') return;

          const win = header.closest('.win');
          if (win.classList.contains('max')) return;

          this.drag = {
            win,
            startX: e.clientX,
            startY: e.clientY,
            origX: win.offsetLeft,
            origY: win.offsetTop
          };
        });

        document.addEventListener('mousemove', (e) => {
          if (!this.drag) return;
          this.drag.win.style.left = (this.drag.origX + e.clientX - this.drag.startX) + 'px';
          this.drag.win.style.top = (this.drag.origY + e.clientY - this.drag.startY) + 'px';
        });

        document.addEventListener('mouseup', () => {
          this.drag = null;
        });

        // Clock
        const updateClock = () => {
          $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };
        updateClock();
        setInterval(updateClock, 1000);

        // Ready
        this.emit('ready');
      }

      // Network status (can be called externally)
      setNetworkStatus(online, text) {
        $('netDot').className = 'dot' + (online ? ' on' : '');
        $('netStatus').textContent = text || (online ? 'Online' : 'Offline');
      }
    }

    // Create global instance
    const os = new KonomiOS();
    window.KonomiOS = os;

    // Auto-open chat on start
    setTimeout(() => os.openApp('chat'), 300);
  </script>
</body>
</html>
