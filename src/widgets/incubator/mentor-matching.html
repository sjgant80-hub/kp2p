<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mentor Matching - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"mentor-matching","name":"Mentor Matching","icon":"🎯","desc":"Connect with mentors","category":"incubator","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.search{display:flex;gap:10px;margin-bottom:20px}
.search input{flex:1;padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.search select{padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.mentors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.mentor{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.mentor-header{display:flex;gap:15px;margin-bottom:15px}
.mentor-avatar{width:60px;height:60px;background:#7c3aed;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.mentor-info h3{margin-bottom:3px}
.mentor-title{font-size:.875rem;color:#888}
.mentor-company{font-size:.75rem;color:#7c3aed}
.mentor-expertise{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}
.expertise-tag{padding:4px 10px;background:#252525;border-radius:4px;font-size:.7rem}
.mentor-stats{display:flex;gap:15px;margin-bottom:15px;font-size:.75rem;color:#888}
.mentor-bio{font-size:.875rem;color:#888;line-height:1.5;margin-bottom:15px}
.mentor-actions{display:flex;gap:10px}
.action-btn{flex:1;padding:10px;border-radius:6px;cursor:pointer;font-size:.875rem;text-align:center}
.action-primary{background:#7c3aed;color:#fff;border:none}
.action-secondary{background:transparent;border:1px solid #333;color:#e0e0e0}
</style>
</head>
<body>
<div class="header"><h1>🎯 Mentors</h1><button class="btn">Become Mentor</button></div>
<div class="search">
<input type="text" placeholder="Search by name, expertise...">
<select><option>All Expertise</option><option>Product</option><option>Engineering</option><option>Sales</option><option>Marketing</option><option>Finance</option></select>
</div>
<div class="mentors" id="mentors"></div>
<script>
const mentors=[
{name:'Jennifer Liu',title:'VP of Product',company:'TechCorp (Exited $200M)',expertise:['Product Strategy','B2B SaaS','Roadmapping'],sessions:45,rating:4.9,bio:'15+ years building products at scale. Led product teams from Series A to IPO.'},
{name:'David Park',title:'CTO',company:'AI Startup (YC W22)',expertise:['Engineering','AI/ML','System Design'],sessions:32,rating:4.8,bio:'Ex-Google engineer. Built ML systems processing 1B+ requests daily.'},
{name:'Maria Santos',title:'Founder & CEO',company:'3x Founder',expertise:['Fundraising','Leadership','Go-to-Market'],sessions:67,rating:5.0,bio:'Raised $50M+ across ventures. Expert in early-stage fundraising strategy.'},
{name:'James Wilson',title:'Partner',company:'Top VC Firm',expertise:['Venture Capital','Due Diligence','Board Dynamics'],sessions:28,rating:4.7,bio:'Invested in 50+ startups. Former founder with successful exit.'},
{name:'Sarah Chen',title:'CMO',company:'Growth Stage Startup',expertise:['Growth Marketing','Brand','Content'],sessions:39,rating:4.9,bio:'Scaled marketing from 0 to $10M ARR. Deep expertise in PLG and content marketing.'},
{name:'Mike Torres',title:'CFO',company:'Public Tech Co',expertise:['Finance','M&A','IPO Prep'],sessions:21,rating:4.8,bio:'Led 2 IPOs and 5 M&A deals. Expert in financial modeling and fundraising.'}
];
document.getElementById('mentors').innerHTML=mentors.map(m=>`
<div class="mentor">
<div class="mentor-header">
<div class="mentor-avatar">${m.name.split(' ').map(n=>n[0]).join('')}</div>
<div class="mentor-info">
<h3>${m.name}</h3>
<div class="mentor-title">${m.title}</div>
<div class="mentor-company">${m.company}</div>
</div>
</div>
<div class="mentor-expertise">${m.expertise.map(e=>`<span class="expertise-tag">${e}</span>`).join('')}</div>
<div class="mentor-stats">
<span>📅 ${m.sessions} sessions</span>
<span>⭐ ${m.rating} rating</span>
</div>
<div class="mentor-bio">${m.bio}</div>
<div class="mentor-actions">
<button class="action-btn action-primary">Request Session</button>
<button class="action-btn action-secondary">View Profile</button>
</div>
</div>`).join('');
</script>
</body>
</html>
