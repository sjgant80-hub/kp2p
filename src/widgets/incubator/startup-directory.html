<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Startup Directory - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"startup-directory","name":"Startup Directory","icon":"🚀","desc":"Browse portfolio companies","category":"incubator","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#7c3aed}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.filter.active{background:#7c3aed;border-color:#7c3aed}
.startups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.startup{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.startup-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.startup-logo{font-size:2rem}
.startup-stage{padding:4px 10px;border-radius:4px;font-size:.7rem;background:#7c3aed33;color:#7c3aed}
.startup-name{font-size:1.25rem;font-weight:bold;margin-bottom:5px}
.startup-tagline{font-size:.875rem;color:#888;margin-bottom:15px}
.startup-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.meta-item{background:#252525;padding:10px;border-radius:6px}
.meta-label{font-size:.65rem;color:#888;margin-bottom:2px}
.meta-value{font-size:.875rem;font-weight:500}
.startup-founders{font-size:.75rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🚀 Portfolio</h1><button class="btn">Apply Now</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">42</div><div class="stat-label">STARTUPS</div></div>
<div class="stat"><div class="stat-value">$28M</div><div class="stat-label">RAISED</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">EXITS</div></div>
<div class="stat"><div class="stat-value">156</div><div class="stat-label">JOBS CREATED</div></div>
</div>
<div class="filters">
<button class="filter active">All</button>
<button class="filter">Pre-Seed</button>
<button class="filter">Seed</button>
<button class="filter">Series A</button>
<button class="filter">Exited</button>
</div>
<div class="startups" id="startups"></div>
<script>
const startups=[
{logo:'🤖',name:'AI Dynamics',tagline:'Enterprise AI automation platform',stage:'Series A',sector:'AI/ML',raised:'$4.2M',founded:'2022',employees:18,founders:'Sarah Chen, Mike Torres'},
{logo:'🌱',name:'GreenTech Solutions',tagline:'Carbon footprint tracking for SMBs',stage:'Seed',sector:'CleanTech',raised:'$1.5M',founded:'2023',employees:8,founders:'Emma Wilson'},
{logo:'💊',name:'MedFlow',tagline:'Healthcare workflow optimization',stage:'Seed',sector:'HealthTech',raised:'$2.1M',founded:'2023',employees:12,founders:'Dr. James Park, Lisa Wang'},
{logo:'🔐',name:'SecureID',tagline:'Zero-trust identity verification',stage:'Pre-Seed',sector:'Security',raised:'$500K',founded:'2024',employees:4,founders:'Alex Kumar'},
{logo:'📦',name:'LogiTrack',tagline:'Last-mile delivery optimization',stage:'Seed',sector:'Logistics',raised:'$1.8M',founded:'2022',employees:15,founders:'Robert Chen, Amy Liu'},
{logo:'🎓',name:'EduPath',tagline:'Personalized learning pathways',stage:'Pre-Seed',sector:'EdTech',raised:'$750K',founded:'2024',employees:5,founders:'Maria Garcia'}
];
document.getElementById('startups').innerHTML=startups.map(s=>`
<div class="startup">
<div class="startup-header">
<span class="startup-logo">${s.logo}</span>
<span class="startup-stage">${s.stage.toUpperCase()}</span>
</div>
<div class="startup-name">${s.name}</div>
<div class="startup-tagline">${s.tagline}</div>
<div class="startup-meta">
<div class="meta-item"><div class="meta-label">SECTOR</div><div class="meta-value">${s.sector}</div></div>
<div class="meta-item"><div class="meta-label">RAISED</div><div class="meta-value">${s.raised}</div></div>
<div class="meta-item"><div class="meta-label">FOUNDED</div><div class="meta-value">${s.founded}</div></div>
<div class="meta-item"><div class="meta-label">TEAM SIZE</div><div class="meta-value">${s.employees}</div></div>
</div>
<div class="startup-founders">👥 ${s.founders}</div>
</div>`).join('');
</script>
</body>
</html>
