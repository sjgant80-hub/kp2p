<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Intake - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"patient-intake","name":"Patient Intake","icon":"📋","desc":"Patient intake forms","category":"acupuncture","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.form-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:25px;max-width:600px;margin:0 auto}
.section{margin-bottom:25px}
.section-title{font-weight:600;margin-bottom:15px;color:#84cc16;display:flex;align-items:center;gap:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:span 2}
label{font-size:.875rem;color:#888}
input,select,textarea{padding:12px;background:#252525;border:1px solid #333;border-radius:6px;color:#e0e0e0;font-size:.875rem}
textarea{min-height:100px;resize:vertical}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px}
.checkbox-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#252525;border-radius:6px;cursor:pointer}
.checkbox-item input{width:16px;height:16px}
.btn{padding:12px 24px;background:#84cc16;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600;width:100%;margin-top:20px}
</style>
</head>
<body>
<div class="header"><h1>📋 Patient Intake</h1></div>
<div class="form-card">
<div class="section">
<div class="section-title">👤 Personal Information</div>
<div class="form-row">
<div class="form-group"><label>First Name</label><input type="text" placeholder="First name"></div>
<div class="form-group"><label>Last Name</label><input type="text" placeholder="Last name"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Date of Birth</label><input type="date"></div>
<div class="form-group"><label>Phone</label><input type="tel" placeholder="(555) 000-0000"></div>
</div>
<div class="form-group full"><label>Email</label><input type="email" placeholder="email@example.com"></div>
</div>
<div class="section">
<div class="section-title">🩺 Chief Complaint</div>
<div class="form-group"><label>What brings you in today?</label><textarea placeholder="Describe your main health concern..."></textarea></div>
<div class="form-group"><label>Duration of symptoms</label>
<select><option>Less than 1 week</option><option>1-4 weeks</option><option>1-3 months</option><option>3-6 months</option><option>6+ months</option><option>Years</option></select>
</div>
</div>
<div class="section">
<div class="section-title">📊 Health History</div>
<div class="form-group"><label>Current conditions (check all that apply)</label>
<div class="checkbox-group">
<label class="checkbox-item"><input type="checkbox">High Blood Pressure</label>
<label class="checkbox-item"><input type="checkbox">Diabetes</label>
<label class="checkbox-item"><input type="checkbox">Heart Disease</label>
<label class="checkbox-item"><input type="checkbox">Anxiety/Depression</label>
<label class="checkbox-item"><input type="checkbox">Chronic Pain</label>
<label class="checkbox-item"><input type="checkbox">Insomnia</label>
<label class="checkbox-item"><input type="checkbox">Digestive Issues</label>
<label class="checkbox-item"><input type="checkbox">Allergies</label>
</div>
</div>
</div>
<button class="btn">Submit Intake Form</button>
</div>
</body>
</html>
