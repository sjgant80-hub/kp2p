<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cable Car Tickets - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"ticket-counter","name":"Ticket Counter","icon":"🎟️","desc":"Cable car ticket sales","category":"cablecar","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#0891b2}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.ticket{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.ticket-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.ticket-name{font-size:1.125rem;font-weight:bold}
.ticket-price{font-size:1.25rem;font-weight:bold;color:#0891b2}
.ticket-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:10px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:2px}
.detail-value{font-size:.875rem}
.ticket-sales{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #333;font-size:.875rem}
.sales-today{color:#15803d}
</style>
</head>
<body>
<div class="header"><h1>🎟️ Tickets</h1><button class="btn">New Sale</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">$18,450</div><div class="stat-label">TODAY'S REVENUE</div></div>
<div class="stat"><div class="stat-value">1,245</div><div class="stat-label">TICKETS SOLD</div></div>
<div class="stat"><div class="stat-value">89</div><div class="stat-label">PASSES SOLD</div></div>
<div class="stat"><div class="stat-value">$14.82</div><div class="stat-label">AVG TICKET</div></div>
</div>
<div class="tickets" id="tickets"></div>
<script>
const tickets=[
{name:'Adult Round Trip',price:'$28',type:'Single',validity:'Same day',routes:'All Lines',soldToday:456,revenue:'$12,768'},
{name:'Child Round Trip',price:'$18',type:'Single',validity:'Same day',routes:'All Lines',soldToday:234,revenue:'$4,212'},
{name:'Senior Round Trip',price:'$22',type:'Single',validity:'Same day',routes:'All Lines',soldToday:145,revenue:'$3,190'},
{name:'One Way - Adult',price:'$18',type:'Single',validity:'Same day',routes:'All Lines',soldToday:189,revenue:'$3,402'},
{name:'Day Pass',price:'$45',type:'Pass',validity:'All day',routes:'Unlimited',soldToday:67,revenue:'$3,015'},
{name:'Family Pack (2+2)',price:'$85',type:'Package',validity:'Same day',routes:'All Lines',soldToday:23,revenue:'$1,955'}
];
document.getElementById('tickets').innerHTML=tickets.map(t=>`
<div class="ticket">
<div class="ticket-header">
<span class="ticket-name">${t.name}</span>
<span class="ticket-price">${t.price}</span>
</div>
<div class="ticket-details">
<div class="detail"><div class="detail-label">TYPE</div><div class="detail-value">${t.type}</div></div>
<div class="detail"><div class="detail-label">VALIDITY</div><div class="detail-value">${t.validity}</div></div>
<div class="detail"><div class="detail-label">ROUTES</div><div class="detail-value">${t.routes}</div></div>
<div class="detail"><div class="detail-label">TODAY'S SALES</div><div class="detail-value">${t.soldToday}</div></div>
</div>
<div class="ticket-sales">
<span>Revenue Today:</span>
<span class="sales-today">${t.revenue}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
