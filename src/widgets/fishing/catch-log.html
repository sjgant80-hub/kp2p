<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catch Log - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"catch-log","name":"Fishing Catch Log","icon":"🐟","desc":"Log your fishing catches","category":"fishing","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0ea5e9}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.catches{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.catch{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.catch-header{padding:15px 20px;background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%);display:flex;justify-content:space-between;align-items:center}
.catch-species{font-size:1.125rem;font-weight:bold}
.catch-date{font-size:.875rem;opacity:.9}
.catch-body{padding:20px}
.catch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;text-align:center}
.catch-stat-value{font-size:1.25rem;font-weight:bold;color:#0ea5e9}
.catch-stat-label{font-size:.7rem;color:#888}
.catch-details{font-size:.875rem;color:#888}
.catch-detail{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.catch-actions{display:flex;gap:10px;margin-top:15px}
.action-btn{flex:1;padding:8px;background:#252525;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer;font-size:.875rem}
</style>
</head>
<body>
<div class="header"><h1>🐟 Catch Log</h1><button class="btn">+ Log Catch</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">47</div><div class="stat-label">Total Catches</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">Species</div></div>
<div class="stat"><div class="stat-value">28.5 lb</div><div class="stat-label">Biggest Catch</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">This Month</div></div>
</div>
<div class="catches" id="catches"></div>
<script>
const catches=[
{species:'Largemouth Bass',date:'Today, 7:30 AM',weight:'6.2 lb',length:'21"',lure:'Spinnerbait',location:'Lake Monroe',weather:'Sunny, 72°F',water:'Clear'},
{species:'Rainbow Trout',date:'Yesterday',weight:'3.8 lb',length:'18"',lure:'Fly - Adams',location:'Blue River',weather:'Cloudy, 58°F',water:'Cool, Clear'},
{species:'Striped Bass',date:'Dec 25',weight:'12.4 lb',length:'28"',lure:'Live Shad',location:'Lake Texoma',weather:'Partly Cloudy',water:'65°F'},
{species:'Catfish',date:'Dec 24',weight:'8.1 lb',length:'24"',lure:'Chicken Liver',location:'Trinity River',weather:'Overcast',water:'Murky'},
{species:'Crappie',date:'Dec 22',weight:'1.8 lb',length:'13"',lure:'Minnow',location:'Lake Fork',weather:'Sunny',water:'Clear, 55°F'}
];
document.getElementById('catches').innerHTML=catches.map(c=>`
<div class="catch">
<div class="catch-header"><span class="catch-species">🐟 ${c.species}</span><span class="catch-date">${c.date}</span></div>
<div class="catch-body">
<div class="catch-stats">
<div><div class="catch-stat-value">${c.weight}</div><div class="catch-stat-label">Weight</div></div>
<div><div class="catch-stat-value">${c.length}</div><div class="catch-stat-label">Length</div></div>
<div><div class="catch-stat-value">🏆</div><div class="catch-stat-label">Personal Best</div></div>
</div>
<div class="catch-details">
<div class="catch-detail">📍 ${c.location}</div>
<div class="catch-detail">🎣 ${c.lure}</div>
<div class="catch-detail">🌤️ ${c.weather} • 💧 ${c.water}</div>
</div>
<div class="catch-actions"><button class="action-btn">📷 Photos</button><button class="action-btn">✏️ Edit</button><button class="action-btn">📤 Share</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
