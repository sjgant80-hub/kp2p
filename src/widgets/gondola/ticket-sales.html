<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gondola Tickets - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"ticket-sales","name":"Ticket Sales","icon":"🎫","desc":"Gondola ticket management","category":"gondola","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.sales{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px}
.sale{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.sale-value{font-size:1.75rem;font-weight:bold;color:#0891b2}
.sale-label{font-size:.75rem;color:#888;margin-top:5px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.ticket{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.ticket-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.ticket-name{font-size:1.125rem;font-weight:bold}
.ticket-type{font-size:.75rem;color:#0891b2}
.ticket-price{font-size:1.25rem;font-weight:bold;color:#0891b2}
.ticket-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:10px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:2px}
.detail-value{font-size:.875rem}
.ticket-sold{font-size:.875rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🎫 Tickets</h1><button class="btn">New Sale</button></div>
<div class="sales">
<div class="sale"><div class="sale-value">2,847</div><div class="sale-label">TICKETS TODAY</div></div>
<div class="sale"><div class="sale-value">$68.4K</div><div class="sale-label">REVENUE TODAY</div></div>
<div class="sale"><div class="sale-value">12,340</div><div class="sale-label">THIS WEEK</div></div>
<div class="sale"><div class="sale-value">$298K</div><div class="sale-label">WEEKLY REV</div></div>
</div>
<div class="tickets" id="tickets"></div>
<script>
const tickets=[
{name:'Adult Single Ride',type:'ONE-WAY',price:'$25',valid:'Same day',includes:'Single lift ride',sold:892},
{name:'Adult Round Trip',type:'ROUND-TRIP',price:'$42',valid:'Same day',includes:'Up and down',sold:1245},
{name:'Child Single Ride',type:'ONE-WAY',price:'$15',valid:'Same day',includes:'Ages 6-12',sold:312},
{name:'Family Pack',type:'BUNDLE',price:'$120',valid:'Same day',includes:'2 Adults + 2 Kids',sold:156},
{name:'Sunset Special',type:'EVENING',price:'$35',valid:'After 4 PM',includes:'Round trip + drink',sold:89},
{name:'Season Pass',type:'UNLIMITED',price:'$450',valid:'Full Season',includes:'Unlimited rides',sold:153}
];
document.getElementById('tickets').innerHTML=tickets.map(t=>`
<div class="ticket">
<div class="ticket-header">
<div>
<div class="ticket-name">${t.name}</div>
<div class="ticket-type">${t.type}</div>
</div>
<span class="ticket-price">${t.price}</span>
</div>
<div class="ticket-details">
<div class="detail"><div class="detail-label">VALID</div><div class="detail-value">${t.valid}</div></div>
<div class="detail"><div class="detail-label">INCLUDES</div><div class="detail-value">${t.includes}</div></div>
</div>
<div class="ticket-sold">📊 ${t.sold} sold today</div>
</div>`).join('');
</script>
</body>
</html>
