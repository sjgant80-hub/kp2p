<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Report - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"daily-report","name":"Daily Report","icon":"📋","desc":"Create daily activity reports","category":"daycare","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;margin-bottom:15px}
.card-title{font-weight:600;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.child-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.child-name{font-weight:600;font-size:1.125rem}
.section{margin-bottom:15px}
.section-title{font-size:.875rem;color:#888;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.item{background:#252525;padding:10px;border-radius:6px;text-align:center;cursor:pointer;border:2px solid transparent}
.item.selected{border-color:#ec4899}
.item-icon{font-size:1.5rem;margin-bottom:5px}
.item-label{font-size:.75rem;color:#888}
.textarea{width:100%;padding:10px;background:#252525;border:1px solid #333;border-radius:6px;color:#e0e0e0;min-height:80px;resize:vertical}
.btn{padding:12px 24px;border:none;border-radius:6px;cursor:pointer;background:#ec4899;color:#fff;font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<div class="header"><h1>📋 Daily Report</h1></div>
<div class="card">
<div class="child-header"><span class="child-name">Emma Johnson</span><span style="color:#888">Butterflies • Age 3</span></div>
<div class="section">
<div class="section-title">😴 Nap Time</div>
<div class="grid">
<div class="item selected"><div class="item-icon">😊</div><div class="item-label">Slept Well</div></div>
<div class="item"><div class="item-icon">😐</div><div class="item-label">Restless</div></div>
<div class="item"><div class="item-icon">😢</div><div class="item-label">No Nap</div></div>
</div>
</div>
<div class="section">
<div class="section-title">🍽️ Meals</div>
<div class="grid">
<div class="item selected"><div class="item-icon">😋</div><div class="item-label">Ate All</div></div>
<div class="item"><div class="item-icon">🙂</div><div class="item-label">Ate Some</div></div>
<div class="item"><div class="item-icon">😔</div><div class="item-label">Ate Little</div></div>
</div>
</div>
<div class="section">
<div class="section-title">🎨 Activities</div>
<div class="grid">
<div class="item selected"><div class="item-icon">🎨</div><div class="item-label">Art</div></div>
<div class="item selected"><div class="item-icon">📚</div><div class="item-label">Reading</div></div>
<div class="item"><div class="item-icon">🎵</div><div class="item-label">Music</div></div>
<div class="item selected"><div class="item-icon">⚽</div><div class="item-label">Outdoor</div></div>
</div>
</div>
<div class="section">
<div class="section-title">💬 Notes for Parents</div>
<textarea class="textarea" placeholder="Add notes about the child's day...">Emma had a wonderful day! She enjoyed painting during art time and made a beautiful picture for you. She played nicely with her friends during outdoor time.</textarea>
</div>
<div class="actions"><button class="btn" onclick="alert('Send')">📤 Send to Parent</button></div>
</div>
</body>
</html>
