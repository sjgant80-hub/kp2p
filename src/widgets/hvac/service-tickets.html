<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Tickets - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"service-tickets","name":"Service Tickets","icon":"🎫","desc":"Manage HVAC service tickets","category":"hvac","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0ea5e9}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.tickets-list{display:flex;flex-direction:column;gap:15px}
.ticket-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.ticket-header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#252525}
.ticket-id{font-weight:600;display:flex;align-items:center;gap:10px}
.ticket-type{padding:4px 8px;border-radius:4px;font-size:.75rem}
.ticket-type.cooling{background:#0ea5e933;color:#0ea5e9}
.ticket-type.heating{background:#ef444433;color:#ef4444}
.ticket-type.maintenance{background:#22c55e33;color:#22c55e}
.ticket-status{padding:6px 12px;border-radius:6px;font-size:.75rem}
.ticket-status.open{background:#f59e0b33;color:#f59e0b}
.ticket-status.assigned{background:#3b82f633;color:#3b82f6}
.ticket-status.in-progress{background:#8b5cf633;color:#8b5cf6}
.ticket-status.resolved{background:#22c55e33;color:#22c55e}
.ticket-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ticket-details h4{font-weight:600;margin-bottom:10px}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #333}
.detail-label{color:#888}
.ticket-footer{display:flex;gap:10px;padding:15px 20px;border-top:1px solid #333}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;flex:1}
.btn-primary{background:#0ea5e9;color:#fff}
.btn-secondary{background:#333;color:#e0e0e0}
</style>
</head>
<body>
<div class="header">
<h1>🎫 Service Tickets</h1>
<button class="btn btn-primary" onclick="alert('New ticket')">+ New Ticket</button>
</div>

<div class="stats">
<div class="stat"><div class="stat-value" id="openTickets">0</div><div class="stat-label">Open Tickets</div></div>
<div class="stat"><div class="stat-value" id="inProgress">0</div><div class="stat-label">In Progress</div></div>
<div class="stat"><div class="stat-value" id="todayResolved">0</div><div class="stat-label">Resolved Today</div></div>
<div class="stat"><div class="stat-value" id="avgResponse">0h</div><div class="stat-label">Avg Response</div></div>
</div>

<div class="tickets-list" id="ticketsList"></div>

<script>
const STORAGE_KEY = 'kiss_hvac_tickets';
let tickets = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
}

function updateStats() {
  const open = tickets.filter(t => t.status === 'open' || t.status === 'assigned').length;
  const inProgress = tickets.filter(t => t.status === 'in-progress').length;
  const resolved = tickets.filter(t => t.status === 'resolved').length;

  document.getElementById('openTickets').textContent = open;
  document.getElementById('inProgress').textContent = inProgress;
  document.getElementById('todayResolved').textContent = resolved;
  document.getElementById('avgResponse').textContent = '2.5h';
}

function render() {
  const list = document.getElementById('ticketsList');

  if (tickets.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:#666">No tickets</div>';
    updateStats();
    return;
  }

  const statusOrder = { open: 0, assigned: 1, 'in-progress': 2, resolved: 3 };
  const sorted = [...tickets].sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

  list.innerHTML = sorted.map(t => `
    <div class="ticket-card">
      <div class="ticket-header">
        <div class="ticket-id">
          #${t.id}
          <span class="ticket-type ${t.type}">${t.type}</span>
        </div>
        <span class="ticket-status ${t.status}">${t.status.replace('-', ' ')}</span>
      </div>
      <div class="ticket-body">
        <div class="ticket-details">
          <h4>Customer</h4>
          <div class="detail-row"><span class="detail-label">Name</span><span>${t.customerName}</span></div>
          <div class="detail-row"><span class="detail-label">Phone</span><span>${t.phone}</span></div>
          <div class="detail-row"><span class="detail-label">Address</span><span>${t.address}</span></div>
          <div class="detail-row"><span class="detail-label">Equipment</span><span>${t.equipment}</span></div>
        </div>
        <div class="ticket-details">
          <h4>Issue Details</h4>
          <div class="detail-row"><span class="detail-label">Problem</span><span>${t.problem}</span></div>
          <div class="detail-row"><span class="detail-label">Created</span><span>${new Date(t.createdAt).toLocaleString()}</span></div>
          <div class="detail-row"><span class="detail-label">Technician</span><span>${t.technician || 'Unassigned'}</span></div>
          <div class="detail-row"><span class="detail-label">Priority</span><span>${t.priority}</span></div>
        </div>
      </div>
      <div class="ticket-footer">
        ${t.status === 'open' ? `<button class="btn btn-primary" onclick="updateStatus('${t.id}', 'assigned')">👤 Assign</button>` : ''}
        ${t.status === 'assigned' ? `<button class="btn btn-primary" onclick="updateStatus('${t.id}', 'in-progress')">▶️ Start</button>` : ''}
        ${t.status === 'in-progress' ? `<button class="btn btn-primary" onclick="updateStatus('${t.id}', 'resolved')">✓ Resolve</button>` : ''}
        <button class="btn btn-secondary" onclick="alert('View details')">📋 Details</button>
      </div>
    </div>
  `).join('');

  updateStats();
}

function updateStatus(id, status) {
  const t = tickets.find(x => x.id === id);
  if (t) {
    t.status = status;
    if (status === 'assigned') t.technician = 'John Smith';
    save();
    render();
  }
}

if (tickets.length === 0) {
  const past = h => { const x = new Date(); x.setHours(x.getHours() - h); return x.toISOString(); };
  tickets = [
    { id: 'TK-001', customerName: 'Johnson Residence', phone: '555-0101', address: '123 Oak St', equipment: 'Carrier AC Unit', type: 'cooling', problem: 'AC not cooling properly', priority: 'High', createdAt: past(2), technician: 'Mike Wilson', status: 'in-progress' },
    { id: 'TK-002', customerName: 'ABC Office Building', phone: '555-0102', address: '456 Business Park', equipment: 'Trane RTU', type: 'cooling', problem: 'Unusual noise from unit', priority: 'Medium', createdAt: past(5), technician: 'Tom Brown', status: 'assigned' },
    { id: 'TK-003', customerName: 'Smith Family', phone: '555-0103', address: '789 Maple Ave', equipment: 'Lennox Furnace', type: 'heating', problem: 'Furnace not igniting', priority: 'High', createdAt: past(1), technician: null, status: 'open' },
    { id: 'TK-004', customerName: 'Green Valley Apts', phone: '555-0104', address: '321 Pine Rd', equipment: 'Multiple Units', type: 'maintenance', problem: 'Scheduled quarterly maintenance', priority: 'Low', createdAt: past(24), technician: 'Mike Wilson', status: 'resolved' },
    { id: 'TK-005', customerName: 'Davis Home', phone: '555-0105', address: '654 Cedar Ln', equipment: 'Goodman Heat Pump', type: 'heating', problem: 'Heat pump freezing up', priority: 'Medium', createdAt: past(3), technician: null, status: 'open' }
  ];
  save();
}

render();
</script>
</body>
</html>
