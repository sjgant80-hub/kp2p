<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riding Lessons - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"riding-lessons","name":"Riding Lessons","icon":"🏇","desc":"Schedule riding lessons","category":"equestrian","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#a855f7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:8px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.filter.active{background:#a855f7;color:#fff;border-color:#a855f7}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px}
.lesson{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.lesson-banner{padding:20px;background:linear-gradient(135deg,#a855f7 0%,#7c3aed 100%)}
.lesson-type{font-size:1.25rem;font-weight:bold;margin-bottom:5px}
.lesson-level{font-size:.875rem;opacity:.9}
.lesson-body{padding:20px}
.lesson-details{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.detail{font-size:.875rem}
.detail-label{color:#888;font-size:.75rem}
.instructor{display:flex;align-items:center;gap:12px;padding:15px;background:#252525;border-radius:8px;margin-bottom:15px}
.instructor-avatar{width:45px;height:45px;background:#a855f7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.instructor-info{flex:1}
.instructor-name{font-weight:600}
.instructor-exp{font-size:.75rem;color:#888}
.lesson-footer{display:flex;justify-content:space-between;align-items:center}
.lesson-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.book-btn{padding:10px 20px;background:#a855f7;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>🏇 Riding Lessons</h1><button class="btn">+ Book Lesson</button></div>
<div class="filters">
<button class="filter active">All Levels</button>
<button class="filter">Beginner</button>
<button class="filter">Intermediate</button>
<button class="filter">Advanced</button>
<button class="filter">Competition</button>
</div>
<div class="lessons" id="lessons"></div>
<script>
const lessons=[
{type:'Intro to Riding',level:'Beginner',duration:'1 hour',horse:'Assigned',time:'9:00 AM',spots:'4/6',instructor:'Sarah Mitchell',exp:'15 years',price:75},
{type:'English Riding',level:'Intermediate',duration:'1.5 hours',horse:'Your own',time:'10:30 AM',spots:'2/4',instructor:'James Walker',exp:'20 years',price:95},
{type:'Western Riding',level:'All Levels',duration:'1 hour',horse:'Assigned',time:'1:00 PM',spots:'5/6',instructor:'Maria Garcia',exp:'12 years',price:80},
{type:'Dressage Training',level:'Advanced',duration:'2 hours',horse:'Your own',time:'3:00 PM',spots:'1/3',instructor:'James Walker',exp:'20 years',price:150},
{type:'Jump Training',level:'Intermediate',duration:'1.5 hours',horse:'Assigned',time:'4:30 PM',spots:'3/4',instructor:'Sarah Mitchell',exp:'15 years',price:120}
];
document.getElementById('lessons').innerHTML=lessons.map(l=>`
<div class="lesson">
<div class="lesson-banner"><div class="lesson-type">${l.type}</div><div class="lesson-level">${l.level}</div></div>
<div class="lesson-body">
<div class="lesson-details">
<div><div class="detail-label">Duration</div><div class="detail">${l.duration}</div></div>
<div><div class="detail-label">Horse</div><div class="detail">${l.horse}</div></div>
<div><div class="detail-label">Time</div><div class="detail">${l.time}</div></div>
<div><div class="detail-label">Spots</div><div class="detail">${l.spots}</div></div>
</div>
<div class="instructor">
<div class="instructor-avatar">👤</div>
<div class="instructor-info"><div class="instructor-name">${l.instructor}</div><div class="instructor-exp">${l.exp} experience</div></div>
</div>
<div class="lesson-footer"><span class="lesson-price">$${l.price}</span><button class="book-btn">Book Now</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
