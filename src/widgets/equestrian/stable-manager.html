<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stable Manager - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"stable-manager","name":"Stable Manager","icon":"🐴","desc":"Manage horses and stalls","category":"equestrian","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#a855f7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#a855f7}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
.stall{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.stall-header{padding:12px 15px;background:#252525;display:flex;justify-content:space-between;align-items:center}
.stall-num{font-weight:bold}
.stall-status{padding:4px 8px;border-radius:4px;font-size:.7rem}
.status-occupied{background:#a855f733;color:#a855f7}
.status-empty{background:#33333366;color:#888}
.horse{padding:15px}
.horse-name{font-size:1.125rem;font-weight:bold;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.horse-breed{font-size:.875rem;color:#888;margin-bottom:15px}
.horse-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.8rem}
.detail-label{color:#888}
.detail-value{color:#e0e0e0}
.horse-tasks{margin-top:15px;padding-top:15px;border-top:1px solid #333}
.task{display:flex;justify-content:space-between;font-size:.8rem;padding:5px 0}
.task-done{color:#22c55e}
.task-pending{color:#f59e0b}
</style>
</head>
<body>
<div class="header"><h1>🐴 Stable Manager</h1><button class="btn">+ Add Horse</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">24</div><div class="stat-label">Total Stalls</div></div>
<div class="stat"><div class="stat-value">18</div><div class="stat-label">Horses Boarded</div></div>
<div class="stat"><div class="stat-value">6</div><div class="stat-label">Available</div></div>
<div class="stat"><div class="stat-value">$15.2k</div><div class="stat-label">Monthly Revenue</div></div>
</div>
<div class="stalls" id="stalls"></div>
<script>
const stalls=[
{num:'A1',horse:{name:'Thunder',breed:'Thoroughbred',age:'6 yrs',owner:'Johnson',color:'Bay',fed:true,groomed:true,exercised:false}},
{num:'A2',horse:{name:'Starlight',breed:'Arabian',age:'4 yrs',owner:'Williams',color:'Grey',fed:true,groomed:false,exercised:true}},
{num:'A3',horse:{name:'Duke',breed:'Quarter Horse',age:'8 yrs',owner:'Smith',color:'Chestnut',fed:true,groomed:true,exercised:true}},
{num:'A4',horse:null},
{num:'A5',horse:{name:'Bella',breed:'Warmblood',age:'5 yrs',owner:'Davis',color:'Black',fed:false,groomed:false,exercised:false}},
{num:'A6',horse:{name:'Spirit',breed:'Mustang',age:'7 yrs',owner:'Miller',color:'Palomino',fed:true,groomed:true,exercised:false}}
];
document.getElementById('stalls').innerHTML=stalls.map(s=>`
<div class="stall">
<div class="stall-header"><span class="stall-num">Stall ${s.num}</span><span class="stall-status ${s.horse?'status-occupied':'status-empty'}">${s.horse?'Occupied':'Empty'}</span></div>
${s.horse?`<div class="horse">
<div class="horse-name">🐴 ${s.horse.name}</div>
<div class="horse-breed">${s.horse.breed} • ${s.horse.color}</div>
<div class="horse-details">
<div><span class="detail-label">Age: </span><span class="detail-value">${s.horse.age}</span></div>
<div><span class="detail-label">Owner: </span><span class="detail-value">${s.horse.owner}</span></div>
</div>
<div class="horse-tasks">
<div class="task"><span>Fed</span><span class="${s.horse.fed?'task-done':'task-pending'}">${s.horse.fed?'✓ Done':'Pending'}</span></div>
<div class="task"><span>Groomed</span><span class="${s.horse.groomed?'task-done':'task-pending'}">${s.horse.groomed?'✓ Done':'Pending'}</span></div>
<div class="task"><span>Exercised</span><span class="${s.horse.exercised?'task-done':'task-pending'}">${s.horse.exercised?'✓ Done':'Pending'}</span></div>
</div>
</div>`:'<div class="horse" style="text-align:center;color:#666;padding:40px">No horse assigned</div>'}
</div>`).join('');
</script>
</body>
</html>
