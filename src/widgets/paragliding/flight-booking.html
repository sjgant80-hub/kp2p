<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paragliding - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"paragliding-booking","name":"Paragliding Flights","icon":"🪂","desc":"Book paragliding adventures","category":"paragliding","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.weather{background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%);border-radius:12px;padding:20px;margin-bottom:20px}
.weather-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.weather-title{font-weight:bold}
.weather-status{padding:6px 12px;background:#22c55e33;color:#22c55e;border-radius:6px}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:15px;text-align:center}
.weather-value{font-size:1.25rem;font-weight:bold}
.weather-label{font-size:.75rem;opacity:.8}
.flights{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.flight{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.flight-header{padding:25px;background:#252525;text-align:center}
.flight-name{font-size:1.5rem;font-weight:bold;margin-bottom:5px}
.flight-type{font-size:.875rem;color:#888}
.flight-body{padding:20px}
.flight-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;text-align:center}
.stat-value{font-size:1.25rem;font-weight:bold;color:#0ea5e9}
.stat-label{font-size:.7rem;color:#888}
.flight-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.flight-footer{display:flex;justify-content:space-between;align-items:center}
.flight-price{font-size:1.5rem;font-weight:bold;color:#22c55e}
.book-btn{padding:12px 25px;background:#0ea5e9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>🪂 Paragliding</h1><button class="btn">My Flights</button></div>
<div class="weather">
<div class="weather-header"><span class="weather-title">☀️ Flight Conditions</span><span class="weather-status">✓ Flyable</span></div>
<div class="weather-grid">
<div><div class="weather-value">8 mph</div><div class="weather-label">Wind Speed</div></div>
<div><div class="weather-value">NW</div><div class="weather-label">Direction</div></div>
<div><div class="weather-value">Clear</div><div class="weather-label">Visibility</div></div>
<div><div class="weather-value">75°F</div><div class="weather-label">Temperature</div></div>
<div><div class="weather-value">Good</div><div class="weather-label">Thermals</div></div>
</div>
</div>
<div class="flights" id="flights"></div>
<script>
const flights=[
{name:'Tandem Discovery',type:'First-Time Experience',duration:'15-20 min',altitude:'3,000 ft',launch:'Mountain Top',desc:'Perfect introduction to paragliding! Fly tandem with an expert instructor. No experience needed.',price:179},
{name:'Extended Tandem',type:'Scenic Flight',duration:'30-45 min',altitude:'4,500 ft',launch:'Peak Launch',desc:'Extended flight with more airtime, thermal riding, and stunning panoramic views of the valley.',price:279},
{name:'Acrobatic Flight',type:'Thrill Seekers Only',duration:'20-30 min',altitude:'5,000 ft',launch:'High Altitude',desc:'Experience wingovers, spirals, and other maneuvers. For those seeking an adrenaline rush!',price:349},
{name:'Private Lesson',type:'Learn to Fly',duration:'4 hrs',altitude:'Ground + Flight',launch:'Training Hill',desc:'Start your paragliding journey with ground handling, theory, and supervised solo flights.',price:299}
];
document.getElementById('flights').innerHTML=flights.map(f=>`
<div class="flight">
<div class="flight-header"><div class="flight-name">${f.name}</div><div class="flight-type">${f.type}</div></div>
<div class="flight-body">
<div class="flight-stats">
<div><div class="stat-value">${f.duration}</div><div class="stat-label">Duration</div></div>
<div><div class="stat-value">${f.altitude}</div><div class="stat-label">Altitude</div></div>
<div><div class="stat-value">${f.launch}</div><div class="stat-label">Launch</div></div>
</div>
<div class="flight-desc">${f.desc}</div>
<div class="flight-footer"><span class="flight-price">$${f.price}</span><button class="book-btn">Book Flight</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
