<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorecard - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"scorecard","name":"Golf Scorecard","icon":"📝","desc":"Track golf scores","category":"golf","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#22c55e;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.round-info{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;margin-bottom:20px}
.round-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.course-name{font-size:1.25rem;font-weight:bold}
.round-date{color:#888;font-size:.875rem}
.players{display:flex;gap:15px;flex-wrap:wrap}
.player{display:flex;align-items:center;gap:10px;padding:10px 15px;background:#252525;border-radius:8px}
.player-color{width:12px;height:12px;border-radius:50%}
.player-score{font-weight:bold;color:#22c55e}
.scorecard{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow-x:auto}
.scorecard table{width:100%;border-collapse:collapse;min-width:800px}
.scorecard th,.scorecard td{padding:12px 8px;text-align:center;border-bottom:1px solid #333}
.scorecard th{background:#252525;font-size:.75rem;color:#888}
.scorecard .hole-num{font-weight:bold;color:#22c55e}
.scorecard .par{color:#888}
.score{font-weight:bold}
.score.birdie{color:#22c55e}
.score.bogey{color:#f59e0b}
.score.double{color:#ef4444}
.totals{background:#252525}
.totals td{font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1>📝 Scorecard</h1><button class="btn">New Round</button></div>
<div class="round-info">
<div class="round-header">
<div class="course-name">Pine Valley Golf Club</div>
<div class="round-date">Dec 28, 2024 • 8:00 AM</div>
</div>
<div class="players">
<div class="player"><div class="player-color" style="background:#22c55e"></div><span>John</span><span class="player-score">+3</span></div>
<div class="player"><div class="player-color" style="background:#3b82f6"></div><span>Mike</span><span class="player-score">+5</span></div>
<div class="player"><div class="player-color" style="background:#f59e0b"></div><span>Dave</span><span class="player-score">+8</span></div>
<div class="player"><div class="player-color" style="background:#ef4444"></div><span>Tom</span><span class="player-score">E</span></div>
</div>
</div>
<div class="scorecard">
<table>
<tr><th>Hole</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>OUT</th></tr>
<tr><td class="hole-num">Par</td><td class="par">4</td><td class="par">5</td><td class="par">3</td><td class="par">4</td><td class="par">4</td><td class="par">5</td><td class="par">3</td><td class="par">4</td><td class="par">4</td><td class="par">36</td></tr>
<tr><td style="color:#22c55e">John</td><td class="score">4</td><td class="score bogey">6</td><td class="score birdie">2</td><td class="score">4</td><td class="score bogey">5</td><td class="score">5</td><td class="score">3</td><td class="score bogey">5</td><td class="score">4</td><td>38</td></tr>
<tr><td style="color:#3b82f6">Mike</td><td class="score bogey">5</td><td class="score">5</td><td class="score bogey">4</td><td class="score">4</td><td class="score">4</td><td class="score bogey">6</td><td class="score bogey">4</td><td class="score">4</td><td class="score">4</td><td>40</td></tr>
<tr><td style="color:#f59e0b">Dave</td><td class="score bogey">5</td><td class="score double">7</td><td class="score">3</td><td class="score bogey">5</td><td class="score bogey">5</td><td class="score">5</td><td class="score bogey">4</td><td class="score bogey">5</td><td class="score">4</td><td>43</td></tr>
<tr><td style="color:#ef4444">Tom</td><td class="score birdie">3</td><td class="score">5</td><td class="score">3</td><td class="score">4</td><td class="score">4</td><td class="score birdie">4</td><td class="score">3</td><td class="score">4</td><td class="score bogey">5</td><td>35</td></tr>
</table>
</div>
</body>
</html>
