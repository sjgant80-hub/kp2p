<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harvest Log - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"harvest-log","name":"Harvest Log","icon":"🦌","desc":"Log hunting harvests","category":"hunting","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#92400e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#92400e}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.harvests{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px}
.harvest{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.harvest-header{padding:20px;background:linear-gradient(135deg,#92400e 0%,#78350f 100%)}
.harvest-animal{font-size:1.25rem;font-weight:bold;margin-bottom:5px;display:flex;align-items:center;gap:10px}
.harvest-date{font-size:.875rem;opacity:.9}
.harvest-body{padding:20px}
.harvest-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;text-align:center}
.harvest-stat-value{font-size:1.125rem;font-weight:bold;color:#92400e}
.harvest-stat-label{font-size:.7rem;color:#888}
.harvest-details{font-size:.875rem;color:#888}
.detail-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.harvest-actions{display:flex;gap:10px;margin-top:15px;padding-top:15px;border-top:1px solid #333}
.action-btn{flex:1;padding:8px;background:#252525;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer;font-size:.8rem}
</style>
</head>
<body>
<div class="header"><h1>🦌 Harvest Log</h1><button class="btn">+ Log Harvest</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">12</div><div class="stat-label">Total Harvests</div></div>
<div class="stat"><div class="stat-value">4</div><div class="stat-label">This Season</div></div>
<div class="stat"><div class="stat-value">8pt</div><div class="stat-label">Best Buck</div></div>
<div class="stat"><div class="stat-value">185 lb</div><div class="stat-label">Largest</div></div>
</div>
<div class="harvests" id="harvests"></div>
<script>
const harvests=[
{animal:'Whitetail Buck',icon:'🦌',date:'Dec 15, 2024',location:'North Pasture Stand',method:'Rifle',distance:'120 yds',weight:'165 lb',points:'8 points',notes:'Clean shot, expired immediately. Great rack symmetry.'},
{animal:'Wild Turkey',icon:'🦃',date:'Nov 28, 2024',location:'Oak Ridge',method:'Shotgun',distance:'35 yds',weight:'22 lb',points:'11" beard',notes:'Gobbler came in to decoys. Morning hunt.'},
{animal:'Whitetail Doe',icon:'🦌',date:'Nov 10, 2024',location:'Food Plot #2',method:'Bow',distance:'25 yds',weight:'135 lb',points:'—',notes:'Perfect broadside shot. Quick recovery.'},
{animal:'Feral Hog',icon:'🐗',date:'Oct 22, 2024',location:'Creek Bottom',method:'Rifle',distance:'85 yds',weight:'185 lb',points:'—',notes:'Large boar, caught on trail cam night before.'}
];
document.getElementById('harvests').innerHTML=harvests.map(h=>`
<div class="harvest">
<div class="harvest-header"><div class="harvest-animal">${h.icon} ${h.animal}</div><div class="harvest-date">${h.date}</div></div>
<div class="harvest-body">
<div class="harvest-stats">
<div><div class="harvest-stat-value">${h.weight}</div><div class="harvest-stat-label">Weight</div></div>
<div><div class="harvest-stat-value">${h.distance}</div><div class="harvest-stat-label">Distance</div></div>
<div><div class="harvest-stat-value">${h.points}</div><div class="harvest-stat-label">Trophy</div></div>
</div>
<div class="harvest-details">
<div class="detail-row">📍 ${h.location}</div>
<div class="detail-row">🎯 ${h.method}</div>
<div class="detail-row">📝 ${h.notes}</div>
</div>
<div class="harvest-actions"><button class="action-btn">📷 Photos</button><button class="action-btn">✏️ Edit</button><button class="action-btn">📤 Share</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
