<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production Report - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"production-report","name":"Production Report","icon":"📊","desc":"Track mining production and output metrics","category":"mining","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.date-selector{display:flex;gap:10px;align-items:center}
.date-selector input{padding:8px 12px;border:1px solid #333;border-radius:6px;background:#1a1a1a;color:#e0e0e0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:30px}
.kpi{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333}
.kpi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi-icon{font-size:1.5rem}
.kpi-trend{font-size:.75rem;padding:3px 8px;border-radius:4px}
.kpi-trend.up{background:#10b98133;color:#10b981}
.kpi-trend.down{background:#ef444433;color:#ef4444}
.kpi-value{font-size:2rem;font-weight:bold}
.kpi-label{font-size:.875rem;color:#888;margin-top:5px}
.kpi-target{font-size:.75rem;color:#666;margin-top:10px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;margin-bottom:20px}
.chart-panel{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.chart-title{font-weight:600}
.bar-chart{display:flex;align-items:end;gap:8px;height:150px}
.bar{flex:1;background:linear-gradient(to top,#10b981,#3b82f6);border-radius:4px 4px 0 0;min-height:10px;position:relative}
.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#888}
.materials-list{display:flex;flex-direction:column;gap:10px}
.material-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#252525;border-radius:8px}
.material-info{display:flex;align-items:center;gap:10px}
.material-icon{font-size:1.25rem}
.material-progress{flex:1;margin:0 20px}
.progress-bar{height:6px;background:#333;border-radius:3px}
.progress-fill{height:100%;background:#10b981;border-radius:3px}
.material-value{font-weight:600;min-width:100px;text-align:right}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem}
.btn-primary{background:#10b981;color:#fff}
</style>
</head>
<body>
<div class="header">
<h1>📊 Production Report</h1>
<div class="date-selector">
<input type="date" id="reportDate" onchange="loadReport()">
<button class="btn btn-primary" onclick="exportReport()">📥 Export</button>
</div>
</div>

<div class="kpi-grid">
<div class="kpi">
<div class="kpi-header">
<span class="kpi-icon">⛏️</span>
<span class="kpi-trend up">↑ 12%</span>
</div>
<div class="kpi-value" id="totalTonnage">0</div>
<div class="kpi-label">Total Tonnage (t)</div>
<div class="kpi-target">Target: 15,000t</div>
</div>
<div class="kpi">
<div class="kpi-header">
<span class="kpi-icon">🚛</span>
<span class="kpi-trend up">↑ 8%</span>
</div>
<div class="kpi-value" id="truckLoads">0</div>
<div class="kpi-label">Truck Loads</div>
<div class="kpi-target">Target: 450</div>
</div>
<div class="kpi">
<div class="kpi-header">
<span class="kpi-icon">⏱️</span>
<span class="kpi-trend down">↓ 3%</span>
</div>
<div class="kpi-value" id="cycleTime">0</div>
<div class="kpi-label">Avg Cycle Time (min)</div>
<div class="kpi-target">Target: 25 min</div>
</div>
<div class="kpi">
<div class="kpi-header">
<span class="kpi-icon">💎</span>
<span class="kpi-trend up">↑ 5%</span>
</div>
<div class="kpi-value" id="oreGrade">0%</div>
<div class="kpi-label">Ore Grade</div>
<div class="kpi-target">Target: 2.5%</div>
</div>
</div>

<div class="charts-grid">
<div class="chart-panel">
<div class="chart-header">
<span class="chart-title">Hourly Production</span>
</div>
<div class="bar-chart" id="hourlyChart"></div>
</div>
<div class="chart-panel">
<div class="chart-header">
<span class="chart-title">Material Breakdown</span>
</div>
<div class="materials-list" id="materialsList"></div>
</div>
</div>

<script>
const STORAGE_KEY = 'kiss_production_report';

let reportData = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {
  date: new Date().toISOString().split('T')[0],
  tonnage: 14250,
  truckLoads: 428,
  cycleTime: 27,
  oreGrade: 2.7,
  hourly: [450, 620, 580, 710, 680, 640, 590, 720, 680, 750, 690, 640],
  materials: [
    { name: 'Copper Ore', icon: '🟤', amount: 8500, target: 9000 },
    { name: 'Waste Rock', icon: '�ite', amount: 4200, target: 4500 },
    { name: 'Gold Ore', icon: '🟡', amount: 1200, target: 1000 },
    { name: 'Silver Ore', icon: '⚪', amount: 350, target: 400 }
  ]
};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(reportData));
}

function loadReport() {
  document.getElementById('totalTonnage').textContent = reportData.tonnage.toLocaleString();
  document.getElementById('truckLoads').textContent = reportData.truckLoads;
  document.getElementById('cycleTime').textContent = reportData.cycleTime;
  document.getElementById('oreGrade').textContent = reportData.oreGrade + '%';

  renderHourlyChart();
  renderMaterials();
}

function renderHourlyChart() {
  const chart = document.getElementById('hourlyChart');
  const max = Math.max(...reportData.hourly);
  const hours = ['6AM','7AM','8AM','9AM','10AM','11AM','12PM','1PM','2PM','3PM','4PM','5PM'];

  chart.innerHTML = reportData.hourly.map((v, i) => `
    <div class="bar" style="height:${(v/max)*100}%">
      <span class="bar-label">${hours[i]}</span>
    </div>
  `).join('');
}

function renderMaterials() {
  const list = document.getElementById('materialsList');

  list.innerHTML = reportData.materials.map(m => {
    const pct = Math.min(100, Math.round((m.amount / m.target) * 100));
    return `
      <div class="material-row">
        <div class="material-info">
          <span class="material-icon">${m.icon}</span>
          <span>${m.name}</span>
        </div>
        <div class="material-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="material-value">${m.amount.toLocaleString()}t</div>
      </div>
    `;
  }).join('');
}

function exportReport() {
  const data = JSON.stringify(reportData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `production-report-${reportData.date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('reportDate').value = reportData.date;
loadReport();
</script>
</body>
</html>
