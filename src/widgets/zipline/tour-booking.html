<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zipline Tours - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"zipline-booking","name":"Zipline Tours","icon":"🪢","desc":"Book zipline adventures","category":"zipline","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#059669;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.hero{background:linear-gradient(135deg,#059669 0%,#047857 100%);border-radius:12px;padding:30px;margin-bottom:20px;text-align:center}
.hero h2{font-size:1.75rem;margin-bottom:10px}
.hero p{opacity:.9}
.tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.tour{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.tour-header{padding:25px;background:#252525}
.tour-name{font-size:1.5rem;font-weight:bold;margin-bottom:5px}
.tour-tagline{font-size:.875rem;color:#888}
.tour-body{padding:20px}
.tour-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px;text-align:center}
.tour-stat-value{font-size:1.125rem;font-weight:bold;color:#059669}
.tour-stat-label{font-size:.65rem;color:#888}
.tour-features{margin-bottom:15px}
.feature{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.875rem}
.tour-footer{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #333}
.tour-price{font-size:1.5rem;font-weight:bold;color:#22c55e}
.book-btn{padding:12px 25px;background:#059669;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>🪢 Zipline Tours</h1><button class="btn">My Bookings</button></div>
<div class="hero">
<h2>🌲 Soar Through the Canopy!</h2>
<p>Experience the thrill of flight on our world-class zipline courses</p>
</div>
<div class="tours" id="tours"></div>
<script>
const tours=[
{name:'Canopy Express',tagline:'Perfect first-time experience',lines:5,highest:'150 ft',longest:'800 ft',duration:'2 hrs',features:['Training included','All gear provided','Photo package','Light refreshments'],price:89},
{name:'Extreme Adventure',tagline:'For thrill seekers',lines:9,highest:'300 ft',longest:'2,000 ft',duration:'3.5 hrs',features:['Advanced course','Superman lines','Rappelling sections','Aerial bridges'],price:159},
{name:'Twilight Tour',tagline:'Sunset & night experience',lines:7,highest:'200 ft',longest:'1,200 ft',duration:'3 hrs',features:['Sunset views','LED lighting','Night vision lines','Campfire finish'],price:129},
{name:'Family Fun',tagline:'Ages 5+, all skill levels',lines:4,highest:'80 ft',longest:'400 ft',duration:'1.5 hrs',features:['Kid-friendly','Tandem options','Ground activities','Snacks included'],price:59}
];
document.getElementById('tours').innerHTML=tours.map(t=>`
<div class="tour">
<div class="tour-header"><div class="tour-name">${t.name}</div><div class="tour-tagline">${t.tagline}</div></div>
<div class="tour-body">
<div class="tour-stats">
<div><div class="tour-stat-value">${t.lines}</div><div class="tour-stat-label">Ziplines</div></div>
<div><div class="tour-stat-value">${t.highest}</div><div class="tour-stat-label">Highest</div></div>
<div><div class="tour-stat-value">${t.longest}</div><div class="tour-stat-label">Longest</div></div>
<div><div class="tour-stat-value">${t.duration}</div><div class="tour-stat-label">Duration</div></div>
</div>
<div class="tour-features">${t.features.map(f=>`<div class="feature">✓ ${f}</div>`).join('')}</div>
<div class="tour-footer"><span class="tour-price">$${t.price}</span><button class="book-btn">Book Now</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
