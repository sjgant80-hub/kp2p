<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concessions - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"concessions-pos","name":"Concessions POS","icon":"🍿","desc":"Cinema concession stand","category":"cinema","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.order-num{padding:10px 20px;background:#dc2626;color:#fff;border-radius:6px;font-weight:600}
.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.item{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:15px;text-align:center;cursor:pointer}
.item:hover{border-color:#dc2626}
.item-icon{font-size:2.5rem;margin-bottom:10px}
.item-name{font-weight:bold;margin-bottom:5px}
.item-price{color:#22c55e;font-weight:600}
.cart{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;height:fit-content}
.cart h3{margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid #333}
.cart-items{margin-bottom:20px;max-height:300px;overflow-y:auto}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#252525;border-radius:6px;margin-bottom:8px}
.cart-item-info{display:flex;align-items:center;gap:10px}
.cart-qty{display:flex;align-items:center;gap:8px}
.qty-btn{width:24px;height:24px;background:#333;border:none;color:#fff;border-radius:4px;cursor:pointer}
.cart-totals{border-top:1px solid #333;padding-top:15px}
.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:.875rem}
.total-row.grand{font-size:1.25rem;font-weight:bold;padding-top:10px}
.checkout-btn{width:100%;padding:15px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1rem;margin-top:15px}
</style>
</head>
<body>
<div class="header"><h1>🍿 Concessions</h1><span class="order-num">Order #247</span></div>
<div class="layout">
<div class="menu" id="menu"></div>
<div class="cart">
<h3>🛒 Current Order</h3>
<div class="cart-items" id="cart"></div>
<div class="cart-totals">
<div class="total-row"><span>Subtotal</span><span>$24.50</span></div>
<div class="total-row"><span>Tax</span><span>$2.08</span></div>
<div class="total-row grand"><span>Total</span><span>$26.58</span></div>
</div>
<button class="checkout-btn">Complete Order</button>
</div>
</div>
<script>
const menu=[
{name:'Small Popcorn',icon:'🍿',price:6.50},
{name:'Large Popcorn',icon:'🍿',price:9.50},
{name:'Small Drink',icon:'🥤',price:5.00},
{name:'Large Drink',icon:'🥤',price:7.00},
{name:'Candy',icon:'🍬',price:4.50},
{name:'Nachos',icon:'🧀',price:8.00},
{name:'Hot Dog',icon:'🌭',price:6.00},
{name:'Pretzel',icon:'🥨',price:5.50},
{name:'Ice Cream',icon:'🍦',price:5.00},
{name:'Combo #1',icon:'🎬',price:16.00},
{name:'Combo #2',icon:'🎬',price:22.00},
{name:'Kids Combo',icon:'👶',price:12.00}
];
document.getElementById('menu').innerHTML=menu.map(m=>`
<div class="item">
<div class="item-icon">${m.icon}</div>
<div class="item-name">${m.name}</div>
<div class="item-price">$${m.price.toFixed(2)}</div>
</div>`).join('');

const cart=[
{name:'Large Popcorn',qty:2,price:9.50},
{name:'Large Drink',qty:2,price:7.00},
{name:'Candy',qty:1,price:4.50}
];
document.getElementById('cart').innerHTML=cart.map(c=>`
<div class="cart-item">
<div class="cart-item-info"><span>${c.name}</span></div>
<div class="cart-qty">
<button class="qty-btn">-</button>
<span>${c.qty}</span>
<button class="qty-btn">+</button>
<span style="width:50px;text-align:right">$${(c.qty*c.price).toFixed(2)}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
