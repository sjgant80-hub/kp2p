<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grooming Appointments - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"grooming-appointments","name":"Grooming Appointments","icon":"✂️","desc":"Schedule grooming","category":"kennel","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#9333ea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.schedule-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.date-picker{display:flex;gap:10px;align-items:center}
.nav-btn{padding:8px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.current-date{font-size:1.125rem;font-weight:bold}
.groomers{display:flex;gap:10px}
.groomer{padding:8px 16px;background:#252525;border-radius:6px;font-size:.875rem;cursor:pointer}
.groomer.active{background:#9333ea33;color:#9333ea}
.appointments{display:flex;flex-direction:column;gap:12px}
.appointment{background:#1a1a1a;border-radius:12px;border:1px solid #333;display:grid;grid-template-columns:100px 1fr auto;overflow:hidden}
.appt-time{padding:20px;background:#252525;display:flex;flex-direction:column;justify-content:center;align-items:center}
.time-slot{font-size:1.125rem;font-weight:bold}
.time-duration{font-size:.75rem;color:#888}
.appt-info{padding:20px}
.pet-name{font-size:1rem;font-weight:bold;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.pet-breed{font-size:.875rem;color:#888;margin-bottom:8px}
.appt-services{display:flex;gap:8px;flex-wrap:wrap}
.service{padding:4px 10px;background:#252525;border-radius:4px;font-size:.7rem}
.appt-status{padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:8px;border-left:1px solid #333}
.status-badge{padding:4px 12px;border-radius:4px;font-size:.75rem}
.status-scheduled{background:#0369a133;color:#0369a1}
.status-progress{background:#f59e0b33;color:#f59e0b}
.status-complete{background:#22c55e33;color:#22c55e}
.appt-price{font-size:1rem;font-weight:bold;color:#22c55e}
</style>
</head>
<body>
<div class="header"><h1>✂️ Grooming</h1><button class="btn">Book Appointment</button></div>
<div class="schedule-nav">
<div class="date-picker">
<button class="nav-btn">←</button>
<span class="current-date">Monday, January 20</span>
<button class="nav-btn">→</button>
</div>
<div class="groomers">
<span class="groomer active">All Groomers</span>
<span class="groomer">Sarah</span>
<span class="groomer">Mike</span>
<span class="groomer">Lisa</span>
</div>
</div>
<div class="appointments" id="appointments"></div>
<script>
const appointments=[
{time:'9:00 AM',duration:90,pet:'Max',type:'🐕',breed:'Golden Retriever',groomer:'Sarah',services:['Full Groom','Nail Trim','Teeth Cleaning'],price:85,status:'complete'},
{time:'10:30 AM',duration:60,pet:'Bella',type:'🐕',breed:'French Bulldog',groomer:'Mike',services:['Bath & Brush','Nail Trim'],price:55,status:'progress'},
{time:'11:30 AM',duration:45,pet:'Whiskers',type:'🐈',breed:'Persian',groomer:'Lisa',services:['Cat Grooming','Mat Removal'],price:65,status:'scheduled'},
{time:'1:00 PM',duration:120,pet:'Rocky',type:'🐕',breed:'German Shepherd',groomer:'Sarah',services:['Full Groom','De-shedding','Nail Trim'],price:95,status:'scheduled'},
{time:'2:30 PM',duration:60,pet:'Luna',type:'🐈',breed:'Maine Coon',groomer:'Lisa',services:['Cat Grooming','Lion Cut'],price:75,status:'scheduled'},
{time:'3:30 PM',duration:90,pet:'Cooper',type:'🐕',breed:'Poodle',groomer:'Mike',services:['Breed Cut','Bath','Nail Trim'],price:90,status:'scheduled'}
];
document.getElementById('appointments').innerHTML=appointments.map(a=>`
<div class="appointment">
<div class="appt-time">
<div class="time-slot">${a.time}</div>
<div class="time-duration">${a.duration} min</div>
</div>
<div class="appt-info">
<div class="pet-name">${a.type} ${a.pet}</div>
<div class="pet-breed">${a.breed} • Groomer: ${a.groomer}</div>
<div class="appt-services">${a.services.map(s=>`<span class="service">${s}</span>`).join('')}</div>
</div>
<div class="appt-status">
<span class="status-badge status-${a.status}">${a.status.toUpperCase()}</span>
<span class="appt-price">$${a.price}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
