<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Schedule - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"service-schedule","name":"Service Schedule","icon":"🐜","desc":"Schedule pest control","category":"pest","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#84cc16}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.time{font-weight:600}
.status{padding:4px 10px;border-radius:6px;font-size:.75rem}
.status.scheduled{background:#3b82f633;color:#3b82f6}
.status.progress{background:#84cc1633;color:#84cc16}
.status.done{background:#22c55e33;color:#22c55e}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.pests{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pest{padding:4px 8px;background:#ef444433;border-radius:4px;font-size:.75rem;color:#ef4444}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#84cc16;color:#000}
</style>
</head>
<body>
<div class="header"><h1>🐜 Service Schedule</h1><button class="btn" onclick="alert('Schedule')">+ Schedule</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">28</div><div class="stat-label">Active Clients</div></div>
<div class="stat"><div class="stat-value">45</div><div class="stat-label">Completed</div></div>
</div>
<div class="list" id="list"></div>
<script>
const jobs=[
{time:'9:00 AM',customer:'Johnson Home',address:'123 Oak St',type:'Quarterly',tech:'Mike J.',pests:['Ants','Spiders'],status:'progress'},
{time:'2:00 PM',customer:'ABC Restaurant',address:'456 Main St',type:'Monthly',tech:'Tom S.',pests:['Roaches','Flies'],status:'scheduled'},
{time:'4:00 PM',customer:'Smith Residence',address:'789 Maple Ave',type:'One-Time',tech:'Mike J.',pests:['Termites'],status:'scheduled'}
];
document.getElementById('list').innerHTML=jobs.map(j=>`
<div class="card">
<div class="card-header"><span class="time">📅 Today at ${j.time}</span><span class="status ${j.status}">${j.status==='progress'?'In Progress':j.status}</span></div>
<div class="info">
<div><div class="row"><span class="label">Customer</span><span>${j.customer}</span></div><div class="row"><span class="label">Address</span><span>${j.address}</span></div></div>
<div><div class="row"><span class="label">Type</span><span>${j.type}</span></div><div class="row"><span class="label">Tech</span><span>${j.tech}</span></div></div>
</div>
<div class="pests">${j.pests.map(p=>`<span class="pest">${p}</span>`).join('')}</div>
</div>`).join('');
</script>
</body>
</html>
