<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Booking - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"paintball-booking","name":"Paintball Booking","icon":"🎯","desc":"Book paintball games","category":"paintball","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#84cc16;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:20px}
.field{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.field-banner{padding:30px;background:linear-gradient(135deg,#84cc16 0%,#65a30d 100%);color:#000}
.field-name{font-size:1.5rem;font-weight:bold;margin-bottom:5px}
.field-type{font-size:.875rem;opacity:.8}
.field-body{padding:20px}
.field-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;text-align:center}
.field-stat-value{font-size:1.125rem;font-weight:bold;color:#84cc16}
.field-stat-label{font-size:.7rem;color:#888}
.field-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.field-footer{display:flex;justify-content:space-between;align-items:center}
.field-price{font-size:1.125rem;font-weight:bold;color:#22c55e}
.book-btn{padding:10px 20px;background:#84cc16;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.packages{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.packages h3{margin-bottom:15px}
.package-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
.package{padding:20px;background:#252525;border-radius:8px;text-align:center}
.package-name{font-weight:bold;margin-bottom:10px}
.package-includes{font-size:.875rem;color:#888;margin-bottom:15px}
.package-price{font-size:1.25rem;font-weight:bold;color:#84cc16}
</style>
</head>
<body>
<div class="header"><h1>🎯 Paintball</h1><button class="btn">My Bookings</button></div>
<div class="fields" id="fields"></div>
<div class="packages">
<h3>Equipment Packages</h3>
<div class="package-grid" id="packages"></div>
</div>
<script>
const fields=[
{name:'Apocalypse City',type:'Urban Combat',size:'2 acres',players:'10-20',cover:'Buildings & Cars',desc:'Post-apocalyptic urban warfare with multi-story buildings, burned-out vehicles, and endless ambush points.',price:35},
{name:'Jungle Warfare',type:'Woodsball',size:'5 acres',players:'15-30',cover:'Natural Forest',desc:'Dense forest terrain with bunkers, trenches, and natural obstacles. Perfect for tactical gameplay.',price:30},
{name:'Speedball Arena',type:'Tournament',size:'0.5 acres',players:'6-10',cover:'Inflatable Bunkers',desc:'Fast-paced tournament-style field with symmetrical layout and professional-grade obstacles.',price:40}
];
document.getElementById('fields').innerHTML=fields.map(f=>`
<div class="field">
<div class="field-banner"><div class="field-name">${f.name}</div><div class="field-type">${f.type}</div></div>
<div class="field-body">
<div class="field-stats">
<div><div class="field-stat-value">${f.size}</div><div class="field-stat-label">Field Size</div></div>
<div><div class="field-stat-value">${f.players}</div><div class="field-stat-label">Players</div></div>
<div><div class="field-stat-value">${f.cover}</div><div class="field-stat-label">Cover Type</div></div>
</div>
<div class="field-desc">${f.desc}</div>
<div class="field-footer"><span class="field-price">$${f.price}/person</span><button class="book-btn">Book Field</button></div>
</div>
</div>`).join('');

const packages=[
{name:'Basic Package',includes:'Marker, Mask, 500 paintballs',price:25},
{name:'Standard Package',includes:'Premium marker, Mask, Vest, 1000 paintballs',price:45},
{name:'Pro Package',includes:'Electronic marker, Thermal mask, Full gear, 2000 paintballs',price:75},
{name:'Paintballs Only',includes:'500 tournament-grade paintballs',price:15}
];
document.getElementById('packages').innerHTML=packages.map(p=>`
<div class="package">
<div class="package-name">${p.name}</div>
<div class="package-includes">${p.includes}</div>
<div class="package-price">$${p.price}</div>
</div>`).join('');
</script>
</body>
</html>
