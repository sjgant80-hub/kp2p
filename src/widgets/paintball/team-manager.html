<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Manager - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"paintball-teams","name":"Paintball Teams","icon":"👥","desc":"Manage paintball teams","category":"paintball","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#84cc16;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.match-header{background:linear-gradient(135deg,#84cc16 0%,#65a30d 100%);border-radius:12px;padding:25px;margin-bottom:20px;color:#000}
.match-title{font-size:1.25rem;font-weight:bold;margin-bottom:10px;text-align:center}
.match-teams{display:flex;justify-content:space-around;align-items:center}
.match-team{text-align:center}
.team-name{font-size:1.5rem;font-weight:bold}
.team-score{font-size:2.5rem;font-weight:bold;margin:10px 0}
.vs{font-size:1.5rem;font-weight:bold;opacity:.5}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.team{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.team-header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.team-color{width:16px;height:16px;border-radius:50%;margin-right:10px;display:inline-block}
.team-stats{font-size:.875rem;color:#888}
.roster{padding:15px}
.player{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#252525;border-radius:6px;margin-bottom:8px}
.player:last-child{margin-bottom:0}
.player-info{display:flex;align-items:center;gap:10px}
.player-role{font-size:.7rem;padding:3px 8px;background:#333;border-radius:4px}
.player-stats{font-size:.875rem;color:#888}
.add-player{width:100%;padding:10px;background:transparent;border:1px dashed #333;color:#888;border-radius:6px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="header"><h1>👥 Team Manager</h1><button class="btn">+ Create Team</button></div>
<div class="match-header">
<div class="match-title">🏆 Current Match - Apocalypse City</div>
<div class="match-teams">
<div class="match-team"><div class="team-name">🔴 Red Team</div><div class="team-score">3</div></div>
<div class="vs">VS</div>
<div class="match-team"><div class="team-name">🔵 Blue Team</div><div class="team-score">2</div></div>
</div>
</div>
<div class="teams">
<div class="team">
<div class="team-header"><span><span class="team-color" style="background:#ef4444"></span>Red Team</span><span class="team-stats">6 players</span></div>
<div class="roster" id="red-team"></div>
</div>
<div class="team">
<div class="team-header"><span><span class="team-color" style="background:#3b82f6"></span>Blue Team</span><span class="team-stats">6 players</span></div>
<div class="roster" id="blue-team"></div>
</div>
</div>
<script>
const redTeam=[
{name:'Jake',role:'Captain',eliminations:12,deaths:3},
{name:'Mike',role:'Sniper',eliminations:8,deaths:4},
{name:'Sarah',role:'Assault',eliminations:6,deaths:5},
{name:'Tom',role:'Support',eliminations:4,deaths:6},
{name:'Emma',role:'Flanker',eliminations:7,deaths:4},
{name:'Dave',role:'Rookie',eliminations:2,deaths:8}
];
const blueTeam=[
{name:'Chris',role:'Captain',eliminations:10,deaths:5},
{name:'Alex',role:'Sniper',eliminations:9,deaths:3},
{name:'Lisa',role:'Assault',eliminations:5,deaths:6},
{name:'Ryan',role:'Support',eliminations:3,deaths:7},
{name:'Mia',role:'Flanker',eliminations:6,deaths:5},
{name:'Nick',role:'Rookie',eliminations:1,deaths:9}
];
document.getElementById('red-team').innerHTML=redTeam.map(p=>`
<div class="player">
<div class="player-info"><span>${p.name}</span><span class="player-role">${p.role}</span></div>
<div class="player-stats">${p.eliminations}/${p.deaths} K/D</div>
</div>`).join('')+'<button class="add-player">+ Add Player</button>';
document.getElementById('blue-team').innerHTML=blueTeam.map(p=>`
<div class="player">
<div class="player-info"><span>${p.name}</span><span class="player-role">${p.role}</span></div>
<div class="player-stats">${p.eliminations}/${p.deaths} K/D</div>
</div>`).join('')+'<button class="add-player">+ Add Player</button>';
</script>
</body>
</html>
