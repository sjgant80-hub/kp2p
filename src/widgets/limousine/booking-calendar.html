<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limo Bookings - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"booking-calendar","name":"Booking Calendar","icon":"📆","desc":"Limousine booking calendar","category":"limousine","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#ca8a04;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.bookings{display:flex;flex-direction:column;gap:15px}
.booking{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.booking-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.booking-client{font-size:1.125rem;font-weight:bold}
.booking-type{font-size:.75rem;color:#ca8a04}
.booking-total{font-size:1.25rem;font-weight:bold;color:#ca8a04}
.booking-info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.info{background:#252525;padding:10px;border-radius:6px;text-align:center}
.info-value{font-size:.9rem;font-weight:bold}
.info-label{font-size:.6rem;color:#888}
.booking-footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:15px;border-top:1px solid #333}
.vehicle-tag{padding:4px 8px;background:#252525;border-radius:4px;font-size:.75rem}
.status-badge{padding:4px 10px;border-radius:4px;font-size:.7rem}
.confirmed{background:#15803d33;color:#15803d}
.pending{background:#eab30833;color:#eab308}
</style>
</head>
<body>
<div class="header"><h1>📆 Bookings</h1><button class="btn">New Booking</button></div>
<div class="bookings" id="bookings"></div>
<script>
const bookings=[
{client:'Johnson Wedding',type:'Wedding',vehicle:'Chrysler 300 Stretch',date:'Dec 28',time:'2:00 PM - 11:00 PM',duration:'9 hrs',pickup:'Hilton Hotel',dropoff:'Multiple Venues',total:'$1,450',status:'confirmed'},
{client:'TechCorp Executive',type:'Corporate',vehicle:'Mercedes S-Class',date:'Dec 27',time:'8:00 AM - 6:00 PM',duration:'10 hrs',pickup:'Airport',dropoff:'Business District',total:'$890',status:'confirmed'},
{client:'Prom Group - Lincoln HS',type:'Prom',vehicle:'Party Bus',date:'Jan 15',time:'6:00 PM - 12:00 AM',duration:'6 hrs',pickup:'School',dropoff:'Venue + Return',total:'$1,200',status:'pending'},
{client:'VIP Airport Transfer',type:'Airport',vehicle:'Rolls Royce Phantom',date:'Dec 27',time:'3:00 PM',duration:'2 hrs',pickup:'Private Terminal',dropoff:'Four Seasons',total:'$650',status:'confirmed'},
{client:'Anniversary Dinner',type:'Special Event',vehicle:'Lincoln Continental',date:'Dec 30',time:'7:00 PM - 11:00 PM',duration:'4 hrs',pickup:'Residence',dropoff:'Restaurant + Return',total:'$380',status:'pending'}
];
document.getElementById('bookings').innerHTML=bookings.map(b=>`
<div class="booking">
<div class="booking-header">
<div>
<div class="booking-client">${b.client}</div>
<div class="booking-type">${b.type}</div>
</div>
<div class="booking-total">${b.total}</div>
</div>
<div class="booking-info">
<div class="info"><div class="info-value">${b.date}</div><div class="info-label">DATE</div></div>
<div class="info"><div class="info-value">${b.time}</div><div class="info-label">TIME</div></div>
<div class="info"><div class="info-value">${b.pickup}</div><div class="info-label">PICKUP</div></div>
<div class="info"><div class="info-value">${b.dropoff}</div><div class="info-label">DROP-OFF</div></div>
</div>
<div class="booking-footer">
<span class="vehicle-tag">${b.vehicle}</span>
<span class="status-badge ${b.status}">${b.status.toUpperCase()}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
