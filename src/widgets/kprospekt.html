    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        .container { max-width: 1400px; margin: 0 auto; }
        header {

        .ai-badge {
            display: inline-flex;

        .btn {

        .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

        .card {
            background: rgba(30, 30, 50, 0.8);

            border: 1px solid rgba(255,255,255,0.1);

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;

        }

        /* Prospect Card */
        .prospect-card {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .prospect-header { display: flex; gap: 20px; margin-bottom: 20px; }
        .prospect-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);

            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .prospect-info { flex: 1; }

        .prospect-company {
            display: inline-flex;

            font-size: 0.9rem;
        }

        .prospect-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .prospect-stat {
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            text-align: center;
        }
        .prospect-stat .value { font-size: 1.3rem; font-weight: bold; color: #a855f7; }
        .prospect-stat .label { font-size: 0.75rem; color: #666; margin-top: 5px; }

        /* Sections */
        .section {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #a855f7;

            gap: 8px;
        }
        .section p, .section li { font-size: 0.9rem; line-height: 1.6; color: #ccc; }
        .section ul { padding-left: 20px; }
        .section li { margin-bottom: 8px; }

        /* Tags */
        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .tag.tech { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.3); color: #3b82f6; }
        .tag.industry { background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.3); color: #22c55e; }
        .tag.signal { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.3); color: #f59e0b; }

        /* Talking Points */
        .talking-point {
            padding: 15px;

            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }
        .talking-point h4 { font-size: 0.9rem; margin-bottom: 8px; color: #a855f7; }
        .talking-point p { font-size: 0.85rem; color: #ccc; }

        /* Triggers */
        .trigger {
            padding: 12px 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .trigger-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .trigger-icon.funding { background: rgba(34, 197, 94, 0.2); }
        .trigger-icon.hiring { background: rgba(59, 130, 246, 0.2); }
        .trigger-icon.news { background: rgba(245, 158, 11, 0.2); }
        .trigger-icon.tech { background: rgba(168, 85, 247, 0.2); }
        .trigger-content { flex: 1; }
        .trigger-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; }
        .trigger-desc { font-size: 0.8rem; color: #888; }
        .trigger-date { font-size: 0.75rem; color: #666; }

        /* Sidebar */
        .similar-companies { max-height: 300px; overflow-y: auto; }
        .similar-company {
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .similar-company:hover { background: rgba(0,0,0,0.3); }
        .similar-company-name { font-weight: 600; margin-bottom: 4px; }
        .similar-company-desc { font-size: 0.8rem; color: #888; }
        .similar-company-match {
            margin-top: 8px;
            font-size: 0.75rem;
            padding: 3px 8px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 10px;
            color: #22c55e;
            display: inline-block;
        }

        .recent-searches { max-height: 250px; overflow-y: auto; }
        .recent-search {
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recent-search:hover { background: rgba(0,0,0,0.3); }
        .recent-search-name { font-size: 0.9rem; }
        .recent-search-time { font-size: 0.75rem; color: #666; }

        /* Actions */
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }

        /* Loading */
        .loading-state {
            padding: 60px;
            text-align: center;
            color: #666;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;

            animation: spin 1s linear infinite;

        @keyframes spin { to { transform: rotate(360deg); } }

</head>
<body>
    <div class="container">
        <header>
            <h1>Kprospekt</h1>
            <p class="subtitle">AI-Powered Prospect Research & Intelligence</p>
            <div class="ai-badge">
                <span class="dot" id="aiStatus"></span>
                <span id="aiStatusText">AI Not Loaded</span>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Enter company name, LinkedIn URL, or domain..."
                   onkeypress="if(event.key==='Enter')research()">
            <button class="btn btn-primary" id="researchBtn" onclick="research()">
                Research Prospect
            </button>
        </div>

        <div class="main-grid">
            <div>
                <!-- Results Area -->
                <div id="resultsArea">
                    <div class="card">
                        <div style="text-align: center; padding: 60px; color: #666;">
                            <div style="font-size: 3rem; margin-bottom: 20px;">🔍</div>
                            <h3 style="margin-bottom: 10px; color: #888;">Enter a Company to Research</h3>
                            <p>Get AI-powered insights, talking points, and buying triggers</p>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <!-- Quick Research -->
                <div class="card">
                    <h2>Quick Research</h2>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <button class="btn btn-sm btn-secondary" onclick="quickSearch('TechStart Inc')">TechStart Inc</button>
                        <button class="btn btn-sm btn-secondary" onclick="quickSearch('Acme Corp')">Acme Corp</button>
                        <button class="btn btn-sm btn-secondary" onclick="quickSearch('DataFlow Systems')">DataFlow</button>
                        <button class="btn btn-sm btn-secondary" onclick="quickSearch('CloudNine Labs')">CloudNine</button>
                    </div>
                </div>

                <!-- Similar Companies -->
                <div class="card">
                    <h2>Similar Companies</h2>
                    <div class="similar-companies" id="similarCompanies">
                        <div style="color: #666; text-align: center; padding: 20px; font-size: 0.9rem;">
                            Research a company to see similar prospects
                        </div>
                    </div>
                </div>

                <!-- Recent Searches -->
                <div class="card">
                    <h2>Recent Searches</h2>
                    <div class="recent-searches" id="recentSearches">
                        <div style="color: #666; text-align: center; padding: 20px; font-size: 0.9rem;">
                            No recent searches
                        </div>
                    </div>
                </div>

                <!-- Export -->
                <div class="card">
                    <h2>Export</h2>
                    <div class="actions">
                        <button class="btn btn-sm btn-secondary" onclick="exportData('json')">JSON</button>
                        <button class="btn btn-sm btn-secondary" onclick="exportData('csv')">CSV</button>
                        <button class="btn btn-sm btn-secondary" onclick="exportData('pdf')">PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let engine = null;
        let currentProspect = null;
        let recentSearches = JSON.parse(localStorage.getItem('kprospekt-history') || '[]');

        async function init() {
            renderRecentSearches();
            await loadAI();
        }

        async function loadAI() {
            const status = document.getElementById('aiStatus');
            const statusText = document.getElementById('aiStatusText');

            status.className = 'dot loading';
            statusText.textContent = 'Loading AI...';

            try {
                engine = await CreateMLCEngine("Qwen2.5-0.5B-Instruct-q4f16_1-MLC", {
                    initProgressCallback: (p) => {
                        statusText.textContent = `Loading: ${Math.round(p.progress * 100)}%`;
                    }
                });
                status.className = 'dot ready';
                statusText.textContent = 'AI Ready';
            } catch (e) {
                status.className = 'dot';
                statusText.textContent = 'AI Failed - Using Templates';
            }
        }

        function quickSearch(company) {
            document.getElementById('searchInput').value = company;
            research();
        }

        async function research() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Please enter a company name');
                return;
            }

            const btn = document.getElementById('researchBtn');
            const results = document.getElementById('resultsArea');

            btn.disabled = true;
            btn.textContent = 'Researching...';

            results.innerHTML = `
                <div class="card">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Researching ${query}...</p>
                        <p style="font-size: 0.8rem; margin-top: 10px;">Analyzing company data, finding triggers, generating insights...</p>
                    </div>
                </div>
            `;

            try {
                let prospect;

                if (engine) {
                    prospect = await researchWithAI(query);
                } else {
                    prospect = generateMockProspect(query);
                }

                currentProspect = prospect;
                displayProspect(prospect);
                saveSearch(query, prospect);
                displaySimilarCompanies(prospect);

            } catch (e) {
                console.error(e);
                const prospect = generateMockProspect(query);
                currentProspect = prospect;
                displayProspect(prospect);
            }

            btn.disabled = false;
            btn.textContent = 'Research Prospect';
        }

        async function researchWithAI(query) {
            const prompt = `You are a B2B sales research assistant. Research this company and provide JSON data:

Company: ${query}

Respond with ONLY valid JSON:
{
  "name": "${query}",
  "industry": "<industry>",
  "size": "<employee count estimate>",
  "funding": "<funding stage/amount>",
  "techStack": ["<tech1>", "<tech2>", "<tech3>"],
  "summary": "<2 sentence company description>",
  "painPoints": ["<pain1>", "<pain2>", "<pain3>"],
  "buyingTriggers": [
    {"type": "funding", "title": "<trigger>", "description": "<details>"},
    {"type": "hiring", "title": "<trigger>", "description": "<details>"}
  ],
  "talkingPoints": [
    {"title": "<point>", "content": "<what to say>"}
  ],
  "fitScore": <1-100>,
  "keyContacts": ["<title1>", "<title2>"]
}`;

            const response = await engine.chat.completions.create({
                messages: [{ role: "user", content: prompt }],
                max_tokens: 600,
                temperature: 0.5
            });

            const content = response.choices[0]?.message?.content || '';

            try {
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    return JSON.parse(jsonMatch[0]);
                }
            } catch (e) {
                console.error('JSON parse failed:', e);
            }

            return generateMockProspect(query);
        }

        function generateMockProspect(query) {
            const industries = ['SaaS', 'E-commerce', 'Fintech', 'Healthcare Tech', 'EdTech'];
            const sizes = ['10-50', '50-200', '200-500', '500-1000'];
            const stages = ['Seed', 'Series A', 'Series B', 'Series C', 'Bootstrapped'];

            return {
                name: query,
                industry: industries[Math.floor(Math.random() * industries.length)],
                size: sizes[Math.floor(Math.random() * sizes.length)],
                funding: stages[Math.floor(Math.random() * stages.length)],
                techStack: ['React', 'Node.js', 'AWS', 'PostgreSQL', 'Docker'].slice(0, 3 + Math.floor(Math.random() * 3)),
                summary: `${query} is a fast-growing company in the technology sector. They focus on delivering innovative solutions to their customers while scaling their engineering team.`,
                painPoints: [
                    'Managing multiple SaaS subscriptions',
                    'Developer tool sprawl',
                    'Onboarding friction for new hires',
                    'Rising software costs'
                ].slice(0, 3),
                buyingTriggers: [
                    { type: 'funding', title: 'Recent Funding Round', description: 'Raised capital to scale operations and invest in tooling' },
                    { type: 'hiring', title: 'Engineering Team Growth', description: 'Multiple open positions for developers - need better tools' },
                    { type: 'news', title: 'Product Launch', description: 'Launching new features, need efficient dev workflow' },
                    { type: 'tech', title: 'Tech Stack Migration', description: 'Moving to modern stack, evaluating new tools' }
                ],
                talkingPoints: [
                    {
                        title: 'Cost Consolidation',
                        content: `"I noticed ${query} is growing quickly. Many companies at your stage find they're spending $3K+/month on fragmented dev tools. KISS MySaaS could consolidate that to $0."`
                    },
                    {
                        title: 'Developer Experience',
                        content: `"With ${query} scaling the engineering team, onboarding is probably a challenge. Our tools work instantly in the browser - no setup, no IT tickets."`
                    },
                    {
                        title: 'Security & Privacy',
                        content: `"Everything runs locally in the browser. For a ${query.toLowerCase().includes('health') || query.toLowerCase().includes('fin') ? 'regulated industry' : 'security-conscious company'} like ${query}, that's a major advantage."`
                    }
                ],
                fitScore: 65 + Math.floor(Math.random() * 30),
                keyContacts: ['VP of Engineering', 'CTO', 'Head of DevOps', 'Engineering Manager']
            };
        }

        function displayProspect(prospect) {
            const results = document.getElementById('resultsArea');
            const initials = prospect.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
            const fitColor = prospect.fitScore >= 80 ? '#22c55e' : prospect.fitScore >= 60 ? '#f59e0b' : '#ef4444';

            results.innerHTML = `
                <div class="prospect-card">
                    <div class="prospect-header">
                        <div class="prospect-avatar">${initials}</div>
                        <div class="prospect-info">
                            <div class="prospect-name">${prospect.name}</div>
                            <div class="prospect-title">${prospect.industry} Company</div>
                            <div class="prospect-company">
                                <span>${prospect.size} employees</span>
                                <span>•</span>
                                <span>${prospect.funding}</span>
                            </div>
                        </div>
                    </div>

                    <div class="prospect-stats">
                        <div class="prospect-stat">
                            <div class="value" style="color: ${fitColor}">${prospect.fitScore}</div>
                            <div class="label">Fit Score</div>
                        </div>
                        <div class="prospect-stat">
                            <div class="value">${prospect.buyingTriggers?.length || 0}</div>
                            <div class="label">Triggers</div>
                        </div>
                        <div class="prospect-stat">
                            <div class="value">${prospect.painPoints?.length || 0}</div>
                            <div class="label">Pain Points</div>
                        </div>
                        <div class="prospect-stat">
                            <div class="value">${prospect.techStack?.length || 0}</div>
                            <div class="label">Tech Stack</div>
                        </div>
                    </div>

                    <div class="section">
                        <h3>Company Overview</h3>
                        <p>${prospect.summary}</p>
                        <div class="tags" style="margin-top: 15px;">
                            <span class="tag industry">${prospect.industry}</span>
                            ${prospect.techStack?.map(t => `<span class="tag tech">${t}</span>`).join('') || ''}
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>Buying Triggers</h2>
                    ${prospect.buyingTriggers?.map(t => `
                        <div class="trigger">
                            <div class="trigger-icon ${t.type}">
                                ${t.type === 'funding' ? '💰' : t.type === 'hiring' ? '👥' : t.type === 'news' ? '📰' : '⚙️'}
                            </div>
                            <div class="trigger-content">
                                <div class="trigger-title">${t.title}</div>
                                <div class="trigger-desc">${t.description}</div>
                            </div>
                        </div>
                    `).join('') || '<p style="color: #666;">No triggers identified</p>'}
                </div>

                <div class="card">
                    <h2>Pain Points</h2>
                    <ul>
                        ${prospect.painPoints?.map(p => `<li>${p}</li>`).join('') || '<li>No pain points identified</li>'}
                    </ul>
                    <div class="tags">
                        ${prospect.painPoints?.map(p => `<span class="tag signal">${p.split(' ').slice(0, 2).join(' ')}</span>`).join('') || ''}
                    </div>
                </div>

                <div class="card">
                    <h2>AI-Generated Talking Points</h2>
                    ${prospect.talkingPoints?.map(tp => `
                        <div class="talking-point">
                            <h4>${tp.title}</h4>
                            <p>${tp.content}</p>
                        </div>
                    `).join('') || '<p style="color: #666;">No talking points generated</p>'}
                </div>

                <div class="card">
                    <h2>Key Contacts to Target</h2>
                    <div class="tags">
                        ${prospect.keyContacts?.map(c => `<span class="tag">${c}</span>`).join('') || '<span class="tag">VP of Engineering</span>'}
                    </div>
                </div>

                <div class="actions" style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="generateOutreach()">Generate Outreach</button>
                    <button class="btn btn-secondary" onclick="addToList()">Add to List</button>
                    <button class="btn btn-secondary" onclick="research()">Refresh Data</button>
                </div>
            `;
        }

        function displaySimilarCompanies(prospect) {
            const container = document.getElementById('similarCompanies');
            const similar = [
                { name: 'TechFlow Inc', desc: `${prospect.industry} • ${prospect.size} employees`, match: 92 },
                { name: 'CloudBase Systems', desc: `${prospect.industry} • Similar stack`, match: 87 },
                { name: 'DevOps Pro', desc: 'SaaS • Engineering-focused', match: 81 },
                { name: 'Startup Labs', desc: `${prospect.funding} stage • Growing`, match: 76 }
            ];

            container.innerHTML = similar.map(s => `
                <div class="similar-company" onclick="quickSearch('${s.name}')">
                    <div class="similar-company-name">${s.name}</div>
                    <div class="similar-company-desc">${s.desc}</div>
                    <div class="similar-company-match">${s.match}% match</div>
                </div>
            `).join('');
        }

        function saveSearch(query, prospect) {
            recentSearches.unshift({
                query,
                name: prospect.name,
                fitScore: prospect.fitScore,
                time: Date.now()
            });
            recentSearches = recentSearches.slice(0, 20);
            localStorage.setItem('kprospekt-history', JSON.stringify(recentSearches));
            renderRecentSearches();
        }

        function renderRecentSearches() {
            const container = document.getElementById('recentSearches');
            if (recentSearches.length === 0) {
                container.innerHTML = '<div style="color: #666; text-align: center; padding: 20px; font-size: 0.9rem;">No recent searches</div>';
                return;
            }

            container.innerHTML = recentSearches.slice(0, 10).map(s => `
                <div class="recent-search" onclick="quickSearch('${s.query}')">
                    <span class="recent-search-name">${s.name}</span>
                    <span class="recent-search-time">${timeAgo(s.time)}</span>
                </div>
            `).join('');
        }

        function timeAgo(time) {
            const diff = Date.now() - time;
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'now';
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h ago`;
            return `${Math.floor(hours / 24)}d ago`;
        }

        function generateOutreach() {
            if (currentProspect) {
                // Could integrate with Kold widget
                alert(`Opening Kold with ${currentProspect.name}...`);
                // window.open(`kold.html?company=${encodeURIComponent(currentProspect.name)}`, '_blank');
            }
        }

        function addToList() {
            if (currentProspect) {
                const lists = JSON.parse(localStorage.getItem('kprospekt-lists') || '[]');
                lists.push(currentProspect);
                localStorage.setItem('kprospekt-lists', JSON.stringify(lists));
                alert(`${currentProspect.name} added to prospect list!`);
            }
        }

        function exportData(format) {
            if (!currentProspect) {
                alert('Research a prospect first');
                return;
            }

            if (format === 'json') {
                const blob = new Blob([JSON.stringify(currentProspect, null, 2)], { type: 'application/json' });
                downloadBlob(blob, `${currentProspect.name.replace(/\s+/g, '-')}-research.json`);
            } else if (format === 'csv') {
                let csv = 'Field,Value\n';
                csv += `Name,${currentProspect.name}\n`;
                csv += `Industry,${currentProspect.industry}\n`;
                csv += `Size,${currentProspect.size}\n`;
                csv += `Funding,${currentProspect.funding}\n`;
                csv += `Fit Score,${currentProspect.fitScore}\n`;
                csv += `Tech Stack,"${currentProspect.techStack?.join(', ')}"\n`;
                csv += `Pain Points,"${currentProspect.painPoints?.join('; ')}"\n`;
                const blob = new Blob([csv], { type: 'text/csv' });
                downloadBlob(blob, `${currentProspect.name.replace(/\s+/g, '-')}-research.csv`);
            } else {
                alert('PDF export would generate a formatted report');
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        init();
    </script>
</body>
</html>
