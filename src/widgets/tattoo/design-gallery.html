<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Gallery - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"design-gallery","name":"Design Gallery","icon":"🎨","desc":"Tattoo design portfolio","category":"tattoo","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;cursor:pointer;font-size:.875rem}
.tab.active{background:#7c3aed33;border-color:#7c3aed;color:#a78bfa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.card-image{height:180px;background:linear-gradient(135deg,#1a1a1a,#333);display:flex;align-items:center;justify-content:center;font-size:4rem}
.card-body{padding:15px}
.card-title{font-weight:600;margin-bottom:5px}
.card-artist{font-size:.75rem;color:#888;margin-bottom:10px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{padding:3px 8px;background:#252525;border-radius:4px;font-size:.65rem;color:#888}
.btn{width:100%;padding:8px;border:none;border-radius:6px;cursor:pointer;background:#7c3aed;color:#fff;font-size:.875rem}
</style>
</head>
<body>
<div class="header"><h1>🎨 Design Gallery</h1><button class="btn" style="width:auto;padding:8px 16px" onclick="alert('Upload')">+ Upload</button></div>
<div class="tabs">
<div class="tab active">All</div>
<div class="tab">Traditional</div>
<div class="tab">Blackwork</div>
<div class="tab">Realism</div>
<div class="tab">Japanese</div>
<div class="tab">Geometric</div>
</div>
<div class="grid" id="grid"></div>
<script>
const designs=[
{icon:'🐉',name:'Dragon Sleeve',artist:'Mike Chen',style:'Japanese',tags:['Color','Large','Sleeve'],price:'$2000+'},
{icon:'🌹',name:'Rose & Dagger',artist:'Sarah Ink',style:'Traditional',tags:['Color','Medium','Arm'],price:'$350'},
{icon:'🦁',name:'Lion Portrait',artist:'Tom Black',style:'Realism',tags:['B&W','Large','Back'],price:'$1500+'},
{icon:'◆',name:'Sacred Geometry',artist:'Lisa Geo',style:'Geometric',tags:['B&W','Medium','Forearm'],price:'$450'},
{icon:'💀',name:'Skull Mandala',artist:'Mike Chen',style:'Blackwork',tags:['B&W','Large','Chest'],price:'$800'},
{icon:'🦋',name:'Butterfly Watercolor',artist:'Sarah Ink',style:'Watercolor',tags:['Color','Small','Shoulder'],price:'$300'}
];
document.getElementById('grid').innerHTML=designs.map(d=>`
<div class="card">
<div class="card-image">${d.icon}</div>
<div class="card-body">
<div class="card-title">${d.name}</div>
<div class="card-artist">by ${d.artist} • ${d.style}</div>
<div class="tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<button class="btn" onclick="alert('Book')">${d.price} • Book</button>
</div>
</div>`).join('');
</script>
</body>
</html>
