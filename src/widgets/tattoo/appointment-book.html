<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment Book - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"tattoo-appointments","name":"Tattoo Appointments","icon":"📅","desc":"Tattoo appointment scheduler","category":"tattoo","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#7c3aed}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.time{font-weight:600}
.artist{padding:4px 10px;background:#7c3aed33;color:#a78bfa;border-radius:4px;font-size:.75rem}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#7c3aed;color:#fff}
.actions{display:flex;gap:10px}
</style>
</head>
<body>
<div class="header"><h1>📅 Appointment Book</h1><button class="btn" onclick="alert('New')">+ Book</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">5</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">18</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">$4.2k</div><div class="stat-label">Booked</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Artists</div></div>
</div>
<div class="list" id="list"></div>
<script>
const appts=[
{time:'10:00 AM',duration:'3 hrs',client:'John D.',phone:'555-0101',design:'Dragon Sleeve',placement:'Left Arm',artist:'Mike',deposit:200,total:800,status:'confirmed'},
{time:'2:00 PM',duration:'2 hrs',client:'Sarah M.',phone:'555-0102',design:'Rose & Dagger',placement:'Forearm',artist:'Sarah',deposit:100,total:350,status:'confirmed'},
{time:'5:00 PM',duration:'1.5 hrs',client:'Emma W.',phone:'555-0103',design:'Custom Design',placement:'Shoulder',artist:'Tom',deposit:75,total:300,status:'pending'}
];
document.getElementById('list').innerHTML=appts.map(a=>`
<div class="card">
<div class="card-header"><span class="time">⏰ ${a.time} (${a.duration})</span><span class="artist">🎨 ${a.artist}</span></div>
<div class="info">
<div><div class="row"><span class="label">Client</span><span>${a.client}</span></div><div class="row"><span class="label">Design</span><span>${a.design}</span></div></div>
<div><div class="row"><span class="label">Placement</span><span>${a.placement}</span></div><div class="row"><span class="label">Total</span><span>$${a.total} (Dep: $${a.deposit})</span></div></div>
</div>
<div class="actions"><button class="btn" onclick="alert('Check In')">Check In</button><button class="btn" style="background:#333" onclick="alert('Reschedule')">Reschedule</button></div>
</div>`).join('');
</script>
</body>
</html>
