<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking Calendar - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"booking-calendar","name":"Booking Calendar","icon":"📅","desc":"Spa appointment calendar","category":"spa","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#d946ef}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.time{font-weight:600}
.therapist{padding:4px 10px;background:#d946ef33;color:#d946ef;border-radius:4px;font-size:.75rem}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#d946ef;color:#fff}
.actions{display:flex;gap:10px;margin-top:15px}
</style>
</head>
<body>
<div class="header"><h1>📅 Booking Calendar</h1><button class="btn" onclick="alert('New')">+ New Booking</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">12</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">Available</div></div>
<div class="stat"><div class="stat-value">$2.8k</div><div class="stat-label">Today's Rev</div></div>
<div class="stat"><div class="stat-value">4</div><div class="stat-label">Therapists</div></div>
</div>
<div class="list" id="list"></div>
<script>
const bookings=[
{time:'10:00 AM',client:'Sarah Johnson',treatment:'Swedish Massage',duration:'60 min',therapist:'Lisa',room:'Suite 1',price:95},
{time:'11:30 AM',client:'Mike Davis',treatment:'Deep Tissue',duration:'60 min',therapist:'Tom',room:'Suite 2',price:110},
{time:'1:00 PM',client:'Emma Wilson',treatment:'Hot Stone Massage',duration:'75 min',therapist:'Lisa',room:'Suite 1',price:125},
{time:'3:00 PM',client:'John Brown',treatment:'Signature Facial',duration:'50 min',therapist:'Amy',room:'Suite 3',price:85}
];
document.getElementById('list').innerHTML=bookings.map(b=>`
<div class="card">
<div class="card-header"><span class="time">⏰ ${b.time}</span><span class="therapist">👤 ${b.therapist}</span></div>
<div class="info">
<div><div class="row"><span class="label">Client</span><span>${b.client}</span></div><div class="row"><span class="label">Treatment</span><span>${b.treatment}</span></div></div>
<div><div class="row"><span class="label">Duration</span><span>${b.duration}</span></div><div class="row"><span class="label">Price</span><span>$${b.price}</span></div></div>
</div>
<div class="actions"><button class="btn" onclick="alert('Check In')">Check In</button><button class="btn" style="background:#333" onclick="alert('Reschedule')">Reschedule</button></div>
</div>`).join('');
</script>
</body>
</html>
