<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treatment Menu - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"treatment-menu","name":"Treatment Menu","icon":"💆","desc":"Spa treatment menu","category":"spa","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{padding:10px 20px;background:#1a1a1a;border:1px solid #333;border-radius:8px;cursor:pointer}
.tab.active{background:#d946ef33;border-color:#d946ef;color:#d946ef}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.card-image{height:100px;background:linear-gradient(135deg,#d946ef,#a855f7);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.card-body{padding:20px}
.card-title{font-weight:600;margin-bottom:8px}
.card-desc{font-size:.875rem;color:#888;margin-bottom:15px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.duration{font-size:.875rem;color:#888}
.price{font-size:1.25rem;font-weight:bold;color:#d946ef}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;background:#d946ef;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>💆 Treatment Menu</h1></div>
<div class="tabs">
<div class="tab active">Massage</div>
<div class="tab">Facial</div>
<div class="tab">Body</div>
<div class="tab">Packages</div>
</div>
<div class="grid" id="grid"></div>
<script>
const treatments=[
{icon:'💆',name:'Swedish Massage',desc:'Classic relaxation massage with light to medium pressure',duration:'60 min',price:95},
{icon:'🔥',name:'Hot Stone Massage',desc:'Heated stones placed on key points for deep relaxation',duration:'75 min',price:125},
{icon:'💪',name:'Deep Tissue',desc:'Intense massage targeting chronic muscle tension',duration:'60 min',price:110},
{icon:'🌿',name:'Aromatherapy',desc:'Essential oils combined with therapeutic massage',duration:'60 min',price:105},
{icon:'✨',name:'Signature Facial',desc:'Deep cleansing with custom mask and hydration',duration:'50 min',price:85},
{icon:'🧴',name:'Body Wrap',desc:'Detoxifying wrap with organic ingredients',duration:'60 min',price:120}
];
document.getElementById('grid').innerHTML=treatments.map(t=>`
<div class="card">
<div class="card-image">${t.icon}</div>
<div class="card-body">
<div class="card-title">${t.name}</div>
<div class="card-desc">${t.desc}</div>
<div class="meta"><span class="duration">⏱️ ${t.duration}</span><span class="price">$${t.price}</span></div>
<button class="btn" onclick="alert('Book')">Book Now</button>
</div>
</div>`).join('');
</script>
</body>
</html>
