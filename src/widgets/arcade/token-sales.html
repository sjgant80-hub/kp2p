<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Sales - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"token-sales","name":"Token Sales","icon":"🎰","desc":"Arcade token sales","category":"arcade","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#fbbf24}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.card.popular{border-color:#fbbf24}
.badge{position:absolute;top:-10px;right:-10px;padding:4px 8px;background:#fbbf24;color:#000;font-size:.65rem;border-radius:4px;font-weight:bold}
.card-icon{font-size:2.5rem;margin-bottom:10px}
.card-tokens{font-size:1.5rem;font-weight:bold;color:#fbbf24;margin-bottom:5px}
.card-price{font-size:1.25rem;margin-bottom:5px}
.card-bonus{font-size:.75rem;color:#22c55e;margin-bottom:15px}
.btn{width:100%;padding:12px;border:none;border-radius:6px;cursor:pointer;background:#fbbf24;color:#000;font-weight:600}
.recent{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.recent-title{font-weight:600;margin-bottom:15px}
.recent-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333}
</style>
</head>
<body>
<div class="header"><h1>🎰 Token Sales</h1></div>
<div class="stats">
<div class="stat"><div class="stat-value">$2.4k</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">12.5k</div><div class="stat-label">Tokens Sold</div></div>
<div class="stat"><div class="stat-value">145</div><div class="stat-label">Transactions</div></div>
<div class="stat"><div class="stat-value">$16.50</div><div class="stat-label">Avg Purchase</div></div>
</div>
<div class="grid">
<div class="card"><div class="card-icon">🪙</div><div class="card-tokens">20 Tokens</div><div class="card-price">$5.00</div><div class="card-bonus">&nbsp;</div><button class="btn">Buy</button></div>
<div class="card"><div class="card-icon">🪙🪙</div><div class="card-tokens">50 Tokens</div><div class="card-price">$10.00</div><div class="card-bonus">+5 Bonus!</div><button class="btn">Buy</button></div>
<div class="card popular" style="position:relative"><div class="badge">BEST VALUE</div><div class="card-icon">💰</div><div class="card-tokens">120 Tokens</div><div class="card-price">$20.00</div><div class="card-bonus">+20 Bonus!</div><button class="btn">Buy</button></div>
<div class="card"><div class="card-icon">💎</div><div class="card-tokens">300 Tokens</div><div class="card-price">$40.00</div><div class="card-bonus">+60 Bonus!</div><button class="btn">Buy</button></div>
</div>
<div class="recent">
<div class="recent-title">Recent Purchases</div>
<div class="recent-item"><span>120 Tokens</span><span>2 min ago</span><span>$20.00</span></div>
<div class="recent-item"><span>50 Tokens</span><span>8 min ago</span><span>$10.00</span></div>
<div class="recent-item"><span>300 Tokens</span><span>15 min ago</span><span>$40.00</span></div>
</div>
</body>
</html>
