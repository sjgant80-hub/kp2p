<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Supplies - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"party-supplies","name":"Party Supplies","icon":"🎉","desc":"Party rental inventory","category":"rental","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#06b6d4;color:#fff;border:none;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#06b6d4}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.tabs{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto}
.tab{padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab.active{background:#06b6d433;border-color:#06b6d4;color:#06b6d4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
.item{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.item-icon{font-size:2.5rem;margin-bottom:10px}
.item-name{font-weight:600;margin-bottom:5px}
.item-stock{font-size:.875rem;color:#888;margin-bottom:10px}
.item-price{font-size:1.25rem;font-weight:bold;color:#06b6d4;margin-bottom:10px}
.qty-control{display:flex;align-items:center;justify-content:center;gap:10px}
.qty-btn{width:30px;height:30px;border:1px solid #333;background:#252525;color:#e0e0e0;border-radius:4px;cursor:pointer}
.qty{font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1>🎉 Party Supplies</h1><button class="btn">New Order</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Events Today</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">$4.2k</div><div class="stat-label">Pending Revenue</div></div>
<div class="stat"><div class="stat-value">98%</div><div class="stat-label">Availability</div></div>
</div>
<div class="tabs">
<div class="tab active">All</div>
<div class="tab">Tables</div>
<div class="tab">Chairs</div>
<div class="tab">Linens</div>
<div class="tab">Tents</div>
<div class="tab">Decor</div>
</div>
<div class="grid" id="grid"></div>
<script>
const items=[
{name:'Round Tables 60"',icon:'🪑',stock:50,available:42,price:15},
{name:'Folding Chairs',icon:'🪑',stock:200,available:180,price:3},
{name:'White Linens',icon:'🧵',stock:100,available:85,price:8},
{name:'Party Tent 20x40',icon:'⛺',stock:5,available:3,price:350},
{name:'String Lights 100ft',icon:'💡',stock:30,available:28,price:25},
{name:'Chafing Dishes',icon:'🍲',stock:40,available:35,price:20},
{name:'Dance Floor Panels',icon:'💃',stock:60,available:60,price:12},
{name:'Cocktail Tables',icon:'🍸',stock:25,available:20,price:18}
];
document.getElementById('grid').innerHTML=items.map(i=>`
<div class="item">
<div class="item-icon">${i.icon}</div>
<div class="item-name">${i.name}</div>
<div class="item-stock">${i.available}/${i.stock} available</div>
<div class="item-price">$${i.price}/day</div>
<div class="qty-control"><button class="qty-btn">-</button><span class="qty">0</span><button class="qty-btn">+</button></div>
</div>`).join('');
</script>
</body>
</html>
