<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sailing Lessons - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"sailing-lessons","name":"Sailing Lessons","icon":"🎓","desc":"Schedule sailing lessons","category":"sailing","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0284c7;color:#fff;border:none;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0284c7}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.schedule{display:flex;flex-direction:column;gap:15px}
.lesson{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.lesson-time{text-align:center;background:#0284c720;padding:15px 20px;border-radius:8px}
.time{font-size:1.25rem;font-weight:bold;color:#0284c7}
.duration{font-size:.75rem;color:#888;margin-top:5px}
.lesson-info{flex:1}
.lesson-title{font-weight:600;font-size:1.125rem;margin-bottom:5px}
.lesson-desc{font-size:.875rem;color:#888;margin-bottom:10px}
.lesson-meta{display:flex;gap:15px;font-size:.75rem}
.meta-item{display:flex;align-items:center;gap:5px}
.lesson-spots{text-align:right}
.spots-count{font-size:1.5rem;font-weight:bold;color:#22c55e}
.spots-label{font-size:.75rem;color:#888}
.spots-full{color:#ef4444}
</style>
</head>
<body>
<div class="header"><h1>🎓 Sailing Lessons</h1><button class="btn">+ Book Lesson</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">6</div><div class="stat-label">Classes Today</div></div>
<div class="stat"><div class="stat-value">24</div><div class="stat-label">Students</div></div>
<div class="stat"><div class="stat-value">4</div><div class="stat-label">Instructors</div></div>
<div class="stat"><div class="stat-value">$1.8k</div><div class="stat-label">Today's Revenue</div></div>
</div>
<div class="schedule" id="schedule"></div>
<script>
const lessons=[
{time:'9:00 AM',duration:'2 hrs',title:'Basic Sailing - Beginners',desc:'Learn fundamentals: points of sail, tacking, jibing',instructor:'Capt. Mike',boat:'Catalina 22',max:4,enrolled:3},
{time:'11:00 AM',duration:'3 hrs',title:'Intermediate Racing',desc:'Racing tactics, mark rounding, spinnaker handling',instructor:'Capt. Sarah',boat:'J/24',max:5,enrolled:5},
{time:'2:00 PM',duration:'2 hrs',title:'Youth Sailing Camp',desc:'Ages 8-14: Fun introduction to sailing basics',instructor:'Jake',boat:'Optimist Fleet',max:8,enrolled:6},
{time:'4:00 PM',duration:'2 hrs',title:'Women\'s Sailing',desc:'Supportive environment for women learning to sail',instructor:'Capt. Lisa',boat:'Hunter 27',max:4,enrolled:2},
{time:'6:00 PM',duration:'2 hrs',title:'Sunset Cruise Training',desc:'Navigation lights, night sailing basics',instructor:'Capt. Mike',boat:'Beneteau 40',max:6,enrolled:4}
];
document.getElementById('schedule').innerHTML=lessons.map(l=>`
<div class="lesson">
<div class="lesson-time"><div class="time">${l.time}</div><div class="duration">${l.duration}</div></div>
<div class="lesson-info">
<div class="lesson-title">${l.title}</div>
<div class="lesson-desc">${l.desc}</div>
<div class="lesson-meta">
<span class="meta-item">👤 ${l.instructor}</span>
<span class="meta-item">⛵ ${l.boat}</span>
</div>
</div>
<div class="lesson-spots"><div class="spots-count ${l.enrolled>=l.max?'spots-full':''}">${l.max-l.enrolled}</div><div class="spots-label">${l.enrolled>=l.max?'Full':'spots left'}</div></div>
</div>`).join('');
</script>
</body>
</html>
