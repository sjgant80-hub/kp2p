*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}

.tank{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.tank-header{display:flex;justify-content:space-between;margin-bottom:15px}
.tank-name{font-weight:600}
.tank-price{color:#0ea5e9}
.tank-bar{height:100px;background:#333;border-radius:8px;position:relative;overflow:hidden}
.tank-fill{position:absolute;bottom:0;left:0;right:0;background:#0ea5e9}
.tank-level{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:bold}
.tank-capacity{font-size:.75rem;color:#888;margin-top:10px;text-align:center}
.list{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.list-title{font-weight:600;margin-bottom:15px}
.sale{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333}
</style>
</head>
