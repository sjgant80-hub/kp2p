<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wine Tastings - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"wine-tastings","name":"Wine Tastings","icon":"🍷","desc":"Book tasting sessions","category":"winery","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#7c2d12;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.featured{background:linear-gradient(135deg,#7c2d12 0%,#9a3412 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.featured-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.featured-title{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.featured-info{display:flex;gap:20px;font-size:.875rem;opacity:.9}
.tastings{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.tasting{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.tasting-header{padding:20px;background:#252525}
.tasting-name{font-size:1.125rem;font-weight:bold;margin-bottom:5px}
.tasting-type{font-size:.75rem;color:#7c2d12}
.tasting-body{padding:20px}
.tasting-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.tasting-wines{margin-bottom:15px}
.wine-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.875rem}
.tasting-footer{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #333}
.tasting-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.book-btn{padding:8px 20px;background:#7c2d12;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>🍷 Wine Tastings</h1><button class="btn">My Reservations</button></div>
<div class="featured">
<div class="featured-label">SIGNATURE EXPERIENCE</div>
<div class="featured-title">Sunset Terrace Tasting</div>
<div class="featured-info">
<span>🍷 6 Premium Wines</span>
<span>🧀 Artisan Cheese Pairing</span>
<span>⏱️ 90 minutes</span>
</div>
</div>
<div class="tastings" id="tastings"></div>
<script>
const tastings=[
{name:'Classic Estate Tasting',type:'INTRODUCTORY',desc:'Sample our award-winning estate wines with guided tasting notes.',wines:['Chardonnay','Pinot Noir','Cabernet','Merlot'],duration:45,price:35,spots:8},
{name:'Reserve Collection',type:'PREMIUM',desc:'Explore our limited production and library wines.',wines:['Reserve Cab','Aged Pinot','Vintage Port','Estate Blend'],duration:60,price:65,spots:6},
{name:'Winemaker Experience',type:'EXCLUSIVE',desc:'Private tasting with our head winemaker in the barrel room.',wines:['Barrel Samples','New Releases','Rare Vintages'],duration:90,price:125,spots:4},
{name:'Flight & Bites',type:'PAIRING',desc:'Wine flights paired with locally-sourced small plates.',wines:['White Flight','Red Flight','Dessert Wine'],duration:75,price:85,spots:10}
];
document.getElementById('tastings').innerHTML=tastings.map(t=>`
<div class="tasting">
<div class="tasting-header">
<div class="tasting-name">${t.name}</div>
<div class="tasting-type">${t.type}</div>
</div>
<div class="tasting-body">
<div class="tasting-desc">${t.desc}</div>
<div class="tasting-wines">${t.wines.map(w=>`<div class="wine-item">🍷 ${w}</div>`).join('')}</div>
<div class="tasting-footer">
<div>
<div class="tasting-price">$${t.price}</div>
<div style="font-size:.75rem;color:#888">${t.duration} min • ${t.spots} spots left</div>
</div>
<button class="book-btn">Book Now</button>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
