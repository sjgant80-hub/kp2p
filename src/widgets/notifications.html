<!DOCTYPE html>
<!--
KONOMI NOTIFICATIONS - Free OneSignal/Pusher Killer
In-app notifications. P2P sync. $0 forever.

Usage:
Embed: <iframe src="notifications.html?app=myapp&user=user123">
Admin: ?app=myapp&admin=true
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "notifications",
    "name": "Notifications",
    "icon": "🔔",
    "desc": "In-app notification system",
    "body": "OneSignal/Pusher killer. In-app notifications with P2P sync. Bell widget and admin dashboard.",
    "kills": ["OneSignal $12/mo", "Pusher $49/mo", "Push notification services"],
    "price": 49,
    "color": "#f59e0b"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --primary: #f59e0b;
      --bg: #fff;
      --surface: #f9fafb;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --surface: #1a1a1a;
        --border: #333;
        --text: #f9fafb;
        --text-muted: #9ca3af;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Notification Bell (Embed Mode) */
    .bell-container {
      position: relative;
      display: inline-block;
    }

    .bell-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bell-btn:hover {
      background: var(--border);
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 600;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .badge.hidden { display: none; }

    /* Dropdown */
    .dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      width: 360px;
      max-height: 480px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      margin-top: 8px;
      display: none;
      overflow: hidden;
      z-index: 1000;
    }

    .dropdown.active { display: block; }

    .dropdown-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-header h3 {
      font-size: 16px;
    }

    .mark-read-btn {
      font-size: 12px;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
    }

    .notifications-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .notification {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .notification:hover {
      background: var(--surface);
    }

    .notification.unread {
      background: rgba(245, 158, 11, 0.05);
    }

    .notification-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .notification-body {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notification-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .notification-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .notification:not(.unread) .notification-dot {
      visibility: hidden;
    }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Admin Panel */
    .admin-panel {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    .admin-panel h1 {
      font-size: 24px;
      margin-bottom: 24px;
    }

    .send-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .send-form h2 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group { flex: 1; }

    .send-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #d97706;
    }

    .history {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .history h2 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .history-item {
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .history-item-title {
      font-weight: 600;
      font-size: 14px;
    }

    .history-item-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .history-item-body {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2000;
    }

    .toast {
      padding: 16px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: slideIn 0.3s ease;
      max-width: 360px;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast-icon {
      font-size: 24px;
    }

    .toast-content h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .toast-content p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .toast-close {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
      margin-left: auto;
    }
  </style>
</head>
<body>
  <!-- Bell Mode (default) -->
  <div class="bell-container" id="bell-container">
    <button class="bell-btn" id="bell-btn">
      🔔
      <span class="badge hidden" id="badge">0</span>
    </button>
    <div class="dropdown" id="dropdown">
      <div class="dropdown-header">
        <h3>Notifications</h3>
        <button class="mark-read-btn" id="mark-read-btn">Mark all read</button>
      </div>
      <div class="notifications-list" id="notifications-list"></div>
    </div>
  </div>

  <!-- Admin Mode -->
  <div class="admin-panel" id="admin-panel" style="display:none;">
    <h1>🔔 Notification Admin</h1>

    <div class="send-form">
      <h2>Send Notification</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="notif-title" placeholder="Notification title">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="notif-body" rows="3" placeholder="Notification message..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Icon</label>
          <input type="text" id="notif-icon" placeholder="🔔" maxlength="2">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="notif-type">
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="error">Error</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Link (optional)</label>
        <input type="url" id="notif-link" placeholder="https://...">
      </div>
      <button class="send-btn" id="send-btn">Send Notification</button>
    </div>

    <div class="history">
      <h2>Sent History</h2>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const APP_ID = params.get('app') || 'default';
    const USER_ID = params.get('user') || 'anonymous';
    const IS_ADMIN = params.get('admin') === 'true';
    const STORAGE_KEY = `konomi-notifications:${APP_ID}`;

    let notifications = [];
    let channel = null;

    function loadNotifications() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) notifications = JSON.parse(stored);
      } catch (e) {}
    }

    function saveNotifications() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notifications));
    }

    function initP2P() {
      channel = new BroadcastChannel(`konomi-notifications:${APP_ID}`);

      channel.onmessage = (e) => {
        if (e.data.type === 'notification') {
          const notif = e.data.notification;
          if (!notifications.find(n => n.id === notif.id)) {
            notifications.unshift(notif);
            saveNotifications();
            render();
            showToast(notif);
          }
        } else if (e.data.type === 'mark-read') {
          notifications.forEach(n => n.read = true);
          saveNotifications();
          render();
        }
      };
    }

    function render() {
      const unreadCount = notifications.filter(n => !n.read).length;
      const badge = document.getElementById('badge');
      badge.textContent = unreadCount;
      badge.classList.toggle('hidden', unreadCount === 0);

      const listEl = document.getElementById('notifications-list');

      if (notifications.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔔</div>
            <p>No notifications yet</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = notifications.slice(0, 50).map(n => `
        <div class="notification ${n.read ? '' : 'unread'}" data-id="${n.id}" ${n.link ? `data-link="${escapeHtml(n.link)}"` : ''}>
          <div class="notification-icon">${n.icon || '🔔'}</div>
          <div class="notification-content">
            <div class="notification-title">${escapeHtml(n.title)}</div>
            <div class="notification-body">${escapeHtml(n.body)}</div>
            <div class="notification-time">${formatTime(n.timestamp)}</div>
          </div>
          <div class="notification-dot"></div>
        </div>
      `).join('');

      listEl.querySelectorAll('.notification').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          const notif = notifications.find(n => n.id === id);
          if (notif) {
            notif.read = true;
            saveNotifications();
            render();
          }
          if (el.dataset.link) {
            window.open(el.dataset.link, '_blank');
          }
        });
      });

      if (IS_ADMIN) renderHistory();
    }

    function renderHistory() {
      const historyEl = document.getElementById('history-list');
      if (notifications.length === 0) {
        historyEl.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">No notifications sent yet</p>';
        return;
      }

      historyEl.innerHTML = notifications.slice(0, 20).map(n => `
        <div class="history-item">
          <div class="history-item-header">
            <span class="history-item-title">${n.icon || '🔔'} ${escapeHtml(n.title)}</span>
            <span class="history-item-time">${formatTime(n.timestamp)}</span>
          </div>
          <div class="history-item-body">${escapeHtml(n.body)}</div>
        </div>
      `).join('');
    }

    function sendNotification(title, body, icon, type, link) {
      const notif = {
        id: crypto.randomUUID(),
        title,
        body,
        icon: icon || getIconForType(type),
        type,
        link: link || null,
        read: false,
        timestamp: Date.now()
      };

      notifications.unshift(notif);
      saveNotifications();
      render();

      channel.postMessage({ type: 'notification', notification: notif });
    }

    function getIconForType(type) {
      const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
      return icons[type] || '🔔';
    }

    function showToast(notif) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <span class="toast-icon">${notif.icon || '🔔'}</span>
        <div class="toast-content">
          <h4>${escapeHtml(notif.title)}</h4>
          <p>${escapeHtml(notif.body)}</p>
        </div>
        <button class="toast-close">×</button>
      `;

      toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());

      if (notif.link) {
        toast.style.cursor = 'pointer';
        toast.addEventListener('click', (e) => {
          if (!e.target.classList.contains('toast-close')) {
            window.open(notif.link, '_blank');
          }
        });
      }

      container.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    function formatTime(timestamp) {
      const diff = Date.now() - timestamp;
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
      return new Date(timestamp).toLocaleDateString();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // Bell toggle
    document.getElementById('bell-btn').addEventListener('click', () => {
      document.getElementById('dropdown').classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.bell-container')) {
        document.getElementById('dropdown').classList.remove('active');
      }
    });

    document.getElementById('mark-read-btn').addEventListener('click', () => {
      notifications.forEach(n => n.read = true);
      saveNotifications();
      render();
      channel.postMessage({ type: 'mark-read' });
    });

    // Admin mode
    if (IS_ADMIN) {
      document.getElementById('bell-container').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';

      document.getElementById('send-btn').addEventListener('click', () => {
        const title = document.getElementById('notif-title').value.trim();
        const body = document.getElementById('notif-body').value.trim();
        const icon = document.getElementById('notif-icon').value;
        const type = document.getElementById('notif-type').value;
        const link = document.getElementById('notif-link').value.trim();

        if (!title || !body) {
          alert('Please enter a title and message');
          return;
        }

        sendNotification(title, body, icon, type, link);

        document.getElementById('notif-title').value = '';
        document.getElementById('notif-body').value = '';
        document.getElementById('notif-icon').value = '';
        document.getElementById('notif-link').value = '';
      });
    }

    // Init
    loadNotifications();
    initP2P();
    render();

    window.KonomiNotifications = {
      send: sendNotification,
      getAll: () => notifications,
      getUnreadCount: () => notifications.filter(n => !n.read).length
    };
  </script>
</body>
</html>
