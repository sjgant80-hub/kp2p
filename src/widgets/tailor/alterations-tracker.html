<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alterations Tracker - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"alterations-tracker","name":"Alterations Tracker","icon":"🧵","desc":"Track tailoring alterations","category":"tailor","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#f472b6;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#f472b6}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:10px}
.order{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.order-id{font-weight:600}
.status{padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:600}
.status.pending{background:#f59e0b33;color:#f59e0b}
.status.progress{background:#3b82f633;color:#3b82f6}
.status.ready{background:#22c55e33;color:#22c55e}
.order-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:15px}
.detail{display:flex;flex-direction:column}
.detail-label{font-size:.75rem;color:#888}
.detail-value{margin-top:2px}
.alterations{display:flex;flex-wrap:wrap;gap:8px}
.alteration{padding:6px 12px;background:#f472b620;color:#f472b6;border-radius:6px;font-size:.75rem}
.order-footer{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #333}
.price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.actions button{padding:8px 15px;background:#252525;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer;margin-left:10px}
</style>
</head>
<body>
<div class="header"><h1>🧵 Alterations Tracker</h1><button class="btn">+ New Order</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">18</div><div class="stat-label">Active Orders</div></div>
<div class="stat"><div class="stat-value">5</div><div class="stat-label">Ready Pickup</div></div>
<div class="stat"><div class="stat-value">3d</div><div class="stat-label">Avg Turnaround</div></div>
<div class="stat"><div class="stat-value">$890</div><div class="stat-label">This Week</div></div>
</div>
<div class="list" id="list"></div>
<script>
const orders=[
{id:'ALT-1247',customer:'Jennifer Smith',item:'Wedding Dress',status:'progress',date:'Dec 28',pickup:'Jan 2',alterations:['Hem','Take in waist','Bustle'],price:185},
{id:'ALT-1246',customer:'Michael Johnson',item:'Suit Jacket',status:'ready',date:'Dec 24',pickup:'Dec 27',alterations:['Shorten sleeves','Take in sides'],price:65},
{id:'ALT-1245',customer:'Sarah Davis',item:'Evening Gown',status:'pending',date:'Dec 27',pickup:'Dec 31',alterations:['Hem','Add straps','Take in bust'],price:120},
{id:'ALT-1244',customer:'David Chen',item:'Dress Pants (3)',status:'progress',date:'Dec 26',pickup:'Dec 30',alterations:['Hem x3','Taper legs'],price:90},
{id:'ALT-1243',customer:'Emily Wilson',item:'Bridesmaid Dress',status:'ready',date:'Dec 23',pickup:'Dec 27',alterations:['Hem','Adjust straps'],price:55}
];
document.getElementById('list').innerHTML=orders.map(o=>`
<div class="order">
<div class="order-header"><span class="order-id">${o.id}</span><span class="status ${o.status}">${o.status==='pending'?'Pending':o.status==='progress'?'In Progress':'Ready'}</span></div>
<div class="order-details">
<div class="detail"><span class="detail-label">Customer</span><span class="detail-value">👤 ${o.customer}</span></div>
<div class="detail"><span class="detail-label">Item</span><span class="detail-value">👗 ${o.item}</span></div>
<div class="detail"><span class="detail-label">Drop-off</span><span class="detail-value">📅 ${o.date}</span></div>
<div class="detail"><span class="detail-label">Pickup</span><span class="detail-value">📅 ${o.pickup}</span></div>
</div>
<div class="alterations">${o.alterations.map(a=>`<span class="alteration">${a}</span>`).join('')}</div>
<div class="order-footer"><span class="price">$${o.price}</span><div class="actions"><button>View</button><button>Mark Complete</button></div></div>
</div>`).join('');
</script>
</body>
</html>
