<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measurements - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"measurements","name":"Measurements","icon":"📏","desc":"Client measurement records","category":"tailor","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#f472b6;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.search{padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;width:100%;margin-bottom:20px}
.client-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:25px;margin-bottom:20px}
.client-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.client-info{display:flex;align-items:center;gap:15px}
.client-avatar{width:50px;height:50px;background:#f472b6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.client-name{font-size:1.25rem;font-weight:bold}
.client-meta{font-size:.875rem;color:#888}
.measurements{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.measurement{background:#252525;padding:15px;border-radius:8px;text-align:center}
.measurement-value{font-size:1.5rem;font-weight:bold;color:#f472b6}
.measurement-label{font-size:.75rem;color:#888;margin-top:5px}
.measurement-unit{font-size:.875rem;color:#888}
.section-title{font-weight:600;margin:20px 0 15px;color:#f472b6;display:flex;align-items:center;gap:10px}
.notes{background:#252525;padding:15px;border-radius:8px;font-size:.875rem;color:#888;margin-top:15px}
</style>
</head>
<body>
<div class="header"><h1>📏 Measurements</h1><button class="btn">+ New Client</button></div>
<input type="text" class="search" placeholder="🔍 Search clients...">
<div class="client-card">
<div class="client-header">
<div class="client-info">
<div class="client-avatar">👔</div>
<div><div class="client-name">Michael Johnson</div><div class="client-meta">Last updated: Dec 15, 2024</div></div>
</div>
<button class="btn" style="background:#252525;color:#e0e0e0">Edit</button>
</div>
<div class="section-title">📐 Upper Body</div>
<div class="measurements">
<div class="measurement"><div class="measurement-value">42<span class="measurement-unit">"</span></div><div class="measurement-label">Chest</div></div>
<div class="measurement"><div class="measurement-value">17<span class="measurement-unit">"</span></div><div class="measurement-label">Neck</div></div>
<div class="measurement"><div class="measurement-value">19<span class="measurement-unit">"</span></div><div class="measurement-label">Shoulders</div></div>
<div class="measurement"><div class="measurement-value">34<span class="measurement-unit">"</span></div><div class="measurement-label">Sleeve</div></div>
<div class="measurement"><div class="measurement-value">36<span class="measurement-unit">"</span></div><div class="measurement-label">Waist</div></div>
</div>
<div class="section-title">👖 Lower Body</div>
<div class="measurements">
<div class="measurement"><div class="measurement-value">32<span class="measurement-unit">"</span></div><div class="measurement-label">Inseam</div></div>
<div class="measurement"><div class="measurement-value">38<span class="measurement-unit">"</span></div><div class="measurement-label">Hips</div></div>
<div class="measurement"><div class="measurement-value">24<span class="measurement-unit">"</span></div><div class="measurement-label">Thigh</div></div>
<div class="measurement"><div class="measurement-value">10<span class="measurement-unit">"</span></div><div class="measurement-label">Rise</div></div>
</div>
<div class="notes">📝 Notes: Prefers slim fit. Right shoulder slightly higher - adjust accordingly. Uses French cuffs for dress shirts.</div>
</div>
</body>
</html>
