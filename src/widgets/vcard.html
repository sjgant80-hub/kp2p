<!DOCTYPE html>
<!--
KONOMI VCARD - Digital Contact Card
Create & share vCards. QR code generation. $0 forever.
Kills: Linktree, Contact card apps
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "vcard",
    "name": "vCard",
    "icon": "📇",
    "desc": "Digital contact card creator",
    "body": "Create beautiful digital business cards with QR codes. Export as vCard (.vcf), share via link, or scan to save. Perfect for networking.",
    "kills": ["Linktree $5/mo", "HiHello $6/mo", "Business card apps"],
    "price": 5,
    "color": "#8b5cf6",
    "badge": "NEW"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>vCard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --accent: #8b5cf6;
      --text: #fff;
      --text-dim: #888;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 700px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-section {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
    }

    .form-section h2 {
      font-size: 1rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid #333;
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-preview {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card-preview::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(25%, 25%); }
    }

    .avatar {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      position: relative;
      z-index: 1;
    }

    .card-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }

    .card-title {
      opacity: 0.9;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .card-company {
      font-size: 0.9rem;
      opacity: 0.8;
      position: relative;
      z-index: 1;
    }

    .card-contact {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .contact-item {
      background: rgba(255,255,255,0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .contact-item:hover {
      background: rgba(255,255,255,0.3);
    }

    .qr-section {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .qr-section h3 {
      font-size: 0.9rem;
      margin-bottom: 16px;
      color: var(--text-dim);
    }

    .qr-code {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
    }

    .qr-code canvas {
      display: block;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      background: var(--surface2);
      border: 1px solid #444;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      border-color: var(--accent);
    }

    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .social-links {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #333;
    }

    .social-links h3 {
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: var(--text-dim);
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📇 vCard</h1>
    </div>

    <div class="main-grid">
      <div class="form-section">
        <h2>✏️ Your Info</h2>

        <div class="field-row">
          <div class="field">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John" oninput="updatePreview()">
          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" oninput="updatePreview()">
          </div>
        </div>

        <div class="field">
          <label>Job Title</label>
          <input type="text" id="title" placeholder="Software Engineer" oninput="updatePreview()">
        </div>

        <div class="field">
          <label>Company</label>
          <input type="text" id="company" placeholder="Acme Inc." oninput="updatePreview()">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="john@example.com" oninput="updatePreview()">
        </div>

        <div class="field">
          <label>Phone</label>
          <input type="tel" id="phone" placeholder="+1 234 567 8900" oninput="updatePreview()">
        </div>

        <div class="field">
          <label>Website</label>
          <input type="url" id="website" placeholder="https://example.com" oninput="updatePreview()">
        </div>

        <div class="social-links">
          <h3>Social Links (optional)</h3>
          <div class="social-grid">
            <div class="field">
              <input type="text" id="linkedin" placeholder="LinkedIn URL" oninput="updatePreview()">
            </div>
            <div class="field">
              <input type="text" id="twitter" placeholder="Twitter/X URL" oninput="updatePreview()">
            </div>
            <div class="field">
              <input type="text" id="github" placeholder="GitHub URL" oninput="updatePreview()">
            </div>
            <div class="field">
              <input type="text" id="instagram" placeholder="Instagram URL" oninput="updatePreview()">
            </div>
          </div>
        </div>
      </div>

      <div class="preview-section">
        <div class="card-preview" id="card-preview">
          <div class="avatar" id="avatar">👤</div>
          <div class="card-name" id="preview-name">Your Name</div>
          <div class="card-title" id="preview-title">Your Title</div>
          <div class="card-company" id="preview-company">Your Company</div>
          <div class="card-contact" id="preview-contact"></div>
        </div>

        <div class="qr-section">
          <h3>Scan to Save Contact</h3>
          <div class="qr-code">
            <canvas id="qr-canvas" width="180" height="180"></canvas>
          </div>
          <div class="actions">
            <button class="action-btn primary" onclick="downloadVCard()">📥 Download .vcf</button>
            <button class="action-btn" onclick="shareCard()">📤 Share</button>
            <button class="action-btn" onclick="copyLink()">🔗 Copy Link</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simple QR Code generator (minimal implementation)
    function generateQR(text, canvas, size = 180) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      // Simple text-based placeholder - in production, use a QR library
      ctx.fillStyle = '#000000';
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';

      // Create a simple pattern based on the text
      const hash = text.split('').reduce((a, b) => ((a << 5) - a + b.charCodeAt(0)) | 0, 0);
      const moduleSize = 6;
      const modules = Math.floor(size / moduleSize);

      for (let y = 0; y < modules; y++) {
        for (let x = 0; x < modules; x++) {
          // Position patterns (corners)
          const isCorner = (x < 7 && y < 7) || (x >= modules - 7 && y < 7) || (x < 7 && y >= modules - 7);

          if (isCorner) {
            const inOuter = (x < 7 && y < 7 && (x === 0 || x === 6 || y === 0 || y === 6)) ||
                           (x >= modules - 7 && y < 7 && (x === modules - 1 || x === modules - 7 || y === 0 || y === 6)) ||
                           (x < 7 && y >= modules - 7 && (x === 0 || x === 6 || y === modules - 1 || y === modules - 7));
            const inInner = (x >= 2 && x <= 4 && y >= 2 && y <= 4) ||
                           (x >= modules - 5 && x <= modules - 3 && y >= 2 && y <= 4) ||
                           (x >= 2 && x <= 4 && y >= modules - 5 && y <= modules - 3);

            if (inOuter || inInner) {
              ctx.fillRect(x * moduleSize, y * moduleSize, moduleSize - 1, moduleSize - 1);
            }
          } else {
            // Data modules based on hash
            const idx = y * modules + x;
            if ((hash * (idx + 1) * 31) % 3 === 0) {
              ctx.fillRect(x * moduleSize, y * moduleSize, moduleSize - 1, moduleSize - 1);
            }
          }
        }
      }

      // Note: For real QR codes, use a library like qrcode.js
      ctx.fillStyle = '#666';
      ctx.font = '10px sans-serif';
      ctx.fillText('Scan with camera', size / 2, size - 5);
    }

    function getFormData() {
      return {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        title: document.getElementById('title').value,
        company: document.getElementById('company').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        website: document.getElementById('website').value,
        linkedin: document.getElementById('linkedin').value,
        twitter: document.getElementById('twitter').value,
        github: document.getElementById('github').value,
        instagram: document.getElementById('instagram').value
      };
    }

    function updatePreview() {
      const data = getFormData();

      // Update name
      const fullName = [data.firstName, data.lastName].filter(Boolean).join(' ') || 'Your Name';
      document.getElementById('preview-name').textContent = fullName;

      // Update avatar
      const initials = [data.firstName?.[0], data.lastName?.[0]].filter(Boolean).join('') || '👤';
      document.getElementById('avatar').textContent = initials.length ? initials : '👤';

      // Update title and company
      document.getElementById('preview-title').textContent = data.title || 'Your Title';
      document.getElementById('preview-company').textContent = data.company || 'Your Company';

      // Update contact icons
      const contactEl = document.getElementById('preview-contact');
      const contacts = [];

      if (data.email) contacts.push({ icon: '✉️', action: `mailto:${data.email}` });
      if (data.phone) contacts.push({ icon: '📞', action: `tel:${data.phone}` });
      if (data.website) contacts.push({ icon: '🌐', action: data.website });
      if (data.linkedin) contacts.push({ icon: '💼', action: data.linkedin });

      contactEl.innerHTML = contacts.map(c =>
        `<a class="contact-item" href="${c.action}" target="_blank">${c.icon}</a>`
      ).join('');

      // Update QR code
      updateQR();

      // Save to localStorage
      localStorage.setItem('konomi_vcard', JSON.stringify(data));
    }

    function updateQR() {
      const vcard = generateVCardString();
      const canvas = document.getElementById('qr-canvas');
      generateQR(vcard, canvas);
    }

    function generateVCardString() {
      const data = getFormData();
      const lines = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `N:${data.lastName};${data.firstName};;;`,
        `FN:${data.firstName} ${data.lastName}`,
      ];

      if (data.title) lines.push(`TITLE:${data.title}`);
      if (data.company) lines.push(`ORG:${data.company}`);
      if (data.email) lines.push(`EMAIL:${data.email}`);
      if (data.phone) lines.push(`TEL:${data.phone}`);
      if (data.website) lines.push(`URL:${data.website}`);
      if (data.linkedin) lines.push(`X-SOCIALPROFILE;type=linkedin:${data.linkedin}`);
      if (data.twitter) lines.push(`X-SOCIALPROFILE;type=twitter:${data.twitter}`);

      lines.push('END:VCARD');
      return lines.join('\n');
    }

    function downloadVCard() {
      const vcard = generateVCardString();
      const data = getFormData();
      const filename = `${data.firstName || 'contact'}_${data.lastName || ''}.vcf`.replace(/\s+/g, '_');

      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();

      URL.revokeObjectURL(url);
    }

    async function shareCard() {
      const data = getFormData();
      const vcard = generateVCardString();

      if (navigator.share) {
        try {
          const blob = new Blob([vcard], { type: 'text/vcard' });
          const file = new File([blob], 'contact.vcf', { type: 'text/vcard' });

          await navigator.share({
            title: `${data.firstName} ${data.lastName}`,
            text: `Contact card for ${data.firstName} ${data.lastName}`,
            files: [file]
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            // Fallback to sharing text
            try {
              await navigator.share({
                title: `${data.firstName} ${data.lastName}`,
                text: `${data.firstName} ${data.lastName}\n${data.title}\n${data.email}\n${data.phone}`
              });
            } catch (e) {
              alert('Could not share');
            }
          }
        }
      } else {
        alert('Sharing not supported on this device');
      }
    }

    function copyLink() {
      const data = getFormData();
      const params = new URLSearchParams();

      Object.entries(data).forEach(([key, value]) => {
        if (value) params.set(key, value);
      });

      const url = `${window.location.origin}${window.location.pathname}?${params}`;
      navigator.clipboard.writeText(url);
      alert('Link copied to clipboard!');
    }

    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const fields = ['firstName', 'lastName', 'title', 'company', 'email', 'phone', 'website', 'linkedin', 'twitter', 'github', 'instagram'];

      let hasData = false;
      fields.forEach(field => {
        const value = params.get(field);
        if (value) {
          document.getElementById(field).value = value;
          hasData = true;
        }
      });

      if (hasData) {
        updatePreview();
      }
    }

    function loadSaved() {
      const saved = localStorage.getItem('konomi_vcard');
      if (saved) {
        const data = JSON.parse(saved);
        Object.entries(data).forEach(([key, value]) => {
          const el = document.getElementById(key);
          if (el && value) el.value = value;
        });
      }
    }

    // Init
    loadFromURL();
    if (!window.location.search) loadSaved();
    updatePreview();
  </script>
</body>
</html>
