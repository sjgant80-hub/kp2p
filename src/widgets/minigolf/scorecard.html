<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Golf Scorecard - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"minigolf-scorecard","name":"Mini Golf Scorecard","icon":"📝","desc":"Track mini golf scores","category":"minigolf","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.game-info{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;margin-bottom:20px}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.course-name{font-size:1.25rem;font-weight:bold}
.game-status{padding:6px 12px;background:#10b98133;color:#10b981;border-radius:6px;font-size:.875rem}
.players{display:flex;gap:15px;flex-wrap:wrap}
.player{display:flex;align-items:center;gap:10px;padding:10px 15px;background:#252525;border-radius:8px}
.player-color{width:16px;height:16px;border-radius:50%}
.player-score{font-weight:bold;color:#10b981;margin-left:10px}
.scorecard{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow-x:auto}
.scorecard table{width:100%;border-collapse:collapse;min-width:700px}
.scorecard th,.scorecard td{padding:12px 8px;text-align:center;border-bottom:1px solid #333}
.scorecard th{background:#252525;font-size:.75rem;color:#888}
.scorecard .hole{font-weight:bold;color:#10b981}
.scorecard .par{color:#888}
.score-cell{font-weight:bold}
.score-cell.ace{background:#10b98133;color:#10b981}
.score-cell.under{color:#22c55e}
.score-cell.over{color:#ef4444}
.totals{background:#252525}
.totals td{font-weight:bold}
.current-hole{background:#10b98122}
</style>
</head>
<body>
<div class="header"><h1>📝 Scorecard</h1><button class="btn">End Game</button></div>
<div class="game-info">
<div class="game-header">
<div class="course-name">⛳ Pirate's Cove - 18 Holes</div>
<div class="game-status">Hole 12 of 18</div>
</div>
<div class="players">
<div class="player"><div class="player-color" style="background:#ef4444"></div><span>Dad</span><span class="player-score">-2</span></div>
<div class="player"><div class="player-color" style="background:#3b82f6"></div><span>Mom</span><span class="player-score">+1</span></div>
<div class="player"><div class="player-color" style="background:#22c55e"></div><span>Jake</span><span class="player-score">+4</span></div>
<div class="player"><div class="player-color" style="background:#f59e0b"></div><span>Emma</span><span class="player-score">+6</span></div>
</div>
</div>
<div class="scorecard">
<table>
<tr><th>Hole</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>OUT</th><th>10</th><th>11</th><th class="current-hole">12</th><th>IN</th><th>TOT</th></tr>
<tr><td class="hole">Par</td><td class="par">3</td><td class="par">3</td><td class="par">2</td><td class="par">3</td><td class="par">4</td><td class="par">3</td><td class="par">2</td><td class="par">3</td><td class="par">4</td><td class="par">27</td><td class="par">3</td><td class="par">3</td><td class="par current-hole">3</td><td class="par">—</td><td class="par">54</td></tr>
<tr><td style="color:#ef4444">Dad</td><td class="score-cell under">2</td><td class="score-cell">3</td><td class="score-cell ace">1</td><td class="score-cell">3</td><td class="score-cell">4</td><td class="score-cell under">2</td><td class="score-cell">2</td><td class="score-cell over">4</td><td class="score-cell">4</td><td>25</td><td class="score-cell under">2</td><td class="score-cell">3</td><td class="score-cell current-hole">—</td><td>5</td><td>30</td></tr>
<tr><td style="color:#3b82f6">Mom</td><td class="score-cell">3</td><td class="score-cell over">4</td><td class="score-cell">2</td><td class="score-cell">3</td><td class="score-cell over">5</td><td class="score-cell">3</td><td class="score-cell">2</td><td class="score-cell">3</td><td class="score-cell under">3</td><td>28</td><td class="score-cell">3</td><td class="score-cell over">4</td><td class="score-cell current-hole">—</td><td>7</td><td>35</td></tr>
<tr><td style="color:#22c55e">Jake</td><td class="score-cell over">4</td><td class="score-cell">3</td><td class="score-cell over">3</td><td class="score-cell over">4</td><td class="score-cell">4</td><td class="score-cell">3</td><td class="score-cell over">3</td><td class="score-cell">3</td><td class="score-cell over">5</td><td>32</td><td class="score-cell over">4</td><td class="score-cell under">2</td><td class="score-cell current-hole">—</td><td>6</td><td>38</td></tr>
<tr><td style="color:#f59e0b">Emma</td><td class="score-cell over">4</td><td class="score-cell over">5</td><td class="score-cell">2</td><td class="score-cell over">4</td><td class="score-cell over">5</td><td class="score-cell over">4</td><td class="score-cell">2</td><td class="score-cell over">4</td><td class="score-cell">4</td><td>34</td><td class="score-cell over">4</td><td class="score-cell over">4</td><td class="score-cell current-hole">—</td><td>8</td><td>42</td></tr>
</table>
</div>
</body>
</html>
