<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Booking - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"minigolf-booking","name":"Mini Golf Booking","icon":"⛳","desc":"Book mini golf rounds","category":"minigolf","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:20px}
.course{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.course-banner{padding:30px;background:linear-gradient(135deg,#10b981 0%,#059669 100%);text-align:center}
.course-name{font-size:1.5rem;font-weight:bold;margin-bottom:5px}
.course-theme{font-size:.875rem;opacity:.9}
.course-body{padding:20px}
.course-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;text-align:center}
.course-stat-value{font-size:1.25rem;font-weight:bold;color:#10b981}
.course-stat-label{font-size:.7rem;color:#888}
.course-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.course-footer{display:flex;justify-content:space-between;align-items:center}
.course-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.book-btn{padding:10px 20px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer}
.time-slots{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.time-slots h3{margin-bottom:15px}
.slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.slot{padding:10px;background:#252525;border-radius:6px;text-align:center;cursor:pointer;font-size:.875rem}
.slot:hover{background:#10b98133}
.slot.booked{background:#333;color:#666;cursor:not-allowed}
</style>
</head>
<body>
<div class="header"><h1>⛳ Mini Golf</h1><button class="btn">My Bookings</button></div>
<div class="courses" id="courses"></div>
<div class="time-slots">
<h3>Available Times - Pirate's Cove</h3>
<div class="slots-grid" id="slots"></div>
</div>
<script>
const courses=[
{name:"Pirate's Cove",theme:'Pirate Adventure',holes:18,par:54,difficulty:'Medium',desc:'Navigate through sunken ships, treasure caves, and waterfalls in this swashbuckling adventure!',price:14},
{name:'Jungle Safari',theme:'Wildlife Expedition',holes:18,par:52,difficulty:'Easy',desc:'Explore the wild with animatronic animals, jungle sounds, and lush greenery throughout.',price:14},
{name:'Glow Golf',theme:'Neon Blacklight',holes:18,par:56,difficulty:'Hard',desc:'Play in the dark with glowing obstacles and UV effects. A unique experience for all ages!',price:18}
];
document.getElementById('courses').innerHTML=courses.map(c=>`
<div class="course">
<div class="course-banner"><div class="course-name">${c.name}</div><div class="course-theme">${c.theme}</div></div>
<div class="course-body">
<div class="course-stats">
<div><div class="course-stat-value">${c.holes}</div><div class="course-stat-label">Holes</div></div>
<div><div class="course-stat-value">${c.par}</div><div class="course-stat-label">Par</div></div>
<div><div class="course-stat-value">${c.difficulty}</div><div class="course-stat-label">Difficulty</div></div>
</div>
<div class="course-desc">${c.desc}</div>
<div class="course-footer"><span class="course-price">$${c.price}/person</span><button class="book-btn">Select</button></div>
</div>
</div>`).join('');

const times=['10:00','10:30','11:00','11:30','12:00','12:30','1:00','1:30','2:00','2:30','3:00','3:30','4:00','4:30','5:00','5:30'];
const booked=['11:00','12:30','2:00','3:30'];
document.getElementById('slots').innerHTML=times.map(t=>`<div class="slot${booked.includes(t)?' booked':''}">${t}</div>`).join('');
</script>
</body>
</html>
