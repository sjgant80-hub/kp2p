<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cleaning Schedule - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"cleaning-schedule","name":"Cleaning Schedule","icon":"🪟","desc":"Window cleaning schedule","category":"window","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0ea5e9}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.time{font-weight:600}
.type{padding:4px 8px;border-radius:4px;font-size:.75rem;background:#0ea5e933;color:#0ea5e9;margin-left:10px}
.status{padding:6px 12px;border-radius:6px;font-size:.75rem}
.status.scheduled{background:#3b82f633;color:#3b82f6}
.status.progress{background:#0ea5e933;color:#0ea5e9}
.status.done{background:#22c55e33;color:#22c55e}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#0ea5e9;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>🪟 Cleaning Schedule</h1><button class="btn" onclick="alert('Schedule')">+ Schedule</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">4</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">18</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Active Crews</div></div>
<div class="stat"><div class="stat-value">420</div><div class="stat-label">Windows</div></div>
</div>
<div class="list" id="list"></div>
<script>
const jobs=[
{time:'8:00 AM',customer:'ABC Office Tower',type:'Exterior',windows:200,stories:5,crew:'High-Rise',price:1500,status:'progress'},
{time:'1:00 PM',customer:'Johnson Residence',type:'In/Out',windows:24,stories:2,crew:'Team A',price:280,status:'scheduled'},
{time:'3:00 PM',customer:'Smith Home',type:'In/Out',windows:18,stories:1,crew:'Team B',price:200,status:'scheduled'},
{time:'7:00 AM',customer:'City Library',type:'Exterior',windows:80,stories:3,crew:'High-Rise',price:650,status:'done'}
];
document.getElementById('list').innerHTML=jobs.map(j=>`
<div class="card">
<div class="card-header"><span class="time">📅 ${j.time}<span class="type">${j.type}</span></span><span class="status ${j.status}">${j.status==='progress'?'In Progress':j.status==='done'?'Completed':'Scheduled'}</span></div>
<div class="info">
<div><div class="row"><span class="label">Customer</span><span>${j.customer}</span></div><div class="row"><span class="label">Windows</span><span>${j.windows}</span></div></div>
<div><div class="row"><span class="label">Stories</span><span>${j.stories}</span></div><div class="row"><span class="label">Price</span><span>$${j.price}</span></div></div>
</div>
</div>`).join('');
</script>
</body>
</html>
