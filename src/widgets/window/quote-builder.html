<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Builder - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"quote-builder","name":"Quote Builder","icon":"💰","desc":"Build window cleaning quotes","category":"window","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0ea5e9}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.title{font-weight:600}
.status{padding:6px 12px;border-radius:6px;font-size:.75rem}
.status.draft{background:#f59e0b33;color:#f59e0b}
.status.sent{background:#3b82f633;color:#3b82f6}
.status.accepted{background:#22c55e33;color:#22c55e}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.total{background:#252525;padding:15px;border-radius:8px;display:flex;justify-content:space-between}
.total strong{font-size:1.25rem;color:#0ea5e9}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#0ea5e9;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>💰 Quote Builder</h1><button class="btn" onclick="alert('New')">+ New Quote</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">15</div><div class="stat-label">Total Quotes</div></div>
<div class="stat"><div class="stat-value">$8.5k</div><div class="stat-label">Pending</div></div>
<div class="stat"><div class="stat-value">68%</div><div class="stat-label">Close Rate</div></div>
<div class="stat"><div class="stat-value">$425</div><div class="stat-label">Avg Quote</div></div>
</div>
<div class="list" id="list"></div>
<script>
const quotes=[
{id:'WQ-001',customer:'ABC Corp HQ',type:'Commercial',windows:150,stories:8,frequency:'Quarterly',total:2400,status:'sent'},
{id:'WQ-002',customer:'Johnson Residence',type:'Residential',windows:28,stories:2,frequency:'Bi-Annual',total:320,status:'accepted'},
{id:'WQ-003',customer:'Green Valley Mall',type:'Commercial',windows:300,stories:3,frequency:'Monthly',total:1800,status:'draft'}
];
document.getElementById('list').innerHTML=quotes.map(q=>`
<div class="card">
<div class="card-header"><span class="title">#${q.id} - ${q.customer}</span><span class="status ${q.status}">${q.status}</span></div>
<div class="info">
<div><div class="row"><span class="label">Type</span><span>${q.type}</span></div><div class="row"><span class="label">Windows</span><span>${q.windows}</span></div></div>
<div><div class="row"><span class="label">Stories</span><span>${q.stories}</span></div><div class="row"><span class="label">Frequency</span><span>${q.frequency}</span></div></div>
</div>
<div class="total"><span>Quote Total</span><strong>$${q.total.toLocaleString()}</strong></div>
</div>`).join('');
</script>
</body>
</html>
