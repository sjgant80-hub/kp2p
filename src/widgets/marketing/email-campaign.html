<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email Campaign - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"email-campaign","name":"Email Campaign","icon":"📧","desc":"Email marketing campaign management","category":"marketing","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    h1{font-size:1.5rem}
    button{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    button.primary{background:#e94560;border-color:#e94560}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px}
    .stat{background:#1a1a1a;padding:20px;border-radius:12px;text-align:center;border:1px solid #333}
    .stat-value{font-size:2rem;font-weight:bold;color:#e94560}
    .stat-label{font-size:12px;color:#888;margin-top:4px}
    .campaigns{display:flex;flex-direction:column;gap:16px}
    .campaign-card{background:#1a1a1a;border-radius:12px;padding:20px;border:1px solid #333}
    .campaign-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
    .campaign-title h3{margin-bottom:4px}
    .campaign-title p{color:#888;font-size:13px}
    .campaign-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:15px}
    .metric{text-align:center;padding:10px;background:#0a0a0a;border-radius:8px}
    .metric-value{font-size:1.2rem;font-weight:bold}
    .metric-label{font-size:11px;color:#888;margin-top:2px}
    .metric-value.good{color:#4ecdc4}
    .metric-value.warning{color:#f90}
    .badge{padding:4px 10px;border-radius:12px;font-size:11px}
    .badge.draft{background:#333;color:#888}
    .badge.scheduled{background:#4a4a1a;color:#f90}
    .badge.sent{background:#1a4a1a;color:#4a4}
    .badge.sending{background:#1a4a4a;color:#4cc}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:24px;width:90%;max-width:700px;max-height:90vh;overflow-y:auto}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#fff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .email-preview{background:#fff;color:#000;padding:20px;border-radius:8px;margin-top:15px}
    .email-preview h2{color:#333}
  </style>
</head>
<body>
  <div class="header">
    <h1>📧 Email Campaigns</h1>
    <button class="primary" onclick="showNewCampaign()">+ New Campaign</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="totalSent">0</div><div class="stat-label">Emails Sent</div></div>
    <div class="stat"><div class="stat-value" id="avgOpen">0%</div><div class="stat-label">Avg Open Rate</div></div>
    <div class="stat"><div class="stat-value" id="avgClick">0%</div><div class="stat-label">Avg Click Rate</div></div>
    <div class="stat"><div class="stat-value" id="subscribers">0</div><div class="stat-label">Subscribers</div></div>
  </div>

  <div class="campaigns" id="campaigns"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>New Campaign</h2>
      <input type="hidden" id="campaignId">
      <div class="form-group"><label>Campaign Name</label><input type="text" id="name" placeholder="Monthly Newsletter"></div>
      <div class="form-row">
        <div class="form-group"><label>Subject Line</label><input type="text" id="subject" placeholder="Your subject here"></div>
        <div class="form-group"><label>From Name</label><input type="text" id="fromName" placeholder="Your Company"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>From Email</label><input type="email" id="fromEmail" placeholder="hello@company.com"></div>
        <div class="form-group"><label>List</label><select id="list">
          <option value="all">All Subscribers</option>
          <option value="newsletter">Newsletter</option>
          <option value="customers">Customers</option>
          <option value="leads">Leads</option>
        </select></div>
      </div>
      <div class="form-group"><label>Email Content (HTML)</label>
        <textarea id="content" rows="8" placeholder="<h1>Hello!</h1><p>Your content here...</p>"></textarea>
      </div>
      <div class="form-group"><label>Schedule</label><input type="datetime-local" id="schedule"></div>
      <div class="btn-row">
        <button onclick="closeModal()">Cancel</button>
        <button onclick="saveCampaign('draft')">Save Draft</button>
        <button class="primary" onclick="saveCampaign('scheduled')">Schedule</button>
      </div>
    </div>
  </div>

  <script>
    let campaigns = JSON.parse(localStorage.getItem('kiss-email-campaigns') || '[]');
    let subscribers = JSON.parse(localStorage.getItem('kiss-email-subscribers') || '1250');

    // Initialize with sample data
    if (campaigns.length === 0) {
      campaigns = [
        {
          id: '1',
          name: 'Welcome Series - Day 1',
          subject: 'Welcome to our community!',
          fromName: 'Company',
          fromEmail: 'hello@company.com',
          list: 'all',
          content: '<h1>Welcome!</h1><p>Thanks for joining us.</p>',
          status: 'sent',
          sent: 2450,
          opened: 1127,
          clicked: 312,
          sentAt: new Date(Date.now() - 86400000 * 5).toISOString()
        },
        {
          id: '2',
          name: 'Product Update',
          subject: 'New features just launched!',
          fromName: 'Product Team',
          fromEmail: 'product@company.com',
          list: 'customers',
          content: '<h1>New Features</h1><p>Check out what we built.</p>',
          status: 'sent',
          sent: 1890,
          opened: 945,
          clicked: 378,
          sentAt: new Date(Date.now() - 86400000 * 2).toISOString()
        }
      ];
      save();
    }

    function save() { localStorage.setItem('kiss-email-campaigns', JSON.stringify(campaigns)); }

    function formatNumber(n) {
      return n.toLocaleString();
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      // Stats
      let totalSent = 0, totalOpens = 0, totalClicks = 0;
      campaigns.filter(c => c.status === 'sent').forEach(c => {
        totalSent += c.sent || 0;
        totalOpens += c.opened || 0;
        totalClicks += c.clicked || 0;
      });

      document.getElementById('totalSent').textContent = formatNumber(totalSent);
      document.getElementById('avgOpen').textContent = totalSent ? Math.round(totalOpens / totalSent * 100) + '%' : '0%';
      document.getElementById('avgClick').textContent = totalSent ? Math.round(totalClicks / totalSent * 100) + '%' : '0%';
      document.getElementById('subscribers').textContent = formatNumber(parseInt(subscribers));

      // Campaigns
      const list = document.getElementById('campaigns');
      if (campaigns.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:#666">No campaigns yet. Create your first one!</div>';
        return;
      }

      list.innerHTML = campaigns.map(c => {
        const openRate = c.sent ? Math.round(c.opened / c.sent * 100) : 0;
        const clickRate = c.sent ? Math.round(c.clicked / c.sent * 100) : 0;

        return `
          <div class="campaign-card">
            <div class="campaign-header">
              <div class="campaign-title">
                <h3>${c.name}</h3>
                <p>${c.subject} • ${c.list}</p>
              </div>
              <span class="badge ${c.status}">${c.status}</span>
            </div>
            ${c.status === 'sent' ? `
              <div class="campaign-metrics">
                <div class="metric">
                  <div class="metric-value">${formatNumber(c.sent)}</div>
                  <div class="metric-label">Sent</div>
                </div>
                <div class="metric">
                  <div class="metric-value ${openRate >= 20 ? 'good' : 'warning'}">${openRate}%</div>
                  <div class="metric-label">Opened</div>
                </div>
                <div class="metric">
                  <div class="metric-value ${clickRate >= 3 ? 'good' : 'warning'}">${clickRate}%</div>
                  <div class="metric-label">Clicked</div>
                </div>
                <div class="metric">
                  <div class="metric-value">${formatDate(c.sentAt)}</div>
                  <div class="metric-label">Sent At</div>
                </div>
              </div>
            ` : `
              <p style="color:#888;font-size:13px;margin-bottom:15px">
                ${c.schedule ? 'Scheduled for ' + formatDate(c.schedule) : 'Not scheduled'}
              </p>
            `}
            <div style="display:flex;gap:10px">
              ${c.status === 'draft' ? `<button onclick="editCampaign('${c.id}')">Edit</button>` : ''}
              ${c.status === 'draft' ? `<button class="primary" onclick="sendCampaign('${c.id}')">Send Now</button>` : ''}
              <button onclick="duplicateCampaign('${c.id}')">Duplicate</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function showNewCampaign() {
      document.getElementById('campaignId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('subject').value = '';
      document.getElementById('fromName').value = '';
      document.getElementById('fromEmail').value = '';
      document.getElementById('content').value = '';
      document.getElementById('schedule').value = '';
      document.getElementById('modal').classList.add('active');
    }

    function editCampaign(id) {
      const c = campaigns.find(c => c.id === id);
      if (!c) return;
      document.getElementById('campaignId').value = id;
      document.getElementById('name').value = c.name;
      document.getElementById('subject').value = c.subject;
      document.getElementById('fromName').value = c.fromName;
      document.getElementById('fromEmail').value = c.fromEmail;
      document.getElementById('list').value = c.list;
      document.getElementById('content').value = c.content;
      document.getElementById('schedule').value = c.schedule || '';
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveCampaign(status) {
      const name = document.getElementById('name').value.trim();
      const subject = document.getElementById('subject').value.trim();

      if (!name || !subject) {
        alert('Name and subject are required');
        return;
      }

      const campaign = {
        id: document.getElementById('campaignId').value || Date.now().toString(),
        name,
        subject,
        fromName: document.getElementById('fromName').value.trim(),
        fromEmail: document.getElementById('fromEmail').value.trim(),
        list: document.getElementById('list').value,
        content: document.getElementById('content').value,
        schedule: document.getElementById('schedule').value,
        status,
        sent: 0,
        opened: 0,
        clicked: 0,
        createdAt: new Date().toISOString()
      };

      const idx = campaigns.findIndex(c => c.id === campaign.id);
      if (idx >= 0) {
        campaigns[idx] = { ...campaigns[idx], ...campaign };
      } else {
        campaigns.unshift(campaign);
      }

      save();
      closeModal();
      render();
    }

    function sendCampaign(id) {
      const c = campaigns.find(c => c.id === id);
      if (!c) return;

      if (confirm(`Send "${c.name}" to ${c.list} subscribers?`)) {
        c.status = 'sent';
        c.sent = Math.floor(parseInt(subscribers) * (0.8 + Math.random() * 0.2));
        c.opened = Math.floor(c.sent * (0.15 + Math.random() * 0.25));
        c.clicked = Math.floor(c.opened * (0.1 + Math.random() * 0.2));
        c.sentAt = new Date().toISOString();
        save();
        render();
      }
    }

    function duplicateCampaign(id) {
      const c = campaigns.find(c => c.id === id);
      if (!c) return;

      campaigns.unshift({
        ...c,
        id: Date.now().toString(),
        name: c.name + ' (Copy)',
        status: 'draft',
        sent: 0,
        opened: 0,
        clicked: 0,
        createdAt: new Date().toISOString()
      });

      save();
      render();
    }

    render();
  </script>
</body>
</html>
