<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift Tickets - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"lift-tickets","name":"Lift Tickets","icon":"🎿","desc":"Purchase ski lift tickets","category":"skiing","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.conditions{background:linear-gradient(135deg,#1e40af 0%,#3b82f6 100%);border-radius:12px;padding:20px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:15px}
.condition{text-align:center}
.condition-value{font-size:1.25rem;font-weight:bold}
.condition-label{font-size:.75rem;opacity:.8}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.ticket{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.ticket-header{padding:20px;background:#252525;text-align:center}
.ticket-name{font-size:1.25rem;font-weight:bold;margin-bottom:5px}
.ticket-type{font-size:.875rem;color:#888}
.ticket-body{padding:20px}
.ticket-features{margin-bottom:20px}
.feature{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.875rem}
.feature-check{color:#22c55e}
.ticket-price{text-align:center;padding:15px;background:#252525;border-radius:8px;margin-bottom:15px}
.price-amount{font-size:2rem;font-weight:bold;color:#3b82f6}
.price-period{font-size:.875rem;color:#888}
.buy-btn{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:1rem}
</style>
</head>
<body>
<div class="header"><h1>🎿 Lift Tickets</h1><button class="btn">My Passes</button></div>
<div class="conditions">
<div class="condition"><div class="condition-value">❄️ 48"</div><div class="condition-label">Base Depth</div></div>
<div class="condition"><div class="condition-value">🌨️ 6"</div><div class="condition-label">24hr Snow</div></div>
<div class="condition"><div class="condition-value">92/95</div><div class="condition-label">Trails Open</div></div>
<div class="condition"><div class="condition-value">12/14</div><div class="condition-label">Lifts Open</div></div>
<div class="condition"><div class="condition-value">28°F</div><div class="condition-label">Temperature</div></div>
</div>
<div class="tickets" id="tickets"></div>
<script>
const tickets=[
{name:'Full Day',type:'All Lifts Access',features:['All 14 lifts','All terrain parks','Valid 8:30 AM - 4 PM','Night skiing included'],price:149,period:'day'},
{name:'Half Day',type:'Afternoon Access',features:['All 14 lifts','All terrain parks','Valid 12 PM - 4 PM','Best value'],price:99,period:'day'},
{name:'Beginner Package',type:'Learning Area Only',features:['3 beginner lifts','Learning terrain','Valid all day','Lesson discount'],price:69,period:'day'},
{name:'Season Pass',type:'Unlimited Access',features:['Unlimited days','Priority lift lines','20% off rentals','Buddy tickets'],price:899,period:'season'}
];
document.getElementById('tickets').innerHTML=tickets.map(t=>`
<div class="ticket">
<div class="ticket-header"><div class="ticket-name">${t.name}</div><div class="ticket-type">${t.type}</div></div>
<div class="ticket-body">
<div class="ticket-features">${t.features.map(f=>`<div class="feature"><span class="feature-check">✓</span>${f}</div>`).join('')}</div>
<div class="ticket-price"><div class="price-amount">$${t.price}</div><div class="price-period">per ${t.period}</div></div>
<button class="buy-btn">Purchase</button>
</div>
</div>`).join('');
</script>
</body>
</html>
