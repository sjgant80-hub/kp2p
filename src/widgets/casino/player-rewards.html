<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Rewards - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"player-rewards","name":"Player Rewards","icon":"⭐","desc":"Casino loyalty program","category":"casino","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#fbbf24;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.member-card{background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%);border-radius:16px;padding:30px;margin-bottom:20px;color:#000}
.card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}
.member-name{font-size:1.5rem;font-weight:bold}
.member-tier{padding:6px 15px;background:rgba(0,0,0,.2);border-radius:6px;font-weight:600}
.card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center}
.card-stat-value{font-size:2rem;font-weight:bold}
.card-stat-label{font-size:.875rem;opacity:.8}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.reward{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.reward-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.reward-name{font-weight:bold;font-size:1.125rem}
.reward-points{padding:4px 10px;background:#fbbf2433;color:#fbbf24;border-radius:4px;font-size:.875rem}
.reward-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.reward-btn{width:100%;padding:10px;background:#fbbf24;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.reward-btn:disabled{background:#333;color:#666;cursor:not-allowed}
.tiers{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;margin-top:20px}
.tiers h3{margin-bottom:15px}
.tier-progress{display:flex;align-items:center;gap:15px}
.tier-bar{flex:1;height:12px;background:#333;border-radius:6px;overflow:hidden}
.tier-fill{height:100%;background:linear-gradient(90deg,#fbbf24 0%,#f59e0b 100%);width:65%}
.tier-labels{display:flex;justify-content:space-between;margin-top:10px;font-size:.75rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>⭐ Player Rewards</h1><button class="btn">Redeem Points</button></div>
<div class="member-card">
<div class="card-header">
<div><div class="member-name">James Wilson</div><div style="opacity:.8;margin-top:5px">Member since 2019</div></div>
<span class="member-tier">💎 PLATINUM</span>
</div>
<div class="card-stats">
<div><div class="card-stat-value">24,850</div><div class="card-stat-label">Available Points</div></div>
<div><div class="card-stat-value">$12,450</div><div class="card-stat-label">Comp Balance</div></div>
<div><div class="card-stat-value">156</div><div class="card-stat-label">Visits This Year</div></div>
</div>
</div>
<div class="rewards" id="rewards"></div>
<div class="tiers">
<h3>🎯 Tier Progress</h3>
<div class="tier-progress">
<span style="color:#fbbf24">Platinum</span>
<div class="tier-bar"><div class="tier-fill"></div></div>
<span style="color:#888">Diamond</span>
</div>
<div class="tier-labels"><span>0 pts</span><span>65,000 / 100,000 pts</span><span>100,000 pts</span></div>
</div>
<script>
const rewards=[
{name:'Free Buffet',points:2500,desc:'Enjoy complimentary access to our Grand Buffet for two guests.',available:true},
{name:'$50 Free Play',points:5000,desc:'Receive $50 in free slot play, valid on any machine.',available:true},
{name:'Spa Treatment',points:8000,desc:'Relaxing 60-minute massage or facial at our luxury spa.',available:true},
{name:'Suite Upgrade',points:15000,desc:'Complimentary upgrade to a premium suite for one night.',available:true},
{name:'VIP Concert Tickets',points:25000,desc:'Two front-row tickets to any show this month.',available:false},
{name:'Weekend Getaway',points:50000,desc:'Two-night stay with dining credit and show tickets.',available:false}
];
document.getElementById('rewards').innerHTML=rewards.map(r=>`
<div class="reward">
<div class="reward-header"><span class="reward-name">${r.name}</span><span class="reward-points">${r.points.toLocaleString()} pts</span></div>
<div class="reward-desc">${r.desc}</div>
<button class="reward-btn"${r.available?'':" disabled"}>${r.available?'Redeem Now':'Not Enough Points'}</button>
</div>`).join('');
</script>
</body>
</html>
