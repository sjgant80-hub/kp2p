<!DOCTYPE html>
<!--
KONOMI SMS - Quick Text Message Sender
Uses sms: protocol. No server needed. $0 forever.
Kills: SMS apps, Twilio forms
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "sms",
    "name": "SMS",
    "icon": "💬",
    "desc": "Quick text message sender",
    "body": "Send SMS messages using your device's native messaging. Templates, scheduled sends, and contact groups. Uses sms: protocol.",
    "kills": ["Twilio $0.01/msg", "SMS apps", "Bulk SMS services"],
    "price": 0,
    "color": "#22c55e",
    "badge": "NEW"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --accent: #22c55e;
      --text: #fff;
      --text-dim: #888;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .phone {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .phone-header {
      padding: 20px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .phone-header h1 {
      font-size: 1.25rem;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--surface2);
    }

    .tab {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .content {
      padding: 20px;
      min-height: 400px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid #333;
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
    }

    .field textarea {
      min-height: 120px;
      resize: none;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--text-dim);
    }

    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .char-count.warn {
      color: #f59e0b;
    }

    .char-count.danger {
      color: #ef4444;
    }

    .send-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .send-btn:hover {
      background: #16a34a;
    }

    .quick-templates {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .quick-template {
      background: var(--surface2);
      border: 1px solid #333;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .quick-template:hover {
      border-color: var(--accent);
    }

    .contacts-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-item {
      background: var(--surface2);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .contact-item:hover {
      background: #333;
    }

    .contact-avatar {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .contact-info {
      flex: 1;
    }

    .contact-name {
      font-weight: 500;
    }

    .contact-phone {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .contact-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
    }

    .add-contact {
      background: var(--surface2);
      border: 2px dashed #444;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      color: var(--text-dim);
      margin-top: 12px;
    }

    .add-contact:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .templates-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .template-item {
      background: var(--surface2);
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .template-item:hover {
      background: #333;
    }

    .template-name {
      font-weight: 500;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .template-preview {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="phone-header">
      <span>💬</span>
      <h1>SMS</h1>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('compose')">Compose</button>
      <button class="tab" onclick="showTab('contacts')">Contacts</button>
      <button class="tab" onclick="showTab('templates')">Templates</button>
    </div>

    <div class="content">
      <!-- Compose Panel -->
      <div class="panel active" id="panel-compose">
        <div class="quick-templates">
          <button class="quick-template" onclick="useQuickTemplate('On my way!')">🚗 On my way!</button>
          <button class="quick-template" onclick="useQuickTemplate('Running late, be there soon')">⏰ Running late</button>
          <button class="quick-template" onclick="useQuickTemplate('Call me when you can')">📞 Call me</button>
        </div>

        <div class="field">
          <label>To</label>
          <input type="tel" id="sms-to" placeholder="+1 234 567 8900">
        </div>

        <div class="field">
          <label>Message</label>
          <textarea id="sms-body" placeholder="Type your message..." oninput="updateCharCount()"></textarea>
          <div class="char-count" id="char-count">0 / 160</div>
        </div>

        <button class="send-btn" onclick="sendSMS()">
          <span>Send Message</span>
          <span>📤</span>
        </button>
      </div>

      <!-- Contacts Panel -->
      <div class="panel" id="panel-contacts">
        <div class="contacts-list" id="contacts-list"></div>
        <div class="add-contact" onclick="showAddContact()">
          + Add Contact
        </div>
      </div>

      <!-- Templates Panel -->
      <div class="panel" id="panel-templates">
        <div class="templates-list" id="templates-list"></div>
        <div class="add-contact" onclick="showAddTemplate()">
          + Add Template
        </div>
      </div>
    </div>
  </div>

  <!-- Add Contact Modal -->
  <div class="modal" id="contact-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add Contact</h3>
        <button class="modal-close" onclick="hideModal('contact-modal')">×</button>
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="contact-name" placeholder="Contact name">
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" id="contact-phone" placeholder="+1 234 567 8900">
      </div>
      <button class="send-btn" onclick="saveContact()">Save Contact</button>
    </div>
  </div>

  <!-- Add Template Modal -->
  <div class="modal" id="template-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add Template</h3>
        <button class="modal-close" onclick="hideModal('template-modal')">×</button>
      </div>
      <div class="field">
        <label>Template Name</label>
        <input type="text" id="template-name" placeholder="E.g., Meeting reminder">
      </div>
      <div class="field">
        <label>Message</label>
        <textarea id="template-body" placeholder="Template message..."></textarea>
      </div>
      <button class="send-btn" onclick="saveTemplate()">Save Template</button>
    </div>
  </div>

  <script>
    const STORAGE_CONTACTS = 'konomi_sms_contacts';
    const STORAGE_TEMPLATES = 'konomi_sms_templates';

    let contacts = [];
    let templates = [];

    function load() {
      const savedContacts = localStorage.getItem(STORAGE_CONTACTS);
      const savedTemplates = localStorage.getItem(STORAGE_TEMPLATES);

      if (savedContacts) contacts = JSON.parse(savedContacts);
      if (savedTemplates) templates = JSON.parse(savedTemplates);

      // Default templates
      if (templates.length === 0) {
        templates = [
          { id: 1, name: 'Running late', body: 'Hey, running about [X] minutes late. Be there soon!' },
          { id: 2, name: 'Meeting reminder', body: 'Reminder: We have a meeting scheduled for [TIME]. See you there!' },
          { id: 3, name: 'Thank you', body: 'Thank you so much! I really appreciate it.' }
        ];
        saveTemplates();
      }
    }

    function saveContacts() {
      localStorage.setItem(STORAGE_CONTACTS, JSON.stringify(contacts));
    }

    function saveTemplates() {
      localStorage.setItem(STORAGE_TEMPLATES, JSON.stringify(templates));
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      document.querySelector(`.tab:nth-child(${tab === 'compose' ? 1 : tab === 'contacts' ? 2 : 3})`).classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');

      if (tab === 'contacts') renderContacts();
      if (tab === 'templates') renderTemplates();
    }

    function useQuickTemplate(text) {
      document.getElementById('sms-body').value = text;
      updateCharCount();
    }

    function updateCharCount() {
      const body = document.getElementById('sms-body').value;
      const count = body.length;
      const el = document.getElementById('char-count');

      el.textContent = `${count} / 160`;
      el.className = 'char-count';

      if (count > 160) el.classList.add('danger');
      else if (count > 140) el.classList.add('warn');
    }

    function sendSMS() {
      const to = document.getElementById('sms-to').value.replace(/\s/g, '');
      const body = document.getElementById('sms-body').value;

      if (!to || !body) {
        alert('Please enter a phone number and message');
        return;
      }

      // Use sms: protocol
      const smsUrl = `sms:${to}?body=${encodeURIComponent(body)}`;
      window.location.href = smsUrl;
    }

    function renderContacts() {
      const list = document.getElementById('contacts-list');

      if (contacts.length === 0) {
        list.innerHTML = '<div class="empty-state">No contacts yet</div>';
        return;
      }

      list.innerHTML = contacts.map(c => `
        <div class="contact-item" onclick="selectContact('${c.phone}')">
          <div class="contact-avatar">${c.name.charAt(0).toUpperCase()}</div>
          <div class="contact-info">
            <div class="contact-name">${c.name}</div>
            <div class="contact-phone">${c.phone}</div>
          </div>
          <div class="contact-actions">
            <button class="action-btn" onclick="event.stopPropagation(); deleteContact(${c.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function selectContact(phone) {
      document.getElementById('sms-to').value = phone;
      showTab('compose');
    }

    function showAddContact() {
      document.getElementById('contact-name').value = '';
      document.getElementById('contact-phone').value = '';
      document.getElementById('contact-modal').classList.add('show');
    }

    function saveContact() {
      const name = document.getElementById('contact-name').value.trim();
      const phone = document.getElementById('contact-phone').value.trim();

      if (!name || !phone) {
        alert('Please fill in all fields');
        return;
      }

      contacts.push({ id: Date.now(), name, phone });
      saveContacts();
      hideModal('contact-modal');
      renderContacts();
    }

    function deleteContact(id) {
      if (!confirm('Delete this contact?')) return;
      contacts = contacts.filter(c => c.id !== id);
      saveContacts();
      renderContacts();
    }

    function renderTemplates() {
      const list = document.getElementById('templates-list');

      if (templates.length === 0) {
        list.innerHTML = '<div class="empty-state">No templates yet</div>';
        return;
      }

      list.innerHTML = templates.map(t => `
        <div class="template-item" onclick="useTemplate(${t.id})">
          <div class="template-name">
            <span>${t.name}</span>
            <button class="action-btn" onclick="event.stopPropagation(); deleteTemplate(${t.id})">🗑️</button>
          </div>
          <div class="template-preview">${t.body.substring(0, 60)}${t.body.length > 60 ? '...' : ''}</div>
        </div>
      `).join('');
    }

    function useTemplate(id) {
      const template = templates.find(t => t.id === id);
      if (template) {
        document.getElementById('sms-body').value = template.body;
        updateCharCount();
        showTab('compose');
      }
    }

    function showAddTemplate() {
      document.getElementById('template-name').value = '';
      document.getElementById('template-body').value = '';
      document.getElementById('template-modal').classList.add('show');
    }

    function saveTemplate() {
      const name = document.getElementById('template-name').value.trim();
      const body = document.getElementById('template-body').value.trim();

      if (!name || !body) {
        alert('Please fill in all fields');
        return;
      }

      templates.push({ id: Date.now(), name, body });
      saveTemplates();
      hideModal('template-modal');
      renderTemplates();
    }

    function deleteTemplate(id) {
      if (!confirm('Delete this template?')) return;
      templates = templates.filter(t => t.id !== id);
      saveTemplates();
      renderTemplates();
    }

    function hideModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    // Close modal on outside click
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('show');
      });
    });

    // Init
    load();
  </script>
</body>
</html>
