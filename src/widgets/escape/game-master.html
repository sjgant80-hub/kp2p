<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Master - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"game-master","name":"Game Master","icon":"🎮","desc":"Escape room game control","category":"escape","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.active-game{background:#1a1a1a;border-radius:12px;border:2px solid #f97316;padding:20px;margin-bottom:20px}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.room-name{font-size:1.25rem;font-weight:600}
.timer{font-size:2rem;font-weight:bold;color:#f97316;font-family:monospace}
.progress{margin-bottom:20px}
.progress-bar{height:12px;background:#333;border-radius:6px;overflow:hidden;margin-bottom:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,#f97316,#22c55e);border-radius:6px}
.puzzles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.puzzle{padding:15px;background:#252525;border-radius:8px;text-align:center;border:2px solid transparent}
.puzzle.solved{border-color:#22c55e;background:#22c55e20}
.puzzle.current{border-color:#f97316;background:#f9731620}
.puzzle-icon{font-size:1.5rem;margin-bottom:5px}
.puzzle-name{font-size:.875rem}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.btn-hint{background:#3b82f6;color:#fff}
.btn-clue{background:#f59e0b;color:#000}
.btn-reset{background:#ef4444;color:#fff}
.btn-complete{background:#22c55e;color:#fff}
.hints{background:#252525;padding:15px;border-radius:8px;margin-top:15px}
.hint-count{font-size:1.5rem;font-weight:bold;color:#3b82f6}
</style>
</head>
<body>
<div class="header"><h1>🎮 Game Master</h1></div>
<div class="active-game">
<div class="game-header">
<div class="room-name">🏦 The Heist - Johnson Party</div>
<div class="timer">32:45</div>
</div>
<div class="progress">
<div class="progress-bar"><div class="progress-fill" style="width:60%"></div></div>
<div style="display:flex;justify-content:space-between;font-size:.875rem;color:#888"><span>3/5 Puzzles Solved</span><span>60% Complete</span></div>
</div>
<div class="puzzles">
<div class="puzzle solved"><div class="puzzle-icon">🔓</div><div class="puzzle-name">Vault Code</div></div>
<div class="puzzle solved"><div class="puzzle-icon">🔓</div><div class="puzzle-name">Laser Grid</div></div>
<div class="puzzle solved"><div class="puzzle-icon">🔓</div><div class="puzzle-name">Security Camera</div></div>
<div class="puzzle current"><div class="puzzle-icon">🔒</div><div class="puzzle-name">Safe Crack</div></div>
<div class="puzzle"><div class="puzzle-icon">🔒</div><div class="puzzle-name">Final Escape</div></div>
</div>
<div class="controls">
<button class="btn btn-hint" onclick="alert('Hint sent')">💡 Send Hint</button>
<button class="btn btn-clue" onclick="alert('Clue')">📢 Audio Clue</button>
<button class="btn btn-reset" onclick="alert('Reset')">🔄 Reset Puzzle</button>
<button class="btn btn-complete" onclick="alert('Complete')">✅ Mark Solved</button>
</div>
<div class="hints"><span class="hint-count">2</span> hints used (3 remaining)</div>
</div>
</body>
</html>
