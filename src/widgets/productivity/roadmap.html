<!DOCTYPE html>
<!--
@file roadmap.html
@desc Roadmap Widget - Product roadmap & timeline (ProductBoard killer)
@api  window.Roadmap - roadmap controller
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "roadmap",
    "name": "Roadmap",
    "icon": "🗺️",
    "desc": "Product roadmap & timeline",
    "body": "ProductBoard killer. Visual product roadmap with timeline, kanban, and swimlane views.",
    "kills": ["ProductBoard $25/mo", "Aha! $59/mo", "Productplan $39/mo"],
    "price": 25,
    "color": "#7c3aed"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roadmap</title>
  <style>
    :root{--b:#0a0a12;--b2:#12121e;--f:#e4e4e7;--a:#00d9ff;--a2:#7c3aed;--g:#10b981;--y:#eab308;--o:#f97316;--r:#ef4444}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:14px/1.5 system-ui,sans-serif;background:var(--b);color:var(--f);min-height:100vh}

    .header{padding:20px 24px;background:var(--b2);border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    .logo{font-size:28px}
    .header h1{flex:1;font-size:20px}
    .add-btn{padding:12px 20px;background:var(--a2);border:0;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}

    .container{max-width:1400px;margin:0 auto;padding:24px}

    .view-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--b2);padding:4px;border-radius:10px;width:fit-content}
    .view-tabs button{padding:10px 20px;background:0;border:0;border-radius:8px;color:#94a3b8;font-size:13px;cursor:pointer}
    .view-tabs button.active{background:var(--a);color:#000}

    /* Kanban View */
    .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    @media(max-width:1000px){.kanban{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.kanban{grid-template-columns:1fr}}

    .column{background:var(--b2);border:1px solid rgba(255,255,255,.06);border-radius:12px;min-height:400px}
    .column-header{padding:16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
    .column-header .dot{width:10px;height:10px;border-radius:50%}
    .column-header h3{flex:1;font-size:14px}
    .column-header .count{font-size:12px;color:#64748b}
    .column-body{padding:12px;min-height:300px}

    .card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .15s}
    .card:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
    .card-title{font-weight:600;margin-bottom:8px}
    .card-desc{font-size:12px;color:#94a3b8;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-meta{display:flex;gap:8px;flex-wrap:wrap}
    .card-tag{font-size:10px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.08)}
    .card-priority{font-size:10px;padding:4px 8px;border-radius:6px}
    .priority-high{background:rgba(239,68,68,.2);color:var(--r)}
    .priority-medium{background:rgba(249,115,22,.2);color:var(--o)}
    .priority-low{background:rgba(16,185,129,.2);color:var(--g)}
    .card-date{font-size:11px;color:#64748b;margin-top:12px;display:flex;align-items:center;gap:6px}

    /* Timeline View */
    .timeline{display:none}
    .timeline.active{display:block}
    .kanban.active{display:grid}

    .quarter{margin-bottom:32px}
    .quarter-header{font-size:18px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
    .quarter-header .badge{font-size:11px;padding:4px 10px;background:var(--a2);border-radius:10px;font-weight:500}

    .timeline-items{display:flex;flex-direction:column;gap:12px}
    .timeline-item{display:flex;gap:20px;padding:20px;background:var(--b2);border:1px solid rgba(255,255,255,.06);border-radius:12px}
    .timeline-item:hover{border-color:rgba(255,255,255,.15)}
    .timeline-status{width:12px;height:12px;border-radius:50%;margin-top:4px;flex-shrink:0}
    .timeline-content{flex:1}
    .timeline-title{font-weight:600;margin-bottom:4px}
    .timeline-desc{font-size:13px;color:#94a3b8;margin-bottom:12px}
    .timeline-meta{display:flex;gap:12px;flex-wrap:wrap}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
    .modal.open{display:flex}
    .modal-content{background:var(--b2);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;width:100%;max-width:500px}
    .modal h2{margin-bottom:20px;font-size:18px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--f);font:inherit}
    .form-group textarea{min-height:100px;resize:vertical}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:0;border-color:var(--a)}
    .row{display:flex;gap:12px}
    .row > *{flex:1}
    .modal-btns{display:flex;gap:12px;margin-top:20px}
    .modal-btns button{flex:1;padding:12px;border:0;border-radius:8px;font-weight:600;cursor:pointer}
    .modal-btns .cancel{background:rgba(255,255,255,.08);color:var(--f)}
    .modal-btns .save{background:var(--a2);color:#fff}
    .modal-btns .delete{background:var(--r);color:#fff}

    .empty{text-align:center;padding:40px;color:#64748b}
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🗺️</span>
    <h1>Product Roadmap</h1>
    <button class="add-btn" id="addBtn">+ Add Item</button>
  </div>

  <div class="container">
    <div class="view-tabs">
      <button class="active" data-view="kanban">Board</button>
      <button data-view="timeline">Timeline</button>
    </div>

    <div class="kanban active" id="kanban">
      <div class="column" data-status="planned">
        <div class="column-header">
          <div class="dot" style="background:var(--a2)"></div>
          <h3>Planned</h3>
          <span class="count" data-count="planned">0</span>
        </div>
        <div class="column-body" data-drop="planned"></div>
      </div>

      <div class="column" data-status="in-progress">
        <div class="column-header">
          <div class="dot" style="background:var(--a)"></div>
          <h3>In Progress</h3>
          <span class="count" data-count="in-progress">0</span>
        </div>
        <div class="column-body" data-drop="in-progress"></div>
      </div>

      <div class="column" data-status="review">
        <div class="column-header">
          <div class="dot" style="background:var(--y)"></div>
          <h3>Review</h3>
          <span class="count" data-count="review">0</span>
        </div>
        <div class="column-body" data-drop="review"></div>
      </div>

      <div class="column" data-status="done">
        <div class="column-header">
          <div class="dot" style="background:var(--g)"></div>
          <h3>Done</h3>
          <span class="count" data-count="done">0</span>
        </div>
        <div class="column-body" data-drop="done"></div>
      </div>
    </div>

    <div class="timeline" id="timeline"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Roadmap Item</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="title" placeholder="Feature name">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="desc" placeholder="What will this accomplish?"></textarea>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="planned">Planned</option>
            <option value="in-progress">In Progress</option>
            <option value="review">Review</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="priority">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="category" placeholder="e.g. Feature, Bug, Enhancement">
        </div>
        <div class="form-group">
          <label>Target Date</label>
          <input type="date" id="targetDate">
        </div>
      </div>
      <div class="modal-btns">
        <button class="cancel" id="cancelBtn">Cancel</button>
        <button class="delete" id="deleteBtn" style="display:none">Delete</button>
        <button class="save" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    class Roadmap {
      constructor() {
        this.items = JSON.parse(localStorage.getItem('roadmap') || '[]');
        this.view = 'kanban';
        this.editId = null;
        this.init();
      }

      save() {
        localStorage.setItem('roadmap', JSON.stringify(this.items));
      }

      add(data) {
        this.items.push({
          id: Date.now().toString(36),
          ...data,
          created: Date.now()
        });
        this.save();
        this.render();
      }

      update(id, data) {
        const item = this.items.find(i => i.id === id);
        if (item) {
          Object.assign(item, data);
          this.save();
          this.render();
        }
      }

      delete(id) {
        this.items = this.items.filter(i => i.id !== id);
        this.save();
        this.render();
      }

      getQuarter(date) {
        const d = new Date(date);
        const q = Math.ceil((d.getMonth() + 1) / 3);
        return `Q${q} ${d.getFullYear()}`;
      }

      renderCard(item) {
        const statusColors = { 'planned': 'var(--a2)', 'in-progress': 'var(--a)', 'review': 'var(--y)', 'done': 'var(--g)' };
        return `
          <div class="card" data-id="${item.id}" draggable="true">
            <div class="card-title">${esc(item.title)}</div>
            ${item.desc ? `<div class="card-desc">${esc(item.desc)}</div>` : ''}
            <div class="card-meta">
              ${item.category ? `<span class="card-tag">${esc(item.category)}</span>` : ''}
              <span class="card-priority priority-${item.priority}">${item.priority}</span>
            </div>
            ${item.targetDate ? `<div class="card-date">📅 ${new Date(item.targetDate).toLocaleDateString()}</div>` : ''}
          </div>
        `;
      }

      render() {
        // Kanban
        const statuses = ['planned', 'in-progress', 'review', 'done'];
        statuses.forEach(status => {
          const items = this.items.filter(i => i.status === status);
          const container = document.querySelector(`[data-drop="${status}"]`);
          container.innerHTML = items.length ? items.map(i => this.renderCard(i)).join('') : '<div class="empty">No items</div>';
          document.querySelector(`[data-count="${status}"]`).textContent = items.length;
        });

        // Timeline
        const byQuarter = {};
        this.items.filter(i => i.targetDate).forEach(item => {
          const q = this.getQuarter(item.targetDate);
          if (!byQuarter[q]) byQuarter[q] = [];
          byQuarter[q].push(item);
        });

        const statusColors = { 'planned': 'var(--a2)', 'in-progress': 'var(--a)', 'review': 'var(--y)', 'done': 'var(--g)' };

        const quarters = Object.keys(byQuarter).sort();
        $('timeline').innerHTML = quarters.length ? quarters.map(q => `
          <div class="quarter">
            <div class="quarter-header">
              ${q}
              <span class="badge">${byQuarter[q].length} items</span>
            </div>
            <div class="timeline-items">
              ${byQuarter[q].map(item => `
                <div class="timeline-item" data-id="${item.id}">
                  <div class="timeline-status" style="background:${statusColors[item.status]}"></div>
                  <div class="timeline-content">
                    <div class="timeline-title">${esc(item.title)}</div>
                    ${item.desc ? `<div class="timeline-desc">${esc(item.desc)}</div>` : ''}
                    <div class="timeline-meta">
                      ${item.category ? `<span class="card-tag">${esc(item.category)}</span>` : ''}
                      <span class="card-priority priority-${item.priority}">${item.priority}</span>
                      <span class="card-date">📅 ${new Date(item.targetDate).toLocaleDateString()}</span>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('') : '<div class="empty">Add items with target dates to see the timeline</div>';
      }

      openModal(item = null) {
        this.editId = item?.id || null;
        $('modalTitle').textContent = item ? 'Edit Item' : 'Add Roadmap Item';
        $('deleteBtn').style.display = item ? 'block' : 'none';

        $('title').value = item?.title || '';
        $('desc').value = item?.desc || '';
        $('status').value = item?.status || 'planned';
        $('priority').value = item?.priority || 'medium';
        $('category').value = item?.category || '';
        $('targetDate').value = item?.targetDate || '';

        $('modal').classList.add('open');
      }

      init() {
        // Demo data
        if (this.items.length === 0) {
          const now = Date.now();
          this.items = [
            { id: '1', title: 'User Authentication', desc: 'Add login, signup, password reset', status: 'done', priority: 'high', category: 'Feature', targetDate: '2024-01-15' },
            { id: '2', title: 'Real-time Sync', desc: 'P2P data synchronization between devices', status: 'in-progress', priority: 'high', category: 'Feature', targetDate: '2024-02-01' },
            { id: '3', title: 'Mobile App', desc: 'React Native mobile application', status: 'planned', priority: 'medium', category: 'Feature', targetDate: '2024-03-15' },
            { id: '4', title: 'Performance Optimization', desc: 'Reduce bundle size, improve load times', status: 'review', priority: 'medium', category: 'Enhancement', targetDate: '2024-02-10' },
            { id: '5', title: 'API Documentation', desc: 'Complete API reference docs', status: 'planned', priority: 'low', category: 'Docs', targetDate: '2024-04-01' }
          ];
          this.save();
        }

        this.render();

        // View toggle
        document.querySelectorAll('.view-tabs button').forEach(btn => {
          btn.onclick = () => {
            document.querySelectorAll('.view-tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.view = btn.dataset.view;
            $('kanban').classList.toggle('active', this.view === 'kanban');
            $('timeline').classList.toggle('active', this.view === 'timeline');
          };
        });

        // Add button
        $('addBtn').onclick = () => this.openModal();
        $('cancelBtn').onclick = () => $('modal').classList.remove('open');
        $('deleteBtn').onclick = () => {
          if (this.editId) {
            this.delete(this.editId);
            $('modal').classList.remove('open');
          }
        };
        $('saveBtn').onclick = () => {
          const data = {
            title: $('title').value.trim(),
            desc: $('desc').value.trim(),
            status: $('status').value,
            priority: $('priority').value,
            category: $('category').value.trim(),
            targetDate: $('targetDate').value
          };

          if (data.title) {
            if (this.editId) {
              this.update(this.editId, data);
            } else {
              this.add(data);
            }
            $('modal').classList.remove('open');
          }
        };

        // Card click
        document.addEventListener('click', e => {
          const card = e.target.closest('.card, .timeline-item');
          if (card) {
            const item = this.items.find(i => i.id === card.dataset.id);
            if (item) this.openModal(item);
          }
        });

        // Drag and drop
        let dragId = null;

        document.addEventListener('dragstart', e => {
          if (e.target.classList.contains('card')) {
            dragId = e.target.dataset.id;
            e.target.style.opacity = '0.5';
          }
        });

        document.addEventListener('dragend', e => {
          if (e.target.classList.contains('card')) {
            e.target.style.opacity = '1';
          }
        });

        document.querySelectorAll('[data-drop]').forEach(zone => {
          zone.ondragover = e => e.preventDefault();
          zone.ondrop = e => {
            e.preventDefault();
            if (dragId) {
              const newStatus = zone.dataset.drop;
              this.update(dragId, { status: newStatus });
              dragId = null;
            }
          };
        });
      }
    }

    window.Roadmap = new Roadmap();
  </script>
</body>
</html>
