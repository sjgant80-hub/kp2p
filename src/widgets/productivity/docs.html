<!DOCTYPE html>
<!--
@file docs.html
@desc Docs Widget - Rich text document editor (Google Docs killer)
@api  window.Docs - document editor controller
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "docs",
    "name": "Docs",
    "icon": "📄",
    "desc": "Rich text editor",
    "body": "Google Docs killer. Rich text editing with formatting toolbar, P2P collaboration, version history.",
    "kills": ["Google Workspace $6/mo", "Notion $10/mo", "Coda $12/mo"],
    "price": 10,
    "color": "#00d9ff"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Docs</title>
  <style>
    :root{--b:#0a0a12;--b2:#12121e;--f:#e4e4e7;--a:#00d9ff;--a2:#7c3aed;--g:#10b981}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:14px/1.6 system-ui,sans-serif;background:var(--b);color:var(--f);min-height:100vh;display:flex;flex-direction:column}

    .header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--b2);border-bottom:1px solid rgba(255,255,255,.06)}
    .logo{font-size:24px}
    .doc-title{flex:1;padding:8px 12px;background:0;border:1px solid transparent;border-radius:6px;color:var(--f);font-size:16px;font-weight:500}
    .doc-title:hover{border-color:rgba(255,255,255,.1)}
    .doc-title:focus{outline:0;border-color:var(--a);background:rgba(0,0,0,.2)}
    .header-btns{display:flex;gap:8px}
    .header-btns button{padding:8px 16px;background:rgba(255,255,255,.06);border:0;border-radius:6px;color:var(--f);font-size:12px;cursor:pointer}
    .header-btns button:hover{background:rgba(255,255,255,.1)}
    .header-btns .share{background:var(--a);color:#000}
    .status{font-size:11px;color:#64748b;display:flex;align-items:center;gap:6px}
    .status .dot{width:6px;height:6px;background:var(--g);border-radius:50%}

    .toolbar{display:flex;gap:4px;padding:8px 20px;background:var(--b2);border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
    .toolbar button{width:32px;height:32px;background:0;border:0;border-radius:4px;color:#94a3b8;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .toolbar button:hover{background:rgba(255,255,255,.06);color:var(--f)}
    .toolbar button.active{background:rgba(0,217,255,.15);color:var(--a)}
    .toolbar .sep{width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 4px}
    .toolbar select{padding:6px 10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:4px;color:var(--f);font-size:12px}

    .main{display:flex;flex:1;overflow:hidden}

    .sidebar{width:220px;background:var(--b2);border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0}
    .sidebar-header{padding:16px;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
    .sidebar-header button{background:var(--a2);border:0;border-radius:4px;color:#fff;font-size:16px;width:24px;height:24px;cursor:pointer;line-height:1}

    .doc-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:background .1s}
    .doc-item:hover{background:rgba(255,255,255,.04)}
    .doc-item.active{background:rgba(0,217,255,.1);border-right:2px solid var(--a)}
    .doc-item .icon{font-size:18px}
    .doc-item .info{flex:1;min-width:0}
    .doc-item .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .doc-item .date{font-size:10px;color:#64748b}

    .editor-container{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .editor-wrapper{flex:1;overflow-y:auto;padding:40px;background:#0f0f1a}
    .editor{max-width:800px;margin:0 auto;min-height:100%;background:var(--b2);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:48px 64px;outline:0;font-size:15px;line-height:1.8}
    .editor:empty::before{content:attr(placeholder);color:#475569}

    .editor h1{font-size:28px;margin-bottom:16px;color:var(--f)}
    .editor h2{font-size:22px;margin:24px 0 12px;color:var(--f)}
    .editor h3{font-size:18px;margin:20px 0 8px;color:var(--f)}
    .editor p{margin-bottom:12px}
    .editor ul,.editor ol{margin:12px 0 12px 24px}
    .editor li{margin-bottom:4px}
    .editor blockquote{border-left:3px solid var(--a2);padding-left:16px;margin:16px 0;color:#94a3b8;font-style:italic}
    .editor code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px;font-family:'SF Mono',monospace;font-size:13px}
    .editor pre{background:rgba(0,0,0,.4);padding:16px;border-radius:8px;overflow-x:auto;margin:16px 0}
    .editor a{color:var(--a);text-decoration:none}
    .editor a:hover{text-decoration:underline}
    .editor hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:24px 0}

    .word-count{padding:8px 20px;background:var(--b2);border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#64748b;display:flex;gap:16px}

    @media(max-width:768px){
      .sidebar{display:none}
      .editor{padding:24px}
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">📄</span>
    <input type="text" class="doc-title" id="docTitle" value="Untitled Document">
    <div class="status"><span class="dot"></span> Saved</div>
    <div class="header-btns">
      <button id="exportBtn">Export</button>
      <button class="share" id="shareBtn">Share</button>
    </div>
  </div>

  <div class="toolbar">
    <select id="headingSelect">
      <option value="p">Normal</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
    </select>
    <span class="sep"></span>
    <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" title="Bullet List">•</button>
    <button data-cmd="insertOrderedList" title="Numbered List">1.</button>
    <button data-cmd="formatBlock:blockquote" title="Quote">❝</button>
    <span class="sep"></span>
    <button data-cmd="createLink" title="Link">🔗</button>
    <button data-cmd="insertHorizontalRule" title="Divider">—</button>
    <span class="sep"></span>
    <button data-cmd="undo" title="Undo">↩</button>
    <button data-cmd="redo" title="Redo">↪</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        Documents
        <button id="newDocBtn">+</button>
      </div>
      <div id="docList"></div>
    </div>

    <div class="editor-container">
      <div class="editor-wrapper">
        <div class="editor" id="editor" contenteditable="true" placeholder="Start typing..."></div>
      </div>
      <div class="word-count">
        <span><span id="wordCount">0</span> words</span>
        <span><span id="charCount">0</span> characters</span>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);

    class Docs {
      constructor() {
        this.documents = JSON.parse(localStorage.getItem('docs-list') || '[]');
        this.currentId = null;
        this.saveTimeout = null;
        this.init();
      }

      save() {
        if (!this.currentId) return;

        const doc = this.documents.find(d => d.id === this.currentId);
        if (doc) {
          doc.title = $('docTitle').value;
          doc.content = $('editor').innerHTML;
          doc.updated = Date.now();
          localStorage.setItem('docs-list', JSON.stringify(this.documents));
        }
      }

      autoSave() {
        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => this.save(), 500);
      }

      createDoc() {
        const doc = {
          id: Date.now().toString(36),
          title: 'Untitled Document',
          content: '',
          created: Date.now(),
          updated: Date.now()
        };
        this.documents.unshift(doc);
        this.save();
        this.loadDoc(doc.id);
        this.renderList();
      }

      loadDoc(id) {
        this.currentId = id;
        const doc = this.documents.find(d => d.id === id);
        if (doc) {
          $('docTitle').value = doc.title;
          $('editor').innerHTML = doc.content;
          this.updateCounts();
        }
        this.renderList();
      }

      deleteDoc(id) {
        this.documents = this.documents.filter(d => d.id !== id);
        localStorage.setItem('docs-list', JSON.stringify(this.documents));
        if (this.currentId === id) {
          if (this.documents.length > 0) {
            this.loadDoc(this.documents[0].id);
          } else {
            this.createDoc();
          }
        }
        this.renderList();
      }

      renderList() {
        $('docList').innerHTML = this.documents.map(doc => `
          <div class="doc-item ${doc.id === this.currentId ? 'active' : ''}" data-id="${doc.id}">
            <span class="icon">📄</span>
            <div class="info">
              <div class="name">${doc.title || 'Untitled'}</div>
              <div class="date">${new Date(doc.updated).toLocaleDateString()}</div>
            </div>
          </div>
        `).join('');
      }

      updateCounts() {
        const text = $('editor').innerText;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const chars = text.length;
        $('wordCount').textContent = words;
        $('charCount').textContent = chars;
      }

      execCmd(cmd, value = null) {
        if (cmd.includes(':')) {
          const [c, v] = cmd.split(':');
          document.execCommand('formatBlock', false, v);
        } else if (cmd === 'createLink') {
          const url = prompt('Enter URL:');
          if (url) document.execCommand(cmd, false, url);
        } else {
          document.execCommand(cmd, false, value);
        }
        $('editor').focus();
      }

      export() {
        const content = $('editor').innerHTML;
        const title = $('docTitle').value || 'document';
        const blob = new Blob([`
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>${title}</title>
          <style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6}</style>
          </head><body>${content}</body></html>
        `], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = title + '.html';
        a.click();
        URL.revokeObjectURL(url);
      }

      init() {
        // Load or create first doc
        if (this.documents.length === 0) {
          this.documents.push({
            id: 'welcome',
            title: 'Welcome to Docs',
            content: `
              <h1>Welcome to Docs! 📄</h1>
              <p>This is a simple, free document editor that works right in your browser.</p>
              <h2>Features</h2>
              <ul>
                <li><strong>Rich text editing</strong> - Bold, italic, headings, lists, and more</li>
                <li><strong>Auto-save</strong> - Your work is saved automatically</li>
                <li><strong>Multiple documents</strong> - Create and organize as many docs as you need</li>
                <li><strong>Export to HTML</strong> - Download your documents anytime</li>
                <li><strong>Zero cost</strong> - No subscription, no limits</li>
              </ul>
              <h2>Getting Started</h2>
              <p>Just start typing! Use the toolbar above to format your text, or try these shortcuts:</p>
              <ul>
                <li><code>Ctrl+B</code> - Bold</li>
                <li><code>Ctrl+I</code> - Italic</li>
                <li><code>Ctrl+U</code> - Underline</li>
              </ul>
              <blockquote>Tip: Click the + button in the sidebar to create a new document!</blockquote>
            `,
            created: Date.now(),
            updated: Date.now()
          });
          localStorage.setItem('docs-list', JSON.stringify(this.documents));
        }

        this.loadDoc(this.documents[0].id);
        this.renderList();

        // Editor events
        $('editor').oninput = () => {
          this.updateCounts();
          this.autoSave();
        };

        $('docTitle').oninput = () => this.autoSave();

        // Toolbar
        document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
          btn.onclick = () => this.execCmd(btn.dataset.cmd);
        });

        $('headingSelect').onchange = e => {
          document.execCommand('formatBlock', false, e.target.value);
          $('editor').focus();
        };

        // Sidebar
        $('docList').onclick = e => {
          const item = e.target.closest('.doc-item');
          if (item) this.loadDoc(item.dataset.id);
        };

        $('newDocBtn').onclick = () => this.createDoc();
        $('exportBtn').onclick = () => this.export();
        $('shareBtn').onclick = () => {
          navigator.clipboard.writeText(location.href + '?doc=' + this.currentId);
          alert('Link copied to clipboard!');
        };

        // Keyboard shortcuts
        $('editor').onkeydown = e => {
          if (e.ctrlKey || e.metaKey) {
            if (e.key === 'b') { e.preventDefault(); this.execCmd('bold'); }
            if (e.key === 'i') { e.preventDefault(); this.execCmd('italic'); }
            if (e.key === 'u') { e.preventDefault(); this.execCmd('underline'); }
          }
        };
      }
    }

    window.Docs = new Docs();
  </script>
</body>
</html>
