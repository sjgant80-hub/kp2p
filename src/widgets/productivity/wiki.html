<!DOCTYPE html>
<!--
KONOMI WIKI - Free Notion/Confluence Killer
Team wiki pages. P2P sync. $0 forever.

Usage:
?wiki=my-docs
?wiki=my-docs&page=getting-started
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "wiki",
    "name": "Wiki",
    "icon": "📖",
    "desc": "Team knowledge base",
    "body": "Notion/Confluence killer. Team wiki with rich text editing. Nested pages, search, version history.",
    "kills": ["Notion $10/mo", "Confluence $6/mo", "GitBook $8/mo"],
    "price": 10,
    "color": "#3b82f6"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wiki</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --primary: #3b82f6;
      --bg: #fff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      margin-bottom: 16px;
    }

    .sidebar-header h1 {
      font-size: 18px;
    }

    .search-box {
      margin-bottom: 16px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .nav-section {
      margin-bottom: 16px;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px;
      letter-spacing: 0.5px;
    }

    .nav-list {
      list-style: none;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .nav-item:hover {
      background: var(--bg);
    }

    .nav-item.active {
      background: var(--primary);
      color: white;
    }

    .nav-item-icon {
      font-size: 16px;
    }

    .add-page-btn {
      padding: 10px 12px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      margin-top: 8px;
      width: 100%;
      text-align: left;
    }

    .add-page-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-btn {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }

    .toolbar-btn:hover {
      background: var(--surface);
    }

    .toolbar-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .toolbar-spacer { flex: 1; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      max-width: 900px;
    }

    /* Editor */
    .page-title {
      font-size: 32px;
      font-weight: 700;
      border: none;
      background: none;
      width: 100%;
      color: var(--text);
      margin-bottom: 24px;
      outline: none;
    }

    .page-title::placeholder {
      color: var(--text-muted);
    }

    .editor {
      min-height: 400px;
      font-size: 16px;
      line-height: 1.7;
      outline: none;
    }

    .editor:empty:before {
      content: 'Start writing...';
      color: var(--text-muted);
    }

    .editor h1 { font-size: 28px; margin: 24px 0 16px; }
    .editor h2 { font-size: 22px; margin: 20px 0 12px; }
    .editor h3 { font-size: 18px; margin: 16px 0 10px; }
    .editor p { margin: 12px 0; }
    .editor ul, .editor ol { margin: 12px 0; padding-left: 24px; }
    .editor li { margin: 4px 0; }
    .editor code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
    }
    .editor pre {
      background: var(--surface);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 16px 0;
    }
    .editor pre code {
      background: none;
      padding: 0;
    }
    .editor blockquote {
      border-left: 4px solid var(--primary);
      padding-left: 16px;
      margin: 16px 0;
      color: var(--text-muted);
    }
    .editor a { color: var(--primary); }
    .editor hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* Page Meta */
    .page-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-state h2 {
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-state-btn {
      margin-top: 24px;
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .content { padding: 24px; }
    }

    .powered-by {
      padding: 16px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: auto;
    }

    .powered-by a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:24px;">📚</span>
        <h1 id="wiki-name">Wiki</h1>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search pages...">
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Pages</div>
        <ul class="nav-list" id="nav-list"></ul>
        <button class="add-page-btn" id="add-page-btn">+ Add Page</button>
      </div>

      <div class="powered-by">
        Powered by <a href="#">Konomi P2P</a>
      </div>
    </div>

    <div class="main">
      <div class="toolbar">
        <button class="toolbar-btn" id="btn-bold" title="Bold">B</button>
        <button class="toolbar-btn" id="btn-italic" title="Italic"><em>I</em></button>
        <button class="toolbar-btn" id="btn-h1" title="Heading 1">H1</button>
        <button class="toolbar-btn" id="btn-h2" title="Heading 2">H2</button>
        <button class="toolbar-btn" id="btn-ul" title="Bullet List">•</button>
        <button class="toolbar-btn" id="btn-ol" title="Numbered List">1.</button>
        <button class="toolbar-btn" id="btn-code" title="Code">&lt;/&gt;</button>
        <button class="toolbar-btn" id="btn-link" title="Link">🔗</button>
        <span class="toolbar-spacer"></span>
        <button class="toolbar-btn" id="btn-delete" title="Delete Page">🗑️</button>
      </div>

      <div class="content" id="content">
        <div class="empty-state" id="empty-state">
          <div class="empty-state-icon">📚</div>
          <h2>Welcome to your Wiki</h2>
          <p>Create your first page to get started</p>
          <button class="empty-state-btn" id="empty-create-btn">Create First Page</button>
        </div>

        <div id="page-view" style="display:none;">
          <input type="text" class="page-title" id="page-title" placeholder="Page title">
          <div class="page-meta" id="page-meta">Last edited: Never</div>
          <div class="editor" id="editor" contenteditable="true"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const WIKI_ID = params.get('wiki') || 'default';
    const INITIAL_PAGE = params.get('page');
    const STORAGE_KEY = `konomi-wiki:${WIKI_ID}`;

    let wiki = {
      name: WIKI_ID === 'default' ? 'Wiki' : WIKI_ID,
      pages: []
    };

    let currentPageId = null;
    let channel = null;
    let saveTimeout = null;

    function loadWiki() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) wiki = JSON.parse(stored);
      } catch (e) {}
    }

    function saveWiki() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(wiki));
    }

    function initP2P() {
      channel = new BroadcastChannel(`konomi-wiki:${WIKI_ID}`);
      channel.onmessage = (e) => {
        if (e.data.type === 'update') {
          wiki = e.data.wiki;
          saveWiki();
          renderNav();
          if (currentPageId) {
            const page = wiki.pages.find(p => p.id === currentPageId);
            if (page) {
              document.getElementById('page-title').value = page.title;
              document.getElementById('editor').innerHTML = page.content;
              updateMeta(page);
            }
          }
        }
      };
    }

    function broadcast() {
      channel.postMessage({ type: 'update', wiki });
    }

    function renderNav() {
      document.getElementById('wiki-name').textContent = wiki.name;
      const navList = document.getElementById('nav-list');

      navList.innerHTML = wiki.pages.map(page => `
        <li class="nav-item ${page.id === currentPageId ? 'active' : ''}" data-id="${page.id}">
          <span class="nav-item-icon">${page.icon || '📄'}</span>
          ${escapeHtml(page.title || 'Untitled')}
        </li>
      `).join('');

      navList.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => selectPage(item.dataset.id));
      });

      // Show/hide empty state
      if (wiki.pages.length === 0) {
        document.getElementById('empty-state').style.display = 'block';
        document.getElementById('page-view').style.display = 'none';
      }
    }

    function selectPage(pageId) {
      currentPageId = pageId;
      const page = wiki.pages.find(p => p.id === pageId);

      if (page) {
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('page-view').style.display = 'block';
        document.getElementById('page-title').value = page.title;
        document.getElementById('editor').innerHTML = page.content;
        updateMeta(page);
      }

      renderNav();

      // Update URL
      const url = new URL(location);
      url.searchParams.set('page', page.slug || pageId);
      history.replaceState({}, '', url);
    }

    function updateMeta(page) {
      const meta = document.getElementById('page-meta');
      if (page.updated) {
        meta.textContent = `Last edited: ${new Date(page.updated).toLocaleString()}`;
      } else {
        meta.textContent = 'Last edited: Never';
      }
    }

    function createPage() {
      const page = {
        id: crypto.randomUUID(),
        title: 'Untitled',
        slug: 'untitled-' + Date.now(),
        content: '',
        icon: '📄',
        created: Date.now(),
        updated: Date.now()
      };

      wiki.pages.push(page);
      saveWiki();
      broadcast();
      selectPage(page.id);
    }

    function deletePage() {
      if (!currentPageId) return;
      if (!confirm('Delete this page?')) return;

      wiki.pages = wiki.pages.filter(p => p.id !== currentPageId);
      currentPageId = null;
      saveWiki();
      broadcast();
      renderNav();

      if (wiki.pages.length > 0) {
        selectPage(wiki.pages[0].id);
      }
    }

    function saveCurrentPage() {
      if (!currentPageId) return;
      const page = wiki.pages.find(p => p.id === currentPageId);
      if (!page) return;

      page.title = document.getElementById('page-title').value;
      page.content = document.getElementById('editor').innerHTML;
      page.slug = slugify(page.title);
      page.updated = Date.now();

      saveWiki();
      broadcast();
      renderNav();
      updateMeta(page);
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // Toolbar
    document.getElementById('btn-bold').addEventListener('click', () => {
      document.execCommand('bold');
    });

    document.getElementById('btn-italic').addEventListener('click', () => {
      document.execCommand('italic');
    });

    document.getElementById('btn-h1').addEventListener('click', () => {
      document.execCommand('formatBlock', false, 'h1');
    });

    document.getElementById('btn-h2').addEventListener('click', () => {
      document.execCommand('formatBlock', false, 'h2');
    });

    document.getElementById('btn-ul').addEventListener('click', () => {
      document.execCommand('insertUnorderedList');
    });

    document.getElementById('btn-ol').addEventListener('click', () => {
      document.execCommand('insertOrderedList');
    });

    document.getElementById('btn-code').addEventListener('click', () => {
      const selection = window.getSelection().toString();
      if (selection) {
        document.execCommand('insertHTML', false, `<code>${selection}</code>`);
      }
    });

    document.getElementById('btn-link').addEventListener('click', () => {
      const url = prompt('Enter URL:');
      if (url) {
        document.execCommand('createLink', false, url);
      }
    });

    document.getElementById('btn-delete').addEventListener('click', deletePage);

    // Auto-save
    document.getElementById('page-title').addEventListener('input', () => {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveCurrentPage, 500);
    });

    document.getElementById('editor').addEventListener('input', () => {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveCurrentPage, 500);
    });

    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.nav-item').forEach(item => {
        const title = item.textContent.toLowerCase();
        item.style.display = title.includes(query) ? 'flex' : 'none';
      });
    });

    // Create page buttons
    document.getElementById('add-page-btn').addEventListener('click', createPage);
    document.getElementById('empty-create-btn').addEventListener('click', createPage);

    // Init
    loadWiki();
    initP2P();
    renderNav();

    // Open initial page
    if (INITIAL_PAGE) {
      const page = wiki.pages.find(p => p.slug === INITIAL_PAGE || p.id === INITIAL_PAGE);
      if (page) selectPage(page.id);
    } else if (wiki.pages.length > 0) {
      selectPage(wiki.pages[0].id);
    }

    document.title = `${wiki.name} | Wiki`;

    window.KonomiWiki = { getWiki: () => wiki, createPage };
  </script>
</body>
</html>
