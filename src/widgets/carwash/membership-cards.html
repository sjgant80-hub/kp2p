<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Membership Cards - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"membership-cards","name":"Membership Cards","icon":"💳","desc":"Manage car wash memberships","category":"carwash","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#06b6d4}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.card{background:linear-gradient(135deg,#1a1a1a,#252525);border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.member{font-weight:600}
.tier{padding:4px 10px;border-radius:4px;font-size:.75rem}
.tier.bronze{background:#cd7f3233;color:#cd7f32}
.tier.silver{background:#c0c0c033;color:#c0c0c0}
.tier.gold{background:#ffd70033;color:#ffd700}
.tier.platinum{background:#06b6d433;color:#06b6d4}
.info{font-size:.875rem;color:#888;margin-bottom:10px}
.washes{background:#252525;padding:15px;border-radius:8px;margin:15px 0;text-align:center}
.washes-count{font-size:2rem;font-weight:bold;color:#06b6d4}
.washes-label{font-size:.75rem;color:#888}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;background:#06b6d4;color:#000}
</style>
</head>
<body>
<div class="header"><h1>💳 Membership Cards</h1><button class="btn" style="width:auto;padding:8px 16px" onclick="alert('New')">+ New Member</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">245</div><div class="stat-label">Total Members</div></div>
<div class="stat"><div class="stat-value">$8.5k</div><div class="stat-label">Monthly Rev</div></div>
<div class="stat"><div class="stat-value">18</div><div class="stat-label">New This Month</div></div>
<div class="stat"><div class="stat-value">92%</div><div class="stat-label">Retention</div></div>
</div>
<div class="grid" id="grid"></div>
<script>
const members=[
{name:'John Smith',vehicle:'Toyota Camry',plate:'ABC-123',tier:'gold',plan:'Unlimited',price:39,washes:12,expires:'Jan 15, 2025'},
{name:'Sarah Johnson',vehicle:'Honda CR-V',plate:'XYZ-789',tier:'platinum',plan:'Ultimate',price:59,washes:18,expires:'Feb 1, 2025'},
{name:'Mike Davis',vehicle:'Ford F-150',plate:'DEF-456',tier:'silver',plan:'Basic',price:25,washes:6,expires:'Jan 20, 2025'},
{name:'Emma Wilson',vehicle:'Tesla Model 3',plate:'GHI-321',tier:'bronze',plan:'Starter',price:15,washes:3,expires:'Dec 31, 2024'}
];
document.getElementById('grid').innerHTML=members.map(m=>`
<div class="card">
<div class="card-header"><span class="member">${m.name}</span><span class="tier ${m.tier}">${m.tier.toUpperCase()}</span></div>
<div class="info">🚗 ${m.vehicle} • ${m.plate}</div>
<div class="info">📋 ${m.plan} Plan • $${m.price}/mo</div>
<div class="washes"><div class="washes-count">${m.washes}</div><div class="washes-label">Washes this month</div></div>
<div class="info">📅 Renews: ${m.expires}</div>
<button class="btn" onclick="alert('Scan')">Scan for Wash</button>
</div>`).join('');
</script>
</body>
</html>
