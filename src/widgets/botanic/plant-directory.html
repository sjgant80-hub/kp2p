<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Directory - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"plant-directory","name":"Plant Directory","icon":"🌿","desc":"Garden plant catalog","category":"botanic","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.search{display:flex;gap:10px;margin-bottom:20px}
.search input{flex:1;padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.search button{padding:12px 20px;background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.filter.active{background:#22c55e;border-color:#22c55e}
.plants{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.plant{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.plant-image{height:140px;background:linear-gradient(135deg,#166534 0%,#14532d 100%);display:flex;align-items:center;justify-content:center;font-size:4rem}
.plant-body{padding:20px}
.plant-name{font-size:1.125rem;font-weight:bold;margin-bottom:3px}
.plant-latin{font-size:.75rem;color:#888;font-style:italic;margin-bottom:10px}
.plant-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{padding:3px 8px;background:#252525;border-radius:4px;font-size:.65rem}
.plant-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:.75rem}
.info-item{text-align:center}
.info-icon{font-size:1rem;margin-bottom:2px}
.info-text{color:#888}
</style>
</head>
<body>
<div class="header"><h1>🌿 Plant Directory</h1></div>
<div class="search">
<input type="text" placeholder="Search by common or scientific name...">
<button>🔍 Search</button>
</div>
<div class="filters">
<button class="filter active">All</button>
<button class="filter">Trees</button>
<button class="filter">Shrubs</button>
<button class="filter">Flowers</button>
<button class="filter">Ferns</button>
<button class="filter">Succulents</button>
</div>
<div class="plants" id="plants"></div>
<script>
const plants=[
{name:'Japanese Maple',latin:'Acer palmatum',icon:'🍁',tags:['Tree','Deciduous','Asian'],sun:'Partial',water:'Medium',zone:'5-9'},
{name:'Blue Hydrangea',latin:'Hydrangea macrophylla',icon:'💐',tags:['Shrub','Flowering','Native'],sun:'Partial',water:'High',zone:'5-9'},
{name:'Bird of Paradise',latin:'Strelitzia reginae',icon:'🌺',tags:['Tropical','Flowering','Exotic'],sun:'Full',water:'Medium',zone:'10-12'},
{name:'Boston Fern',latin:'Nephrolepis exaltata',icon:'🌿',tags:['Fern','Evergreen','Shade'],sun:'Shade',water:'High',zone:'9-11'},
{name:'Lavender',latin:'Lavandula angustifolia',icon:'💜',tags:['Herb','Flowering','Fragrant'],sun:'Full',water:'Low',zone:'5-9'},
{name:'Aloe Vera',latin:'Aloe barbadensis',icon:'🌵',tags:['Succulent','Medicinal','Drought'],sun:'Full',water:'Low',zone:'9-11'}
];
document.getElementById('plants').innerHTML=plants.map(p=>`
<div class="plant">
<div class="plant-image">${p.icon}</div>
<div class="plant-body">
<div class="plant-name">${p.name}</div>
<div class="plant-latin">${p.latin}</div>
<div class="plant-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<div class="plant-info">
<div class="info-item"><div class="info-icon">☀️</div><div class="info-text">${p.sun}</div></div>
<div class="info-item"><div class="info-icon">💧</div><div class="info-text">${p.water}</div></div>
<div class="info-item"><div class="info-icon">🌡️</div><div class="info-text">${p.zone}</div></div>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
