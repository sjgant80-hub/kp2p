<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seasonal Calendar - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"seasonal-calendar","name":"Seasonal Calendar","icon":"🌸","desc":"Bloom and event schedule","category":"botanic","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.current{background:linear-gradient(135deg,#166534 0%,#14532d 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.current-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.current-title{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.current-blooms{display:flex;gap:10px;flex-wrap:wrap}
.bloom{padding:8px 15px;background:#ffffff22;border-radius:6px;font-size:.875rem}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.month{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.month-header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.month-name{font-weight:bold}
.month-badge{padding:4px 10px;background:#22c55e33;color:#22c55e;border-radius:4px;font-size:.75rem}
.month-items{padding:15px 20px}
.month-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #252525}
.month-item:last-child{border-bottom:none}
.item-icon{font-size:1.25rem}
.item-info{flex:1}
.item-name{font-size:.875rem;font-weight:500}
.item-type{font-size:.7rem;color:#888}
.item-status{font-size:.65rem;padding:3px 8px;border-radius:4px;background:#22c55e33;color:#22c55e}
</style>
</head>
<body>
<div class="header"><h1>🌸 Seasonal Calendar</h1><button class="btn">Plan Visit</button></div>
<div class="current">
<div class="current-label">NOW BLOOMING</div>
<div class="current-title">Winter Wonderland</div>
<div class="current-blooms">
<span class="bloom">🌺 Camellias</span>
<span class="bloom">❄️ Hellebores</span>
<span class="bloom">🌼 Witch Hazel</span>
<span class="bloom">🌸 Winter Jasmine</span>
</div>
</div>
<div class="months" id="months"></div>
<script>
const months=[
{name:'January',count:12,items:[{icon:'🌺',name:'Camellia Garden',type:'Peak Bloom'},{icon:'❄️',name:'Winter Greenhouse',type:'Indoor Exhibit'},{icon:'🎋',name:'Japanese Garden',type:'Winter Interest'}]},
{name:'February',count:15,items:[{icon:'🌸',name:'Early Magnolias',type:'Starting'},{icon:'🌷',name:'Tulip Preview',type:'Greenhouse'},{icon:'💜',name:'Crocus Meadow',type:'Peak Bloom'}]},
{name:'March',count:24,items:[{icon:'🌸',name:'Cherry Blossoms',type:'Peak Bloom'},{icon:'🌷',name:'Tulip Festival',type:'Special Event'},{icon:'🌼',name:'Daffodil Hill',type:'Peak Bloom'}]},
{name:'April',count:38,items:[{icon:'🌹',name:'Rose Garden Opening',type:'Season Start'},{icon:'🪻',name:'Iris Collection',type:'Peak Bloom'},{icon:'🌺',name:'Azalea Walk',type:'Peak Bloom'}]}
];
document.getElementById('months').innerHTML=months.map(m=>`
<div class="month">
<div class="month-header">
<span class="month-name">${m.name}</span>
<span class="month-badge">${m.count} species</span>
</div>
<div class="month-items">${m.items.map(i=>`
<div class="month-item">
<span class="item-icon">${i.icon}</span>
<div class="item-info">
<div class="item-name">${i.name}</div>
<div class="item-type">${i.type}</div>
</div>
<span class="item-status">VIEW</span>
</div>`).join('')}</div>
</div>`).join('');
</script>
</body>
</html>
