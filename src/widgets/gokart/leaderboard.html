<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"kart-leaderboard","name":"Kart Leaderboard","icon":"🏆","desc":"Track lap times and rankings","category":"gokart","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#f97316;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{padding:10px 20px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.tab.active{background:#f97316;border-color:#f97316;color:#fff}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:30px}
.podium-spot{text-align:center;padding:20px;border-radius:8px 8px 0 0}
.podium-1{background:linear-gradient(180deg,#fbbf24 0%,#f59e0b 100%);height:160px;order:2}
.podium-2{background:linear-gradient(180deg,#9ca3af 0%,#6b7280 100%);height:120px;order:1}
.podium-3{background:linear-gradient(180deg,#d97706 0%,#b45309 100%);height:100px;order:3}
.podium-rank{font-size:2rem;font-weight:bold}
.podium-name{font-weight:bold;margin:10px 0 5px}
.podium-time{font-size:.875rem;opacity:.9}
.leaderboard{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.leader-row{display:grid;grid-template-columns:60px 1fr 100px 100px;align-items:center;padding:15px 20px;border-bottom:1px solid #333}
.leader-row:last-child{border-bottom:none}
.leader-row.header{background:#252525;font-size:.75rem;color:#888}
.leader-rank{font-size:1.25rem;font-weight:bold;text-align:center}
.leader-rank.top3{color:#f97316}
.leader-name{font-weight:500}
.leader-time{font-family:monospace;font-size:1rem}
.leader-date{font-size:.875rem;color:#888}
.my-row{background:#f9731622}
</style>
</head>
<body>
<div class="header"><h1>🏆 Leaderboard</h1><button class="btn">My Times</button></div>
<div class="tabs">
<button class="tab active">All Time</button>
<button class="tab">Today</button>
<button class="tab">This Week</button>
<button class="tab">This Month</button>
</div>
<div class="podium">
<div class="podium-spot podium-2"><div class="podium-rank">🥈</div><div class="podium-name">Speed_Demon</div><div class="podium-time">42.847s</div></div>
<div class="podium-spot podium-1"><div class="podium-rank">🥇</div><div class="podium-name">TurboMax</div><div class="podium-time">42.312s</div></div>
<div class="podium-spot podium-3"><div class="podium-rank">🥉</div><div class="podium-name">RacerX</div><div class="podium-time">43.124s</div></div>
</div>
<div class="leaderboard">
<div class="leader-row header"><span>Rank</span><span>Racer</span><span>Best Lap</span><span>Date</span></div>
<div class="leader-row"><span class="leader-rank top3">1</span><span class="leader-name">TurboMax</span><span class="leader-time">42.312s</span><span class="leader-date">Dec 15</span></div>
<div class="leader-row"><span class="leader-rank top3">2</span><span class="leader-name">Speed_Demon</span><span class="leader-time">42.847s</span><span class="leader-date">Dec 22</span></div>
<div class="leader-row"><span class="leader-rank top3">3</span><span class="leader-name">RacerX</span><span class="leader-time">43.124s</span><span class="leader-date">Dec 10</span></div>
<div class="leader-row"><span class="leader-rank">4</span><span class="leader-name">DriftKing</span><span class="leader-time">43.456s</span><span class="leader-date">Dec 18</span></div>
<div class="leader-row"><span class="leader-rank">5</span><span class="leader-name">NitroNinja</span><span class="leader-time">43.789s</span><span class="leader-date">Dec 20</span></div>
<div class="leader-row my-row"><span class="leader-rank">6</span><span class="leader-name">You 👤</span><span class="leader-time">44.125s</span><span class="leader-date">Today</span></div>
<div class="leader-row"><span class="leader-rank">7</span><span class="leader-name">FastEddie</span><span class="leader-time">44.321s</span><span class="leader-date">Dec 19</span></div>
<div class="leader-row"><span class="leader-rank">8</span><span class="leader-name">ApexPro</span><span class="leader-time">44.567s</span><span class="leader-date">Dec 21</span></div>
</div>
</body>
</html>
