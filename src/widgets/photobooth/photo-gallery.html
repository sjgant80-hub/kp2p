<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Gallery - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"photo-gallery","name":"Photo Gallery","icon":"🖼️","desc":"Event photo galleries","category":"photobooth","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#ec4899;color:#fff;border:none;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#ec4899}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:30px}
.event{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden;cursor:pointer}
.event:hover{border-color:#ec4899}
.event-preview{height:150px;background:#252525;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px}
.preview-img{background:#333;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.event-info{padding:15px}
.event-name{font-weight:600;margin-bottom:5px}
.event-meta{font-size:.875rem;color:#888;display:flex;justify-content:space-between}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{aspect-ratio:1;background:#1a1a1a;border-radius:8px;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;position:relative}
.photo:hover{border-color:#ec4899}
.photo-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:10px;opacity:0;transition:opacity .2s}
.photo:hover .photo-overlay{opacity:1}
.photo-actions{display:flex;gap:5px;justify-content:center}
.photo-btn{padding:5px 10px;background:#ec4899;border:none;border-radius:4px;color:#fff;font-size:.75rem;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>🖼️ Photo Gallery</h1><button class="btn">Upload Photos</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">2.4k</div><div class="stat-label">Total Photos</div></div>
<div class="stat"><div class="stat-value">28</div><div class="stat-label">Events</div></div>
<div class="stat"><div class="stat-value">856</div><div class="stat-label">Downloads</div></div>
<div class="stat"><div class="stat-value">342</div><div class="stat-label">Shares</div></div>
</div>
<h2 style="margin-bottom:15px">Recent Events</h2>
<div class="events" id="events"></div>
<h2 style="margin-bottom:15px">Latest Photos</h2>
<div class="photos-grid" id="photos"></div>
<script>
const events=[
{name:'Johnson Wedding',date:'Dec 20, 2024',photos:248,icon:'💒'},
{name:'TechCorp Party',date:'Dec 15, 2024',photos:156,icon:'🎄'},
{name:'Miller Anniversary',date:'Dec 10, 2024',photos:92,icon:'💕'},
{name:'Sweet 16 - Maya',date:'Dec 5, 2024',photos:134,icon:'🎂'}
];
document.getElementById('events').innerHTML=events.map(e=>`
<div class="event">
<div class="event-preview">${[1,2,3,4].map(()=>`<div class="preview-img">${e.icon}</div>`).join('')}</div>
<div class="event-info"><div class="event-name">${e.name}</div><div class="event-meta"><span>📅 ${e.date}</span><span>📷 ${e.photos} photos</span></div></div>
</div>`).join('');
const emojis=['😄','🎉','💃','🕺','🥳','😍','🤩','✨','💕','🎊','👯','🌟'];
document.getElementById('photos').innerHTML=Array(12).fill(0).map((_,i)=>`
<div class="photo">${emojis[i]}
<div class="photo-overlay"><div class="photo-actions"><button class="photo-btn">Download</button><button class="photo-btn">Share</button></div></div>
</div>`).join('');
</script>
</body>
</html>
