<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Bookings - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"event-bookings","name":"Event Bookings","icon":"📸","desc":"Book photo booth events","category":"photobooth","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#ec4899;color:#fff;border:none;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#ec4899}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.booking{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.booking-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.event-name{font-size:1.125rem;font-weight:bold}
.status{padding:6px 12px;border-radius:6px;font-size:.75rem}
.status.confirmed{background:#22c55e33;color:#22c55e}
.status.pending{background:#f59e0b33;color:#f59e0b}
.status.completed{background:#3b82f633;color:#3b82f6}
.booking-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:15px}
.detail{display:flex;flex-direction:column}
.detail-label{font-size:.75rem;color:#888}
.detail-value{font-size:.875rem;margin-top:2px}
.packages{display:flex;gap:10px;flex-wrap:wrap}
.package{padding:6px 12px;background:#ec489933;color:#ec4899;border-radius:6px;font-size:.75rem}
.booking-actions{display:flex;gap:10px;margin-top:15px}
.action-btn{padding:10px 20px;border:1px solid #333;background:#252525;color:#e0e0e0;border-radius:6px;cursor:pointer}
.action-btn.primary{background:#ec4899;border-color:#ec4899;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>📸 Event Bookings</h1><button class="btn">+ New Booking</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">3</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">This Month</div></div>
<div class="stat"><div class="stat-value">$8.5k</div><div class="stat-label">Revenue</div></div>
<div class="stat"><div class="stat-value">4.9★</div><div class="stat-label">Rating</div></div>
</div>
<div class="list" id="list"></div>
<script>
const bookings=[
{event:'Johnson Wedding',status:'confirmed',date:'Dec 28, 2024',time:'6:00 PM - 11:00 PM',venue:'Grand Ballroom, Hilton',contact:'Sarah Johnson',phone:'555-0123',packages:['Premium Booth','Props Package','Digital Gallery','Prints']},
{event:'TechCorp Holiday Party',status:'confirmed',date:'Dec 29, 2024',time:'7:00 PM - 10:00 PM',venue:'TechCorp HQ',contact:'Mike Chen',phone:'555-0456',packages:['Standard Booth','Green Screen','Social Sharing']},
{event:'Sweet 16 - Emma',status:'pending',date:'Jan 5, 2025',time:'4:00 PM - 8:00 PM',venue:'Community Center',contact:'Lisa Williams',phone:'555-0789',packages:['Glam Booth','Props','Prints']},
{event:'Miller Anniversary',status:'completed',date:'Dec 20, 2024',time:'5:00 PM - 9:00 PM',venue:'The Garden Venue',contact:'Tom Miller',phone:'555-0321',packages:['Premium Booth','Video Messages','Album']}
];
document.getElementById('list').innerHTML=bookings.map(b=>`
<div class="booking">
<div class="booking-header"><span class="event-name">🎉 ${b.event}</span><span class="status ${b.status}">${b.status.toUpperCase()}</span></div>
<div class="booking-details">
<div class="detail"><span class="detail-label">Date</span><span class="detail-value">📅 ${b.date}</span></div>
<div class="detail"><span class="detail-label">Time</span><span class="detail-value">🕐 ${b.time}</span></div>
<div class="detail"><span class="detail-label">Venue</span><span class="detail-value">📍 ${b.venue}</span></div>
<div class="detail"><span class="detail-label">Contact</span><span class="detail-value">👤 ${b.contact} (${b.phone})</span></div>
</div>
<div class="packages">${b.packages.map(p=>`<span class="package">${p}</span>`).join('')}</div>
<div class="booking-actions"><button class="action-btn">View Details</button><button class="action-btn">Edit</button><button class="action-btn primary">${b.status==='completed'?'View Photos':'Send Reminder'}</button></div>
</div>`).join('');
</script>
</body>
</html>
