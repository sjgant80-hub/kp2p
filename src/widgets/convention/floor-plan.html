<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floor Plan - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"floor-plan","name":"Floor Plan","icon":"🏢","desc":"Exhibit hall map","category":"convention","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#8b5cf6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.search{display:flex;gap:10px;margin-bottom:20px}
.search input{flex:1;padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.search button{padding:12px 20px;background:#8b5cf6;color:#fff;border:none;border-radius:6px;cursor:pointer}
.halls{display:flex;gap:10px;margin-bottom:20px}
.hall{padding:10px 20px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.hall.active{background:#8b5cf6;border-color:#8b5cf6}
.exhibitors{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.exhibitor{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.exhibitor-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}
.exhibitor-booth{background:#8b5cf6;color:#fff;padding:4px 10px;border-radius:4px;font-size:.75rem;font-weight:bold}
.exhibitor-type{font-size:.65rem;color:#888;padding:4px 8px;background:#252525;border-radius:4px}
.exhibitor-name{font-size:1.125rem;font-weight:bold;margin-bottom:5px}
.exhibitor-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.exhibitor-footer{display:flex;justify-content:space-between;align-items:center;font-size:.75rem}
.exhibitor-location{color:#888}
.exhibitor-action{color:#8b5cf6;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>🏢 Floor Plan</h1><button class="btn">My Schedule</button></div>
<div class="search">
<input type="text" placeholder="Search exhibitors...">
<button>🔍 Find</button>
</div>
<div class="halls">
<button class="hall active">Hall A</button>
<button class="hall">Hall B</button>
<button class="hall">Hall C</button>
<button class="hall">Startup Alley</button>
</div>
<div class="exhibitors" id="exhibitors"></div>
<script>
const exhibitors=[
{booth:'A101',name:'TechCorp Industries',type:'Platinum',desc:'Enterprise software solutions for modern businesses. Live demos hourly.',hall:'Hall A',aisle:'1'},
{booth:'A115',name:'CloudFirst',type:'Gold',desc:'Cloud infrastructure and DevOps tools. Free t-shirts!',hall:'Hall A',aisle:'1'},
{booth:'A203',name:'AI Dynamics',type:'Gold',desc:'Machine learning and AI automation platform demos.',hall:'Hall A',aisle:'2'},
{booth:'A218',name:'SecureNet',type:'Silver',desc:'Cybersecurity solutions for enterprise and SMB.',hall:'Hall A',aisle:'2'},
{booth:'A301',name:'DataViz Pro',type:'Silver',desc:'Business intelligence and data visualization tools.',hall:'Hall A',aisle:'3'},
{booth:'A312',name:'StartupXYZ',type:'Startup',desc:'Revolutionary SaaS platform. Launching today!',hall:'Hall A',aisle:'3'}
];
document.getElementById('exhibitors').innerHTML=exhibitors.map(e=>`
<div class="exhibitor">
<div class="exhibitor-header">
<span class="exhibitor-booth">${e.booth}</span>
<span class="exhibitor-type">${e.type.toUpperCase()}</span>
</div>
<div class="exhibitor-name">${e.name}</div>
<div class="exhibitor-desc">${e.desc}</div>
<div class="exhibitor-footer">
<span class="exhibitor-location">📍 ${e.hall}, Aisle ${e.aisle}</span>
<span class="exhibitor-action">Get Directions →</span>
</div>
</div>`).join('');
</script>
</body>
</html>
