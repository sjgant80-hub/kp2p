<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retreat Booking - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"retreat-booking","name":"Retreat Booking","icon":"🏔️","desc":"Book spiritual retreats","category":"monastery","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.featured{background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.featured-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.featured-title{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.featured-info{display:flex;gap:20px;font-size:.875rem;opacity:.9}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.filter.active{background:#7c3aed;border-color:#7c3aed}
.retreats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px}
.retreat{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.retreat-image{height:120px;background:#252525;display:flex;align-items:center;justify-content:center;font-size:3rem}
.retreat-body{padding:20px}
.retreat-type{font-size:.7rem;color:#7c3aed;margin-bottom:5px}
.retreat-title{font-size:1.125rem;font-weight:bold;margin-bottom:5px}
.retreat-dates{font-size:.875rem;color:#888;margin-bottom:10px}
.retreat-desc{font-size:.875rem;color:#888;line-height:1.5;margin-bottom:15px}
.retreat-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.retreat-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.retreat-spots{font-size:.75rem;color:#888}
.book-btn{width:100%;padding:12px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>🏔️ Retreats</h1><button class="btn">My Bookings</button></div>
<div class="featured">
<div class="featured-label">UPCOMING RETREAT</div>
<div class="featured-title">Lenten Silent Retreat</div>
<div class="featured-info">
<span>📅 March 1-7, 2025</span>
<span>🏠 6 nights</span>
<span>👥 8 spots remaining</span>
</div>
</div>
<div class="filters">
<button class="filter active">All Retreats</button>
<button class="filter">Weekend</button>
<button class="filter">Week-long</button>
<button class="filter">Silent</button>
<button class="filter">Directed</button>
</div>
<div class="retreats" id="retreats"></div>
<script>
const retreats=[
{icon:'🌅',type:'WEEKEND',title:'Introduction to Contemplative Prayer',dates:'Feb 14-16, 2025',duration:'2 nights',desc:'A gentle introduction to the practice of contemplative prayer and silent meditation.',price:350,spots:4,total:12},
{icon:'🤫',type:'SILENT',title:'Seven-Day Silent Retreat',dates:'March 1-7, 2025',duration:'6 nights',desc:'Deep silence, daily liturgy, spiritual direction, and time for personal reflection.',price:875,spots:8,total:15},
{icon:'📖',type:'DIRECTED',title:'Ignatian Spiritual Exercises',dates:'March 21-28, 2025',duration:'7 nights',desc:'The full Spiritual Exercises of St. Ignatius with daily one-on-one direction.',price:950,spots:3,total:8},
{icon:'🌿',type:'WEEKEND',title:'Nature & Spirituality',dates:'April 4-6, 2025',duration:'2 nights',desc:'Explore the sacred through mindful walks, outdoor meditation, and eco-spirituality.',price:325,spots:10,total:16},
{icon:'✍️',type:'WORKSHOP',title:'Icon Writing Retreat',dates:'April 18-20, 2025',duration:'2 nights',desc:'Learn the ancient art of iconography as a form of prayer and meditation.',price:450,spots:6,total:10},
{icon:'🎵',type:'WEEKEND',title:'Chant & Sacred Music',dates:'May 2-4, 2025',duration:'2 nights',desc:'Immerse yourself in Gregorian chant, sacred polyphony, and contemplative music.',price:375,spots:12,total:20}
];
document.getElementById('retreats').innerHTML=retreats.map(r=>`
<div class="retreat">
<div class="retreat-image">${r.icon}</div>
<div class="retreat-body">
<div class="retreat-type">${r.type}</div>
<div class="retreat-title">${r.title}</div>
<div class="retreat-dates">📅 ${r.dates} • ${r.duration}</div>
<div class="retreat-desc">${r.desc}</div>
<div class="retreat-meta">
<div class="retreat-price">$${r.price}</div>
<div class="retreat-spots">${r.spots} of ${r.total} spots left</div>
</div>
<button class="book-btn">Book Retreat</button>
</div>
</div>`).join('');
</script>
</body>
</html>
