<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Tracker - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"route-tracker","name":"Route Tracker","icon":"🧗","desc":"Track climbing routes","category":"climbing","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#f59e0b;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#f59e0b}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.wall{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.wall-header{padding:15px 20px;background:#252525;display:flex;justify-content:space-between;align-items:center}
.wall-name{font-weight:600}
.wall-count{font-size:.875rem;color:#888}
.routes{padding:15px}
.route{display:flex;align-items:center;gap:15px;padding:12px;background:#252525;border-radius:8px;margin-bottom:8px}
.grade{padding:8px 12px;border-radius:6px;font-weight:bold;min-width:50px;text-align:center}
.grade-beginner{background:#22c55e33;color:#22c55e}
.grade-intermediate{background:#3b82f633;color:#3b82f6}
.grade-advanced{background:#f59e0b33;color:#f59e0b}
.grade-expert{background:#ef444433;color:#ef4444}
.route-info{flex:1}
.route-name{font-weight:500}
.route-setter{font-size:.75rem;color:#888}
.route-status{font-size:.75rem;padding:4px 8px;border-radius:4px;background:#333}
</style>
</head>
<body>
<div class="header"><h1>🧗 Route Tracker</h1><button class="btn">+ Add Route</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">48</div><div class="stat-label">Active Routes</div></div>
<div class="stat"><div class="stat-value">6</div><div class="stat-label">Walls</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">New This Week</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">Reset Soon</div></div>
</div>
<div class="walls" id="walls"></div>
<script>
const walls=[
{name:'Main Wall',routes:[{name:'Yellow Ladder',grade:'5.8',setter:'Mike',type:'beginner'},{name:'Blue Thunder',grade:'5.10a',setter:'Sarah',type:'intermediate'},{name:'Red Dragon',grade:'5.11c',setter:'Mike',type:'advanced'}]},
{name:'Overhang Cave',routes:[{name:'Roof Crusher',grade:'5.12a',setter:'Jake',type:'expert'},{name:'Bat Hang',grade:'5.11a',setter:'Sarah',type:'advanced'}]},
{name:'Slab Wall',routes:[{name:'Balance Act',grade:'5.9',setter:'Lisa',type:'intermediate'},{name:'Friction Master',grade:'5.10b',setter:'Mike',type:'intermediate'}]}
];
document.getElementById('walls').innerHTML=walls.map(w=>`
<div class="wall">
<div class="wall-header"><span class="wall-name">${w.name}</span><span class="wall-count">${w.routes.length} routes</span></div>
<div class="routes">${w.routes.map(r=>`
<div class="route">
<span class="grade grade-${r.type}">${r.grade}</span>
<div class="route-info"><div class="route-name">${r.name}</div><div class="route-setter">Set by ${r.setter}</div></div>
<span class="route-status">Active</span>
</div>`).join('')}</div>
</div>`).join('');
</script>
</body>
</html>
