<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motorcycle Inventory - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"inventory-sales","name":"Inventory Sales","icon":"🏁","desc":"Motorcycle sales inventory","category":"motorcycle","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#b91c1c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.types{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.type{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.type.active{background:#b91c1c;border-color:#b91c1c}
.bikes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.bike{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.bike-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.bike-name{font-size:1.125rem;font-weight:bold}
.bike-type{font-size:.75rem;color:#b91c1c}
.bike-condition{padding:4px 10px;border-radius:4px;font-size:.7rem}
.condition-new{background:#15803d33;color:#15803d}
.condition-used{background:#0369a133;color:#0369a1}
.bike-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.spec{background:#252525;padding:10px;border-radius:6px;text-align:center}
.spec-value{font-size:.9rem;font-weight:bold}
.spec-label{font-size:.6rem;color:#888}
.bike-footer{display:flex;justify-content:space-between;align-items:center}
.bike-price{font-size:1.25rem;font-weight:bold;color:#b91c1c}
.bike-stock{font-size:.875rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🏁 Inventory</h1><button class="btn">Add Listing</button></div>
<div class="types">
<button class="type active">All Bikes</button>
<button class="type">Cruiser</button>
<button class="type">Sport</button>
<button class="type">Touring</button>
<button class="type">Adventure</button>
<button class="type">Dirt</button>
</div>
<div class="bikes" id="bikes"></div>
<script>
const bikes=[
{name:'2024 Harley-Davidson Road King',type:'CRUISER',condition:'new',engine:'114ci V-Twin',mileage:'0',color:'Vivid Black',price:'$21,999',stock:'SKU-HD2401'},
{name:'2023 Yamaha YZF-R1',type:'SPORT',condition:'new',engine:'998cc I4',mileage:'0',color:'Team Yamaha Blue',price:'$17,999',stock:'SKU-YA2301'},
{name:'2022 BMW K1600GTL',type:'TOURING',condition:'used',engine:'1649cc I6',mileage:'8,200',color:'Manhattan Gray',price:'$24,500',stock:'SKU-BM2201'},
{name:'2024 KTM 390 Adventure',type:'ADVENTURE',condition:'new',engine:'373cc Single',mileage:'0',color:'Orange',price:'$6,499',stock:'SKU-KT2401'},
{name:'2021 Ducati Monster 937',type:'NAKED',condition:'used',engine:'937cc V-Twin',mileage:'4,500',color:'Ducati Red',price:'$10,800',stock:'SKU-DU2101'},
{name:'2023 Honda CRF450R',type:'DIRT',condition:'new',engine:'449cc Single',mileage:'0',color:'Red',price:'$9,599',stock:'SKU-HO2301'}
];
document.getElementById('bikes').innerHTML=bikes.map(b=>`
<div class="bike">
<div class="bike-header">
<div>
<div class="bike-name">${b.name}</div>
<div class="bike-type">${b.type}</div>
</div>
<span class="bike-condition condition-${b.condition}">${b.condition.toUpperCase()}</span>
</div>
<div class="bike-specs">
<div class="spec"><div class="spec-value">${b.engine}</div><div class="spec-label">ENGINE</div></div>
<div class="spec"><div class="spec-value">${b.mileage}</div><div class="spec-label">MILES</div></div>
<div class="spec"><div class="spec-value">${b.color}</div><div class="spec-label">COLOR</div></div>
</div>
<div class="bike-footer">
<span class="bike-price">${b.price}</span>
<span class="bike-stock">${b.stock}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
