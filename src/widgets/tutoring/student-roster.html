<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Roster - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"student-roster","name":"Student Roster","icon":"📚","desc":"Manage tutoring students","category":"tutoring","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#8b5cf6}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.name{font-weight:600}
.level{padding:4px 10px;border-radius:4px;font-size:.75rem}
.level.elementary{background:#22c55e33;color:#22c55e}
.level.middle{background:#3b82f633;color:#3b82f6}
.level.high{background:#f59e0b33;color:#f59e0b}
.level.college{background:#8b5cf633;color:#8b5cf6}
.info{font-size:.875rem;color:#888;margin-bottom:10px}
.subjects{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:15px}
.subject{padding:4px 8px;background:#252525;border-radius:4px;font-size:.75rem}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;background:#8b5cf6;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>📚 Student Roster</h1><button class="btn" style="width:auto;padding:8px 16px" onclick="alert('Add')">+ Add Student</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">28</div><div class="stat-label">Active Students</div></div>
<div class="stat"><div class="stat-value">15</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">$4.2k</div><div class="stat-label">Monthly Rev</div></div>
<div class="stat"><div class="stat-value">4.9</div><div class="stat-label">Avg Rating</div></div>
</div>
<div class="grid" id="grid"></div>
<script>
const students=[
{name:'Emma Johnson',grade:'8th Grade',level:'middle',subjects:['Math','Science'],sessions:12,rate:45},
{name:'Liam Smith',grade:'11th Grade',level:'high',subjects:['SAT Prep','English'],sessions:8,rate:60},
{name:'Olivia Davis',grade:'5th Grade',level:'elementary',subjects:['Reading','Math'],sessions:16,rate:40},
{name:'Noah Wilson',grade:'Freshman',level:'college',subjects:['Calculus','Physics'],sessions:6,rate:75}
];
document.getElementById('grid').innerHTML=students.map(s=>`
<div class="card">
<div class="card-header"><span class="name">${s.name}</span><span class="level ${s.level}">${s.grade}</span></div>
<div class="subjects">${s.subjects.map(sub=>`<span class="subject">${sub}</span>`).join('')}</div>
<div class="info">📅 ${s.sessions} sessions completed</div>
<div class="info">💰 $${s.rate}/hour</div>
<button class="btn" onclick="alert('Schedule')">Schedule Session</button>
</div>`).join('');
</script>
</body>
</html>
