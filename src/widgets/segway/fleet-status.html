<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Status - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"segway-fleet","name":"Segway Fleet","icon":"🔋","desc":"Monitor segway fleet","category":"segway","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#6366f1;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#6366f1}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}
.segway{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.segway-icon{font-size:3rem;margin-bottom:10px}
.segway-id{font-weight:bold;color:#6366f1;margin-bottom:5px}
.segway-status{padding:4px 10px;border-radius:4px;font-size:.75rem;display:inline-block;margin-bottom:10px}
.status-ready{background:#22c55e33;color:#22c55e}
.status-in-use{background:#3b82f633;color:#3b82f6}
.status-charging{background:#f59e0b33;color:#f59e0b}
.status-maintenance{background:#ef444433;color:#ef4444}
.battery{width:100%;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-bottom:5px}
.battery-level{height:100%;border-radius:4px}
.battery-high{background:#22c55e}
.battery-medium{background:#f59e0b}
.battery-low{background:#ef4444}
.segway-info{font-size:.75rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🔋 Fleet Status</h1><button class="btn">+ Add Segway</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">16</div><div class="stat-label">Total Fleet</div></div>
<div class="stat"><div class="stat-value">10</div><div class="stat-label">Available</div></div>
<div class="stat"><div class="stat-value">4</div><div class="stat-label">In Use</div></div>
<div class="stat"><div class="stat-value">2</div><div class="stat-label">Charging</div></div>
</div>
<div class="fleet" id="fleet"></div>
<script>
const fleet=[
{id:'SEG-001',status:'ready',battery:95,lastService:'2 days ago'},
{id:'SEG-002',status:'in-use',battery:78,rider:'Tour Group A'},
{id:'SEG-003',status:'ready',battery:100,lastService:'Today'},
{id:'SEG-004',status:'charging',battery:45,eta:'30 min'},
{id:'SEG-005',status:'in-use',battery:82,rider:'Tour Group A'},
{id:'SEG-006',status:'ready',battery:88,lastService:'1 day ago'},
{id:'SEG-007',status:'maintenance',battery:60,issue:'Tire repair'},
{id:'SEG-008',status:'in-use',battery:65,rider:'Tour Group B'},
{id:'SEG-009',status:'ready',battery:92,lastService:'3 days ago'},
{id:'SEG-010',status:'charging',battery:25,eta:'1 hr'},
{id:'SEG-011',status:'ready',battery:100,lastService:'Today'},
{id:'SEG-012',status:'in-use',battery:71,rider:'Tour Group B'}
];
document.getElementById('fleet').innerHTML=fleet.map(s=>{
const batClass=s.battery>=70?'battery-high':s.battery>=40?'battery-medium':'battery-low';
const info=s.status==='in-use'?s.rider:s.status==='charging'?`Ready in ${s.eta}`:s.status==='maintenance'?s.issue:`Last: ${s.lastService}`;
return `
<div class="segway">
<div class="segway-icon">🛴</div>
<div class="segway-id">${s.id}</div>
<span class="segway-status status-${s.status}">${s.status.replace('-',' ').toUpperCase()}</span>
<div class="battery"><div class="battery-level ${batClass}" style="width:${s.battery}%"></div></div>
<div class="segway-info">${s.battery}% • ${info}</div>
</div>`;
}).join('');
</script>
</body>
</html>
