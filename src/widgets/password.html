<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { max-width: 500px; width: 100%; }

        .header { text-align: center; padding: 30px 0; }
        .logo { font-size: 48px; margin-bottom: 12px; }
        h1 { font-size: 1.8rem; color: #ec4899; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 13px; }

        .card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .password-display {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(236, 72, 153, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .password-display:hover {
            border-color: #ec4899;
        }

        .password-display.copied {
            border-color: #22c55e;
        }

        .password-display.copied::after {
            content: 'Copied!';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #000;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .password-text {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 24px;
            word-break: break-all;
            line-height: 1.4;
            color: #fff;
            letter-spacing: 2px;
        }

        .password-text .char-upper { color: #f59e0b; }
        .password-text .char-lower { color: #fff; }
        .password-text .char-number { color: #3b82f6; }
        .password-text .char-symbol { color: #ec4899; }

        .strength-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s;
            border-radius: 3px;
        }

        .strength-fill.weak { width: 25%; background: #ef4444; }
        .strength-fill.fair { width: 50%; background: #f59e0b; }
        .strength-fill.good { width: 75%; background: #3b82f6; }
        .strength-fill.strong { width: 100%; background: #22c55e; }

        .strength-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-label { color: #888; }
        .strength-value { font-weight: 600; }
        .strength-value.weak { color: #ef4444; }
        .strength-value.fair { color: #f59e0b; }
        .strength-value.good { color: #3b82f6; }
        .strength-value.strong { color: #22c55e; }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { transform: scale(1.03); }

        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .option-group { margin-bottom: 20px; }

        .option-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .option-title {
            font-size: 14px;
            color: #fff;
        }

        .option-value {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: #ec4899;
            font-weight: 600;
        }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ec4899, #be185d);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(236, 72, 153, 0.4);
        }

        .checkboxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .checkbox-item.active {
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.1);
        }

        .checkbox-box {
            width: 20px;
            height: 20px;
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .checkbox-item.active .checkbox-box {
            border-color: #ec4899;
            background: #ec4899;
        }

        .checkbox-check {
            color: #000;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
        }

        .checkbox-item.active .checkbox-check {
            opacity: 1;
        }

        .checkbox-label {
            font-size: 13px;
            color: #888;
        }

        .checkbox-item.active .checkbox-label {
            color: #fff;
        }

        .history {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .history-password {
            color: #888;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-time {
            font-size: 10px;
            color: #666;
        }

        .empty-history {
            text-align: center;
            color: #666;
            font-size: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔐</div>
            <h1>Password Generator</h1>
            <p class="subtitle">Generate strong, secure passwords instantly</p>
        </div>

        <div class="card">
            <div class="password-display" id="passwordDisplay" onclick="Pass.copy()">
                <div class="password-text" id="passwordText">Click generate</div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text">
                    <span class="strength-label">Strength</span>
                    <span class="strength-value" id="strengthValue">-</span>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" onclick="Pass.generate()">🔄 Generate</button>
                <button class="btn btn-secondary" onclick="Pass.copy()">📋 Copy</button>
            </div>

            <div class="option-group">
                <div class="option-label">
                    <span class="option-title">Password Length</span>
                    <span class="option-value" id="lengthValue">16</span>
                </div>
                <input type="range" class="slider" id="lengthSlider" min="4" max="64" value="16" oninput="Pass.updateLength()">
            </div>

            <div class="option-group">
                <div class="option-label">
                    <span class="option-title">Character Types</span>
                </div>
                <div class="checkboxes">
                    <div class="checkbox-item active" data-option="uppercase" onclick="Pass.toggleOption(this)">
                        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
                        <span class="checkbox-label">Uppercase (A-Z)</span>
                    </div>
                    <div class="checkbox-item active" data-option="lowercase" onclick="Pass.toggleOption(this)">
                        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
                        <span class="checkbox-label">Lowercase (a-z)</span>
                    </div>
                    <div class="checkbox-item active" data-option="numbers" onclick="Pass.toggleOption(this)">
                        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
                        <span class="checkbox-label">Numbers (0-9)</span>
                    </div>
                    <div class="checkbox-item active" data-option="symbols" onclick="Pass.toggleOption(this)">
                        <div class="checkbox-box"><span class="checkbox-check">✓</span></div>
                        <span class="checkbox-label">Symbols (!@#$)</span>
                    </div>
                </div>
            </div>

            <div class="history">
                <div class="history-title">📜 Recent Passwords</div>
                <div class="history-list" id="historyList">
                    <div class="empty-history">No passwords generated yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class PasswordGenerator {
            constructor() {
                this.length = 16;
                this.options = {
                    uppercase: true,
                    lowercase: true,
                    numbers: true,
                    symbols: true
                };
                this.chars = {
                    uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                    lowercase: 'abcdefghijklmnopqrstuvwxyz',
                    numbers: '0123456789',
                    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
                };
                this.history = this.loadHistory();
                this.renderHistory();
            }

            generate() {
                let charset = '';
                const enabledTypes = [];

                Object.keys(this.options).forEach(key => {
                    if (this.options[key]) {
                        charset += this.chars[key];
                        enabledTypes.push(key);
                    }
                });

                if (!charset) {
                    alert('Please select at least one character type');
                    return;
                }

                // Generate password using crypto
                const array = new Uint32Array(this.length);
                crypto.getRandomValues(array);

                let password = '';
                for (let i = 0; i < this.length; i++) {
                    password += charset[array[i] % charset.length];
                }

                // Ensure at least one char from each enabled type
                enabledTypes.forEach((type, i) => {
                    if (i < password.length) {
                        const chars = this.chars[type];
                        const randomChar = chars[Math.floor(Math.random() * chars.length)];
                        const pos = Math.floor(Math.random() * password.length);
                        password = password.substring(0, pos) + randomChar + password.substring(pos + 1);
                    }
                });

                this.displayPassword(password);
                this.addToHistory(password);
            }

            displayPassword(password) {
                const display = document.getElementById('passwordText');

                // Color-code characters
                let html = '';
                for (const char of password) {
                    if (this.chars.uppercase.includes(char)) {
                        html += `<span class="char-upper">${char}</span>`;
                    } else if (this.chars.lowercase.includes(char)) {
                        html += `<span class="char-lower">${char}</span>`;
                    } else if (this.chars.numbers.includes(char)) {
                        html += `<span class="char-number">${char}</span>`;
                    } else {
                        html += `<span class="char-symbol">${char}</span>`;
                    }
                }

                display.innerHTML = html;
                this.updateStrength(password);
            }

            updateStrength(password) {
                let score = 0;

                // Length scoring
                if (password.length >= 8) score += 1;
                if (password.length >= 12) score += 1;
                if (password.length >= 16) score += 1;
                if (password.length >= 24) score += 1;

                // Character variety
                if (/[A-Z]/.test(password)) score += 1;
                if (/[a-z]/.test(password)) score += 1;
                if (/[0-9]/.test(password)) score += 1;
                if (/[^A-Za-z0-9]/.test(password)) score += 1;

                const fill = document.getElementById('strengthFill');
                const value = document.getElementById('strengthValue');

                if (score <= 3) {
                    fill.className = 'strength-fill weak';
                    value.className = 'strength-value weak';
                    value.textContent = 'Weak';
                } else if (score <= 5) {
                    fill.className = 'strength-fill fair';
                    value.className = 'strength-value fair';
                    value.textContent = 'Fair';
                } else if (score <= 7) {
                    fill.className = 'strength-fill good';
                    value.className = 'strength-value good';
                    value.textContent = 'Good';
                } else {
                    fill.className = 'strength-fill strong';
                    value.className = 'strength-value strong';
                    value.textContent = 'Strong';
                }
            }

            copy() {
                const text = document.getElementById('passwordText').textContent;
                if (text === 'Click generate') return;

                navigator.clipboard.writeText(text).then(() => {
                    const display = document.getElementById('passwordDisplay');
                    display.classList.add('copied');
                    setTimeout(() => display.classList.remove('copied'), 1500);
                });
            }

            updateLength() {
                this.length = parseInt(document.getElementById('lengthSlider').value);
                document.getElementById('lengthValue').textContent = this.length;
            }

            toggleOption(el) {
                const option = el.dataset.option;
                this.options[option] = !this.options[option];
                el.classList.toggle('active', this.options[option]);
            }

            addToHistory(password) {
                this.history.unshift({
                    password,
                    time: new Date().toISOString()
                });

                // Keep only last 10
                this.history = this.history.slice(0, 10);
                this.saveHistory();
                this.renderHistory();
            }

            renderHistory() {
                const list = document.getElementById('historyList');

                if (this.history.length === 0) {
                    list.innerHTML = '<div class="empty-history">No passwords generated yet</div>';
                    return;
                }

                list.innerHTML = this.history.map(item => {
                    const time = new Date(item.time);
                    const timeStr = time.toLocaleTimeString();
                    return `
                        <div class="history-item" onclick="Pass.copyFromHistory('${item.password}')">
                            <span class="history-password">${item.password}</span>
                            <span class="history-time">${timeStr}</span>
                        </div>
                    `;
                }).join('');
            }

            copyFromHistory(password) {
                navigator.clipboard.writeText(password).then(() => {
                    this.displayPassword(password);
                    const display = document.getElementById('passwordDisplay');
                    display.classList.add('copied');
                    setTimeout(() => display.classList.remove('copied'), 1500);
                });
            }

            saveHistory() {
                localStorage.setItem('password-history', JSON.stringify(this.history));
            }

            loadHistory() {
                const saved = localStorage.getItem('password-history');
                return saved ? JSON.parse(saved) : [];
            }
        }

        const Pass = new PasswordGenerator();
    </script>
</body>
</html>
