<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Catalog - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"star-catalog","name":"Star Catalog","icon":"✨","desc":"Star and constellation database","category":"planetarium","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.search{display:flex;gap:10px;margin-bottom:20px}
.search input{flex:1;padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.search button{padding:12px 20px;background:#6366f1;color:#fff;border:none;border-radius:6px;cursor:pointer}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{padding:10px 20px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.tab.active{background:#6366f1;border-color:#6366f1}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.item{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.item-header{display:flex;align-items:center;gap:15px;margin-bottom:15px}
.item-icon{font-size:2.5rem}
.item-name{font-size:1.125rem;font-weight:bold}
.item-class{font-size:.75rem;color:#6366f1}
.item-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.stat{background:#252525;padding:10px;border-radius:6px}
.stat-label{font-size:.65rem;color:#888;margin-bottom:3px}
.stat-value{font-size:.875rem;font-weight:500}
.item-desc{font-size:.875rem;color:#888;line-height:1.5}
</style>
</head>
<body>
<div class="header"><h1>✨ Star Catalog</h1></div>
<div class="search">
<input type="text" placeholder="Search stars, constellations, galaxies...">
<button>🔍 Search</button>
</div>
<div class="tabs">
<button class="tab active">Stars</button>
<button class="tab">Constellations</button>
<button class="tab">Galaxies</button>
<button class="tab">Nebulae</button>
</div>
<div class="items" id="items"></div>
<script>
const items=[
{icon:'⭐',name:'Sirius',class:'A1V Main Sequence',distance:'8.6 ly',magnitude:'-1.46',temp:'9,940 K',mass:'2.02 M☉',desc:'The brightest star in the night sky, part of Canis Major constellation.'},
{icon:'🌟',name:'Betelgeuse',class:'M1-2 Red Supergiant',distance:'700 ly',magnitude:'0.50',temp:'3,600 K',mass:'11.6 M☉',desc:'Red supergiant in Orion, one of the largest visible stars.'},
{icon:'✨',name:'Vega',class:'A0V Main Sequence',distance:'25 ly',magnitude:'0.03',temp:'9,602 K',mass:'2.1 M☉',desc:'Fifth brightest star, part of the Summer Triangle asterism.'},
{icon:'💫',name:'Polaris',class:'F7Ib Supergiant',distance:'433 ly',magnitude:'1.98',temp:'6,015 K',mass:'5.4 M☉',desc:'The North Star, used for navigation for centuries.'},
{icon:'⭐',name:'Rigel',class:'B8Ia Blue Supergiant',distance:'860 ly',magnitude:'0.13',temp:'12,100 K',mass:'21 M☉',desc:'Brightest star in Orion, a blue supergiant with extreme luminosity.'},
{icon:'🌟',name:'Aldebaran',class:'K5III Red Giant',distance:'65 ly',magnitude:'0.85',temp:'3,900 K',mass:'1.5 M☉',desc:'The eye of Taurus, an orange giant star nearing end of life.'}
];
document.getElementById('items').innerHTML=items.map(i=>`
<div class="item">
<div class="item-header">
<span class="item-icon">${i.icon}</span>
<div><div class="item-name">${i.name}</div><div class="item-class">${i.class}</div></div>
</div>
<div class="item-stats">
<div class="stat"><div class="stat-label">DISTANCE</div><div class="stat-value">${i.distance}</div></div>
<div class="stat"><div class="stat-label">MAGNITUDE</div><div class="stat-value">${i.magnitude}</div></div>
<div class="stat"><div class="stat-label">TEMPERATURE</div><div class="stat-value">${i.temp}</div></div>
<div class="stat"><div class="stat-label">MASS</div><div class="stat-value">${i.mass}</div></div>
</div>
<div class="item-desc">${i.desc}</div>
</div>`).join('');
</script>
</body>
</html>
