<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resort Amenities - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"amenities","name":"Resort Amenities","icon":"🏨","desc":"Resort facilities guide","category":"resort","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#a855f7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.categories{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:10px}
.category{padding:10px 20px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer;white-space:nowrap}
.category.active{background:#a855f7;border-color:#a855f7}
.amenities{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.amenity{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.amenity-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.amenity-icon{font-size:2.5rem}
.amenity-status{padding:4px 10px;border-radius:4px;font-size:.75rem}
.status-open{background:#22c55e33;color:#22c55e}
.status-closed{background:#ef444433;color:#ef4444}
.status-reservation{background:#f59e0b33;color:#f59e0b}
.amenity-name{font-size:1.125rem;font-weight:bold;margin-bottom:5px}
.amenity-location{font-size:.75rem;color:#888;margin-bottom:10px}
.amenity-hours{font-size:.875rem;margin-bottom:10px}
.amenity-desc{font-size:.875rem;color:#888;line-height:1.5}
</style>
</head>
<body>
<div class="header"><h1>🏨 Amenities</h1><button class="btn">Concierge</button></div>
<div class="categories">
<button class="category active">All</button>
<button class="category">Pools</button>
<button class="category">Dining</button>
<button class="category">Spa</button>
<button class="category">Fitness</button>
<button class="category">Recreation</button>
</div>
<div class="amenities" id="amenities"></div>
<script>
const amenities=[
{icon:'🏊',name:'Infinity Pool',location:'Pool Level',hours:'7:00 AM - 10:00 PM',status:'open',desc:'Stunning infinity edge pool overlooking the ocean. Towel service and poolside dining available.'},
{icon:'🧖',name:'Serenity Spa',location:'Spa Building',hours:'9:00 AM - 8:00 PM',status:'reservation',desc:'Full-service spa offering massages, facials, body treatments, and salon services.'},
{icon:'🍽️',name:'Ocean View Restaurant',location:'Main Building',hours:'7:00 AM - 10:00 PM',status:'open',desc:'All-day dining featuring international cuisine with panoramic ocean views.'},
{icon:'🏋️',name:'Fitness Center',location:'Wellness Wing',hours:'24 Hours',status:'open',desc:'State-of-the-art equipment, personal trainers, and daily fitness classes.'},
{icon:'🎾',name:'Tennis Courts',location:'Recreation Area',hours:'7:00 AM - 9:00 PM',status:'reservation',desc:'Two professional courts with equipment rental. Lessons available.'},
{icon:'🍸',name:'Sunset Lounge',location:'Rooftop',hours:'5:00 PM - 12:00 AM',status:'closed',desc:'Craft cocktails and tapas with live music. Opens at 5 PM.'},
{icon:'👶',name:'Kids Club',location:'Family Wing',hours:'9:00 AM - 6:00 PM',status:'open',desc:'Supervised activities for children ages 4-12. Arts, crafts, games, and more.'},
{icon:'🏖️',name:'Private Beach',location:'Oceanfront',hours:'Sunrise - Sunset',status:'open',desc:'Exclusive beach access with loungers, umbrellas, and beach butler service.'}
];
document.getElementById('amenities').innerHTML=amenities.map(a=>`
<div class="amenity">
<div class="amenity-header">
<span class="amenity-icon">${a.icon}</span>
<span class="amenity-status status-${a.status}">${a.status==='reservation'?'RESERVATION REQUIRED':a.status.toUpperCase()}</span>
</div>
<div class="amenity-name">${a.name}</div>
<div class="amenity-location">📍 ${a.location}</div>
<div class="amenity-hours">🕐 ${a.hours}</div>
<div class="amenity-desc">${a.desc}</div>
</div>`).join('');
</script>
</body>
</html>
