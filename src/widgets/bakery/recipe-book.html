<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Book - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"recipe-book","name":"Recipe Book","icon":"📖","desc":"Bakery recipe management","category":"bakery","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.search{padding:10px 15px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.card-image{height:120px;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-size:3rem}
.card-body{padding:20px}
.card-title{font-weight:600;margin-bottom:10px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:15px}
.tag{padding:4px 8px;background:#252525;border-radius:4px;font-size:.75rem;color:#888}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.875rem;color:#888}
.meta-item{display:flex;align-items:center;gap:5px}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;background:#f97316;color:#fff;margin-top:15px}
</style>
</head>
<body>
<div class="header"><h1>📖 Recipe Book</h1><input type="text" class="search" placeholder="Search recipes..."></div>
<div class="grid" id="grid"></div>
<script>
const recipes=[
{icon:'🥐',name:'Classic Croissant',tags:['Pastry','French','Laminated'],time:'4 hrs',yield:'12 pcs',difficulty:'Advanced'},
{icon:'🍞',name:'Sourdough Bread',tags:['Bread','Artisan','Fermented'],time:'24 hrs',yield:'2 loaves',difficulty:'Medium'},
{icon:'🧁',name:'Vanilla Cupcakes',tags:['Cake','Sweet','Party'],time:'45 min',yield:'24 pcs',difficulty:'Easy'},
{icon:'🥖',name:'French Baguette',tags:['Bread','French','Crusty'],time:'5 hrs',yield:'4 pcs',difficulty:'Medium'},
{icon:'🍩',name:'Glazed Donuts',tags:['Fried','Sweet','Glaze'],time:'2 hrs',yield:'12 pcs',difficulty:'Medium'},
{icon:'🎂',name:'Chocolate Cake',tags:['Cake','Chocolate','Birthday'],time:'1.5 hrs',yield:'8 slices',difficulty:'Easy'}
];
document.getElementById('grid').innerHTML=recipes.map(r=>`
<div class="card">
<div class="card-image">${r.icon}</div>
<div class="card-body">
<div class="card-title">${r.name}</div>
<div class="tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<div class="meta">
<div class="meta-item">⏱️ ${r.time}</div>
<div class="meta-item">📦 ${r.yield}</div>
<div class="meta-item">📊 ${r.difficulty}</div>
<div class="meta-item">⭐ 4.8</div>
</div>
<button class="btn" onclick="alert('View')">View Recipe</button>
</div>
</div>`).join('');
</script>
</body>
</html>
