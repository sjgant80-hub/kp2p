<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery Manager - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"gallery-manager","name":"Gallery Manager","icon":"🖼️","desc":"Manage client photo galleries","category":"photography","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#f59e0b}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.galleries-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.gallery-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.gallery-preview{height:140px;background:#252525;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.preview-img{background:#333;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.gallery-body{padding:20px}
.gallery-title{font-weight:600;margin-bottom:5px}
.gallery-client{font-size:.875rem;color:#888;margin-bottom:15px}
.gallery-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;font-size:.875rem}
.stat-item span{display:block;color:#888;font-size:.75rem}
.gallery-status{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #333}
.status-badge{padding:4px 10px;border-radius:4px;font-size:.75rem}
.status-badge.draft{background:#33333;color:#888}
.status-badge.shared{background:#3b82f633;color:#3b82f6}
.status-badge.delivered{background:#10b98133;color:#10b981}
.gallery-footer{display:flex;gap:10px;padding:15px 20px;border-top:1px solid #333}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;flex:1}
.btn-primary{background:#f59e0b;color:#000}
.btn-secondary{background:#333;color:#e0e0e0}
</style>
</head>
<body>
<div class="header">
<h1>🖼️ Gallery Manager</h1>
<button class="btn btn-primary" onclick="alert('Create gallery')">+ Create Gallery</button>
</div>

<div class="stats">
<div class="stat"><div class="stat-value" id="totalGalleries">0</div><div class="stat-label">Total Galleries</div></div>
<div class="stat"><div class="stat-value" id="totalPhotos">0</div><div class="stat-label">Total Photos</div></div>
<div class="stat"><div class="stat-value" id="storageUsed">0</div><div class="stat-label">Storage (GB)</div></div>
<div class="stat"><div class="stat-value" id="downloads">0</div><div class="stat-label">Downloads</div></div>
</div>

<div class="galleries-grid" id="galleriesGrid"></div>

<script>
const STORAGE_KEY = 'kiss_photo_galleries';
let galleries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(galleries));
}

function updateStats() {
  const totalPhotos = galleries.reduce((s, g) => s + g.photoCount, 0);
  const storageUsed = galleries.reduce((s, g) => s + g.storage, 0);
  const downloads = galleries.reduce((s, g) => s + g.downloads, 0);

  document.getElementById('totalGalleries').textContent = galleries.length;
  document.getElementById('totalPhotos').textContent = totalPhotos.toLocaleString();
  document.getElementById('storageUsed').textContent = storageUsed.toFixed(1);
  document.getElementById('downloads').textContent = downloads;
}

function render() {
  const grid = document.getElementById('galleriesGrid');

  if (galleries.length === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:40px;color:#666;grid-column:1/-1">No galleries created</div>';
    updateStats();
    return;
  }

  grid.innerHTML = galleries.map(g => `
    <div class="gallery-card">
      <div class="gallery-preview">
        ${[1,2,3,4,5,6].map(i => `<div class="preview-img">📷</div>`).join('')}
      </div>
      <div class="gallery-body">
        <div class="gallery-title">${g.title}</div>
        <div class="gallery-client">👤 ${g.client}</div>
        <div class="gallery-stats">
          <div class="stat-item"><span>Photos</span><strong>${g.photoCount}</strong></div>
          <div class="stat-item"><span>Views</span><strong>${g.views}</strong></div>
          <div class="stat-item"><span>Downloads</span><strong>${g.downloads}</strong></div>
          <div class="stat-item"><span>Size</span><strong>${g.storage} GB</strong></div>
        </div>
        <div class="gallery-status">
          <span style="font-size:.875rem;color:#888">Created: ${new Date(g.createdAt).toLocaleDateString()}</span>
          <span class="status-badge ${g.status}">${g.status}</span>
        </div>
      </div>
      <div class="gallery-footer">
        <button class="btn btn-primary" onclick="alert('Open gallery')">📂 Open</button>
        <button class="btn btn-secondary" onclick="alert('Share link')">🔗 Share</button>
      </div>
    </div>
  `).join('');

  updateStats();
}

if (galleries.length === 0) {
  const past = d => { const x = new Date(); x.setDate(x.getDate() - d); return x.toISOString(); };
  galleries = [
    { id: '1', title: 'Sarah & Michael Wedding', client: 'Sarah Thompson', photoCount: 487, views: 156, downloads: 12, storage: 8.2, status: 'delivered', createdAt: past(5) },
    { id: '2', title: 'Johnson Family Portrait', client: 'Emily Johnson', photoCount: 48, views: 23, downloads: 2, storage: 0.8, status: 'shared', createdAt: past(12) },
    { id: '3', title: 'Tech Startup Headshots', client: 'Tech Startup Inc', photoCount: 25, views: 45, downloads: 25, storage: 0.4, status: 'delivered', createdAt: past(20) },
    { id: '4', title: 'Nature Collection - Fall', client: 'Stock Portfolio', photoCount: 120, views: 0, downloads: 0, storage: 2.1, status: 'draft', createdAt: past(2) },
    { id: '5', title: 'Baby Emma - First Year', client: 'David Martinez', photoCount: 85, views: 67, downloads: 8, storage: 1.4, status: 'shared', createdAt: past(30) }
  ];
  save();
}

render();
</script>
</body>
</html>
