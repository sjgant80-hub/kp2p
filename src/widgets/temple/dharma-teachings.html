<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dharma Teachings - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"dharma-teachings","name":"Dharma Teachings","icon":"📿","desc":"Classes and dharma talks","category":"temple","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#b45309;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.series{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.serie{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.serie.active{background:#b45309;border-color:#b45309}
.teachings{display:flex;flex-direction:column;gap:15px}
.teaching{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.teaching-header{padding:20px;background:#252525}
.teaching-series{font-size:.7rem;color:#b45309;margin-bottom:5px}
.teaching-title{font-size:1.125rem;font-weight:bold;margin-bottom:5px}
.teaching-teacher{font-size:.875rem;color:#888}
.teaching-body{padding:20px}
.teaching-desc{font-size:.875rem;color:#888;line-height:1.5;margin-bottom:15px}
.teaching-meta{display:flex;gap:20px;font-size:.75rem;color:#888;margin-bottom:15px}
.teaching-topics{display:flex;gap:8px;flex-wrap:wrap}
.topic{padding:4px 10px;background:#252525;border-radius:4px;font-size:.7rem}
.teaching-footer{padding:0 20px 20px;display:flex;gap:10px}
.action-btn{padding:10px 20px;border-radius:6px;cursor:pointer;font-size:.875rem}
.action-primary{background:#b45309;color:#fff;border:none}
.action-secondary{background:transparent;border:1px solid #333;color:#e0e0e0}
</style>
</head>
<body>
<div class="header"><h1>📿 Dharma</h1><button class="btn">View Archive</button></div>
<div class="series">
<button class="serie active">All Teachings</button>
<button class="serie">Foundations</button>
<button class="serie">Sutras</button>
<button class="serie">Ethics</button>
<button class="serie">Retreats</button>
</div>
<div class="teachings" id="teachings"></div>
<script>
const teachings=[
{series:'FOUNDATIONS OF BUDDHISM',title:'The Four Noble Truths',teacher:'Venerable Thich Nhat',desc:'An in-depth exploration of the Buddha\'s first teaching on suffering and the path to liberation.',date:'Jan 28',time:'7:00 PM',duration:'90 min',topics:['Suffering','Cause','Cessation','Path'],hasVideo:true},
{series:'HEART SUTRA STUDY',title:'Form is Emptiness',teacher:'Roshi Chen',desc:'Continuing our study of the Heart Sutra, exploring the nature of emptiness and form.',date:'Jan 30',time:'7:00 PM',duration:'60 min',topics:['Emptiness','Prajna','Wisdom'],hasVideo:true},
{series:'BUDDHIST ETHICS',title:'Right Speech in Daily Life',teacher:'Sister Maya',desc:'Practical guidance on mindful communication and the power of words.',date:'Feb 1',time:'10:00 AM',duration:'60 min',topics:['Speech','Mindfulness','Relationships'],hasVideo:false},
{series:'WEEKEND RETREAT',title:'Silent Retreat: Deepening Practice',teacher:'Multiple Teachers',desc:'A full weekend of silent practice, dharma talks, and individual guidance.',date:'Feb 7-9',time:'All Day',duration:'3 days',topics:['Retreat','Silence','Intensive'],hasVideo:false}
];
document.getElementById('teachings').innerHTML=teachings.map(t=>`
<div class="teaching">
<div class="teaching-header">
<div class="teaching-series">${t.series}</div>
<div class="teaching-title">${t.title}</div>
<div class="teaching-teacher">👤 ${t.teacher}</div>
</div>
<div class="teaching-body">
<div class="teaching-desc">${t.desc}</div>
<div class="teaching-meta">
<span>📅 ${t.date}</span>
<span>🕐 ${t.time}</span>
<span>⏱️ ${t.duration}</span>
</div>
<div class="teaching-topics">${t.topics.map(tp=>`<span class="topic">${tp}</span>`).join('')}</div>
</div>
<div class="teaching-footer">
<button class="action-btn action-primary">Register</button>
${t.hasVideo?'<button class="action-btn action-secondary">Watch Recording</button>':''}
</div>
</div>`).join('');
</script>
</body>
</html>
