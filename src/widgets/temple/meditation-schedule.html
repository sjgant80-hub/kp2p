<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meditation Schedule - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"meditation-schedule","name":"Meditation Schedule","icon":"🧘","desc":"Daily meditation sessions","category":"temple","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#b45309;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.featured{background:linear-gradient(135deg,#b45309 0%,#92400e 100%);border-radius:12px;padding:25px;margin-bottom:20px;text-align:center}
.featured-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.featured-name{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.featured-time{font-size:1.125rem;opacity:.9}
.types{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.type{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.type.active{background:#b45309;border-color:#b45309}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.session{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.session-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.session-name{font-size:1.125rem;font-weight:bold}
.session-type{font-size:.75rem;color:#b45309}
.session-level{padding:4px 10px;border-radius:4px;font-size:.7rem;background:#b4530933;color:#b45309}
.session-time{font-size:.875rem;color:#888;margin-bottom:15px}
.session-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:10px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:2px}
.detail-value{font-size:.875rem}
.session-desc{font-size:.875rem;color:#888;line-height:1.5}
</style>
</head>
<body>
<div class="header"><h1>🧘 Meditation</h1><button class="btn">Join Session</button></div>
<div class="featured">
<div class="featured-label">NEXT SESSION</div>
<div class="featured-name">Morning Mindfulness</div>
<div class="featured-time">Today at 6:00 AM • 45 minutes</div>
</div>
<div class="types">
<button class="type active">All Sessions</button>
<button class="type">Mindfulness</button>
<button class="type">Zen</button>
<button class="type">Guided</button>
<button class="type">Silent</button>
</div>
<div class="sessions" id="sessions"></div>
<script>
const sessions=[
{name:'Morning Mindfulness',type:'MINDFULNESS',level:'All Levels',days:'Daily',time:'6:00 AM',duration:'45 min',teacher:'Venerable Thich',location:'Main Hall',desc:'Start your day with breath awareness and loving-kindness meditation.'},
{name:'Zen Sitting',type:'ZEN',level:'Intermediate',days:'Mon/Wed/Fri',time:'7:00 AM',duration:'60 min',teacher:'Roshi Chen',location:'Zendo',desc:'Traditional zazen practice with walking meditation (kinhin).'},
{name:'Guided Visualization',type:'GUIDED',level:'Beginner',days:'Tue/Thu',time:'10:00 AM',duration:'30 min',teacher:'Sister Maya',location:'Garden Room',desc:'Gentle guided meditations for stress relief and inner peace.'},
{name:'Silent Retreat (Day)',type:'SILENT',level:'Advanced',days:'Saturday',time:'9:00 AM',duration:'6 hours',teacher:'Various',location:'Retreat Center',desc:'Extended silent practice with dharma talks and mindful meals.'},
{name:'Evening Chanting',type:'CHANTING',level:'All Levels',days:'Daily',time:'6:00 PM',duration:'30 min',teacher:'Sangha',location:'Main Hall',desc:'Traditional chanting practice followed by brief meditation.'},
{name:'Mindful Movement',type:'MOVEMENT',level:'All Levels',days:'Sun',time:'8:00 AM',duration:'60 min',teacher:'Teacher Kim',location:'Garden',desc:'Tai chi and qigong combined with walking meditation.'}
];
document.getElementById('sessions').innerHTML=sessions.map(s=>`
<div class="session">
<div class="session-header">
<div>
<div class="session-name">${s.name}</div>
<div class="session-type">${s.type}</div>
</div>
<span class="session-level">${s.level}</span>
</div>
<div class="session-time">📅 ${s.days} at ${s.time} • ${s.duration}</div>
<div class="session-details">
<div class="detail"><div class="detail-label">TEACHER</div><div class="detail-value">${s.teacher}</div></div>
<div class="detail"><div class="detail-label">LOCATION</div><div class="detail-value">${s.location}</div></div>
</div>
<div class="session-desc">${s.desc}</div>
</div>`).join('');
</script>
</body>
</html>
