<!DOCTYPE html>
<!--
KISS MySaaS - Konomi Instant Serverless Solutions
Open source P2P widgets that replace paid SaaS. $0 forever.
KISS = Konomi Instant Serverless Solutions
MySaaS = Mesh Your Serverless Alternative App Suite
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KISS MySaaS - 500+ Open Source P2P Widgets</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #fff; height: 100vh; display: flex; flex-direction: column; }

    /* Compact Hero */
    .hero { padding: 16px 24px; background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%); border-bottom: 1px solid #222; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 1.5rem; white-space: nowrap; }
    .brand h1 span { color: #e94560; }
    .brand p { font-size: 11px; color: #555; max-width: 280px; line-height: 1.3; }

    /* Stats */
    .stats { display: flex; gap: 20px; }
    .stat { text-align: center; }
    .stat-value { font-size: 1.25rem; font-weight: 700; color: #e94560; }
    .stat-label { font-size: 10px; color: #555; }

    /* Quick Links */
    .quick-links { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .quick-link { padding: 8px 14px; background: rgba(255,255,255,0.03); border: 1px solid #282828; border-radius: 6px; color: #999; text-decoration: none; font-size: 12px; transition: all 0.15s; white-space: nowrap; }
    .quick-link:hover { background: #e94560; border-color: #e94560; color: #fff; }

    /* Browser Frame */
    .browser { flex: 1; min-height: 0; }
    .browser iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="brand">
      <h1>KISS <span>MySaaS</span></h1>
      <p><strong>K</strong>onomi <strong>I</strong>nstant <strong>S</strong>erverless <strong>S</strong>olutions • Open source P2P widgets. No servers. $0 forever.</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-value" id="widgetCount">500+</div><div class="stat-label">WIDGETS</div></div>
      <div class="stat"><div class="stat-value">$0</div><div class="stat-label">FOREVER</div></div>
      <div class="stat"><div class="stat-value">100%</div><div class="stat-label">OPEN SOURCE</div></div>
    </div>

    <nav class="quick-links">
      <a href="comm/chat.html" class="quick-link">💬 Chat</a>
      <a href="productivity/kanban.html" class="quick-link">📋 Kanban</a>
      <a href="ai/ai-chat.html" class="quick-link">🤖 AI</a>
      <a href="utility/os-desktop.html" class="quick-link">🖥️ Desktop</a>
      <a href="widget-browser.html" class="quick-link" target="_blank">↗ Fullscreen</a>
    </nav>
  </header>

  <main class="browser">
    <iframe src="widget-browser.html" id="browserFrame"></iframe>
  </main>

  <script>
    fetch('manifest.json')
      .then(r => r.json())
      .then(m => { document.getElementById('widgetCount').textContent = m.count + '+'; })
      .catch(() => {});
  </script>
</body>
</html>
