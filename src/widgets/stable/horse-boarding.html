<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horse Boarding - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"horse-boarding","name":"Horse Boarding","icon":"🐴","desc":"Manage horse stalls","category":"stable","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#854d0e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#854d0e}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.barns{display:flex;gap:10px;margin-bottom:20px}
.barn{padding:10px 20px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.barn.active{background:#854d0e;border-color:#854d0e}
.horses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.horse{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.horse-header{padding:15px 20px;background:#252525;display:flex;justify-content:space-between;align-items:center}
.horse-name{font-size:1.125rem;font-weight:bold}
.horse-stall{font-size:.75rem;color:#854d0e}
.horse-body{padding:20px}
.horse-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.detail{background:#1f1f1f;padding:10px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:3px}
.detail-value{font-size:.875rem}
.horse-owner{background:#252525;padding:12px;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.owner-info{font-size:.875rem}
.owner-label{font-size:.65rem;color:#888}
.horse-status{padding:4px 10px;border-radius:4px;font-size:.75rem;background:#22c55e33;color:#22c55e}
</style>
</head>
<body>
<div class="header"><h1>🐴 Horse Boarding</h1><button class="btn">Add Horse</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">24</div><div class="stat-label">TOTAL STALLS</div></div>
<div class="stat"><div class="stat-value">21</div><div class="stat-label">OCCUPIED</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">AVAILABLE</div></div>
<div class="stat"><div class="stat-value">$42K</div><div class="stat-label">MONTHLY REV</div></div>
</div>
<div class="barns">
<button class="barn active">Barn A</button>
<button class="barn">Barn B</button>
<button class="barn">Pasture</button>
</div>
<div class="horses" id="horses"></div>
<script>
const horses=[
{name:'Thunder',stall:'A-01',breed:'Thoroughbred',age:8,color:'Bay',owner:'Sarah Mitchell',plan:'Full Board',status:'healthy'},
{name:'Starlight',stall:'A-02',breed:'Arabian',age:6,color:'Grey',owner:'James Cooper',plan:'Full Board',status:'healthy'},
{name:'Duke',stall:'A-03',breed:'Quarter Horse',age:12,color:'Chestnut',owner:'Emma Wilson',plan:'Pasture Board',status:'healthy'},
{name:'Bella',stall:'A-04',breed:'Warmblood',age:5,color:'Black',owner:'Michael Chen',plan:'Training Board',status:'healthy'},
{name:'Scout',stall:'A-05',breed:'Paint',age:9,color:'Pinto',owner:'Lisa Anderson',plan:'Full Board',status:'healthy'},
{name:'Apollo',stall:'A-06',breed:'Hanoverian',age:7,color:'Dark Bay',owner:'Robert Taylor',plan:'Show Board',status:'healthy'}
];
document.getElementById('horses').innerHTML=horses.map(h=>`
<div class="horse">
<div class="horse-header">
<span class="horse-name">${h.name}</span>
<span class="horse-stall">STALL ${h.stall}</span>
</div>
<div class="horse-body">
<div class="horse-details">
<div class="detail"><div class="detail-label">BREED</div><div class="detail-value">${h.breed}</div></div>
<div class="detail"><div class="detail-label">AGE</div><div class="detail-value">${h.age} years</div></div>
<div class="detail"><div class="detail-label">COLOR</div><div class="detail-value">${h.color}</div></div>
<div class="detail"><div class="detail-label">PLAN</div><div class="detail-value">${h.plan}</div></div>
</div>
<div class="horse-owner">
<div class="owner-info"><div class="owner-label">OWNER</div>${h.owner}</div>
<span class="horse-status">${h.status.toUpperCase()}</span>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
