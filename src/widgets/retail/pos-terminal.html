<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POS Terminal - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"pos-terminal","name":"POS Terminal","icon":"💵","desc":"Point of sale terminal","category":"retail","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
    .pos-container{display:grid;grid-template-columns:1fr 350px;height:100vh}
    .products-section{padding:20px;overflow-y:auto}
    .cart-section{background:#1a1a1a;display:flex;flex-direction:column;border-left:1px solid #333}
    .search-bar{display:flex;gap:10px;margin-bottom:20px}
    .search-bar input{flex:1;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:16px}
    .categories{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .category-btn{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    .category-btn.active{background:#e94560;border-color:#e94560}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .product-card{background:#1a1a1a;border-radius:10px;padding:15px;text-align:center;cursor:pointer;border:1px solid #333}
    .product-card:hover{border-color:#e94560}
    .product-icon{font-size:2.5rem;margin-bottom:10px}
    .product-name{font-size:14px;margin-bottom:5px}
    .product-price{color:#e94560;font-weight:bold}
    .cart-header{padding:20px;border-bottom:1px solid #333}
    .cart-header h2{font-size:1.2rem}
    .cart-items{flex:1;overflow-y:auto;padding:10px}
    .cart-item{display:flex;align-items:center;gap:10px;padding:12px;background:#0a0a0a;border-radius:8px;margin-bottom:8px}
    .cart-item-info{flex:1}
    .cart-item-name{font-size:14px;margin-bottom:2px}
    .cart-item-price{color:#888;font-size:12px}
    .cart-item-qty{display:flex;align-items:center;gap:8px}
    .qty-btn{width:28px;height:28px;border-radius:4px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    .cart-item-total{font-weight:bold;color:#e94560;min-width:60px;text-align:right}
    .cart-summary{padding:20px;border-top:1px solid #333}
    .summary-row{display:flex;justify-content:space-between;padding:8px 0}
    .summary-row.total{font-size:1.5rem;font-weight:bold;border-top:1px solid #333;padding-top:15px;margin-top:10px}
    .summary-row.total .amount{color:#e94560}
    .pay-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
    .pay-btn{padding:15px;border-radius:8px;border:none;font-size:16px;font-weight:bold;cursor:pointer}
    .pay-btn.cash{background:#4ecdc4;color:#000}
    .pay-btn.card{background:#e94560;color:#fff}
    .pay-btn.clear{background:#333;color:#fff;grid-column:1/-1}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:30px;text-align:center;min-width:300px}
    .success-icon{font-size:4rem;margin-bottom:20px}
    .modal h2{margin-bottom:10px}
    .modal p{color:#888;margin-bottom:20px}
    .modal button{padding:12px 30px;border-radius:8px;border:none;background:#e94560;color:#fff;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <div class="pos-container">
    <div class="products-section">
      <div class="search-bar">
        <input type="text" id="search" placeholder="Search products..." oninput="filterProducts()">
      </div>
      <div class="categories" id="categories"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart-section">
      <div class="cart-header">
        <h2>🛒 Current Sale</h2>
      </div>
      <div class="cart-items" id="cartItems">
        <div style="text-align:center;padding:40px;color:#666">Cart is empty</div>
      </div>
      <div class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="summary-row"><span>Tax (8%)</span><span id="tax">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span class="amount" id="total">$0.00</span></div>
        <div class="pay-buttons">
          <button class="pay-btn cash" onclick="processPayment('cash')">💵 Cash</button>
          <button class="pay-btn card" onclick="processPayment('card')">💳 Card</button>
          <button class="pay-btn clear" onclick="clearCart()">Clear Cart</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="successModal">
    <div class="modal-content">
      <div class="success-icon">✅</div>
      <h2>Payment Complete!</h2>
      <p id="receiptInfo">Thank you for your purchase</p>
      <button onclick="newSale()">New Sale</button>
    </div>
  </div>

  <script>
    const products = [
      { id: '1', name: 'Coffee', price: 4.50, category: 'drinks', icon: '☕' },
      { id: '2', name: 'Latte', price: 5.50, category: 'drinks', icon: '🥛' },
      { id: '3', name: 'Tea', price: 3.50, category: 'drinks', icon: '🍵' },
      { id: '4', name: 'Juice', price: 4.00, category: 'drinks', icon: '🧃' },
      { id: '5', name: 'Water', price: 2.00, category: 'drinks', icon: '💧' },
      { id: '6', name: 'Croissant', price: 3.50, category: 'food', icon: '🥐' },
      { id: '7', name: 'Sandwich', price: 8.00, category: 'food', icon: '🥪' },
      { id: '8', name: 'Salad', price: 9.50, category: 'food', icon: '🥗' },
      { id: '9', name: 'Muffin', price: 3.00, category: 'food', icon: '🧁' },
      { id: '10', name: 'Cookie', price: 2.50, category: 'food', icon: '🍪' },
      { id: '11', name: 'Cake Slice', price: 5.00, category: 'desserts', icon: '🍰' },
      { id: '12', name: 'Ice Cream', price: 4.00, category: 'desserts', icon: '🍦' },
      { id: '13', name: 'Brownie', price: 3.50, category: 'desserts', icon: '🍫' },
      { id: '14', name: 'Gift Card', price: 25.00, category: 'other', icon: '🎁' },
      { id: '15', name: 'Merchandise', price: 15.00, category: 'other', icon: '👕' }
    ];

    const categories = ['all', 'drinks', 'food', 'desserts', 'other'];
    let cart = [];
    let selectedCategory = 'all';
    let sales = JSON.parse(localStorage.getItem('kiss-pos-sales') || '[]');

    function formatCurrency(amt) {
      return '$' + amt.toFixed(2);
    }

    function renderCategories() {
      document.getElementById('categories').innerHTML = categories.map(cat =>
        `<button class="category-btn ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat.charAt(0).toUpperCase() + cat.slice(1)}</button>`
      ).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      filterProducts();
    }

    function filterProducts() {
      const search = document.getElementById('search').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchCat = selectedCategory === 'all' || p.category === selectedCategory;
        const matchSearch = !search || p.name.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      document.getElementById('productsGrid').innerHTML = filtered.map(p => `
        <div class="product-card" onclick="addToCart('${p.id}')">
          <div class="product-icon">${p.icon}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">${formatCurrency(p.price)}</div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      renderCart();
    }

    function updateQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }

      renderCart();
    }

    function renderCart() {
      const cartEl = document.getElementById('cartItems');

      if (cart.length === 0) {
        cartEl.innerHTML = '<div style="text-align:center;padding:40px;color:#666">Cart is empty</div>';
        updateTotals();
        return;
      }

      cartEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.icon} ${item.name}</div>
            <div class="cart-item-price">${formatCurrency(item.price)} each</div>
          </div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
          </div>
          <div class="cart-item-total">${formatCurrency(item.price * item.qty)}</div>
        </div>
      `).join('');

      updateTotals();
    }

    function updateTotals() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const tax = subtotal * 0.08;
      const total = subtotal + tax;

      document.getElementById('subtotal').textContent = formatCurrency(subtotal);
      document.getElementById('tax').textContent = formatCurrency(tax);
      document.getElementById('total').textContent = formatCurrency(total);
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function processPayment(method) {
      if (cart.length === 0) {
        alert('Cart is empty');
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const tax = subtotal * 0.08;
      const total = subtotal + tax;

      // Save sale
      sales.push({
        id: Date.now().toString(),
        items: [...cart],
        subtotal,
        tax,
        total,
        method,
        timestamp: new Date().toISOString()
      });
      localStorage.setItem('kiss-pos-sales', JSON.stringify(sales));

      // Show success
      document.getElementById('receiptInfo').textContent =
        `${method.toUpperCase()} - ${formatCurrency(total)}`;
      document.getElementById('successModal').classList.add('active');
    }

    function newSale() {
      cart = [];
      renderCart();
      document.getElementById('successModal').classList.remove('active');
    }

    renderCategories();
    filterProducts();
    renderCart();
  </script>
</body>
</html>
