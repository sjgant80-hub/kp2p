<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Library - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"music-library","name":"Music Library","icon":"🎵","desc":"DJ music collection","category":"dj","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.search{padding:10px 20px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#e0e0e0;width:300px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#a855f7}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:6px;cursor:pointer;font-size:.875rem}
.filter.active{background:#a855f733;border-color:#a855f7;color:#a855f7}
.tracks{display:flex;flex-direction:column;gap:5px}
.track{display:grid;grid-template-columns:40px 1fr 80px 80px 60px 40px;align-items:center;gap:15px;padding:12px 15px;background:#1a1a1a;border-radius:8px;border:1px solid transparent}
.track:hover{border-color:#333}
.track-num{color:#888;font-size:.875rem}
.track-info{display:flex;flex-direction:column}
.track-title{font-weight:500}
.track-artist{font-size:.75rem;color:#888}
.track-bpm{font-size:.875rem;color:#a855f7}
.track-key{font-size:.875rem;background:#252525;padding:4px 8px;border-radius:4px}
.track-dur{font-size:.875rem;color:#888}
.track-play{width:30px;height:30px;background:#a855f7;border:none;border-radius:50%;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="header"><h1>🎵 Music Library</h1><input type="text" class="search" placeholder="🔍 Search tracks, artists, BPM..."></div>
<div class="stats">
<div class="stat"><div class="stat-value">2,847</div><div class="stat-label">Tracks</div></div>
<div class="stat"><div class="stat-value">156</div><div class="stat-label">Playlists</div></div>
<div class="stat"><div class="stat-value">48</div><div class="stat-label">Crates</div></div>
<div class="stat"><div class="stat-value">428h</div><div class="stat-label">Total Time</div></div>
</div>
<div class="filters">
<div class="filter active">All</div>
<div class="filter">House</div>
<div class="filter">Techno</div>
<div class="filter">Hip-Hop</div>
<div class="filter">Pop</div>
<div class="filter">80s</div>
<div class="filter">90s</div>
<div class="filter">Wedding</div>
</div>
<div class="tracks" id="tracks"></div>
<script>
const tracks=[
{title:'Blinding Lights',artist:'The Weeknd',bpm:171,key:'Fm',duration:'3:20'},
{title:'One More Time',artist:'Daft Punk',bpm:123,key:'Gm',duration:'5:20'},
{title:'Levels',artist:'Avicii',bpm:126,key:'Ab',duration:'3:19'},
{title:'Titanium',artist:'David Guetta ft. Sia',bpm:126,key:'Eb',duration:'4:05'},
{title:'Don\'t Start Now',artist:'Dua Lipa',bpm:124,key:'Bm',duration:'3:03'},
{title:'I Gotta Feeling',artist:'Black Eyed Peas',bpm:128,key:'G',duration:'4:49'},
{title:'Uptown Funk',artist:'Bruno Mars',bpm:115,key:'Dm',duration:'4:30'},
{title:'Get Lucky',artist:'Daft Punk',bpm:116,key:'Bm',duration:'6:09'},
{title:'Wake Me Up',artist:'Avicii',bpm:124,key:'Bm',duration:'4:07'},
{title:'Lean On',artist:'Major Lazer',bpm:98,key:'Gm',duration:'2:56'}
];
document.getElementById('tracks').innerHTML=tracks.map((t,i)=>`
<div class="track">
<span class="track-num">${i+1}</span>
<div class="track-info"><span class="track-title">${t.title}</span><span class="track-artist">${t.artist}</span></div>
<span class="track-bpm">${t.bpm} BPM</span>
<span class="track-key">${t.key}</span>
<span class="track-dur">${t.duration}</span>
<button class="track-play">▶</button>
</div>`).join('');
</script>
</body>
</html>
