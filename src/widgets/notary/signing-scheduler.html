<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing Scheduler - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"signing-scheduler","name":"Signing Scheduler","icon":"📝","desc":"Schedule notary signings","category":"notary","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#6366f1}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.time{font-weight:600}
.type{padding:4px 10px;background:#6366f133;color:#818cf8;border-radius:4px;font-size:.75rem}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#6366f1;color:#fff}
.actions{display:flex;gap:10px}
</style>
</head>
<body>
<div class="header"><h1>📝 Signing Scheduler</h1><button class="btn" onclick="alert('New')">+ New Signing</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">5</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">18</div><div class="stat-label">This Week</div></div>
<div class="stat"><div class="stat-value">$1.8k</div><div class="stat-label">Revenue</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Mobile</div></div>
</div>
<div class="list" id="list"></div>
<script>
const signings=[
{time:'10:00 AM',client:'Johnson Family',type:'Real Estate',location:'456 Oak St',docs:'Deed Transfer',fee:150,mobile:false},
{time:'1:00 PM',client:'ABC Corp',type:'Business',location:'789 Business Park',docs:'Corporate Docs',fee:200,mobile:true},
{time:'3:30 PM',client:'Smith Estate',type:'Estate',location:'Office',docs:'Will & Trust',fee:175,mobile:false},
{time:'5:00 PM',client:'Davis Couple',type:'Real Estate',location:'123 Maple Ave',docs:'Mortgage Closing',fee:250,mobile:true}
];
document.getElementById('list').innerHTML=signings.map(s=>`
<div class="card">
<div class="card-header"><span class="time">⏰ ${s.time}</span><span class="type">${s.type}${s.mobile?' 🚗':''}</span></div>
<div class="info">
<div><div class="row"><span class="label">Client</span><span>${s.client}</span></div><div class="row"><span class="label">Location</span><span>${s.location}</span></div></div>
<div><div class="row"><span class="label">Documents</span><span>${s.docs}</span></div><div class="row"><span class="label">Fee</span><span>$${s.fee}</span></div></div>
</div>
<div class="actions"><button class="btn" onclick="alert('Confirm')">Confirm</button><button class="btn" style="background:#333" onclick="alert('Reschedule')">Reschedule</button></div>
</div>`).join('');
</script>
</body>
</html>
