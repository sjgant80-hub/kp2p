<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Log - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"document-log","name":"Document Log","icon":"📋","desc":"Notary document journal","category":"notary","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#6366f1}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
table{width:100%;background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
th{text-align:left;padding:15px;background:#252525;font-size:.875rem;color:#888}
td{padding:15px;border-bottom:1px solid #333}
tr:last-child td{border-bottom:none}
.entry-num{color:#6366f1;font-weight:600}
.btn{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;background:#6366f1;color:#fff;font-size:.75rem}
</style>
</head>
<body>
<div class="header"><h1>📋 Document Log</h1><button class="btn" style="padding:8px 16px" onclick="alert('Add')">+ Add Entry</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">1,248</div><div class="stat-label">Total Entries</div></div>
<div class="stat"><div class="stat-value">45</div><div class="stat-label">This Month</div></div>
<div class="stat"><div class="stat-value">Dec 2024</div><div class="stat-label">Current Book</div></div>
<div class="stat"><div class="stat-value">5</div><div class="stat-label">Years Active</div></div>
</div>
<table>
<thead><tr><th>Entry #</th><th>Date</th><th>Signer</th><th>Document Type</th><th>ID Type</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<script>
const entries=[
{num:1248,date:'Dec 27, 2024',signer:'John Smith',doc:'Deed of Trust',id:'Driver License',fee:15},
{num:1247,date:'Dec 27, 2024',signer:'Sarah Johnson',doc:'Power of Attorney',id:'Passport',fee:15},
{num:1246,date:'Dec 26, 2024',signer:'Mike Davis',doc:'Affidavit',id:'Driver License',fee:15},
{num:1245,date:'Dec 26, 2024',signer:'Lisa Wilson',doc:'Loan Documents',id:'State ID',fee:15},
{num:1244,date:'Dec 25, 2024',signer:'ABC Corporation',doc:'Corporate Resolution',id:'Multiple',fee:25}
];
document.getElementById('tbody').innerHTML=entries.map(e=>`<tr>
<td class="entry-num">#${e.num}</td>
<td>${e.date}</td>
<td>${e.signer}</td>
<td>${e.doc}</td>
<td>${e.id}</td>
<td><button class="btn" onclick="alert('View')">View</button></td>
</tr>`).join('');
</script>
</body>
</html>
