<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skate Rental - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"skate-rental","name":"Skate Rental","icon":"👟","desc":"Skate rental management","category":"skating","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0ea5e9}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;margin-bottom:30px}
.size-card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.size-num{font-size:2rem;font-weight:bold;color:#0ea5e9}
.size-type{font-size:.75rem;color:#888;margin-bottom:10px}
.size-stock{display:flex;justify-content:center;gap:20px;margin-bottom:10px}
.stock-item{text-align:center}
.stock-value{font-weight:bold}
.stock-label{font-size:.65rem;color:#888}
.stock-low{color:#f59e0b}
.stock-out{color:#ef4444}
.active-rentals{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.rentals-title{font-weight:600;margin-bottom:15px;display:flex;justify-content:space-between}
.rental{display:flex;align-items:center;gap:15px;padding:15px;background:#252525;border-radius:8px;margin-bottom:10px}
.rental-num{background:#0ea5e9;color:#fff;padding:10px 15px;border-radius:6px;font-weight:bold}
.rental-info{flex:1}
.rental-size{font-weight:500}
.rental-time{font-size:.75rem;color:#888}
.rental-timer{text-align:right}
.timer-value{font-weight:bold;color:#0ea5e9}
.timer-label{font-size:.65rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>👟 Skate Rental</h1><button class="btn">+ New Rental</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">42</div><div class="stat-label">Out Now</div></div>
<div class="stat"><div class="stat-value">158</div><div class="stat-label">Available</div></div>
<div class="stat"><div class="stat-value">$504</div><div class="stat-label">Today's Revenue</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Maintenance</div></div>
</div>
<h2 style="margin-bottom:15px">Inventory by Size</h2>
<div class="inventory" id="inventory"></div>
<div class="active-rentals">
<div class="rentals-title"><span>Active Rentals</span><span style="color:#888">42 out</span></div>
<div id="rentals"></div>
</div>
<script>
const sizes=[
{size:'Y10',type:'Youth',total:15,out:3,maint:0},
{size:'Y12',type:'Youth',total:20,out:8,maint:1},
{size:'6',type:'Adult',total:25,out:12,maint:0},
{size:'8',type:'Adult',total:30,out:10,maint:1},
{size:'10',type:'Adult',total:25,out:6,maint:0},
{size:'12',type:'Adult',total:15,out:3,maint:1}
];
const rentals=[
{num:'R-247',size:'8 Adult',start:'1:30 PM',elapsed:'45 min'},
{num:'R-246',size:'6 Adult',start:'1:15 PM',elapsed:'1 hr'},
{num:'R-245',size:'Y12 Youth',start:'1:00 PM',elapsed:'1:15'},
{num:'R-244',size:'10 Adult',start:'12:45 PM',elapsed:'1:30'}
];
document.getElementById('inventory').innerHTML=sizes.map(s=>{
const avail=s.total-s.out-s.maint;
const cls=avail===0?'stock-out':avail<5?'stock-low':'';
return`<div class="size-card">
<div class="size-num">${s.size}</div>
<div class="size-type">${s.type}</div>
<div class="size-stock">
<div class="stock-item"><div class="stock-value ${cls}">${avail}</div><div class="stock-label">Available</div></div>
<div class="stock-item"><div class="stock-value">${s.out}</div><div class="stock-label">Out</div></div>
</div>
</div>`;
}).join('');
document.getElementById('rentals').innerHTML=rentals.map(r=>`
<div class="rental">
<div class="rental-num">${r.num}</div>
<div class="rental-info"><div class="rental-size">Size ${r.size}</div><div class="rental-time">Checked out: ${r.start}</div></div>
<div class="rental-timer"><div class="timer-value">${r.elapsed}</div><div class="timer-label">Elapsed</div></div>
</div>`).join('');
</script>
</body>
</html>
