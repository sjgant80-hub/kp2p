<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shore Excursions - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"shore-excursions","name":"Shore Excursions","icon":"🏝️","desc":"Book shore trips","category":"cruise","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0284c7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.port{background:linear-gradient(135deg,#0284c7 0%,#0369a1 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.port-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.port-name{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.port-info{display:flex;gap:20px;font-size:.875rem;opacity:.9}
.excursions{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.excursion{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.excursion-image{height:140px;background:linear-gradient(135deg,#164e63 0%,#0c4a6e 100%);display:flex;align-items:center;justify-content:center;font-size:4rem}
.excursion-body{padding:20px}
.excursion-type{font-size:.75rem;color:#0284c7;margin-bottom:5px}
.excursion-title{font-size:1.125rem;font-weight:bold;margin-bottom:10px}
.excursion-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.excursion-details{display:flex;gap:15px;margin-bottom:15px;font-size:.75rem;color:#888}
.excursion-footer{display:flex;justify-content:space-between;align-items:center}
.excursion-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.excursion-price span{font-size:.75rem;color:#888;font-weight:normal}
.spots{font-size:.75rem;color:#f59e0b}
</style>
</head>
<body>
<div class="header"><h1>🏝️ Shore Excursions</h1><button class="btn">My Bookings</button></div>
<div class="port">
<div class="port-label">NEXT PORT OF CALL</div>
<div class="port-name">Cozumel, Mexico</div>
<div class="port-info">
<span>📅 Tomorrow, Jan 15</span>
<span>⚓ Dock: 8:00 AM</span>
<span>🚢 All Aboard: 5:00 PM</span>
</div>
</div>
<div class="excursions" id="excursions"></div>
<script>
const excursions=[
{icon:'🤿',type:'Adventure',title:'Snorkeling at Palancar Reef',desc:'Explore one of the world\'s most beautiful coral reefs with expert guides and equipment included.',duration:'4 hours',activity:'Active',price:89,spots:8},
{icon:'🏛️',type:'Cultural',title:'Tulum Mayan Ruins',desc:'Journey to the ancient walled city overlooking the Caribbean Sea. Includes lunch and beach time.',duration:'7 hours',activity:'Moderate',price:129,spots:15},
{icon:'🚙',type:'Exploration',title:'Island Jeep Adventure',desc:'Drive your own jeep through Cozumel\'s jungle trails, visit a tequila factory, and swim in a cenote.',duration:'5 hours',activity:'Active',price:99,spots:6},
{icon:'🏖️',type:'Relaxation',title:'Beach Break at Mr. Sanchos',desc:'All-inclusive beach club experience with pools, watersports, and unlimited food & drinks.',duration:'Flexible',activity:'Easy',price:69,spots:50},
{icon:'🐬',type:'Nature',title:'Dolphin Encounter',desc:'Meet and interact with dolphins in a natural lagoon setting. Photo package included.',duration:'3 hours',activity:'Easy',price:159,spots:4}
];
document.getElementById('excursions').innerHTML=excursions.map(e=>`
<div class="excursion">
<div class="excursion-image">${e.icon}</div>
<div class="excursion-body">
<div class="excursion-type">${e.type.toUpperCase()}</div>
<div class="excursion-title">${e.title}</div>
<div class="excursion-desc">${e.desc}</div>
<div class="excursion-details">
<span>⏱️ ${e.duration}</span>
<span>🏃 ${e.activity}</span>
</div>
<div class="excursion-footer">
<span class="excursion-price">$${e.price} <span>/person</span></span>
<span class="spots">${e.spots} spots left</span>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
