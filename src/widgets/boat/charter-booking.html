<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charter Booking - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"charter-booking","name":"Charter Booking","icon":"⛵","desc":"Boat charter reservations","category":"boat","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0284c7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#0284c7}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.bookings{display:flex;flex-direction:column;gap:15px}
.booking{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.booking-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.booking-vessel{font-size:1.125rem;font-weight:bold}
.booking-type{font-size:.75rem;color:#0284c7}
.booking-status{padding:4px 10px;border-radius:4px;font-size:.7rem}
.status-confirmed{background:#15803d33;color:#15803d}
.status-pending{background:#eab30833;color:#eab308}
.status-active{background:#0284c733;color:#0284c7}
.booking-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:10px;border-radius:6px}
.detail-label{font-size:.65rem;color:#888;margin-bottom:2px}
.detail-value{font-size:.875rem}
.booking-footer{display:flex;justify-content:space-between;align-items:center}
.booking-price{font-size:1.125rem;font-weight:bold;color:#0284c7}
</style>
</head>
<body>
<div class="header"><h1>⛵ Charters</h1><button class="btn">New Booking</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">8</div><div class="stat-label">TODAY'S CHARTERS</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">ACTIVE NOW</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">VESSELS</div></div>
<div class="stat"><div class="stat-value">$18.5K</div><div class="stat-label">WEEKLY REV</div></div>
</div>
<div class="bookings" id="bookings"></div>
<script>
const bookings=[
{vessel:'Sea Breeze 42',type:'SAILING YACHT',status:'active',customer:'Thompson Family',date:'Today',time:'9:00 AM - 5:00 PM',guests:6,captain:'Capt. Mike',destination:'Harbor Islands',price:'$1,200'},
{vessel:'Ocean Runner',type:'FISHING BOAT',status:'active',customer:'Corporate Group',date:'Today',time:'6:00 AM - 2:00 PM',guests:8,captain:'Capt. Dave',destination:'Deep Sea',price:'$1,800'},
{vessel:'Sunset Cruiser',type:'PARTY BOAT',status:'confirmed',customer:'Johnson Wedding',date:'Today',time:'4:00 PM - 10:00 PM',guests:25,captain:'Capt. Sarah',destination:'Coastal Tour',price:'$3,500'},
{vessel:'Wind Dancer',type:'CATAMARAN',status:'confirmed',customer:'Williams Party',date:'Tomorrow',time:'10:00 AM - 6:00 PM',guests:12,captain:'Capt. Tom',destination:'Snorkel Reef',price:'$2,200'},
{vessel:'Blue Marlin',type:'SPORT FISHER',status:'pending',customer:'Martinez Group',date:'Jan 30',time:'5:00 AM - 1:00 PM',guests:4,captain:'TBD',destination:'Offshore',price:'$1,500'}
];
document.getElementById('bookings').innerHTML=bookings.map(b=>`
<div class="booking">
<div class="booking-header">
<div>
<div class="booking-vessel">${b.vessel}</div>
<div class="booking-type">${b.type}</div>
</div>
<span class="booking-status status-${b.status}">${b.status.toUpperCase()}</span>
</div>
<div class="booking-details">
<div class="detail"><div class="detail-label">CUSTOMER</div><div class="detail-value">${b.customer}</div></div>
<div class="detail"><div class="detail-label">DATE</div><div class="detail-value">${b.date}</div></div>
<div class="detail"><div class="detail-label">TIME</div><div class="detail-value">${b.time}</div></div>
<div class="detail"><div class="detail-label">GUESTS</div><div class="detail-value">${b.guests}</div></div>
<div class="detail"><div class="detail-label">CAPTAIN</div><div class="detail-value">${b.captain}</div></div>
<div class="detail"><div class="detail-label">DESTINATION</div><div class="detail-value">${b.destination}</div></div>
</div>
<div class="booking-footer">
<span class="booking-price">${b.price}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
