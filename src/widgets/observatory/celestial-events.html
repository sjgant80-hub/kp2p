<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celestial Events - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"celestial-events","name":"Celestial Events","icon":"🌠","desc":"Upcoming sky events","category":"observatory","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.featured{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.featured-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.featured-title{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.featured-info{display:flex;gap:20px;font-size:.875rem;opacity:.9}
.events{display:flex;flex-direction:column;gap:15px}
.event{background:#1a1a1a;border-radius:12px;border:1px solid #333;display:grid;grid-template-columns:100px 1fr auto;overflow:hidden}
.event-date{background:#252525;padding:20px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.date-month{font-size:.75rem;color:#3b82f6}
.date-day{font-size:1.75rem;font-weight:bold}
.date-year{font-size:.75rem;color:#888}
.event-info{padding:20px}
.event-name{font-size:1.125rem;font-weight:bold;margin-bottom:5px}
.event-type{font-size:.75rem;color:#3b82f6;margin-bottom:8px}
.event-desc{font-size:.875rem;color:#888;line-height:1.5}
.event-meta{padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:8px;border-left:1px solid #333}
.visibility{padding:4px 10px;border-radius:4px;font-size:.75rem}
.vis-excellent{background:#22c55e33;color:#22c55e}
.vis-good{background:#f59e0b33;color:#f59e0b}
.vis-fair{background:#6366f133;color:#6366f1}
.event-time{font-size:.75rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🌠 Celestial Events</h1><button class="btn">Set Alerts</button></div>
<div class="featured">
<div class="featured-label">TONIGHT'S HIGHLIGHT</div>
<div class="featured-title">🪐 Saturn at Opposition</div>
<div class="featured-info">
<span>🕐 Visible all night</span>
<span>📍 Look East after sunset</span>
<span>🔭 Rings visible with small scope</span>
</div>
</div>
<div class="events" id="events"></div>
<script>
const events=[
{date:{month:'JAN',day:'4',year:'2025'},name:'Quadrantids Meteor Shower Peak',type:'METEOR SHOWER',desc:'Up to 120 meteors per hour under ideal conditions. Best viewing after midnight.',visibility:'excellent',time:'2:00 AM - Dawn'},
{date:{month:'JAN',day:'13',year:'2025'},name:'Full Wolf Moon',type:'LUNAR EVENT',desc:'First full moon of the year. Named by Native American tribes for howling wolves.',visibility:'excellent',time:'All Night'},
{date:{month:'JAN',day:'18',year:'2025'},name:'Mars Conjunction with Moon',type:'CONJUNCTION',desc:'Mars will appear very close to the Moon in the night sky.',visibility:'good',time:'After Sunset'},
{date:{month:'JAN',day:'21',year:'2025'},name:'Venus at Greatest Eastern Elongation',type:'PLANETARY',desc:'Best time to view Venus as it reaches maximum separation from the Sun.',visibility:'good',time:'Evening Sky'},
{date:{month:'FEB',day:'12',year:'2025'},name:'Comet C/2024 A1 Perihelion',type:'COMET',desc:'May become visible to naked eye. Peak brightness expected.',visibility:'fair',time:'Pre-Dawn'}
];
document.getElementById('events').innerHTML=events.map(e=>`
<div class="event">
<div class="event-date">
<div class="date-month">${e.date.month}</div>
<div class="date-day">${e.date.day}</div>
<div class="date-year">${e.date.year}</div>
</div>
<div class="event-info">
<div class="event-name">${e.name}</div>
<div class="event-type">${e.type}</div>
<div class="event-desc">${e.desc}</div>
</div>
<div class="event-meta">
<span class="visibility vis-${e.visibility}">${e.visibility.toUpperCase()}</span>
<span class="event-time">🕐 ${e.time}</span>
</div>
</div>`).join('');
</script>
</body>
</html>
