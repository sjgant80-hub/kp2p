    let deck = [];

      deck = currentFilter === 'all'

        : CARDS.filter(c => c.cat === currentFilter);
      shuffleDeck();
    }

    function shuffleDeck() {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      currentIndex = 0;
      renderCards();
      updateCount();
    }

    function renderCards() {
      const stack = document.getElementById('cardStack');
      stack.innerHTML = '';

      // Show up to 4 cards in stack
      for (let i = Math.min(3, deck.length - currentIndex - 1); i >= 0; i--) {

        const cat = CATEGORIES[cardData.cat];

      const onStart = (e) => {
        isDragging = true;
        startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
        card.classList.add('dragging');
      };

      const onMove = (e) => {
        if (!isDragging) return;
        currentX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
        const diff = currentX - startX;
        const rotate = diff * 0.1;
        card.style.transform = `translateX(${diff}px) rotate(${rotate}deg)`;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        card.classList.remove('dragging');

        const diff = currentX - startX;
        if (Math.abs(diff) > 100) {
          card.classList.add(diff > 0 ? 'swiped-right' : 'swiped-left');
          setTimeout(() => nextCard(), 300);
        } else {
          card.style.transform = '';
        }
      };

      card.addEventListener('mousedown', onStart);
      card.addEventListener('touchstart', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);

      // Click to flip
      card.addEventListener('click', (e) => {
        if (Math.abs(currentX - startX) < 10) {
          card.classList.toggle('flipped');
        }
      });
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % deck.length;
      renderCards();
      updateCount();
    }

    function skipCard() {
      const card = document.querySelector('.card');
      if (card) {
        card.classList.add('swiped-left');
        setTimeout(() => nextCard(), 300);
      }
    }

    function flipCard() {
      const card = document.querySelector('.card');
      if (card) card.classList.toggle('flipped');
    }

    function toggleFavorite(index, e) {
      e.stopPropagation();
      const idx = favorites.indexOf(index);
      if (idx > -1) {
        favorites.splice(idx, 1);
      } else {
        favorites.push(index);
      }
      localStorage.setItem('tales150-favorites', JSON.stringify(favorites));
      renderCards();
      renderFavorites();
    }

    function shareCard(index, e) {
      e.stopPropagation();
      const card = CARDS[index];
      const text = `Tales 150: ${card.q}`;
      if (navigator.share) {
        navigator.share({ text });
      } else {
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
      }
    }

    function toggleFavorites() {
      document.getElementById('favPanel').classList.toggle('open');
      renderFavorites();
    }

    function renderFavorites() {
      const list = document.getElementById('favList');
      if (favorites.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:40px;">No favorites yet!<br>Tap ❤️ to save cards.</div>';
        return;
      }

      list.innerHTML = favorites.map(idx => {
        const card = CARDS[idx];
        const cat = CATEGORIES[card.cat];
        return `
          <div class="fav-item">
            <div class="fav-item-cat">${cat.icon} ${cat.name}</div>
            ${card.q}
            <button class="fav-remove" onclick="removeFavorite(${idx})">×</button>
          </div>
        `;
      }).join('');
    }

    function removeFavorite(index) {
      favorites = favorites.filter(i => i !== index);
      localStorage.setItem('tales150-favorites', JSON.stringify(favorites));
      renderFavorites();
      renderCards();
    }

    function updateCount() {
      document.getElementById('currentCard').textContent = currentIndex + 1;
      document.getElementById('totalCards').textContent = deck.length;
    }

    // Category tabs
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.cat;
        initDeck();
      });
    });

    // Initialize
    initDeck();
  </script>
</body>
</html>
