<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drink Menu - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"drink-menu","name":"Drink Menu","icon":"☕","desc":"Coffee shop menu","category":"coffee","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 20px;background:#1a1a1a;border:1px solid #333;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab.active{background:#78350f;border-color:#92400e;color:#fbbf24}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.card-icon{font-size:2.5rem;margin-bottom:10px}
.card-name{font-weight:600;margin-bottom:5px}
.card-desc{font-size:.75rem;color:#888;margin-bottom:15px;min-height:36px}
.sizes{display:flex;justify-content:center;gap:10px;margin-bottom:15px}
.size{padding:6px 12px;background:#252525;border-radius:6px;font-size:.75rem}
.size span{display:block;color:#888;font-size:.65rem}
.btn{width:100%;padding:10px;border:none;border-radius:6px;cursor:pointer;background:#92400e;color:#fbbf24}
</style>
</head>
<body>
<div class="header"><h1>☕ Drink Menu</h1></div>
<div class="tabs">
<div class="tab active">Espresso</div>
<div class="tab">Brewed</div>
<div class="tab">Cold</div>
<div class="tab">Tea</div>
<div class="tab">Specialty</div>
</div>
<div class="grid" id="grid"></div>
<script>
const drinks=[
{icon:'☕',name:'Espresso',desc:'Rich, full-bodied single or double shot',s:2.50,m:3.00,l:3.50},
{icon:'☕',name:'Americano',desc:'Espresso with hot water for smooth taste',s:3.00,m:3.50,l:4.00},
{icon:'🥛',name:'Latte',desc:'Espresso with steamed milk and light foam',s:4.00,m:4.50,l:5.00},
{icon:'☕',name:'Cappuccino',desc:'Equal parts espresso, steamed milk, foam',s:4.00,m:4.50,l:5.00},
{icon:'🍫',name:'Mocha',desc:'Espresso, chocolate, steamed milk, whipped cream',s:4.50,m:5.00,l:5.50},
{icon:'🧊',name:'Iced Latte',desc:'Espresso over ice with cold milk',s:4.50,m:5.00,l:5.50}
];
document.getElementById('grid').innerHTML=drinks.map(d=>`
<div class="card">
<div class="card-icon">${d.icon}</div>
<div class="card-name">${d.name}</div>
<div class="card-desc">${d.desc}</div>
<div class="sizes">
<div class="size">$${d.s.toFixed(2)}<span>Small</span></div>
<div class="size">$${d.m.toFixed(2)}<span>Medium</span></div>
<div class="size">$${d.l.toFixed(2)}<span>Large</span></div>
</div>
<button class="btn" onclick="alert('Add')">Add to Order</button>
</div>`).join('');
</script>
</body>
</html>
