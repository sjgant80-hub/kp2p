<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Stats - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"player-stats","name":"Player Stats","icon":"📈","desc":"Track esports player performance","category":"gaming","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.search-bar{flex:1;max-width:300px}
.search-bar input{width:100%;padding:10px 15px;border:1px solid #333;border-radius:6px;background:#1a1a1a;color:#e0e0e0}
.leaderboard{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden;margin-bottom:20px}
.leaderboard-header{display:grid;grid-template-columns:60px 1fr 80px 80px 80px 100px;padding:15px 20px;background:#252525;font-weight:600;font-size:.875rem;color:#888}
.leaderboard-row{display:grid;grid-template-columns:60px 1fr 80px 80px 80px 100px;padding:12px 20px;border-top:1px solid #333;align-items:center}
.leaderboard-row:hover{background:#252525}
.rank{font-size:1.25rem;font-weight:bold;text-align:center}
.rank.gold{color:#ffd700}
.rank.silver{color:#c0c0c0}
.rank.bronze{color:#cd7f32}
.player-info{display:flex;align-items:center;gap:12px}
.player-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:bold}
.player-name{font-weight:500}
.player-team{font-size:.75rem;color:#888}
.stat-cell{text-align:center}
.stat-value{font-weight:bold}
.stat-label{font-size:.65rem;color:#888}
.winrate{padding:4px 8px;border-radius:4px;font-size:.875rem;font-weight:bold}
.winrate.high{background:#10b98133;color:#10b981}
.winrate.mid{background:#f59e0b33;color:#f59e0b}
.winrate.low{background:#ef444433;color:#ef4444}
.player-detail{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.detail-header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.detail-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold}
.detail-name{font-size:1.5rem;font-weight:600}
.detail-meta{font-size:.875rem;color:#888}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px}
.stat-box{background:#252525;padding:15px;border-radius:8px;text-align:center}
.stat-box .value{font-size:1.5rem;font-weight:bold;color:#10b981}
.stat-box .label{font-size:.75rem;color:#888;margin-top:5px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem}
.btn-primary{background:#10b981;color:#fff}
</style>
</head>
<body>
<div class="header">
<h1>📈 Player Stats</h1>
<div class="search-bar">
<input type="text" id="searchInput" placeholder="Search players..." oninput="render()">
</div>
<button class="btn btn-primary" onclick="alert('Add player')">+ Add Player</button>
</div>

<div class="leaderboard">
<div class="leaderboard-header">
<div>Rank</div>
<div>Player</div>
<div>Matches</div>
<div>K/D</div>
<div>Avg DMG</div>
<div>Win Rate</div>
</div>
<div id="leaderboardBody"></div>
</div>

<script>
const STORAGE_KEY = 'kiss_player_stats';
let players = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
}

function getWinrateClass(wr) {
  if (wr >= 60) return 'high';
  if (wr >= 45) return 'mid';
  return 'low';
}

function getRankClass(rank) {
  if (rank === 1) return 'gold';
  if (rank === 2) return 'silver';
  if (rank === 3) return 'bronze';
  return '';
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = players.filter(p =>
    p.name.toLowerCase().includes(search) ||
    p.team.toLowerCase().includes(search)
  );

  const body = document.getElementById('leaderboardBody');

  if (filtered.length === 0) {
    body.innerHTML = '<div style="padding:40px;text-align:center;color:#666;grid-column:1/-1">No players found</div>';
    return;
  }

  const sorted = [...filtered].sort((a, b) => b.rating - a.rating);

  body.innerHTML = sorted.map((p, i) => {
    const rank = i + 1;
    return `
      <div class="leaderboard-row">
        <div class="rank ${getRankClass(rank)}">#${rank}</div>
        <div class="player-info">
          <div class="player-avatar">${p.name.charAt(0)}</div>
          <div>
            <div class="player-name">${p.name}</div>
            <div class="player-team">${p.team}</div>
          </div>
        </div>
        <div class="stat-cell">
          <div class="stat-value">${p.matches}</div>
          <div class="stat-label">played</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value">${p.kd.toFixed(2)}</div>
          <div class="stat-label">K/D</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value">${p.avgDmg}</div>
          <div class="stat-label">ADR</div>
        </div>
        <div class="stat-cell">
          <span class="winrate ${getWinrateClass(p.winrate)}">${p.winrate}%</span>
        </div>
      </div>
    `;
  }).join('');
}

if (players.length === 0) {
  players = [
    { id: '1', name: 'NightHawk', team: 'Team Alpha', matches: 245, kd: 1.82, avgDmg: 187, winrate: 68, rating: 2150 },
    { id: '2', name: 'ShadowBlade', team: 'Phoenix Rising', matches: 312, kd: 1.65, avgDmg: 175, winrate: 62, rating: 2080 },
    { id: '3', name: 'CyberNinja', team: 'Dark Knights', matches: 198, kd: 1.55, avgDmg: 168, winrate: 58, rating: 1950 },
    { id: '4', name: 'StormRider', team: 'Storm Chasers', matches: 276, kd: 1.48, avgDmg: 162, winrate: 55, rating: 1890 },
    { id: '5', name: 'IronWolf', team: 'Cyber Wolves', matches: 189, kd: 1.42, avgDmg: 155, winrate: 52, rating: 1820 },
    { id: '6', name: 'BlazeFury', team: 'Nova Squad', matches: 223, kd: 1.35, avgDmg: 148, winrate: 48, rating: 1750 },
    { id: '7', name: 'ThunderBolt', team: 'Thunder Strike', matches: 167, kd: 1.28, avgDmg: 142, winrate: 45, rating: 1680 },
    { id: '8', name: 'FrostBite', team: 'Ice Dragons', matches: 145, kd: 1.22, avgDmg: 138, winrate: 42, rating: 1620 }
  ];
  save();
}

render();
</script>
</body>
</html>
