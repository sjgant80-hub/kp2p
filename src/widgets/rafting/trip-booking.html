<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trip Booking - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"trip-booking","name":"Rafting Trips","icon":"🚣","desc":"Book rafting adventures","category":"rafting","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.conditions{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px}
.condition{text-align:center}
.condition-value{font-size:1.25rem;font-weight:bold;color:#0891b2}
.condition-label{font-size:.75rem;color:#888}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px}
.trip{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.trip-banner{padding:25px;background:linear-gradient(135deg,#0891b2 0%,#0e7490 100%)}
.trip-name{font-size:1.25rem;font-weight:bold;margin-bottom:5px}
.trip-river{font-size:.875rem;opacity:.9}
.trip-body{padding:20px}
.trip-details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px;text-align:center}
.trip-detail-value{font-weight:bold;color:#0891b2}
.trip-detail-label{font-size:.7rem;color:#888}
.trip-desc{font-size:.875rem;color:#888;line-height:1.5;margin-bottom:15px}
.trip-includes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}
.include-tag{padding:4px 10px;background:#252525;border-radius:4px;font-size:.75rem}
.trip-footer{display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #333}
.trip-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.trip-price span{font-size:.75rem;color:#888;font-weight:normal}
.book-btn{padding:10px 25px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>🚣 Rafting Trips</h1><button class="btn">My Bookings</button></div>
<div class="conditions">
<div class="condition"><div class="condition-value">2,450 cfs</div><div class="condition-label">River Flow</div></div>
<div class="condition"><div class="condition-value">Class III-IV</div><div class="condition-label">Rapids</div></div>
<div class="condition"><div class="condition-value">58°F</div><div class="condition-label">Water Temp</div></div>
<div class="condition"><div class="condition-value">☀️ Clear</div><div class="condition-label">Weather</div></div>
<div class="condition"><div class="condition-value">🟢 Optimal</div><div class="condition-label">Conditions</div></div>
</div>
<div class="trips" id="trips"></div>
<script>
const trips=[
{name:'Half-Day Adventure',river:'Colorado River',duration:'4 hours',distance:'8 miles',class:'III',minAge:'8+',desc:'Perfect introduction to whitewater! Navigate exciting rapids with professional guides. Great for families and first-timers.',includes:['Guide','Equipment','Snacks','Photos'],price:89},
{name:'Full-Day Expedition',river:'Arkansas River',duration:'8 hours',distance:'16 miles',class:'III-IV',minAge:'12+',desc:'The ultimate rafting experience with challenging rapids, riverside lunch, and stunning canyon scenery.',includes:['Guide','Equipment','Lunch','Wetsuit','Photos'],price:159},
{name:'Multi-Day Journey',river:'Grand Canyon',duration:'3 days',distance:'52 miles',class:'IV-V',minAge:'16+',desc:'An unforgettable adventure through legendary rapids. Camp under the stars in the world\'s most famous canyon.',includes:['All Gear','Meals','Camping','Guide Team'],price:895},
{name:'Sunset Float',river:'Rio Grande',duration:'3 hours',distance:'5 miles',class:'I-II',minAge:'All',desc:'Relaxing scenic float perfect for all ages. Enjoy stunning sunset views and gentle rapids.',includes:['Guide','Equipment','Drinks'],price:59}
];
document.getElementById('trips').innerHTML=trips.map(t=>`
<div class="trip">
<div class="trip-banner"><div class="trip-name">${t.name}</div><div class="trip-river">📍 ${t.river}</div></div>
<div class="trip-body">
<div class="trip-details">
<div><div class="trip-detail-value">${t.duration}</div><div class="trip-detail-label">Duration</div></div>
<div><div class="trip-detail-value">${t.distance}</div><div class="trip-detail-label">Distance</div></div>
<div><div class="trip-detail-value">${t.class}</div><div class="trip-detail-label">Rapids</div></div>
<div><div class="trip-detail-value">${t.minAge}</div><div class="trip-detail-label">Min Age</div></div>
</div>
<div class="trip-desc">${t.desc}</div>
<div class="trip-includes">${t.includes.map(i=>`<span class="include-tag">✓ ${i}</span>`).join('')}</div>
<div class="trip-footer"><span class="trip-price">$${t.price} <span>/person</span></span><button class="book-btn">Book Now</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
