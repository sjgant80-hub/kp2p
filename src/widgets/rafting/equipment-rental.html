<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment Rental - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"raft-equipment","name":"Rafting Equipment","icon":"🦺","desc":"Rent rafting gear","category":"rafting","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#0891b2}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.equipment{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.item{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.item-icon{font-size:3rem;margin-bottom:10px}
.item-name{font-weight:bold;margin-bottom:5px}
.item-sizes{font-size:.875rem;color:#888;margin-bottom:15px}
.item-stock{display:flex;justify-content:space-around;margin-bottom:15px}
.stock{text-align:center}
.stock-value{font-weight:bold;color:#0891b2}
.stock-label{font-size:.7rem;color:#888}
.item-price{font-size:1.125rem;font-weight:bold;color:#22c55e;margin-bottom:15px}
.rent-btn{width:100%;padding:10px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer}
.rent-btn:disabled{background:#333;cursor:not-allowed}
</style>
</head>
<body>
<div class="header"><h1>🦺 Equipment Rental</h1><button class="btn">My Rentals</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">156</div><div class="stat-label">Total Items</div></div>
<div class="stat"><div class="stat-value">42</div><div class="stat-label">Rented Out</div></div>
<div class="stat"><div class="stat-value">$1.2k</div><div class="stat-label">Today's Revenue</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">Trips Today</div></div>
</div>
<div class="equipment" id="equipment"></div>
<script>
const equipment=[
{name:'Whitewater Raft',icon:'🚣',sizes:'6-8 Person',available:12,total:18,price:150,unit:'day'},
{name:'Life Jacket (PFD)',icon:'🦺',sizes:'S / M / L / XL',available:45,total:60,price:15,unit:'day'},
{name:'Helmet',icon:'⛑️',sizes:'S / M / L',available:38,total:50,price:10,unit:'day'},
{name:'Wetsuit',icon:'🏊',sizes:'XS-XXL',available:22,total:40,price:25,unit:'day'},
{name:'Paddle',icon:'🏒',sizes:'Standard / Youth',available:52,total:70,price:8,unit:'day'},
{name:'Dry Bag',icon:'🎒',sizes:'20L / 40L / 60L',available:28,total:35,price:12,unit:'day'},
{name:'Splash Jacket',icon:'🧥',sizes:'S / M / L / XL',available:18,total:25,price:20,unit:'day'},
{name:'River Shoes',icon:'👟',sizes:'6-13',available:15,total:30,price:12,unit:'day'}
];
document.getElementById('equipment').innerHTML=equipment.map(e=>`
<div class="item">
<div class="item-icon">${e.icon}</div>
<div class="item-name">${e.name}</div>
<div class="item-sizes">${e.sizes}</div>
<div class="item-stock">
<div class="stock"><div class="stock-value">${e.available}</div><div class="stock-label">Available</div></div>
<div class="stock"><div class="stock-value">${e.total}</div><div class="stock-label">Total</div></div>
</div>
<div class="item-price">$${e.price}/${e.unit}</div>
<button class="rent-btn"${e.available===0?' disabled':''}>Rent Now</button>
</div>`).join('');
</script>
</body>
</html>
