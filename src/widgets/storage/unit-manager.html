<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Manager - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"unit-manager","name":"Unit Manager","icon":"📦","desc":"Manage storage units","category":"storage","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#f97316}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.filters{display:flex;gap:10px;margin-bottom:20px}
.filter{padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:6px;cursor:pointer;font-size:.875rem}
.filter.active{background:#f9731633;border-color:#f97316;color:#f97316}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.unit{background:#1a1a1a;border-radius:8px;border:1px solid #333;padding:15px;text-align:center;cursor:pointer}
.unit.rented{border-color:#22c55e;background:#22c55e10}
.unit.available{border-color:#f97316;background:#f9731610}
.unit.overdue{border-color:#ef4444;background:#ef444410}
.unit-num{font-weight:600;margin-bottom:5px}
.unit-size{font-size:.75rem;color:#888;margin-bottom:5px}
.unit-status{font-size:.65rem;padding:2px 6px;border-radius:3px}
.rented .unit-status{background:#22c55e33;color:#22c55e}
.available .unit-status{background:#f9731633;color:#f97316}
.overdue .unit-status{background:#ef444433;color:#ef4444}
</style>
</head>
<body>
<div class="header"><h1>📦 Unit Manager</h1></div>
<div class="stats">
<div class="stat"><div class="stat-value">150</div><div class="stat-label">Total Units</div></div>
<div class="stat"><div class="stat-value">128</div><div class="stat-label">Rented</div></div>
<div class="stat"><div class="stat-value">18</div><div class="stat-label">Available</div></div>
<div class="stat"><div class="stat-value">4</div><div class="stat-label">Overdue</div></div>
</div>
<div class="filters">
<div class="filter active">All</div>
<div class="filter">5x5</div>
<div class="filter">5x10</div>
<div class="filter">10x10</div>
<div class="filter">10x20</div>
<div class="filter">Climate</div>
</div>
<div class="grid" id="grid"></div>
<script>
const units=[];
for(let i=1;i<=30;i++){
const rand=Math.random();
units.push({
num:i.toString().padStart(3,'0'),
size:['5x5','5x10','10x10','10x20'][Math.floor(Math.random()*4)],
status:rand<0.1?'overdue':rand<0.25?'available':'rented'
});
}
document.getElementById('grid').innerHTML=units.map(u=>`
<div class="unit ${u.status}" onclick="alert('Unit ${u.num}')">
<div class="unit-num">#${u.num}</div>
<div class="unit-size">${u.size}</div>
<div class="unit-status">${u.status.charAt(0).toUpperCase()+u.status.slice(1)}</div>
</div>`).join('');
</script>
</body>
</html>
