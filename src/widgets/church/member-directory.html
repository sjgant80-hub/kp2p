<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Directory - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"member-directory","name":"Member Directory","icon":"👥","desc":"Church member database","category":"church","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#6d28d9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#6d28d9}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.search{display:flex;gap:10px;margin-bottom:20px}
.search input{flex:1;padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.search select{padding:12px 15px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.member{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.member-header{display:flex;gap:15px;margin-bottom:15px}
.member-avatar{width:50px;height:50px;background:#6d28d9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#fff}
.member-info h3{margin-bottom:3px}
.member-role{font-size:.75rem;color:#6d28d9}
.member-status{font-size:.75rem;color:#888}
.member-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:8px;border-radius:6px}
.detail-label{font-size:.6rem;color:#888}
.detail-value{font-size:.8rem}
.member-groups{display:flex;gap:6px;flex-wrap:wrap}
.group-tag{padding:4px 8px;background:#252525;border-radius:4px;font-size:.7rem}
</style>
</head>
<body>
<div class="header"><h1>👥 Members</h1><button class="btn">Add Member</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">847</div><div class="stat-label">TOTAL MEMBERS</div></div>
<div class="stat"><div class="stat-value">234</div><div class="stat-label">FAMILIES</div></div>
<div class="stat"><div class="stat-value">156</div><div class="stat-label">VOLUNTEERS</div></div>
<div class="stat"><div class="stat-value">23</div><div class="stat-label">NEW THIS YEAR</div></div>
</div>
<div class="search">
<input type="text" placeholder="Search members...">
<select><option>All Groups</option><option>Deacons</option><option>Choir</option><option>Youth</option><option>Women's Ministry</option></select>
</div>
<div class="members" id="members"></div>
<script>
const members=[
{name:'John Smith',role:'Senior Pastor',status:'Active Member since 2005',email:'john@church.org',phone:'555-0101',groups:['Leadership','Deacons']},
{name:'Mary Johnson',role:'Choir Director',status:'Active Member since 2010',email:'mary@church.org',phone:'555-0102',groups:['Choir','Worship Team','Women\'s Ministry']},
{name:'David Wilson',role:'Youth Leader',status:'Active Member since 2018',email:'david@church.org',phone:'555-0103',groups:['Youth','Men\'s Ministry']},
{name:'Sarah Brown',role:'Sunday School Teacher',status:'Active Member since 2015',email:'sarah@church.org',phone:'555-0104',groups:['Children\'s Ministry','Women\'s Ministry']},
{name:'Michael Davis',role:'Deacon',status:'Active Member since 2008',email:'michael@church.org',phone:'555-0105',groups:['Deacons','Outreach']},
{name:'Jennifer Lee',role:'Volunteer Coordinator',status:'Active Member since 2019',email:'jennifer@church.org',phone:'555-0106',groups:['Volunteers','Hospitality']}
];
document.getElementById('members').innerHTML=members.map(m=>`
<div class="member">
<div class="member-header">
<div class="member-avatar">${m.name.split(' ').map(n=>n[0]).join('')}</div>
<div class="member-info">
<h3>${m.name}</h3>
<div class="member-role">${m.role}</div>
<div class="member-status">${m.status}</div>
</div>
</div>
<div class="member-details">
<div class="detail"><div class="detail-label">EMAIL</div><div class="detail-value">${m.email}</div></div>
<div class="detail"><div class="detail-label">PHONE</div><div class="detail-value">${m.phone}</div></div>
</div>
<div class="member-groups">${m.groups.map(g=>`<span class="group-tag">${g}</span>`).join('')}</div>
</div>`).join('');
</script>
</body>
</html>
