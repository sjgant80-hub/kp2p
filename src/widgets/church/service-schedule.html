<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Schedule - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"service-schedule","name":"Service Schedule","icon":"⛪","desc":"Manage worship services","category":"church","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#6d28d9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.upcoming{background:linear-gradient(135deg,#6d28d9 0%,#4c1d95 100%);border-radius:12px;padding:25px;margin-bottom:20px}
.upcoming-label{font-size:.75rem;opacity:.8;margin-bottom:5px}
.upcoming-title{font-size:1.5rem;font-weight:bold;margin-bottom:10px}
.upcoming-info{display:flex;gap:20px;font-size:.875rem;opacity:.9}
.services{display:flex;flex-direction:column;gap:15px}
.service{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.service-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.service-name{font-size:1.125rem;font-weight:bold}
.service-type{font-size:.75rem;color:#6d28d9}
.service-time{font-size:.875rem;color:#888;margin-top:3px}
.service-badge{padding:4px 10px;border-radius:4px;font-size:.7rem;background:#6d28d933;color:#6d28d9}
.service-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:15px}
.detail{background:#252525;padding:10px;border-radius:6px;text-align:center}
.detail-label{font-size:.65rem;color:#888;margin-bottom:2px}
.detail-value{font-size:.875rem}
.service-actions{display:flex;gap:10px}
.action-btn{padding:8px 15px;border-radius:6px;cursor:pointer;font-size:.75rem}
.action-primary{background:#6d28d9;color:#fff;border:none}
.action-secondary{background:transparent;border:1px solid #333;color:#e0e0e0}
</style>
</head>
<body>
<div class="header"><h1>⛪ Services</h1><button class="btn">Add Service</button></div>
<div class="upcoming">
<div class="upcoming-label">THIS SUNDAY</div>
<div class="upcoming-title">Morning Worship Service</div>
<div class="upcoming-info">
<span>📅 Sunday, 10:00 AM</span>
<span>👤 Pastor John Smith</span>
<span>🎵 Worship Team A</span>
</div>
</div>
<div class="services" id="services"></div>
<script>
const services=[
{name:'Early Morning Service',type:'TRADITIONAL',day:'Sunday',time:'8:00 AM',pastor:'Pastor John',music:'Choir',attendance:150,childcare:true},
{name:'Morning Worship',type:'CONTEMPORARY',day:'Sunday',time:'10:00 AM',pastor:'Pastor John',music:'Worship Team A',attendance:450,childcare:true},
{name:'Evening Service',type:'TRADITIONAL',day:'Sunday',time:'6:00 PM',pastor:'Pastor Sarah',music:'Praise Band',attendance:120,childcare:false},
{name:'Wednesday Bible Study',type:'STUDY',day:'Wednesday',time:'7:00 PM',pastor:'Pastor Mike',music:'None',attendance:85,childcare:true},
{name:'Youth Service',type:'YOUTH',day:'Friday',time:'7:00 PM',pastor:'Youth Pastor Dan',music:'Youth Band',attendance:60,childcare:false}
];
document.getElementById('services').innerHTML=services.map(s=>`
<div class="service">
<div class="service-header">
<div>
<div class="service-name">${s.name}</div>
<div class="service-type">${s.type}</div>
<div class="service-time">📅 ${s.day} at ${s.time}</div>
</div>
<span class="service-badge">${s.childcare?'Childcare Available':'Adults Only'}</span>
</div>
<div class="service-details">
<div class="detail"><div class="detail-label">PASTOR</div><div class="detail-value">${s.pastor}</div></div>
<div class="detail"><div class="detail-label">MUSIC</div><div class="detail-value">${s.music}</div></div>
<div class="detail"><div class="detail-label">AVG ATTENDANCE</div><div class="detail-value">${s.attendance}</div></div>
</div>
<div class="service-actions">
<button class="action-btn action-primary">View Details</button>
<button class="action-btn action-secondary">Edit Schedule</button>
</div>
</div>`).join('');
</script>
</body>
</html>
