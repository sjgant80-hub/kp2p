<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swim Lessons - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"swim-lessons","name":"Swim Lessons","icon":"🎽","desc":"Swimming class registration","category":"aquatic","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0ea5e9;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.levels{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:10px}
.level{padding:12px 20px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer;white-space:nowrap}
.level.active{background:#0ea5e9;border-color:#0ea5e9}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.class{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.class-header{padding:20px;background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%)}
.class-level{font-size:.75rem;opacity:.9;margin-bottom:5px}
.class-name{font-size:1.125rem;font-weight:bold}
.class-body{padding:20px}
.class-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.info{background:#252525;padding:10px;border-radius:6px}
.info-label{font-size:.65rem;color:#888;margin-bottom:3px}
.info-value{font-size:.875rem;font-weight:500}
.class-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.class-footer{display:flex;justify-content:space-between;align-items:center}
.class-price{font-size:1.125rem;font-weight:bold;color:#22c55e}
.class-spots{font-size:.75rem;color:#888}
.spots-low{color:#f59e0b}
</style>
</head>
<body>
<div class="header"><h1>🎽 Swim Lessons</h1><button class="btn">My Classes</button></div>
<div class="levels">
<button class="level active">All Levels</button>
<button class="level">Beginner</button>
<button class="level">Intermediate</button>
<button class="level">Advanced</button>
<button class="level">Adult</button>
<button class="level">Private</button>
</div>
<div class="classes" id="classes"></div>
<script>
const classes=[
{level:'Beginner',name:'Water Babies',ages:'6mo - 2yrs',duration:'30 min',days:'Sat/Sun',time:'9:00 AM',spots:4,total:8,price:120,desc:'Parent-child class introducing babies to water in a safe, fun environment.'},
{level:'Beginner',name:'Guppies',ages:'3-5 yrs',duration:'30 min',days:'M/W/F',time:'4:00 PM',spots:2,total:6,price:150,desc:'Learn basic water safety, floating, and beginner strokes in small groups.'},
{level:'Intermediate',name:'Dolphins',ages:'6-9 yrs',duration:'45 min',days:'T/Th',time:'5:00 PM',spots:5,total:8,price:180,desc:'Build endurance and refine freestyle, backstroke, and treading water.'},
{level:'Advanced',name:'Sharks',ages:'10-14 yrs',duration:'60 min',days:'M/W/F',time:'6:00 PM',spots:6,total:10,price:200,desc:'Advanced strokes, diving, and pre-competitive training for confident swimmers.'},
{level:'Adult',name:'Adult Learn-to-Swim',ages:'18+',duration:'45 min',days:'T/Th',time:'7:00 PM',spots:8,total:10,price:160,desc:'Never too late to learn! Beginner-friendly classes for adult non-swimmers.'},
{level:'Private',name:'1-on-1 Coaching',ages:'All Ages',duration:'30 min',days:'By Appt',time:'Flexible',spots:12,total:20,price:75,desc:'Personalized instruction tailored to your goals and skill level.'}
];
document.getElementById('classes').innerHTML=classes.map(c=>`
<div class="class">
<div class="class-header">
<div class="class-level">${c.level.toUpperCase()}</div>
<div class="class-name">${c.name}</div>
</div>
<div class="class-body">
<div class="class-info">
<div class="info"><div class="info-label">AGES</div><div class="info-value">${c.ages}</div></div>
<div class="info"><div class="info-label">DURATION</div><div class="info-value">${c.duration}</div></div>
<div class="info"><div class="info-label">DAYS</div><div class="info-value">${c.days}</div></div>
<div class="info"><div class="info-label">TIME</div><div class="info-value">${c.time}</div></div>
</div>
<div class="class-desc">${c.desc}</div>
<div class="class-footer">
<span class="class-price">$${c.price}</span>
<span class="class-spots ${c.spots<=3?'spots-low':''}">${c.spots}/${c.total} spots left</span>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
