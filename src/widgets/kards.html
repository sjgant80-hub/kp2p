<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kards - Flashcard Study App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%); min-height: 100vh; color: #e4e4e7; }

        .header { background: rgba(0,0,0,0.3); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2d2d44; }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #ec4899, #f472b6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .logo-text { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #f472b6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .main { max-width: 900px; margin: 0 auto; padding: 2rem; }

        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
        .tab { padding: 0.6rem 1.25rem; background: rgba(255,255,255,0.05); border: 1px solid #2d2d44; border-radius: 8px; color: #a1a1aa; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .tab:hover { background: rgba(255,255,255,0.1); }
        .tab.active { background: linear-gradient(135deg, #ec4899, #f472b6); color: white; border-color: transparent; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Study Mode */
        .card-container { perspective: 1000px; height: 350px; margin-bottom: 2rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .card-front { background: linear-gradient(135deg, #1e1e3f 0%, #2d2d5a 100%); border: 2px solid #3d3d6a; }
        .card-back { background: linear-gradient(135deg, #2d1f3d 0%, #3d2d5a 100%); border: 2px solid #4d3d6a; transform: rotateY(180deg); }
        .card-label { font-size: 0.8rem; color: #a1a1aa; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .card-text { font-size: 1.5rem; line-height: 1.5; }
        .card-hint { font-size: 0.85rem; color: #a1a1aa; margin-top: 1rem; font-style: italic; }

        .study-controls { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .btn-again { background: #ef4444; color: white; }
        .btn-hard { background: #f59e0b; color: black; }
        .btn-good { background: #22c55e; color: black; }
        .btn-easy { background: #3b82f6; color: white; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-secondary { background: #2d2d44; color: #e4e4e7; }

        .progress-bar { height: 8px; background: #2d2d44; border-radius: 4px; margin-bottom: 1rem; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ec4899, #f472b6); transition: width 0.3s; }

        .stats-row { display: flex; justify-content: center; gap: 2rem; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-label { color: #a1a1aa; font-size: 0.8rem; }

        /* Deck Management */
        .deck-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .deck-card { background: rgba(255,255,255,0.05); border: 1px solid #2d2d44; border-radius: 12px; padding: 1.25rem; cursor: pointer; transition: all 0.2s; }
        .deck-card:hover { transform: translateY(-2px); border-color: #ec4899; }
        .deck-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .deck-count { font-size: 0.85rem; color: #a1a1aa; }
        .deck-due { font-size: 0.8rem; color: #ec4899; margin-top: 0.25rem; }

        /* Card Editor */
        .editor-panel { background: rgba(0,0,0,0.3); border: 1px solid #2d2d44; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .editor-row { margin-bottom: 1rem; }
        .editor-label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 0.4rem; }
        .editor-input { width: 100%; padding: 0.75rem; background: #0d0d15; border: 1px solid #2d2d44; border-radius: 8px; color: #e4e4e7; font-size: 0.95rem; }
        .editor-input:focus { outline: none; border-color: #ec4899; }
        textarea.editor-input { min-height: 100px; resize: vertical; }

        .card-list { max-height: 400px; overflow-y: auto; }
        .card-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; background: rgba(255,255,255,0.02); border-radius: 8px; margin-bottom: 0.5rem; }
        .card-item:hover { background: rgba(255,255,255,0.05); }
        .card-item-front { flex: 1; }
        .card-item-back { flex: 1; color: #a1a1aa; }
        .card-item-actions { display: flex; gap: 0.5rem; }
        .btn-icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }

        /* Import/Export */
        .import-area { border: 2px dashed #2d2d44; border-radius: 12px; padding: 2rem; text-align: center; color: #a1a1aa; cursor: pointer; transition: all 0.2s; margin-bottom: 1rem; }
        .import-area:hover { border-color: #ec4899; background: rgba(236, 72, 153, 0.1); }
        .import-area input { display: none; }

        .empty-state { text-align: center; padding: 3rem; color: #71717a; }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

        .keyboard-hint { font-size: 0.75rem; color: #71717a; text-align: center; margin-top: 1rem; }
        .keyboard-hint kbd { background: #2d2d44; padding: 0.2rem 0.5rem; border-radius: 4px; margin: 0 0.25rem; }

        @media (max-width: 600px) {
            .study-controls { flex-wrap: wrap; }
            .btn { flex: 1; min-width: 80px; justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">K</div>
            <span class="logo-text">Kards</span>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-secondary" style="font-size: 0.8rem;" onclick="importDeck()">Import</button>
            <button class="btn btn-secondary" style="font-size: 0.8rem;" onclick="exportDeck()">Export</button>
        </div>
    </header>

    <main class="main">
        <div class="tabs">
            <button class="tab active" onclick="setTab('study')">Study</button>
            <button class="tab" onclick="setTab('decks')">Decks</button>
            <button class="tab" onclick="setTab('edit')">Edit Cards</button>
            <button class="tab" onclick="setTab('stats')">Stats</button>
        </div>

        <!-- Study Tab -->
        <div id="tab-study" class="tab-content active">
            <div class="progress-bar">
                <div class="progress-fill" id="study-progress" style="width: 0%;"></div>
            </div>

            <div class="stats-row">
                <div class="stat">
                    <div class="stat-value" id="stat-remaining">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-correct">0</div>
                    <div class="stat-label">Correct</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-streak">0</div>
                    <div class="stat-label">Streak</div>
                </div>
            </div>

            <div class="card-container" id="card-container">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <div class="card-label">Question</div>
                        <div class="card-text" id="card-front-text">Click to start studying</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-label">Answer</div>
                        <div class="card-text" id="card-back-text">...</div>
                    </div>
                </div>
            </div>

            <div class="study-controls" id="study-controls" style="display: none;">
                <button class="btn btn-again" onclick="rateCard(0)">Again</button>
                <button class="btn btn-hard" onclick="rateCard(1)">Hard</button>
                <button class="btn btn-good" onclick="rateCard(2)">Good</button>
                <button class="btn btn-easy" onclick="rateCard(3)">Easy</button>
            </div>

            <div class="keyboard-hint">
                Press <kbd>Space</kbd> to flip • <kbd>1-4</kbd> to rate • <kbd>→</kbd> next card
            </div>
        </div>

        <!-- Decks Tab -->
        <div id="tab-decks" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Your Decks</h2>
                <button class="btn" style="background: linear-gradient(135deg, #ec4899, #f472b6); color: white;" onclick="createDeck()">+ New Deck</button>
            </div>
            <div class="deck-list" id="deck-list"></div>
        </div>

        <!-- Edit Tab -->
        <div id="tab-edit" class="tab-content">
            <div class="editor-panel">
                <h3 style="margin-bottom: 1rem;">Add New Card</h3>
                <div class="editor-row">
                    <label class="editor-label">Front (Question)</label>
                    <textarea class="editor-input" id="new-front" placeholder="What is the capital of France?"></textarea>
                </div>
                <div class="editor-row">
                    <label class="editor-label">Back (Answer)</label>
                    <textarea class="editor-input" id="new-back" placeholder="Paris"></textarea>
                </div>
                <div class="editor-row">
                    <label class="editor-label">Deck</label>
                    <select class="editor-input" id="new-deck"></select>
                </div>
                <button class="btn" style="background: linear-gradient(135deg, #ec4899, #f472b6); color: white; width: 100%;" onclick="addCard()">Add Card</button>
            </div>

            <h3 style="margin-bottom: 1rem;">Cards in Current Deck</h3>
            <div class="card-list" id="card-list"></div>
        </div>

        <!-- Stats Tab -->
        <div id="tab-stats" class="tab-content">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                <div class="deck-card">
                    <div class="stat-value" id="total-cards">0</div>
                    <div class="stat-label">Total Cards</div>
                </div>
                <div class="deck-card">
                    <div class="stat-value" id="cards-studied">0</div>
                    <div class="stat-label">Studied Today</div>
                </div>
                <div class="deck-card">
                    <div class="stat-value" id="avg-accuracy">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="deck-card">
                    <div class="stat-value" id="best-streak">0</div>
                    <div class="stat-label">Best Streak</div>
                </div>
            </div>

            <h3 style="margin-bottom: 1rem;">Study History</h3>
            <div id="history-list"></div>
        </div>
    </main>

    <script>
        // State
        let decks = JSON.parse(localStorage.getItem('kards_decks') || '[]');
        let currentDeck = 0;
        let studyQueue = [];
        let currentCardIndex = 0;
        let isFlipped = false;
        let stats = JSON.parse(localStorage.getItem('kards_stats') || '{"correct":0,"total":0,"streak":0,"bestStreak":0,"today":0,"history":[]}');

        // Initialize with sample deck if empty
        if (decks.length === 0) {
            decks = [{
                name: 'Sample Deck',
                cards: [
                    { front: 'What is the capital of France?', back: 'Paris', due: Date.now(), ease: 2.5, interval: 1 },
                    { front: 'What is 2 + 2?', back: '4', due: Date.now(), ease: 2.5, interval: 1 },
                    { front: 'What color is the sky?', back: 'Blue', due: Date.now(), ease: 2.5, interval: 1 }
                ]
            }];
            save();
        }

        function save() {
            localStorage.setItem('kards_decks', JSON.stringify(decks));
            localStorage.setItem('kards_stats', JSON.stringify(stats));
        }

        function setTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');

            if (tab === 'decks') renderDecks();
            if (tab === 'edit') renderCardEditor();
            if (tab === 'stats') renderStats();
            if (tab === 'study') startStudy();
        }

        function renderDecks() {
            const container = document.getElementById('deck-list');
            container.innerHTML = decks.map((deck, i) => {
                const due = deck.cards.filter(c => c.due <= Date.now()).length;
                return `<div class="deck-card" onclick="selectDeck(${i})">
                    <div class="deck-name">${deck.name}</div>
                    <div class="deck-count">${deck.cards.length} cards</div>
                    <div class="deck-due">${due} due now</div>
                </div>`;
            }).join('');
        }

        function selectDeck(index) {
            currentDeck = index;
            setTab('study');
        }

        function createDeck() {
            const name = prompt('Deck name:');
            if (!name) return;
            decks.push({ name, cards: [] });
            save();
            renderDecks();
        }

        function startStudy() {
            const deck = decks[currentDeck];
            if (!deck || deck.cards.length === 0) {
                document.getElementById('card-front-text').textContent = 'No cards in this deck';
                document.getElementById('study-controls').style.display = 'none';
                return;
            }

            // Get cards due for review
            studyQueue = deck.cards
                .map((c, i) => ({ ...c, index: i }))
                .filter(c => c.due <= Date.now())
                .sort((a, b) => a.due - b.due);

            if (studyQueue.length === 0) {
                document.getElementById('card-front-text').textContent = 'All cards reviewed! Come back later.';
                document.getElementById('study-controls').style.display = 'none';
                return;
            }

            currentCardIndex = 0;
            isFlipped = false;
            showCurrentCard();
            updateProgress();
        }

        function showCurrentCard() {
            if (currentCardIndex >= studyQueue.length) {
                document.getElementById('card-front-text').textContent = 'Session complete! 🎉';
                document.getElementById('card-back-text').textContent = '';
                document.getElementById('study-controls').style.display = 'none';
                document.getElementById('flashcard').classList.remove('flipped');
                return;
            }

            const card = studyQueue[currentCardIndex];
            document.getElementById('card-front-text').textContent = card.front;
            document.getElementById('card-back-text').textContent = card.back;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('study-controls').style.display = 'none';
            isFlipped = false;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
            if (isFlipped) {
                document.getElementById('study-controls').style.display = 'flex';
            }
        }

        function rateCard(rating) {
            const card = studyQueue[currentCardIndex];
            const originalCard = decks[currentDeck].cards[card.index];

            // Spaced repetition algorithm (SM-2 simplified)
            if (rating === 0) { // Again
                originalCard.interval = 1;
                originalCard.ease = Math.max(1.3, originalCard.ease - 0.2);
                stats.streak = 0;
            } else if (rating === 1) { // Hard
                originalCard.interval = Math.max(1, originalCard.interval * 1.2);
                originalCard.ease = Math.max(1.3, originalCard.ease - 0.15);
            } else if (rating === 2) { // Good
                originalCard.interval = originalCard.interval * originalCard.ease;
                stats.correct++;
                stats.streak++;
            } else { // Easy
                originalCard.interval = originalCard.interval * originalCard.ease * 1.3;
                originalCard.ease = Math.min(3.0, originalCard.ease + 0.15);
                stats.correct++;
                stats.streak++;
            }

            originalCard.due = Date.now() + originalCard.interval * 24 * 60 * 60 * 1000;
            stats.total++;
            stats.today++;
            stats.bestStreak = Math.max(stats.bestStreak, stats.streak);

            save();
            currentCardIndex++;
            updateProgress();
            showCurrentCard();
        }

        function updateProgress() {
            const progress = studyQueue.length > 0 ? (currentCardIndex / studyQueue.length) * 100 : 0;
            document.getElementById('study-progress').style.width = progress + '%';
            document.getElementById('stat-remaining').textContent = Math.max(0, studyQueue.length - currentCardIndex);
            document.getElementById('stat-correct').textContent = stats.correct;
            document.getElementById('stat-streak').textContent = stats.streak;
        }

        function renderCardEditor() {
            // Populate deck dropdown
            const deckSelect = document.getElementById('new-deck');
            deckSelect.innerHTML = decks.map((d, i) => `<option value="${i}">${d.name}</option>`).join('');
            deckSelect.value = currentDeck;

            // Show cards in current deck
            const list = document.getElementById('card-list');
            const deck = decks[currentDeck];
            if (!deck || deck.cards.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><p>No cards yet. Add some above!</p></div>';
                return;
            }

            list.innerHTML = deck.cards.map((card, i) => `
                <div class="card-item">
                    <div class="card-item-front">${card.front}</div>
                    <div class="card-item-back">${card.back}</div>
                    <div class="card-item-actions">
                        <button class="btn btn-icon btn-secondary" onclick="editCard(${i})">✏️</button>
                        <button class="btn btn-icon btn-secondary" onclick="deleteCard(${i})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function addCard() {
            const front = document.getElementById('new-front').value.trim();
            const back = document.getElementById('new-back').value.trim();
            const deckIndex = parseInt(document.getElementById('new-deck').value);

            if (!front || !back) {
                alert('Please fill in both sides of the card');
                return;
            }

            decks[deckIndex].cards.push({
                front,
                back,
                due: Date.now(),
                ease: 2.5,
                interval: 1
            });

            save();
            document.getElementById('new-front').value = '';
            document.getElementById('new-back').value = '';
            renderCardEditor();
        }

        function editCard(index) {
            const card = decks[currentDeck].cards[index];
            const newFront = prompt('Front:', card.front);
            if (newFront === null) return;
            const newBack = prompt('Back:', card.back);
            if (newBack === null) return;

            card.front = newFront;
            card.back = newBack;
            save();
            renderCardEditor();
        }

        function deleteCard(index) {
            if (!confirm('Delete this card?')) return;
            decks[currentDeck].cards.splice(index, 1);
            save();
            renderCardEditor();
        }

        function renderStats() {
            document.getElementById('total-cards').textContent = decks.reduce((sum, d) => sum + d.cards.length, 0);
            document.getElementById('cards-studied').textContent = stats.today;
            document.getElementById('avg-accuracy').textContent = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) + '%' : '0%';
            document.getElementById('best-streak').textContent = stats.bestStreak;
        }

        function importDeck() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,.csv,.txt';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const text = await file.text();

                try {
                    // Try JSON first
                    const data = JSON.parse(text);
                    if (Array.isArray(data)) {
                        const name = prompt('Deck name:', file.name.replace(/\.[^.]+$/, ''));
                        if (!name) return;
                        decks.push({
                            name,
                            cards: data.map(c => ({
                                front: c.front || c.question || c[0] || '',
                                back: c.back || c.answer || c[1] || '',
                                due: Date.now(),
                                ease: 2.5,
                                interval: 1
                            }))
                        });
                        save();
                        renderDecks();
                    }
                } catch (e) {
                    // Try CSV/text (tab or comma separated)
                    const lines = text.split('\n').filter(l => l.trim());
                    const cards = lines.map(line => {
                        const parts = line.includes('\t') ? line.split('\t') : line.split(',');
                        return { front: parts[0]?.trim(), back: parts[1]?.trim(), due: Date.now(), ease: 2.5, interval: 1 };
                    }).filter(c => c.front && c.back);

                    if (cards.length > 0) {
                        const name = prompt('Deck name:', file.name.replace(/\.[^.]+$/, ''));
                        if (!name) return;
                        decks.push({ name, cards });
                        save();
                        renderDecks();
                    }
                }
            };
            input.click();
        }

        function exportDeck() {
            const deck = decks[currentDeck];
            if (!deck) return;

            const data = JSON.stringify(deck.cards.map(c => ({ front: c.front, back: c.back })), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${deck.name}.json`;
            a.click();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (e.key >= '1' && e.key <= '4' && isFlipped) {
                rateCard(parseInt(e.key) - 1);
            } else if (e.key === 'ArrowRight') {
                if (!isFlipped) flipCard();
                else if (currentCardIndex < studyQueue.length - 1) rateCard(2);
            }
        });

        // Init
        startStudy();
        updateProgress();
    </script>
</body>
</html>
