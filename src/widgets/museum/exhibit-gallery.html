<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exhibit Gallery - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"exhibit-gallery","name":"Exhibit Gallery","icon":"🏛️","desc":"Browse museum exhibits","category":"museum","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#8b5cf6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:8px 16px;background:#1a1a1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer}
.filter.active{background:#8b5cf6;border-color:#8b5cf6}
.exhibits{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.exhibit{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.exhibit-image{height:180px;background:linear-gradient(135deg,#8b5cf6 0%,#7c3aed 100%);display:flex;align-items:center;justify-content:center;font-size:5rem}
.exhibit-body{padding:20px}
.exhibit-category{font-size:.75rem;color:#8b5cf6;margin-bottom:5px}
.exhibit-title{font-size:1.25rem;font-weight:bold;margin-bottom:10px}
.exhibit-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.exhibit-meta{display:flex;justify-content:space-between;align-items:center;font-size:.875rem}
.exhibit-location{color:#888}
.exhibit-status{padding:4px 10px;background:#22c55e33;color:#22c55e;border-radius:4px;font-size:.75rem}
</style>
</head>
<body>
<div class="header"><h1>🏛️ Exhibits</h1><button class="btn">Audio Guide</button></div>
<div class="filters">
<button class="filter active">All</button>
<button class="filter">Art</button>
<button class="filter">History</button>
<button class="filter">Science</button>
<button class="filter">Culture</button>
<button class="filter">Special</button>
</div>
<div class="exhibits" id="exhibits"></div>
<script>
const exhibits=[
{title:'Ancient Egypt',category:'History',icon:'🏺',desc:'Explore 5,000 years of Egyptian civilization through mummies, artifacts, and hieroglyphics.',floor:'2nd Floor',status:'Open'},
{title:'Impressionist Masters',category:'Art',icon:'🎨',desc:'Masterworks by Monet, Renoir, and Degas showcasing the revolutionary art movement.',floor:'3rd Floor',status:'Open'},
{title:'Space Exploration',category:'Science',icon:'🚀',desc:'Journey through the cosmos with real spacecraft, moon rocks, and interactive simulations.',floor:'1st Floor',status:'Open'},
{title:'Dinosaur Hall',category:'Science',icon:'🦕',desc:'Walk among giants with complete dinosaur skeletons and fossil discoveries.',floor:'Ground Floor',status:'Open'},
{title:'World Cultures',category:'Culture',icon:'🌍',desc:'Discover traditions, art, and artifacts from civilizations across the globe.',floor:'2nd Floor',status:'Open'},
{title:'Van Gogh: Immersive',category:'Special',icon:'🌻',desc:'Step inside Van Gogh\'s paintings in this limited-time digital art experience.',floor:'Special Wing',status:'Limited Time'}
];
document.getElementById('exhibits').innerHTML=exhibits.map(e=>`
<div class="exhibit">
<div class="exhibit-image">${e.icon}</div>
<div class="exhibit-body">
<div class="exhibit-category">${e.category.toUpperCase()}</div>
<div class="exhibit-title">${e.title}</div>
<div class="exhibit-desc">${e.desc}</div>
<div class="exhibit-meta">
<span class="exhibit-location">📍 ${e.floor}</span>
<span class="exhibit-status">${e.status}</span>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
