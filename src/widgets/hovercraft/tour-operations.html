<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hovercraft Tours - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"tour-operations","name":"Tour Operations","icon":"🚀","desc":"Hovercraft tour management","category":"hovercraft","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#a855f7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#a855f7}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.tours{display:flex;flex-direction:column;gap:15px}
.tour{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.tour-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.tour-name{font-size:1.125rem;font-weight:bold}
.tour-craft{font-size:.75rem;color:#a855f7}
.tour-status{padding:4px 10px;border-radius:4px;font-size:.7rem}
.status-boarding{background:#eab30833;color:#eab308}
.status-departed{background:#a855f733;color:#a855f7}
.status-scheduled{background:#15803d33;color:#15803d}
.tour-info{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}
.info{background:#252525;padding:10px;border-radius:6px;text-align:center}
.info-value{font-size:.9rem;font-weight:bold}
.info-label{font-size:.6rem;color:#888}
.tour-route{font-size:.875rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🚀 Tours</h1><button class="btn">Book Tour</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">6</div><div class="stat-label">TODAY'S TOURS</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">HOVERCRAFT</div></div>
<div class="stat"><div class="stat-value">48</div><div class="stat-label">PASSENGERS</div></div>
<div class="stat"><div class="stat-value">$8.4K</div><div class="stat-label">REVENUE</div></div>
</div>
<div class="tours" id="tours"></div>
<script>
const tours=[
{name:'Wetlands Safari',craft:'HC-ALPHA',status:'departed',time:'10:00 AM',duration:'90 min',passengers:12,capacity:16,pilot:'Capt. Anderson',route:'Marina → Wetlands → Wildlife Area → Marina'},
{name:'Ice Field Adventure',craft:'HC-BETA',status:'boarding',time:'11:30 AM',duration:'2 hours',passengers:14,capacity:16,pilot:'Capt. Roberts',route:'Base → Frozen Lake → Ice Caves → Base'},
{name:'Marsh Explorer',craft:'HC-GAMMA',status:'scheduled',time:'1:00 PM',duration:'75 min',passengers:10,capacity:12,pilot:'Capt. Chen',route:'Dock → Salt Marsh → Bird Sanctuary → Dock'},
{name:'Sunset Cruise',craft:'HC-ALPHA',status:'scheduled',time:'5:30 PM',duration:'90 min',passengers:16,capacity:16,pilot:'Capt. Anderson',route:'Marina → Coastal → Sunset Point → Marina'},
{name:'Private Charter',craft:'HC-BETA',status:'scheduled',time:'3:00 PM',duration:'3 hours',passengers:8,capacity:16,pilot:'Capt. Roberts',route:'Custom route - Corporate event'}
];
document.getElementById('tours').innerHTML=tours.map(t=>`
<div class="tour">
<div class="tour-header">
<div>
<div class="tour-name">${t.name}</div>
<div class="tour-craft">${t.craft}</div>
</div>
<span class="tour-status status-${t.status}">${t.status.toUpperCase()}</span>
</div>
<div class="tour-info">
<div class="info"><div class="info-value">${t.time}</div><div class="info-label">DEPARTURE</div></div>
<div class="info"><div class="info-value">${t.duration}</div><div class="info-label">DURATION</div></div>
<div class="info"><div class="info-value">${t.passengers}/${t.capacity}</div><div class="info-label">PASSENGERS</div></div>
<div class="info"><div class="info-value">${t.pilot}</div><div class="info-label">PILOT</div></div>
</div>
<div class="tour-route">📍 ${t.route}</div>
</div>`).join('');
</script>
</body>
</html>
