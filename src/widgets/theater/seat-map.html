<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat Map - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"seat-map","name":"Seat Map","icon":"💺","desc":"Theater seating chart","category":"theater","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.show-info{background:#1a1a1a;padding:15px 20px;border-radius:8px;border:1px solid #333;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.show-details h3{margin-bottom:5px}
.show-details span{font-size:.875rem;color:#888}
.btn{padding:10px 20px;background:#be123c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stage{background:#333;padding:15px;text-align:center;border-radius:8px 8px 0 0;font-size:.875rem;color:#888;margin-bottom:30px}
.seating{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px}
.row{display:flex;gap:6px;align-items:center}
.row-label{width:25px;text-align:center;font-size:.75rem;color:#888}
.seat{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.65rem;cursor:pointer}
.seat.available{background:#22c55e33;border:1px solid #22c55e}
.seat.available:hover{background:#22c55e;color:#000}
.seat.taken{background:#333;border:1px solid #444;cursor:not-allowed}
.seat.selected{background:#be123c;border:1px solid #be123c}
.seat.premium{background:#f59e0b33;border:1px solid #f59e0b}
.seat.premium:hover{background:#f59e0b;color:#000}
.legend{display:flex;justify-content:center;gap:20px;margin-bottom:20px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:.75rem}
.legend-box{width:20px;height:20px;border-radius:3px}
.selection{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333}
.selection-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.selection-seats{display:flex;gap:10px;flex-wrap:wrap}
.selected-seat{padding:5px 10px;background:#be123c33;color:#be123c;border-radius:4px;font-size:.875rem}
</style>
</head>
<body>
<div class="header"><h1>💺 Select Seats</h1></div>
<div class="show-info">
<div class="show-details">
<h3>Romeo and Juliet</h3>
<span>Saturday, Jan 20 • 8:00 PM</span>
</div>
<button class="btn">Change Date</button>
</div>
<div class="stage">🎭 STAGE</div>
<div class="seating" id="seating"></div>
<div class="legend">
<div class="legend-item"><div class="legend-box" style="background:#22c55e33;border:1px solid #22c55e"></div> Available</div>
<div class="legend-item"><div class="legend-box" style="background:#f59e0b33;border:1px solid #f59e0b"></div> Premium</div>
<div class="legend-item"><div class="legend-box" style="background:#333;border:1px solid #444"></div> Taken</div>
<div class="legend-item"><div class="legend-box" style="background:#be123c"></div> Selected</div>
</div>
<div class="selection">
<div class="selection-header">
<span>Selected Seats:</span>
<span style="font-weight:bold;color:#22c55e">$195.00</span>
</div>
<div class="selection-seats">
<span class="selected-seat">C-8</span>
<span class="selected-seat">C-9</span>
<span class="selected-seat">C-10</span>
</div>
</div>
<script>
const rows=['A','B','C','D','E','F','G','H','J','K'];
const seatsPerRow=[8,10,12,14,14,14,14,12,10,8];
const taken=['A-3','A-4','B-5','B-6','C-3','D-7','D-8','E-2','E-10','F-1','G-5','G-6','H-4'];
const selected=['C-8','C-9','C-10'];
const premium=['A','B'];
document.getElementById('seating').innerHTML=rows.map((r,i)=>{
const count=seatsPerRow[i];
const seats=[];
for(let s=1;s<=count;s++){
const id=`${r}-${s}`;
const isTaken=taken.includes(id);
const isSelected=selected.includes(id);
const isPremium=premium.includes(r);
let cls='seat';
if(isSelected)cls+=' selected';
else if(isTaken)cls+=' taken';
else if(isPremium)cls+=' premium';
else cls+=' available';
seats.push(`<div class="${cls}">${s}</div>`);
}
return `<div class="row"><span class="row-label">${r}</span>${seats.join('')}<span class="row-label">${r}</span></div>`;
}).join('');
</script>
</body>
</html>
