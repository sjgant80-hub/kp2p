<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performance Schedule - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"performance-schedule","name":"Performance Schedule","icon":"🎭","desc":"Theater show times","category":"theater","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#be123c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.featured{background:linear-gradient(135deg,#be123c 0%,#9f1239 100%);border-radius:12px;padding:25px;margin-bottom:20px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.featured-info h2{font-size:1.75rem;margin-bottom:5px}
.featured-info p{opacity:.9;font-size:.875rem;margin-bottom:10px}
.featured-meta{display:flex;gap:15px;font-size:.875rem;opacity:.8}
.featured-btn{padding:12px 25px;background:#fff;color:#be123c;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.shows{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.show{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.show-poster{height:150px;background:linear-gradient(135deg,#881337 0%,#4c0519 100%);display:flex;align-items:center;justify-content:center;font-size:4rem}
.show-body{padding:20px}
.show-title{font-size:1.25rem;font-weight:bold;margin-bottom:5px}
.show-type{font-size:.75rem;color:#be123c;margin-bottom:10px}
.show-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.show-schedule{margin-bottom:15px}
.schedule-label{font-size:.75rem;color:#888;margin-bottom:8px}
.schedule-times{display:flex;flex-wrap:wrap;gap:8px}
.schedule-day{padding:8px 12px;background:#252525;border-radius:6px;text-align:center}
.day-name{font-size:.65rem;color:#888}
.day-time{font-size:.8rem;font-weight:500}
.show-footer{display:flex;justify-content:space-between;align-items:center}
.show-price{font-size:1.125rem;font-weight:bold;color:#22c55e}
.show-price span{font-size:.75rem;color:#888;font-weight:normal}
</style>
</head>
<body>
<div class="header"><h1>🎭 Performances</h1><button class="btn">Season Tickets</button></div>
<div class="featured">
<div class="featured-info">
<h2>Phantom of the Opera</h2>
<p>The legendary musical returns for a limited engagement</p>
<div class="featured-meta">
<span>📅 Jan 15 - Feb 28</span>
<span>⏱️ 2h 30min</span>
<span>🎫 Limited Seats</span>
</div>
</div>
<button class="featured-btn">Get Tickets</button>
</div>
<div class="shows" id="shows"></div>
<script>
const shows=[
{title:'Romeo and Juliet',icon:'💔',type:'Drama',desc:'Shakespeare\'s timeless tragedy of star-crossed lovers, reimagined for a modern audience.',schedule:[{day:'Thu',time:'7:30pm'},{day:'Fri',time:'8:00pm'},{day:'Sat',time:'2:00pm'},{day:'Sat',time:'8:00pm'}],price:65},
{title:'A Midsummer Night\'s Dream',icon:'🧚',type:'Comedy',desc:'A magical journey through an enchanted forest filled with fairies, lovers, and hilarious mishaps.',schedule:[{day:'Fri',time:'7:30pm'},{day:'Sat',time:'3:00pm'},{day:'Sun',time:'2:00pm'}],price:55},
{title:'Les Misérables',icon:'🎵',type:'Musical',desc:'The epic tale of broken dreams, unrequited love, and redemption in revolutionary France.',schedule:[{day:'Wed',time:'7:00pm'},{day:'Sat',time:'2:00pm'},{day:'Sat',time:'7:30pm'}],price:85},
{title:'Waiting for Godot',icon:'⏳',type:'Drama',desc:'Beckett\'s absurdist masterpiece exploring meaning, existence, and the human condition.',schedule:[{day:'Thu',time:'8:00pm'},{day:'Sun',time:'3:00pm'}],price:45}
];
document.getElementById('shows').innerHTML=shows.map(s=>`
<div class="show">
<div class="show-poster">${s.icon}</div>
<div class="show-body">
<div class="show-title">${s.title}</div>
<div class="show-type">${s.type.toUpperCase()}</div>
<div class="show-desc">${s.desc}</div>
<div class="show-schedule">
<div class="schedule-label">SHOWTIMES</div>
<div class="schedule-times">${s.schedule.map(d=>`<div class="schedule-day"><div class="day-name">${d.day}</div><div class="day-time">${d.time}</div></div>`).join('')}</div>
</div>
<div class="show-footer">
<span class="show-price">$${s.price} <span>from</span></span>
<button class="btn" style="font-size:.75rem;padding:8px 15px">Book Now</button>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
