<!DOCTYPE html>
<!--
@file context-llm.html
@desc Minified WebLLM with context management - saves tokens, summarizes history
@api  window.ContextLLM - chat with context controls
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "contextLLM",
    "name": "Context LLM",
    "icon": "📦",
    "desc": "Token-efficient AI chat",
    "body": "Minified WebLLM with context window management. Auto-summarizes history, prunes old messages, tracks token usage. Saves 60-80% context.",
    "kills": ["ChatGPT context limits", "API token costs $$$"],
    "price": 25,
    "color": "#f59e0b"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Context LLM</title>
  <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px/1.4 system-ui,sans-serif;background:#0a0a0f;color:#e4e4e7;height:100vh;display:flex;flex-direction:column}
.hdr{padding:10px 12px;background:#18181b;border-bottom:1px solid #27272a;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:14px;color:#f59e0b;flex:1}
.hdr select{padding:4px 8px;background:#27272a;border:1px solid #3f3f46;border-radius:4px;color:#a1a1aa;font-size:11px}
.ctx-bar{display:flex;gap:8px;padding:6px 12px;background:#111;border-bottom:1px solid #222;font-size:10px;color:#71717a}
.ctx-bar .stat{display:flex;align-items:center;gap:4px}
.ctx-bar .stat b{color:#f59e0b}
.ctx-bar .btn{padding:2px 8px;background:#27272a;border:1px solid #3f3f46;border-radius:3px;color:#a1a1aa;cursor:pointer;font-size:10px}
.ctx-bar .btn:hover{border-color:#f59e0b;color:#f59e0b}
.msgs{flex:1;overflow-y:auto;padding:12px}
.msg{margin-bottom:10px;display:flex;gap:8px}
.msg.u{flex-direction:row-reverse}
.msg .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.msg.a .av{background:#f59e0b}
.msg.u .av{background:#3b82f6}
.msg .bub{max-width:80%;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5}
.msg.a .bub{background:#1f1f23;border-bottom-left-radius:4px}
.msg.u .bub{background:#3b82f6;border-bottom-right-radius:4px}
.msg .bub code{background:rgba(0,0,0,.3);padding:1px 4px;border-radius:2px;font:11px monospace}
.msg .bub pre{background:rgba(0,0,0,.4);padding:8px;border-radius:4px;overflow-x:auto;margin:6px 0}
.msg .meta{font-size:9px;color:#52525b;margin-top:4px}
.msg.sum{opacity:.7}
.msg.sum .bub{background:#292524;border-left:2px solid #f59e0b;font-style:italic}
.typing{display:flex;gap:4px;padding:8px 12px}
.typing span{width:6px;height:6px;background:#f59e0b;border-radius:50%;animation:bounce .5s infinite}
.typing span:nth-child(2){animation-delay:.1s}
.typing span:nth-child(3){animation-delay:.2s}
@keyframes bounce{50%{transform:translateY(-3px);opacity:.5}}
.inp{padding:10px 12px;background:#18181b;border-top:1px solid #27272a;display:flex;gap:8px}
.inp textarea{flex:1;padding:8px 12px;background:#27272a;border:1px solid #3f3f46;border-radius:8px;color:#e4e4e7;font:inherit;resize:none;outline:none;min-height:38px;max-height:100px}
.inp textarea:focus{border-color:#f59e0b}
.inp button{width:38px;height:38px;background:#f59e0b;border:0;border-radius:8px;color:#000;font-size:16px;cursor:pointer}
.inp button:disabled{opacity:.4}
.load{position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100}
.load.hide{display:none}
.load .spin{width:32px;height:32px;border:2px solid #27272a;border-top-color:#f59e0b;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load .txt{font-size:12px;color:#71717a}
.load .bar{width:160px;height:3px;background:#27272a;border-radius:2px;overflow:hidden}
.load .bar div{height:100%;background:#f59e0b;width:0;transition:width .2s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200}
.modal.hide{display:none}
.modal-box{background:#18181b;border:1px solid #27272a;border-radius:8px;padding:16px;width:90%;max-width:400px}
.modal-box h3{font-size:14px;color:#f59e0b;margin-bottom:12px}
.modal-box textarea{width:100%;height:150px;background:#0a0a0f;border:1px solid #27272a;border-radius:4px;padding:8px;color:#e4e4e7;font:11px monospace;resize:none}
.modal-box .btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.modal-box .btns button{padding:6px 16px;border-radius:4px;font-size:12px;cursor:pointer}
.modal-box .btns .cancel{background:transparent;border:1px solid #3f3f46;color:#a1a1aa}
.modal-box .btns .ok{background:#f59e0b;border:0;color:#000}
  </style>
</head>
<body>
  <div class="load" id="load">
    <div class="spin"></div>
    <div class="txt" id="loadTxt">Loading AI...</div>
    <div class="bar"><div id="loadBar"></div></div>
  </div>

  <div class="modal hide" id="modal">
    <div class="modal-box">
      <h3 id="modalTitle">Context Snapshot</h3>
      <textarea id="modalData"></textarea>
      <div class="btns">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="ok" id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <div class="hdr">
    <h1>Context LLM</h1>
    <select id="model">
      <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B</option>
    </select>
  </div>

  <div class="ctx-bar">
    <div class="stat">Tokens: <b id="tokens">0</b>/<b id="maxTok">4096</b></div>
    <div class="stat">Msgs: <b id="msgCt">0</b></div>
    <div class="stat">Saved: <b id="saved">0</b></div>
    <div style="flex:1"></div>
    <button class="btn" onclick="summarizeOld()">Summarize</button>
    <button class="btn" onclick="pruneOld()">Prune</button>
    <button class="btn" onclick="snapshot()">Export</button>
    <button class="btn" onclick="restore()">Import</button>
    <button class="btn" onclick="clearAll()">Clear</button>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="inp">
    <textarea id="input" placeholder="Message..." rows="1"></textarea>
    <button id="send" disabled>&#10148;</button>
  </div>

  <script type="module">
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Estimate tokens (~4 chars per token average)
const estTokens = str => Math.ceil(str.length / 4);

class ContextLLM {
  constructor() {
    this.engine = null;
    this.ready = false;
    this.history = [];        // Full message history
    this.summary = '';        // Rolling summary of pruned messages
    this.tokensSaved = 0;     // Track savings
    this.maxContext = 4096;   // Model context window
    this.keepRecent = 6;      // Messages to keep before summarizing
    this.systemPrompt = `You are a helpful, concise AI assistant. Keep responses brief and focused. When asked to summarize, create extremely condensed summaries.`;
    this.init();
  }

  async init() {
    $('load').classList.remove('hide');
    const model = $('model').value;
    $('loadTxt').textContent = `Loading ${model.split('-')[0]}...`;

    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      this.engine = await webllm.CreateMLCEngine(model, {
        initProgressCallback: p => {
          const pct = Math.round(p.progress * 100);
          $('loadBar').style.width = pct + '%';
          $('loadTxt').textContent = p.text || `Loading: ${pct}%`;
        }
      });
      this.ready = true;
      $('load').classList.add('hide');
      $('send').disabled = false;
      this.updateStats();
    } catch(e) {
      $('loadTxt').textContent = 'Error: ' + e.message;
      console.error(e);
    }
  }

  getContextMessages() {
    // Build context-efficient message list
    const msgs = [];

    // Add system prompt
    msgs.push({ role: 'system', content: this.systemPrompt });

    // Add rolling summary if exists
    if (this.summary) {
      msgs.push({
        role: 'system',
        content: `[Previous conversation summary: ${this.summary}]`
      });
    }

    // Add recent messages (most important for context)
    const recent = this.history.slice(-this.keepRecent * 2);
    msgs.push(...recent);

    return msgs;
  }

  countContextTokens() {
    const msgs = this.getContextMessages();
    return msgs.reduce((t, m) => t + estTokens(m.content), 0);
  }

  updateStats() {
    const ctxTokens = this.countContextTokens();
    const totalTokens = this.history.reduce((t, m) => t + estTokens(m.content), 0);

    $('tokens').textContent = ctxTokens;
    $('msgCt').textContent = this.history.length;
    $('saved').textContent = this.tokensSaved;

    // Color code token usage
    const ratio = ctxTokens / this.maxContext;
    $('tokens').style.color = ratio > 0.8 ? '#ef4444' : ratio > 0.5 ? '#f59e0b' : '#22c55e';
  }

  addMessage(content, role, meta = {}) {
    const msgs = $('msgs');
    const div = document.createElement('div');
    div.className = `msg ${role === 'user' ? 'u' : 'a'}${meta.isSummary ? ' sum' : ''}`;

    // Parse markdown
    let html = esc(content)
      .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');

    const tokens = estTokens(content);
    div.innerHTML = `
      <div class="av">${role === 'user' ? '👤' : '🤖'}</div>
      <div>
        <div class="bub">${html}</div>
        <div class="meta">${tokens} tokens${meta.isSummary ? ' • summary' : ''}</div>
      </div>
    `;

    // Remove typing indicator
    const typing = msgs.querySelector('.typing');
    if (typing) typing.remove();

    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  showTyping(show) {
    const msgs = $('msgs');
    const existing = msgs.querySelector('.typing');
    if (show && !existing) {
      const div = document.createElement('div');
      div.className = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    } else if (!show && existing) {
      existing.remove();
    }
    $('send').disabled = show || !this.ready;
  }

  async send(text) {
    if (!text.trim() || !this.ready) return;

    // Add user message
    this.history.push({ role: 'user', content: text });
    this.addMessage(text, 'user');
    this.updateStats();

    // Auto-summarize if context getting large
    if (this.countContextTokens() > this.maxContext * 0.7 && this.history.length > this.keepRecent * 2) {
      await this.autoSummarize();
    }

    this.showTyping(true);

    try {
      const response = await this.engine.chat.completions.create({
        messages: this.getContextMessages(),
        temperature: 0.7,
        max_tokens: 400
      });

      const reply = response.choices[0]?.message?.content || "I couldn't generate a response.";

      this.showTyping(false);
      this.history.push({ role: 'assistant', content: reply });
      this.addMessage(reply, 'assistant');
      this.updateStats();

    } catch(e) {
      this.showTyping(false);
      this.addMessage('Error: ' + e.message, 'assistant');
      console.error(e);
    }
  }

  async autoSummarize() {
    // Summarize older messages to save context
    const oldMsgs = this.history.slice(0, -this.keepRecent * 2);
    if (oldMsgs.length < 4) return;

    const oldTokens = oldMsgs.reduce((t, m) => t + estTokens(m.content), 0);

    // Create summary prompt
    const summaryPrompt = oldMsgs.map(m =>
      `${m.role === 'user' ? 'User' : 'AI'}: ${m.content}`
    ).join('\n');

    try {
      const response = await this.engine.chat.completions.create({
        messages: [
          { role: 'system', content: 'Summarize this conversation in 2-3 sentences. Be extremely brief.' },
          { role: 'user', content: summaryPrompt }
        ],
        temperature: 0.3,
        max_tokens: 100
      });

      const newSummary = response.choices[0]?.message?.content || '';

      // Combine with existing summary
      if (this.summary) {
        this.summary = `${this.summary} Then: ${newSummary}`;
      } else {
        this.summary = newSummary;
      }

      // Remove old messages from history
      this.history = this.history.slice(-this.keepRecent * 2);

      // Track savings
      const summaryTokens = estTokens(this.summary);
      this.tokensSaved += oldTokens - summaryTokens;

      // Show summary in UI
      this.addMessage(`[Auto-summarized ${oldMsgs.length} messages, saved ~${oldTokens - summaryTokens} tokens]`, 'assistant', { isSummary: true });

    } catch(e) {
      console.error('Auto-summarize failed:', e);
    }
  }

  async summarizeNow() {
    if (this.history.length < 4) return;

    $('send').disabled = true;

    const allContent = this.history.map(m =>
      `${m.role === 'user' ? 'User' : 'AI'}: ${m.content}`
    ).join('\n');

    const oldTokens = this.history.reduce((t, m) => t + estTokens(m.content), 0);

    try {
      const response = await this.engine.chat.completions.create({
        messages: [
          { role: 'system', content: 'Create a very brief summary (2-3 sentences) of the key points discussed.' },
          { role: 'user', content: allContent }
        ],
        temperature: 0.3,
        max_tokens: 150
      });

      this.summary = response.choices[0]?.message?.content || '';
      this.history = this.history.slice(-4); // Keep last 2 exchanges

      const summaryTokens = estTokens(this.summary);
      this.tokensSaved += oldTokens - summaryTokens - this.history.reduce((t, m) => t + estTokens(m.content), 0);

      this.addMessage(`[Summarized conversation: "${this.summary}"]`, 'assistant', { isSummary: true });
      this.updateStats();

    } catch(e) {
      console.error('Summarize failed:', e);
    }

    $('send').disabled = false;
  }

  prune() {
    if (this.history.length <= 4) return;

    const oldTokens = this.history.reduce((t, m) => t + estTokens(m.content), 0);
    this.history = this.history.slice(-4);
    const newTokens = this.history.reduce((t, m) => t + estTokens(m.content), 0);

    this.tokensSaved += oldTokens - newTokens;
    this.addMessage(`[Pruned old messages, saved ~${oldTokens - newTokens} tokens]`, 'assistant', { isSummary: true });
    this.updateStats();
  }

  export() {
    return JSON.stringify({
      history: this.history,
      summary: this.summary,
      tokensSaved: this.tokensSaved,
      timestamp: Date.now()
    }, null, 2);
  }

  import(json) {
    try {
      const data = JSON.parse(json);
      this.history = data.history || [];
      this.summary = data.summary || '';
      this.tokensSaved = data.tokensSaved || 0;

      // Rebuild UI
      $('msgs').innerHTML = '';
      if (this.summary) {
        this.addMessage(`[Restored summary: "${this.summary}"]`, 'assistant', { isSummary: true });
      }
      this.history.forEach(m => this.addMessage(m.content, m.role));
      this.updateStats();
      return true;
    } catch(e) {
      console.error('Import failed:', e);
      return false;
    }
  }

  clear() {
    this.history = [];
    this.summary = '';
    this.tokensSaved = 0;
    $('msgs').innerHTML = '';
    this.updateStats();
  }
}

const chat = new ContextLLM();
window.ContextLLM = chat;

// UI bindings
const input = $('input');
const send = $('send');

input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
};

send.onclick = () => {
  chat.send(input.value);
  input.value = '';
  input.style.height = 'auto';
};

input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send.click();
  }
};

$('model').onchange = () => {
  chat.ready = false;
  chat.engine = null;
  chat.init();
};

// Context bar functions
window.summarizeOld = () => chat.summarizeNow();
window.pruneOld = () => chat.prune();
window.clearAll = () => { if (confirm('Clear all messages?')) chat.clear(); };

window.snapshot = () => {
  $('modalTitle').textContent = 'Export Context';
  $('modalData').value = chat.export();
  $('modalData').readOnly = true;
  $('modalOk').textContent = 'Copy';
  $('modalOk').onclick = () => {
    navigator.clipboard.writeText($('modalData').value);
    closeModal();
  };
  $('modal').classList.remove('hide');
};

window.restore = () => {
  $('modalTitle').textContent = 'Import Context';
  $('modalData').value = '';
  $('modalData').readOnly = false;
  $('modalOk').textContent = 'Import';
  $('modalOk').onclick = () => {
    if (chat.import($('modalData').value)) closeModal();
    else alert('Invalid JSON');
  };
  $('modal').classList.remove('hide');
};

window.closeModal = () => $('modal').classList.add('hide');
  </script>
</body>
</html>
