<!DOCTYPE html>
<!--
@file ai-chat.html
@desc WebLLM AI Chat Widget - Browser-based LLM chat (no API keys)
@api  window.AIChat - AI chat controller
-->
<html lang="en">
<head>
  <script type="application/json" id="widget-meta">
  {
    "id": "aiChat",
    "name": "AI Chat",
    "icon": "💭",
    "desc": "Browser-based AI chat",
    "body": "WebLLM-powered AI chat. Runs entirely in browser, no API keys needed. Multiple model support.",
    "kills": ["ChatGPT API $20/mo", "Claude API $20/mo", "OpenAI fine-tuning $100s"],
    "price": 20,
    "color": "#7c3aed"
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Chat</title>
  <style>
    :root{--b:#0a0a12;--b2:#12121e;--f:#e4e4e7;--a:#00d9ff;--a2:#7c3aed;--g:#10b981;--r:#ef4444;--o:#f97316}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:14px/1.5 system-ui,sans-serif;background:var(--b);color:var(--f);min-height:100vh;display:flex;flex-direction:column}

    .header{padding:16px 20px;background:linear-gradient(135deg,var(--a2),#ec4899);display:flex;align-items:center;gap:12px}
    .header .avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px}
    .header .info{flex:1}
    .header .name{font-weight:600;font-size:16px}
    .header .status{font-size:11px;opacity:.8;display:flex;align-items:center;gap:6px}
    .header .status .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
    .header .status .dot.ready{background:var(--g)}
    .header .status .dot.loading{background:var(--o);animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.4}}
    .header select{padding:6px 10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:11px;cursor:pointer}

    .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
    .messages::-webkit-scrollbar{width:6px}
    .messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

    .msg{display:flex;gap:10px;max-width:85%}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .msg .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .msg.ai .avatar{background:linear-gradient(135deg,var(--a2),#ec4899)}
    .msg.user .avatar{background:linear-gradient(135deg,var(--a),var(--a2))}
    .msg .bubble{padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.5}
    .msg.ai .bubble{background:var(--b2);border-bottom-left-radius:4px}
    .msg.user .bubble{background:linear-gradient(135deg,var(--a),var(--a2));border-bottom-right-radius:4px}
    .msg .bubble p{margin:0 0 8px}.msg .bubble p:last-child{margin:0}
    .msg .bubble code{background:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:12px}
    .msg .bubble pre{background:rgba(0,0,0,.3);padding:10px;border-radius:6px;overflow-x:auto;margin:8px 0}
    .msg .bubble pre code{background:0;padding:0}

    .typing{display:flex;gap:10px;max-width:85%}
    .typing .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--a2),#ec4899);display:flex;align-items:center;justify-content:center;font-size:16px}
    .typing .dots{display:flex;gap:4px;padding:12px 16px;background:var(--b2);border-radius:16px}
    .typing .dots span{width:8px;height:8px;background:rgba(255,255,255,.4);border-radius:50%;animation:bounce .6s infinite}
    .typing .dots span:nth-child(2){animation-delay:.1s}
    .typing .dots span:nth-child(3){animation-delay:.2s}
    @keyframes bounce{50%{transform:translateY(-4px)}}

    .input-area{padding:16px 20px;background:var(--b2);border-top:1px solid rgba(255,255,255,.06)}
    .input-row{display:flex;gap:10px}
    .input-row textarea{flex:1;padding:12px 16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:var(--f);font:inherit;font-size:13px;resize:none;outline:0;min-height:48px;max-height:150px}
    .input-row textarea:focus{border-color:var(--a)}
    .input-row button{width:48px;height:48px;background:linear-gradient(135deg,var(--a2),#ec4899);border:0;border-radius:12px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
    .input-row button:hover{opacity:.9}
    .input-row button:disabled{opacity:.4;cursor:not-allowed}
    .hint{margin-top:8px;font-size:10px;color:#64748b;text-align:center}

    .loading-overlay{position:fixed;inset:0;background:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100}
    .loading-overlay.hidden{display:none}
    .loading-overlay .spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--a2);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-overlay .text{font-size:14px;color:#94a3b8}
    .loading-overlay .progress{width:200px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
    .loading-overlay .progress-bar{height:100%;background:linear-gradient(90deg,var(--a2),#ec4899);width:0;transition:width .3s}
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">Initializing AI...</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div class="header">
    <div class="avatar">🤖</div>
    <div class="info">
      <div class="name">Kono AI</div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Loading...</span></div>
    </div>
    <select id="modelSelect">
      <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (Fast)</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B</option>
      <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 2B</option>
    </select>
  </div>

  <div class="messages" id="messages">
    <div class="msg ai">
      <div class="avatar">🤖</div>
      <div class="bubble">
        <p>Hey! I'm Kono, your browser-based AI assistant. I run entirely in your browser using WebLLM - no API keys, no cloud, complete privacy.</p>
        <p>Ask me anything!</p>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button id="send" disabled>➤</button>
    </div>
    <div class="hint">Powered by WebLLM • Runs 100% in your browser • No data leaves your device</div>
  </div>

  <script type="module">
    /**
     * AI Chat Widget
     * Browser-based LLM chat using WebLLM
     *
     * @usage
     *   const chat = window.AIChat;
     *   chat.send('Hello!');
     *   chat.on('response', (text) => console.log(text));
     *   chat.loadModel('SmolLM2-360M-Instruct-q4f16_1-MLC');
     */

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    class AIChat {
      constructor() {
        this.engine = null;
        this.ready = false;
        this.loading = false;
        this.history = [];
        this.typing = false;

        this.handlers = {
          response: [],
          ready: [],
          error: []
        };

        this.systemPrompt = `You are Kono, a helpful AI assistant. You're friendly, concise, and knowledgeable. Keep responses under 150 words unless asked for more detail. Use markdown for code blocks.`;

        this.init();
      }

      on(event, handler) {
        if (this.handlers[event]) this.handlers[event].push(handler);
      }

      emit(event, ...args) {
        if (this.handlers[event]) this.handlers[event].forEach(h => h(...args));
      }

      setStatus(ready, text) {
        $('statusDot').className = 'dot' + (ready ? ' ready' : this.loading ? ' loading' : '');
        $('statusText').textContent = text;
        $('send').disabled = !ready || this.typing;
      }

      showLoading(show, text = '', progress = 0) {
        $('loading').classList.toggle('hidden', !show);
        if (text) $('loadText').textContent = text;
        $('progressBar').style.width = progress + '%';
      }

      async loadModel(modelId) {
        if (this.loading) return;
        this.loading = true;
        this.ready = false;
        this.setStatus(false, 'Loading...');
        this.showLoading(true, 'Loading ' + modelId.split('-')[0] + '...', 0);

        try {
          const webllm = await import('https://esm.run/@mlc-ai/web-llm');

          this.engine = await webllm.CreateMLCEngine(modelId, {
            initProgressCallback: (progress) => {
              const pct = Math.round(progress.progress * 100);
              this.showLoading(true, progress.text || `Loading: ${pct}%`, pct);
            }
          });

          this.ready = true;
          this.loading = false;
          this.showLoading(false);
          this.setStatus(true, 'Ready');
          this.emit('ready', modelId);

        } catch (err) {
          this.loading = false;
          this.showLoading(false);
          this.setStatus(false, 'Error loading model');
          this.emit('error', err);
          console.error('Model load error:', err);
        }
      }

      addMessage(text, isUser = false) {
        const messages = $('messages');
        const msg = document.createElement('div');
        msg.className = 'msg ' + (isUser ? 'user' : 'ai');

        // Simple markdown parsing
        let html = esc(text)
          .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '</p><p>');

        msg.innerHTML = `
          <div class="avatar">${isUser ? '😀' : '🤖'}</div>
          <div class="bubble"><p>${html}</p></div>
        `;

        // Remove typing indicator if present
        const typingEl = messages.querySelector('.typing');
        if (typingEl) typingEl.remove();

        messages.appendChild(msg);
        messages.scrollTop = messages.scrollHeight;
      }

      showTyping(show) {
        const messages = $('messages');
        const existing = messages.querySelector('.typing');

        if (show && !existing) {
          const typing = document.createElement('div');
          typing.className = 'typing';
          typing.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="dots"><span></span><span></span><span></span></div>
          `;
          messages.appendChild(typing);
          messages.scrollTop = messages.scrollHeight;
        } else if (!show && existing) {
          existing.remove();
        }

        this.typing = show;
        $('send').disabled = show || !this.ready;
      }

      async send(text) {
        if (!text.trim() || !this.ready || this.typing) return;

        // Add user message
        this.addMessage(text, true);
        this.history.push({ role: 'user', content: text });

        // Show typing
        this.showTyping(true);

        try {
          const response = await this.engine.chat.completions.create({
            messages: [
              { role: 'system', content: this.systemPrompt },
              ...this.history.slice(-10)  // Keep last 10 messages for context
            ],
            temperature: 0.7,
            max_tokens: 500
          });

          const reply = response.choices[0]?.message?.content || "I'm not sure how to respond to that.";

          this.showTyping(false);
          this.addMessage(reply);
          this.history.push({ role: 'assistant', content: reply });
          this.emit('response', reply);

        } catch (err) {
          this.showTyping(false);
          this.addMessage("Sorry, I encountered an error. Please try again.");
          console.error('Generation error:', err);
        }
      }

      init() {
        const input = $('input');
        const send = $('send');
        const modelSelect = $('modelSelect');

        // Auto-resize textarea
        input.oninput = () => {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        };

        // Send on button click
        send.onclick = () => {
          this.send(input.value);
          input.value = '';
          input.style.height = 'auto';
        };

        // Send on Enter (Shift+Enter for newline)
        input.onkeydown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send.click();
          }
        };

        // Model switching
        modelSelect.onchange = () => {
          this.history = [];  // Clear history on model switch
          this.loadModel(modelSelect.value);
        };

        // Load default model
        this.loadModel(modelSelect.value);
      }
    }

    const chat = new AIChat();
    window.AIChat = chat;
  </script>
</body>
</html>
