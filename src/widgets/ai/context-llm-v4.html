  <script type="module">
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const estTokens=s=>Math.ceil(s.length/4);

// Personas with different system prompts and behaviors
const PERSONAS = [
  {
    id: 'default',
    name: 'Default',
    icon: '🤖',
    desc: 'Helpful general assistant',
    prompt: 'You are a helpful, concise AI assistant. Be friendly but efficient.'

  },
  {

  },
  {

// IndexedDB wrapper
class MemoryDB {
  constructor() {
    this.dbName = 'ContextLLM4';
    this.db = null;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('memories')) {
          db.createObjectStore('memories', { keyPath: 'key' });
        }
        if (!db.objectStoreNames.contains('knowledge')) {
          db.createObjectStore('knowledge', { keyPath: 'id', autoIncrement: true });
        }
      };
    });
  }

  async getAll(store) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async put(store, data) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(data);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async delete(store, key) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async clear(store) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
}

class ContextLLM4 {
  constructor() {
    this.engine = null;
    this.ready = false;
    this.memoryDB = new MemoryDB();
    this.memories = [];
    this.knowledge = [];
    this.messages = [];
    this.currentPersona = PERSONAS[0];

    this.init();
  }

  async init() {
    $('load').classList.remove('hide');

    // Init DB
    try {
      await this.memoryDB.init();
      this.memories = await this.memoryDB.getAll('memories');
      this.knowledge = await this.memoryDB.getAll('knowledge');
      $('dbDot').classList.add('on');
    } catch(e) {
      console.error('DB error:', e);
      $('dbDot').classList.add('off');
    }

    // Init LLM
    const model = $('model').value;
    $('loadTxt').textContent = `Loading ${model.split('-')[0]}...`;

    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      this.engine = await webllm.CreateMLCEngine(model, {
        initProgressCallback: p => {
          $('loadTxt').textContent = p.text || `${Math.round(p.progress * 100)}%`;
        }
      });
      this.ready = true;
      $('load').classList.add('hide');
      $('send').disabled = false;
    } catch(e) {
      $('loadTxt').textContent = 'Error: ' + e.message;
    }

    this.renderPersonas();
    this.renderMemories();
    this.renderKnowledge();
    this.updateStats();
  }

  renderPersonas() {
    $('personaList').innerHTML = PERSONAS.map(p => `
      <div class="persona${p.id === this.currentPersona.id ? ' active' : ''}" onclick="C.setPersona('${p.id}')">
        <div class="icon" style="background:${p.id === this.currentPersona.id ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#2d1535'}">${p.icon}</div>
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="desc">${p.desc}</div>
        </div>
      </div>
    `).join('');
  }

  setPersona(id) {
    this.currentPersona = PERSONAS.find(p => p.id === id) || PERSONAS[0];
    this.renderPersonas();
    $('curPersona').innerHTML = `<span>${this.currentPersona.icon}</span><span>${this.currentPersona.name}</span>`;
  }

  renderMemories() {
    $('memoryList').innerHTML = this.memories.length ? this.memories.map(m => `
      <div class="memory-item">
        <div class="key">${esc(m.key)}</div>
        <div class="val">${esc(m.value.slice(0, 100))}${m.value.length > 100 ? '...' : ''}</div>
        <div class="meta">${m.type} • ${new Date(m.created).toLocaleDateString()}</div>
      </div>
    `).join('') : '<div style="color:#52525b;font-size:9px;padding:8px">No memories yet</div>';

    $('memCount').textContent = this.memories.length;
  }

  renderKnowledge() {
    $('knowledgeList').innerHTML = this.knowledge.length ? this.knowledge.slice(-20).map(k => `
      <div class="knowledge-item">
        <span class="type ${k.type}">${k.type}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k.content)}</span>
      </div>
    `).join('') : '<div style="color:#52525b;font-size:9px;padding:8px">Knowledge extracted from conversations will appear here</div>';

    $('knowCount').textContent = this.knowledge.length;
  }

  async addMemory(key, value, type) {
    const memory = { key, value, type, created: Date.now() };
    await this.memoryDB.put('memories', memory);
    this.memories = await this.memoryDB.getAll('memories');
    this.renderMemories();
  }

  async addKnowledge(content, type) {
    const k = { content, type, created: Date.now() };
    await this.memoryDB.put('knowledge', k);
    this.knowledge = await this.memoryDB.getAll('knowledge');
    this.renderKnowledge();
  }

  getContextMessages() {
    const msgs = [];

    // System prompt with persona
    let systemPrompt = this.currentPersona.prompt;

    // Add memories to context
    if (this.memories.length > 0) {
      const memoryContext = this.memories.map(m => `${m.key}: ${m.value}`).join('\n');
      systemPrompt += `\n\nLong-term memory:\n${memoryContext}`;
    }

    // Add recent knowledge
    if (this.knowledge.length > 0) {
      const recentKnowledge = this.knowledge.slice(-10).map(k => k.content).join('; ');
      systemPrompt += `\n\nRecent knowledge: ${recentKnowledge}`;
    }

    msgs.push({ role: 'system', content: systemPrompt });

    // Add conversation history
    this.messages.slice(-12).forEach(m => {
      msgs.push({ role: m.role, content: m.content });
    });

    return msgs;
  }

  // Extract knowledge from messages
  extractKnowledge(text) {
    const extracted = [];

    // Extract facts (statements with "is", "are", "was", "were")
    const factPatterns = [
      /(?:^|\. )([A-Z][^.!?]*(?:is|are|was|were)[^.!?]+)/g,
      /(?:the|a|an) (\w+) (?:is|are) (?:a |an )?([^.!?]+)/gi
    ];

    // Extract preferences (I like, prefer, want, need)
    const prefPattern = /I (?:like|prefer|want|need|love|hate) ([^.!?]+)/gi;

    // Extract rules (always, never, must, should)
    const rulePattern = /(?:always|never|must|should) ([^.!?]+)/gi;

    let match;
    factPatterns.forEach(pattern => {
      while ((match = pattern.exec(text)) !== null) {
        if (match[1] && match[1].length > 10 && match[1].length < 100) {
          extracted.push({ type: 'fact', content: match[1].trim() });
        }
      }
    });

    while ((match = prefPattern.exec(text)) !== null) {
      extracted.push({ type: 'pref', content: 'User prefers: ' + match[1].trim() });
    }

    while ((match = rulePattern.exec(text)) !== null) {
      extracted.push({ type: 'rule', content: match[0].trim() });
    }

    return extracted.slice(0, 3); // Limit extractions per message
  }

  updateStats() {
    const tokens = this.getContextMessages().reduce((t, m) => t + estTokens(m.content), 0);
    $('msgCount').textContent = this.messages.length;
    $('tokens').textContent = tokens;
  }

  addMessageUI(msg, extracted = []) {
    const div = document.createElement('div');
    div.className = `msg ${msg.role === 'user' ? 'u' : 'a'}`;

    let html = esc(msg.content)
      .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');

    let extractedHtml = '';
    if (extracted.length > 0) {
      extractedHtml = `<div class="extracted">${extracted.map(e =>
        `<span class="extracted-item">${e.type}: ${esc(e.content.slice(0, 40))}...</span>`
      ).join('')}</div>`;
    }

    div.innerHTML = `
      <div class="av">${msg.role === 'user' ? '👤' : this.currentPersona.icon}</div>
      <div class="wrap">
        <div class="bub">${html}</div>
        ${extractedHtml}
        <div class="meta"><span>${estTokens(msg.content)} tok</span></div>
      </div>
    `;

    const msgs = $('msgs');
    const typing = msgs.querySelector('.typing');
    if (typing) typing.remove();
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  showTyping(show) {
    const msgs = $('msgs');
    const existing = msgs.querySelector('.typing');
    if (show && !existing) {
      msgs.insertAdjacentHTML('beforeend', '<div class="typing"><span></span><span></span><span></span></div>');
      msgs.scrollTop = msgs.scrollHeight;
    } else if (!show && existing) {
      existing.remove();
    }
    $('send').disabled = show || !this.ready;
  }

  async send(text) {
    if (!text.trim() || !this.ready) return;

    const userMsg = { role: 'user', content: text, timestamp: Date.now() };
    this.messages.push(userMsg);

    // Extract knowledge from user message
    const userExtracted = this.extractKnowledge(text);
    for (const k of userExtracted) {
      await this.addKnowledge(k.content, k.type);
    }

    this.addMessageUI(userMsg, userExtracted);
    this.updateStats();
    this.showTyping(true);

    try {
      const response = await this.engine.chat.completions.create({
        messages: this.getContextMessages(),
        temperature: 0.7,
        max_tokens: 500
      });

      const reply = response.choices[0]?.message?.content || "Error generating response.";
      const aiMsg = { role: 'assistant', content: reply, timestamp: Date.now() };
      this.messages.push(aiMsg);

      // Extract knowledge from AI response
      const aiExtracted = this.extractKnowledge(reply);
      for (const k of aiExtracted) {
        await this.addKnowledge(k.content, k.type);
      }

      this.showTyping(false);
      this.addMessageUI(aiMsg, aiExtracted);
      this.updateStats();

    } catch(e) {
      this.showTyping(false);
      console.error(e);
    }
  }

  clearSession() {
    this.messages = [];
    $('msgs').innerHTML = '';
    this.updateStats();
  }
}

const C = new ContextLLM4();
window.ContextLLM4 = C;
window.C = C;

// Modal functions
window.openMemModal = () => {
  $('memKey').value = '';
  $('memVal').value = '';
  $('memoryModal').classList.remove('hide');
};
window.closeMemModal = () => $('memoryModal').classList.add('hide');
window.saveMemory = async () => {
  const key = $('memKey').value.trim();
  const val = $('memVal').value.trim();
  const type = $('memType').value;
  if (key && val) {
    await C.addMemory(key, val, type);
    closeMemModal();
  }
};

// Input
const input = $('input');
$('send').onclick = () => { C.send(input.value); input.value = ''; };
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); }
};
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
};
$('model').onchange = () => { C.ready = false; C.init(); };
  </script>
</body>
