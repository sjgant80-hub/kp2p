*{margin:0;padding:0;box-sizing:border-box}
body{font:12px/1.4 system-ui,sans-serif;background:#0a0a0f;color:#e4e4e7;height:100vh;display:flex;flex-direction:column}
.hdr{padding:8px 12px;background:linear-gradient(90deg,#1e1b4b,#0f0a1a);border-bottom:1px solid #3730a3;display:flex;align-items:center;gap:10px}

.queue-item .score-val{font-size:11px;color:#a78bfa;font-weight:bold;width:30px;text-align:right}
.settings-panel{padding:12px;overflow-y:auto}
.setting{margin-bottom:16px;background:#1e1b4b;border-radius:8px;padding:12px}

.setting input[type=range]{width:100%;accent-color:#8b5cf6}
.setting .range-vals{display:flex;justify-content:space-between;font-size:9px;color:#71717a;margin-top:4px}
.setting input[type=number]{width:100%;padding:8px;background:#0f0a1a;border:1px solid #3730a3;border-radius:4px;color:#e4e4e7;font-size:11px}
.load{position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100}

@keyframes spin{to{transform:rotate(360deg)}}
.load .txt{font-size:12px;color:#71717a}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:8px 16px;border-radius:6px;font-size:11px;opacity:0;transition:all .3s;z-index:300}

.toast.info{background:#8b5cf6}
.undo-bar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e1b4b;border:1px solid #3730a3;padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:12px;z-index:300;opacity:0;transition:all .3s;pointer-events:none}

  </style>

<body>
  <div class="load" id="load">
    <div class="spin"></div>
    <div class="txt" id="loadTxt">Loading AI...</div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="undo-bar" id="undoBar">
    <span class="text" id="undoText"></span>
    <button onclick="C.undo()">Undo</button>
    <button onclick="hideUndo()" style="background:#3730a3">Dismiss</button>
  </div>

  <div class="hdr">
    <h1>Context LLM <span class="ver">v2.1</span></h1>
    <select id="model">
      <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 1B</option>
    </select>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-panel="chat">💬 Chat</div>
    <div class="tab" data-panel="queue">📊 Priority Queue <span class="badge" id="queueBadge">0</span></div>

  <div class="toolbar">
    <div class="group">

  <div class="panel" id="settingsPanel">
    <div class="settings-panel">
      <div class="setting">

        <div class="range-vals"><span>0</span><span>100</span></div>
      </div>

        <input type="range" id="pinWeight" min="1" max="5" value="3" oninput="C.config.pinWeight=+this.value;$('pinWVal').textContent=this.value+'x'">
        <div class="range-vals"><span>1x</span><span>5x</span></div>
      </div>
      <div class="setting">
        <label>Recency Boost: <b id="recVal">50%</b></label>
        <input type="range" id="recency" min="0" max="100" value="50" oninput="C.config.recencyBoost=this.value/100;$('recVal').textContent=this.value+'%'">
        <div class="range-vals"><span>0%</span><span>100%</span></div>

  <script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const estTokens = s => Math.ceil(s.length / 4);

function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showUndo(text) {
  $('undoText').textContent = text;
  $('undoBar').classList.add('show');
}
window.hideUndo = () => $('undoBar').classList.remove('show');

class Message {
  constructor(role, content) {
    this.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    this.role = role;
    this.content = content;
    this.tokens = estTokens(content);
    this.timestamp = Date.now();
    this.pinned = false;
    this.selected = false;
    this.importance = this.calcImportance();
  }

  calcImportance() {
    let score = 50;
    const c = this.content.toLowerCase();
    if (c.includes('?')) score += 15;
    if (c.includes('```') || c.includes('function') || c.includes('const ')) score += 20;
    ['important', 'remember', 'key', 'critical', 'must', 'always', 'never', 'todo', 'fix', 'bug'].forEach(k => {
      if (c.includes(k)) score += 8;
    });
    if (this.tokens > 50) score += 10;
    if (this.tokens > 100) score += 10;
    if (this.role === 'user') score += 5;
    return Math.min(100, Math.max(0, score));
  }

  getEffectiveScore(config, index, total) {
    let score = this.importance;
    if (this.pinned) score *= config.pinWeight;
    const recency = (index / Math.max(1, total - 1)) * config.recencyBoost * 40;
    score += recency;
    return Math.min(100, Math.round(score));
  }
}

class ContextLLM2 {
  constructor() {
    this.engine = null;
    this.ready = false;
    this.messages = [];
    this.undoStack = [];
    this.summary = '';

    this.config = {
      maxContext: 4096,
      optThreshold: 0.7,
      minImportance: 30,
      pinWeight: 3,
      recencyBoost: 0.5
    };

    this.systemPrompt = `You are a helpful, concise AI. Keep responses focused and efficient.`;
    this.init();
    this.setupUI();
  }

  setStatus(text, type = '') {
    const s = $('status');
    s.textContent = text;
    s.style.color = type === 'loading' ? '#f59e0b' : type === 'error' ? '#ef4444' : '#22c55e';
  }

  async init() {
    $('load').classList.remove('hide');
    const model = $('model').value;
    $('loadTxt').textContent = `Loading ${model.split('-')[0]}...`;

    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      this.engine = await webllm.CreateMLCEngine(model, {
        initProgressCallback: p => {
          $('loadTxt').textContent = p.text || `${Math.round(p.progress * 100)}%`;
        }
      });
      this.ready = true;
      $('load').classList.add('hide');
      $('send').disabled = false;
      this.setStatus('Ready');
      toast('AI loaded!', 'info');
    } catch(e) {
      $('loadTxt').textContent = 'Error: ' + e.message;
      this.setStatus('Error', 'error');
    }
  }

  setupUI() {
    // Tabs
    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        $(t.dataset.panel + 'Panel').classList.add('active');
        if (t.dataset.panel === 'queue') this.renderQueue();
      };
    });
  }

  saveUndo(action) {
    this.undoStack.push({
      action,
      messages: JSON.parse(JSON.stringify(this.messages)),
      summary: this.summary
    });
    if (this.undoStack.length > 10) this.undoStack.shift();
  }

  undo() {
    const state = this.undoStack.pop();
    if (state) {
      this.messages = state.messages.map(m => Object.assign(new Message(m.role, m.content), m));
      this.summary = state.summary;
      this.renderAllMessages();
      this.updateStats();
      toast('Undone: ' + state.action, 'info');
      hideUndo();
    }
  }

  getContextMessages() {
    const msgs = [{ role: 'system', content: this.systemPrompt }];
    if (this.summary) {
      msgs.push({ role: 'system', content: `[Context: ${this.summary}]` });
    }

    // Sort by score and fit what we can
    const scored = this.messages.map((m, i) => ({
      msg: m,
      score: m.getEffectiveScore(this.config, i, this.messages.length)
    })).sort((a, b) => b.score - a.score);

    let tokens = msgs.reduce((t, m) => t + estTokens(m.content), 0);
    const keep = [];

    for (const { msg } of scored) {
      if (tokens + msg.tokens < this.config.maxContext * 0.8) {
        keep.push(msg);
        tokens += msg.tokens;
      }
    }

    keep.sort((a, b) => a.timestamp - b.timestamp);
    keep.forEach(m => msgs.push({ role: m.role, content: m.content }));
    return msgs;
  }

  countTokens() {
    return this.getContextMessages().reduce((t, m) => t + estTokens(m.content), 0);
  }

  updateStats() {
    const tokens = this.countTokens();
    const ratio = tokens / this.config.maxContext;
    const pct = Math.min(100, Math.round(ratio * 100));

    $('tokens').textContent = tokens;
    $('msgCt').textContent = this.messages.length;
    $('pinCt').textContent = this.messages.filter(m => m.pinned).length;
    $('selCt').textContent = this.messages.filter(m => m.selected).length;
    $('queueBadge').textContent = this.messages.length;

    $('ctxFill').style.width = pct + '%';
    $('ctxPct').textContent = pct + '%';

    const meter = $('ctxMeter');
    meter.classList.remove('warn', 'crit');
    if (ratio > 0.8) meter.classList.add('crit');
    else if (ratio > 0.5) meter.classList.add('warn');
  }

  addMessageUI(msg) {
    const div = document.createElement('div');
    div.className = `msg ${msg.role === 'user' ? 'u' : 'a'}${msg.pinned ? ' pinned' : ''}${msg.selected ? ' selected' : ''}`;
    div.dataset.id = msg.id;

    const score = msg.getEffectiveScore(this.config, this.messages.indexOf(msg), this.messages.length);
    const scoreClass = score >= 70 ? 'high' : score >= 40 ? 'med' : 'low';

    let html = esc(msg.content)
      .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');

    div.innerHTML = `
      <input type="checkbox" class="checkbox" ${msg.selected ? 'checked' : ''} onchange="C.toggleSelect('${msg.id}')">
      <div class="av">${msg.role === 'user' ? '👤' : '🤖'}</div>
      <div class="wrap">
        <div class="bub">${html}</div>
        <div class="meta">
          <span>${msg.tokens} tok</span>
          <span class="score ${scoreClass}">${score}</span>
          <div class="score-bar"><div style="width:${score}%"></div></div>
        </div>
        <div class="actions">
          <button onclick="C.togglePin('${msg.id}')" title="Pin">${msg.pinned ? '📌' : '📍'}</button>
          <button onclick="C.boostScore('${msg.id}')" title="Boost">⬆️</button>
          <button onclick="C.deleteMsg('${msg.id}')" title="Delete">🗑️</button>
        </div>
      </div>
    `;

    const msgs = $('msgs');
    const typing = msgs.querySelector('.typing');
    if (typing) typing.remove();
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  renderAllMessages() {
    $('msgs').innerHTML = '';
    this.messages.forEach(m => this.addMessageUI(m));
  }

  toggleSelect(id) {
    const msg = this.messages.find(m => m.id === id);
    if (msg) {
      msg.selected = !msg.selected;
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) el.classList.toggle('selected', msg.selected);
      this.updateStats();
    }
  }

  togglePin(id) {
    const msg = this.messages.find(m => m.id === id);
    if (msg) {
      msg.pinned = !msg.pinned;
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) {
        el.classList.toggle('pinned', msg.pinned);
        el.querySelector('.actions button').textContent = msg.pinned ? '📌' : '📍';
      }
      this.updateStats();
      toast(msg.pinned ? 'Pinned!' : 'Unpinned', 'info');
    }
  }

  boostScore(id) {
    const msg = this.messages.find(m => m.id === id);
    if (msg) {
      msg.importance = Math.min(100, msg.importance + 15);
      this.renderAllMessages();
      this.updateStats();
      toast('Score boosted!', 'info');
    }
  }

  deleteMsg(id) {
    this.saveUndo('delete message');
    this.messages = this.messages.filter(m => m.id !== id);
    document.querySelector(`[data-id="${id}"]`)?.remove();
    this.updateStats();
    showUndo('Deleted 1 message');
  }

  pinSelected() {
    const selected = this.messages.filter(m => m.selected);
    if (selected.length === 0) {
      toast('No messages selected', 'error');
      return;
    }
    selected.forEach(m => m.pinned = true);
    this.renderAllMessages();
    this.updateStats();
    toast(`Pinned ${selected.length} messages`, 'info');
  }

  deleteSelected() {
    const selected = this.messages.filter(m => m.selected);
    if (selected.length === 0) {
      toast('No messages selected', 'error');
      return;
    }
    this.saveUndo(`delete ${selected.length} messages`);
    this.messages = this.messages.filter(m => !m.selected);
    this.renderAllMessages();
    this.updateStats();
    showUndo(`Deleted ${selected.length} messages`);
  }

  recalculateScores() {
    this.messages.forEach(m => m.importance = m.calcImportance());
    this.renderAllMessages();
    this.renderQueue();
    toast('Scores recalculated!', 'info');
  }

  showTyping(show) {
    const msgs = $('msgs');
    const existing = msgs.querySelector('.typing');
    if (show && !existing) {
      const div = document.createElement('div');
      div.className = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    } else if (!show && existing) {
      existing.remove();
    }
    $('send').disabled = show || !this.ready;
  }

  async send(text) {
    if (!text.trim() || !this.ready) return;

    const userMsg = new Message('user', text);
    this.messages.push(userMsg);
    this.addMessageUI(userMsg);
    this.updateStats();

    if (this.countTokens() > this.config.maxContext * this.config.optThreshold) {
      await this.autoOptimize();
    }

    this.showTyping(true);
    this.setStatus('Thinking...', 'loading');

    try {
      const response = await this.engine.chat.completions.create({
        messages: this.getContextMessages(),
        temperature: 0.7,
        max_tokens: 400
      });

      const reply = response.choices[0]?.message?.content || "Error.";
      const aiMsg = new Message('assistant', reply);
      this.messages.push(aiMsg);
      this.showTyping(false);
      this.addMessageUI(aiMsg);
      this.updateStats();
      this.setStatus('Ready');

    } catch(e) {
      this.showTyping(false);
      this.setStatus('Error', 'error');
      toast('Error: ' + e.message, 'error');
    }
  }

  async autoOptimize() {
    this.saveUndo('auto-optimize');
    const before = this.messages.length;
    this.messages = this.messages.filter(m => m.pinned || m.importance >= this.config.minImportance);
    const removed = before - this.messages.length;
    if (removed > 0) {
      this.renderAllMessages();
      toast(`Auto-optimized: removed ${removed} low-priority messages`, 'info');
    }
  }

  renderQueue() {
    const scored = this.messages.map((m, i) => ({
      msg: m,
      score: m.getEffectiveScore(this.config, i, this.messages.length)
    })).sort((a, b) => b.score - a.score);

    $('queueList').innerHTML = scored.map((s, i) => `
      <div class="queue-item">
        <div class="rank${s.score < 40 ? ' low' : ''}">${i + 1}</div>
        <div class="content">
          <div class="preview">${esc(s.msg.content.slice(0, 80))}${s.msg.content.length > 80 ? '...' : ''}</div>
          <div class="info">${s.msg.role} • ${s.msg.tokens} tok${s.msg.pinned ? ' • 📌 pinned' : ''}</div>
        </div>
        <div class="meter">
          <div class="meter-bar"><div style="width:${s.score}%"></div></div>
        </div>
        <div class="score-val">${s.score}</div>
      </div>
    `).join('');
  }
}

const C = new ContextLLM2();
window.C = C;
window.ContextLLM2 = C;

// Input handling
const input = $('input');
$('send').onclick = () => { C.send(input.value); input.value = ''; };
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); }
};
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
};
$('model').onchange = () => { C.ready = false; C.init(); };
  </script>
</body>
</html>
