  <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:12px/1.4 system-ui,sans-serif;background:#050a05;color:#d4d4d8;height:100vh;display:flex}

.modal-box input{width:100%;padding:10px;background:#0f1f0f;border:1px solid #1a2e1a;border-radius:6px;color:#d4d4d8;font-size:12px;margin-bottom:12px}
.modal-box .btns{display:flex;gap:8px;justify-content:flex-end}
.modal-box button{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:11px}

.toast.show{opacity:1}

.compare-view{position:fixed;inset:0;background:#050a05;z-index:150;display:none;flex-direction:column}

.compare-header{padding:12px;background:#0a150a;border-bottom:1px solid #1a2e1a;display:flex;align-items:center;gap:12px}
.compare-header h3{color:#22c55e;flex:1}
.compare-header button{background:#0f1f0f;border:1px solid #1a2e1a;color:#22c55e;padding:6px 12px;border-radius:4px;cursor:pointer}
.compare-content{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1a2e1a;overflow:hidden}

.compare-pane h4{color:#52525b;font-size:11px;margin-bottom:12px;position:sticky;top:0;background:#050a05;padding:4px 0}
  </style>
</head>
<body>
  <div class="load" id="load">
    <div class="spin"></div>
    <div class="txt" id="loadTxt">Loading AI...</div>
  </div>

  <div class="modal hide" id="modal">
    <div class="modal-box">
      <h3 id="modalTitle">New Branch</h3>
      <input id="modalInput" placeholder="Branch name...">
      <div class="btns">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="ok" onclick="confirmModal()">Create</button>

    </div>
  </div>

  <div class="compare-view" id="compareView">
    <div class="compare-header">
      <h3>Compare Branches</h3>
      <button onclick="closeCompare()">✕ Close</button>

    <div class="compare-content">
      <div class="compare-pane" id="compareLeft"></div>

  <div class="toast" id="toast"></div>

  <div class="sidebar">
    <div class="sidebar-header">

      <span class="badge" id="branchCount">1</span>
    </div>
    <div class="tree-view" id="treeView"></div>
    <div class="branch-actions">
      <button onclick="C.newBranch()">+ New Branch</button>
      <button class="secondary" onclick="C.compareBranches()">⚖️ Compare</button>
      <button class="secondary" onclick="C.exportBranches()">📤 Export All</button>
    </div>
    <div class="search-box">
      <input id="search" placeholder="Search all branches..." oninput="C.search(this.value)">
    </div>
  </div>

  <div class="main">
    <div class="hdr">
      <h1>Context LLM <span class="ver">v3.1</span></h1>
      <div class="branch-path" id="branchPath">
        <span>main</span>
      </div>
      <div class="spacer"></div>
      <select id="model">
        <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2</option>
        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 1B</option>

    <div class="toolbar">
      <div class="group">

          <button class="comp-btn" data-level="0">None</button>

        </div>
      </div>
      <div class="group">
        <label>Depth:</label> <b id="depth">0</b>
      </div>
      <div class="group">
        <label>Tokens:</label> <b id="tokens">0</b>/4096
      </div>

        <label>Msgs:</label> <b id="msgCt">0</b>
      </div>
      <div style="flex:1"></div>
      <button class="comp-btn" onclick="C.duplicateBranch()">📋 Duplicate</button>
      <button class="comp-btn" onclick="C.renameBranch()">✏️ Rename</button>
      <button class="comp-btn" style="color:#ef4444" onclick="C.deleteBranch()">🗑️ Delete</button>
    </div>

    <div class="msgs" id="msgs"></div>

    </div>

  <script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const estTokens = s => Math.ceil(s.length / 4);

function toast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

class Branch {
  constructor(name, parentId = null) {
    this.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    this.name = name;
    this.parentId = parentId;
    this.messages = [];
    this.created = Date.now();
    this.bookmarked = false;
    this.color = '#22c55e';
  }
}

class ContextLLM3 {
  constructor() {
    this.engine = null;
    this.ready = false;
    this.branches = [new Branch('main')];
    this.currentBranch = this.branches[0];
    this.compressionLevel = 1;

    this.compressionRules = {
      0: { keepRecent: 100, summary: false },
      1: { keepRecent: 10, summary: true },
      2: { keepRecent: 6, summary: true },
      3: { keepRecent: 3, summary: true }
    };

    this.systemPrompt = `You are a helpful, concise AI assistant.`;
    this.init();
    this.setupUI();
    this.renderTree();
  }

  async init() {
    $('load').classList.remove('hide');
    const model = $('model').value;
    $('loadTxt').textContent = `Loading ${model.split('-')[0]}...`;

    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      this.engine = await webllm.CreateMLCEngine(model, {
        initProgressCallback: p => {
          $('loadTxt').textContent = p.text || `${Math.round(p.progress * 100)}%`;
        }
      });
      this.ready = true;
      $('load').classList.add('hide');
      $('send').disabled = false;
      toast('AI loaded!');
    } catch(e) {
      $('loadTxt').textContent = 'Error: ' + e.message;
    }
  }

  setupUI() {
    document.querySelectorAll('.comp-btn[data-level]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.comp-btn[data-level]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.compressionLevel = +btn.dataset.level;
        this.renderMessages();
      };
    });
  }

  // Get branch ancestry path
  getBranchPath(branch) {
    const path = [branch];
    let b = branch;
    while (b.parentId) {
      b = this.branches.find(x => x.id === b.parentId);
      if (b) path.unshift(b);
    }
    return path;
  }

  getFullHistory() {
    const path = this.getBranchPath(this.currentBranch);
    const history = [];
    for (const branch of path) {
      history.push(...branch.messages);
    }
    return history;
  }

  getContextMessages() {
    const history = this.getFullHistory();
    const rules = this.compressionRules[this.compressionLevel];
    const msgs = [{ role: 'system', content: this.systemPrompt }];

    const recent = history.slice(-rules.keepRecent * 2);
    const older = history.slice(0, -rules.keepRecent * 2);

    if (older.length > 0 && rules.summary) {
      const summary = this.compressMessages(older);
      if (summary) {
        msgs.push({ role: 'system', content: `[Earlier: ${summary}]` });
      }
    }

    recent.forEach(m => msgs.push({ role: m.role, content: m.content }));
    return msgs;
  }

  compressMessages(msgs) {
    return msgs.slice(0, 5).map(m =>
      `${m.role === 'user' ? 'Q' : 'A'}: ${m.content.slice(0, 30)}...`
    ).join('; ');
  }

  updateStats() {
    const history = this.getFullHistory();
    const tokens = this.getContextMessages().reduce((t, m) => t + estTokens(m.content), 0);

    $('depth').textContent = this.getBranchPath(this.currentBranch).length - 1;
    $('tokens').textContent = tokens;
    $('msgCt').textContent = history.length;
    $('branchCount').textContent = this.branches.length;

    // Update branch path display
    const path = this.getBranchPath(this.currentBranch);
    $('branchPath').innerHTML = path.map(b => `<span>${esc(b.name)}</span>`).join(' › ');
  }

  renderTree() {
    const renderBranch = (branch, level = 0) => {
      const children = this.branches.filter(b => b.parentId === branch.id);
      const isActive = branch.id === this.currentBranch.id;

      let html = `
        <div class="tree-item${isActive ? ' active' : ''}" data-id="${branch.id}" onclick="C.switchBranch('${branch.id}')">
          <span class="icon">${branch.bookmarked ? '⭐' : (children.length > 0 ? '📂' : '📄')}</span>
          <span class="name">${esc(branch.name)}</span>
          <span class="count">${branch.messages.length}</span>
          <div class="actions">
            <button onclick="event.stopPropagation();C.forkBranch('${branch.id}')" title="Fork">🌿</button>
          </div>
        </div>
      `;

      if (children.length > 0) {
        html += `<div class="tree-node">${children.map(c => renderBranch(c, level + 1)).join('')}</div>`;
      }

      return html;
    };

    const roots = this.branches.filter(b => !b.parentId);
    $('treeView').innerHTML = roots.map(b => renderBranch(b)).join('');
  }

  switchBranch(id) {
    this.currentBranch = this.branches.find(b => b.id === id) || this.branches[0];
    this.renderTree();
    this.renderMessages();
    this.updateStats();
  }

  newBranch() {
    window.modalAction = 'new';
    $('modalTitle').textContent = 'New Branch';
    $('modalInput').value = `branch-${this.branches.length + 1}`;
    $('modal').classList.remove('hide');
    $('modalInput').focus();
  }

  forkBranch(parentId) {
    window.modalAction = 'fork';
    window.modalParentId = parentId;
    const parent = this.branches.find(b => b.id === parentId);
    $('modalTitle').textContent = `Fork from "${parent?.name}"`;
    $('modalInput').value = `${parent?.name}-fork`;
    $('modal').classList.remove('hide');
    $('modalInput').focus();
  }

  confirmModal() {
    const name = $('modalInput').value.trim();
    if (!name) return;

    if (window.modalAction === 'new') {
      const branch = new Branch(name);
      this.branches.push(branch);
      this.currentBranch = branch;
    } else if (window.modalAction === 'fork') {
      const branch = new Branch(name, window.modalParentId);
      this.branches.push(branch);
      this.currentBranch = branch;
    } else if (window.modalAction === 'rename') {
      this.currentBranch.name = name;
    }

    this.renderTree();
    this.renderMessages();
    this.updateStats();
    closeModal();
    toast(window.modalAction === 'rename' ? 'Renamed!' : 'Branch created!');
  }

  renameBranch() {
    window.modalAction = 'rename';
    $('modalTitle').textContent = 'Rename Branch';
    $('modalInput').value = this.currentBranch.name;
    $('modal').classList.remove('hide');
  }

  duplicateBranch() {
    const dup = new Branch(this.currentBranch.name + ' (copy)', this.currentBranch.parentId);
    dup.messages = JSON.parse(JSON.stringify(this.currentBranch.messages));
    this.branches.push(dup);
    this.currentBranch = dup;
    this.renderTree();
    this.renderMessages();
    this.updateStats();
    toast('Branch duplicated!');
  }

  deleteBranch() {
    if (this.branches.length <= 1) {
      toast('Cannot delete last branch', true);
      return;
    }
    if (!confirm(`Delete branch "${this.currentBranch.name}"?`)) return;

    // Delete children too
    const toDelete = new Set([this.currentBranch.id]);
    let changed = true;
    while (changed) {
      changed = false;
      this.branches.forEach(b => {
        if (toDelete.has(b.parentId) && !toDelete.has(b.id)) {
          toDelete.add(b.id);
          changed = true;
        }
      });
    }

    this.branches = this.branches.filter(b => !toDelete.has(b.id));
    this.currentBranch = this.branches[0];
    this.renderTree();
    this.renderMessages();
    this.updateStats();
    toast('Branch deleted!');
  }

  compareBranches() {
    if (this.branches.length < 2) {
      toast('Need at least 2 branches to compare', true);
      return;
    }

    const sorted = [...this.branches].sort((a, b) => b.messages.length - a.messages.length);
    const left = sorted[0];
    const right = sorted[1];

    $('compareLeft').innerHTML = `<h4>${esc(left.name)} (${left.messages.length} msgs)</h4>` +
      left.messages.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">
        <div class="av">${m.role === 'user' ? '👤' : '🤖'}</div>
        <div class="bub" style="background:${m.role === 'user' ? '#1e40af' : '#0f1f0f'};max-width:100%">${esc(m.content.slice(0, 200))}...</div>
      </div>`).join('');

    $('compareRight').innerHTML = `<h4>${esc(right.name)} (${right.messages.length} msgs)</h4>` +
      right.messages.map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">
        <div class="av">${m.role === 'user' ? '👤' : '🤖'}</div>
        <div class="bub" style="background:${m.role === 'user' ? '#1e40af' : '#0f1f0f'};max-width:100%">${esc(m.content.slice(0, 200))}...</div>
      </div>`).join('');

    $('compareView').classList.add('show');
  }

  renderMessages() {
    const history = this.getFullHistory();
    const rules = this.compressionRules[this.compressionLevel];
    const compressedCount = Math.max(0, history.length - rules.keepRecent * 2);

    $('msgs').innerHTML = history.map((m, i) => {
      const isCompressed = i < compressedCount;
      return `
        <div class="msg ${m.role === 'user' ? 'u' : 'a'}${isCompressed ? ' compressed' : ''}" data-idx="${i}">
          <div class="av">${m.role === 'user' ? '👤' : '🤖'}</div>
          <div class="wrap">
            <div class="bub">${isCompressed ? esc(m.content.slice(0, 50)) + '...' : this.formatContent(m.content)}</div>
            <div class="meta">
              <span>${estTokens(m.content)} tok</span>
              <span class="actions">
                <button onclick="C.forkFromMessage(${i})">🌿 Fork</button>
              </span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    $('msgs').scrollTop = $('msgs').scrollHeight;
  }

  formatContent(content) {
    return esc(content)
      .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  forkFromMessage(idx) {
    const history = this.getFullHistory();
    const branch = new Branch(`fork-${Date.now().toString(36)}`, this.currentBranch.id);
    // Copy messages up to this point
    branch.messages = history.slice(0, idx + 1).map(m => ({...m}));
    // Remove from current branch
    this.currentBranch.messages = this.currentBranch.messages.slice(idx + 1 - (history.length - this.currentBranch.messages.length));

    this.branches.push(branch);
    this.currentBranch = branch;
    this.renderTree();
    this.renderMessages();
    this.updateStats();
    toast('Forked from message!');
  }

  search(query) {
    if (!query.trim()) {
      this.renderTree();
      return;
    }

    const q = query.toLowerCase();
    const matches = [];
    this.branches.forEach(b => {
      b.messages.forEach((m, i) => {
        if (m.content.toLowerCase().includes(q)) {
          matches.push({ branch: b, msgIdx: i, content: m.content });
        }
      });
    });

    // Highlight matching branches in tree
    document.querySelectorAll('.tree-item').forEach(item => {
      const branch = this.branches.find(b => b.id === item.dataset.id);
      const hasMatch = matches.some(m => m.branch.id === branch?.id);
      item.style.borderColor = hasMatch ? '#22c55e' : '';
    });

    toast(`Found ${matches.length} matches`);
  }

  exportBranches() {
    const data = {
      branches: this.branches,
      currentBranchId: this.currentBranch.id,
      timestamp: Date.now()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `context-llm-branches-${Date.now()}.json`;
    a.click();
    toast('Exported!');
  }

  showTyping(show) {
    const msgs = $('msgs');
    const existing = msgs.querySelector('.typing');
    if (show && !existing) {
      msgs.insertAdjacentHTML('beforeend', '<div class="typing"><span></span><span></span><span></span></div>');
      msgs.scrollTop = msgs.scrollHeight;
    } else if (!show && existing) {
      existing.remove();
    }
    $('send').disabled = show || !this.ready;
  }

  async send(text) {
    if (!text.trim() || !this.ready) return;

    this.currentBranch.messages.push({ role: 'user', content: text, timestamp: Date.now() });
    this.renderMessages();
    this.updateStats();
    this.renderTree();
    this.showTyping(true);

    try {
      const response = await this.engine.chat.completions.create({
        messages: this.getContextMessages(),
        temperature: 0.7,
        max_tokens: 400
      });

      const reply = response.choices[0]?.message?.content || "Error.";
      this.currentBranch.messages.push({ role: 'assistant', content: reply, timestamp: Date.now() });
      this.showTyping(false);
      this.renderMessages();
      this.renderTree();
      this.updateStats();

    } catch(e) {
      this.showTyping(false);
      toast('Error: ' + e.message, true);
    }
  }
}

const C = new ContextLLM3();
window.C = C;
window.ContextLLM3 = C;
window.closeModal = () => $('modal').classList.add('hide');
window.confirmModal = () => C.confirmModal();
window.closeCompare = () => $('compareView').classList.remove('show');

// Input
const input = $('input');
$('send').onclick = () => { C.send(input.value); input.value = ''; };
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); }
};
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
};
$('model').onchange = () => { C.ready = false; C.init(); };
  </script>
</body>
