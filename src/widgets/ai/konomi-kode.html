    import * as webllm from 'https://esm.run/@mlc-ai/web-llm';

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    // ==========================================================================
    // CONTEXT DATABASE - Persistent memory with IndexedDB
    // ==========================================================================
    class ContextDB {
      constructor() {
        this.dbName = 'konomi-kode-context';
        this.db = null;
        this.tokenCount = 0;
        this.maxTokens = 8192; // Approximate context budget
      }

      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 2);
          req.onerror = () => reject(req.error);
          req.onsuccess = () => { this.db = req.result; resolve(); };
          req.onupgrade = (e) => {
            const db = e.target.result;
            // Conversations store - chunks of context
            if (!db.objectStoreNames.contains('conversations')) {
              const store = db.createObjectStore('conversations', { keyPath: 'id', autoIncrement: true });
              store.createIndex('timestamp', 'timestamp');
              store.createIndex('keywords', 'keywords', { multiEntry: true });
            }
            // Tool patterns - learn from successful tool uses
            if (!db.objectStoreNames.contains('patterns')) {
              const store = db.createObjectStore('patterns', { keyPath: 'id', autoIncrement: true });
              store.createIndex('tool', 'tool');
              store.createIndex('intent', 'intent');
            }
            // File snapshots - track file evolution
            if (!db.objectStoreNames.contains('snapshots')) {
              const store = db.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
              store.createIndex('path', 'path');
              store.createIndex('timestamp', 'timestamp');
            }
          };
        });
      }

      // Extract keywords from text for retrieval
      extractKeywords(text) {
        const stopWords = new Set(['the', 'a', 'an', 'is', 'are', 'was', 'were', 'be', 'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'could', 'should', 'may', 'might', 'must', 'shall', 'can', 'need', 'dare', 'ought', 'used', 'to', 'of', 'in', 'for', 'on', 'with', 'at', 'by', 'from', 'as', 'into', 'through', 'during', 'before', 'after', 'above', 'below', 'between', 'under', 'again', 'further', 'then', 'once', 'here', 'there', 'when', 'where', 'why', 'how', 'all', 'each', 'few', 'more', 'most', 'other', 'some', 'such', 'no', 'nor', 'not', 'only', 'own', 'same', 'so', 'than', 'too', 'very', 'just', 'and', 'but', 'if', 'or', 'because', 'until', 'while', 'although', 'though', 'after', 'before', 'when', 'i', 'me', 'my', 'myself', 'we', 'our', 'you', 'your', 'he', 'him', 'his', 'she', 'her', 'it', 'its', 'they', 'them', 'their', 'what', 'which', 'who', 'whom', 'this', 'that', 'these', 'those', 'am', 'is', 'are', 'was', 'were', 'be', 'been', 'being']);
        const words = text.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
        return [...new Set(words.filter(w => !stopWords.has(w)))].slice(0, 20);
      }

      // Approximate token count (rough: ~4 chars per token)
      countTokens(text) {
        return Math.ceil(text.length / 4);
      }

      // Store a conversation chunk
      async storeConversation(userMsg, assistantMsg, toolCalls = []) {
        const tx = this.db.transaction('conversations', 'readwrite');
        const store = tx.objectStore('conversations');
        const combined = userMsg + ' ' + assistantMsg;
        await store.add({
          timestamp: Date.now(),
          userMsg,
          assistantMsg,
          toolCalls,
          keywords: this.extractKeywords(combined),
          tokens: this.countTokens(combined)
        });
      }

      // Store a tool usage pattern for learning
      async storePattern(intent, tool, args, success) {
        const tx = this.db.transaction('patterns', 'readwrite');
        const store = tx.objectStore('patterns');
        await store.add({
          timestamp: Date.now(),
          intent: this.extractKeywords(intent).slice(0, 5).join(' '),
          tool,
          args,
          success
        });
      }

      // Store file snapshot
      async storeSnapshot(path, content) {
        const tx = this.db.transaction('snapshots', 'readwrite');
        const store = tx.objectStore('snapshots');
        await store.add({
          timestamp: Date.now(),
          path,
          content: content.slice(0, 2000), // Limit snapshot size
          tokens: this.countTokens(content)
        });
      }

      // Retrieve relevant context based on query
      async retrieveContext(query, maxTokens = 2000) {
        const keywords = this.extractKeywords(query);
        const results = [];
        let tokenBudget = maxTokens;

        // Search conversations by keywords
        const tx = this.db.transaction('conversations', 'readonly');
        const store = tx.objectStore('conversations');
        const index = store.index('keywords');

        for (const keyword of keywords) {
          const range = IDBKeyRange.only(keyword);
          const cursor = await new Promise(resolve => {
            const req = index.openCursor(range, 'prev');
            const items = [];
            req.onsuccess = () => {
              const c = req.result;
              if (c && items.length < 5) {
                items.push(c.value);
                c.continue();
              } else {
                resolve(items);
              }
            };
          });
          results.push(...cursor);
        }

        // Dedupe and sort by timestamp (most recent first)
        const seen = new Set();
        const unique = results.filter(r => {
          if (seen.has(r.id)) return false;
          seen.add(r.id);
          return true;
        }).sort((a, b) => b.timestamp - a.timestamp);

        // Build context within token budget
        const contextParts = [];
        for (const item of unique) {
          if (tokenBudget <= 0) break;
          if (item.tokens <= tokenBudget) {
            contextParts.push(`[Previous: User asked "${item.userMsg.slice(0, 100)}..." → ${item.assistantMsg.slice(0, 200)}...]`);
            tokenBudget -= item.tokens;
          }
        }

        return contextParts.join('\n');
      }

      // Get learned patterns for a tool
      async getPatterns(tool, limit = 5) {
        const tx = this.db.transaction('patterns', 'readonly');
        const store = tx.objectStore('patterns');
        const index = store.index('tool');
        const range = IDBKeyRange.only(tool);

        return new Promise(resolve => {
          const req = index.openCursor(range, 'prev');
          const items = [];
          req.onsuccess = () => {
            const c = req.result;
            if (c && items.length < limit) {
              if (c.value.success) items.push(c.value);
              c.continue();
            } else {
              resolve(items);
            }
          };
        });
      }

      // Get stats (safely handles missing stores)
      async getStats() {
        const stats = { conversations: 0, patterns: 0, snapshots: 0, totalTokens: 0 };
        if (!this.db) return stats;

        const storeNames = ['conversations', 'patterns', 'snapshots'];
        const available = storeNames.filter(s => this.db.objectStoreNames.contains(s));
        if (available.length === 0) return stats;

        try {
          const tx = this.db.transaction(available, 'readonly');

          for (const storeName of available) {
            const store = tx.objectStore(storeName);
            stats[storeName] = await new Promise(r => {
              const req = store.count();
              req.onsuccess = () => r(req.result);
              req.onerror = () => r(0);
            });
          }

          // Sum tokens from conversations
          if (available.includes('conversations')) {
            const convStore = tx.objectStore('conversations');
            await new Promise(resolve => {
              const req = convStore.openCursor();
              req.onsuccess = () => {
                const c = req.result;
                if (c) {
                  stats.totalTokens += c.value.tokens || 0;
                  c.continue();
                } else {
                  resolve();
                }
              };
              req.onerror = () => resolve();
            });
          }
        } catch (e) {
          console.warn('Stats error:', e);
        }

        return stats;
      }

      // Clear old data to manage space (safely handles missing stores)
      async cleanup(maxAge = 7 * 24 * 60 * 60 * 1000) { // 7 days
        if (!this.db) return;

        const storeNames = ['conversations', 'snapshots'];
        const available = storeNames.filter(s => this.db.objectStoreNames.contains(s));
        if (available.length === 0) return;

        try {
          const cutoff = Date.now() - maxAge;
          const tx = this.db.transaction(available, 'readwrite');

          for (const storeName of available) {
            const store = tx.objectStore(storeName);
            const index = store.index('timestamp');
            const range = IDBKeyRange.upperBound(cutoff);
            const req = index.openCursor(range);
            req.onsuccess = () => {
              const c = req.result;
              if (c) {
                c.delete();
                c.continue();
              }
            };
          }
        } catch (e) {
          console.warn('Cleanup error:', e);
        }
      }
    }

    // ==========================================================================
    // SYSTEM PROMPT - Detailed tool instructions with examples
    // ==========================================================================
    const SYSTEM_PROMPT = `You are Konomi Kode, an AI coding assistant running entirely in the browser. You help users write, edit, debug, and understand code.

## YOUR CAPABILITIES

You have access to a virtual filesystem and can execute tools to help users. You MUST use tools to make changes - you cannot directly modify files, only through tools.

## AVAILABLE TOOLS

To use a tool, output it in this EXACT format:
<tool>{"name": "tool_name", "args": {"param": "value"}}</tool>

### 1. read_file
Read the contents of a file.
Parameters: path (string) - file path
Example:
<tool>{"name": "read_file", "args": {"path": "index.html"}}</tool>

### 2. write_file
Create or overwrite a file with content.
Parameters: path (string), content (string)
Example:
<tool>{"name": "write_file", "args": {"path": "app.js", "content": "console.log('Hello');"}}</tool>

### 3. list_files
List all files in the workspace.
Parameters: none
Example:
<tool>{"name": "list_files", "args": {}}</tool>

### 4. delete_file
Delete a file.
Parameters: path (string)
Example:
<tool>{"name": "delete_file", "args": {"path": "old.js"}}</tool>

### 5. search_files
Search for text across all files.
Parameters: query (string)
Example:
<tool>{"name": "search_files", "args": {"query": "TODO"}}</tool>

### 6. run_command
Run a shell command (simulated environment).
Parameters: command (string)
Example:
<tool>{"name": "run_command", "args": {"command": "ls"}}</tool>

## HOW TO RESPOND

1. First, understand what the user wants
2. If you need to see file contents, use read_file
3. If you need to make changes, use write_file
4. Always explain what you did after using a tool
5. Be concise but helpful

## EXAMPLES

User: "Create a button that shows an alert"
You should:
1. Use read_file to see the current HTML
2. Use write_file to add the button
3. Explain what you added

User: "What files do I have?"
You should:
1. Use list_files tool
2. Describe the files

User: "Fix the bug in my code"
You should:
1. Use read_file to examine the code
2. Identify the bug
3. Use write_file with the fixed code
4. Explain the fix

## IMPORTANT RULES

- ALWAYS use the exact JSON format shown above
- Put the ENTIRE file content in write_file, not just changes
- After a tool, wait for the result before continuing
- If a tool fails, explain why and try a different approach
- Keep responses concise - don't over-explain`;

    // Virtual Filesystem
    class VFS {
      constructor() {
        this.files = new Map();
        this.load();
      }
      load() {
        const saved = localStorage.getItem('konomi-kode-fs');
        if (saved) this.files = new Map(Object.entries(JSON.parse(saved)));
      }
      save() {
        localStorage.setItem('konomi-kode-fs', JSON.stringify(Object.fromEntries(this.files)));
      }
      write(path, content) {
        this.files.set(path, content);
        this.save();
        return `Wrote ${content.length} bytes to ${path}`;
      }
      read(path) {
        return this.files.get(path);
      }
      list() {
        return Array.from(this.files.keys());
      }
      delete(path) {
        this.files.delete(path);
        this.save();
        return `Deleted ${path}`;
      }
      exists(path) {
        return this.files.has(path);
      }
    }

    // Tools available to the AI
    const TOOLS = {
      read_file: {
        description: 'Read contents of a file',
        params: ['path'],
        fn: (fs, args) => {
          const content = fs.read(args.path);
          return content !== undefined ? content : `Error: File ${args.path} not found`;
        }
      },
      write_file: {
        description: 'Write content to a file (creates or overwrites)',
        params: ['path', 'content'],
        fn: (fs, args) => fs.write(args.path, args.content)
      },
      list_files: {
        description: 'List all files in the workspace',
        params: [],
        fn: (fs) => {
          const files = fs.list();
          return files.length ? files.join('\n') : 'No files in workspace';
        }
      },
      delete_file: {
        description: 'Delete a file',
        params: ['path'],
        fn: (fs, args) => fs.delete(args.path)
      },
      search_files: {
        description: 'Search for text in all files',
        params: ['query'],
        fn: (fs, args) => {
          const results = [];
          for (const [path, content] of fs.files) {
            if (content.includes(args.query)) {
              results.push(`${path}: found`);
            }
          }
          return results.length ? results.join('\n') : 'No matches found';
        }
      },
      run_command: {
        description: 'Run a shell command (simulated)',
        params: ['command'],
        fn: (fs, args) => {
          const cmd = args.command.trim();
          if (cmd.startsWith('echo ')) return cmd.slice(5);
          if (cmd === 'pwd') return '/workspace';
          if (cmd === 'ls') return fs.list().join('\n') || '(empty)';
          if (cmd.startsWith('cat ')) {
            const path = cmd.slice(4).trim();
            return fs.read(path) || `cat: ${path}: No such file`;
          }
          return `Simulated: ${cmd}`;
        }
      }
    };

    class KonomiKode {
      constructor() {
        this.fs = new VFS();
        this.contextDB = new ContextDB();
        this.engine = null;
        this.messages = [];
        this.activeFile = null;
        this.openFiles = [];
        this.isProcessing = false;
        this.currentUserMsg = '';
        this.sessionToolCalls = [];
        this.init();
      }

      async init() {
        // Initialize context database
        try {
          await this.contextDB.init();
          this.log('Context database initialized', 'success');
          await this.contextDB.cleanup(); // Clean old data
          await this.updateStats();
        } catch (e) {
          this.log('Context DB error: ' + e.message, 'err');
        }

        // Demo files
        if (this.fs.files.size === 0) {
          this.fs.write('index.html', `<!DOCTYPE html>
<html>
<head>
  <title>My App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hello World</h1>
  <script src="app.js"><\/script>
</body>
</html>`);
          this.fs.write('style.css', `body {
  font-family: system-ui;
  background: #1a1a2e;
  color: #eee;
  padding: 40px;
}`);
          this.fs.write('app.js', `console.log('Hello!');`);
        }

        this.renderFiles();
        this.addSystemMessage();

        // Load model
        await this.loadModel($('modelSelect').value);

        // Event listeners
        $('sendBtn').onclick = () => this.sendMessage();
        $('chatInput').onkeydown = e => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
          }
        };

        $('fileList').onclick = e => {
          const file = e.target.closest('.file');
          if (file) this.openFile(file.dataset.path);
        };

        $('tabs').onclick = e => {
          const tab = e.target.closest('.tab');
          if (tab) this.openFile(tab.dataset.path);
        };

        $('editorText').oninput = () => this.saveCurrentFile();
        $('editorText').onkeyup = () => this.updateCursorInfo();

        $('newFileBtn').onclick = () => {
          const name = prompt('File name:');
          if (name) {
            this.fs.write(name, '');
            this.renderFiles();
            this.openFile(name);
          }
        };

        $('clearBtn').onclick = () => {
          this.messages = [];
          $('chatMessages').innerHTML = '';
          this.addSystemMessage();
        };

        $('resetBtn').onclick = () => {
          if (confirm('Reset all files?')) {
            localStorage.removeItem('konomi-kode-fs');
            location.reload();
          }
        };

        $('clearMemBtn').onclick = async () => {
          if (confirm('Clear all persistent memory? This will reset learned patterns and conversation history.')) {
            try {
              indexedDB.deleteDatabase('konomi-kode-context');
              this.log('Memory cleared', 'success');
              await this.contextDB.init();
              await this.updateStats();
            } catch (e) {
              this.log('Error clearing memory: ' + e.message, 'err');
            }
          }
        };

        $('modelSelect').onchange = () => this.loadModel($('modelSelect').value);
      }

      async loadModel(modelId) {
        $('loadingOverlay').classList.remove('hidden');
        $('loadingStatus').textContent = `Loading ${modelId}...`;
        $('loadingBar').style.width = '0%';
        $('modelIndicator').className = 'indicator loading';
        $('modelName').textContent = 'Loading...';

        try {
          this.engine = await webllm.CreateMLCEngine(modelId, {
            initProgressCallback: (progress) => {
              const pct = Math.round(progress.progress * 100);
              $('loadingBar').style.width = pct + '%';
              $('loadingStatus').textContent = progress.text || `Loading... ${pct}%`;
            }
          });

          $('modelIndicator').className = 'indicator ready';
          $('modelName').textContent = modelId.split('-')[0];
          $('loadingOverlay').classList.add('hidden');
          this.log('Model loaded: ' + modelId, 'success');
        } catch (e) {
          $('loadingStatus').textContent = 'Error: ' + e.message;
          $('modelIndicator').className = 'indicator';
          console.error(e);
        }
      }

      addSystemMessage() {
        this.messages.push({
          role: 'system',
          content: SYSTEM_PROMPT + `\n\n## CURRENT WORKSPACE\n\nFiles: ${this.fs.list().join(', ') || 'none'}`
        });
      }

      async updateStats() {
        try {
          const stats = await this.contextDB.getStats();
          const statsEl = $('contextStats');
          if (statsEl) {
            statsEl.textContent = `Memory: ${stats.conversations} convs | ${stats.patterns} patterns | ~${Math.round(stats.totalTokens / 1000)}K tokens`;
          }
        } catch (e) { /* ignore */ }
      }

      countMessageTokens() {
        return this.messages.reduce((sum, m) => sum + this.contextDB.countTokens(m.content || ''), 0);
      }

      renderFiles() {
        const files = this.fs.list();
        $('fileList').innerHTML = files.map(f => {
          const ext = f.split('.').pop();
          const icons = { html: '🌐', css: '🎨', js: '📜', json: '📋', md: '📝' };
          const icon = icons[ext] || '📄';
          const active = f === this.activeFile ? 'active' : '';
          return `<div class="file ${active}" data-path="${esc(f)}"><span class="icon">${icon}</span>${esc(f)}</div>`;
        }).join('') || '<div style="padding:12px;color:#64748b">No files</div>';
      }

      renderTabs() {
        $('tabs').innerHTML = this.openFiles.map(f => {
          const active = f === this.activeFile ? 'active' : '';
          return `<div class="tab ${active}" data-path="${esc(f)}">${esc(f)}</div>`;
        }).join('');
      }

      openFile(path) {
        if (!this.openFiles.includes(path)) this.openFiles.push(path);
        this.activeFile = path;
        $('editorText').value = this.fs.read(path) || '';
        $('fileInfo').textContent = path;
        this.renderFiles();
        this.renderTabs();
      }

      saveCurrentFile() {
        if (this.activeFile) {
          this.fs.write(this.activeFile, $('editorText').value);
        }
      }

      updateCursorInfo() {
        const ta = $('editorText');
        const lines = ta.value.substr(0, ta.selectionStart).split('\n');
        $('cursorInfo').textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
      }

      log(msg, type = 'out') {
        const div = document.createElement('div');
        div.className = 'line ' + type;
        div.textContent = msg;
        $('termOutput').appendChild(div);
        $('termOutput').scrollTop = $('termOutput').scrollHeight;
      }

      addChatMessage(role, content, toolCalls = []) {
        const div = document.createElement('div');
        div.className = `message ${role}`;

        let html = `<div class="bubble">${this.formatMessage(content)}</div>`;

        toolCalls.forEach(tc => {
          html += `<div class="tool-call">
            <div class="name">🔧 ${esc(tc.name)}</div>
            <div>${esc(JSON.stringify(tc.args))}</div>
            <div class="${tc.error ? 'error' : 'result'}">${esc(tc.result)}</div>
          </div>`;
        });

        div.innerHTML = html;
        $('chatMessages').appendChild(div);
        $('chatMessages').scrollTop = $('chatMessages').scrollHeight;
      }

      formatMessage(content) {
        // Basic markdown-ish formatting
        return esc(content)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
      }

      async sendMessage() {
        const input = $('chatInput').value.trim();
        if (!input || this.isProcessing || !this.engine) return;

        $('chatInput').value = '';
        this.isProcessing = true;
        $('sendBtn').disabled = true;
        $('typingIndicator').classList.add('active');
        this.currentUserMsg = input;
        this.sessionToolCalls = [];

        // Retrieve relevant context from memory
        let retrievedContext = '';
        try {
          retrievedContext = await this.contextDB.retrieveContext(input, 1500);
          if (retrievedContext) {
            this.log('Retrieved context from memory', 'tool');
          }
        } catch (e) { /* ignore */ }

        // Build enhanced user message with context
        let enhancedInput = input;
        if (retrievedContext) {
          enhancedInput = `${input}\n\n[Relevant memory from previous sessions:\n${retrievedContext}]`;
        }

        // Update system message with current workspace state
        if (this.messages.length > 0 && this.messages[0].role === 'system') {
          this.messages[0].content = SYSTEM_PROMPT + `\n\n## CURRENT WORKSPACE\n\nFiles: ${this.fs.list().join(', ') || 'none'}`;
        }

        // Add user message
        this.messages.push({ role: 'user', content: enhancedInput });
        this.addChatMessage('user', input); // Show original input to user

        // Log token usage
        const tokenCount = this.countMessageTokens();
        this.log(`Context: ~${tokenCount} tokens`, 'out');

        let finalAssistantMsg = '';

        try {
          // Agent loop - may need multiple iterations for tool calls
          let iterations = 0;
          const maxIterations = 5;

          while (iterations < maxIterations) {
            iterations++;

            const response = await this.engine.chat.completions.create({
              messages: this.messages,
              temperature: 0.7,
              max_tokens: 1024
            });

            const assistantMsg = response.choices[0].message.content;
            this.messages.push({ role: 'assistant', content: assistantMsg });
            finalAssistantMsg = assistantMsg;

            // Check for tool calls
            const toolMatch = assistantMsg.match(/<tool>([\s\S]*?)<\/tool>/);

            if (toolMatch) {
              try {
                const toolCall = JSON.parse(toolMatch[1]);
                const tool = TOOLS[toolCall.name];

                if (tool) {
                  this.log(`Tool: ${toolCall.name}`, 'tool');
                  const result = tool.fn(this.fs, toolCall.args || {});
                  this.log(result.slice(0, 100), 'out');

                  // Track tool call for learning
                  this.sessionToolCalls.push({
                    name: toolCall.name,
                    args: toolCall.args,
                    result: result,
                    success: !result.startsWith('Error')
                  });

                  // Store tool pattern for learning
                  try {
                    await this.contextDB.storePattern(
                      this.currentUserMsg,
                      toolCall.name,
                      toolCall.args,
                      !result.startsWith('Error')
                    );
                  } catch (e) { /* ignore */ }

                  // Store file snapshot if writing
                  if (toolCall.name === 'write_file' && toolCall.args.path) {
                    try {
                      await this.contextDB.storeSnapshot(toolCall.args.path, toolCall.args.content);
                    } catch (e) { /* ignore */ }
                  }

                  // Show message with tool call
                  const cleanMsg = assistantMsg.replace(/<tool>[\s\S]*?<\/tool>/, '').trim();
                  this.addChatMessage('assistant', cleanMsg || 'Using tool...', [{
                    name: toolCall.name,
                    args: toolCall.args,
                    result: result
                  }]);

                  // Add tool result to context
                  this.messages.push({
                    role: 'user',
                    content: `Tool result for ${toolCall.name}: ${result}`
                  });

                  // Update UI
                  this.renderFiles();
                  if (this.activeFile && toolCall.name === 'write_file' && toolCall.args.path === this.activeFile) {
                    $('editorText').value = this.fs.read(this.activeFile) || '';
                  }

                  // Continue loop for potential follow-up
                  continue;
                }
              } catch (e) {
                this.log('Tool error: ' + e.message, 'err');
              }
            }

            // No tool call, show response and break
            this.addChatMessage('assistant', assistantMsg);
            break;
          }

          // Store conversation in context database for future retrieval
          try {
            await this.contextDB.storeConversation(
              this.currentUserMsg,
              finalAssistantMsg.replace(/<tool>[\s\S]*?<\/tool>/g, '[tool call]').slice(0, 500),
              this.sessionToolCalls
            );
            await this.updateStats();
          } catch (e) { /* ignore */ }

        } catch (e) {
          this.log('Error: ' + e.message, 'err');
          this.addChatMessage('assistant', 'Sorry, I encountered an error: ' + e.message);
        }

        this.isProcessing = false;
        $('sendBtn').disabled = false;
        $('typingIndicator').classList.remove('active');
      }
    }

    window.KonomiKode = new KonomiKode();
  </script>
</body>
</html>
