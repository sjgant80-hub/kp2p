  <script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const estTokens = s => Math.ceil(s.length / 4);

function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Default personas
const DEFAULT_PERSONAS = [
  { id: 'default', name: 'Default', icon: '🤖', prompt: 'You are a helpful, concise AI assistant.', isDefault: true },
  { id: 'coder', name: 'Coder', icon: '👨‍💻', prompt: 'You are an expert programmer. Give technical, precise answers with code examples.', isDefault: true },
  { id: 'creative', name: 'Creative', icon: '🎨', prompt: 'You are a creative writing assistant. Be imaginative and use vivid language.', isDefault: true },
  { id: 'analyst', name: 'Analyst', icon: '📊', prompt: 'You are a data analyst. Focus on facts, statistics, and logical analysis.', isDefault: true },
  { id: 'tutor', name: 'Tutor', icon: '📚', prompt: 'You are a patient tutor. Explain clearly and check understanding.', isDefault: true }
];

// IndexedDB
class MemoryDB {
  constructor() {
    this.dbName = 'ContextLLM4_1';
    this.db = null;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 2);
      req.onerror = () => reject(req.error);
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('memories')) {
          const store = db.createObjectStore('memories', { keyPath: 'id', autoIncrement: true });
          store.createIndex('key', 'key', { unique: false });
          store.createIndex('type', 'type', { unique: false });
        }
        if (!db.objectStoreNames.contains('knowledge')) {
          db.createObjectStore('knowledge', { keyPath: 'id', autoIncrement: true });
        }
        if (!db.objectStoreNames.contains('personas')) {
          db.createObjectStore('personas', { keyPath: 'id' });
        }
      };
    });
  }

  async getAll(store) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async put(store, data) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async delete(store, id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async clear(store) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
}

class ContextLLM4 {
  constructor() {
    this.engine = null;
    this.ready = false;
    this.db = new MemoryDB();
    this.personas = [...DEFAULT_PERSONAS];
    this.currentPersona = this.personas[0];
    this.memories = [];
    this.knowledge = [];
    this.messages = [];

    this.init();
    this.setupUI();
  }

  async init() {
    $('load').classList.remove('hide');

    try {
      await this.db.init();
      this.memories = await this.db.getAll('memories');
      this.knowledge = await this.db.getAll('knowledge');
      const customPersonas = await this.db.getAll('personas');
      this.personas = [...DEFAULT_PERSONAS, ...customPersonas];
    } catch(e) {
      console.error('DB init error:', e);
    }

    const model = $('model').value;
    $('loadTxt').textContent = `Loading ${model.split('-')[0]}...`;

    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      this.engine = await webllm.CreateMLCEngine(model, {
        initProgressCallback: p => {
          $('loadTxt').textContent = p.text || `${Math.round(p.progress * 100)}%`;
        }
      });
      this.ready = true;
      $('load').classList.add('hide');
      $('send').disabled = false;
      toast('AI loaded!', 'info');
    } catch(e) {
      $('loadTxt').textContent = 'Error: ' + e.message;
    }

    this.renderPersonas();
    this.renderMemories();
    this.renderKnowledge();
    this.updateStats();
  }

  setupUI() {
    // Sidebar tabs
    document.querySelectorAll('.sidebar-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $(tab.dataset.panel + 'Panel').classList.add('active');
      };
    });

    // Emoji picker
    document.querySelectorAll('#emojiPicker button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#emojiPicker button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
    });
  }

  renderPersonas() {
    $('personaList').innerHTML = this.personas.map(p => `
      <div class="persona${p.id === this.currentPersona.id ? ' active' : ''}" onclick="C.setPersona('${p.id}')">
        <div class="icon">${p.icon}</div>
        <div class="info">
          <div class="name">${esc(p.name)}</div>
          <div class="desc">${esc(p.prompt.slice(0, 50))}...</div>
        </div>
        ${p.isDefault ? '' : '<span class="badge">Custom</span>'}
      </div>
    `).join('');
  }

  setPersona(id) {
    this.currentPersona = this.personas.find(p => p.id === id) || this.personas[0];
    this.renderPersonas();
    $('personaIndicator').innerHTML = `<span class="icon">${this.currentPersona.icon}</span><span>${esc(this.currentPersona.name)}</span>`;
    toast(`Switched to ${this.currentPersona.name}`, 'info');
  }

  async addPersona(name, icon, prompt) {
    const persona = {
      id: Date.now().toString(36),
      name,
      icon,
      prompt,
      created: Date.now()
    };
    await this.db.put('personas', persona);
    this.personas.push(persona);
    this.renderPersonas();
    toast('Persona created!', 'info');
  }

  renderMemories() {
    const sorted = [...this.memories].sort((a, b) => (b.created || 0) - (a.created || 0));
    $('memoryList').innerHTML = sorted.length ? sorted.map(m => `
      <div class="memory-item">
        <div class="header">
          <span class="key">${esc(m.key)}</span>
          <span class="type ${m.type}">${m.type}</span>
        </div>
        <div class="val">${esc(m.value.slice(0, 150))}${m.value.length > 150 ? '...' : ''}</div>
        ${m.tags?.length ? `<div class="tags">${m.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="meta">
          <span>${m.created ? new Date(m.created).toLocaleDateString() : 'Unknown'}</span>
          <button style="background:none;border:none;color:#ef4444;cursor:pointer" onclick="C.deleteMemory(${m.id})">🗑️</button>
        </div>
      </div>
    `).join('') : '<div style="padding:20px;text-align:center;color:#52525b">No memories yet</div>';

    $('memCount').textContent = this.memories.length;
  }

  async addMemory(key, value, type, tags = []) {
    const memory = { key, value, type, tags, created: Date.now() };
    const id = await this.db.put('memories', memory);
    memory.id = id;
    this.memories.push(memory);
    this.renderMemories();
    toast('Memory saved!', 'info');
  }

  async deleteMemory(id) {
    await this.db.delete('memories', id);
    this.memories = this.memories.filter(m => m.id !== id);
    this.renderMemories();
    toast('Memory deleted');
  }

  searchMemories(query) {
    if (!query.trim()) {
      this.renderMemories();
      return;
    }
    const q = query.toLowerCase();
    const filtered = this.memories.filter(m =>
      m.key.toLowerCase().includes(q) ||
      m.value.toLowerCase().includes(q) ||
      m.tags?.some(t => t.toLowerCase().includes(q))
    );
    $('memoryList').innerHTML = filtered.map(m => `
      <div class="memory-item">
        <div class="header">
          <span class="key">${esc(m.key)}</span>
          <span class="type ${m.type}">${m.type}</span>
        </div>
        <div class="val">${esc(m.value.slice(0, 100))}...</div>
      </div>
    `).join('') || '<div style="padding:20px;text-align:center;color:#52525b">No matches</div>';
  }

  renderKnowledge() {
    const recent = this.knowledge.slice(-30).reverse();
    $('knowledgeList').innerHTML = recent.length ? recent.map(k => `
      <div class="knowledge-item">
        <span class="icon">${k.type === 'fact' ? '📌' : k.type === 'pref' ? '💝' : '📋'}</span>
        <span class="text">${esc(k.content.slice(0, 80))}${k.content.length > 80 ? '...' : ''}</span>
        <span class="confidence">${k.confidence || 70}%</span>
      </div>
    `).join('') : '<div style="padding:20px;text-align:center;color:#52525b">Knowledge will appear here as you chat</div>';

    $('knowCount').textContent = this.knowledge.length;
  }

  async addKnowledge(content, type, confidence = 70) {
    const k = { content, type, confidence, created: Date.now() };
    const id = await this.db.put('knowledge', k);
    k.id = id;
    this.knowledge.push(k);
    this.renderKnowledge();
  }

  extractKnowledge(text) {
    const extracted = [];
    const lower = text.toLowerCase();

    // Facts
    if (lower.includes(' is ') || lower.includes(' are ') || lower.includes(' was ')) {
      const sentences = text.split(/[.!?]/).filter(s => s.trim().length > 20);
      sentences.slice(0, 2).forEach(s => {
        if (s.length < 150) extracted.push({ type: 'fact', content: s.trim(), confidence: 65 });
      });
    }

    // Preferences
    const prefMatch = text.match(/I (?:like|prefer|love|want|need|use) ([^.!?]+)/i);
    if (prefMatch) {
      extracted.push({ type: 'pref', content: 'User: ' + prefMatch[0], confidence: 80 });
    }

    // Rules
    const ruleMatch = text.match(/(?:always|never|must|should) ([^.!?]+)/i);
    if (ruleMatch) {
      extracted.push({ type: 'rule', content: ruleMatch[0], confidence: 75 });
    }

    return extracted.slice(0, 3);
  }

  getContextMessages() {
    const msgs = [];

    // Build system prompt with persona + memories
    let system = this.currentPersona.prompt;

    if (this.memories.length > 0) {
      const memoryContext = this.memories.slice(0, 10).map(m => `${m.key}: ${m.value}`).join('\n');
      system += `\n\nUser information:\n${memoryContext}`;
    }

    if (this.knowledge.length > 0) {
      const knowledgeContext = this.knowledge.slice(-5).map(k => k.content).join('; ');
      system += `\n\nRecent context: ${knowledgeContext}`;
    }

    msgs.push({ role: 'system', content: system });
    msgs.push(...this.messages.slice(-12));

    return msgs;
  }

  updateStats() {
    const tokens = this.getContextMessages().reduce((t, m) => t + estTokens(m.content), 0);
    $('msgCount').textContent = this.messages.length;
    $('tokens').textContent = tokens;
  }

  addMessageUI(msg, extracted = []) {
    const div = document.createElement('div');
    div.className = `msg ${msg.role === 'user' ? 'u' : 'a'}`;

    let html = esc(msg.content)
      .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');

    let extractedHtml = '';
    if (extracted.length > 0) {
      extractedHtml = `
        <div class="extracted">
          <div class="extracted-title">💡 Extracted knowledge:</div>
          <div class="extracted-items">
            ${extracted.map(e => `<span class="extracted-item">${e.type}: ${esc(e.content.slice(0, 40))}...</span>`).join('')}
          </div>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="av">${msg.role === 'user' ? '👤' : this.currentPersona.icon}</div>
      <div class="wrap">
        <div class="bub">${html}</div>
        ${extractedHtml}
        <div class="meta"><span>${estTokens(msg.content)} tokens</span></div>
      </div>
    `;

    const typing = $('msgs').querySelector('.typing');
    if (typing) typing.remove();
    $('msgs').appendChild(div);
    $('msgs').scrollTop = $('msgs').scrollHeight;
  }

  showTyping(show) {
    const msgs = $('msgs');
    const existing = msgs.querySelector('.typing');
    if (show && !existing) {
      msgs.insertAdjacentHTML('beforeend', '<div class="typing"><span></span><span></span><span></span></div>');
      msgs.scrollTop = msgs.scrollHeight;
    } else if (!show && existing) {
      existing.remove();
    }
    $('send').disabled = show || !this.ready;
  }

  async send(text) {
    if (!text.trim() || !this.ready) return;

    const userMsg = { role: 'user', content: text, timestamp: Date.now() };
    this.messages.push(userMsg);

    // Extract knowledge from user message
    const userExtracted = this.extractKnowledge(text);
    for (const k of userExtracted) {
      await this.addKnowledge(k.content, k.type, k.confidence);
    }

    this.addMessageUI(userMsg, userExtracted);
    this.updateStats();
    this.showTyping(true);

    try {
      const response = await this.engine.chat.completions.create({
        messages: this.getContextMessages(),
        temperature: 0.7,
        max_tokens: 500
      });

      const reply = response.choices[0]?.message?.content || "Error.";
      const aiMsg = { role: 'assistant', content: reply, timestamp: Date.now() };
      this.messages.push(aiMsg);

      // Extract from AI response
      const aiExtracted = this.extractKnowledge(reply);
      for (const k of aiExtracted) {
        await this.addKnowledge(k.content, k.type, k.confidence);
      }

      this.showTyping(false);
      this.addMessageUI(aiMsg, aiExtracted);
      this.updateStats();

    } catch(e) {
      this.showTyping(false);
      toast('Error: ' + e.message, 'error');
    }
  }

  clearSession() {
    this.messages = [];
    $('msgs').innerHTML = '';
    this.updateStats();
    toast('Chat cleared');
  }

  async forgetAll() {
    if (!confirm('Delete all memories and knowledge? This cannot be undone.')) return;
    await this.db.clear('memories');
    await this.db.clear('knowledge');
    this.memories = [];
    this.knowledge = [];
    this.renderMemories();
    this.renderKnowledge();
    toast('All forgotten');
  }

  exportMemories() {
    const data = { memories: this.memories, knowledge: this.knowledge, timestamp: Date.now() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `context-llm-memories-${Date.now()}.json`;
    a.click();
    toast('Exported!');
  }
}

const C = new ContextLLM4();
window.C = C;
window.ContextLLM4 = C;

// Modal functions
window.openPersonaModal = () => {
  $('pName').value = '';
  $('pPrompt').value = '';
  document.querySelectorAll('#emojiPicker button').forEach(b => b.classList.remove('selected'));
  $('personaModal').classList.remove('hide');
};
window.closePersonaModal = () => $('personaModal').classList.add('hide');
window.savePersona = () => {
  const name = $('pName').value.trim();
  const icon = document.querySelector('#emojiPicker button.selected')?.textContent || '🤖';
  const prompt = $('pPrompt').value.trim();
  if (name && prompt) {
    C.addPersona(name, icon, prompt);
    closePersonaModal();
  }
};

window.openMemoryModal = () => {
  $('mKey').value = '';
  $('mVal').value = '';
  $('mTags').value = '';
  $('memoryModal').classList.remove('hide');
};
window.closeMemoryModal = () => $('memoryModal').classList.add('hide');
window.saveMemory = () => {
  const key = $('mKey').value.trim();
  const val = $('mVal').value.trim();
  const type = $('mType').value;
  const tags = $('mTags').value.split(',').map(t => t.trim()).filter(t => t);
  if (key && val) {
    C.addMemory(key, val, type, tags);
    closeMemoryModal();
  }
};

// Input
const input = $('input');
$('send').onclick = () => { C.send(input.value); input.value = ''; };
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); }
};
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
};
$('model').onchange = () => { C.ready = false; C.init(); };
