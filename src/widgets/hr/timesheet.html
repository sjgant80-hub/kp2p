<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Timesheet - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"timesheet","name":"Timesheet","icon":"⏱️","desc":"Weekly time entry and approval tracking","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    h1{font-size:1.5rem}
    .controls{display:flex;gap:10px;align-items:center}
    button{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    button:hover{background:#333}
    button.primary{background:#e94560;border-color:#e94560}
    button:disabled{opacity:0.5;cursor:not-allowed}
    .week-nav{display:flex;align-items:center;gap:10px;background:#1a1a1a;padding:10px;border-radius:8px}
    .week-label{min-width:200px;text-align:center}
    .timesheet{background:#1a1a1a;border-radius:12px;overflow:hidden;margin-bottom:20px}
    .ts-header{display:grid;grid-template-columns:200px repeat(7,1fr) 80px;background:#0a0a0a;font-weight:600;font-size:13px}
    .ts-header>div{padding:12px 8px;text-align:center;border-right:1px solid #333}
    .ts-header>div:first-child{text-align:left;padding-left:16px}
    .ts-row{display:grid;grid-template-columns:200px repeat(7,1fr) 80px;border-top:1px solid #333}
    .ts-row>div{padding:8px;border-right:1px solid #333}
    .ts-row .project{padding:12px 16px;display:flex;align-items:center;gap:8px}
    .project-color{width:12px;height:12px;border-radius:3px}
    .ts-row input{width:100%;padding:8px;border:none;background:transparent;color:#fff;text-align:center;font-size:14px}
    .ts-row input:focus{background:#333;outline:none}
    .ts-row .total{text-align:center;font-weight:600;color:#e94560;display:flex;align-items:center;justify-content:center}
    .ts-footer{display:grid;grid-template-columns:200px repeat(7,1fr) 80px;background:#0a0a0a;font-weight:600}
    .ts-footer>div{padding:12px 8px;text-align:center;border-right:1px solid #333}
    .ts-footer>div:first-child{text-align:left;padding-left:16px}
    .add-row{margin:16px;display:flex;gap:10px}
    .add-row input{flex:1;padding:10px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#fff}
    .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
    .summary-card{background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #333}
    .summary-value{font-size:2rem;font-weight:bold;color:#e94560}
    .summary-label{font-size:13px;color:#888;margin-top:4px}
    .status-bar{display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:16px 20px;border-radius:8px;margin-bottom:20px}
    .status{display:flex;align-items:center;gap:10px}
    .status-dot{width:10px;height:10px;border-radius:50%}
    .status-dot.draft{background:#666}
    .status-dot.submitted{background:#f90}
    .status-dot.approved{background:#4a4}
    .delete-btn{background:none;border:none;color:#666;cursor:pointer;padding:4px}
    .delete-btn:hover{color:#e94560}
  </style>
</head>
<body>
  <div class="header">
    <h1>⏱️ Timesheet</h1>
    <div class="week-nav">
      <button onclick="prevWeek()">←</button>
      <span class="week-label" id="weekLabel">Week of Jan 1, 2024</span>
      <button onclick="nextWeek()">→</button>
      <button onclick="goToToday()">Today</button>
    </div>
  </div>

  <div class="summary">
    <div class="summary-card"><div class="summary-value" id="weekTotal">0h</div><div class="summary-label">This Week</div></div>
    <div class="summary-card"><div class="summary-value" id="todayTotal">0h</div><div class="summary-label">Today</div></div>
    <div class="summary-card"><div class="summary-value" id="avgDaily">0h</div><div class="summary-label">Daily Average</div></div>
  </div>

  <div class="status-bar">
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Draft</span>
    </div>
    <div class="controls">
      <button onclick="saveTimesheet()">💾 Save</button>
      <button onclick="submitTimesheet()" id="submitBtn" class="primary">Submit for Approval</button>
    </div>
  </div>

  <div class="timesheet">
    <div class="ts-header">
      <div>Project</div>
      <div id="d0">Mon</div>
      <div id="d1">Tue</div>
      <div id="d2">Wed</div>
      <div id="d3">Thu</div>
      <div id="d4">Fri</div>
      <div id="d5">Sat</div>
      <div id="d6">Sun</div>
      <div>Total</div>
    </div>
    <div id="rows"></div>
    <div class="ts-footer">
      <div>Daily Total</div>
      <div id="t0">0</div>
      <div id="t1">0</div>
      <div id="t2">0</div>
      <div id="t3">0</div>
      <div id="t4">0</div>
      <div id="t5">0</div>
      <div id="t6">0</div>
      <div id="grandTotal">0</div>
    </div>
    <div class="add-row">
      <input type="text" id="newProject" placeholder="Add project/task...">
      <input type="color" id="newColor" value="#e94560" style="width:50px;padding:4px">
      <button onclick="addProject()">+ Add</button>
    </div>
  </div>

  <script>
    const colors = ['#e94560', '#4ecdc4', '#ffe66d', '#95e1d3', '#f38181', '#aa96da', '#fcbad3', '#a8d8ea'];
    let currentWeekStart = getWeekStart(new Date());
    let timesheets = JSON.parse(localStorage.getItem('kiss-timesheets') || '{}');

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      d.setDate(diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function getWeekKey(date) {
      return date.toISOString().split('T')[0];
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function getCurrentSheet() {
      const key = getWeekKey(currentWeekStart);
      if (!timesheets[key]) {
        timesheets[key] = {
          status: 'draft',
          projects: [
            { id: '1', name: 'Main Project', color: '#e94560', hours: [0,0,0,0,0,0,0] },
            { id: '2', name: 'Meetings', color: '#4ecdc4', hours: [0,0,0,0,0,0,0] }
          ]
        };
      }
      return timesheets[key];
    }

    function save() {
      localStorage.setItem('kiss-timesheets', JSON.stringify(timesheets));
    }

    function render() {
      const sheet = getCurrentSheet();
      const endDate = new Date(currentWeekStart);
      endDate.setDate(endDate.getDate() + 6);

      // Update week label
      document.getElementById('weekLabel').textContent =
        `${formatDate(currentWeekStart)} - ${formatDate(endDate)}`;

      // Update day headers
      for (let i = 0; i < 7; i++) {
        const d = new Date(currentWeekStart);
        d.setDate(d.getDate() + i);
        const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        document.getElementById(`d${i}`).innerHTML = `${dayNames[i]}<br><small style="color:#888">${d.getDate()}</small>`;
      }

      // Render rows
      const rowsEl = document.getElementById('rows');
      rowsEl.innerHTML = sheet.projects.map(p => `
        <div class="ts-row" data-id="${p.id}">
          <div class="project">
            <span class="project-color" style="background:${p.color}"></span>
            <span>${p.name}</span>
            <button class="delete-btn" onclick="deleteProject('${p.id}')">×</button>
          </div>
          ${p.hours.map((h, i) => `<div><input type="number" min="0" max="24" step="0.5" value="${h || ''}"
            onchange="updateHours('${p.id}', ${i}, this.value)" ${sheet.status !== 'draft' ? 'disabled' : ''}></div>`).join('')}
          <div class="total">${p.hours.reduce((a, b) => a + (parseFloat(b) || 0), 0)}h</div>
        </div>
      `).join('');

      // Calculate totals
      const dailyTotals = [0, 0, 0, 0, 0, 0, 0];
      sheet.projects.forEach(p => {
        p.hours.forEach((h, i) => {
          dailyTotals[i] += parseFloat(h) || 0;
        });
      });

      for (let i = 0; i < 7; i++) {
        document.getElementById(`t${i}`).textContent = dailyTotals[i] || '-';
      }

      const grandTotal = dailyTotals.reduce((a, b) => a + b, 0);
      document.getElementById('grandTotal').textContent = `${grandTotal}h`;
      document.getElementById('weekTotal').textContent = `${grandTotal}h`;

      // Today's hours
      const today = new Date();
      const todayIndex = (today.getDay() + 6) % 7; // Monday = 0
      if (today >= currentWeekStart && today <= endDate) {
        document.getElementById('todayTotal').textContent = `${dailyTotals[todayIndex]}h`;
      } else {
        document.getElementById('todayTotal').textContent = '-';
      }

      // Daily average
      const workedDays = dailyTotals.filter(d => d > 0).length || 1;
      document.getElementById('avgDaily').textContent = `${(grandTotal / workedDays).toFixed(1)}h`;

      // Status
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const submitBtn = document.getElementById('submitBtn');

      statusDot.className = `status-dot ${sheet.status}`;
      statusText.textContent = sheet.status.charAt(0).toUpperCase() + sheet.status.slice(1);
      submitBtn.disabled = sheet.status !== 'draft';
      submitBtn.textContent = sheet.status === 'approved' ? '✓ Approved' :
                              sheet.status === 'submitted' ? 'Pending Approval' : 'Submit for Approval';
    }

    function prevWeek() {
      currentWeekStart.setDate(currentWeekStart.getDate() - 7);
      render();
    }

    function nextWeek() {
      currentWeekStart.setDate(currentWeekStart.getDate() + 7);
      render();
    }

    function goToToday() {
      currentWeekStart = getWeekStart(new Date());
      render();
    }

    function updateHours(projectId, dayIndex, value) {
      const sheet = getCurrentSheet();
      const project = sheet.projects.find(p => p.id === projectId);
      if (project) {
        project.hours[dayIndex] = parseFloat(value) || 0;
        save();
        render();
      }
    }

    function addProject() {
      const name = document.getElementById('newProject').value.trim();
      const color = document.getElementById('newColor').value;
      if (!name) return;

      const sheet = getCurrentSheet();
      sheet.projects.push({
        id: Date.now().toString(),
        name,
        color,
        hours: [0, 0, 0, 0, 0, 0, 0]
      });

      document.getElementById('newProject').value = '';
      save();
      render();
    }

    function deleteProject(id) {
      if (!confirm('Delete this project row?')) return;
      const sheet = getCurrentSheet();
      sheet.projects = sheet.projects.filter(p => p.id !== id);
      save();
      render();
    }

    function saveTimesheet() {
      save();
      alert('Timesheet saved!');
    }

    function submitTimesheet() {
      const sheet = getCurrentSheet();
      const total = sheet.projects.reduce((sum, p) =>
        sum + p.hours.reduce((a, b) => a + (parseFloat(b) || 0), 0), 0);

      if (total === 0) {
        alert('Cannot submit an empty timesheet');
        return;
      }

      if (confirm(`Submit timesheet with ${total} hours for approval?`)) {
        sheet.status = 'submitted';
        save();
        render();
      }
    }

    document.getElementById('newProject').addEventListener('keypress', e => {
      if (e.key === 'Enter') addProject();
    });

    render();
  </script>
</body>
</html>
