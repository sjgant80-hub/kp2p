<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leave Calendar - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"leave-calendar","name":"Leave Calendar","icon":"📅","desc":"Team availability and leave calendar","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    h1{font-size:1.5rem}
    .controls{display:flex;gap:10px}
    button{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    button.primary{background:#e94560;border-color:#e94560}
    .month-nav{display:flex;align-items:center;gap:15px;margin-bottom:20px}
    .month-nav h2{min-width:200px;text-align:center}
    .calendar{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #333}
    .cal-header{display:grid;grid-template-columns:repeat(7,1fr);background:#0a0a0a}
    .cal-header div{padding:15px;text-align:center;font-weight:600;font-size:13px;color:#888}
    .cal-body{display:grid;grid-template-columns:repeat(7,1fr)}
    .cal-day{min-height:100px;border:1px solid #222;padding:8px;position:relative}
    .cal-day.other-month{opacity:0.3}
    .cal-day.today{background:#1a1a2e}
    .day-num{font-size:13px;color:#888;margin-bottom:8px}
    .leave-item{padding:4px 8px;border-radius:4px;font-size:11px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
    .leave-item.vacation{background:#2a4a4a;color:#4ecdc4}
    .leave-item.sick{background:#4a2a2a;color:#f38181}
    .leave-item.personal{background:#4a4a2a;color:#ffe66d}
    .leave-item.holiday{background:#2a2a4a;color:#aa96da}
    .legend{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
    .legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
    .legend-dot{width:12px;height:12px;border-radius:3px}
    .team-filter{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .team-filter button{padding:6px 12px;font-size:13px}
    .team-filter button.active{background:#e94560;border-color:#e94560}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:24px;width:90%;max-width:400px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
    .form-group input,.form-group select{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#fff}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  </style>
</head>
<body>
  <div class="header">
    <h1>📅 Leave Calendar</h1>
    <button class="primary" onclick="showAddLeave()">+ Add Leave</button>
  </div>

  <div class="team-filter" id="teamFilter"></div>

  <div class="month-nav">
    <button onclick="prevMonth()">← Prev</button>
    <h2 id="monthLabel">January 2024</h2>
    <button onclick="nextMonth()">Next →</button>
    <button onclick="goToToday()">Today</button>
  </div>

  <div class="calendar">
    <div class="cal-header">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="cal-body" id="calBody"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4"></div>Vacation</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f38181"></div>Sick</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffe66d"></div>Personal</div>
    <div class="legend-item"><div class="legend-dot" style="background:#aa96da"></div>Holiday</div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Add Leave</h2>
      <div class="form-group"><label>Employee</label><input type="text" id="leaveName" placeholder="Employee name"></div>
      <div class="form-group"><label>Type</label><select id="leaveType">
        <option value="vacation">Vacation</option>
        <option value="sick">Sick</option>
        <option value="personal">Personal</option>
        <option value="holiday">Holiday</option>
      </select></div>
      <div class="form-group"><label>Start Date</label><input type="date" id="leaveStart"></div>
      <div class="form-group"><label>End Date</label><input type="date" id="leaveEnd"></div>
      <div class="btn-row">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="saveLeave()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let leaves = JSON.parse(localStorage.getItem('kiss-leave-calendar') || '[]');
    let selectedTeam = 'all';

    // Default holidays
    if (leaves.length === 0) {
      const year = new Date().getFullYear();
      leaves = [
        { id: '1', name: 'Company Holiday', type: 'holiday', start: `${year}-01-01`, end: `${year}-01-01` },
        { id: '2', name: 'Company Holiday', type: 'holiday', start: `${year}-12-25`, end: `${year}-12-25` }
      ];
      save();
    }

    function save() { localStorage.setItem('kiss-leave-calendar', JSON.stringify(leaves)); }

    function getUniqueEmployees() {
      return [...new Set(leaves.filter(l => l.type !== 'holiday').map(l => l.name))];
    }

    function renderFilters() {
      const filter = document.getElementById('teamFilter');
      const employees = getUniqueEmployees();
      filter.innerHTML = `
        <button class="${selectedTeam === 'all' ? 'active' : ''}" onclick="filterTeam('all')">All</button>
        ${employees.map(e => `<button class="${selectedTeam === e ? 'active' : ''}" onclick="filterTeam('${e}')">${e}</button>`).join('')}
      `;
    }

    function filterTeam(team) {
      selectedTeam = team;
      renderFilters();
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('monthLabel').textContent =
        currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      const today = new Date().toDateString();
      let html = '';

      for (let i = 0; i < 42; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);

        const dateStr = date.toISOString().split('T')[0];
        const isOtherMonth = date.getMonth() !== month;
        const isToday = date.toDateString() === today;

        // Find leaves for this date
        const dayLeaves = leaves.filter(l => {
          if (selectedTeam !== 'all' && l.name !== selectedTeam && l.type !== 'holiday') return false;
          const start = new Date(l.start);
          const end = new Date(l.end);
          return date >= start && date <= end;
        });

        html += `
          <div class="cal-day ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}" data-date="${dateStr}">
            <div class="day-num">${date.getDate()}</div>
            ${dayLeaves.slice(0, 3).map(l =>
              `<div class="leave-item ${l.type}" onclick="showLeaveDetail('${l.id}')">${l.name}</div>`
            ).join('')}
            ${dayLeaves.length > 3 ? `<div style="font-size:11px;color:#888">+${dayLeaves.length - 3} more</div>` : ''}
          </div>
        `;

        if ((i + 1) % 7 === 0 && date > lastDay) break;
      }

      document.getElementById('calBody').innerHTML = html;
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function showAddLeave() {
      document.getElementById('leaveName').value = '';
      document.getElementById('leaveStart').value = new Date().toISOString().split('T')[0];
      document.getElementById('leaveEnd').value = new Date().toISOString().split('T')[0];
      document.getElementById('modal').classList.add('active');
    }

    function showLeaveDetail(id) {
      const leave = leaves.find(l => l.id === id);
      if (leave) {
        if (confirm(`${leave.name}\n${leave.type}\n${leave.start} to ${leave.end}\n\nDelete this entry?`)) {
          leaves = leaves.filter(l => l.id !== id);
          save();
          renderFilters();
          renderCalendar();
        }
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveLeave() {
      const name = document.getElementById('leaveName').value.trim();
      const type = document.getElementById('leaveType').value;
      const start = document.getElementById('leaveStart').value;
      const end = document.getElementById('leaveEnd').value;

      if (!name || !start || !end) {
        alert('All fields are required');
        return;
      }

      leaves.push({
        id: Date.now().toString(),
        name,
        type,
        start,
        end
      });

      save();
      closeModal();
      renderFilters();
      renderCalendar();
    }

    renderFilters();
    renderCalendar();
  </script>
</body>
</html>
