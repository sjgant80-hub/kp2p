<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Org Chart - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"org-chart","name":"Org Chart","icon":"🏛️","desc":"Interactive organization hierarchy visualization","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
    .controls{display:flex;gap:10px}
    button{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer;font-size:14px}
    button:hover{background:#333}
    button.primary{background:#e94560;border-color:#e94560}
    .chart-container{overflow:auto;padding:40px;min-height:500px}
    .org-chart{display:flex;flex-direction:column;align-items:center}
    .level{display:flex;gap:20px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
    .node{background:#1a1a1a;border:2px solid #333;border-radius:12px;padding:16px 24px;text-align:center;min-width:180px;position:relative;cursor:pointer;transition:all 0.2s}
    .node:hover{border-color:#e94560;transform:translateY(-2px)}
    .node.selected{border-color:#e94560;box-shadow:0 0 20px rgba(233,69,96,0.3)}
    .node-avatar{width:50px;height:50px;border-radius:50%;background:#333;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .node-name{font-weight:600;margin-bottom:4px}
    .node-title{font-size:12px;color:#888}
    .node-dept{font-size:11px;color:#666;margin-top:4px}
    .connector{position:absolute;background:#333;z-index:-1}
    .connector-v{width:2px;height:30px;left:50%;transform:translateX(-50%);top:-30px}
    .connector-h{height:2px;top:-30px}
    .add-child{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#e94560;border:none;width:24px;height:24px;border-radius:50%;font-size:16px;cursor:pointer;opacity:0;transition:opacity 0.2s}
    .node:hover .add-child{opacity:1}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:24px;width:90%;max-width:400px}
    .modal h2{margin-bottom:20px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
    .form-group input,.form-group select{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#fff}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .btn-delete{background:#500;border-color:#500}
    .empty{text-align:center;padding:80px;color:#666}
    .tree{padding:20px}
    .tree-node{margin-left:30px;position:relative}
    .tree-node::before{content:'';position:absolute;left:-20px;top:0;width:20px;height:20px;border-left:2px solid #333;border-bottom:2px solid #333;border-radius:0 0 0 8px}
    .tree-line{border-left:2px solid #333;margin-left:-20px;padding-left:20px}
  </style>
</head>
<body>
  <div class="header">
    <h1>🏛️ Org Chart</h1>
    <div class="controls">
      <button onclick="toggleView()">Toggle View</button>
      <button onclick="expandAll()">Expand All</button>
      <button onclick="showAddRoot()" class="primary">+ Add Role</button>
    </div>
  </div>

  <div class="chart-container" id="chartContainer">
    <div class="empty" id="empty">No organization structure yet. Add the first role to begin!</div>
    <div class="org-chart" id="chart"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Role</h2>
      <input type="hidden" id="editId">
      <input type="hidden" id="parentId">
      <div class="form-group"><label>Name</label><input type="text" id="name" placeholder="John Doe"></div>
      <div class="form-group"><label>Title</label><input type="text" id="title" placeholder="CEO"></div>
      <div class="form-group"><label>Department</label><input type="text" id="dept" placeholder="Executive"></div>
      <div class="btn-row">
        <button class="btn-delete" id="deleteBtn" onclick="deleteNode()" style="display:none">Delete</button>
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="saveNode()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let nodes = JSON.parse(localStorage.getItem('kiss-orgchart') || '[]');
    let viewMode = 'chart'; // or 'tree'

    function save() { localStorage.setItem('kiss-orgchart', JSON.stringify(nodes)); }

    function getChildren(parentId) {
      return nodes.filter(n => n.parentId === parentId);
    }

    function renderChart() {
      const chart = document.getElementById('chart');
      const empty = document.getElementById('empty');

      if (nodes.length === 0) {
        empty.style.display = 'block';
        chart.innerHTML = '';
        return;
      }
      empty.style.display = 'none';

      if (viewMode === 'tree') {
        renderTree();
        return;
      }

      const roots = nodes.filter(n => !n.parentId);
      let html = '';

      function renderLevel(parentNodes) {
        if (parentNodes.length === 0) return '';

        let levelHtml = '<div class="level">';
        let nextLevel = [];

        parentNodes.forEach(node => {
          levelHtml += `
            <div class="node" onclick="selectNode('${node.id}')" ondblclick="editNode('${node.id}')">
              ${node.parentId ? '<div class="connector connector-v"></div>' : ''}
              <div class="node-avatar">${node.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
              <div class="node-name">${node.name}</div>
              <div class="node-title">${node.title}</div>
              <div class="node-dept">${node.dept}</div>
              <button class="add-child" onclick="event.stopPropagation();showAddChild('${node.id}')">+</button>
            </div>
          `;
          nextLevel.push(...getChildren(node.id));
        });

        levelHtml += '</div>';
        return levelHtml + renderLevel(nextLevel);
      }

      chart.innerHTML = renderLevel(roots);
    }

    function renderTree() {
      const chart = document.getElementById('chart');
      const roots = nodes.filter(n => !n.parentId);

      function renderNode(node, isLast) {
        const children = getChildren(node.id);
        return `
          <div class="tree-node">
            <div class="node" onclick="selectNode('${node.id}')" ondblclick="editNode('${node.id}')" style="display:inline-block">
              <div class="node-name">${node.name}</div>
              <div class="node-title">${node.title}</div>
            </div>
            ${children.length ? `<div class="tree-line">${children.map((c,i) => renderNode(c, i === children.length-1)).join('')}</div>` : ''}
          </div>
        `;
      }

      chart.innerHTML = `<div class="tree">${roots.map(r => renderNode(r, true)).join('')}</div>`;
    }

    function toggleView() {
      viewMode = viewMode === 'chart' ? 'tree' : 'chart';
      renderChart();
    }

    function expandAll() {
      renderChart();
    }

    function showAddRoot() {
      document.getElementById('modalTitle').textContent = 'Add Role';
      document.getElementById('editId').value = '';
      document.getElementById('parentId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('title').value = '';
      document.getElementById('dept').value = '';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('modal').classList.add('active');
    }

    function showAddChild(parentId) {
      document.getElementById('modalTitle').textContent = 'Add Report';
      document.getElementById('editId').value = '';
      document.getElementById('parentId').value = parentId;
      document.getElementById('name').value = '';
      document.getElementById('title').value = '';
      document.getElementById('dept').value = '';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('modal').classList.add('active');
    }

    function selectNode(id) {
      document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
    }

    function editNode(id) {
      const node = nodes.find(n => n.id === id);
      if (!node) return;
      document.getElementById('modalTitle').textContent = 'Edit Role';
      document.getElementById('editId').value = id;
      document.getElementById('parentId').value = node.parentId || '';
      document.getElementById('name').value = node.name;
      document.getElementById('title').value = node.title;
      document.getElementById('dept').value = node.dept;
      document.getElementById('deleteBtn').style.display = 'block';
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveNode() {
      const id = document.getElementById('editId').value || Date.now().toString();
      const node = {
        id,
        parentId: document.getElementById('parentId').value || null,
        name: document.getElementById('name').value.trim(),
        title: document.getElementById('title').value.trim(),
        dept: document.getElementById('dept').value.trim()
      };

      if (!node.name || !node.title) {
        alert('Name and title are required');
        return;
      }

      const idx = nodes.findIndex(n => n.id === id);
      if (idx >= 0) {
        nodes[idx] = node;
      } else {
        nodes.push(node);
      }

      save();
      closeModal();
      renderChart();
    }

    function deleteNode() {
      const id = document.getElementById('editId').value;
      const children = getChildren(id);
      if (children.length > 0) {
        if (!confirm('This will also delete all reports. Continue?')) return;
        // Recursively delete children
        function deleteRecursive(nodeId) {
          getChildren(nodeId).forEach(c => deleteRecursive(c.id));
          nodes = nodes.filter(n => n.id !== nodeId);
        }
        deleteRecursive(id);
      } else {
        nodes = nodes.filter(n => n.id !== id);
      }
      save();
      closeModal();
      renderChart();
    }

    renderChart();
  </script>
</body>
</html>
