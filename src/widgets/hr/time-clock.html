<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Time Clock - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"time-clock","name":"Time Clock","icon":"🕐","desc":"Clock in/out with location tracking","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{text-align:center;margin-bottom:30px}
    h1{font-size:1.5rem;margin-bottom:10px}
    .current-time{font-size:4rem;font-weight:bold;color:#e94560}
    .current-date{color:#888;font-size:1.1rem}
    .clock-status{display:flex;justify-content:center;align-items:center;gap:20px;margin:30px 0}
    .status-indicator{display:flex;align-items:center;gap:10px;padding:15px 30px;background:#1a1a1a;border-radius:12px;border:1px solid #333}
    .status-dot{width:12px;height:12px;border-radius:50%}
    .status-dot.in{background:#4a4;animation:pulse 2s infinite}
    .status-dot.out{background:#666}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    .clock-btn{width:200px;height:200px;border-radius:50%;font-size:1.5rem;font-weight:bold;cursor:pointer;border:none;transition:all 0.3s}
    .clock-btn.clock-in{background:linear-gradient(135deg,#1a4a1a,#2a6a2a);color:#fff}
    .clock-btn.clock-out{background:linear-gradient(135deg,#4a1a1a,#6a2a2a);color:#fff}
    .clock-btn:hover{transform:scale(1.05)}
    .clock-btn:active{transform:scale(0.95)}
    .clock-section{display:flex;flex-direction:column;align-items:center;margin:40px 0}
    .today-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px auto;max-width:600px}
    .summary-card{background:#1a1a1a;padding:20px;border-radius:12px;text-align:center;border:1px solid #333}
    .summary-value{font-size:1.8rem;font-weight:bold;color:#e94560}
    .summary-label{color:#888;font-size:13px;margin-top:5px}
    .history{max-width:800px;margin:0 auto}
    .history h2{margin-bottom:15px;font-size:1.2rem}
    .history-table{width:100%;border-collapse:collapse}
    .history-table th{text-align:left;padding:12px;color:#888;font-size:13px;border-bottom:1px solid #333}
    .history-table td{padding:12px;border-bottom:1px solid #222}
    .badge{padding:4px 10px;border-radius:4px;font-size:12px}
    .badge.complete{background:#1a3a1a;color:#4a4}
    .badge.active{background:#3a3a1a;color:#fa0}
    .location{display:flex;align-items:center;gap:6px;font-size:13px;color:#888}
  </style>
</head>
<body>
  <div class="header">
    <h1>🕐 Time Clock</h1>
    <div class="current-time" id="currentTime">00:00:00</div>
    <div class="current-date" id="currentDate">Monday, January 1, 2024</div>
  </div>

  <div class="clock-status">
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Clocked Out</span>
    </div>
    <div class="status-indicator" id="clockedInTime" style="display:none">
      <span>Since: <strong id="clockInTime">-</strong></span>
    </div>
  </div>

  <div class="clock-section">
    <button class="clock-btn clock-in" id="clockBtn" onclick="toggleClock()">CLOCK IN</button>
    <div class="location" id="locationInfo" style="margin-top:15px">📍 Location: Detecting...</div>
  </div>

  <div class="today-summary">
    <div class="summary-card">
      <div class="summary-value" id="todayHours">0:00</div>
      <div class="summary-label">Today</div>
    </div>
    <div class="summary-card">
      <div class="summary-value" id="weekHours">0:00</div>
      <div class="summary-label">This Week</div>
    </div>
    <div class="summary-card">
      <div class="summary-value" id="overtimeHours">0:00</div>
      <div class="summary-label">Overtime</div>
    </div>
  </div>

  <div class="history">
    <h2>Recent Punches</h2>
    <table class="history-table">
      <thead><tr><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>

  <script>
    let punches = JSON.parse(localStorage.getItem('kiss-timeclock') || '[]');
    let currentPunch = null;
    let currentLocation = 'Unknown';

    function save() { localStorage.setItem('kiss-timeclock', JSON.stringify(punches)); }

    function formatTime(date) {
      return new Date(date).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function formatDuration(ms) {
      const hours = Math.floor(ms / 3600000);
      const mins = Math.floor((ms % 3600000) / 60000);
      return `${hours}:${mins.toString().padStart(2, '0')}`;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent =
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('currentDate').textContent =
        now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      // Update active punch duration
      if (currentPunch) {
        updateStats();
      }
    }

    function checkCurrentPunch() {
      const today = new Date().toDateString();
      currentPunch = punches.find(p => !p.clockOut && new Date(p.clockIn).toDateString() === today);

      const btn = document.getElementById('clockBtn');
      const dot = document.getElementById('statusDot');
      const status = document.getElementById('statusText');
      const clockedInDiv = document.getElementById('clockedInTime');

      if (currentPunch) {
        btn.className = 'clock-btn clock-out';
        btn.textContent = 'CLOCK OUT';
        dot.className = 'status-dot in';
        status.textContent = 'Clocked In';
        clockedInDiv.style.display = 'block';
        document.getElementById('clockInTime').textContent = formatTime(currentPunch.clockIn);
      } else {
        btn.className = 'clock-btn clock-in';
        btn.textContent = 'CLOCK IN';
        dot.className = 'status-dot out';
        status.textContent = 'Clocked Out';
        clockedInDiv.style.display = 'none';
      }
    }

    function toggleClock() {
      if (currentPunch) {
        // Clock out
        currentPunch.clockOut = new Date().toISOString();
        currentPunch.duration = new Date(currentPunch.clockOut) - new Date(currentPunch.clockIn);
        currentPunch = null;
      } else {
        // Clock in
        currentPunch = {
          id: Date.now().toString(),
          clockIn: new Date().toISOString(),
          clockOut: null,
          duration: 0,
          location: currentLocation
        };
        punches.unshift(currentPunch);
      }

      save();
      checkCurrentPunch();
      updateStats();
      renderHistory();
    }

    function updateStats() {
      const today = new Date().toDateString();
      const weekStart = new Date();
      weekStart.setDate(weekStart.getDate() - weekStart.getDay());
      weekStart.setHours(0, 0, 0, 0);

      let todayMs = 0;
      let weekMs = 0;

      punches.forEach(p => {
        const punchDate = new Date(p.clockIn);

        let duration = p.duration;
        if (!p.clockOut && punchDate.toDateString() === today) {
          duration = Date.now() - new Date(p.clockIn).getTime();
        }

        if (punchDate.toDateString() === today) {
          todayMs += duration;
        }

        if (punchDate >= weekStart) {
          weekMs += duration;
        }
      });

      document.getElementById('todayHours').textContent = formatDuration(todayMs);
      document.getElementById('weekHours').textContent = formatDuration(weekMs);

      // Overtime (over 40 hours/week)
      const overtimeMs = Math.max(0, weekMs - (40 * 3600000));
      document.getElementById('overtimeHours').textContent = formatDuration(overtimeMs);
    }

    function renderHistory() {
      const tbody = document.getElementById('historyBody');
      tbody.innerHTML = punches.slice(0, 14).map(p => {
        const isActive = !p.clockOut;
        let duration = p.duration;
        if (isActive) {
          duration = Date.now() - new Date(p.clockIn).getTime();
        }
        return `
          <tr>
            <td>${formatDate(p.clockIn)}</td>
            <td>${formatTime(p.clockIn)}</td>
            <td>${p.clockOut ? formatTime(p.clockOut) : '-'}</td>
            <td>${formatDuration(duration)}</td>
            <td><span class="badge ${isActive ? 'active' : 'complete'}">${isActive ? 'Active' : 'Complete'}</span></td>
          </tr>
        `;
      }).join('');
    }

    // Get location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          currentLocation = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
          document.getElementById('locationInfo').textContent = `📍 Location: ${currentLocation}`;
        },
        () => {
          document.getElementById('locationInfo').textContent = '📍 Location: Not available';
        }
      );
    }

    setInterval(updateClock, 1000);
    updateClock();
    checkCurrentPunch();
    updateStats();
    renderHistory();
  </script>
</body>
</html>
