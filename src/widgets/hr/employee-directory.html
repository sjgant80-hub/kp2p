<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employee Directory - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"employee-directory","name":"Employee Directory","icon":"👥","desc":"Searchable organization directory with photos and contact info","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
    .controls{display:flex;gap:10px;flex-wrap:wrap}
    input,select,button{padding:8px 12px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:14px}
    button{background:#e94560;border-color:#e94560;cursor:pointer}
    button:hover{background:#d63050}
    .search-box{width:250px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{background:#1a1a1a;border-radius:12px;padding:20px;border:1px solid #333}
    .card:hover{border-color:#e94560}
    .card-header{display:flex;gap:15px;margin-bottom:15px}
    .avatar{width:60px;height:60px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .info h3{font-size:1.1rem;margin-bottom:4px}
    .info p{color:#888;font-size:13px}
    .details{display:flex;flex-direction:column;gap:8px;font-size:13px}
    .detail{display:flex;align-items:center;gap:8px;color:#aaa}
    .detail a{color:#e94560;text-decoration:none}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .tag{background:#333;padding:4px 8px;border-radius:4px;font-size:11px}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:24px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
    .modal h2{margin-bottom:20px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
    .form-group input,.form-group select{width:100%}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .btn-secondary{background:#333;border-color:#333}
    .empty{text-align:center;padding:60px;color:#666}
    .stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
    .stat{background:#1a1a1a;padding:15px 20px;border-radius:8px;border:1px solid #333}
    .stat-value{font-size:1.5rem;font-weight:bold;color:#e94560}
    .stat-label{font-size:12px;color:#888}
  </style>
</head>
<body>
  <div class="header">
    <h1>👥 Employee Directory</h1>
    <div class="controls">
      <input type="text" class="search-box" id="search" placeholder="Search employees...">
      <select id="deptFilter"><option value="">All Departments</option></select>
      <button onclick="showAdd()">+ Add Employee</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="totalCount">0</div><div class="stat-label">Total Employees</div></div>
    <div class="stat"><div class="stat-value" id="deptCount">0</div><div class="stat-label">Departments</div></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No employees yet. Add your first employee!</div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Add Employee</h2>
      <input type="hidden" id="editId">
      <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="John Doe"></div>
      <div class="form-group"><label>Job Title</label><input type="text" id="title" placeholder="Software Engineer"></div>
      <div class="form-group"><label>Department</label><input type="text" id="dept" placeholder="Engineering"></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="john@company.com"></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="phone" placeholder="+1 555-0100"></div>
      <div class="form-group"><label>Location</label><input type="text" id="location" placeholder="San Francisco, CA"></div>
      <div class="form-group"><label>Manager</label><input type="text" id="manager" placeholder="Jane Smith"></div>
      <div class="form-group"><label>Photo URL (optional)</label><input type="text" id="photo" placeholder="https://..."></div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button onclick="saveEmployee()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let employees = JSON.parse(localStorage.getItem('kiss-employees') || '[]');

    function save() { localStorage.setItem('kiss-employees', JSON.stringify(employees)); }

    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const deptFilter = document.getElementById('deptFilter').value;

      const filtered = employees.filter(e => {
        const matchSearch = e.name.toLowerCase().includes(search) ||
                           e.title.toLowerCase().includes(search) ||
                           e.dept.toLowerCase().includes(search);
        const matchDept = !deptFilter || e.dept === deptFilter;
        return matchSearch && matchDept;
      });

      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = filtered.map(e => `
        <div class="card">
          <div class="card-header">
            <div class="avatar">${e.photo ? `<img src="${e.photo}" alt="${e.name}">` : getInitials(e.name)}</div>
            <div class="info">
              <h3>${e.name}</h3>
              <p>${e.title}</p>
            </div>
          </div>
          <div class="details">
            <div class="detail">🏢 ${e.dept}</div>
            ${e.email ? `<div class="detail">📧 <a href="mailto:${e.email}">${e.email}</a></div>` : ''}
            ${e.phone ? `<div class="detail">📞 ${e.phone}</div>` : ''}
            ${e.location ? `<div class="detail">📍 ${e.location}</div>` : ''}
            ${e.manager ? `<div class="detail">👤 Reports to: ${e.manager}</div>` : ''}
          </div>
          <div class="tags">
            <span class="tag" style="cursor:pointer" onclick="editEmployee('${e.id}')">✏️ Edit</span>
            <span class="tag" style="cursor:pointer;background:#500" onclick="deleteEmployee('${e.id}')">🗑️ Delete</span>
          </div>
        </div>
      `).join('');

      // Update stats
      const depts = [...new Set(employees.map(e => e.dept))];
      document.getElementById('totalCount').textContent = employees.length;
      document.getElementById('deptCount').textContent = depts.length;

      // Update department filter
      const deptSelect = document.getElementById('deptFilter');
      const currentVal = deptSelect.value;
      deptSelect.innerHTML = '<option value="">All Departments</option>' +
        depts.map(d => `<option value="${d}">${d}</option>`).join('');
      deptSelect.value = currentVal;
    }

    function showAdd() {
      document.getElementById('modalTitle').textContent = 'Add Employee';
      document.getElementById('editId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('title').value = '';
      document.getElementById('dept').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('location').value = '';
      document.getElementById('manager').value = '';
      document.getElementById('photo').value = '';
      document.getElementById('modal').classList.add('active');
    }

    function editEmployee(id) {
      const emp = employees.find(e => e.id === id);
      if (!emp) return;
      document.getElementById('modalTitle').textContent = 'Edit Employee';
      document.getElementById('editId').value = id;
      document.getElementById('name').value = emp.name;
      document.getElementById('title').value = emp.title;
      document.getElementById('dept').value = emp.dept;
      document.getElementById('email').value = emp.email || '';
      document.getElementById('phone').value = emp.phone || '';
      document.getElementById('location').value = emp.location || '';
      document.getElementById('manager').value = emp.manager || '';
      document.getElementById('photo').value = emp.photo || '';
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveEmployee() {
      const id = document.getElementById('editId').value || Date.now().toString();
      const emp = {
        id,
        name: document.getElementById('name').value.trim(),
        title: document.getElementById('title').value.trim(),
        dept: document.getElementById('dept').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        location: document.getElementById('location').value.trim(),
        manager: document.getElementById('manager').value.trim(),
        photo: document.getElementById('photo').value.trim()
      };

      if (!emp.name || !emp.title || !emp.dept) {
        alert('Name, title and department are required');
        return;
      }

      const idx = employees.findIndex(e => e.id === id);
      if (idx >= 0) {
        employees[idx] = emp;
      } else {
        employees.push(emp);
      }

      save();
      closeModal();
      render();
    }

    function deleteEmployee(id) {
      if (confirm('Delete this employee?')) {
        employees = employees.filter(e => e.id !== id);
        save();
        render();
      }
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('deptFilter').addEventListener('change', render);

    render();
  </script>
</body>
</html>
