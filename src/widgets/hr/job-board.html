<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Job Board - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"job-board","name":"Job Board","icon":"💼","desc":"Internal job postings and openings","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    h1{font-size:1.5rem}
    button{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    button.primary{background:#e94560;border-color:#e94560}
    .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .filters input,.filters select{padding:10px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff}
    .filters input{width:250px}
    .stats{display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap}
    .stat{background:#1a1a1a;padding:15px 25px;border-radius:8px;border:1px solid #333}
    .stat-value{font-size:1.5rem;font-weight:bold;color:#e94560}
    .stat-label{font-size:12px;color:#888;margin-top:4px}
    .jobs-grid{display:grid;gap:16px}
    .job-card{background:#1a1a1a;border-radius:12px;padding:24px;border:1px solid #333;display:flex;justify-content:space-between;align-items:start;gap:20px;flex-wrap:wrap}
    .job-card:hover{border-color:#e94560}
    .job-main{flex:1;min-width:250px}
    .job-title{font-size:1.2rem;margin-bottom:8px;display:flex;align-items:center;gap:10px}
    .job-meta{display:flex;gap:15px;color:#888;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
    .job-desc{color:#aaa;font-size:14px;line-height:1.6;margin-bottom:15px}
    .job-tags{display:flex;gap:8px;flex-wrap:wrap}
    .tag{padding:4px 10px;border-radius:4px;font-size:12px;background:#333}
    .tag.urgent{background:#500;color:#f66}
    .tag.new{background:#004a00;color:#6f6}
    .tag.internal{background:#004a4a;color:#4cc}
    .job-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
    .applicant-count{font-size:13px;color:#888}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:24px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#fff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .empty{text-align:center;padding:40px;color:#666}
  </style>
</head>
<body>
  <div class="header">
    <h1>💼 Job Board</h1>
    <button class="primary" onclick="showAddJob()">+ Post Job</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="openPositions">0</div><div class="stat-label">Open Positions</div></div>
    <div class="stat"><div class="stat-value" id="newThisWeek">0</div><div class="stat-label">New This Week</div></div>
    <div class="stat"><div class="stat-value" id="totalApplicants">0</div><div class="stat-label">Total Applicants</div></div>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="Search jobs..." oninput="render()">
    <select id="deptFilter" onchange="render()">
      <option value="">All Departments</option>
    </select>
    <select id="typeFilter" onchange="render()">
      <option value="">All Types</option>
      <option value="full-time">Full-time</option>
      <option value="part-time">Part-time</option>
      <option value="contract">Contract</option>
      <option value="internship">Internship</option>
    </select>
    <select id="locationFilter" onchange="render()">
      <option value="">All Locations</option>
      <option value="remote">Remote</option>
      <option value="hybrid">Hybrid</option>
      <option value="onsite">On-site</option>
    </select>
  </div>

  <div class="jobs-grid" id="jobsGrid"></div>
  <div class="empty" id="empty">No job postings yet. Create your first job posting!</div>

  <div class="modal" id="jobModal">
    <div class="modal-content">
      <h2 id="modalTitle">Post New Job</h2>
      <input type="hidden" id="jobId">
      <div class="form-group"><label>Job Title</label><input type="text" id="title" placeholder="Software Engineer"></div>
      <div class="form-row">
        <div class="form-group"><label>Department</label><input type="text" id="department" placeholder="Engineering"></div>
        <div class="form-group"><label>Location</label><select id="location">
          <option value="remote">Remote</option>
          <option value="hybrid">Hybrid</option>
          <option value="onsite">On-site</option>
        </select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Type</label><select id="type">
          <option value="full-time">Full-time</option>
          <option value="part-time">Part-time</option>
          <option value="contract">Contract</option>
          <option value="internship">Internship</option>
        </select></div>
        <div class="form-group"><label>Salary Range</label><input type="text" id="salary" placeholder="$100k - $150k"></div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="description" rows="4" placeholder="Job description..."></textarea></div>
      <div class="form-group"><label>Requirements (one per line)</label><textarea id="requirements" rows="3" placeholder="5+ years experience\nBachelor's degree"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Internal Only</label><select id="internal">
          <option value="false">Open to All</option>
          <option value="true">Internal Only</option>
        </select></div>
        <div class="form-group"><label>Priority</label><select id="priority">
          <option value="normal">Normal</option>
          <option value="urgent">Urgent</option>
        </select></div>
      </div>
      <div class="btn-row">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="saveJob()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal" id="applyModal">
    <div class="modal-content">
      <h2>Apply for Position</h2>
      <input type="hidden" id="applyJobId">
      <div class="form-group"><label>Your Name</label><input type="text" id="applicantName"></div>
      <div class="form-group"><label>Email</label><input type="email" id="applicantEmail"></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="applicantPhone"></div>
      <div class="form-group"><label>Cover Letter</label><textarea id="coverLetter" rows="4" placeholder="Why are you interested in this position?"></textarea></div>
      <div class="btn-row">
        <button onclick="closeApplyModal()">Cancel</button>
        <button class="primary" onclick="submitApplication()">Submit Application</button>
      </div>
    </div>
  </div>

  <script>
    let jobs = JSON.parse(localStorage.getItem('kiss-job-board') || '[]');

    // Default jobs
    if (jobs.length === 0) {
      jobs = [
        {
          id: '1',
          title: 'Senior Software Engineer',
          department: 'Engineering',
          location: 'remote',
          type: 'full-time',
          salary: '$150k - $200k',
          description: 'We\'re looking for a senior engineer to help build our next-generation platform.',
          requirements: ['5+ years experience', 'Strong JavaScript/TypeScript', 'Experience with React'],
          internal: false,
          priority: 'urgent',
          applicants: 12,
          createdAt: new Date(Date.now() - 86400000 * 2).toISOString()
        },
        {
          id: '2',
          title: 'Product Manager',
          department: 'Product',
          location: 'hybrid',
          type: 'full-time',
          salary: '$120k - $160k',
          description: 'Lead product strategy and work closely with engineering teams.',
          requirements: ['3+ years PM experience', 'Technical background preferred', 'Strong communication skills'],
          internal: false,
          priority: 'normal',
          applicants: 8,
          createdAt: new Date().toISOString()
        }
      ];
      save();
    }

    function save() { localStorage.setItem('kiss-job-board', JSON.stringify(jobs)); }

    function isNewThisWeek(date) {
      const weekAgo = new Date();
      weekAgo.setDate(weekAgo.getDate() - 7);
      return new Date(date) >= weekAgo;
    }

    function updateFilters() {
      const depts = [...new Set(jobs.map(j => j.department))];
      const deptSelect = document.getElementById('deptFilter');
      deptSelect.innerHTML = '<option value="">All Departments</option>' +
        depts.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const deptFilter = document.getElementById('deptFilter').value;
      const typeFilter = document.getElementById('typeFilter').value;
      const locationFilter = document.getElementById('locationFilter').value;

      const filtered = jobs.filter(j => {
        if (search && !j.title.toLowerCase().includes(search) && !j.department.toLowerCase().includes(search)) return false;
        if (deptFilter && j.department !== deptFilter) return false;
        if (typeFilter && j.type !== typeFilter) return false;
        if (locationFilter && j.location !== locationFilter) return false;
        return true;
      });

      // Stats
      document.getElementById('openPositions').textContent = jobs.length;
      document.getElementById('newThisWeek').textContent = jobs.filter(j => isNewThisWeek(j.createdAt)).length;
      document.getElementById('totalApplicants').textContent = jobs.reduce((sum, j) => sum + (j.applicants || 0), 0);

      const grid = document.getElementById('jobsGrid');
      const empty = document.getElementById('empty');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = filtered.map(j => {
        const isNew = isNewThisWeek(j.createdAt);
        const locationLabels = { remote: '🌍 Remote', hybrid: '🏢 Hybrid', onsite: '📍 On-site' };

        return `
          <div class="job-card">
            <div class="job-main">
              <h2 class="job-title">${j.title}</h2>
              <div class="job-meta">
                <span>🏢 ${j.department}</span>
                <span>${locationLabels[j.location]}</span>
                <span>💰 ${j.salary || 'Competitive'}</span>
                <span>📋 ${j.type}</span>
              </div>
              <p class="job-desc">${j.description}</p>
              <div class="job-tags">
                ${j.priority === 'urgent' ? '<span class="tag urgent">🔥 Urgent</span>' : ''}
                ${isNew ? '<span class="tag new">✨ New</span>' : ''}
                ${j.internal ? '<span class="tag internal">🔒 Internal</span>' : ''}
              </div>
            </div>
            <div class="job-actions">
              <button class="primary" onclick="showApply('${j.id}')">Apply Now</button>
              <button onclick="editJob('${j.id}')">Edit</button>
              <span class="applicant-count">${j.applicants || 0} applicants</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function showAddJob() {
      document.getElementById('modalTitle').textContent = 'Post New Job';
      document.getElementById('jobId').value = '';
      document.getElementById('title').value = '';
      document.getElementById('department').value = '';
      document.getElementById('salary').value = '';
      document.getElementById('description').value = '';
      document.getElementById('requirements').value = '';
      document.getElementById('location').value = 'remote';
      document.getElementById('type').value = 'full-time';
      document.getElementById('internal').value = 'false';
      document.getElementById('priority').value = 'normal';
      document.getElementById('jobModal').classList.add('active');
    }

    function editJob(id) {
      const job = jobs.find(j => j.id === id);
      if (!job) return;
      document.getElementById('modalTitle').textContent = 'Edit Job';
      document.getElementById('jobId').value = id;
      document.getElementById('title').value = job.title;
      document.getElementById('department').value = job.department;
      document.getElementById('salary').value = job.salary;
      document.getElementById('description').value = job.description;
      document.getElementById('requirements').value = (job.requirements || []).join('\n');
      document.getElementById('location').value = job.location;
      document.getElementById('type').value = job.type;
      document.getElementById('internal').value = job.internal.toString();
      document.getElementById('priority').value = job.priority;
      document.getElementById('jobModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('jobModal').classList.remove('active');
    }

    function saveJob() {
      const id = document.getElementById('jobId').value || Date.now().toString();
      const reqs = document.getElementById('requirements').value.split('\n').filter(r => r.trim());

      const job = {
        id,
        title: document.getElementById('title').value.trim(),
        department: document.getElementById('department').value.trim(),
        location: document.getElementById('location').value,
        type: document.getElementById('type').value,
        salary: document.getElementById('salary').value.trim(),
        description: document.getElementById('description').value.trim(),
        requirements: reqs,
        internal: document.getElementById('internal').value === 'true',
        priority: document.getElementById('priority').value,
        applicants: 0,
        createdAt: new Date().toISOString()
      };

      if (!job.title || !job.department) {
        alert('Title and department are required');
        return;
      }

      const idx = jobs.findIndex(j => j.id === id);
      if (idx >= 0) {
        job.applicants = jobs[idx].applicants;
        job.createdAt = jobs[idx].createdAt;
        jobs[idx] = job;
      } else {
        jobs.unshift(job);
      }

      save();
      closeModal();
      updateFilters();
      render();
    }

    function showApply(id) {
      document.getElementById('applyJobId').value = id;
      document.getElementById('applicantName').value = '';
      document.getElementById('applicantEmail').value = '';
      document.getElementById('applicantPhone').value = '';
      document.getElementById('coverLetter').value = '';
      document.getElementById('applyModal').classList.add('active');
    }

    function closeApplyModal() {
      document.getElementById('applyModal').classList.remove('active');
    }

    function submitApplication() {
      const jobId = document.getElementById('applyJobId').value;
      const name = document.getElementById('applicantName').value.trim();
      const email = document.getElementById('applicantEmail').value.trim();

      if (!name || !email) {
        alert('Name and email are required');
        return;
      }

      const job = jobs.find(j => j.id === jobId);
      if (job) {
        job.applicants = (job.applicants || 0) + 1;
        save();
      }

      alert('Application submitted successfully!');
      closeApplyModal();
      render();
    }

    updateFilters();
    render();
  </script>
</body>
</html>
