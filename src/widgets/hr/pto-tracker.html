<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PTO Tracker - KISS MySaaS</title>
  <script type="application/json" id="widget-meta">{"id":"pto-tracker","name":"PTO Tracker","icon":"🏖️","desc":"Vacation and sick time request management","category":"hr","version":"1.0.0"}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    h1{font-size:1.5rem}
    button{padding:8px 16px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
    button:hover{background:#333}
    button.primary{background:#e94560;border-color:#e94560}
    .balances{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
    .balance-card{background:#1a1a1a;border-radius:12px;padding:20px;border:1px solid #333;text-align:center}
    .balance-icon{font-size:2rem;margin-bottom:8px}
    .balance-value{font-size:2rem;font-weight:bold}
    .balance-label{font-size:13px;color:#888;margin-top:4px}
    .balance-detail{font-size:11px;color:#666;margin-top:8px}
    .balance-card.vacation .balance-value{color:#4ecdc4}
    .balance-card.sick .balance-value{color:#f38181}
    .balance-card.personal .balance-value{color:#ffe66d}
    .requests{display:flex;flex-direction:column;gap:12px}
    .request{background:#1a1a1a;border-radius:12px;padding:20px;border:1px solid #333;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
    .request-info h3{margin-bottom:4px;display:flex;align-items:center;gap:8px}
    .request-info p{color:#888;font-size:13px}
    .request-dates{text-align:right}
    .request-dates .days{font-size:1.5rem;font-weight:bold;color:#e94560}
    .request-dates .range{font-size:13px;color:#888}
    .badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500}
    .badge.pending{background:#4a3a00;color:#f90}
    .badge.approved{background:#1a3a1a;color:#4a4}
    .badge.rejected{background:#3a1a1a;color:#f44}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:#1a1a1a;border-radius:12px;padding:24px;width:90%;max-width:450px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:6px;color:#888;font-size:13px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#fff}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .section-title{font-size:1.1rem;margin:24px 0 16px;color:#888}
    .empty{text-align:center;padding:40px;color:#666}
    .calendar-preview{background:#0a0a0a;border-radius:8px;padding:16px;margin-top:16px}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
    .calendar-day{padding:8px 4px;border-radius:4px;font-size:12px}
    .calendar-day.header{color:#888;font-weight:600}
    .calendar-day.selected{background:#e94560;color:#fff}
    .calendar-day.today{border:1px solid #e94560}
  </style>
</head>
<body>
  <div class="header">
    <h1>🏖️ PTO Tracker</h1>
    <button class="primary" onclick="showRequest()">+ Request Time Off</button>
  </div>

  <div class="balances">
    <div class="balance-card vacation">
      <div class="balance-icon">🌴</div>
      <div class="balance-value" id="vacationBal">15</div>
      <div class="balance-label">Vacation Days</div>
      <div class="balance-detail">Used: <span id="vacationUsed">3</span> | Pending: <span id="vacationPending">0</span></div>
    </div>
    <div class="balance-card sick">
      <div class="balance-icon">🤒</div>
      <div class="balance-value" id="sickBal">10</div>
      <div class="balance-label">Sick Days</div>
      <div class="balance-detail">Used: <span id="sickUsed">1</span> | Pending: <span id="sickPending">0</span></div>
    </div>
    <div class="balance-card personal">
      <div class="balance-icon">🎯</div>
      <div class="balance-value" id="personalBal">3</div>
      <div class="balance-label">Personal Days</div>
      <div class="balance-detail">Used: <span id="personalUsed">0</span> | Pending: <span id="personalPending">0</span></div>
    </div>
  </div>

  <h2 class="section-title">Pending Requests</h2>
  <div class="requests" id="pendingList"></div>
  <div class="empty" id="pendingEmpty" style="display:none">No pending requests</div>

  <h2 class="section-title">Past Requests</h2>
  <div class="requests" id="pastList"></div>
  <div class="empty" id="pastEmpty" style="display:none">No past requests</div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>Request Time Off</h2>
      <div class="form-group">
        <label>Type</label>
        <select id="ptoType">
          <option value="vacation">🌴 Vacation</option>
          <option value="sick">🤒 Sick</option>
          <option value="personal">🎯 Personal</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Start Date</label><input type="date" id="startDate"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="endDate"></div>
      </div>
      <div class="form-group"><label>Days: <strong id="daysCount">0</strong></label></div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="Reason for time off..."></textarea>
      </div>
      <div class="btn-row">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="submitRequest()">Submit Request</button>
      </div>
    </div>
  </div>

  <script>
    let balances = JSON.parse(localStorage.getItem('kiss-pto-balances') || '{"vacation":15,"sick":10,"personal":3}');
    let requests = JSON.parse(localStorage.getItem('kiss-pto-requests') || '[]');

    function save() {
      localStorage.setItem('kiss-pto-balances', JSON.stringify(balances));
      localStorage.setItem('kiss-pto-requests', JSON.stringify(requests));
    }

    function getWorkingDays(start, end) {
      let count = 0;
      const current = new Date(start);
      const endDate = new Date(end);
      while (current <= endDate) {
        const day = current.getDay();
        if (day !== 0 && day !== 6) count++;
        current.setDate(current.getDate() + 1);
      }
      return count;
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function getTypeIcon(type) {
      return type === 'vacation' ? '🌴' : type === 'sick' ? '🤒' : '🎯';
    }

    function getTypeName(type) {
      return type.charAt(0).toUpperCase() + type.slice(1);
    }

    function render() {
      // Calculate used and pending by type
      const used = { vacation: 0, sick: 0, personal: 0 };
      const pending = { vacation: 0, sick: 0, personal: 0 };

      requests.forEach(r => {
        const days = getWorkingDays(r.startDate, r.endDate);
        if (r.status === 'approved') {
          used[r.type] += days;
        } else if (r.status === 'pending') {
          pending[r.type] += days;
        }
      });

      // Update balance cards
      ['vacation', 'sick', 'personal'].forEach(type => {
        const total = balances[type];
        const remaining = total - used[type];
        document.getElementById(`${type}Bal`).textContent = remaining;
        document.getElementById(`${type}Used`).textContent = used[type];
        document.getElementById(`${type}Pending`).textContent = pending[type];
      });

      // Render pending requests
      const pendingReqs = requests.filter(r => r.status === 'pending');
      const pastReqs = requests.filter(r => r.status !== 'pending');

      const pendingList = document.getElementById('pendingList');
      const pendingEmpty = document.getElementById('pendingEmpty');

      if (pendingReqs.length === 0) {
        pendingList.innerHTML = '';
        pendingEmpty.style.display = 'block';
      } else {
        pendingEmpty.style.display = 'none';
        pendingList.innerHTML = pendingReqs.map(r => `
          <div class="request">
            <div class="request-info">
              <h3>${getTypeIcon(r.type)} ${getTypeName(r.type)} <span class="badge pending">Pending</span></h3>
              <p>${r.notes || 'No notes'}</p>
            </div>
            <div class="request-dates">
              <div class="days">${getWorkingDays(r.startDate, r.endDate)} days</div>
              <div class="range">${formatDate(r.startDate)} - ${formatDate(r.endDate)}</div>
            </div>
            <div>
              <button onclick="cancelRequest('${r.id}')">Cancel</button>
            </div>
          </div>
        `).join('');
      }

      // Render past requests
      const pastList = document.getElementById('pastList');
      const pastEmpty = document.getElementById('pastEmpty');

      if (pastReqs.length === 0) {
        pastList.innerHTML = '';
        pastEmpty.style.display = 'block';
      } else {
        pastEmpty.style.display = 'none';
        pastList.innerHTML = pastReqs.slice(0, 10).map(r => `
          <div class="request">
            <div class="request-info">
              <h3>${getTypeIcon(r.type)} ${getTypeName(r.type)}
                <span class="badge ${r.status}">${r.status.charAt(0).toUpperCase() + r.status.slice(1)}</span>
              </h3>
              <p>${r.notes || 'No notes'}</p>
            </div>
            <div class="request-dates">
              <div class="days">${getWorkingDays(r.startDate, r.endDate)} days</div>
              <div class="range">${formatDate(r.startDate)} - ${formatDate(r.endDate)}</div>
            </div>
          </div>
        `).join('');
      }
    }

    function showRequest() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
      document.getElementById('notes').value = '';
      document.getElementById('ptoType').value = 'vacation';
      updateDaysCount();
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function updateDaysCount() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (start && end) {
        const days = getWorkingDays(start, end);
        document.getElementById('daysCount').textContent = days;
      }
    }

    function submitRequest() {
      const type = document.getElementById('ptoType').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const notes = document.getElementById('notes').value.trim();

      if (!startDate || !endDate) {
        alert('Please select dates');
        return;
      }

      if (new Date(endDate) < new Date(startDate)) {
        alert('End date must be after start date');
        return;
      }

      const days = getWorkingDays(startDate, endDate);

      // Check balance
      const used = requests.filter(r => r.type === type && (r.status === 'approved' || r.status === 'pending'))
        .reduce((sum, r) => sum + getWorkingDays(r.startDate, r.endDate), 0);

      if (used + days > balances[type]) {
        alert(`Insufficient ${type} balance. Available: ${balances[type] - used} days`);
        return;
      }

      requests.unshift({
        id: Date.now().toString(),
        type,
        startDate,
        endDate,
        notes,
        status: 'pending',
        createdAt: new Date().toISOString()
      });

      // Auto-approve for demo purposes (in real app, would go to manager)
      setTimeout(() => {
        const req = requests.find(r => r.id === requests[0].id);
        if (req && req.status === 'pending') {
          req.status = 'approved';
          save();
          render();
        }
      }, 3000);

      save();
      closeModal();
      render();
    }

    function cancelRequest(id) {
      if (confirm('Cancel this request?')) {
        requests = requests.filter(r => r.id !== id);
        save();
        render();
      }
    }

    document.getElementById('startDate').addEventListener('change', updateDaysCount);
    document.getElementById('endDate').addEventListener('change', updateDaysCount);

    render();
  </script>
</body>
</html>
