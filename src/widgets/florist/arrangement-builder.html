<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrangement Builder - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"arrangement-builder","name":"Arrangement Builder","icon":"💐","desc":"Design floral arrangements","category":"florist","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.container{display:grid;grid-template-columns:1fr 300px;gap:20px}
.main{display:flex;flex-direction:column;gap:15px}
.sidebar{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.section{margin-bottom:20px}
.section-title{font-weight:600;margin-bottom:10px;color:#888;font-size:.875rem}
.flowers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flower{background:#252525;padding:15px;border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent}
.flower:hover{border-color:#f472b6}
.flower.selected{border-color:#f472b6;background:#f472b620}
.flower-icon{font-size:1.5rem;margin-bottom:5px}
.flower-name{font-size:.75rem;color:#888}
.flower-price{font-size:.75rem;color:#f472b6}
.preview{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:40px;text-align:center;font-size:4rem}
.summary-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}
.total{font-size:1.25rem;font-weight:bold;color:#f472b6;padding:15px 0}
.btn{width:100%;padding:12px;border:none;border-radius:6px;cursor:pointer;background:#f472b6;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>💐 Arrangement Builder</h1></div>
<div class="container">
<div class="main">
<div class="preview">🌸🌷🌹</div>
<div class="section">
<div class="section-title">Select Flowers</div>
<div class="flowers" id="flowers"></div>
</div>
</div>
<div class="sidebar">
<div class="section-title">Your Arrangement</div>
<div id="summary">
<div class="summary-item"><span>Roses x 6</span><span>$18.00</span></div>
<div class="summary-item"><span>Tulips x 4</span><span>$10.00</span></div>
<div class="summary-item"><span>Greenery</span><span>$5.00</span></div>
<div class="summary-item"><span>Vase</span><span>$12.00</span></div>
</div>
<div class="total">Total: $45.00</div>
<button class="btn" onclick="alert('Order')">Add to Order</button>
</div>
</div>
<script>
const flowers=[
{icon:'🌹',name:'Roses',price:3},
{icon:'🌷',name:'Tulips',price:2.5},
{icon:'🌸',name:'Cherry Blossom',price:4},
{icon:'🌻',name:'Sunflowers',price:3.5},
{icon:'🌺',name:'Hibiscus',price:2},
{icon:'💮',name:'White Rose',price:3},
{icon:'🌼',name:'Daisies',price:1.5},
{icon:'🪻',name:'Lavender',price:2},
{icon:'🌾',name:'Greenery',price:1}
];
document.getElementById('flowers').innerHTML=flowers.map((f,i)=>`
<div class="flower ${i<3?'selected':''}" onclick="this.classList.toggle('selected')">
<div class="flower-icon">${f.icon}</div>
<div class="flower-name">${f.name}</div>
<div class="flower-price">$${f.price.toFixed(2)}</div>
</div>`).join('');
</script>
</body>
</html>
