<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rickshaw Bookings - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"booking-system","name":"Booking System","icon":"🛺","desc":"Rickshaw ride booking","category":"rickshaw","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#ea580c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;text-align:center}
.stat-value{font-size:1.75rem;font-weight:bold;color:#ea580c}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.bookings{display:flex;flex-direction:column;gap:15px}
.booking{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.booking-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}
.booking-id{font-size:1.125rem;font-weight:bold}
.booking-type{font-size:.75rem;color:#ea580c}
.booking-status{padding:4px 10px;border-radius:4px;font-size:.7rem}
.status-active{background:#ea580c33;color:#ea580c;animation:pulse 2s infinite}
.status-scheduled{background:#2563eb33;color:#2563eb}
.status-completed{background:#15803d33;color:#15803d}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.booking-info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.info{background:#252525;padding:10px;border-radius:6px;text-align:center}
.info-value{font-size:.9rem;font-weight:bold}
.info-label{font-size:.6rem;color:#888}
</style>
</head>
<body>
<div class="header"><h1>🛺 Bookings</h1><button class="btn">New Ride</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">34</div><div class="stat-label">TODAY'S RIDES</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">ACTIVE NOW</div></div>
<div class="stat"><div class="stat-value">8</div><div class="stat-label">SCHEDULED</div></div>
<div class="stat"><div class="stat-value">$680</div><div class="stat-label">TODAY'S REVENUE</div></div>
</div>
<div class="bookings" id="bookings"></div>
<script>
const bookings=[
{id:'RK-1247',type:'City Tour',status:'active',passenger:'Tourist Group (4)',pickup:'Central Station',dropoff:'Old City Loop',driver:'Rajan Kumar',fare:'$45',eta:'35 min remaining'},
{id:'RK-1248',type:'Point to Point',status:'active',passenger:'Mr. Thompson',pickup:'Hotel Maharaja',dropoff:'Spice Market',driver:'Amit Singh',fare:'$12',eta:'8 min remaining'},
{id:'RK-1249',type:'Heritage Tour',status:'scheduled',passenger:'Chen Family (3)',pickup:'Heritage Hotel',dropoff:'Temple Circuit',driver:'Vikram Das',fare:'$65',eta:'Starts 2:00 PM'},
{id:'RK-1250',type:'Night Tour',status:'scheduled',passenger:'Evening Group (6)',pickup:'City Center',dropoff:'Night Market',driver:'Assigned',fare:'$80',eta:'Starts 7:00 PM'},
{id:'RK-1246',type:'Shopping Tour',status:'completed',passenger:'Ms. Garcia',pickup:'Hotel Plaza',dropoff:'Bazaar District',driver:'Suresh Patel',fare:'$28',eta:'Completed 11:30 AM'}
];
document.getElementById('bookings').innerHTML=bookings.map(b=>`
<div class="booking">
<div class="booking-header">
<div>
<div class="booking-id">${b.id}</div>
<div class="booking-type">${b.type}</div>
</div>
<span class="booking-status status-${b.status}">${b.status.toUpperCase()}</span>
</div>
<div class="booking-info">
<div class="info"><div class="info-value">${b.passenger}</div><div class="info-label">PASSENGER</div></div>
<div class="info"><div class="info-value">${b.pickup} → ${b.dropoff}</div><div class="info-label">ROUTE</div></div>
<div class="info"><div class="info-value">${b.fare}</div><div class="info-label">FARE</div></div>
<div class="info"><div class="info-value">${b.eta}</div><div class="info-label">STATUS</div></div>
</div>
</div>`).join('');
</script>
</body>
</html>
