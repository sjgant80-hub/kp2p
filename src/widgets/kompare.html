<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompare - Diff & Compare Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; min-height: 100vh; color: #c9d1d9; }

        .header { background: rgba(0,0,0,0.4); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #30363d; }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #22c55e, #10b981); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .logo-text { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #22c55e, #4ade80); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .toolbar { display: flex; gap: 0.5rem; align-items: center; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s; font-size: 0.85rem; }
        .btn-primary { background: #22c55e; color: #000; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn:hover { opacity: 0.9; }

        .mode-toggle { display: flex; background: #21262d; border-radius: 6px; padding: 2px; border: 1px solid #30363d; }
        .mode-btn { padding: 0.4rem 0.75rem; border: none; background: transparent; color: #8b949e; cursor: pointer; font-size: 0.8rem; border-radius: 4px; }
        .mode-btn.active { background: #30363d; color: #fff; }

        .main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 60px); }
        .main.unified { grid-template-columns: 1fr; }

        .panel { display: flex; flex-direction: column; border-right: 1px solid #30363d; }
        .panel:last-child { border-right: none; }

        .panel-header { padding: 0.5rem 1rem; background: rgba(0,0,0,0.3); border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
        .panel-title { font-weight: 600; font-size: 0.9rem; }
        .panel-actions { display: flex; gap: 0.5rem; }

        .editor-container { flex: 1; position: relative; overflow: hidden; }
        .line-numbers { position: absolute; left: 0; top: 0; bottom: 0; width: 50px; background: rgba(0,0,0,0.3); padding: 1rem 0.5rem; font-family: monospace; font-size: 0.85rem; line-height: 1.5; text-align: right; color: #484f58; user-select: none; overflow: hidden; }
        .editor { width: 100%; height: 100%; background: transparent; border: none; padding: 1rem; padding-left: 60px; font-family: 'Fira Code', monospace; font-size: 0.85rem; color: #c9d1d9; resize: none; line-height: 1.5; }
        .editor:focus { outline: none; }

        .diff-container { flex: 1; overflow: auto; font-family: 'Fira Code', monospace; font-size: 0.85rem; line-height: 1.5; }
        .diff-line { display: flex; padding: 0 1rem; min-height: 1.5em; }
        .diff-line.added { background: rgba(46, 160, 67, 0.15); }
        .diff-line.removed { background: rgba(248, 81, 73, 0.15); }
        .diff-line.changed { background: rgba(210, 153, 34, 0.1); }
        .diff-gutter { width: 50px; text-align: right; padding-right: 1rem; color: #484f58; user-select: none; flex-shrink: 0; }
        .diff-gutter.added { color: #3fb950; }
        .diff-gutter.removed { color: #f85149; }
        .diff-content { flex: 1; white-space: pre-wrap; word-break: break-all; }
        .diff-content .added-text { background: rgba(46, 160, 67, 0.4); }
        .diff-content .removed-text { background: rgba(248, 81, 73, 0.4); }

        .stats { padding: 0.5rem 1rem; background: rgba(0,0,0,0.2); border-top: 1px solid #30363d; font-size: 0.8rem; color: #8b949e; display: flex; gap: 1.5rem; }
        .stat { display: flex; align-items: center; gap: 0.35rem; }
        .stat-added { color: #3fb950; }
        .stat-removed { color: #f85149; }
        .stat-changed { color: #d29922; }

        .unified-view { display: none; }
        .main.unified .split-view { display: none; }
        .main.unified .unified-view { display: flex; flex-direction: column; }

        .file-drop { border: 2px dashed #30363d; border-radius: 8px; padding: 2rem; text-align: center; color: #8b949e; margin: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .file-drop:hover, .file-drop.dragover { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }

        .char-diff { display: inline; }
        .char-add { background: rgba(46, 160, 67, 0.5); color: #3fb950; }
        .char-del { background: rgba(248, 81, 73, 0.5); color: #f85149; text-decoration: line-through; }

        @media (max-width: 800px) { .main { grid-template-columns: 1fr; } .panel:first-child { border-bottom: 1px solid #30363d; border-right: none; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">K</div>
            <span class="logo-text">Kompare</span>
        </div>
        <div class="toolbar">
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('split')">Split</button>
                <button class="mode-btn" onclick="setMode('unified')">Unified</button>
                <button class="mode-btn" onclick="setMode('inline')">Inline</button>
            </div>
            <button class="btn btn-secondary" onclick="swapPanels()">Swap</button>
            <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
            <button class="btn btn-primary" onclick="compare()">Compare</button>
        </div>
    </header>

    <div class="main" id="main">
        <div class="panel split-view">
            <div class="panel-header">
                <span class="panel-title">Original</span>
                <div class="panel-actions">
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="loadFile('left')">Load File</button>
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="pasteClipboard('left')">Paste</button>
                </div>
            </div>
            <div class="editor-container">
                <div class="line-numbers" id="lines-left">1</div>
                <textarea class="editor" id="editor-left" placeholder="Paste or type original text here..." oninput="updateLineNumbers('left')"></textarea>
            </div>
        </div>

        <div class="panel split-view">
            <div class="panel-header">
                <span class="panel-title">Modified</span>
                <div class="panel-actions">
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="loadFile('right')">Load File</button>
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="pasteClipboard('right')">Paste</button>
                </div>
            </div>
            <div class="editor-container">
                <div class="line-numbers" id="lines-right">1</div>
                <textarea class="editor" id="editor-right" placeholder="Paste or type modified text here..." oninput="updateLineNumbers('right')"></textarea>
            </div>
        </div>

        <div class="panel unified-view" style="grid-column: 1 / -1;">
            <div class="panel-header">
                <span class="panel-title">Diff Result</span>
                <div class="panel-actions">
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="copyDiff()">Copy Diff</button>
                    <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="downloadDiff()">Download</button>
                </div>
            </div>
            <div class="diff-container" id="diff-output"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        let mode = 'split';
        let diffResult = [];

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const main = document.getElementById('main');
            main.classList.toggle('unified', newMode !== 'split');

            if (newMode !== 'split') {
                compare();
            }
        }

        function updateLineNumbers(side) {
            const editor = document.getElementById('editor-' + side);
            const lines = document.getElementById('lines-' + side);
            const count = editor.value.split('\n').length;
            lines.innerHTML = Array.from({ length: count }, (_, i) => i + 1).join('<br>');
        }

        function compare() {
            const left = document.getElementById('editor-left').value;
            const right = document.getElementById('editor-right').value;

            diffResult = computeDiff(left.split('\n'), right.split('\n'));
            renderDiff();
        }

        function computeDiff(oldLines, newLines) {
            const result = [];
            const lcs = longestCommonSubsequence(oldLines, newLines);

            let oldIdx = 0, newIdx = 0, lcsIdx = 0;

            while (oldIdx < oldLines.length || newIdx < newLines.length) {
                if (lcsIdx < lcs.length && oldIdx < oldLines.length && newIdx < newLines.length &&
                    oldLines[oldIdx] === lcs[lcsIdx] && newLines[newIdx] === lcs[lcsIdx]) {
                    result.push({ type: 'unchanged', oldLine: oldIdx + 1, newLine: newIdx + 1, content: oldLines[oldIdx] });
                    oldIdx++; newIdx++; lcsIdx++;
                } else if (newIdx < newLines.length && (lcsIdx >= lcs.length || newLines[newIdx] !== lcs[lcsIdx])) {
                    result.push({ type: 'added', newLine: newIdx + 1, content: newLines[newIdx] });
                    newIdx++;
                } else if (oldIdx < oldLines.length && (lcsIdx >= lcs.length || oldLines[oldIdx] !== lcs[lcsIdx])) {
                    result.push({ type: 'removed', oldLine: oldIdx + 1, content: oldLines[oldIdx] });
                    oldIdx++;
                }
            }

            return result;
        }

        function longestCommonSubsequence(a, b) {
            const m = a.length, n = b.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (a[i-1] === b[j-1]) {
                        dp[i][j] = dp[i-1][j-1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
                    }
                }
            }

            const result = [];
            let i = m, j = n;
            while (i > 0 && j > 0) {
                if (a[i-1] === b[j-1]) {
                    result.unshift(a[i-1]);
                    i--; j--;
                } else if (dp[i-1][j] > dp[i][j-1]) {
                    i--;
                } else {
                    j--;
                }
            }

            return result;
        }

        function renderDiff() {
            const output = document.getElementById('diff-output');
            let html = '';

            let added = 0, removed = 0, unchanged = 0;

            if (mode === 'inline') {
                // Inline character-level diff
                const left = document.getElementById('editor-left').value;
                const right = document.getElementById('editor-right').value;
                html = renderInlineDiff(left, right);
            } else {
                // Line-by-line diff
                diffResult.forEach(line => {
                    const gutterClass = line.type === 'added' ? 'added' : line.type === 'removed' ? 'removed' : '';
                    const lineClass = line.type;
                    const lineNum = line.type === 'removed' ? line.oldLine : (line.newLine || line.oldLine);
                    const prefix = line.type === 'added' ? '+' : line.type === 'removed' ? '-' : ' ';

                    html += `<div class="diff-line ${lineClass}">
                        <span class="diff-gutter ${gutterClass}">${lineNum}</span>
                        <span class="diff-content">${prefix} ${escapeHtml(line.content)}</span>
                    </div>`;

                    if (line.type === 'added') added++;
                    else if (line.type === 'removed') removed++;
                    else unchanged++;
                });
            }

            output.innerHTML = html || '<div style="padding:2rem;text-align:center;color:#8b949e;">No differences or no text to compare</div>';

            document.getElementById('stats').innerHTML = `
                <span class="stat stat-added">+${added} added</span>
                <span class="stat stat-removed">-${removed} removed</span>
                <span class="stat">${unchanged} unchanged</span>
                <span class="stat">${diffResult.length} total lines</span>
            `;
        }

        function renderInlineDiff(oldText, newText) {
            // Character-level diff using simple algorithm
            const oldChars = oldText.split('');
            const newChars = newText.split('');

            let html = '<div class="diff-line"><span class="diff-content">';
            let i = 0, j = 0;

            // Simple character diff - not optimal but works
            while (i < oldChars.length || j < newChars.length) {
                if (i < oldChars.length && j < newChars.length && oldChars[i] === newChars[j]) {
                    html += escapeHtml(oldChars[i]);
                    i++; j++;
                } else if (j < newChars.length && (i >= oldChars.length || newChars[j] !== oldChars[i])) {
                    html += `<span class="char-add">${escapeHtml(newChars[j])}</span>`;
                    j++;
                } else if (i < oldChars.length) {
                    html += `<span class="char-del">${escapeHtml(oldChars[i])}</span>`;
                    i++;
                }
            }

            html += '</span></div>';
            return html;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        }

        function swapPanels() {
            const left = document.getElementById('editor-left');
            const right = document.getElementById('editor-right');
            [left.value, right.value] = [right.value, left.value];
            updateLineNumbers('left');
            updateLineNumbers('right');
            if (mode !== 'split') compare();
        }

        function clearAll() {
            document.getElementById('editor-left').value = '';
            document.getElementById('editor-right').value = '';
            document.getElementById('diff-output').innerHTML = '';
            document.getElementById('stats').innerHTML = '';
            updateLineNumbers('left');
            updateLineNumbers('right');
        }

        function loadFile(side) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt,.js,.ts,.py,.json,.html,.css,.md,.yml,.yaml,.xml,.csv';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const text = await file.text();
                document.getElementById('editor-' + side).value = text;
                updateLineNumbers(side);
            };
            input.click();
        }

        async function pasteClipboard(side) {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('editor-' + side).value = text;
                updateLineNumbers(side);
            } catch (err) {
                alert('Unable to read clipboard');
            }
        }

        function copyDiff() {
            const text = diffResult.map(l => {
                const prefix = l.type === 'added' ? '+' : l.type === 'removed' ? '-' : ' ';
                return prefix + ' ' + l.content;
            }).join('\n');
            navigator.clipboard.writeText(text);
        }

        function downloadDiff() {
            const text = diffResult.map(l => {
                const prefix = l.type === 'added' ? '+' : l.type === 'removed' ? '-' : ' ';
                return prefix + ' ' + l.content;
            }).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'diff.patch';
            a.click();
        }

        // Init
        updateLineNumbers('left');
        updateLineNumbers('right');
    </script>
</body>
</html>
