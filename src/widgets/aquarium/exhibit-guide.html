<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exhibit Guide - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"exhibit-guide","name":"Aquarium Guide","icon":"🐠","desc":"Explore aquarium exhibits","category":"aquarium","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#0891b2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.exhibits{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.exhibit{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.exhibit-banner{padding:40px;background:linear-gradient(135deg,#0891b2 0%,#0e7490 100%);text-align:center}
.exhibit-icon{font-size:4rem;margin-bottom:10px}
.exhibit-name{font-size:1.5rem;font-weight:bold}
.exhibit-body{padding:20px}
.exhibit-desc{font-size:.875rem;color:#888;margin-bottom:15px;line-height:1.5}
.exhibit-species{margin-bottom:15px}
.species-title{font-size:.75rem;color:#888;margin-bottom:8px}
.species-list{display:flex;flex-wrap:wrap;gap:6px}
.species{padding:4px 10px;background:#252525;border-radius:4px;font-size:.75rem}
.exhibit-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.875rem;padding-top:15px;border-top:1px solid #333}
.info-item{display:flex;align-items:center;gap:8px}
.info-label{color:#888}
</style>
</head>
<body>
<div class="header"><h1>🐠 Exhibit Guide</h1><button class="btn">Map View</button></div>
<div class="exhibits" id="exhibits"></div>
<script>
const exhibits=[
{name:'Tropical Reef',icon:'🐠',desc:'Dive into a vibrant underwater world filled with colorful coral reefs and exotic fish from the Pacific and Caribbean.',species:['Clownfish','Blue Tang','Angelfish','Parrotfish','Moorish Idol'],location:'Building A',feeding:'10 AM, 3 PM'},
{name:'Shark Bay',icon:'🦈',desc:'Get face-to-face with magnificent sharks in our 750,000 gallon ocean tank through our underwater tunnel.',species:['Sand Tiger Shark','Nurse Shark','Blacktip Reef Shark','Zebra Shark'],location:'Building B',feeding:'11 AM, 4 PM'},
{name:'Penguin Colony',icon:'🐧',desc:'Watch playful penguins waddle, swim, and dive in our climate-controlled Antarctic habitat.',species:['African Penguin','Gentoo Penguin','Rockhopper Penguin'],location:'Building C',feeding:'9:30 AM, 2:30 PM'},
{name:'Jellyfish Gallery',icon:'🪼',desc:'Marvel at the mesmerizing beauty of jellyfish illuminated with color-changing lights.',species:['Moon Jelly','Sea Nettle','Blue Blubber','Lions Mane'],location:'Building A',feeding:'N/A'},
{name:'Touch Pool',icon:'🦀',desc:'Get hands-on experience with sea stars, hermit crabs, and other tide pool creatures.',species:['Sea Star','Hermit Crab','Sea Urchin','Anemone'],location:'Building D',feeding:'Interactive'},
{name:'Amazon River',icon:'🐟',desc:'Journey through the mysterious freshwater world of the Amazon with piranhas and giant catfish.',species:['Piranha','Arapaima','Electric Eel','Peacock Bass'],location:'Building B',feeding:'1 PM'}
];
document.getElementById('exhibits').innerHTML=exhibits.map(e=>`
<div class="exhibit">
<div class="exhibit-banner"><div class="exhibit-icon">${e.icon}</div><div class="exhibit-name">${e.name}</div></div>
<div class="exhibit-body">
<div class="exhibit-desc">${e.desc}</div>
<div class="exhibit-species">
<div class="species-title">FEATURED SPECIES</div>
<div class="species-list">${e.species.map(s=>`<span class="species">${s}</span>`).join('')}</div>
</div>
<div class="exhibit-info">
<div class="info-item"><span class="info-label">📍</span>${e.location}</div>
<div class="info-item"><span class="info-label">🍽️</span>${e.feeding}</div>
</div>
</div>
</div>`).join('');
</script>
</body>
</html>
