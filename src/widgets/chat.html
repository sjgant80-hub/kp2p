<!DOCTYPE html>
<!--
KONOMI CHAT - Free Stream/SendBird Killer
Drop this anywhere. Works on GitHub Pages. $0 forever.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Konomi Chat</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --primary: #6366f1;
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #333;
      --text: #fff;
      --text-muted: #888;
    }

    .konomi-chat {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h1 {
      font-size: 16px;
      flex: 1;
    }

    .peer-count {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .peer-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.mine {
      align-self: flex-end;
      background: var(--primary);
      border-bottom-right-radius: 4px;
    }

    .message.theirs {
      align-self: flex-start;
      background: var(--surface);
      border-bottom-left-radius: 4px;
    }

    .message-header {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .message.mine .message-header {
      color: rgba(255,255,255,0.7);
    }

    .user-emoji {
      font-size: 14px;
    }

    .message-text {
      word-break: break-word;
    }

    .typing-indicator {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    .input-area {
      padding: 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .input-area input:focus {
      border-color: var(--primary);
    }

    .input-area button {
      padding: 12px 24px;
      background: var(--primary);
      border: none;
      border-radius: 24px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .input-area button:hover {
      opacity: 0.9;
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* System messages */
    .system-message {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 8px;
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="konomi-chat" id="app">
    <div class="chat-header">
      <h1 id="room-name">Chat Room</h1>
      <div class="peer-count">
        <span class="peer-dot"></span>
        <span id="peer-count">1 online</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">💬</div>
        <div>No messages yet</div>
        <div style="font-size:11px">Be the first to say something!</div>
      </div>
    </div>

    <div class="typing-indicator" id="typing" style="display:none"></div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <script type="module">
    // =========================================================================
    // KONOMI CHAT - Zero-cost chat infrastructure
    // =========================================================================

    // Config from URL params or defaults
    const params = new URLSearchParams(location.search);
    const ROOM_ID = params.get('room') || 'konomi-chat-default';
    const USER_NAME = params.get('name') || 'Anonymous';
    const EMOJIS = ['😀','😎','🤖','👻','🐱','🦊','🐸','🐙','🌟','🔥','💎','🎮'];

    // State
    let myId = null;
    let myEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    let messages = [];
    let peers = new Map();
    let typingUsers = new Set();
    let channel = null;

    // DOM
    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('empty-state');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const peerCountEl = document.getElementById('peer-count');
    const typingEl = document.getElementById('typing');
    const roomNameEl = document.getElementById('room-name');

    // Set room name
    roomNameEl.textContent = ROOM_ID === 'konomi-chat-default' ? 'Chat Room' : ROOM_ID;

    // =========================================================================
    // P2P Layer (BroadcastChannel for same-origin, can upgrade to libp2p)
    // =========================================================================

    function initP2P() {
      myId = crypto.randomUUID();
      channel = new BroadcastChannel(`konomi-chat:${ROOM_ID}`);

      channel.onmessage = (e) => {
        const msg = e.data;

        switch (msg.type) {
          case 'chat':
            addMessage(msg);
            break;
          case 'join':
            peers.set(msg.userId, { name: msg.name, emoji: msg.emoji });
            updatePeerCount();
            addSystemMessage(`${msg.emoji} ${msg.name} joined`);
            // Send our presence back
            channel.postMessage({ type: 'presence', userId: myId, name: USER_NAME, emoji: myEmoji });
            break;
          case 'presence':
            if (!peers.has(msg.userId)) {
              peers.set(msg.userId, { name: msg.name, emoji: msg.emoji });
              updatePeerCount();
            }
            break;
          case 'leave':
            const peer = peers.get(msg.userId);
            if (peer) {
              addSystemMessage(`${peer.emoji} ${peer.name} left`);
              peers.delete(msg.userId);
              updatePeerCount();
            }
            break;
          case 'typing':
            if (msg.userId !== myId) {
              if (msg.isTyping) {
                typingUsers.add(msg.name);
              } else {
                typingUsers.delete(msg.name);
              }
              updateTyping();
            }
            break;
        }
      };

      // Announce join
      channel.postMessage({ type: 'join', userId: myId, name: USER_NAME, emoji: myEmoji });

      // Handle page close
      window.addEventListener('beforeunload', () => {
        channel.postMessage({ type: 'leave', userId: myId });
      });

      // Count self
      peers.set(myId, { name: USER_NAME, emoji: myEmoji });
      updatePeerCount();
    }

    // =========================================================================
    // Chat Functions
    // =========================================================================

    function sendMessage(text) {
      if (!text.trim()) return;

      const msg = {
        type: 'chat',
        id: crypto.randomUUID(),
        userId: myId,
        name: USER_NAME,
        emoji: myEmoji,
        text: text.trim(),
        timestamp: Date.now()
      };

      // Add locally
      addMessage(msg);

      // Broadcast
      channel.postMessage(msg);

      // Clear input
      inputEl.value = '';

      // Stop typing indicator
      channel.postMessage({ type: 'typing', userId: myId, name: USER_NAME, isTyping: false });
    }

    function addMessage(msg) {
      messages.push(msg);
      renderMessage(msg);
      emptyState.style.display = 'none';
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessage(msg) {
      const isMine = msg.userId === myId;

      const div = document.createElement('div');
      div.className = `message ${isMine ? 'mine' : 'theirs'}`;
      div.innerHTML = `
        <div class="message-header">
          <span class="user-emoji">${msg.emoji}</span>
          <span>${isMine ? 'You' : msg.name}</span>
        </div>
        <div class="message-text">${escapeHtml(msg.text)}</div>
      `;

      messagesEl.appendChild(div);
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'system-message';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updatePeerCount() {
      const count = peers.size;
      peerCountEl.textContent = `${count} online`;
    }

    function updateTyping() {
      if (typingUsers.size === 0) {
        typingEl.style.display = 'none';
      } else {
        const names = [...typingUsers];
        if (names.length === 1) {
          typingEl.textContent = `${names[0]} is typing...`;
        } else if (names.length === 2) {
          typingEl.textContent = `${names[0]} and ${names[1]} are typing...`;
        } else {
          typingEl.textContent = `${names.length} people are typing...`;
        }
        typingEl.style.display = 'block';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =========================================================================
    // Event Handlers
    // =========================================================================

    sendBtn.addEventListener('click', () => sendMessage(inputEl.value));

    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage(inputEl.value);
      }
    });

    let typingTimeout;
    inputEl.addEventListener('input', () => {
      channel.postMessage({ type: 'typing', userId: myId, name: USER_NAME, isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        channel.postMessage({ type: 'typing', userId: myId, name: USER_NAME, isTyping: false });
      }, 2000);
    });

    // =========================================================================
    // Init
    // =========================================================================

    initP2P();
    inputEl.focus();

    // Export for embedding
    window.KonomiChat = {
      sendMessage,
      getMessages: () => messages,
      getPeers: () => [...peers.values()],
      setRoom: (room) => location.search = `?room=${room}`
    };
  </script>
</body>
</html>
