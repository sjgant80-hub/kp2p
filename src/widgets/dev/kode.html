<!DOCTYPE html>
<script type="application/json" id="widget-meta">
{
    "id": "kode",
    "name": "KODE",
    "icon": "💻",
    "desc": "Multi-Language Playground",
    "body": "Browser-based code playground supporting JavaScript, Python, and more. Syntax highlighting, live preview, and console output.",
    "kills": ["CodePen Pro $12/mo", "JSFiddle $0", "Replit Core $20/mo"],
    "price": 500,
    "color": "#007acc",
    "badge": "NEW"
}
</script>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kode - Code Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1e1e1e; min-height: 100vh; color: #d4d4d4; }

        .header { background: #252526; padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3c3c3c; }
        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #007acc, #0098ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .logo-text { font-size: 1rem; font-weight: 600; color: #fff; }

        .toolbar { display: flex; gap: 0.5rem; align-items: center; }
        .lang-select { padding: 0.4rem 0.75rem; background: #3c3c3c; border: 1px solid #4c4c4c; border-radius: 4px; color: #d4d4d4; font-size: 0.8rem; }
        .btn { padding: 0.4rem 0.75rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; gap: 0.35rem; }
        .btn-run { background: #0e639c; color: white; }
        .btn-run:hover { background: #1177bb; }
        .btn-secondary { background: #3c3c3c; color: #d4d4d4; }
        .btn-secondary:hover { background: #4c4c4c; }

        .main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 45px); }
        .main.vertical { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }

        .editor-panel { display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; }
        .output-panel { display: flex; flex-direction: column; background: #1e1e1e; }

        .panel-header { padding: 0.4rem 0.75rem; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; }
        .panel-title { color: #969696; display: flex; align-items: center; gap: 0.5rem; }
        .panel-actions { display: flex; gap: 0.35rem; }

        .editor-container { flex: 1; position: relative; }
        .code-editor { width: 100%; height: 100%; background: #1e1e1e; border: none; padding: 1rem; padding-left: 50px; font-family: 'Fira Code', 'Consolas', monospace; font-size: 14px; color: #d4d4d4; resize: none; line-height: 1.5; tab-size: 2; }
        .code-editor:focus { outline: none; }

        .line-numbers { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: #1e1e1e; padding: 1rem 0.5rem; font-family: monospace; font-size: 14px; line-height: 1.5; text-align: right; color: #858585; user-select: none; border-right: 1px solid #3c3c3c; }

        .output-container { flex: 1; overflow: auto; }
        .output-content { padding: 1rem; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
        .output-content.error { color: #f14c4c; }
        .output-content.success { color: #89d185; }

        .console-output { background: #0d0d0d; min-height: 100%; }
        .console-line { padding: 0.25rem 0; border-bottom: 1px solid #2d2d2d; }
        .console-line.log { color: #d4d4d4; }
        .console-line.error { color: #f14c4c; }
        .console-line.warn { color: #cca700; }
        .console-line.info { color: #3794ff; }

        .html-preview { background: white; width: 100%; height: 100%; border: none; }

        .tabs { display: flex; background: #252526; }
        .tab { padding: 0.5rem 1rem; background: transparent; border: none; color: #969696; cursor: pointer; font-size: 0.8rem; border-bottom: 2px solid transparent; }
        .tab.active { color: #fff; border-bottom-color: #007acc; background: #1e1e1e; }
        .tab:hover:not(.active) { color: #d4d4d4; }

        .tab-content { display: none; flex: 1; overflow: hidden; }
        .tab-content.active { display: flex; flex-direction: column; }

        .status-bar { padding: 0.25rem 0.75rem; background: #007acc; font-size: 0.7rem; color: white; display: flex; justify-content: space-between; }

        .template-dropdown { position: relative; }
        .template-menu { position: absolute; top: 100%; right: 0; background: #252526; border: 1px solid #3c3c3c; border-radius: 4px; min-width: 200px; z-index: 100; display: none; }
        .template-menu.open { display: block; }
        .template-item { padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.8rem; }
        .template-item:hover { background: #3c3c3c; }

        .file-tabs { display: flex; background: #252526; border-bottom: 1px solid #3c3c3c; overflow-x: auto; }
        .file-tab { padding: 0.4rem 0.75rem; background: transparent; border: none; color: #969696; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 0.35rem; border-right: 1px solid #3c3c3c; white-space: nowrap; }
        .file-tab.active { background: #1e1e1e; color: #fff; }
        .file-tab-close { font-size: 0.7rem; padding: 0.1rem 0.2rem; border-radius: 2px; }
        .file-tab-close:hover { background: rgba(255,255,255,0.1); }

        .split-handle { width: 4px; background: #3c3c3c; cursor: col-resize; }
        .split-handle:hover { background: #007acc; }

        @media (max-width: 800px) { .main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">K</div>
            <span class="logo-text">Kode</span>
        </div>
        <div class="toolbar">
            <select class="lang-select" id="language" onchange="changeLanguage()">
                <option value="javascript">JavaScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="typescript">TypeScript</option>
                <option value="python">Python (Pyodide)</option>
                <option value="json">JSON</option>
                <option value="markdown">Markdown</option>
            </select>
            <div class="template-dropdown">
                <button class="btn btn-secondary" onclick="toggleTemplates()">Templates</button>
                <div class="template-menu" id="template-menu">
                    <div class="template-item" onclick="loadTemplate('hello')">Hello World</div>
                    <div class="template-item" onclick="loadTemplate('fetch')">Fetch API</div>
                    <div class="template-item" onclick="loadTemplate('dom')">DOM Manipulation</div>
                    <div class="template-item" onclick="loadTemplate('async')">Async/Await</div>
                    <div class="template-item" onclick="loadTemplate('class')">ES6 Class</div>
                    <div class="template-item" onclick="loadTemplate('react')">React Component</div>
                    <div class="template-item" onclick="loadTemplate('html-page')">HTML Page</div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="formatCode()">Format</button>
            <button class="btn btn-secondary" onclick="shareCode()">Share</button>
            <button class="btn btn-run" onclick="runCode()">▶ Run</button>
        </div>
    </header>

    <div class="main" id="main">
        <div class="editor-panel">
            <div class="file-tabs" id="file-tabs">
                <div class="file-tab active" data-file="main">
                    <span>main.js</span>
                </div>
            </div>
            <div class="editor-container">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea class="code-editor" id="code-editor" spellcheck="false" oninput="updateLineNumbers(); autoSave();" onkeydown="handleTab(event)" onscroll="syncScroll()"></textarea>
            </div>
        </div>

        <div class="output-panel">
            <div class="tabs">
                <button class="tab active" onclick="setOutputTab('console')">Console</button>
                <button class="tab" onclick="setOutputTab('preview')">Preview</button>
                <button class="tab" onclick="setOutputTab('ast')">AST</button>
            </div>
            <div class="tab-content active" id="tab-console">
                <div class="panel-header">
                    <span class="panel-title">Console Output</span>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;" onclick="clearConsole()">Clear</button>
                    </div>
                </div>
                <div class="output-container">
                    <div class="output-content console-output" id="console-output"></div>
                </div>
            </div>
            <div class="tab-content" id="tab-preview">
                <div class="panel-header">
                    <span class="panel-title">Live Preview</span>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;" onclick="refreshPreview()">Refresh</button>
                    </div>
                </div>
                <iframe class="html-preview" id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
            </div>
            <div class="tab-content" id="tab-ast">
                <div class="panel-header">
                    <span class="panel-title">Abstract Syntax Tree</span>
                </div>
                <div class="output-container">
                    <div class="output-content" id="ast-output" style="font-size: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="status-left">JavaScript | UTF-8</span>
        <span id="status-right">Ln 1, Col 1</span>
    </div>

    <script>
        let currentLanguage = 'javascript';
        let pyodide = null;
        let files = { 'main': { content: '// Welcome to Kode!\nconsole.log("Hello, World!");', language: 'javascript' } };
        let currentFile = 'main';

        const templates = {
            hello: `// Hello World\nconsole.log("Hello, World!");`,
            fetch: `// Fetch API Example\nasync function fetchData() {\n  try {\n    const response = await fetch('https://jsonplaceholder.typicode.com/todos/1');\n    const data = await response.json();\n    console.log(data);\n  } catch (error) {\n    console.error('Error:', error);\n  }\n}\n\nfetchData();`,
            dom: `// DOM Manipulation\nconst element = document.createElement('div');\nelement.textContent = 'Created with JavaScript!';\nelement.style.padding = '20px';\nelement.style.background = '#007acc';\nelement.style.color = 'white';\nelement.style.borderRadius = '8px';\n\n// In preview, this would append to body\nconsole.log('Element created:', element.outerHTML);`,
            async: `// Async/Await Pattern\nconst sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));\n\nasync function countdown() {\n  for (let i = 5; i > 0; i--) {\n    console.log(i);\n    await sleep(1000);\n  }\n  console.log('🚀 Liftoff!');\n}\n\ncountdown();`,
            class: `// ES6 Class Example\nclass Animal {\n  constructor(name) {\n    this.name = name;\n  }\n\n  speak() {\n    console.log(\`\${this.name} makes a sound.\`);\n  }\n}\n\nclass Dog extends Animal {\n  speak() {\n    console.log(\`\${this.name} barks!\`);\n  }\n}\n\nconst dog = new Dog('Rex');\ndog.speak();`,
            react: `// React Component (JSX-like)\nfunction App() {\n  const [count, setCount] = React.useState(0);\n\n  return (\n    <div className="app">\n      <h1>Counter: {count}</h1>\n      <button onClick={() => setCount(count + 1)}>\n        Increment\n      </button>\n    </div>\n  );\n}\n\n// Note: This is pseudo-code for demonstration\nconsole.log('React component defined');`,
            'html-page': `<!DOCTYPE html>\n<html>\n<head>\n  <title>My Page</title>\n  <style>\n    body {\n      font-family: system-ui;\n      padding: 20px;\n      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n      color: white;\n      min-height: 100vh;\n    }\n    .card {\n      background: rgba(255,255,255,0.1);\n      padding: 20px;\n      border-radius: 12px;\n      backdrop-filter: blur(10px);\n    }\n  </style>\n</head>\n<body>\n  <div class="card">\n    <h1>Hello World!</h1>\n    <p>Edit this HTML and see the preview.</p>\n  </div>\n</body>\n</html>`
        };

        function updateLineNumbers() {
            const editor = document.getElementById('code-editor');
            const lines = editor.value.split('\n').length;
            document.getElementById('line-numbers').innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
        }

        function syncScroll() {
            const editor = document.getElementById('code-editor');
            const lineNumbers = document.getElementById('line-numbers');
            lineNumbers.scrollTop = editor.scrollTop;
        }

        function handleTab(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const editor = e.target;
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 2;
                updateLineNumbers();
            }
        }

        function changeLanguage() {
            currentLanguage = document.getElementById('language').value;
            const extensions = { javascript: 'js', html: 'html', css: 'css', typescript: 'ts', python: 'py', json: 'json', markdown: 'md' };
            document.getElementById('status-left').textContent = `${currentLanguage.charAt(0).toUpperCase() + currentLanguage.slice(1)} | UTF-8`;

            if (currentLanguage === 'html') {
                setOutputTab('preview');
            }

            if (currentLanguage === 'python' && !pyodide) {
                loadPyodide();
            }
        }

        async function loadPyodide() {
            logToConsole('Loading Python runtime...', 'info');
            try {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
                script.onload = async () => {
                    pyodide = await loadPyodide();
                    logToConsole('Python ready!', 'success');
                };
                document.head.appendChild(script);
            } catch (e) {
                logToConsole('Failed to load Python: ' + e.message, 'error');
            }
        }

        function setOutputTab(tab) {
            document.querySelectorAll('.output-panel .tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.output-panel .tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function logToConsole(msg, type = 'log') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = 'console-line ' + type;
            line.textContent = msg;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console-output').innerHTML = '';
        }

        async function runCode() {
            const code = document.getElementById('code-editor').value;
            clearConsole();

            if (currentLanguage === 'html') {
                setOutputTab('preview');
                refreshPreview();
                return;
            }

            if (currentLanguage === 'json') {
                try {
                    const parsed = JSON.parse(code);
                    logToConsole(JSON.stringify(parsed, null, 2), 'success');
                } catch (e) {
                    logToConsole('Invalid JSON: ' + e.message, 'error');
                }
                return;
            }

            if (currentLanguage === 'markdown') {
                setOutputTab('preview');
                const html = simpleMarkdown(code);
                document.getElementById('preview-frame').srcdoc = `<style>body{font-family:system-ui;padding:20px;line-height:1.6;}pre{background:#f5f5f5;padding:10px;border-radius:4px;}code{background:#f5f5f5;padding:2px 4px;border-radius:2px;}</style>${html}`;
                return;
            }

            if (currentLanguage === 'python') {
                if (!pyodide) {
                    logToConsole('Python is still loading...', 'warn');
                    return;
                }
                try {
                    pyodide.runPython(`
                        import sys
                        from io import StringIO
                        sys.stdout = StringIO()
                    `);
                    pyodide.runPython(code);
                    const output = pyodide.runPython('sys.stdout.getvalue()');
                    if (output) logToConsole(output, 'log');
                } catch (e) {
                    logToConsole(e.message, 'error');
                }
                return;
            }

            // JavaScript execution
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            const originalInfo = console.info;

            console.log = (...args) => logToConsole(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '), 'log');
            console.error = (...args) => logToConsole(args.join(' '), 'error');
            console.warn = (...args) => logToConsole(args.join(' '), 'warn');
            console.info = (...args) => logToConsole(args.join(' '), 'info');

            try {
                const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
                const fn = new AsyncFunction(code);
                await fn();
            } catch (e) {
                logToConsole(e.toString(), 'error');
            }

            console.log = originalLog;
            console.error = originalError;
            console.warn = originalWarn;
            console.info = originalInfo;
        }

        function refreshPreview() {
            const code = document.getElementById('code-editor').value;
            const frame = document.getElementById('preview-frame');

            if (currentLanguage === 'html') {
                frame.srcdoc = code;
            } else if (currentLanguage === 'css') {
                frame.srcdoc = `<style>${code}</style><div class="demo"><h1>CSS Preview</h1><p>Your styles are applied here.</p><button>Button</button></div>`;
            }
        }

        function simpleMarkdown(md) {
            return md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/```([^`]+)```/gim, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                .replace(/\n/gim, '<br>');
        }

        function toggleTemplates() {
            document.getElementById('template-menu').classList.toggle('open');
        }

        function loadTemplate(name) {
            if (templates[name]) {
                document.getElementById('code-editor').value = templates[name];
                updateLineNumbers();

                if (name === 'html-page') {
                    document.getElementById('language').value = 'html';
                    changeLanguage();
                }
            }
            document.getElementById('template-menu').classList.remove('open');
        }

        function formatCode() {
            const code = document.getElementById('code-editor').value;
            if (currentLanguage === 'json') {
                try {
                    const formatted = JSON.stringify(JSON.parse(code), null, 2);
                    document.getElementById('code-editor').value = formatted;
                    updateLineNumbers();
                } catch (e) {
                    logToConsole('Cannot format invalid JSON', 'error');
                }
            }
        }

        function shareCode() {
            const code = document.getElementById('code-editor').value;
            const encoded = btoa(encodeURIComponent(code));
            const url = `${location.origin}${location.pathname}?code=${encoded}&lang=${currentLanguage}`;
            navigator.clipboard.writeText(url);
            logToConsole('Share URL copied to clipboard!', 'info');
        }

        function autoSave() {
            files[currentFile] = { content: document.getElementById('code-editor').value, language: currentLanguage };
            localStorage.setItem('kode_files', JSON.stringify(files));
        }

        // Track cursor position
        document.getElementById('code-editor').addEventListener('click', updateCursor);
        document.getElementById('code-editor').addEventListener('keyup', updateCursor);

        function updateCursor() {
            const editor = document.getElementById('code-editor');
            const text = editor.value.substring(0, editor.selectionStart);
            const lines = text.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            document.getElementById('status-right').textContent = `Ln ${line}, Col ${col}`;
        }

        // Load from URL or localStorage
        window.addEventListener('load', () => {
            const params = new URLSearchParams(location.search);
            if (params.get('code')) {
                try {
                    const code = decodeURIComponent(atob(params.get('code')));
                    document.getElementById('code-editor').value = code;
                    if (params.get('lang')) {
                        document.getElementById('language').value = params.get('lang');
                        changeLanguage();
                    }
                } catch (e) {}
            } else {
                const saved = localStorage.getItem('kode_files');
                if (saved) {
                    files = JSON.parse(saved);
                    if (files.main) {
                        document.getElementById('code-editor').value = files.main.content;
                    }
                } else {
                    document.getElementById('code-editor').value = templates.hello;
                }
            }
            updateLineNumbers();
        });

        // Close template menu on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.template-dropdown')) {
                document.getElementById('template-menu').classList.remove('open');
            }
        });
    </script>
</body>
</html>
