<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump Logbook - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"jump-logbook","name":"Jump Logbook","icon":"📓","desc":"Track skydiving jumps","category":"skydiving","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#7c3aed}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.license{background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);border-radius:12px;padding:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.license-info h3{margin-bottom:5px}
.license-info p{font-size:.875rem;opacity:.9}
.license-badge{font-size:3rem}
.jumps{display:flex;flex-direction:column;gap:10px}
.jump{background:#1a1a1a;border-radius:8px;border:1px solid #333;padding:15px;display:grid;grid-template-columns:60px 1fr auto;gap:15px;align-items:center}
.jump-number{font-size:1.5rem;font-weight:bold;color:#7c3aed;text-align:center}
.jump-details h4{margin-bottom:5px}
.jump-meta{font-size:.875rem;color:#888;display:flex;flex-wrap:wrap;gap:10px}
.jump-meta span{display:flex;align-items:center;gap:5px}
.jump-type{padding:6px 12px;background:#252525;border-radius:6px;font-size:.75rem}
</style>
</head>
<body>
<div class="header"><h1>📓 Jump Logbook</h1><button class="btn">+ Log Jump</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">247</div><div class="stat-label">Total Jumps</div></div>
<div class="stat"><div class="stat-value">68:42</div><div class="stat-label">Freefall Time</div></div>
<div class="stat"><div class="stat-value">18,500</div><div class="stat-label">Highest (ft)</div></div>
<div class="stat"><div class="stat-value">12</div><div class="stat-label">This Year</div></div>
</div>
<div class="license">
<div class="license-info"><h3>USPA C License</h3><p>Earned: March 2023 • Valid through Dec 2025</p></div>
<div class="license-badge">🪂</div>
</div>
<div class="jumps" id="jumps"></div>
<script>
const jumps=[
{num:247,date:'Dec 22, 2024',dropzone:'Skydive Dallas',altitude:'14,000 ft',type:'Formation',aircraft:'Twin Otter',exit:'Belly',deploy:'4,500 ft',canopy:'Sabre 170'},
{num:246,date:'Dec 22, 2024',dropzone:'Skydive Dallas',altitude:'14,000 ft',type:'Freefly',aircraft:'Twin Otter',exit:'Head down',deploy:'5,000 ft',canopy:'Sabre 170'},
{num:245,date:'Dec 15, 2024',dropzone:'Skydive Spaceland',altitude:'15,000 ft',type:'Wingsuit',aircraft:'Super King Air',exit:'Track',deploy:'5,500 ft',canopy:'Sabre 170'},
{num:244,date:'Dec 8, 2024',dropzone:'Skydive Spaceland',altitude:'14,000 ft',type:'Formation',aircraft:'Twin Otter',exit:'4-way exit',deploy:'4,500 ft',canopy:'Sabre 170'},
{num:243,date:'Nov 30, 2024',dropzone:'Skydive Dallas',altitude:'18,500 ft',type:'HALO',aircraft:'Caravan',exit:'Solo',deploy:'4,000 ft',canopy:'Sabre 170'}
];
document.getElementById('jumps').innerHTML=jumps.map(j=>`
<div class="jump">
<div class="jump-number">#${j.num}</div>
<div class="jump-details">
<h4>${j.dropzone}</h4>
<div class="jump-meta">
<span>📅 ${j.date}</span>
<span>📍 ${j.altitude}</span>
<span>✈️ ${j.aircraft}</span>
<span>🪂 ${j.canopy}</span>
</div>
</div>
<div class="jump-type">${j.type}</div>
</div>`).join('');
</script>
</body>
</html>
