<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump Booking - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"jump-booking","name":"Skydive Booking","icon":"🪂","desc":"Book skydiving jumps","category":"skydiving","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.weather{background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);border-radius:12px;padding:20px;margin-bottom:20px}
.weather-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.weather-title{font-weight:bold}
.weather-status{padding:6px 12px;background:#22c55e33;color:#22c55e;border-radius:6px;font-size:.875rem}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:15px;text-align:center}
.weather-value{font-size:1.25rem;font-weight:bold}
.weather-label{font-size:.75rem;opacity:.8}
.jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.jump{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.jump-header{padding:25px;background:#252525;text-align:center}
.jump-name{font-size:1.5rem;font-weight:bold;margin-bottom:5px}
.jump-altitude{font-size:1rem;color:#7c3aed}
.jump-body{padding:20px}
.jump-features{margin-bottom:20px}
.feature{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333;font-size:.875rem}
.feature:last-child{border-bottom:none}
.feature-label{color:#888}
.jump-price{text-align:center;font-size:2rem;font-weight:bold;color:#7c3aed;margin-bottom:5px}
.jump-note{text-align:center;font-size:.75rem;color:#888;margin-bottom:15px}
.book-btn{width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:1rem}
</style>
</head>
<body>
<div class="header"><h1>🪂 Skydive Booking</h1><button class="btn">My Jumps</button></div>
<div class="weather">
<div class="weather-header"><span class="weather-title">☀️ Today's Conditions</span><span class="weather-status">✓ Jump Ready</span></div>
<div class="weather-grid">
<div><div class="weather-value">5 mph</div><div class="weather-label">Wind Speed</div></div>
<div><div class="weather-value">Clear</div><div class="weather-label">Visibility</div></div>
<div><div class="weather-value">72°F</div><div class="weather-label">Ground Temp</div></div>
<div><div class="weather-value">0%</div><div class="weather-label">Cloud Cover</div></div>
<div><div class="weather-value">15k ft</div><div class="weather-label">Ceiling</div></div>
</div>
</div>
<div class="jumps" id="jumps"></div>
<script>
const jumps=[
{name:'Tandem Jump',altitude:'14,000 ft',freefall:'60 seconds',training:'15 min briefing',instructor:'Included',video:'Optional (+$99)',minAge:'18+',weight:'Under 230 lbs',price:249,note:'No experience required'},
{name:'Solo Jump (AFF)',altitude:'14,000 ft',freefall:'60 seconds',training:'6-hour course',instructor:'Two instructors',video:'Included',minAge:'18+',weight:'Under 230 lbs',price:349,note:'First step to certification'},
{name:'Licensed Jumper',altitude:'15,000 ft',freefall:'70 seconds',training:'None required',instructor:'Self-supervised',video:'Self-record',minAge:'Licensed',weight:'Standard limits',price:28,note:'A/B/C/D license holders'},
{name:'Night Jump',altitude:'10,000 ft',freefall:'45 seconds',training:'Night briefing',instructor:'Required',video:'Night vision add-on',minAge:'B License+',weight:'Standard limits',price:75,note:'Full moon special event'}
];
document.getElementById('jumps').innerHTML=jumps.map(j=>`
<div class="jump">
<div class="jump-header"><div class="jump-name">${j.name}</div><div class="jump-altitude">📍 ${j.altitude}</div></div>
<div class="jump-body">
<div class="jump-features">
<div class="feature"><span class="feature-label">Freefall</span><span>${j.freefall}</span></div>
<div class="feature"><span class="feature-label">Training</span><span>${j.training}</span></div>
<div class="feature"><span class="feature-label">Instructor</span><span>${j.instructor}</span></div>
<div class="feature"><span class="feature-label">Video</span><span>${j.video}</span></div>
<div class="feature"><span class="feature-label">Requirements</span><span>${j.minAge}, ${j.weight}</span></div>
</div>
<div class="jump-price">$${j.price}</div>
<div class="jump-note">${j.note}</div>
<button class="book-btn">Book Jump</button>
</div>
</div>`).join('');
</script>
</body>
</html>
