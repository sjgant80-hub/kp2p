<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bungee Jumping - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"bungee-booking","name":"Bungee Jumping","icon":"🎢","desc":"Book bungee jumps","category":"bungee","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.hero{background:linear-gradient(135deg,#dc2626 0%,#b91c1c 100%);border-radius:12px;padding:40px;margin-bottom:20px;text-align:center}
.hero h2{font-size:2rem;margin-bottom:10px}
.hero p{font-size:1.125rem;opacity:.9}
.jumps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.jump{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.jump-header{padding:25px;background:#252525;text-align:center}
.jump-height{font-size:3rem;font-weight:bold;color:#dc2626}
.jump-name{font-size:1.25rem;font-weight:bold;margin-top:10px}
.jump-body{padding:20px}
.jump-features{margin-bottom:15px}
.feature{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333;font-size:.875rem}
.feature:last-child{border-bottom:none}
.feature-label{color:#888}
.jump-includes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}
.include-tag{padding:4px 10px;background:#252525;border-radius:4px;font-size:.75rem}
.jump-footer{display:flex;justify-content:space-between;align-items:center}
.jump-price{font-size:1.5rem;font-weight:bold;color:#22c55e}
.book-btn{padding:12px 25px;background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>🎢 Bungee Jumping</h1><button class="btn">My Jumps</button></div>
<div class="hero">
<h2>🌉 Take the Leap!</h2>
<p>Experience the ultimate adrenaline rush at our world-class jump sites</p>
</div>
<div class="jumps" id="jumps"></div>
<script>
const jumps=[
{height:'160 ft',name:'Bridge Jump',location:'River Gorge Bridge',freefall:'3 seconds',type:'Classic',minAge:'16+',weight:'90-260 lbs',includes:['Training','Equipment','Certificate','Photos'],price:129},
{height:'230 ft',name:'Tower Dive',location:'Sky Tower Platform',freefall:'4 seconds',type:'Platform',minAge:'18+',weight:'100-250 lbs',includes:['Training','Equipment','Video Package','T-Shirt'],price:189},
{height:'400 ft',name:'Mega Drop',location:'Canyon Overlook',freefall:'6 seconds',type:'Extreme',minAge:'18+',weight:'110-240 lbs',includes:['Full Video','Pro Photos','VIP Access','Certificate'],price:299},
{height:'80 ft',name:'First Timer',location:'Training Tower',freefall:'2 seconds',type:'Beginner',minAge:'14+',weight:'80-280 lbs',includes:['Extended Training','Safety Brief','Photos'],price:79}
];
document.getElementById('jumps').innerHTML=jumps.map(j=>`
<div class="jump">
<div class="jump-header"><div class="jump-height">${j.height}</div><div class="jump-name">${j.name}</div></div>
<div class="jump-body">
<div class="jump-features">
<div class="feature"><span class="feature-label">Location</span><span>${j.location}</span></div>
<div class="feature"><span class="feature-label">Freefall</span><span>${j.freefall}</span></div>
<div class="feature"><span class="feature-label">Type</span><span>${j.type}</span></div>
<div class="feature"><span class="feature-label">Requirements</span><span>${j.minAge}, ${j.weight}</span></div>
</div>
<div class="jump-includes">${j.includes.map(i=>`<span class="include-tag">✓ ${i}</span>`).join('')}</div>
<div class="jump-footer"><span class="jump-price">$${j.price}</span><button class="book-btn">Book Jump</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
