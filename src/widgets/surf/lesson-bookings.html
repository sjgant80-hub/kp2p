<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surf Lessons - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"lesson-bookings","name":"Surf Lessons","icon":"🏄","desc":"Book surf lessons","category":"surf","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#06b6d4;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.conditions{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px}
.condition{text-align:center}
.condition-value{font-size:1.25rem;font-weight:bold;color:#06b6d4}
.condition-label{font-size:.75rem;color:#888}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.lesson{background:#1a1a1a;border-radius:12px;border:1px solid #333;overflow:hidden}
.lesson-header{padding:15px 20px;background:#252525;display:flex;justify-content:space-between;align-items:center}
.lesson-time{font-weight:bold}
.lesson-level{padding:4px 10px;border-radius:4px;font-size:.75rem}
.level-beginner{background:#22c55e33;color:#22c55e}
.level-intermediate{background:#f59e0b33;color:#f59e0b}
.level-advanced{background:#ef444433;color:#ef4444}
.lesson-body{padding:20px}
.lesson-type{font-size:1.125rem;font-weight:600;margin-bottom:10px}
.lesson-details{font-size:.875rem;color:#888;margin-bottom:15px}
.instructor{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.instructor-avatar{width:40px;height:40px;background:#06b6d4;border-radius:50%;display:flex;align-items:center;justify-content:center}
.instructor-name{font-weight:500}
.instructor-rating{font-size:.875rem;color:#f59e0b}
.lesson-footer{display:flex;justify-content:space-between;align-items:center}
.lesson-price{font-size:1.25rem;font-weight:bold;color:#22c55e}
.book-btn{padding:10px 20px;background:#06b6d4;border:none;border-radius:6px;color:#000;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="header"><h1>🏄 Surf Lessons</h1><button class="btn">+ Book Lesson</button></div>
<div class="conditions">
<div class="condition"><div class="condition-value">3-4 ft</div><div class="condition-label">Wave Height</div></div>
<div class="condition"><div class="condition-value">SW 8mph</div><div class="condition-label">Wind</div></div>
<div class="condition"><div class="condition-value">72°F</div><div class="condition-label">Water Temp</div></div>
<div class="condition"><div class="condition-value">☀️ Sunny</div><div class="condition-label">Weather</div></div>
<div class="condition"><div class="condition-value">🟢 Good</div><div class="condition-label">Conditions</div></div>
</div>
<div class="lessons" id="lessons"></div>
<script>
const lessons=[
{time:'8:00 AM',level:'beginner',type:'Beginner Group Lesson',duration:'2 hours',students:'Max 6 students',instructor:'Kai',rating:'4.9',price:85},
{time:'10:30 AM',level:'beginner',type:'Private Lesson',duration:'1.5 hours',students:'1-on-1 instruction',instructor:'Luna',rating:'5.0',price:150},
{time:'1:00 PM',level:'intermediate',type:'Technique Workshop',duration:'2 hours',students:'Max 4 students',instructor:'Marco',rating:'4.8',price:95},
{time:'3:30 PM',level:'beginner',type:'Kids Surf Camp',duration:'2 hours',students:'Ages 6-12',instructor:'Kai',rating:'4.9',price:75},
{time:'5:00 PM',level:'advanced',type:'Advanced Maneuvers',duration:'2 hours',students:'Max 3 students',instructor:'Marco',rating:'4.8',price:125}
];
document.getElementById('lessons').innerHTML=lessons.map(l=>`
<div class="lesson">
<div class="lesson-header"><span class="lesson-time">${l.time}</span><span class="lesson-level level-${l.level}">${l.level.charAt(0).toUpperCase()+l.level.slice(1)}</span></div>
<div class="lesson-body">
<div class="lesson-type">${l.type}</div>
<div class="lesson-details">⏱️ ${l.duration} • 👥 ${l.students}</div>
<div class="instructor"><div class="instructor-avatar">🏄</div><div><div class="instructor-name">${l.instructor}</div><div class="instructor-rating">⭐ ${l.rating}</div></div></div>
<div class="lesson-footer"><span class="lesson-price">$${l.price}</span><button class="book-btn">Book Now</button></div>
</div>
</div>`).join('');
</script>
</body>
</html>
