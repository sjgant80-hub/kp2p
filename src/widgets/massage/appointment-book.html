<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment Book - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"massage-appointments","name":"Massage Appointments","icon":"💆","desc":"Schedule massage appointments","category":"massage","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;background:#c084fc;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#c084fc}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.schedule{display:flex;flex-direction:column;gap:10px}
.appt{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px;display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center}
.appt-time{text-align:center;background:#c084fc20;padding:15px;border-radius:8px}
.time{font-size:1.25rem;font-weight:bold;color:#c084fc}
.duration{font-size:.75rem;color:#888;margin-top:5px}
.appt-info{flex:1}
.client-name{font-weight:600;font-size:1.125rem}
.service{font-size:.875rem;color:#888;margin:5px 0}
.therapist{font-size:.75rem;color:#c084fc}
.room{padding:6px 12px;background:#252525;border-radius:4px;font-size:.875rem}
.appt-actions button{padding:8px 15px;background:#252525;border:1px solid #333;color:#e0e0e0;border-radius:6px;cursor:pointer;margin-left:10px}
</style>
</head>
<body>
<div class="header"><h1>💆 Massage Appointments</h1><button class="btn">+ Book Appointment</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">8</div><div class="stat-label">Today</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Therapists</div></div>
<div class="stat"><div class="stat-value">$1.2k</div><div class="stat-label">Today's Revenue</div></div>
<div class="stat"><div class="stat-value">92%</div><div class="stat-label">Utilization</div></div>
</div>
<div class="schedule" id="schedule"></div>
<script>
const appointments=[
{time:'9:00 AM',duration:'90 min',client:'Sarah Mitchell',service:'Deep Tissue Massage',therapist:'Lisa Chen',room:'Room 1'},
{time:'9:30 AM',duration:'60 min',client:'Michael Brown',service:'Swedish Massage',therapist:'Emma Wilson',room:'Room 2'},
{time:'10:30 AM',duration:'90 min',client:'Jennifer Lee',service:'Hot Stone Massage',therapist:'Lisa Chen',room:'Room 1'},
{time:'11:00 AM',duration:'60 min',client:'David Park',service:'Sports Massage',therapist:'Emma Wilson',room:'Room 2'},
{time:'1:00 PM',duration:'120 min',client:'Amanda White',service:'Couples Massage',therapist:'Lisa & Emma',room:'Suite'},
{time:'3:00 PM',duration:'60 min',client:'Robert Chen',service:'Aromatherapy',therapist:'Lisa Chen',room:'Room 1'}
];
document.getElementById('schedule').innerHTML=appointments.map(a=>`
<div class="appt">
<div class="appt-time"><div class="time">${a.time}</div><div class="duration">${a.duration}</div></div>
<div class="appt-info"><div class="client-name">${a.client}</div><div class="service">${a.service}</div><div class="therapist">👤 ${a.therapist}</div></div>
<div class="appt-actions"><span class="room">${a.room}</span><button>Check In</button></div>
</div>`).join('');
</script>
</body>
</html>
