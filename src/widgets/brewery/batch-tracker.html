<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batch Tracker - KISS MySaaS</title>
<script type="application/json" id="widget-meta">{"id":"batch-tracker","name":"Batch Tracker","icon":"🍺","desc":"Track brewing batches","category":"brewery","version":"1.0.0"}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#1a1a1a;padding:15px;border-radius:8px;border:1px solid #333;text-align:center}
.stat-value{font-size:1.5rem;font-weight:bold;color:#f59e0b}
.stat-label{font-size:.75rem;color:#888;margin-top:5px}
.list{display:flex;flex-direction:column;gap:15px}
.card{background:#1a1a1a;border-radius:12px;border:1px solid #333;padding:20px}
.card-header{display:flex;justify-content:space-between;margin-bottom:15px}
.batch{font-weight:600}
.status{padding:6px 12px;border-radius:6px;font-size:.75rem}
.status.fermenting{background:#f59e0b33;color:#f59e0b}
.status.conditioning{background:#3b82f633;color:#3b82f6}
.status.ready{background:#22c55e33;color:#22c55e}
.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.bar{height:8px;background:#333;border-radius:4px}
.fill{height:100%;border-radius:4px;background:#f59e0b}
.progress-label{font-size:.75rem;color:#888;margin-top:5px;text-align:right}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#f59e0b;color:#000}
</style>
</head>
<body>
<div class="header"><h1>🍺 Batch Tracker</h1><button class="btn" onclick="alert('New')">+ New Batch</button></div>
<div class="stats">
<div class="stat"><div class="stat-value">8</div><div class="stat-label">Active Batches</div></div>
<div class="stat"><div class="stat-value">3</div><div class="stat-label">Fermenting</div></div>
<div class="stat"><div class="stat-value">2</div><div class="stat-label">Ready</div></div>
<div class="stat"><div class="stat-value">450</div><div class="stat-label">Gallons</div></div>
</div>
<div class="list" id="list"></div>
<script>
const batches=[
{id:'B-2024-015',name:'Golden Ale',style:'American Pale Ale',size:'30 gal',abv:'5.2%',started:'Dec 10',days:17,status:'fermenting',progress:65},
{id:'B-2024-014',name:'Winter Stout',style:'Oatmeal Stout',size:'30 gal',abv:'6.8%',started:'Dec 1',days:26,status:'conditioning',progress:85},
{id:'B-2024-013',name:'Hop Heaven IPA',style:'West Coast IPA',size:'60 gal',abv:'7.2%',started:'Nov 20',days:37,status:'ready',progress:100},
{id:'B-2024-016',name:'Lager Time',style:'German Pilsner',size:'30 gal',abv:'4.8%',started:'Dec 15',days:12,status:'fermenting',progress:40}
];
document.getElementById('list').innerHTML=batches.map(b=>`
<div class="card">
<div class="card-header"><span class="batch">#${b.id} - ${b.name}</span><span class="status ${b.status}">${b.status.charAt(0).toUpperCase()+b.status.slice(1)}</span></div>
<div class="info">
<div><div class="row"><span class="label">Style</span><span>${b.style}</span></div><div class="row"><span class="label">ABV</span><span>${b.abv}</span></div></div>
<div><div class="row"><span class="label">Size</span><span>${b.size}</span></div><div class="row"><span class="label">Day</span><span>${b.days}</span></div></div>
</div>
<div class="bar"><div class="fill" style="width:${b.progress}%"></div></div>
<div class="progress-label">${b.progress}% complete</div>
</div>`).join('');
</script>
</body>
</html>
