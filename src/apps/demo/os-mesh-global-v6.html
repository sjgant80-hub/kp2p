<!DOCTYPE html>
<!--
@file os-mesh-global-v6.html
@desc KonomiOS v6 - Widget Hub + Global P2P
@hash {W:window,A:app,T:terminal,C:chat,F:files,P:peers,S:settings,G:widgets}
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KonomiOS v6</title>
  <style>
    :root{--b:#0f0f1a;--b2:#1a1a2e;--b3:#16213e;--f:#e4e4e7;--a:#00d9ff;--a2:#7c3aed;--g:#10b981;--r:#ef4444;--o:#f97316;--y:#eab308;--br:#334155;--gl:rgba(15,23,42,.9)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:var(--b);color:var(--f);height:100vh;overflow:hidden;user-select:none}
    .D{position:absolute;inset:0 0 52px 0;background:linear-gradient(135deg,#0f0f1a,#1a1a2e 50%,#0f3460)}.D::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(0,217,255,.08),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(124,58,237,.08),transparent 60%);pointer-events:none}
    .DI{position:absolute;top:16px;left:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .di{width:68px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:10px;transition:.2s}.di:hover{background:rgba(255,255,255,.08)}.di:active{transform:scale(.95)}.di i{font-size:28px;display:block;margin-bottom:4px}.di span{font-size:9px;text-shadow:0 1px 2px #000}
    .W{position:absolute;background:var(--gl);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;min-width:260px;min-height:160px;resize:both}
    .W.o{display:flex}.W.a{z-index:100;box-shadow:0 16px 64px rgba(0,0,0,.6)}.W.m{inset:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
    .Wh{padding:10px 12px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:8px;cursor:move}
    .Wc{display:flex;gap:6px}.Wc button{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;transition:.15s}.Wc button:hover{transform:scale(1.2)}.Wc .c{background:var(--r)}.Wc .n{background:var(--o)}.Wc .x{background:var(--g)}
    .Wt{flex:1;font-size:11px;font-weight:500;opacity:.85}.Wb{flex:1;overflow:hidden;display:flex;flex-direction:column}
    .TB{position:absolute;bottom:0;left:0;right:0;height:52px;background:rgba(0,0,0,.7);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 12px;gap:6px}
    .Ts{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--a),var(--a2));border-radius:10px;font-size:18px;cursor:pointer;margin-right:8px;transition:.2s}.Ts:hover{transform:scale(1.05)}
    .Ta{display:flex;gap:4px;flex:1;overflow-x:auto}.Ta::-webkit-scrollbar{display:none}.Ta div{padding:6px 10px;background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:6px;font-size:10px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:.2s}.Ta div:hover{background:rgba(255,255,255,.1)}.Ta div.a{background:rgba(0,217,255,.15);border-color:var(--a)}
    .Ty{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:10px}.Ty .d{width:8px;height:8px;border-radius:50%}.Ty .d.on{background:var(--g);box-shadow:0 0 8px var(--g)}.Ty .d.c{background:var(--o);animation:p 1s infinite}@keyframes p{50%{opacity:.4}}
    .trm{flex:1;background:rgba(0,0,0,.6);padding:10px;overflow-y:auto;font-family:'SF Mono',monospace;font-size:11px;line-height:1.5}.trm .l{margin-bottom:1px;white-space:pre-wrap}.trm .p{color:var(--g)}.trm .o{color:#94a3b8}.trm .e{color:var(--r)}.trm .i{color:var(--a)}
    .tri{display:flex;padding:6px 10px;background:rgba(0,0,0,.4);gap:6px}.tri input{flex:1;background:0;border:0;color:var(--f);font-family:inherit;font-size:11px;outline:0}
    .cht{flex:1;display:flex;flex-direction:column}.chm{flex:1;overflow-y:auto;padding:10px}.chm .m{margin-bottom:8px;display:flex;flex-direction:column}.chm .m.s{align-items:flex-end}.chm .mt{font-size:9px;color:#64748b;margin-bottom:2px}.chm .mb{max-width:75%;padding:6px 10px;background:rgba(255,255,255,.08);border-radius:12px;font-size:11px}.chm .m.s .mb{background:linear-gradient(135deg,var(--a),var(--a2))}.chm .mb.sys{background:0;color:#64748b;font-style:italic;font-size:9px}
    .chi{display:flex;padding:8px;gap:6px;background:rgba(0,0,0,.3)}.chi input{flex:1;padding:8px 12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:var(--f);font-size:11px;outline:0}.chi button{padding:8px 14px;background:var(--a);border:0;border-radius:14px;color:#000;font-weight:600;font-size:10px;cursor:pointer}
    .fls{flex:1;display:flex;flex-direction:column}.flt{padding:6px 8px;background:rgba(0,0,0,.3);display:flex;gap:4px}.flt input{flex:1;padding:5px 8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:5px;color:var(--f);font-size:10px}.flt button{padding:5px 10px;background:var(--a);border:0;border-radius:5px;color:#000;font-size:9px;font-weight:600;cursor:pointer}
    .fll{flex:1;overflow-y:auto;padding:8px}.fll .fi{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.04);border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:11px;transition:.2s}.fll .fi:hover{background:rgba(255,255,255,.08)}
    .prs{flex:1;overflow-y:auto;padding:8px}.prs .pc{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:6px}.prs .pc.s{border:1px solid var(--a);background:rgba(0,217,255,.05)}.prs .av{font-size:24px}.prs .pi{flex:1}.prs .pn{font-size:12px;font-weight:500}.prs .pid{font-size:9px;color:#64748b;font-family:monospace}
    .sts{flex:1;overflow-y:auto;padding:12px}.sts .sec{margin-bottom:16px}.sts .st{font-size:9px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.sts .si{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:6px;margin-bottom:4px;font-size:11px}.sts .si .v{color:var(--a);font-family:monospace;font-size:10px}.sts input{padding:5px 8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:4px;color:var(--f);font-size:10px;width:120px}.sts button{padding:6px 12px;background:var(--a);border:0;border-radius:4px;color:#000;font-size:10px;font-weight:600;cursor:pointer}
    .wgt{flex:1;overflow-y:auto;padding:8px}.wgt .cat{margin-bottom:12px}.wgt .cat-h{font-size:9px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 4px}.wgt .wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
    .wgt .wc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;transition:.2s}.wgt .wc:hover{background:rgba(255,255,255,.08);border-color:var(--a);transform:translateY(-2px)}.wgt .wc i{font-size:24px;display:block;margin-bottom:4px}.wgt .wc span{font-size:9px;display:block;opacity:.8}
    .wgt .wc.phone{border-color:var(--g)}.wgt .wc.vpn{border-color:var(--a2)}.wgt .wc.game{border-color:var(--o)}.wgt .wc.tool{border-color:var(--y)}
    .SM{position:absolute;bottom:60px;left:12px;width:240px;background:var(--gl);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);display:none;overflow:hidden}.SM.o{display:block}.SM h{display:block;padding:12px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:14px;font-weight:600}.SM h small{display:block;font-size:9px;opacity:.7;font-weight:400;margin-top:2px}.SM .si{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:11px;transition:.2s}.SM .si:hover{background:rgba(255,255,255,.08)}.SM .si i{font-size:16px}
    .emp{text-align:center;padding:24px;color:#64748b;font-size:11px}
    .ifr{flex:1;border:0;background:#000;border-radius:0 0 12px 12px}
    .wvh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.3);font-size:10px}.wvh input{flex:1;padding:5px 8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:4px;color:var(--f);font-size:10px}.wvh button{padding:5px 10px;background:var(--a);border:0;border-radius:4px;color:#000;font-size:9px;cursor:pointer}
  </style>
</head>
<body>
  <div class="D" id="D"></div>
  <div class="SM" id="SM"><h>🌍 KonomiOS<small>v6 Widget Hub</small></h><div id="SMa"></div></div>
  <div class="TB"><div class="Ts" id="Ts">🌍</div><div class="Ta" id="Ta"></div><div class="Ty"><span class="d" id="cd"></span><span id="cs">Offline</span><span style="margin-left:4px">👥</span><span id="pc">0</span><span style="margin-left:6px" id="clk">00:00</span></div></div>

  <script type="module">
    // =========================================================================
    // WIDGET REGISTRY
    // =========================================================================
    const WIDGETS = {
      phone: [
        { n: 'KonoPhone', i: '📱', d: 'P2P Phone', u: '../demo/phone-v1.html', c: 'phone' },
        { n: 'FreeComm', i: '📡', d: 'Multi-Transport', u: '../demo/phone-v2.html', c: 'phone' },
      ],
      apps: [
        { n: 'Ignite', i: '🔥', d: 'App Builder', u: '../ignite/index.html', c: 'tool' },
        { n: 'KonoGate', i: '🚀', d: 'API Gateway', u: '../konogate/index.html', c: 'tool' },
        { n: 'KonoDeck', i: '🎴', d: 'Card Deck', u: '../konodeck/index.html', c: 'game' },
        { n: 'KonoBattle', i: '⚔️', d: 'Battle Game', u: '../konobattle/index.html', c: 'game' },
        { n: 'KonoMerce', i: '🛒', d: 'E-Commerce', u: '../konomerce/index.html', c: 'tool' },
        { n: 'KonoForge', i: '🔨', d: 'Code Forge', u: '../konoforge/index.html', c: 'tool' },
        { n: 'KonoVPN', i: '🔐', d: 'P2P VPN', u: '../konovpn/index.html', c: 'vpn' },
        { n: 'KonoBridge', i: '🌉', d: 'Cross-Chain', u: '../konobridge/index.html', c: 'tool' },
      ],
      demos: [
        { n: 'LLM Agent', i: '🤖', d: 'AI Assistant', u: 'llm-agent-demo-v4.html', c: 'tool' },
        { n: 'Enterprise', i: '🏭', d: 'ISA-95 Demo', u: 'enterprise-demo.html', c: 'tool' },
        { n: 'Sandbox', i: '📦', d: 'VM Sandbox', u: 'sandbox-demo.html', c: 'tool' },
        { n: '3D Land', i: '🎮', d: '3D World', u: '../3DLand/index.html', c: 'game' },
        { n: 'Kaleidoscope', i: '🎨', d: 'Art Tool', u: '../kaleidoscope/index.html', c: 'tool' },
      ],
      mesh: [
        { n: 'OS v3', i: '💻', d: 'CLI Mode', u: 'os-mesh-global-v3.html', c: 'tool' },
        { n: 'OS v4', i: '🖥️', d: 'Desktop', u: 'os-mesh-global-v4.html', c: 'tool' },
        { n: 'OS v5', i: '⚡', d: 'Optimized', u: 'os-mesh-global-v5.html', c: 'tool' },
      ]
    };

    // =========================================================================
    // APP CONFIG
    // =========================================================================
    const APPS = {
      T: { n: 'Terminal', i: '💻', w: 480, h: 320, x: 90, y: 30 },
      C: { n: 'Chat', i: '💬', w: 340, h: 380, x: 160, y: 50 },
      F: { n: 'Files', i: '📁', w: 360, h: 280, x: 220, y: 70 },
      P: { n: 'Peers', i: '👥', w: 280, h: 340, x: 300, y: 40 },
      G: { n: 'Widgets', i: '🧩', w: 420, h: 400, x: 120, y: 60 },
      S: { n: 'Settings', i: '⚙️', w: 340, h: 320, x: 180, y: 80 },
      V: { n: 'Viewer', i: '🌐', w: 600, h: 450, x: 80, y: 30, hidden: true }
    };

    const CMDS = {
      help: () => `help whoami peers room ls cat write clear neofetch widgets open`,
      whoami: () => `${ME.e} ${ME.id}`,
      peers: () => [ME.e + ' ' + ME.n + ' (you)', ...[...peers.values()].map(p => p.e + ' ' + p.n)].join('\n'),
      room: () => room || 'N/A',
      ls: () => files.size ? [...files.keys()].join('\n') : '(empty)',
      cat: a => { const f = files.get(a[0]) || files.get('/' + a[0]); return f ? f.c : 'Not found'; },
      write: a => { if (!a[0]) return 'Usage: write <f> <c>'; const p = '/' + a[0].replace(/^\//,''), c = a.slice(1).join(' '); files.set(p, { c, o: ME.id }); updF(); bc({ t: 'f', p, c, o: ME.id }); return 'Created ' + p; },
      clear: () => { $('trm').innerHTML = ''; return ''; },
      widgets: () => Object.entries(WIDGETS).map(([cat, list]) => `[${cat}]\n` + list.map(w => `  ${w.i} ${w.n}`).join('\n')).join('\n\n'),
      open: a => { if (!a[0]) return 'Usage: open <widget>'; const w = Object.values(WIDGETS).flat().find(x => x.n.toLowerCase().includes(a[0].toLowerCase())); if (w) { openWidget(w); return `Opening ${w.n}...`; } return 'Not found'; },
      neofetch: () => `\n ██╗  ██╗ ██████╗ ███████╗\n ██║ ██╔╝██╔═══██╗██╔════╝\n █████╔╝ ██║   ██║███████╗  v6 Widget Hub\n ██╔═██╗ ██║   ██║╚════██║  ${ME.e} ${ME.n}\n ██║  ██╗╚██████╔╝███████║  Room: ${room||'N/A'}\n ╚═╝  ╚═╝ ╚═════╝ ╚══════╝  Peers: ${peers.size+1} Files: ${files.size}`
    };

    const TPL = {
      win: (k, app) => app.hidden ? '' : `<div class="W" id="W${k}" style="width:${app.w}px;height:${app.h}px;top:${app.y}px;left:${app.x}px"><div class="Wh" onmousedown="D(event,'${k}')"><div class="Wc"><button class="c" onclick="X('${k}')"></button><button class="n" onclick="N('${k}')"></button><button class="x" onclick="M('${k}')"></button></div><span class="Wt">${app.i} ${app.n}</span></div><div class="Wb" id="B${k}"></div></div>`,
      vwin: () => `<div class="W" id="WV" style="width:${APPS.V.w}px;height:${APPS.V.h}px;top:${APPS.V.y}px;left:${APPS.V.x}px"><div class="Wh" onmousedown="D(event,'V')"><div class="Wc"><button class="c" onclick="X('V')"></button><button class="n" onclick="N('V')"></button><button class="x" onclick="M('V')"></button></div><span class="Wt" id="VT">🌐 Viewer</span></div><div class="Wb"><div class="wvh"><input id="vu" readonly><button onclick="window.open($('vu').value,'_blank')">↗ Open</button></div><iframe class="ifr" id="vif"></iframe></div></div>`,
      icon: (k, app) => app.hidden ? '' : `<div class="di" onclick="O('${k}')"><i>${app.i}</i><span>${app.n}</span></div>`,
      smItem: (k, app) => app.hidden ? '' : `<div class="si" onclick="O('${k}');SM()"><i>${app.i}</i><span>${app.n}</span></div>`,
      T: () => `<div class="trm" id="trm"></div><div class="tri"><span style="color:var(--g)">❯</span><input id="ci" placeholder="command..."></div>`,
      C: () => `<div class="cht"><div class="chm" id="chm"></div><div class="chi"><input id="chi" placeholder="message..."><button onclick="sC()">Send</button></div></div>`,
      F: () => `<div class="fls"><div class="flt"><input id="nfn" placeholder="file.txt"><button onclick="nF()">+ New</button></div><div class="fll" id="fll"><div class="emp">No files</div></div></div>`,
      P: () => `<div class="prs" id="prs"></div>`,
      G: () => `<div class="wgt" id="wgt"></div>`,
      S: () => `<div class="sts"><div class="sec"><div class="st">Network</div><div class="si"><span>Room</span><input id="ri" value="konomi-global"></div><div class="si"><span>Status</span><span class="v" id="cst">-</span></div><div class="si"><button onclick="RC()">Reconnect</button></div></div><div class="sec"><div class="st">Identity</div><div class="si"><span>ID</span><span class="v" id="mid">-</span></div><div class="si"><span>Avatar</span><span class="v" id="mav">-</span></div></div></div>`
    };

    // =========================================================================
    // STATE
    // =========================================================================
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const open = new Set();
    let active = null, drag = null, zIdx = 10;
    const peers = new Map(), files = new Map(), dcs = new Map(), pending = new Map();
    let ws = null, hash = null, room = '';

    const ME = {
      id: '-KM0001-' + [...crypto.getRandomValues(new Uint8Array(6))].map(b => b.toString(16).padStart(2,'0')).join(''),
      e: '😀😎🤖👾🦊🐱🐶🦁🐼🐨🦋🌟🚀🎮💎🔥'.split(/(?=.)/u)[Math.random() * 16 | 0]
    };
    ME.n = ME.id.slice(0, 10);

    // =========================================================================
    // RENDER
    // =========================================================================
    function init() {
      let icons = '', wins = '', sm = '';
      for (const [k, app] of Object.entries(APPS)) {
        icons += TPL.icon(k, app);
        wins += TPL.win(k, app);
        sm += TPL.smItem(k, app);
      }
      wins += TPL.vwin();
      $('D').innerHTML = `<div class="DI">${icons}</div>${wins}`;
      $('SMa').innerHTML = sm;

      for (const k of Object.keys(APPS)) if (!APPS[k].hidden) $('B' + k).innerHTML = TPL[k]();

      $('ci')?.addEventListener('keydown', e => e.key === 'Enter' && runCmd());
      $('chi')?.addEventListener('keydown', e => e.key === 'Enter' && sC());
      $('Ts').onclick = SM;

      $('mid').textContent = ME.id.slice(0, 12) + '…';
      $('mav').textContent = ME.e;
      updP(); updF(); updW();
      tP('KonomiOS v6 Widget Hub', 'i');
      tP('Type "widgets" to list, "open <name>" to launch', 'i');
      O('T'); O('G');
      setTimeout(() => join($('ri')?.value || 'konomi-global'), 500);
      setInterval(clk, 1000); clk();
    }

    function clk() { $('clk').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    // =========================================================================
    // WIDGET GALLERY
    // =========================================================================
    function updW() {
      const g = $('wgt'); if (!g) return;
      let html = '';
      for (const [cat, list] of Object.entries(WIDGETS)) {
        html += `<div class="cat"><div class="cat-h">${cat}</div><div class="wg">`;
        html += list.map(w => `<div class="wc ${w.c}" onclick="openWidget(${JSON.stringify(w).replace(/"/g,'&quot;')})"><i>${w.i}</i><span>${w.n}</span></div>`).join('');
        html += '</div></div>';
      }
      g.innerHTML = html;
    }

    window.openWidget = w => {
      const win = $('WV');
      $('VT').innerHTML = `${w.i} ${w.n}`;
      $('vu').value = w.u;
      $('vif').src = w.u;
      O('V');
      tP(`Opened: ${w.n}`, 'i');
    };

    // =========================================================================
    // WINDOW MANAGER
    // =========================================================================
    window.O = k => { const w = $('W' + k); if (!w) return; w.classList.add('o'); open.add(k); F(k); updTB(); };
    window.X = k => { const w = $('W' + k); if (!w) return; w.classList.remove('o', 'm'); open.delete(k); if (active === k) active = null; if (k === 'V') $('vif').src = ''; updTB(); };
    window.N = k => $('W' + k)?.classList.remove('o');
    window.M = k => $('W' + k)?.classList.toggle('m');
    window.F = k => { for (const a of Object.keys(APPS)) $('W' + a)?.classList.remove('a'); const w = $('W' + k); if (w) { w.classList.add('a'); w.style.zIndex = ++zIdx; } active = k; updTB(); };
    window.D = (e, k) => { if (e.target.tagName === 'BUTTON') return; const w = $('W' + k); if (w.classList.contains('m')) return; drag = { w, sx: e.clientX, sy: e.clientY, ox: w.offsetLeft, oy: w.offsetTop }; F(k); };
    window.SM = () => $('SM').classList.toggle('o');
    window.RC = () => join($('ri')?.value || 'konomi-global');

    document.addEventListener('mousemove', e => { if (!drag) return; drag.w.style.left = (drag.ox + e.clientX - drag.sx) + 'px'; drag.w.style.top = (drag.oy + e.clientY - drag.sy) + 'px'; });
    document.addEventListener('mouseup', () => drag = null);
    document.addEventListener('click', e => { if (!e.target.closest('.SM') && !e.target.closest('.Ts')) $('SM').classList.remove('o'); });

    function updTB() {
      $('Ta').innerHTML = [...open].map(k => {
        const app = APPS[k] || { i: '🌐', n: 'Viewer' };
        return `<div class="${active === k ? 'a' : ''}" onclick="O('${k}')">${app.i} ${app.n}</div>`;
      }).join('');
    }

    // =========================================================================
    // TERMINAL
    // =========================================================================
    function tP(t, c = 'o') { const l = document.createElement('div'); l.className = 'l ' + c; l.textContent = t; $('trm')?.appendChild(l); $('trm').scrollTop = 1e6; }
    function runCmd() { const v = $('ci').value.trim(); if (!v) return; $('ci').value = ''; tP('$ ' + v, 'p'); const [c, ...a] = v.split(' '); const r = CMDS[c]?.(a); if (r) tP(r); else if (c) tP('Unknown: ' + c, 'e'); }

    // =========================================================================
    // CHAT
    // =========================================================================
    function addMsg(id, n, e, t, sys) {
      const me = id === ME.id;
      const d = document.createElement('div');
      d.className = 'm' + (me ? ' s' : '');
      d.innerHTML = sys ? `<div class="mb sys">${esc(t)}</div>` : `<div class="mt">${esc(e)} ${esc(n)}</div><div class="mb">${esc(t)}</div>`;
      $('chm')?.appendChild(d);
      $('chm').scrollTop = 1e6;
    }
    window.sC = () => { const t = $('chi')?.value.trim(); if (!t) return; $('chi').value = ''; bc({ t: 'c', m: t }); addMsg(ME.id, ME.n, ME.e, t); };

    // =========================================================================
    // FILES
    // =========================================================================
    function updF() {
      const l = $('fll'); if (!l) return;
      if (!files.size) { l.innerHTML = '<div class="emp">No files</div>'; return; }
      l.innerHTML = [...files].map(([p, f]) => `<div class="fi" onclick="tP('$ cat ${p}','p');tP('${esc(f.c).replace(/'/g,"\\'")}');O('T')"><span>📄</span><span style="flex:1">${esc(p)}</span><span style="color:#64748b;font-size:9px">${f.c?.length||0}b</span></div>`).join('');
    }
    window.nF = () => { const n = $('nfn')?.value.trim(); if (!n) return; $('nfn').value = ''; const c = prompt('Content:') || '', p = '/' + n.replace(/^\//,''); files.set(p, { c, o: ME.id }); updF(); bc({ t: 'f', p, c, o: ME.id }); tP('Created ' + p, 'i'); };

    // =========================================================================
    // PEERS
    // =========================================================================
    function updP() {
      const g = $('prs'); if (!g) return;
      g.innerHTML = `<div class="pc s"><div class="av">${ME.e}</div><div class="pi"><div class="pn">${esc(ME.n)} (you)</div><div class="pid">${ME.id.slice(0,12)}…</div></div></div>` +
        [...peers].map(([id, p]) => `<div class="pc"><div class="av">${esc(p.e)}</div><div class="pi"><div class="pn">${esc(p.n)}</div><div class="pid">${id.slice(0,12)}…</div></div></div>`).join('');
      $('pc').textContent = peers.size + 1;
    }

    // =========================================================================
    // P2P (WebTorrent Tracker - Global)
    // =========================================================================
    const TRK = 'wss://tracker.openwebtorrent.com';
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function h2(n) { const d = new TextEncoder().encode('konomi:' + n); const h = await crypto.subtle.digest('SHA-1', d); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join(''); }

    async function mkOff(n) {
      const offs = [];
      for (let i = 0; i < n; i++) {
        const pc = new RTCPeerConnection(ICE), dc = pc.createDataChannel('m'), oid = crypto.randomUUID();
        await new Promise(r => { pc.onicecandidate = e => { if (!e.candidate) r(); }; pc.createOffer().then(o => pc.setLocalDescription(o)); });
        offs.push({ offer_id: oid, offer: { type: 'offer', sdp: pc.localDescription.sdp } });
        pending.set(oid, { pc, dc }); setupPC(pc, dc, oid);
      }
      return offs;
    }

    function setupPC(pc, dc, id) {
      dc.onopen = () => {
        dcs.set(id, dc);
        if (!peers.has(id)) { peers.set(id, { n: id.slice(0,10), e: '🌐' }); updP(); addMsg(null, null, null, '🌐 ' + id.slice(0,8) + ' joined', true); }
        for (const [p, f] of files) dc.send(JSON.stringify({ t: 'f', p, c: f.c, o: f.o }));
        dc.send(JSON.stringify({ t: 'a', n: ME.n, e: ME.e }));
        tP('Peer: ' + id.slice(0,8), 'i');
      };
      dc.onclose = () => { dcs.delete(id); if (peers.has(id)) { const p = peers.get(id); addMsg(null, null, null, p.e + ' ' + p.n + ' left', true); peers.delete(id); updP(); } };
      dc.onmessage = e => {
        try {
          const m = JSON.parse(e.data); if (m.sid === ME.id) return;
          if (m.t === 'c') { const p = peers.get(m.sid) || { n: m.sid?.slice(0,10), e: '🌐' }; addMsg(m.sid, p.n, p.e, m.m); }
          else if (m.t === 'f') { files.set(m.p, { c: m.c, o: m.o }); updF(); }
          else if (m.t === 'a' && !peers.has(m.sid)) { peers.set(m.sid, { n: m.n || m.sid?.slice(0,10), e: m.e || '🌐' }); updP(); }
        } catch {}
      };
    }

    async function hOff(m) {
      const pc = new RTCPeerConnection(ICE);
      pc.ondatachannel = e => setupPC(pc, e.channel, m.peer_id);
      await pc.setRemoteDescription(m.offer);
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      await new Promise(r => { if (pc.iceGatheringState === 'complete') r(); else pc.onicecandidate = e => { if (!e.candidate) r(); }; });
      ws.send(JSON.stringify({ action: 'announce', info_hash: hash, peer_id: ME.id, to_peer_id: m.peer_id, answer: { type: 'answer', sdp: pc.localDescription.sdp }, offer_id: m.offer_id }));
    }

    async function hAns(m) { const p = pending.get(m.offer_id); if (p) await p.pc.setRemoteDescription(m.answer); }

    function bc(m) { m.sid = ME.id; const d = JSON.stringify(m); for (const dc of dcs.values()) if (dc.readyState === 'open') dc.send(d); }

    function setSt(s) {
      const d = $('cd'), cs = $('cs'), cst = $('cst');
      d.className = 'd'; cs.textContent = cst.textContent = s === 1 ? 'Online' : s === 2 ? 'Connecting…' : 'Offline';
      if (s === 1) d.classList.add('on'); else if (s === 2) d.classList.add('c');
    }

    async function join(r) {
      if (ws) ws.close(); dcs.clear(); pending.clear(); peers.clear();
      room = r; hash = await h2(r); setSt(2); tP('Joining: ' + r, 'i');
      const offs = await mkOff(5);
      ws = new WebSocket(TRK);
      ws.onopen = () => { setSt(1); tP('Connected to global mesh!', 'i'); addMsg(null, null, null, 'Room: ' + r, true); ws.send(JSON.stringify({ action: 'announce', info_hash: hash, peer_id: ME.id, numwant: 10, uploaded: 0, downloaded: 0, left: 1, offers: offs })); };
      ws.onmessage = async e => { try { const m = JSON.parse(e.data); if (m.offer && m.peer_id !== ME.id) await hOff(m); if (m.answer && m.offer_id) await hAns(m); if (m.interval) setTimeout(async () => { if (ws?.readyState === 1) { const o = await mkOff(5); ws.send(JSON.stringify({ action: 'announce', info_hash: hash, peer_id: ME.id, numwant: 10, offers: o })); } }, m.interval * 1000); } catch {} };
      ws.onerror = () => { tP('Error', 'e'); setSt(0); };
      ws.onclose = () => { tP('Reconnecting…', 'i'); setSt(2); setTimeout(() => join(room), 5000); };
      updP(); updF();
    }

    // =========================================================================
    // STORAGE
    // =========================================================================
    try { const s = localStorage.getItem('kos6-files'); if (s) for (const [k, v] of JSON.parse(s)) files.set(k, v); } catch {}
    setInterval(() => { try { localStorage.setItem('kos6-files', JSON.stringify([...files])); } catch {} }, 5000);

    // =========================================================================
    // INIT
    // =========================================================================
    init();
  </script>
</body>
</html>
