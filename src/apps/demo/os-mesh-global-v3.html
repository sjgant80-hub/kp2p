<!DOCTYPE html>
<!--
@file src/demo/os-mesh-global-v3.html
@desc P2P OS Mesh v3 - True global P2P via WebTorrent tracker
      Connects across browsers/devices worldwide
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P OS Mesh v3 - Global</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --green: #3fb950;
      --purple: #a371f7;
      --border: #30363d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 12px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header h1 { font-size: 1.2rem; color: var(--accent); }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.green { background: #23883433; color: var(--green); }
    .badge.purple { background: #a371f733; color: var(--purple); }
    .room-input {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .room-input input {
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      width: 120px;
    }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--bg3); color: #fff; }

    .stats {
      display: flex;
      gap: 16px;
      margin-left: auto;
      font-size: 12px;
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-val { color: var(--accent); font-weight: bold; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .dot.on { background: var(--green); }
    .dot.connecting { background: #f97316; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }

    .panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Terminal */
    .terminal {
      flex: 1;
      background: #000;
      padding: 12px;
      overflow-y: auto;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .terminal .line { margin-bottom: 2px; }
    .terminal .prompt { color: var(--green); }
    .terminal .output { color: #8b949e; }
    .terminal .error { color: #f85149; }
    .terminal .info { color: var(--accent); }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .input-row input {
      flex: 1;
      padding: 8px 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    /* Chat */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .chat-msg { margin-bottom: 12px; }
    .chat-msg.self .chat-bubble { background: var(--accent); color: #000; margin-left: auto; }
    .chat-meta { font-size: 11px; color: #666; margin-bottom: 4px; }
    .chat-msg.self .chat-meta { text-align: right; }
    .chat-bubble {
      display: inline-block;
      max-width: 80%;
      padding: 8px 12px;
      background: var(--bg2);
      border-radius: 12px;
      font-size: 13px;
    }
    .chat-bubble.system { background: transparent; color: #666; font-style: italic; }

    /* Peers */
    .peer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      padding: 12px;
      overflow-y: auto;
    }
    .peer-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .peer-card.self { border-color: var(--green); }
    .peer-avatar { font-size: 24px; margin-bottom: 6px; }
    .peer-name { font-size: 11px; color: var(--accent); }

    /* Files */
    .file-list { flex: 1; overflow-y: auto; padding: 12px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--bg2);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .file-item:hover { background: var(--bg3); }

    .empty-state { color: #666; font-size: 12px; text-align: center; padding: 20px; }

    @media (max-width: 800px) {
      .main { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
      .stats { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌍 P2P OS Mesh</h1>
    <span class="badge green">v3</span>
    <span class="badge purple">WebRTC Global</span>
    <div class="room-input">
      <span style="font-size:11px;color:#888">Room:</span>
      <input type="text" id="roomInput" value="konomi-global" placeholder="room name">
      <button class="btn btn-primary" id="joinBtn">Join</button>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="dot" id="connDot"></span>
        <span id="connStatus">Not connected</span>
      </div>
      <div class="stat">
        <span>👥</span>
        <span class="stat-val" id="peerCount">0</span>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- Terminal -->
    <div class="panel">
      <div class="panel-header">
        <span>💻</span> Terminal
        <span style="margin-left:auto;color:#666;font-size:11px" id="myId"></span>
      </div>
      <div class="panel-body">
        <div class="terminal" id="terminal"></div>
        <div class="input-row">
          <input type="text" id="cmdInput" placeholder="Type command...">
          <button class="btn btn-primary">Run</button>
        </div>
      </div>
    </div>

    <!-- Chat -->
    <div class="panel">
      <div class="panel-header">
        <span>💬</span> Global Chat
      </div>
      <div class="panel-body">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="input-row">
          <input type="text" id="chatInput" placeholder="Type message...">
          <button class="btn btn-primary" id="sendChatBtn">Send</button>
        </div>
      </div>
    </div>

    <!-- Peers -->
    <div class="panel">
      <div class="panel-header">
        <span>👥</span> Connected Peers
      </div>
      <div class="panel-body">
        <div class="peer-grid" id="peerGrid">
          <div class="empty-state">Connecting...</div>
        </div>
      </div>
    </div>

    <!-- Files -->
    <div class="panel">
      <div class="panel-header">
        <span>📁</span> Shared Files
        <button class="btn btn-secondary" style="margin-left:auto;font-size:10px" id="newFileBtn">+ New</button>
      </div>
      <div class="panel-body">
        <div class="file-list" id="fileList">
          <div class="empty-state">No files yet</div>
        </div>
      </div>
    </div>
  </div>

  <!-- WebTorrent Tracker P2P -->
  <script type="module">
    const $ = id => document.getElementById(id);

    // WebTorrent tracker for reliable global P2P
    const TRACKER = 'wss://tracker.openwebtorrent.com';
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    const NUM_OFFERS = 5;

    // State
    let ws = null;
    let infoHash = null;
    let currentRoom = '';
    const peers = new Map();
    const sharedFiles = new Map();
    const chatHistory = [];
    let dataChannels = new Map();
    let pendingOffers = new Map();

    // Identity - 20 bytes for WebTorrent compatibility
    const myId = '-KM0001-' + Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => b.toString(16).padStart(2,'0')).join('');
    const myName = myId.slice(0, 12);
    const myEmoji = ['😀','😎','🤖','👾','🦊','🐱','🐶','🦁','🐼','🐨','🦋','🌟'][Math.floor(Math.random() * 12)];
    $('myId').textContent = myId;

    // Terminal
    function termPrint(text, type = 'output') {
      const line = document.createElement('div');
      line.className = `line ${type}`;
      line.textContent = text;
      $('terminal').appendChild(line);
      $('terminal').scrollTop = $('terminal').scrollHeight;
    }

    // Chat
    function addChatMsg(userId, name, emoji, text, isSystem = false) {
      const isSelf = userId === myId;
      const div = document.createElement('div');
      div.className = `chat-msg ${isSelf ? 'self' : ''}`;

      if (isSystem) {
        div.innerHTML = `<div class="chat-bubble system">${escapeHtml(text)}</div>`;
      } else {
        div.innerHTML = `
          <div class="chat-meta">${escapeHtml(emoji)} ${escapeHtml(name)}</div>
          <div class="chat-bubble">${escapeHtml(text)}</div>
        `;
      }

      $('chatMessages').appendChild(div);
      $('chatMessages').scrollTop = $('chatMessages').scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Convert room name to 20-byte info_hash (hex)
    async function roomToHash(name) {
      const data = new TextEncoder().encode('konomi:' + name);
      const hash = await crypto.subtle.digest('SHA-1', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Generate WebRTC offers upfront
    async function generateOffers(count) {
      const offers = [];
      for (let i = 0; i < count; i++) {
        const pc = new RTCPeerConnection(ICE);
        const dc = pc.createDataChannel('mesh');
        const offerId = crypto.randomUUID();

        await new Promise(resolve => {
          pc.onicecandidate = e => { if (!e.candidate) resolve(); };
          pc.createOffer().then(o => pc.setLocalDescription(o));
        });

        offers.push({
          offer_id: offerId,
          offer: { type: 'offer', sdp: pc.localDescription.sdp }
        });
        pendingOffers.set(offerId, { pc, dc });
        setupPeerConnection(pc, dc, offerId);
      }
      return offers;
    }

    function setupPeerConnection(pc, dc, id) {
      dc.onopen = () => {
        termPrint(`WebRTC peer connected: ${id.slice(0,8)}`, 'info');
        dataChannels.set(id, dc);
        if (!peers.has(id)) {
          peers.set(id, { name: id.slice(0,12), emoji: '🌐', webrtc: true });
          updatePeers();
          addChatMsg(null, null, null, `🌐 Peer ${id.slice(0,8)} connected`, true);
        }
        // Send our files to new peer
        for (const [path, file] of sharedFiles) {
          dc.send(JSON.stringify({ type: 'file', senderId: myId, path, content: file.content, owner: file.owner }));
        }
        // Send announce with our info
        dc.send(JSON.stringify({ type: 'announce', senderId: myId, name: myName, emoji: myEmoji }));
      };
      dc.onclose = () => {
        dataChannels.delete(id);
        if (peers.has(id)) {
          const peer = peers.get(id);
          addChatMsg(null, null, null, `${peer.emoji} ${peer.name} disconnected`, true);
          peers.delete(id);
          updatePeers();
        }
      };
      dc.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.senderId === myId) return;

          switch (msg.type) {
            case 'chat':
              const peer = peers.get(msg.senderId) || { name: msg.senderId.slice(0,12), emoji: '🌐' };
              addChatMsg(msg.senderId, peer.name, peer.emoji, msg.text);
              break;
            case 'file':
              sharedFiles.set(msg.path, { content: msg.content, owner: msg.owner });
              updateFiles();
              break;
            case 'announce':
              if (!peers.has(msg.senderId)) {
                peers.set(msg.senderId, { name: msg.name || msg.senderId.slice(0,12), emoji: msg.emoji || '🌐', webrtc: true });
                updatePeers();
              }
              break;
          }
        } catch (err) {
          console.error('WebRTC message error:', err);
        }
      };
    }

    async function handleOffer(msg) {
      const pc = new RTCPeerConnection(ICE);
      const peerId = msg.peer_id;

      pc.ondatachannel = e => {
        const dc = e.channel;
        setupPeerConnection(pc, dc, peerId);
      };

      await pc.setRemoteDescription(msg.offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') resolve();
        else pc.onicecandidate = e => { if (!e.candidate) resolve(); };
      });

      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: myId,
        to_peer_id: peerId,
        answer: { type: 'answer', sdp: pc.localDescription.sdp },
        offer_id: msg.offer_id
      }));
    }

    async function handleAnswer(msg) {
      const pending = pendingOffers.get(msg.offer_id);
      if (!pending) return;
      const { pc, dc } = pending;
      await pc.setRemoteDescription(msg.answer);
    }

    async function reannounce() {
      if (ws?.readyState !== 1) return;
      const offers = await generateOffers(NUM_OFFERS);
      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: myId,
        numwant: 10,
        offers: offers
      }));
    }

    // Broadcast to all WebRTC peers
    function broadcastToWebRTC(msg) {
      const data = JSON.stringify(msg);
      for (const dc of dataChannels.values()) {
        if (dc.readyState === 'open') dc.send(data);
      }
    }

    // Update peers display
    function updatePeers() {
      const grid = $('peerGrid');
      grid.innerHTML = '';

      // Add self first
      const selfCard = document.createElement('div');
      selfCard.className = 'peer-card self';
      selfCard.innerHTML = `
        <div class="peer-avatar">${escapeHtml(myEmoji)}</div>
        <div class="peer-name">${escapeHtml(myName)} (you)</div>
      `;
      grid.appendChild(selfCard);

      // Add other peers
      for (const [id, peer] of peers) {
        if (id === myId) continue;
        const card = document.createElement('div');
        card.className = 'peer-card';
        card.innerHTML = `
          <div class="peer-avatar">${escapeHtml(peer.emoji)}</div>
          <div class="peer-name">${escapeHtml(peer.name)}</div>
        `;
        grid.appendChild(card);
      }

      $('peerCount').textContent = peers.size + 1; // +1 for self
    }

    // Update files display
    function updateFiles() {
      const list = $('fileList');

      if (sharedFiles.size === 0) {
        list.innerHTML = '<div class="empty-state">No files yet</div>';
        return;
      }

      list.innerHTML = '';
      for (const [path, file] of sharedFiles) {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span>📄</span>
          <span style="flex:1">${escapeHtml(path)}</span>
          <span style="color:#666;font-size:10px">${file.content?.length || 0}b</span>
        `;
        div.onclick = () => {
          termPrint(`$ cat ${path}`, 'prompt');
          termPrint(file.content || '(empty)');
        };
        list.appendChild(div);
      }
    }

    // Join room via WebTorrent tracker
    async function joinRoom(roomName) {
      // Cleanup existing connections
      if (ws) {
        ws.close();
      }
      dataChannels.clear();
      pendingOffers.clear();
      peers.clear();

      currentRoom = roomName;
      infoHash = await roomToHash(roomName);

      $('connDot').className = 'dot connecting';
      $('connStatus').textContent = 'Connecting...';
      termPrint(`Joining room: ${roomName}`, 'info');

      const offers = await generateOffers(NUM_OFFERS);

      ws = new WebSocket(TRACKER);

      ws.onopen = () => {
        termPrint('Connected to WebTorrent tracker!', 'info');
        $('connDot').className = 'dot on';
        $('connStatus').textContent = 'Connected';
        addChatMsg(null, null, null, `Connected to room: ${roomName}`, true);

        ws.send(JSON.stringify({
          action: 'announce',
          info_hash: infoHash,
          peer_id: myId,
          numwant: 10,
          uploaded: 0,
          downloaded: 0,
          left: 1,
          offers: offers
        }));
      };

      ws.onmessage = async (e) => {
        try {
          const msg = JSON.parse(e.data);

          if (msg.offer && msg.peer_id !== myId) {
            termPrint(`Offer from ${msg.peer_id.slice(0,8)}`, 'info');
            await handleOffer(msg);
          }

          if (msg.answer && msg.offer_id) {
            await handleAnswer(msg);
          }

          if (msg.interval) {
            setTimeout(() => reannounce(), msg.interval * 1000);
          }
        } catch (err) {
          console.error('Tracker message error:', err);
        }
      };

      ws.onerror = () => {
        termPrint('Tracker connection error', 'error');
        $('connDot').className = 'dot';
        $('connStatus').textContent = 'Error';
      };

      ws.onclose = () => {
        termPrint('Tracker disconnected - reconnecting...', 'info');
        $('connDot').className = 'dot connecting';
        $('connStatus').textContent = 'Reconnecting...';
        setTimeout(() => joinRoom(currentRoom), 5000);
      };

      updatePeers();
      updateFiles();
    }

    // Commands
    const commands = {
      help: () => `Commands:
  help - Show this help
  whoami - Show your ID
  peers - List connected peers
  room - Show current room
  ls - List shared files
  cat <file> - View file
  write <file> <content> - Create file
  clear - Clear terminal`,
      whoami: () => `${myEmoji} ${myId}`,
      peers: () => {
        const list = [`${myEmoji} ${myName} (you)`];
        for (const [id, peer] of peers) {
          list.push(`${peer.emoji} ${peer.name}`);
        }
        return list.join('\n');
      },
      room: () => currentRoom || $('roomInput').value,
      ls: () => sharedFiles.size ? [...sharedFiles.keys()].join('\n') : '(no files)',
      cat: (args) => {
        const path = args[0];
        if (!path) return 'Usage: cat <file>';
        const file = sharedFiles.get(path) || sharedFiles.get('/' + path);
        return file ? file.content : 'File not found';
      },
      write: (args) => {
        const path = args[0];
        const content = args.slice(1).join(' ');
        if (!path) return 'Usage: write <file> <content>';
        const fullPath = path.startsWith('/') ? path : '/' + path;
        const file = { content, owner: myId };
        sharedFiles.set(fullPath, file);
        updateFiles();
        broadcastToWebRTC({ type: 'file', senderId: myId, path: fullPath, content, owner: myId });
        return `Created ${fullPath}`;
      },
      clear: () => { $('terminal').innerHTML = ''; return ''; },
    };

    function runCommand() {
      const input = $('cmdInput').value.trim();
      if (!input) return;
      $('cmdInput').value = '';

      termPrint(`$ ${input}`, 'prompt');
      const [cmd, ...args] = input.split(' ');

      if (commands[cmd]) {
        const result = commands[cmd](args);
        if (result) termPrint(result);
      } else {
        termPrint(`Unknown command: ${cmd}`, 'error');
      }
    }

    // Send chat
    function sendChat() {
      const text = $('chatInput').value.trim();
      if (!text) return;
      $('chatInput').value = '';

      broadcastToWebRTC({ type: 'chat', senderId: myId, text });
      addChatMsg(myId, myName, myEmoji, text);
    }

    // New file
    $('newFileBtn').onclick = () => {
      const name = prompt('File name:');
      if (!name) return;
      const content = prompt('Content:') || '';
      const path = '/' + name.replace(/^\//, '');
      const file = { content, owner: myId };
      sharedFiles.set(path, file);
      updateFiles();
      broadcastToWebRTC({ type: 'file', senderId: myId, path, content, owner: myId });
      termPrint(`Created ${path}`, 'info');
    };

    // Load saved files from localStorage
    try {
      const saved = localStorage.getItem('os-mesh-v3-files');
      if (saved) {
        for (const [k, v] of JSON.parse(saved)) {
          sharedFiles.set(k, v);
        }
        updateFiles();
      }
    } catch (e) {}

    // Auto-save files periodically
    setInterval(() => {
      try {
        localStorage.setItem('os-mesh-v3-files', JSON.stringify([...sharedFiles]));
      } catch (e) {}
    }, 5000);

    // Event handlers
    $('joinBtn').onclick = () => joinRoom($('roomInput').value.trim() || 'konomi-global');
    $('cmdInput').onkeydown = (e) => { if (e.key === 'Enter') runCommand(); };
    $('chatInput').onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };
    $('sendChatBtn').onclick = sendChat;

    // Init
    termPrint('Welcome to P2P OS Mesh v3 - Global Edition!', 'info');
    termPrint('Using WebTorrent tracker for reliable global P2P.', 'info');
    termPrint("Type 'help' for commands.", 'info');
    termPrint('', 'output');

    updatePeers();
    updateFiles();

    // Auto-join default room
    setTimeout(() => {
      joinRoom($('roomInput').value.trim() || 'konomi-global');
    }, 500);
  </script>
</body>
</html>
