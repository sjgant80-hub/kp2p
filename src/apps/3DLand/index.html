<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DLand - P2P Printer Network</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui; background: #1a1a2e; color: #eee; min-height: 100vh; }
    .header { background: #16213e; padding: 12px 20px; display: flex; gap: 20px; align-items: center; }
    .header h1 { font-size: 18px; color: #4ade80; }
    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
    .status.connecting { background: #f59e0b; }
    .status.open { background: #22c55e; }
    .status.closed { background: #ef4444; }
    .main { display: flex; height: calc(100vh - 50px); }
    .sidebar { width: 280px; background: #0f0f23; padding: 12px; overflow-y: auto; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .btn { background: #4f46e5; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #6366f1; }
    .btn-scan { background: #059669; }
    .btn-scan:hover { background: #10b981; }
    .printer-card { background: #1e1e3f; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .printer-card h3 { font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .printer-card .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.online { background: #22c55e; }
    .dot.offline { background: #666; }
    .printer-card .info { font-size: 12px; color: #888; }
    .printer-card .temps { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; }
    .temps span { display: flex; align-items: center; gap: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .users { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .user { padding: 4px 10px; border-radius: 12px; font-size: 12px; }
    .chat { background: #0f0f23; border-radius: 8px; height: 200px; display: flex; flex-direction: column; }
    .msgs { flex: 1; overflow-y: auto; padding: 8px; font-size: 13px; }
    .msg { margin-bottom: 4px; }
    .input-row { display: flex; gap: 6px; padding: 8px; }
    .input-row input { flex: 1; background: #1e1e3f; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 4px; }
    .log { background: #111; padding: 8px; font: 11px monospace; color: #4ade80; max-height: 120px; overflow-y: auto; border-radius: 4px; margin-top: 8px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; display: none; }
    .modal.show { display: flex; }
    .modal-box { background: #1e1e3f; padding: 24px; border-radius: 12px; min-width: 320px; }
    .modal-box h3 { margin-bottom: 16px; }
    .modal-box input { width: 100%; background: #0f0f23; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    .modal-box input:focus { outline: 2px solid #4f46e5; border-color: #4f46e5; }
    .modal-box input { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
<div class="header">
  <h1>🖨️ 3DLand</h1>
  <div id="status" class="status connecting">Connecting...</div>
  <span id="peer-count" style="font-size:12px;color:#888">0 peers</span>
</div>

<div class="main">
  <div class="sidebar">
    <div class="section">
      <div class="section-title">Add Printer</div>
      <input type="text" id="inp-ip" placeholder="IP (e.g. 192.168.1.100)" style="width:100%;margin-bottom:6px;background:#1e1e3f;border:1px solid #333;color:#fff;padding:6px;border-radius:4px;">
      <select id="sel-model" style="width:100%;margin-bottom:6px;background:#1e1e3f;border:1px solid #333;color:#fff;padding:6px;border-radius:4px;">
        <option value="Ender3">Ender 3</option>
        <option value="Ender3V2">Ender 3 V2</option>
        <option value="Ender5">Ender 5</option>
        <option value="CR10">CR-10</option>
        <option value="K1">K1</option>
      </select>
      <button class="btn btn-scan" id="btn-add" style="width:100%">➕ Add Printer</button>
    </div>
    <div class="section">
      <div class="section-title">My Printers</div>
      <div id="my-printers"></div>
    </div>
    <div class="section">
      <div class="section-title">Shared by Peers</div>
      <div id="peer-printers"></div>
    </div>
    <div class="section">
      <div class="section-title">Online Users</div>
      <div id="users" class="users"></div>
    </div>
    <div class="section">
      <div class="section-title">Chat</div>
      <div class="chat">
        <div id="msgs" class="msgs"></div>
        <div class="input-row">
          <input type="text" id="chat-input" placeholder="Message...">
          <button class="btn" id="btn-send">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="section-title">All Printers</div>
    <div id="printer-grid" class="grid"></div>
    <div class="section-title" style="margin-top:20px">Scan Log</div>
    <div id="log" class="log">Ready to scan...</div>
  </div>
</div>

<div id="modal" class="modal show">
  <div class="modal-box">
    <h3>Join 3DLand Network</h3>
    <input type="text" id="inp-name" placeholder="Your name">
    <input type="text" id="inp-room" placeholder="Room (e.g. workshop)" value="3dland">
    <script>setTimeout(() => document.getElementById('inp-name').focus(), 100)</script>
    <button class="btn" id="btn-join" style="width:100%">Join</button>
  </div>
</div>

<script type="module">
import { mesh } from '../../p2p/mesh.js'
import { testPrinter, PORTS } from './scanner.js'
import { Ender3, Ender3V2, Ender5, CR10, K1, models } from './printers/creality.js'

const $ = id => document.getElementById(id)

let name = '', net, printers = new Map(), peers = new Map()

// UI helpers
const log = (msg) => {
  const el = $('log')
  el.textContent += '\n' + msg
  el.scrollTop = el.scrollHeight
}

const addMsg = (from, text, sys) => {
  const m = document.createElement('div')
  m.className = 'msg'
  m.textContent = sys ? text : `${from}: ${text}`
  $('msgs').append(m)
  $('msgs').scrollTop = $('msgs').scrollHeight
}

const renderPrinter = (p, owner) => {
  const card = document.createElement('div')
  card.className = 'printer-card'
  card.innerHTML = `
    <h3><span class="dot ${p.status}"></span>${p.name}</h3>
    <div class="info">${p.brand} ${p.model} • ${p.ip || 'No IP'}</div>
    <div class="info">Bed: ${p.bed.x}×${p.bed.y}×${p.bed.z}mm</div>
    <div class="temps">
      <span>🔥 Nozzle: ${p.temp.nozzle}°C</span>
      <span>🛏️ Bed: ${p.temp.bed}°C</span>
    </div>
    ${owner ? `<div class="info" style="margin-top:6px">Owner: ${owner}</div>` : ''}
  `
  return card
}

const refreshUI = () => {
  // My printers
  const myEl = $('my-printers')
  myEl.innerHTML = ''
  printers.forEach(p => myEl.append(renderPrinter(p)))

  // Peer printers
  const peerEl = $('peer-printers')
  peerEl.innerHTML = ''
  peers.forEach((data, peerId) => {
    (data.printers || []).forEach(p => peerEl.append(renderPrinter(p, data.name)))
  })

  // Grid
  const grid = $('printer-grid')
  grid.innerHTML = ''
  printers.forEach(p => grid.append(renderPrinter(p)))
  peers.forEach((data, peerId) => {
    (data.printers || []).forEach(p => grid.append(renderPrinter(p, data.name)))
  })

  // Users
  const usersEl = $('users')
  usersEl.innerHTML = ''
  peers.forEach((data, id) => {
    const u = document.createElement('span')
    u.className = 'user'
    u.style.background = data.color || '#4f46e5'
    u.textContent = data.name
    usersEl.append(u)
  })
  $('peer-count').textContent = `${peers.size} peer${peers.size !== 1 ? 's' : ''}`
}

// Add Printer
$('btn-add').onclick = async () => {
  const ip = $('inp-ip').value.trim()
  if (!ip) { log('Enter printer IP'); return }

  const modelName = $('sel-model').value
  const factory = models[modelName] || Ender3

  log(`Adding ${modelName} at ${ip}...`)
  const p = factory(ip)
  p.status = 'offline'

  // Test connection
  const result = await testPrinter(ip, p.port, log)
  if (result) {
    p.status = 'online'
    log(`✓ ${p.name} connected!`)
  } else {
    log(`⚠️ Added ${p.name} (offline - check IP/network)`)
  }

  printers.set(ip, p)
  net?.send({ t: 'printers', printers: [...printers.values()] })
  refreshUI()
  $('inp-ip').value = ''
}

// Chat
$('btn-send').onclick = () => {
  const text = $('chat-input').value.trim()
  if (text) {
    addMsg(name, text)
    net?.send({ t: 'chat', name, text })
    $('chat-input').value = ''
  }
}
$('chat-input').onkeydown = e => e.key === 'Enter' && $('btn-send').click()

// Join
$('btn-join').onclick = () => {
  name = $('inp-name').value.trim() || 'Anon'
  const room = $('inp-room').value.trim() || '3dland'
  $('modal').classList.remove('show')
  startP2P(room)
}
$('inp-name').onkeydown = e => e.key === 'Enter' && $('btn-join').click()
$('inp-room').onkeydown = e => e.key === 'Enter' && $('btn-join').click()

function startP2P(room) {
  const color = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')

  net = mesh(room, {
    log: log,
    open: () => {
      $('status').className = 'status open'
      $('status').textContent = 'Connected'
      net.send({ t: 'join', name, color, printers: [...printers.values()] })
      addMsg('', 'Connected to ' + room, true)
    },
    close: () => {
      $('status').className = 'status closed'
      $('status').textContent = 'Disconnected'
    },
    message: (msg, from) => {
      if (msg.t === 'join') {
        peers.set(from, { name: msg.name, color: msg.color, printers: msg.printers || [] })
        addMsg('', `${msg.name} joined`, true)
        // Send our printers back
        net.send({ t: 'printers', name, printers: [...printers.values()] })
      } else if (msg.t === 'printers') {
        const peer = peers.get(from) || { name: msg.name || 'Peer', color: '#888' }
        peer.printers = msg.printers || []
        peers.set(from, peer)
      } else if (msg.t === 'chat') {
        addMsg(msg.name, msg.text)
      } else if (msg.t === 'leave') {
        const peer = peers.get(from)
        if (peer) addMsg('', `${peer.name} left`, true)
        peers.delete(from)
      }
      refreshUI()
    },
    peer_left: (id) => {
      const peer = peers.get(id)
      if (peer) addMsg('', `${peer.name} left`, true)
      peers.delete(id)
      refreshUI()
    }
  })
  net.connect()
}
</script>
</body>
</html>
