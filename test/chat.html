<!DOCTYPE html>
<!--
@file test/chat.html
@desc Default chat room - open in 2 tabs to test P2P
@size ~100 tokens
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P Chat</title>
  <style>
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:system-ui,sans-serif;background:#0a0a1a;color:#fff;height:100vh;display:flex;flex-direction:column }
    .header { padding:16px;background:#12122a;border-bottom:1px solid #fff1;display:flex;align-items:center;gap:12px }
    .status { width:12px;height:12px;border-radius:50%;background:#666 }
    .status.connected { background:#0f0 }
    .peer-count { font-size:12px;color:#888;margin-left:auto }
    .me { font-size:11px;color:#4facfe;font-family:monospace }
    .messages { flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px }
    .msg { max-width:70%;padding:10px 14px;border-radius:12px;font-size:14px }
    .msg.mine { background:#4facfe;color:#000;align-self:flex-end;border-bottom-right-radius:4px }
    .msg.theirs { background:#222;align-self:flex-start;border-bottom-left-radius:4px }
    .msg.system { background:transparent;color:#666;font-size:12px;align-self:center;text-align:center }
    .msg .meta { font-size:10px;opacity:0.7;margin-top:4px }
    .input-area { padding:16px;background:#12122a;border-top:1px solid #fff1;display:flex;gap:12px }
    input { flex:1;padding:12px 16px;border:none;border-radius:24px;background:#222;color:#fff;font-size:14px;outline:none }
    input:focus { background:#333 }
    button { padding:12px 24px;border:none;border-radius:24px;background:#4facfe;color:#000;font-weight:600;cursor:pointer }
    button:hover { opacity:0.9 }
  </style>
</head>
<body>
  <div class="header">
    <div class="status" id="status"></div>
    <span>General Chat</span>
    <span class="me" id="me">...</span>
    <span class="peer-count" id="peers">0 peers</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" />
    <button id="send">Send</button>
  </div>

  <script>
    const ROOM = 'konomi-general-chat'
    const $ = id => document.getElementById(id)
    const myId = 'user-' + Math.random().toString(36).slice(2, 8)
    const channel = new BroadcastChannel('p2p-room-' + ROOM)
    const peers = new Map()

    $('me').textContent = myId

    function addMessage(text, from, isSystem = false) {
      const div = document.createElement('div')
      const isMine = from === myId
      div.className = 'msg ' + (isSystem ? 'system' : isMine ? 'mine' : 'theirs')

      if (isSystem) {
        div.textContent = text
      } else {
        div.innerHTML = `${text}<div class="meta">${isMine ? 'You' : from}</div>`
      }

      $('messages').appendChild(div)
      $('messages').scrollTop = $('messages').scrollHeight
    }

    function updatePeers() {
      const count = peers.size
      $('peers').textContent = count + ' peer' + (count !== 1 ? 's' : '')
      $('status').classList.toggle('connected', count > 0)
    }

    channel.onmessage = (e) => {
      const { type, from, text, ts } = e.data
      if (from === myId) return

      if (type === 'join') {
        if (!peers.has(from)) {
          peers.set(from, ts)
          addMessage(`${from} joined`, null, true)
          updatePeers()
          // Respond with our presence
          channel.postMessage({ type: 'here', from: myId, ts: Date.now() })
        }
      } else if (type === 'here') {
        if (!peers.has(from)) {
          peers.set(from, ts)
          updatePeers()
        }
      } else if (type === 'leave') {
        if (peers.has(from)) {
          peers.delete(from)
          addMessage(`${from} left`, null, true)
          updatePeers()
        }
      } else if (type === 'msg') {
        addMessage(text, from)
      }
    }

    function send() {
      const text = $('input').value.trim()
      if (!text) return
      channel.postMessage({ type: 'msg', from: myId, text, ts: Date.now() })
      addMessage(text, myId)
      $('input').value = ''
    }

    $('send').onclick = send
    $('input').onkeydown = (e) => { if (e.key === 'Enter') send() }

    // Join room
    channel.postMessage({ type: 'join', from: myId, ts: Date.now() })
    addMessage('You joined the chat', null, true)

    // Leave on unload
    window.onbeforeunload = () => {
      channel.postMessage({ type: 'leave', from: myId, ts: Date.now() })
    }

    $('input').focus()
  </script>
</body>
</html>
