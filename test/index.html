<!DOCTYPE html>
<!--
@file test/index.html
@desc Test runner UI - auto-loads all registered suites
@size ~80 tokens
@deps css/runner.css, suites/index.js
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Konomi P2P - Test Runner</title>
  <style>
    :root { --bg:#0a0a1a;--bg2:#12122a;--text:#fff;--pass:#00ff88;--fail:#ff6b6b;--skip:#ffd93d;--mono:'SF Mono',monospace }
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px }
    .header { display:flex;align-items:center;gap:20px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #fff2 }
    .header h1 { font-size:1.5rem }
    .header .state { padding:4px 12px;border-radius:4px;font-size:12px;text-transform:uppercase;background:#333 }
    .header .state.running { background:#4facfe;color:#000 }
    .header .state.passed { background:var(--pass);color:#000 }
    .header .state.failed { background:var(--fail);color:#000 }
    .stats { display:flex;gap:20px;margin-bottom:20px }
    .stat { padding:16px 24px;background:var(--bg2);border-radius:8px;text-align:center }
    .stat-val { font-size:2rem;font-weight:700 }
    .stat-lbl { font-size:12px;color:#888;text-transform:uppercase }
    .stat.pass .stat-val { color:var(--pass) }
    .stat.fail .stat-val { color:var(--fail) }
    .controls { display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap }
    .btn { padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:600;transition:opacity .2s;text-decoration:none;display:inline-block }
    .btn:disabled { opacity:.5;cursor:not-allowed }
    .btn.primary { background:#4facfe;color:#000 }
    .btn.secondary { background:#333;color:#fff }
    .results { background:var(--bg2);border-radius:8px;overflow:hidden }
    .result { display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 16px;border-bottom:1px solid #fff1;font-family:var(--mono);font-size:13px }
    .result:last-child { border:none }
    .result .icon { width:20px;text-align:center }
    .result.pass .icon { color:var(--pass) }
    .result.fail .icon { color:var(--fail) }
    .result .id { flex:1 }
    .result .time { color:#666;font-size:11px }
    .result .error { color:var(--fail);font-size:11px;width:100%;padding:8px 0 0 32px }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧪 Test Runner</h1>
    <span class="state" id="state">loading</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="total">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat pass"><div class="stat-val" id="passed">0</div><div class="stat-lbl">Passed</div></div>
    <div class="stat fail"><div class="stat-val" id="failed">0</div><div class="stat-lbl">Failed</div></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="runBtn" disabled>▶ Run All</button>
    <button class="btn secondary" id="resetBtn">↻ Reset</button>
    <a href="./e2e/dual-client.html" class="btn secondary">🔗 Dual Client</a>
  </div>

  <div class="results" id="results"></div>

  <script type="module">
    import { TestRunner } from './core/runner.js'
    import { suites } from './suites/index.js'

    const $ = id => document.getElementById(id)
    const runner = new TestRunner()

    const updateUI = () => {
      $('state').textContent = runner.state
      $('state').className = 'state ' + runner.state
      const s = runner.stats
      $('total').textContent = s.total
      $('passed').textContent = s.passed
      $('failed').textContent = s.failed
    }

    runner.on('result', r => {
      const div = document.createElement('div')
      div.className = 'result ' + (r.passed ? 'pass' : 'fail')
      div.innerHTML = `
        <span class="icon">${r.passed ? '✓' : '✗'}</span>
        <span class="id">${r.id}</span>
        <span class="time">${r.duration.toFixed(1)}ms</span>
        ${r.error ? `<div class="error">${r.error.message}</div>` : ''}
      `
      $('results').appendChild(div)
      updateUI()
    })

    runner.on('done', () => updateUI())

    async function init() {
      for (const s of suites) {
        await runner.register(s.name, './cases/' + s.name + '.csv', s.run.bind(s))
      }
      $('runBtn').disabled = false
      $('state').textContent = 'ready'
      updateUI()
    }

    $('runBtn').onclick = async () => {
      $('results').innerHTML = ''
      $('runBtn').disabled = true
      await runner.runAll()
      $('runBtn').disabled = false
    }

    $('resetBtn').onclick = () => {
      runner.sm.reset()
      runner.results = []
      $('results').innerHTML = ''
      $('state').textContent = 'ready'
      updateUI()
    }

    init().catch(e => {
      $('state').textContent = 'error'
      console.error('Init failed:', e)
    })
  </script>
</body>
</html>
