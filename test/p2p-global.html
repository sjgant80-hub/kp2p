<!DOCTYPE html>
<!--
@file test/p2p-global.html
@desc Worldwide P2P using WebTorrent tracker protocol
@size ~200 tokens
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P Global Chat</title>
  <style>
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:system-ui,sans-serif;background:#0a0a1a;color:#fff;height:100vh;display:flex;flex-direction:column }
    .header { padding:16px;background:#12122a;border-bottom:1px solid #fff1;display:flex;align-items:center;gap:12px;flex-wrap:wrap }
    .status { width:12px;height:12px;border-radius:50%;background:#666;flex-shrink:0 }
    .status.connecting { background:#f90;animation:pulse 1s infinite }
    .status.connected { background:#0f0 }
    @keyframes pulse { 50% { opacity:0.5 } }
    .room-input { background:#1a1a2e;border:1px solid #333;padding:8px 12px;border-radius:6px;color:#fff;font-size:14px;width:200px }
    .info { font-size:11px;color:#666;margin-left:auto }
    .peer-count { font-size:12px;color:#4facfe }
    .messages { flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px }
    .msg { max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;word-break:break-word }
    .msg.mine { background:#4facfe;color:#000;align-self:flex-end;border-bottom-right-radius:4px }
    .msg.theirs { background:#222;align-self:flex-start;border-bottom-left-radius:4px }
    .msg.system { background:transparent;color:#666;font-size:12px;align-self:center }
    .input-area { padding:16px;background:#12122a;border-top:1px solid #fff1;display:flex;gap:12px }
    input[type=text] { flex:1;padding:12px 16px;border:none;border-radius:24px;background:#222;color:#fff;font-size:14px;outline:none }
    button { padding:12px 24px;border:none;border-radius:24px;background:#4facfe;color:#000;font-weight:600;cursor:pointer }
    button:disabled { opacity:0.5;cursor:not-allowed }
  </style>
</head>
<body>
  <div class="header">
    <div class="status" id="status"></div>
    <input type="text" class="room-input" id="room" placeholder="Room name..." value="konomi-global" />
    <button id="join">Join</button>
    <span class="peer-count" id="peers">0 peers</span>
    <span class="info">WebTorrent Tracker P2P</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Type a message..." disabled />
    <button id="send" disabled>Send</button>
  </div>

  <script type="module">
    const TRACKER = 'wss://tracker.openwebtorrent.com'
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    const NUM_OFFERS = 5

    const $ = id => document.getElementById(id)
    const myId = '-KP0001-' + Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,12)

    let ws = null
    let infoHash = null
    let peers = new Map()
    let dataChannels = new Map()
    let pendingOffers = new Map()

    function log(msg) {
      const div = document.createElement('div')
      div.className = 'msg system'
      div.textContent = msg
      $('messages').appendChild(div)
      $('messages').scrollTop = $('messages').scrollHeight
    }

    function addMessage(text, from, isMine = false) {
      const div = document.createElement('div')
      div.className = 'msg ' + (isMine ? 'mine' : 'theirs')
      div.innerHTML = `${text}<div style="font-size:10px;opacity:0.7;margin-top:4px">${isMine ? 'You' : from.slice(0,8)}</div>`
      $('messages').appendChild(div)
      $('messages').scrollTop = $('messages').scrollHeight
    }

    function updatePeers() {
      const count = dataChannels.size
      $('peers').textContent = count + ' peer' + (count !== 1 ? 's' : '')
      $('status').className = 'status ' + (count > 0 ? 'connected' : ws?.readyState === 1 ? 'connecting' : '')
      $('input').disabled = count === 0
      $('send').disabled = count === 0
    }

    // Convert room name to 20-byte info_hash (hex)
    async function roomToHash(name) {
      const data = new TextEncoder().encode('konomi:' + name)
      const hash = await crypto.subtle.digest('SHA-1', data)
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('')
    }

    // Generate WebRTC offers upfront
    async function generateOffers(count) {
      const offers = []
      for (let i = 0; i < count; i++) {
        const pc = new RTCPeerConnection(ICE)
        const dc = pc.createDataChannel('data')
        const offerId = crypto.randomUUID()

        await new Promise(resolve => {
          pc.onicecandidate = e => { if (!e.candidate) resolve() }
          pc.createOffer().then(o => pc.setLocalDescription(o))
        })

        offers.push({
          offer_id: offerId,
          offer: { type: 'offer', sdp: pc.localDescription.sdp }
        })
        pendingOffers.set(offerId, { pc, dc })
        setupPeerConnection(pc, dc, offerId)
      }
      return offers
    }

    function setupPeerConnection(pc, dc, id) {
      dc.onopen = () => {
        log(`Connected to peer!`)
        dataChannels.set(id, dc)
        updatePeers()
      }
      dc.onclose = () => {
        dataChannels.delete(id)
        peers.delete(id)
        updatePeers()
      }
      dc.onmessage = e => {
        try {
          const msg = JSON.parse(e.data)
          addMessage(msg.text, msg.from)
        } catch {
          addMessage(e.data, id)
        }
      }
    }

    async function joinRoom(roomName) {
      if (ws) ws.close()
      peers.clear()
      dataChannels.clear()
      pendingOffers.clear()
      $('messages').innerHTML = ''

      infoHash = await roomToHash(roomName)
      log(`Joining: ${roomName}`)
      log(`Hash: ${infoHash.slice(0,16)}...`)
      $('status').className = 'status connecting'

      // Generate offers before connecting
      log('Generating offers...')
      const offers = await generateOffers(NUM_OFFERS)
      log(`Created ${offers.length} offers`)

      // Connect to tracker
      ws = new WebSocket(TRACKER)

      ws.onopen = () => {
        log('Connected to tracker')
        // Announce with offers
        ws.send(JSON.stringify({
          action: 'announce',
          info_hash: infoHash,
          peer_id: myId,
          numwant: 10,
          uploaded: 0,
          downloaded: 0,
          left: 1,
          offers: offers
        }))
      }

      ws.onmessage = async (e) => {
        try {
          const msg = JSON.parse(e.data)

          if (msg.offer && msg.peer_id !== myId) {
            // Someone sent us an offer - answer it
            log(`Offer from ${msg.peer_id.slice(0,8)}`)
            await handleOffer(msg)
          }

          if (msg.answer && msg.offer_id) {
            // Got answer to our offer
            log(`Answer received`)
            await handleAnswer(msg)
          }

          if (msg.interval) {
            // Schedule re-announce
            setTimeout(() => reannounce(), msg.interval * 1000)
          }
        } catch (err) {
          console.error('Message error:', err)
        }
      }

      ws.onerror = () => log('Tracker error')
      ws.onclose = () => {
        log('Disconnected from tracker')
        $('status').className = 'status'
      }
    }

    async function reannounce() {
      if (ws?.readyState !== 1) return
      const offers = await generateOffers(NUM_OFFERS)
      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: myId,
        numwant: 10,
        offers: offers
      }))
    }

    async function handleOffer(msg) {
      const pc = new RTCPeerConnection(ICE)
      const peerId = msg.peer_id

      pc.ondatachannel = e => {
        const dc = e.channel
        peers.set(peerId, { pc, dc })
        setupPeerConnection(pc, dc, peerId)
      }

      await pc.setRemoteDescription(msg.offer)
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)

      // Wait for ICE gathering
      await new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') resolve()
        else pc.onicecandidate = e => { if (!e.candidate) resolve() }
      })

      // Send answer back via tracker
      ws.send(JSON.stringify({
        action: 'announce',
        info_hash: infoHash,
        peer_id: myId,
        to_peer_id: peerId,
        answer: { type: 'answer', sdp: pc.localDescription.sdp },
        offer_id: msg.offer_id
      }))
    }

    async function handleAnswer(msg) {
      const pending = pendingOffers.get(msg.offer_id)
      if (!pending) return

      const { pc, dc } = pending
      await pc.setRemoteDescription(msg.answer)
      peers.set(msg.offer_id, { pc, dc })
    }

    function broadcast(text) {
      const msg = JSON.stringify({ from: myId, text, ts: Date.now() })
      for (const dc of dataChannels.values()) {
        if (dc.readyState === 'open') dc.send(msg)
      }
      addMessage(text, myId, true)
    }

    // UI
    $('join').onclick = () => joinRoom($('room').value.trim() || 'konomi-global')
    $('room').onkeydown = e => { if (e.key === 'Enter') $('join').click() }
    $('send').onclick = () => {
      const text = $('input').value.trim()
      if (text) { broadcast(text); $('input').value = '' }
    }
    $('input').onkeydown = e => { if (e.key === 'Enter') $('send').click() }

    // Auto-join
    const room = location.hash.slice(1) || 'konomi-global'
    $('room').value = room
    joinRoom(room)
  </script>
</body>
</html>
