<!DOCTYPE html>
<!--
@file test/p2p-qr.html
@desc P2P via QR codes - scan to connect
@size ~200 tokens
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P2P QR Connect</title>
  <style>
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:system-ui,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column }
    .container { max-width:500px;margin:0 auto;padding:20px;width:100% }
    h1 { font-size:1.5rem;margin-bottom:8px;text-align:center }
    .sub { color:#666;text-align:center;margin-bottom:24px;font-size:14px }
    .step { background:#12122a;border-radius:12px;padding:20px;margin-bottom:16px }
    .step h2 { font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px }
    .step-num { background:#4facfe;color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px }
    .btn { padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;width:100% }
    .btn.primary { background:#4facfe;color:#000 }
    .btn:disabled { opacity:0.5;cursor:not-allowed }
    .qr-container { display:flex;justify-content:center;margin:16px 0 }
    #qrcode { background:#fff;padding:16px;border-radius:8px }
    #qrcode canvas { display:block }
    .scanner { width:100%;aspect-ratio:1;background:#000;border-radius:8px;overflow:hidden;position:relative }
    .scanner video { width:100%;height:100%;object-fit:cover }
    .scanner-overlay { position:absolute;inset:0;display:flex;align-items:center;justify-content:center }
    .scanner-frame { width:70%;height:70%;border:3px solid #4facfe;border-radius:12px }
    .status { padding:12px;border-radius:8px;text-align:center;margin-top:16px;font-size:13px }
    .status.waiting { background:#f9022a;color:#fff }
    .status.success { background:#00ff8833;color:#00ff88 }
    .hidden { display:none }
    .chat { flex:1;display:flex;flex-direction:column;max-width:500px;margin:0 auto;width:100% }
    .messages { flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:200px }
    .msg { max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px }
    .msg.mine { background:#4facfe;color:#000;align-self:flex-end }
    .msg.theirs { background:#222;align-self:flex-start }
    .msg.system { background:transparent;color:#666;font-size:12px;align-self:center }
    .input-area { padding:16px;display:flex;gap:12px }
    input[type=text] { flex:1;padding:12px 16px;border:none;border-radius:24px;background:#222;color:#fff;font-size:14px;outline:none }
    .input-area button { padding:12px 24px;border:none;border-radius:24px;background:#4facfe;color:#000;font-weight:600;cursor:pointer }
    .tabs { display:flex;gap:8px;margin-bottom:16px }
    .tab { flex:1;padding:12px;border:none;border-radius:8px;background:#1a1a2e;color:#888;cursor:pointer;font-size:14px }
    .tab.active { background:#4facfe;color:#000 }
  </style>
</head>
<body>
  <!-- Setup Phase -->
  <div class="container" id="setup">
    <h1>QR P2P Connect</h1>
    <p class="sub">Scan QR codes to connect. No typing needed!</p>

    <div class="tabs">
      <button class="tab active" id="tabShow">Show QR</button>
      <button class="tab" id="tabScan">Scan QR</button>
    </div>

    <div class="step" id="showMode">
      <h2><span class="step-num">1</span> Show This QR Code</h2>
      <p style="color:#888;font-size:13px;margin-bottom:12px">Let your friend scan this with their camera:</p>
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
      <div class="status waiting" id="showStatus">Waiting for scan...</div>
    </div>

    <div class="step hidden" id="scanMode">
      <h2><span class="step-num">1</span> Scan Their QR Code</h2>
      <div class="scanner">
        <video id="video" autoplay playsinline></video>
        <div class="scanner-overlay">
          <div class="scanner-frame"></div>
        </div>
      </div>
      <div class="status" id="scanStatus">Point camera at QR code</div>
    </div>

    <div class="step hidden" id="step2">
      <h2><span class="step-num">2</span> Show Response QR</h2>
      <p style="color:#888;font-size:13px;margin-bottom:12px">Now let them scan this:</p>
      <div class="qr-container">
        <div id="qrcode2"></div>
      </div>
    </div>
  </div>

  <!-- Chat Phase -->
  <div class="chat hidden" id="chatUI">
    <div style="padding:16px;background:#12122a;text-align:center;border-bottom:1px solid #333">
      <span style="color:#00ff88">●</span> Connected via QR!
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id)
    const CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }

    let pc = null
    let dc = null
    let isCreator = true
    let scannerStream = null

    function compress(str) {
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
    }

    function decompress(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/')
      while (str.length % 4) str += '='
      return atob(str)
    }

    function generateQR(container, data) {
      const qr = qrcode(0, 'L')
      qr.addData(data)
      qr.make()
      container.innerHTML = qr.createImgTag(4)
    }

    function showChat() {
      $('setup').classList.add('hidden')
      $('chatUI').classList.remove('hidden')
      stopScanner()
      addMsg('Connected! Start chatting.', true)
    }

    function addMsg(text, isSystem = false, isMine = false) {
      const div = document.createElement('div')
      div.className = 'msg ' + (isSystem ? 'system' : isMine ? 'mine' : 'theirs')
      div.textContent = text
      $('messages').appendChild(div)
      $('messages').scrollTop = $('messages').scrollHeight
    }

    function setupDataChannel(channel) {
      dc = channel
      dc.onopen = () => showChat()
      dc.onmessage = (e) => addMsg(e.data)
      dc.onclose = () => addMsg('Disconnected', true)
    }

    // Tab switching
    $('tabShow').onclick = () => {
      $('tabShow').classList.add('active')
      $('tabScan').classList.remove('active')
      $('showMode').classList.remove('hidden')
      $('scanMode').classList.add('hidden')
      stopScanner()
      if (!pc) createOffer()
    }

    $('tabScan').onclick = () => {
      $('tabScan').classList.add('active')
      $('tabShow').classList.remove('active')
      $('scanMode').classList.remove('hidden')
      $('showMode').classList.add('hidden')
      isCreator = false
      startScanner()
    }

    // Create offer and show QR
    async function createOffer() {
      pc = new RTCPeerConnection(CONFIG)
      const channel = pc.createDataChannel('chat')
      setupDataChannel(channel)

      pc.onicecandidate = (e) => {
        if (e.candidate === null) {
          const sdp = compress(JSON.stringify(pc.localDescription))
          generateQR($('qrcode'), 'O:' + sdp)
        }
      }

      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
    }

    // Handle scanned offer
    async function handleOffer(sdpData) {
      $('scanStatus').textContent = 'Got offer, generating response...'
      $('scanStatus').className = 'status success'

      pc = new RTCPeerConnection(CONFIG)
      pc.ondatachannel = (e) => setupDataChannel(e.channel)

      pc.onicecandidate = (e) => {
        if (e.candidate === null) {
          const sdp = compress(JSON.stringify(pc.localDescription))
          generateQR($('qrcode2'), 'A:' + sdp)
          $('step2').classList.remove('hidden')
          stopScanner()
        }
      }

      const offer = JSON.parse(decompress(sdpData))
      await pc.setRemoteDescription(offer)
      const answer = await pc.createAnswer()
      await pc.setLocalDescription(answer)
    }

    // Handle scanned answer
    async function handleAnswer(sdpData) {
      $('showStatus').textContent = 'Got response, connecting...'
      $('showStatus').className = 'status success'

      const answer = JSON.parse(decompress(sdpData))
      await pc.setRemoteDescription(answer)
    }

    // QR Scanner using camera
    async function startScanner() {
      try {
        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        })
        $('video').srcObject = scannerStream

        // Use BarcodeDetector API if available
        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({ formats: ['qr_code'] })
          scanLoop(detector)
        } else {
          $('scanStatus').textContent = 'QR scanning not supported. Use link mode.'
          $('scanStatus').className = 'status waiting'
        }
      } catch (err) {
        $('scanStatus').textContent = 'Camera access denied'
        $('scanStatus').className = 'status waiting'
      }
    }

    async function scanLoop(detector) {
      if (!scannerStream) return

      try {
        const video = $('video')
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const codes = await detector.detect(video)
          for (const code of codes) {
            const data = code.rawValue
            if (data.startsWith('O:')) {
              await handleOffer(data.slice(2))
              return
            } else if (data.startsWith('A:')) {
              await handleAnswer(data.slice(2))
              return
            }
          }
        }
      } catch (err) {}

      requestAnimationFrame(() => scanLoop(detector))
    }

    function stopScanner() {
      if (scannerStream) {
        scannerStream.getTracks().forEach(t => t.stop())
        scannerStream = null
      }
    }

    // Chat
    $('sendBtn').onclick = () => {
      const text = $('msgInput').value.trim()
      if (text && dc?.readyState === 'open') {
        dc.send(text)
        addMsg(text, false, true)
        $('msgInput').value = ''
      }
    }
    $('msgInput').onkeydown = (e) => { if (e.key === 'Enter') $('sendBtn').click() }

    // Auto-start with show mode
    createOffer()
  </script>
</body>
</html>
