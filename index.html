<!DOCTYPE html>
<!--
@file index.html
@desc Root landing - auto-redirects to demos
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Konomi P2P</title>
  <meta http-equiv="refresh" content="2;url=./src/demo/index.html">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050510;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logo {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .redirect-msg {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .link {
      padding: 12px 24px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .link:hover {
      border-color: #4facfe;
      transform: translateY(-2px);
    }
    .link.primary {
      background: #4facfe;
      color: #000;
      border-color: #4facfe;
    }

    .skip {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
    .skip a {
      color: #4facfe;
      text-decoration: none;
    }
    .skip a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="logo">🌐</div>
  <h1>Konomi P2P</h1>
  <p class="subtitle">Peer-to-peer for GitHub Pages</p>

  <div class="spinner"></div>
  <p class="redirect-msg">Redirecting to demos...</p>

  <div class="links">
    <a href="./src/demo/index.html" class="link primary">
      🎮 View Demos
    </a>
    <a href="./src/demo/os-mesh-global-v3.html" class="link">
      🌍 Global Mesh
    </a>
    <a href="./src/demo/llm-agent-demo-v4.html" class="link">
      🤖 AI Agent
    </a>
  </div>

  <p class="skip">
    <a href="#" onclick="stopRedirect()">Cancel auto-redirect</a> |
    <a href="./sandbox/index.html">Sandbox</a> |
    <a href="./test/index.html">Tests</a>
  </p>

  <script>
    let redirectTimeout = setTimeout(() => {
      window.location.href = './src/demo/index.html';
    }, 2000);

    function stopRedirect() {
      clearTimeout(redirectTimeout);
      document.querySelector('.redirect-msg').textContent = 'Auto-redirect cancelled';
      document.querySelector('.spinner').style.display = 'none';
    }

    // Check if demos exist
    fetch('./src/demo/index.html', { method: 'HEAD' })
      .then(res => {
        if (!res.ok) stopRedirect();
      })
      .catch(() => stopRedirect());
  </script>
</body>
</html>
